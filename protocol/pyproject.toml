[project]
name = "ecosystem-protocol"
version = "0.2.0"
description = "The Minimal Ecosystem Protocol surface every service in this ecosystem publishes"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Ships the py.typed marker, so a consumer running `mypy --strict` sees this
# package's types instead of treating every import from it as Any. A shared
# package that types nothing weakens the strictness of everything that uses it.
[tool.setuptools.package-data]
ecosystem_protocol = ["py.typed"]

# ── Engineering standards, ECOSYSTEM_RUNBOOK.md §14.1 ─────────────────────────
# Identical to the other packages on purpose. A shared package held to a weaker
# standard than its consumers is the weakest link in every one of them.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "N", "ARG", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ecosystem_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
