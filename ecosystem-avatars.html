<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarvis Ecosystem — avatars</title>
<style>
  :root { --bg:#06080d; --ink:#cdd6e3; --muted:#5d6b7e; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  header { padding: 22px 16px 0; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .lede { color: var(--muted); font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .tabs button {
    font: inherit; font-weight:600; letter-spacing:.08em; color: var(--muted);
    background:#0d111a; border:1px solid #1a2130; border-radius:999px;
    padding:10px 22px 9px; cursor:pointer; display:flex; align-items:baseline; gap:8px;
    transition: color .2s, border-color .2s, box-shadow .2s, background .2s, transform .1s;
  }
  .tabs .verb { font-weight:400; font-size:11px; letter-spacing:.04em; opacity:.7; text-transform:lowercase; }
  .tabs button:hover { color: var(--ink); border-color:#2a3444; }
  .tabs button:active { transform: translateY(1px); }
  .tabs button[aria-selected="true"] {
    color: var(--c); border-color: color-mix(in srgb, var(--c) 55%, transparent);
    background: color-mix(in srgb, var(--c) 9%, #0d111a);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 20%, transparent),
                0 0 22px -6px var(--c);
  }
  .tabs button:focus-visible { outline:2px solid var(--c); outline-offset:2px; }
  .screen { flex:1; min-height:560px; position:relative; margin-top:8px; }
  iframe {
    position:absolute; inset:0; width:100%; height:100%;
    border:0; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  iframe[data-active="true"] { opacity:1; pointer-events:auto; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<header>
  <div class="lede">SIRVIS knows · RAVIS chooses · CLARVIS acts · NERVIS connects</div>
  <div class="tabs" role="tablist" aria-label="Application">
    <button data-app="clarvis" style="--c:#34e6f2">CLARVIS<span class="verb">acts</span></button>
    <button data-app="sirvis" style="--c:#3ddc97">SIRVIS<span class="verb">knows</span></button>
    <button data-app="ravis" style="--c:#ff6ec7">RAVIS<span class="verb">chooses</span></button>
    <button data-app="nervis" style="--c:#7d6cff">NERVIS<span class="verb">connects</span></button>
  </div>
</header>

<div class="screen">
    <iframe id="f-clarvis" title="CLARVIS avatar"></iframe>
    <iframe id="f-sirvis" title="SIRVIS avatar"></iframe>
    <iframe id="f-ravis" title="RAVIS avatar"></iframe>
    <iframe id="f-nervis" title="NERVIS avatar"></iframe>
</div>

<script>
// Full source of each avatar page, injected via srcdoc so every one runs in its own
// document — four stylesheets, four id spaces and four scripts that cannot collide,
// with no copy of any app's code living here. Loaded on first activation only.
const SRC = {"clarvis": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Clarvis — Desktop Butler<\/title>\n<style>\n  :root {\n    --bg: var(--vscode-editor-background, #0b0e13);\n    --panel: var(--vscode-sideBar-background, #12161f);\n    --cyan: var(--vscode-charts-blue, #34e6f2);\n    --cyan-dim: var(--vscode-charts-blue, #1b8a92);\n    --amber: var(--vscode-charts-orange, #ffb648);\n    --ink: var(--vscode-foreground, #cdd6e3);\n    --muted: var(--vscode-descriptionForeground, #67788c);\n  }\n  * { box-sizing: border-box; }\n  html, body { height: 100%; margin: 0; }\n  body {\n    background: radial-gradient(ellipse 80% 60% at 50% 30%, #151b26 0%, var(--bg) 70%);\n    color: var(--ink);\n    font: 14px/1.5 -apple-system, BlinkMacSystemFont, \"Segoe UI\", Inter, system-ui, sans-serif;\n    display: flex; flex-direction: column; align-items: center; justify-content: center;\n    gap: 28px; padding: 32px;\n    -webkit-font-smoothing: antialiased;\n  }\n\n  .stage {\n    width: 320px; height: 320px;\n    display: grid; place-items: center;\n    position: relative;\n  }\n  /* floor shadow, breathes with the bob */\n  .shadow {\n    position: absolute; bottom: 26px; left: 50%;\n    width: 130px; height: 18px; margin-left: -65px;\n    background: radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 70%);\n    animation: shadowPulse 4s ease-in-out infinite;\n  }\n  @keyframes shadowPulse {\n    0%, 100% { transform: scale(1);    opacity: .55; }\n    50%      { transform: scale(.86);  opacity: .35; }\n  }\n\n  svg.butler { width: 300px; height: 300px; overflow: visible; display: block; }\n  /* idle float — applied to a wrapper group so expression transforms stay independent */\n  #float { animation: bob 4s ease-in-out infinite; transform-origin: 100px 100px; }\n  @keyframes bob {\n    0%, 100% { transform: translateY(0)      rotate(-1.1deg); }\n    50%      { transform: translateY(-11px)  rotate(1.1deg); }\n  }\n\n  /* ——— eyes ——— */\n  /* Lids are rects sliding down over the eye; blink = quick full close. */\n  .lid { fill: #1b222e; }\n  #lidL, #lidR { animation: blink 6.2s infinite; }\n  #lidR { animation-delay: .04s; }\n  @keyframes blink {\n    0%, 92%, 100% { transform: translateY(0); }\n    94.5%         { transform: translateY(15px); }\n    97%           { transform: translateY(0); }\n  }\n  .pupils { transition: transform .32s cubic-bezier(.4,.9,.3,1); }\n  /* scale each iris in place, not about the two-eye bounding box */\n  .iris { transform-box: fill-box; transform-origin: center; transition: transform .18s; }\n\n  /* ——— brows ——— */\n  .brow {\n    stroke: var(--cyan); stroke-width: 5; stroke-linecap: round; fill: none;\n    filter: drop-shadow(0 0 4px rgba(52,230,242,.55));\n    transition: transform .3s cubic-bezier(.34,1.4,.5,1);\n  }\n  #browL { transform-origin: 74px 60px; }\n  #browR { transform-origin: 126px 60px; }\n  /* neutral: sporadic single-brow raise, because it is always a little unimpressed */\n  .state-neutral #browR { animation: browTwitch 7s ease-in-out infinite; }\n  @keyframes browTwitch {\n    0%, 70%, 100% { transform: none; }\n    76%           { transform: translateY(-8px) rotate(-9deg); }\n    88%           { transform: translateY(-8px) rotate(-9deg); }\n  }\n\n  /* ——— mouth ——— */\n  .mouth { stroke: var(--cyan); stroke-width: 4.5; stroke-linecap: round; fill: none;\n           filter: drop-shadow(0 0 5px rgba(52,230,242,.5)); }\n  .wave { display: none; }\n  .state-talking .mouth { display: none; }\n  .state-talking .wave  { display: block; }\n  .wave rect { fill: var(--cyan); rx: 2;\n               filter: drop-shadow(0 0 6px rgba(52,230,242,.7));\n               animation: talk .48s ease-in-out infinite; transform-origin: center 116px; }\n  .wave rect:nth-child(1) { animation-delay: -.34s; }\n  .wave rect:nth-child(2) { animation-delay: -.17s; }\n  .wave rect:nth-child(3) { animation-delay: -.42s; }\n  .wave rect:nth-child(4) { animation-delay: -.08s; }\n  .wave rect:nth-child(5) { animation-delay: -.25s; }\n  @keyframes talk {\n    0%, 100% { transform: scaleY(.25); }\n    50%      { transform: scaleY(1); }\n  }\n\n  /* ——— glow / accents ——— */\n  #rim { transition: stroke .4s, filter .4s; }\n  .state-impressed #rim { animation: glowPulse 1.1s ease-out 2; }\n  @keyframes glowPulse {\n    0%, 100% { filter: drop-shadow(0 0 3px rgba(52,230,242,.4));  stroke-opacity: .7; }\n    35%      { filter: drop-shadow(0 0 22px rgba(52,230,242,1));  stroke-opacity: 1; }\n  }\n  .monocle-chain { stroke: var(--cyan-dim); stroke-width: 1.6; fill: none; opacity: .8; }\n\n  /* ——— thinking ——— */\n  /* eyes glance side to side; dots trail off like it is drafting an insult */\n  .state-thinking .pupils { animation: glance 2.6s ease-in-out infinite; }\n  @keyframes glance {\n    0%, 12%   { transform: translate(0,0); }\n    30%, 46%  { transform: translate(-8px,-3px); }\n    64%, 80%  { transform: translate(8px,-3px); }\n    96%, 100% { transform: translate(0,0); }\n  }\n  #dots { opacity: 0; transition: opacity .3s; }\n  .state-thinking #dots { opacity: 1; }\n  #dots circle { fill: var(--cyan); animation: dot 1.4s ease-in-out infinite; }\n  #dots circle:nth-child(2) { animation-delay: .18s; }\n  #dots circle:nth-child(3) { animation-delay: .36s; }\n  @keyframes dot {\n    0%, 100% { opacity: .2; transform: translateY(0); }\n    50%      { opacity: 1;  transform: translateY(-4px); }\n  }\n\n  /* ——— surprised ——— */\n  /* For when the user does something genuinely unwise. Everything opens at once:\n     lids all the way up, pupils constrict to pinpricks, jaw drops, monocle quits. */\n  .state-surprised .lid { animation: none; }          /* no blinking through a crisis */\n  .state-surprised .iris { animation: quiver .16s ease-in-out infinite; }\n  @keyframes quiver {\n    0%, 100% { transform: scale(.6) translate(0, 0); }\n    50%      { transform: scale(.6) translate(.9px, -.9px); }\n  }\n\n  /* dropped jaw replaces the mouth stroke */\n  #jaw { display: none; transform-origin: 100px 114px; }\n  .state-surprised .mouth { display: none; }\n  .state-surprised .wave  { display: none; }\n  .state-surprised #jaw   { display: block; animation: gasp 1.6s ease-in-out infinite; }\n  @keyframes gasp {\n    0%, 100% { transform: scaleY(1)    scaleX(1); }\n    50%      { transform: scaleY(1.18) scaleX(.94); }\n  }\n\n  /* recoil: jolts up and back, then hovers unsteadily — replaces the idle bob */\n  .state-surprised #float { animation: jolt 2.4s cubic-bezier(.2,.9,.3,1) infinite; }\n  @keyframes jolt {\n    0%   { transform: translateY(0)     rotate(0);      }\n    7%   { transform: translateY(-19px) rotate(-4.5deg) scale(1.035); }\n    16%  { transform: translateY(-9px)  rotate(3.5deg); }\n    26%  { transform: translateY(-14px) rotate(-2deg);  }\n    40%  { transform: translateY(-8px)  rotate(1.4deg); }\n    70%  { transform: translateY(-12px) rotate(-1deg);  }\n    100% { transform: translateY(0)     rotate(0);      }\n  }\n\n  /* the monocle gives up entirely */\n  #monocle { transform-origin: 126px 83px; }\n  .state-surprised #monocle { animation: monocleDrop .85s cubic-bezier(.5,.05,.75,1) forwards; }\n  @keyframes monocleDrop {\n    0%   { transform: translate(0,0)      rotate(0);    opacity: 1; }\n    22%  { transform: translate(3px,-4px) rotate(9deg); opacity: 1; }\n    100% { transform: translate(11px,74px) rotate(58deg); opacity: 0; }\n  }\n\n  /* shock lines bursting off the shell */\n  #shock { opacity: 0; stroke: var(--amber); stroke-width: 4; stroke-linecap: round;\n           transform-origin: 100px 88px;\n           filter: drop-shadow(0 0 6px rgba(255,182,72,.8)); }\n  .state-surprised #shock { animation: burst .9s ease-out infinite; }\n  @keyframes burst {\n    0%   { opacity: 0; transform: scale(.55); }\n    18%  { opacity: 1; transform: scale(1);   }\n    100% { opacity: 0; transform: scale(1.3); }\n  }\n\n  /* antenna bulb goes to amber alarm; rim flares with it */\n  .state-surprised #bulb {\n    fill: var(--amber); animation: alarm .42s steps(1) infinite;\n  }\n  @keyframes alarm {\n    0%, 49%   { filter: drop-shadow(0 0 14px rgba(255,182,72,1)); opacity: 1; }\n    50%, 100% { filter: drop-shadow(0 0 4px rgba(255,182,72,.5)); opacity: .55; }\n  }\n  .state-surprised #rim { stroke: var(--amber); animation: alarmRim .42s ease-in-out infinite alternate; }\n  @keyframes alarmRim {\n    from { filter: drop-shadow(0 0 3px  rgba(255,182,72,.4)); stroke-opacity: .55; }\n    to   { filter: drop-shadow(0 0 18px rgba(255,182,72,.9)); stroke-opacity: 1; }\n  }\n\n  /* one bead of coolant, for form's sake */\n  #sweat { opacity: 0; }\n  .state-surprised #sweat { animation: bead 2.4s ease-in .3s infinite; }\n  @keyframes bead {\n    0%       { opacity: 0; transform: translateY(0); }\n    12%      { opacity: .9; transform: translateY(0); }\n    55%      { opacity: .9; transform: translateY(26px); }\n    70%, 100%{ opacity: 0; transform: translateY(30px); }\n  }\n\n  /* ——— controls ——— */\n  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }\n  button {\n    font: inherit; font-weight: 500; letter-spacing: .01em;\n    color: var(--muted); background: var(--panel);\n    border: 1px solid #202836; border-radius: 999px;\n    padding: 9px 20px; cursor: pointer;\n    transition: color .2s, border-color .2s, box-shadow .2s, transform .1s;\n  }\n  button:hover { color: var(--ink); border-color: #2e3a4d; }\n  button:active { transform: translateY(1px); }\n  button[aria-pressed=\"true\"] {\n    color: var(--cyan); border-color: var(--cyan-dim);\n    box-shadow: 0 0 0 1px rgba(52,230,242,.18), 0 0 18px -4px rgba(52,230,242,.55);\n  }\n  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }\n\n  .quip { color: var(--muted); font-size: 13px; min-height: 1.5em; text-align: center;\n          font-style: italic; max-width: 34ch; transition: opacity .25s; }\n\n\n  /* ——— chrome ———\n     The shared ecosystem frame: reticle, ticking ring, crosshairs, corner brackets.\n     Sits OUTSIDE #float so it never inherits the bob — the butler drifts, the\n     instrument around him holds still. Purely additive: no existing rule changes,\n     and the viewBox is unchanged, so he renders at exactly the size he did before;\n     the chrome only fills margin that was already empty. */\n  #reticle  { fill: none; stroke: var(--cyan); stroke-opacity: .3; stroke-width: 1.2;\n              transition: stroke .4s; }\n  #tickring { fill: none; stroke: var(--cyan); stroke-opacity: .42; stroke-width: 3;\n              stroke-dasharray: 2.4 20.6; transform-origin: 100px 100px;\n              animation: chromeSpin 32s linear infinite; transition: stroke .4s; }\n  .cardinal { stroke: var(--cyan); stroke-opacity: .6; stroke-width: 1.8;\n              stroke-linecap: round; transition: stroke .4s; }\n  .cbracket { fill: none; stroke: var(--cyan); stroke-opacity: .36; stroke-width: 1.6;\n              stroke-linecap: round; transition: stroke .4s; }\n  @keyframes chromeSpin { to { transform: rotate(360deg); } }\n\n  /* The chrome reacts only where he already does — no new vocabulary, and the ring\n     speed reads as effort rather than as a second thing to interpret. */\n  .state-thinking  #tickring { animation-duration: 11s; }\n  .state-talking   #tickring { animation-duration: 22s; }\n  .state-surprised #tickring { animation-duration: 5s; }\n  .state-surprised #reticle, .state-surprised #tickring,\n  .state-surprised .cardinal, .state-surprised .cbracket { stroke: var(--amber); }\n  .state-impressed #reticle { animation: chromeFlare 1.1s ease-out 2; }\n  @keyframes chromeFlare {\n    0%, 100% { stroke-opacity: .3; }\n    35%      { stroke-opacity: .95; filter: drop-shadow(0 0 10px rgba(52,230,242,.8)); }\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    * { animation: none !important; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"stage\">\n  <div class=\"shadow\"><\/div>\n  <svg class=\"butler state-neutral\" id=\"butler\" viewBox=\"0 0 200 200\" role=\"img\"\n       aria-label=\"Clarvis, a small sarcastic robotic butler\">\n    <defs>\n      <linearGradient id=\"shell\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\"   stop-color=\"#2b3546\"/>\n        <stop offset=\".55\" stop-color=\"#1a2130\"/>\n        <stop offset=\"1\"   stop-color=\"#10151f\"/>\n      <\/linearGradient>\n      <linearGradient id=\"gloss\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#ffffff\" stop-opacity=\".16\"/>\n        <stop offset=\"1\" stop-color=\"#ffffff\" stop-opacity=\"0\"/>\n      <\/linearGradient>\n      <linearGradient id=\"tie\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#2ad3e0\"/>\n        <stop offset=\"1\" stop-color=\"#127a83\"/>\n      <\/linearGradient>\n      <clipPath id=\"eyeL\"><rect x=\"60\" y=\"72\" width=\"28\" height=\"22\" rx=\"11\"/><\/clipPath>\n      <clipPath id=\"eyeR\"><rect x=\"112\" y=\"72\" width=\"28\" height=\"22\" rx=\"11\"/><\/clipPath>\n    <\/defs>\n\n    <!-- chrome: static frame + slow ticking ring, behind the butler and outside #float -->\n    <g class=\"chrome\">\n      <circle id=\"reticle\"  cx=\"100\" cy=\"100\" r=\"92\"/>\n      <circle id=\"tickring\" cx=\"100\" cy=\"100\" r=\"88\"/>\n      <g class=\"cardinal\">\n        <path d=\"M100 4 v8\"/><path d=\"M100 188 v8\"/>\n        <path d=\"M4 100 h8\"/><path d=\"M188 100 h8\"/>\n      <\/g>\n      <g class=\"cbracket\">\n        <path d=\"M12 32 V12 H32\"/><path d=\"M168 12 H188 V32\"/>\n        <path d=\"M188 168 V188 H168\"/><path d=\"M32 188 H12 V168\"/>\n      <\/g>\n    <\/g>\n\n    <g id=\"float\">\n      <!-- head shell -->\n      <rect x=\"36\" y=\"36\" width=\"128\" height=\"106\" rx=\"34\" fill=\"url(#shell)\"/>\n      <rect id=\"rim\" x=\"36\" y=\"36\" width=\"128\" height=\"106\" rx=\"34\" fill=\"none\"\n            stroke=\"var(--cyan)\" stroke-opacity=\".7\" stroke-width=\"1.6\"\n            style=\"filter: drop-shadow(0 0 3px rgba(52,230,242,.4))\"/>\n      <rect x=\"44\" y=\"43\" width=\"112\" height=\"46\" rx=\"24\" fill=\"url(#gloss)\"/>\n\n      <!-- antenna -->\n      <path d=\"M100 36 V22\" stroke=\"#39465b\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n      <circle id=\"bulb\" cx=\"100\" cy=\"18\" r=\"5\" fill=\"var(--cyan)\"\n              style=\"filter: drop-shadow(0 0 8px rgba(52,230,242,.9))\"/>\n\n      <!-- eyes: whites, then pupils clipped to socket, then lids -->\n      <rect x=\"60\" y=\"72\" width=\"28\" height=\"22\" rx=\"11\" fill=\"#080b11\"/>\n      <rect x=\"112\" y=\"72\" width=\"28\" height=\"22\" rx=\"11\" fill=\"#080b11\"/>\n\n      <g class=\"pupils\">\n        <g clip-path=\"url(#eyeL)\">\n          <circle class=\"iris\" cx=\"74\" cy=\"84\" r=\"7.5\" fill=\"var(--cyan)\"\n                  style=\"filter: drop-shadow(0 0 7px rgba(52,230,242,.85))\"/>\n          <circle cx=\"76.5\" cy=\"81.5\" r=\"2.4\" fill=\"#eafeff\"/>\n        <\/g>\n        <g clip-path=\"url(#eyeR)\">\n          <circle class=\"iris\" cx=\"126\" cy=\"84\" r=\"7.5\" fill=\"var(--cyan)\"\n                  style=\"filter: drop-shadow(0 0 7px rgba(52,230,242,.85))\"/>\n          <circle cx=\"128.5\" cy=\"81.5\" r=\"2.4\" fill=\"#eafeff\"/>\n        <\/g>\n      <\/g>\n\n      <!-- half-lidded by default: lids parked partway down -->\n      <g clip-path=\"url(#eyeL)\"><rect id=\"lidL\" class=\"lid\" x=\"58\" y=\"65\" width=\"32\" height=\"14\"/><\/g>\n      <g clip-path=\"url(#eyeR)\"><rect id=\"lidR\" class=\"lid\" x=\"110\" y=\"65\" width=\"32\" height=\"14\"/><\/g>\n\n      <!-- monocle over right eye (pops off when startled) -->\n      <g id=\"monocle\">\n        <circle cx=\"126\" cy=\"83\" r=\"21\" fill=\"rgba(52,230,242,.05)\"\n                stroke=\"var(--cyan)\" stroke-opacity=\".55\" stroke-width=\"2\"/>\n        <path class=\"monocle-chain\" d=\"M143 94 q7 14 1 26\"/>\n      <\/g>\n\n      <!-- brows -->\n      <path id=\"browL\" class=\"brow\" d=\"M62 60 q12 -6 24 -1\"/>\n      <path id=\"browR\" class=\"brow\" d=\"M114 59 q12 -5 24 1\"/>\n\n      <!-- mouth: flat, faintly disapproving -->\n      <path id=\"mouth\" class=\"mouth\" d=\"M84 116 q16 5 32 0\"/>\n\n      <!-- talking waveform -->\n      <g class=\"wave\">\n        <rect x=\"80\"  y=\"108\" width=\"5\" height=\"16\"/>\n        <rect x=\"90\"  y=\"108\" width=\"5\" height=\"16\"/>\n        <rect x=\"100\" y=\"108\" width=\"5\" height=\"16\"/>\n        <rect x=\"110\" y=\"108\" width=\"5\" height=\"16\"/>\n        <rect x=\"120\" y=\"108\" width=\"5\" height=\"16\"/>\n      <\/g>\n\n      <!-- dropped jaw (surprised) -->\n      <ellipse id=\"jaw\" cx=\"100\" cy=\"118\" rx=\"11\" ry=\"13\" fill=\"#05080d\"\n               stroke=\"var(--cyan)\" stroke-width=\"3.5\"\n               style=\"filter: drop-shadow(0 0 7px rgba(52,230,242,.6))\"/>\n\n      <!-- shock burst -->\n      <g id=\"shock\" fill=\"none\">\n        <path d=\"M30 52  L18 40\"/>\n        <path d=\"M24 90  L9 90\"/>\n        <path d=\"M34 128 L21 140\"/>\n        <path d=\"M170 52  L182 40\"/>\n        <path d=\"M176 90  L191 90\"/>\n        <path d=\"M166 128 L179 140\"/>\n      <\/g>\n\n      <!-- coolant bead -->\n      <path id=\"sweat\" d=\"M150 48 q6 8 0 12 q-6 -4 0 -12\" fill=\"#8fe9ff\" opacity=\"0\"/>\n\n      <!-- thinking dots -->\n      <g id=\"dots\">\n        <circle cx=\"92\"  cy=\"130\" r=\"2.6\"/>\n        <circle cx=\"100\" cy=\"130\" r=\"2.6\"/>\n        <circle cx=\"108\" cy=\"130\" r=\"2.6\"/>\n      <\/g>\n\n      <!-- bow tie -->\n      <g>\n        <path d=\"M100 152 L78 143 L78 161 Z\" fill=\"url(#tie)\"/>\n        <path d=\"M100 152 L122 143 L122 161 Z\" fill=\"url(#tie)\"/>\n        <circle cx=\"100\" cy=\"152\" r=\"5.5\" fill=\"#0e1620\" stroke=\"var(--cyan)\"\n                stroke-opacity=\".8\" stroke-width=\"1.6\"/>\n      <\/g>\n    <\/g>\n  <\/svg>\n<\/div>\n\n<div class=\"controls\" role=\"group\" aria-label=\"Expression\">\n  <button data-state=\"neutral\"   aria-pressed=\"true\">Neutral<\/button>\n  <button data-state=\"judging\"   aria-pressed=\"false\">Judging<\/button>\n  <button data-state=\"impressed\" aria-pressed=\"false\">Impressed<\/button>\n  <button data-state=\"thinking\"  aria-pressed=\"false\">Thinking<\/button>\n  <button data-state=\"talking\"   aria-pressed=\"false\">Talking<\/button>\n  <button data-state=\"surprised\" aria-pressed=\"false\">Surprised<\/button>\n<\/div>\n\n<p class=\"quip\" id=\"quip\">Ah. You're back. And it compiles this time, I hope.<\/p>\n\n<script>\nconst svg  = document.getElementById('butler');\nconst quip = document.getElementById('quip');\nconst el   = id => document.getElementById(id);\n\n// Per-state geometry. Lid y: 65 = half-lidded, 58 = wide, 72 = squint.\nconst STATES = {\n  neutral:   { lid: 65, browL: '', browR: '',\n               mouth: 'M84 116 q16 5 32 0', pupils: 'none',\n               quip: \"Ah. You're back. And it compiles this time, I hope.\" },\n  judging:   { lid: 70, browL: 'translateY(3px) rotate(7deg)',\n                        browR: 'translateY(-11px) rotate(-13deg)',\n               mouth: 'M84 118 q16 -2 32 -6', pupils: 'translate(4px,-5px)',\n               quip: \"A global variable. Bold. Historic, even.\" },\n  impressed: { lid: 56, browL: 'translateY(-11px) rotate(-4deg)',\n                        browR: 'translateY(-11px) rotate(4deg)',\n               mouth: 'M84 114 q16 12 32 0', pupils: 'none',\n               quip: \"Oh. That's… genuinely elegant. I'll allow it.\" },\n  thinking:  { lid: 68, browL: 'translateY(-4px)', browR: 'translateY(-2px)',\n               mouth: 'M88 117 q12 2 24 -2', pupils: 'none',\n               quip: \"Parsing your intent. This may take a while.\" },\n  talking:   { lid: 62, browL: 'translateY(-3px)', browR: 'translateY(-6px) rotate(-6deg)',\n               mouth: 'M84 116 q16 5 32 0', pupils: 'none',\n               quip: \"As I was saying — that loop runs 400,000 times.\" },\n  // genuine shock: lids clear of the sockets, brows near the ceiling, jaw open\n  surprised: { lid: 50, browL: 'translateY(-15px) rotate(-9deg)',\n                        browR: 'translateY(-17px) rotate(10deg)',\n               mouth: 'M84 116 q16 5 32 0', pupils: 'none',\n               quip: \"You force-pushed to main. On a Friday. I need a moment.\" }\n};\n\nfunction setState(name) {\n  const s = STATES[name];\n  svg.className.baseVal = 'butler state-' + name;\n\n  el('lidL').setAttribute('y', s.lid);\n  el('lidR').setAttribute('y', s.lid);\n  el('browL').style.transform = s.browL;\n  el('browR').style.transform = s.browR;\n  el('mouth').setAttribute('d', s.mouth);\n  // thinking drives pupils via CSS keyframes; don't fight it with an inline transform\n  document.querySelector('.pupils').style.transform =\n    name === 'thinking' ? '' : s.pupils;\n\n  quip.style.opacity = 0;\n  setTimeout(() => { quip.textContent = s.quip; quip.style.opacity = 1; }, 200);\n\n  document.querySelectorAll('.controls button').forEach(b =>\n    b.setAttribute('aria-pressed', String(b.dataset.state === name)));\n}\n\ndocument.querySelectorAll('.controls button')\n  .forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));\n\nsetState('neutral');\n<\/script>\n<\/body>\n<\/html>\n", "sirvis": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>SIRVIS — Benchmark Rig<\/title>\n<style>\n  :root {\n    --bg:     #080a10;\n    --panel:  #10141d;\n    --mint:   #3ddc97;   /* SIRVIS identity: measurement */\n    --mint-d: #1f7a53;\n    --hot:    #ff9d3d;   /* thermal pressure */\n    --dim:    #37424f;   /* unpowered, or discarded */\n    --ink:    #cdd6e3;\n    --muted:  #67788c;\n  }\n  * { box-sizing: border-box; }\n  html, body { height: 100%; margin: 0; }\n  body {\n    background: radial-gradient(ellipse 70% 55% at 50% 38%, #0d1a16 0%, var(--bg) 72%);\n    color: var(--ink);\n    font: 14px/1.5 -apple-system, BlinkMacSystemFont, \"Segoe UI\", Inter, system-ui, sans-serif;\n    display: flex; flex-direction: column; align-items: center; justify-content: center;\n    gap: 28px; padding: 32px;\n    -webkit-font-smoothing: antialiased;\n  }\n  .stage { width: 340px; height: 340px; display: grid; place-items: center; position: relative; }\n  .halo {\n    position: absolute; inset: 0; border-radius: 50%;\n    background: radial-gradient(circle at 50% 48%, rgba(61,220,151,.12) 0%, transparent 62%);\n    animation: haloBreath 4s ease-in-out infinite;\n  }\n  @keyframes haloBreath {\n    0%, 100% { transform: scale(1);    opacity: .9; }\n    50%      { transform: scale(1.06); opacity: .55; }\n  }\n  svg.rig { width: 320px; height: 320px; overflow: visible; display: block; }\n\n  /* ——— shared chrome ——— */\n  .reticle  { fill: none; stroke: var(--mint); stroke-opacity: .32; stroke-width: 1.2; }\n  #tickring { fill: none; stroke: var(--mint); stroke-opacity: .45; stroke-width: 3;\n              stroke-dasharray: 2.4 20.6; transform-origin: 100px 96px;\n              animation: spin 34s linear infinite; }\n  .cardinal { stroke: var(--mint); stroke-opacity: .7; stroke-width: 1.8; stroke-linecap: round; }\n  .bracket  { fill: none; stroke: var(--mint); stroke-opacity: .4; stroke-width: 1.6; stroke-linecap: round; }\n  @keyframes spin { to { transform: rotate(360deg); } }\n\n  /* ——— specimen ——— */\n  /* The die is inert until the runtime powers it. Nothing pretends otherwise. */\n  #die { fill: #0a0e16; stroke: var(--dim); stroke-opacity: .45; stroke-width: 2;\n         transition: stroke .5s, stroke-opacity .5s, filter .5s; }\n  #dieCore { fill: var(--dim); fill-opacity: .45; transition: fill .5s, fill-opacity .5s; }\n  .grid { stroke: var(--dim); stroke-opacity: .22; stroke-width: 1; transition: stroke .5s; }\n  .pin  { stroke: var(--dim); stroke-opacity: .6; stroke-width: 2.4; stroke-linecap: round;\n          transition: stroke .35s, stroke-opacity .35s; }\n\n  /* pins come up in order as the model loads — a progress bar you can read at a glance */\n  .lit .pin { stroke: var(--mint); stroke-opacity: 1; }\n  .powered #die     { stroke: var(--mint); stroke-opacity: 1; }\n  .powered #dieCore { fill: var(--mint); fill-opacity: .85; }\n  .powered .grid    { stroke: var(--mint); }\n\n  /* ——— calipers ——— */\n  .caliper { fill: none; stroke: var(--mint); stroke-opacity: .5; stroke-width: 2.2;\n             stroke-linecap: round; transform-origin: 100px 88px; transition: stroke .5s; }\n\n  /* ——— gauges ——— */\n  /* pathLength=100 turns every arc into a percentage, so a fill is one dasharray away. */\n  #progTrack { fill: none; stroke: var(--mint); stroke-opacity: .18; stroke-width: 3; }\n  #prog {\n    fill: none; stroke: var(--mint); stroke-width: 3; stroke-linecap: round;\n    stroke-dasharray: 0 100; transform-origin: 100px 88px; transform: rotate(-90deg);\n    filter: drop-shadow(0 0 6px rgba(61,220,151,.8));\n    transition: stroke-dasharray .6s ease;\n  }\n  #thermTrack { fill: none; stroke: var(--mint); stroke-opacity: .2; stroke-width: 4; stroke-linecap: round; }\n  #therm {\n    fill: none; stroke: var(--mint); stroke-width: 4; stroke-linecap: round;\n    stroke-dasharray: 0 100; transition: stroke-dasharray .6s ease, stroke .5s;\n    filter: drop-shadow(0 0 7px rgba(61,220,151,.75));\n  }\n  #chev { opacity: 0; transition: opacity .3s; }\n  #chev path { fill: none; stroke: var(--hot); stroke-width: 2; stroke-linecap: round; }\n\n  /* ——— the plot ——— */\n  .axis { fill: none; stroke: var(--mint); stroke-opacity: .26; stroke-width: 1.2; }\n  .warm { fill: none; stroke: var(--dim); stroke-width: 1.6; opacity: 0; transition: opacity .35s; }\n  .s    { fill: var(--mint); opacity: 0; transition: opacity .35s, fill .4s;\n          filter: drop-shadow(0 0 6px rgba(61,220,151,.75)); }\n  #band { fill: var(--mint); fill-opacity: 0; transition: fill-opacity .5s; }\n  #median {\n    stroke: var(--mint); stroke-width: 1.6; stroke-dasharray: 5 4; stroke-opacity: 0;\n    filter: drop-shadow(0 0 5px rgba(61,220,151,.7)); transition: stroke-opacity .5s;\n  }\n  #landing { fill: none; stroke: var(--mint); stroke-width: 1.2; opacity: 0; }\n  #badge { opacity: 0; transition: opacity .4s; }\n  #badge circle { fill: none; stroke: var(--mint); stroke-width: 1.8;\n                  filter: drop-shadow(0 0 8px rgba(61,220,151,.6)); }\n  #badge path   { fill: none; stroke: var(--mint); stroke-width: 2.4;\n                  stroke-linecap: round; stroke-linejoin: round; }\n\n  /* ═══ idle ═══ nothing loaded, nothing claimed */\n  /* A round line-cap paints a dot even at zero length, so hide the gauges outright\n     rather than leaving two pips implying a reading that does not exist. */\n  .state-idle #prog, .state-idle #therm { opacity: 0; }\n\n  /* ═══ loading ═══ pins come up, progress creeps */\n  .state-loading #prog  { animation: creep 3.4s ease-in-out infinite; }\n  @keyframes creep { 0% { stroke-dasharray: 3 100; } 100% { stroke-dasharray: 34 100; } }\n  .state-loading #therm { stroke-dasharray: 10 100; }\n  .state-loading #die   { animation: wake 1.6s ease-in-out infinite; }\n  @keyframes wake {\n    0%, 100% { filter: drop-shadow(0 0 3px rgba(61,220,151,.35)); }\n    50%      { filter: drop-shadow(0 0 12px rgba(61,220,151,.85)); }\n  }\n\n  /* ═══ warmup ═══ two runs happen and are thrown away, visibly */\n  .state-warmup #prog  { stroke-dasharray: 34 100; }\n  .state-warmup #therm { stroke-dasharray: 30 100; }\n  .state-warmup .warm  { opacity: 1; animation: discard 2.2s ease-in-out infinite; }\n  @keyframes discard { 0%, 100% { opacity: .8; } 50% { opacity: .25; } }\n  .state-warmup #die   { filter: drop-shadow(0 0 10px rgba(61,220,151,.7)); }\n\n  /* ═══ measuring ═══ samples land one at a time */\n  .state-measuring #prog  { animation: creep2 4s linear infinite; }\n  @keyframes creep2 { 0% { stroke-dasharray: 40 100; } 100% { stroke-dasharray: 78 100; } }\n  .state-measuring #therm { stroke-dasharray: 55 100; }\n  .state-measuring #tickring { animation-duration: 16s; }\n  .state-measuring .warm { opacity: 1; }\n  .state-measuring .s1, .state-measuring .s2, .state-measuring .s3 { opacity: 1; }\n  .state-measuring .s4, .state-measuring #landing { animation: land 1.8s ease-out infinite; }\n  @keyframes land {\n    0%   { opacity: 0; transform: translateY(-9px); }\n    35%  { opacity: 1; transform: translateY(0); }\n    100% { opacity: 1; transform: translateY(0); }\n  }\n  .state-measuring .s4 { transform-box: fill-box; transform-origin: center; }\n  .state-measuring #die { filter: drop-shadow(0 0 14px rgba(61,220,151,.9)); }\n\n  /* ═══ thermal ═══ the run is compromised and says so, rather than hiding it */\n  .state-thermal { --mint: #ff9d3d; }        /* chrome retints; the reading is the warning */\n  .state-thermal #die     { stroke: var(--hot); animation: flicker .5s steps(1) infinite; }\n  .state-thermal #dieCore { fill: var(--hot); fill-opacity: .9; }\n  .state-thermal .grid    { stroke: var(--hot); }\n  .state-thermal .pin     { stroke: var(--hot); stroke-opacity: 1; }\n  @keyframes flicker {\n    0%, 70%   { filter: drop-shadow(0 0 16px rgba(255,157,61,.95)); }\n    71%, 100% { filter: drop-shadow(0 0 6px rgba(255,157,61,.5)); }\n  }\n  .state-thermal #therm { stroke: var(--hot); stroke-dasharray: 94 100;\n                          animation: thermPush .9s ease-in-out infinite alternate; }\n  @keyframes thermPush { from { stroke-dasharray: 88 100; } to { stroke-dasharray: 97 100; } }\n  .state-thermal #prog  { stroke-dasharray: 52 100; }\n  .state-thermal .warm  { opacity: 1; }\n  .state-thermal .s1, .state-thermal .s2, .state-thermal .s3, .state-thermal .s4 { opacity: 1; }\n  .state-thermal .s3, .state-thermal .s4 { fill: var(--hot);\n                                           filter: drop-shadow(0 0 7px rgba(255,157,61,.9)); }\n  .state-thermal #chev { opacity: 1; }\n  .state-thermal #chev path { animation: chev 1.5s ease-out infinite; }\n  .state-thermal #chev path:nth-child(2) { animation-delay: .18s; }\n  .state-thermal #chev path:nth-child(3) { animation-delay: .36s; }\n  @keyframes chev { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: 0; } }\n\n  /* ═══ verdict ═══ five samples, a median, a spread — never one number */\n  .state-verdict #prog  { stroke-dasharray: 100 100; }\n  .state-verdict #therm { stroke-dasharray: 38 100; }\n  .state-verdict .warm  { opacity: 1; }\n  .state-verdict .s     { opacity: 1; }\n  .state-verdict #band  { fill-opacity: .14; }\n  .state-verdict #median { stroke-opacity: .95; }\n  .state-verdict #badge  { opacity: 1; animation: stamp .5s cubic-bezier(.34,1.56,.64,1); }\n  @keyframes stamp {\n    0%   { opacity: 0; transform: scale(.5); }\n    100% { opacity: 1; transform: scale(1); }\n  }\n  #badge { transform-box: fill-box; transform-origin: center; }\n\n  /* ——— controls ——— */\n  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }\n  button {\n    font: inherit; font-weight: 500; color: var(--muted); background: var(--panel);\n    border: 1px solid #1c2331; border-radius: 999px; padding: 9px 20px; cursor: pointer;\n    transition: color .2s, border-color .2s, box-shadow .2s, transform .1s;\n  }\n  button:hover { color: var(--ink); border-color: #2b3547; }\n  button:active { transform: translateY(1px); }\n  button[aria-pressed=\"true\"] {\n    color: var(--mint); border-color: var(--mint-d);\n    box-shadow: 0 0 0 1px rgba(61,220,151,.2), 0 0 18px -4px rgba(61,220,151,.6);\n  }\n  button:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }\n  .status {\n    color: var(--muted); font-size: 12.5px; min-height: 1.5em; text-align: center;\n    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n    max-width: 48ch; transition: opacity .25s;\n  }\n  .status b { color: var(--ink); font-weight: 500; }\n\n\n  /* ——— idle drift ———\n     Same 4s bob as Clarvis, and applied the same way: the chrome is a fixed frame,\n     so only what it frames moves. Children keep their own transform-origins, so the\n     spins and gauge fills compose on top of this untouched. */\n  #float { animation: bob 4s ease-in-out infinite; transform-origin: 100px 96px; }\n  @keyframes bob {\n    0%, 100% { transform: translateY(0)     rotate(-1.1deg); }\n    50%      { transform: translateY(-11px) rotate(1.1deg); }\n  }\n\n  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"stage\">\n  <div class=\"halo\"><\/div>\n  <svg class=\"rig state-idle\" id=\"sirvis\" viewBox=\"0 0 200 200\" role=\"img\"\n       aria-label=\"SIRVIS, a benchmark rig measuring a model under test\">\n\n    <!-- chrome -->\n    <circle class=\"reticle\" cx=\"100\" cy=\"96\" r=\"92\"/>\n    <circle id=\"tickring\"   cx=\"100\" cy=\"96\" r=\"88\"/>\n    <g class=\"cardinal\"><path d=\"M100 2 v9\"/><path d=\"M2 96 h9\"/><path d=\"M189 96 h9\"/><\/g>\n    <g class=\"bracket\">\n      <path d=\"M14 34 V14 H34\"/><path d=\"M166 14 H186 V34\"/>\n      <path d=\"M186 172 V186 H172\"/><path d=\"M28 186 H14 V172\"/>\n    <\/g>\n\n    <g id=\"float\">\n    <!-- benchmark progress -->\n    <circle id=\"progTrack\" cx=\"100\" cy=\"88\" r=\"50\"/>\n    <circle id=\"prog\" cx=\"100\" cy=\"88\" r=\"50\" pathLength=\"100\"/>\n\n    <!-- calipers closing on the specimen -->\n    <g class=\"caliper\">\n      <path d=\"M45.3 58.9 A62 62 0 0 1 70.9 33.3\"/>\n      <path d=\"M129.1 33.3 A62 62 0 0 1 154.7 58.9\"/>\n      <path d=\"M70.9 142.7 A62 62 0 0 1 45.3 117.1\"/>\n      <path d=\"M154.7 117.1 A62 62 0 0 1 129.1 142.7\"/>\n    <\/g>\n\n    <!-- thermal gauge, right flank -->\n    <path id=\"thermTrack\" d=\"M146.8 28.1 A76 76 0 0 1 146.8 147.9\"/>\n    <path id=\"therm\"      d=\"M146.8 28.1 A76 76 0 0 1 146.8 147.9\" pathLength=\"100\"/>\n    <g id=\"chev\">\n      <path d=\"M181.5 67.7 A84 84 0 0 1 181.5 108.3\"/>\n      <path d=\"M187.3 66.2 A90 90 0 0 1 187.3 109.8\"/>\n      <path d=\"M193.2 64.8 A96 96 0 0 1 193.2 111.2\"/>\n    <\/g>\n\n    <!-- contact pins, in power-up order -->\n    <g class=\"pins\">\n      <g class=\"pinset p1\"><path class=\"pin\" d=\"M84 64 V56\"/><path class=\"pin\" d=\"M84 112 V120\"/>\n                          <path class=\"pin\" d=\"M76 72 H68\"/><path class=\"pin\" d=\"M124 72 H132\"/><\/g>\n      <g class=\"pinset p2\"><path class=\"pin\" d=\"M92 64 V56\"/><path class=\"pin\" d=\"M92 112 V120\"/>\n                          <path class=\"pin\" d=\"M76 80 H68\"/><path class=\"pin\" d=\"M124 80 H132\"/><\/g>\n      <g class=\"pinset p3\"><path class=\"pin\" d=\"M100 64 V56\"/><path class=\"pin\" d=\"M100 112 V120\"/>\n                          <path class=\"pin\" d=\"M76 88 H68\"/><path class=\"pin\" d=\"M124 88 H132\"/><\/g>\n      <g class=\"pinset p4\"><path class=\"pin\" d=\"M108 64 V56\"/><path class=\"pin\" d=\"M108 112 V120\"/>\n                          <path class=\"pin\" d=\"M76 96 H68\"/><path class=\"pin\" d=\"M124 96 H132\"/><\/g>\n      <g class=\"pinset p5\"><path class=\"pin\" d=\"M116 64 V56\"/><path class=\"pin\" d=\"M116 112 V120\"/>\n                          <path class=\"pin\" d=\"M76 104 H68\"/><path class=\"pin\" d=\"M124 104 H132\"/><\/g>\n    <\/g>\n\n    <!-- the die under test -->\n    <rect id=\"die\" x=\"76\" y=\"64\" width=\"48\" height=\"48\" rx=\"7\"/>\n    <path class=\"grid\" d=\"M92 68 V108\"/><path class=\"grid\" d=\"M108 68 V108\"/>\n    <path class=\"grid\" d=\"M80 80 H120\"/><path class=\"grid\" d=\"M80 96 H120\"/>\n    <rect id=\"dieCore\" x=\"94\" y=\"82\" width=\"12\" height=\"12\" rx=\"2\"/>\n\n    <!-- repeated measurements -->\n    <path class=\"axis\" d=\"M46 130 V164 H154\"/>\n    <rect id=\"band\" x=\"50\" y=\"134\" width=\"102\" height=\"24\"/>\n    <path id=\"median\" d=\"M50 146 H152\"/>\n    <circle class=\"warm\" cx=\"58\" cy=\"157\" r=\"3.2\"/>\n    <circle class=\"warm\" cx=\"81\" cy=\"141\" r=\"3.2\"/>\n    <circle id=\"landing\" cx=\"127\" cy=\"136\" r=\"8\"/>\n    <circle class=\"s s1\" cx=\"58\"  cy=\"156\" r=\"3.4\"/>\n    <circle class=\"s s2\" cx=\"81\"  cy=\"140\" r=\"3.4\"/>\n    <circle class=\"s s3\" cx=\"104\" cy=\"149\" r=\"3.4\"/>\n    <circle class=\"s s4\" cx=\"127\" cy=\"136\" r=\"3.4\"/>\n    <circle class=\"s s5\" cx=\"148\" cy=\"152\" r=\"3.4\"/>\n\n    <!-- role verdict -->\n    <g id=\"badge\">\n      <circle cx=\"166\" cy=\"132\" r=\"12\"/>\n      <path d=\"M160.5 132 L164.5 136.5 L172 127\"/>\n    <\/g>\n    <\/g>\n  <\/svg>\n<\/div>\n\n<div class=\"controls\" role=\"group\" aria-label=\"Rig state\">\n  <button data-state=\"idle\"      aria-pressed=\"true\">Idle<\/button>\n  <button data-state=\"loading\"   aria-pressed=\"false\">Loading<\/button>\n  <button data-state=\"warmup\"    aria-pressed=\"false\">Warmup<\/button>\n  <button data-state=\"measuring\" aria-pressed=\"false\">Measuring<\/button>\n  <button data-state=\"thermal\"   aria-pressed=\"false\">Thermal<\/button>\n  <button data-state=\"verdict\"   aria-pressed=\"false\">Verdict<\/button>\n<\/div>\n\n<p class=\"status\" id=\"status\">No specimen · <b>LM Studio reachable<\/b><\/p>\n\n<script>\nconst svg    = document.getElementById('sirvis');\nconst status = document.getElementById('status');\n\n// `pins` is how many contact pins are powered — a readable stand-in for load progress.\n// `powered` lights the die itself. Everything else is per-state CSS.\nconst STATES = {\n  idle:      { pins: 0, powered: false,\n               status: 'No specimen · <b>LM Studio reachable<\/b>' },\n  loading:   { pins: 3, powered: true,\n               status: 'Loading <b>MLX 4-bit<\/b> · 32K context · effective config pending' },\n  warmup:    { pins: 5, powered: true,\n               status: 'Warmup <b>2 of 2<\/b> · discarded, never scored' },\n  measuring: { pins: 5, powered: true,\n               status: 'Run <b>4 of 5<\/b> · 38.9 tok/s · TTFT 0.41s · no swap' },\n  thermal:   { pins: 5, powered: true,\n               status: 'Thermal pressure · runs <b>flagged, not discarded<\/b> · VALID_WITH_WARNINGS' },\n  verdict:   { pins: 5, powered: true,\n               status: 'n=5 · median <b>38.4 tok/s<\/b> · spread 4.9 · clarvis-agent <b>PASS<\/b>' }\n};\n\nfunction setState(name) {\n  const s = STATES[name];\n  svg.setAttribute('class', 'rig state-' + name + (s.powered ? ' powered' : ''));\n\n  document.querySelectorAll('.pinset').forEach((g, i) =>\n    g.classList.toggle('lit', i < s.pins));\n\n  status.style.opacity = 0;\n  setTimeout(() => { status.innerHTML = s.status; status.style.opacity = 1; }, 200);\n\n  document.querySelectorAll('.controls button').forEach(b =>\n    b.setAttribute('aria-pressed', String(b.dataset.state === name)));\n}\n\ndocument.querySelectorAll('.controls button')\n  .forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));\n\nsetState('idle');\n<\/script>\n<\/body>\n<\/html>\n", "ravis": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>RAVIS — Model Router<\/title>\n<style>\n  :root {\n    --bg:    #080a10;\n    --panel: #10141d;\n    --mag:   #ff6ec7;   /* RAVIS identity: signal, decision */\n    --mag-d: #9c3a7a;\n    --gold:  #ffc861;   /* score and budget — preferences, never constraints */\n    --dim:   #3b3346;   /* eliminated, or not in play */\n    --red:   #ff5c6a;   /* cut by a hard constraint, or no route at all */\n    --ink:   #cdd6e3;\n    --muted: #67788c;\n  }\n  * { box-sizing: border-box; }\n  html, body { height: 100%; margin: 0; }\n  body {\n    background: radial-gradient(ellipse 70% 55% at 50% 42%, #1a0f1a 0%, var(--bg) 72%);\n    color: var(--ink);\n    font: 14px/1.5 -apple-system, BlinkMacSystemFont, \"Segoe UI\", Inter, system-ui, sans-serif;\n    display: flex; flex-direction: column; align-items: center; justify-content: center;\n    gap: 28px; padding: 32px;\n    -webkit-font-smoothing: antialiased;\n  }\n  .stage { width: 340px; height: 340px; display: grid; place-items: center; position: relative; }\n  .halo {\n    position: absolute; inset: 0; border-radius: 50%;\n    background: radial-gradient(circle at 46% 50%, rgba(255,110,199,.12) 0%, transparent 62%);\n    animation: haloBreath 4s ease-in-out infinite;\n  }\n  @keyframes haloBreath {\n    0%, 100% { transform: scale(1);    opacity: .9; }\n    50%      { transform: scale(1.06); opacity: .55; }\n  }\n  svg.router { width: 320px; height: 320px; overflow: visible; display: block; }\n\n  /* ——— chrome ——— */\n  .reticle  { fill: none; stroke: var(--mag); stroke-opacity: .3; stroke-width: 1.2; }\n  #tickring { fill: none; stroke: var(--mag); stroke-opacity: .45; stroke-width: 3;\n              stroke-dasharray: 2.4 20.6; transform-origin: 100px 100px;\n              animation: spin 30s linear infinite; }\n  .cardinal { stroke: var(--mag); stroke-opacity: .7; stroke-width: 1.8; stroke-linecap: round; }\n  .bracket  { fill: none; stroke: var(--mag); stroke-opacity: .4; stroke-width: 1.6; stroke-linecap: round; }\n  @keyframes spin { to { transform: rotate(360deg); } }\n\n  /* ——— the policy gate ——— */\n  /* Hard constraints live here, upstream of every score. Nothing gets past it on merit. */\n  #gate { fill: none; stroke: var(--mag); stroke-opacity: .3; stroke-width: 5; stroke-linecap: round; }\n\n  /* ——— candidate lanes ——— */\n  .lane      { transition: opacity .4s; }\n  .lane .seg { fill: none; stroke: var(--dim); stroke-opacity: .22; stroke-width: 1.4;\n               stroke-dasharray: 3 6; transition: stroke .4s, stroke-opacity .4s, stroke-width .4s; }\n  .lane .node { fill: #0a0e16; stroke: var(--dim); stroke-opacity: .4; stroke-width: 2;\n                transition: stroke .4s, stroke-opacity .4s, filter .4s; }\n  .lane .port { fill: #0a0e16; stroke: var(--dim); stroke-width: 1.8;\n                transition: stroke .4s, filter .4s; }\n  .lane .kill { stroke: var(--red); stroke-width: 1.6; stroke-linecap: round;\n                opacity: 0; transform-box: fill-box; transform-origin: center;\n                transition: opacity .3s; }\n  .lane .brk  { stroke: var(--red); stroke-width: 2.2; stroke-linecap: round; opacity: 0;\n                filter: drop-shadow(0 0 6px rgba(255,92,106,.9)); }\n  .lane .score { fill: none; stroke: var(--gold); stroke-width: 3.4; stroke-linecap: round;\n                 stroke-dasharray: 0 100; transition: stroke-dasharray .5s ease;\n                 filter: drop-shadow(0 0 6px rgba(255,200,97,.8)); }\n\n  /* eligible but not yet chosen */\n  .lane.open .seg  { stroke: var(--mag); stroke-opacity: .4; }\n  .lane.open .node { stroke: var(--mag); stroke-opacity: 1; filter: drop-shadow(0 0 7px rgba(255,110,199,.35)); }\n  .lane.open .port { stroke: var(--mag); filter: drop-shadow(0 0 6px rgba(255,110,199,.6)); }\n\n  /* selected: solid, flowing, unmistakable */\n  .lane.live .seg  { stroke: var(--mag); stroke-opacity: .95; stroke-width: 2.2;\n                     stroke-dasharray: 5 5; animation: flow .8s linear infinite; }\n  .lane.live .node { stroke: var(--mag); stroke-opacity: 1; filter: drop-shadow(0 0 9px rgba(255,110,199,.85)); }\n  .lane.live .port { stroke: var(--mag); filter: drop-shadow(0 0 8px rgba(255,110,199,.9)); }\n  @keyframes flow { to { stroke-dashoffset: -20; } }\n\n  /* cut by a hard constraint — a different event from losing on score, and shown as one */\n  .lane.cut { opacity: .55; }\n  .lane.cut .port { stroke: var(--red); }\n  .lane.cut .kill { opacity: 1; animation: stamp .35s cubic-bezier(.34,1.56,.64,1); }\n  @keyframes stamp { 0% { opacity: 0; transform: scale(.4) rotate(-25deg); }\n                     100% { opacity: 1; transform: scale(1) rotate(0); } }\n\n  .lane.dim { opacity: .4; }\n\n  /* upstream died mid-flight */\n  .lane.broken .brk { opacity: 1; animation: snap .9s ease-out infinite; }\n  @keyframes snap { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }\n  .lane.broken .seg { stroke: var(--dim); stroke-opacity: .3; }\n\n  /* ——— decision core ——— */\n  /* A diamond, so it is never mistaken for NERVIS's hexagon. */\n  #core { fill: #0a0e16; stroke: var(--dim); stroke-opacity: .5; stroke-width: 2;\n          transition: stroke .5s, stroke-opacity .5s, filter .5s; }\n  #coreFill { fill: var(--dim); fill-opacity: .5; transition: fill .5s, fill-opacity .5s; }\n  .hot #core     { stroke: var(--mag); stroke-opacity: 1;\n                   filter: drop-shadow(0 0 13px rgba(255,110,199,.85)); }\n  .hot #coreFill { fill: var(--mag); fill-opacity: 1; animation: corePulse 1.5s ease-in-out infinite; }\n  @keyframes corePulse { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: .55; } }\n\n  /* ——— the chosen route leaves to the right ——— */\n  #out { opacity: 0; transition: opacity .4s; }\n  #out path { fill: none; stroke: var(--mag); stroke-width: 2.6;\n              stroke-linecap: round; stroke-linejoin: round;\n              filter: drop-shadow(0 0 8px rgba(255,110,199,.9)); }\n  #out circle { fill: var(--mag); filter: drop-shadow(0 0 8px rgba(255,110,199,.9));\n                animation: emit 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }\n  @keyframes emit { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }\n  #nogo { opacity: 0; transition: opacity .4s; }\n  #nogo path { fill: none; stroke: var(--red); stroke-linecap: round; }\n\n  /* ——— budget ——— */\n  #budgetTrack { fill: none; stroke: var(--gold); stroke-opacity: .18; stroke-width: 4; stroke-linecap: round; }\n  #budget { fill: none; stroke: var(--gold); stroke-width: 4; stroke-linecap: round;\n            stroke-dasharray: 0 100; transition: stroke-dasharray .6s ease;\n            filter: drop-shadow(0 0 7px rgba(255,200,97,.75)); }\n\n  /* ═══ per-state ═══ */\n  .state-idle #budget        { stroke-dasharray: 22 100; }\n  .state-eligibility #budget { stroke-dasharray: 28 100; }\n  .state-ranking #budget     { stroke-dasharray: 34 100; }\n  .state-selected #budget    { stroke-dasharray: 41 100; }\n  .state-fallback #budget    { stroke-dasharray: 58 100; }\n  .state-blocked #budget     { stroke-dasharray: 83 100; }\n\n  .state-selected #out, .state-fallback #out { opacity: 1; }\n  .state-blocked  #nogo { opacity: 1; animation: refuse 1.1s ease-in-out infinite; }\n  @keyframes refuse { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }\n\n  /* a no-route is a first-class outcome, so it retints the whole instrument */\n  .state-blocked { --mag: #ff5c6a; }\n  .state-blocked #core     { stroke: var(--red); stroke-opacity: .8;\n                             filter: drop-shadow(0 0 9px rgba(255,92,106,.8)); }\n  .state-blocked #coreFill { fill: var(--red); fill-opacity: .8; }\n  .state-blocked #tickring { animation-duration: 60s; }\n\n  /* ——— controls ——— */\n  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }\n  button {\n    font: inherit; font-weight: 500; color: var(--muted); background: var(--panel);\n    border: 1px solid #211a28; border-radius: 999px; padding: 9px 20px; cursor: pointer;\n    transition: color .2s, border-color .2s, box-shadow .2s, transform .1s;\n  }\n  button:hover { color: var(--ink); border-color: #33283c; }\n  button:active { transform: translateY(1px); }\n  button[aria-pressed=\"true\"] {\n    color: var(--mag); border-color: var(--mag-d);\n    box-shadow: 0 0 0 1px rgba(255,110,199,.2), 0 0 18px -4px rgba(255,110,199,.6);\n  }\n  button:focus-visible { outline: 2px solid var(--mag); outline-offset: 2px; }\n  .status {\n    color: var(--muted); font-size: 12.5px; min-height: 1.5em; text-align: center;\n    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n    max-width: 50ch; transition: opacity .25s;\n  }\n  .status b { color: var(--ink); font-weight: 500; }\n\n\n  /* ——— idle drift ———\n     Same 4s bob as Clarvis, and applied the same way: the chrome is a fixed frame,\n     so only what it frames moves. Children keep their own transform-origins, so the\n     spins and gauge fills compose on top of this untouched. */\n  #float { animation: bob 4s ease-in-out infinite; transform-origin: 100px 100px; }\n  @keyframes bob {\n    0%, 100% { transform: translateY(0)     rotate(-1.1deg); }\n    50%      { transform: translateY(-11px) rotate(1.1deg); }\n  }\n\n  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"stage\">\n  <div class=\"halo\"><\/div>\n  <svg class=\"router state-idle\" id=\"ravis\" viewBox=\"0 0 200 200\" role=\"img\"\n       aria-label=\"RAVIS, a model router choosing one route from five candidates\">\n\n    <!-- chrome -->\n    <circle class=\"reticle\" cx=\"100\" cy=\"100\" r=\"92\"/>\n    <circle id=\"tickring\"   cx=\"100\" cy=\"100\" r=\"88\"/>\n    <g class=\"cardinal\"><path d=\"M100 185 v9\"/><path d=\"M6 100 h9\"/><path d=\"M185 100 h9\"/><\/g>\n    <g class=\"bracket\">\n      <path d=\"M14 40 V20 H34\"/><path d=\"M166 20 H186 V40\"/>\n      <path d=\"M186 166 V186 H166\"/><path d=\"M34 186 H14 V166\"/>\n    <\/g>\n\n    <g id=\"float\">\n    <!-- eligibility gate -->\n    <path id=\"gate\" d=\"M64.2 135.7 A49 49 0 0 1 64.2 64.3\"/>\n\n    <!-- five candidates, left flank only: this is a flow, not an orbit -->\n    <g class=\"lane\" id=\"l0\">\n      <path class=\"seg\" d=\"M43.2 154.9 L64.8 134.0\"/>\n      <path class=\"seg gateseg\" d=\"M64.8 134.0 L100 100\"/>\n      <path class=\"score\" d=\"M45.2 170.1 A89 89 0 0 1 26.2 149.8\" pathLength=\"100\"/>\n      <path class=\"brk\" d=\"M49 149 l10 10 M59 149 l-10 10\"/>\n      <circle class=\"port\" cx=\"64.8\" cy=\"134.0\" r=\"4.4\"/>\n      <path class=\"kill\" d=\"M60.4 129.6 l8.8 8.8 M69.2 129.6 l-8.8 8.8\"/>\n      <circle class=\"node\" cx=\"43.2\" cy=\"154.9\" r=\"6.5\"/>\n    <\/g>\n    <g class=\"lane\" id=\"l1\">\n      <path class=\"seg\" d=\"M26.8 129.6 L54.6 118.4\"/>\n      <path class=\"seg gateseg\" d=\"M54.6 118.4 L100 100\"/>\n      <path class=\"score\" d=\"M22.9 144.5 A89 89 0 0 1 13.0 118.5\" pathLength=\"100\"/>\n      <path class=\"brk\" d=\"M35 119 l10 10 M45 119 l-10 10\"/>\n      <circle class=\"port\" cx=\"54.6\" cy=\"118.4\" r=\"4.4\"/>\n      <path class=\"kill\" d=\"M50.2 114.0 l8.8 8.8 M59.0 114.0 l-8.8 8.8\"/>\n      <circle class=\"node\" cx=\"26.8\" cy=\"129.6\" r=\"6.5\"/>\n    <\/g>\n    <g class=\"lane\" id=\"l2\">\n      <path class=\"seg\" d=\"M21 100 L51 100\"/>\n      <path class=\"seg gateseg\" d=\"M51 100 L100 100\"/>\n      <path class=\"score\" d=\"M11.9 112.4 A89 89 0 0 1 12.4 84.6\" pathLength=\"100\"/>\n      <path class=\"brk\" d=\"M31 95 l10 10 M41 95 l-10 10\"/>\n      <circle class=\"port\" cx=\"51\" cy=\"100\" r=\"4.4\"/>\n      <path class=\"kill\" d=\"M46.6 95.6 l8.8 8.8 M55.4 95.6 l-8.8 8.8\"/>\n      <circle class=\"node\" cx=\"21\" cy=\"100\" r=\"6.5\"/>\n    <\/g>\n    <g class=\"lane\" id=\"l3\">\n      <path class=\"seg\" d=\"M26.8 70.4 L54.6 81.6\"/>\n      <path class=\"seg gateseg\" d=\"M54.6 81.6 L100 100\"/>\n      <path class=\"score\" d=\"M13.6 78.5 A89 89 0 0 1 24.5 52.8\" pathLength=\"100\"/>\n      <path class=\"brk\" d=\"M35 71 l10 10 M45 71 l-10 10\"/>\n      <circle class=\"port\" cx=\"54.6\" cy=\"81.6\" r=\"4.4\"/>\n      <path class=\"kill\" d=\"M50.2 77.2 l8.8 8.8 M59.0 77.2 l-8.8 8.8\"/>\n      <circle class=\"node\" cx=\"26.8\" cy=\"70.4\" r=\"6.5\"/>\n    <\/g>\n    <g class=\"lane\" id=\"l4\">\n      <path class=\"seg\" d=\"M43.2 45.1 L64.8 66.0\"/>\n      <path class=\"seg gateseg\" d=\"M64.8 66.0 L100 100\"/>\n      <path class=\"score\" d=\"M28.0 47.7 A89 89 0 0 1 47.7 28.0\" pathLength=\"100\"/>\n      <path class=\"brk\" d=\"M49 46 l10 10 M59 46 l-10 10\"/>\n      <circle class=\"port\" cx=\"64.8\" cy=\"66.0\" r=\"4.4\"/>\n      <path class=\"kill\" d=\"M60.4 61.6 l8.8 8.8 M69.2 61.6 l-8.8 8.8\"/>\n      <circle class=\"node\" cx=\"43.2\" cy=\"45.1\" r=\"6.5\"/>\n    <\/g>\n\n    <!-- decision core -->\n    <path id=\"core\" d=\"M100 78 L122 100 L100 122 L78 100 Z\"/>\n    <path id=\"coreFill\" d=\"M100 88 L112 100 L100 112 L88 100 Z\"/>\n\n    <!-- the selected route -->\n    <g id=\"out\">\n      <path d=\"M122 100 H164\"/>\n      <path d=\"M158 93 L166 100 L158 107\"/>\n      <circle cx=\"176\" cy=\"100\" r=\"5\"/>\n    <\/g>\n    <g id=\"nogo\">\n      <path d=\"M122 100 H150\" stroke-width=\"2.2\" stroke-opacity=\".45\" stroke-dasharray=\"3 5\"/>\n      <path d=\"M156 94 L170 108 M170 94 L156 108\" stroke-width=\"2.6\"\n            style=\"filter: drop-shadow(0 0 7px rgba(255,92,106,.9))\"/>\n    <\/g>\n\n    <!-- budget -->\n    <path id=\"budgetTrack\" d=\"M144.5 171.2 A84 84 0 0 1 55.5 171.2\"/>\n    <path id=\"budget\"      d=\"M144.5 171.2 A84 84 0 0 1 55.5 171.2\" pathLength=\"100\"/>\n    <\/g>\n  <\/svg>\n<\/div>\n\n<div class=\"controls\" role=\"group\" aria-label=\"Routing stage\">\n  <button data-state=\"idle\"        aria-pressed=\"true\">Idle<\/button>\n  <button data-state=\"eligibility\" aria-pressed=\"false\">Eligibility<\/button>\n  <button data-state=\"ranking\"     aria-pressed=\"false\">Ranking<\/button>\n  <button data-state=\"selected\"    aria-pressed=\"false\">Selected<\/button>\n  <button data-state=\"fallback\"    aria-pressed=\"false\">Fallback<\/button>\n  <button data-state=\"blocked\"     aria-pressed=\"false\">Blocked<\/button>\n<\/div>\n\n<p class=\"status\" id=\"status\">Idle · <b>5 candidates<\/b> eligible · no traffic<\/p>\n\n<script>\nconst svg    = document.getElementById('ravis');\nconst status = document.getElementById('status');\n\n// lanes: 'open' | 'cut' | 'live' | 'dim'.  scores are only ever applied to survivors —\n// a preference can never rescue something the gate already cut.\nconst STATES = {\n  idle: {\n    lanes: ['open','open','open','open','open'], scores: {}, hot: false,\n    status: 'Idle · <b>5 candidates<\/b> eligible · no traffic' },\n  eligibility: {\n    lanes: ['cut','open','open','cut','open'], scores: {}, hot: false,\n    status: 'Hard constraints · <b>2 eliminated<\/b> · tools required, min context 32K' },\n  ranking: {\n    lanes: ['cut','open','open','cut','open'], scores: {1:.55, 2:.95, 4:.7}, hot: true,\n    status: 'Ranking survivors · latency · quality · cost · <b>SIRVIS evidence<\/b>' },\n  selected: {\n    lanes: ['cut','dim','live','cut','dim'], scores: {2:.95}, hot: true,\n    status: 'Route selected · <b>local coder<\/b> · 41.2 tok/s · €0.00' },\n  fallback: {\n    lanes: ['cut','dim','broken','cut','live'], scores: {4:.7}, hot: true,\n    status: 'Primary failed · <b>fallback holds every pool invariant<\/b> · not a retry' },\n  blocked: {\n    lanes: ['cut','cut','cut','cut','cut'], scores: {}, hot: false,\n    status: 'No route · local-only policy · <b>failed closed<\/b>, never routed around' }\n};\n\nfunction setState(name) {\n  const s = STATES[name];\n  svg.setAttribute('class', 'router state-' + name + (s.hot ? ' hot' : ''));\n\n  s.lanes.forEach((st, i) => {\n    const lane = document.getElementById('l' + i);\n    lane.className.baseVal = 'lane ' + (st === 'broken' ? 'dim broken' : st);\n    // a round line-cap paints a dot even at zero length, so hide unscored arcs outright\n    const score = lane.querySelector('.score');\n    score.style.strokeDasharray = (s.scores[i] || 0) * 100 + ' 100';\n    score.style.opacity = s.scores[i] ? 1 : 0;\n  });\n\n  status.style.opacity = 0;\n  setTimeout(() => { status.innerHTML = s.status; status.style.opacity = 1; }, 200);\n\n  document.querySelectorAll('.controls button').forEach(b =>\n    b.setAttribute('aria-pressed', String(b.dataset.state === name)));\n}\n\ndocument.querySelectorAll('.controls button')\n  .forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));\n\nsetState('idle');\n<\/script>\n<\/body>\n<\/html>\n", "nervis": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>NERVIS — Control Plane<\/title>\n<style>\n  :root {\n    --bg:      #080a10;\n    --panel:   #10141d;\n    --violet:  #7d6cff;   /* structure: rings, reticle, chrome */\n    --violet-d:#4a3fa8;\n    --cyan:    #34e6f2;   /* data, and a healthy peer — Clarvis's colour, on purpose */\n    --amber:   #ffb648;   /* degraded */\n    --red:     #ff5c6a;   /* unreachable */\n    --ink:     #cdd6e3;\n    --muted:   #67788c;\n  }\n  * { box-sizing: border-box; }\n  html, body { height: 100%; margin: 0; }\n  body {\n    background: radial-gradient(ellipse 70% 55% at 50% 38%, #121728 0%, var(--bg) 72%);\n    color: var(--ink);\n    font: 14px/1.5 -apple-system, BlinkMacSystemFont, \"Segoe UI\", Inter, system-ui, sans-serif;\n    display: flex; flex-direction: column; align-items: center; justify-content: center;\n    gap: 28px; padding: 32px;\n    -webkit-font-smoothing: antialiased;\n  }\n\n  .stage { width: 340px; height: 340px; display: grid; place-items: center; position: relative; }\n  /* ground glow instead of a floor shadow — it hovers in a room, it does not stand in one */\n  .halo {\n    position: absolute; inset: 0; border-radius: 50%;\n    background: radial-gradient(circle at 50% 50%, rgba(125,108,255,.13) 0%, transparent 62%);\n    animation: haloBreath 4s ease-in-out infinite;\n  }\n  @keyframes haloBreath {\n    0%, 100% { transform: scale(1);    opacity: .9; }\n    50%      { transform: scale(1.07); opacity: .55; }\n  }\n\n  svg.core { width: 320px; height: 320px; overflow: visible; display: block; }\n\n  /* ——— structure ——— */\n  .reticle { fill: none; stroke: var(--violet); stroke-opacity: .38; stroke-width: 1.2; }\n  .tickring {\n    fill: none; stroke: var(--violet); stroke-opacity: .5; stroke-width: 3;\n    stroke-dasharray: 2.4 20.6;               /* 24 ticks around r=88 */\n    transform-origin: 100px 100px;\n  }\n  .cardinal { stroke: var(--violet); stroke-opacity: .75; stroke-width: 1.8; stroke-linecap: round; }\n  .bracket  { fill: none; stroke: var(--violet); stroke-opacity: .45; stroke-width: 1.6; stroke-linecap: round; }\n\n  /* two counter-rotating rings: the thing is always working, even at rest */\n  #ringA {\n    fill: none; stroke: var(--violet); stroke-opacity: .55; stroke-width: 1.6;\n    stroke-dasharray: 34 14; transform-origin: 100px 100px;\n    animation: spin 26s linear infinite;\n  }\n  #ringB {\n    fill: none; stroke: var(--cyan); stroke-opacity: .3; stroke-width: 2.4;\n    stroke-dasharray: 62 68; stroke-linecap: round; transform-origin: 100px 100px;\n    animation: spinBack 17s linear infinite;\n  }\n  #ringC {\n    fill: none; stroke: var(--violet); stroke-opacity: .3; stroke-width: 1;\n    transform-origin: 100px 100px; animation: spin 40s linear infinite;\n  }\n  @keyframes spin     { to { transform: rotate(360deg); } }\n  @keyframes spinBack { to { transform: rotate(-360deg); } }\n\n  /* ——— aperture ——— */\n  /* A hexagonal iris. It is an eye without being a face — it opens, it does not look. */\n  #hexOuter { fill: none; stroke: var(--violet); stroke-opacity: .8; stroke-width: 2;\n              transform-origin: 100px 100px; animation: spinBack 30s linear infinite; }\n  #hexInner { fill: none; stroke: var(--cyan); stroke-opacity: .6; stroke-width: 1.6;\n              transform-origin: 100px 100px; animation: irisBreath 5s ease-in-out infinite; }\n  @keyframes irisBreath {\n    0%, 100% { transform: scale(1)    rotate(0deg);  stroke-opacity: .6; }\n    50%      { transform: scale(.84)  rotate(24deg); stroke-opacity: 1; }\n  }\n\n  #coreGlow { fill: var(--violet); opacity: .22; transform-origin: 100px 100px;\n              animation: corePulse 3.4s ease-in-out infinite; }\n  #coreDot  { fill: var(--cyan); transform-origin: 100px 100px;\n              filter: drop-shadow(0 0 10px rgba(52,230,242,.9));\n              animation: corePulse 3.4s ease-in-out infinite; }\n  @keyframes corePulse {\n    0%, 100% { transform: scale(1);    opacity: 1; }\n    50%      { transform: scale(1.22); opacity: .82; }\n  }\n\n  /* ——— peers ——— */\n  /* Three satellites, because NERVIS observes exactly three services. */\n  .sat        { transition: opacity .35s; }\n  .sat .body  { fill: #0b0f18; stroke: var(--cyan); stroke-width: 2;\n                filter: drop-shadow(0 0 7px rgba(52,230,242,.65)); transition: stroke .4s, filter .4s; }\n  .sat .ping  { fill: none; stroke: var(--cyan); stroke-width: 1.4; opacity: 0; transform-box: fill-box;\n                transform-origin: center; }\n  .sat .tag   { fill: var(--cyan); font: 600 8px/1 ui-monospace, SFMono-Regular, Menlo, monospace;\n                text-anchor: middle; letter-spacing: .5px; transition: fill .4s; }\n\n  /* health overrides — the avatar is a status light, not a mood */\n  .sat.degraded .body { stroke: var(--amber); filter: drop-shadow(0 0 9px rgba(255,182,72,.8)); }\n  .sat.degraded .tag  { fill: var(--amber); }\n  .sat.degraded       { animation: satWarn 1.1s ease-in-out infinite; }\n  @keyframes satWarn { 0%,100% { opacity: 1; } 50% { opacity: .5; } }\n  .sat.down .body { stroke: var(--red); filter: drop-shadow(0 0 10px rgba(255,92,106,.85)); }\n  .sat.down .tag  { fill: var(--red); }\n  .sat.down       { animation: satFail .5s steps(1) infinite; }\n  @keyframes satFail { 0%,60% { opacity: 1; } 61%,100% { opacity: .32; } }\n\n  /* ——— links ——— */\n  /* Dashed spokes. Idle they sit still; under load the dashes run inward. */\n  .link { stroke: var(--cyan); stroke-width: 1.4; stroke-opacity: .3; fill: none;\n          stroke-dasharray: 3 7; transition: stroke-opacity .35s; }\n\n  /* ——— radar sweep ——— */\n  #sweep { opacity: 0; transform-origin: 100px 100px; transition: opacity .3s; }\n\n  /* ——— throughput bars: family resemblance to Clarvis's waveform, read as traffic ——— */\n  #bars { opacity: 0; transition: opacity .3s; }\n  #bars rect { fill: var(--cyan); rx: 1.5; transform-origin: center 158px;\n               filter: drop-shadow(0 0 5px rgba(52,230,242,.7)); }\n\n  /* ═══ nominal ═══ everything slow, nothing to report */\n\n  /* ═══ scanning ═══ radar sweeps, peers answer in turn */\n  .state-scanning #sweep { opacity: 1; animation: spin 2.6s linear infinite; }\n  .state-scanning #ringA { animation-duration: 9s; }\n  .state-scanning .ping  { animation: ping 2.6s ease-out infinite; }\n  .state-scanning #satC .ping { animation-delay: .0s;  }\n  .state-scanning #satR .ping { animation-delay: .87s; }\n  .state-scanning #satS .ping { animation-delay: 1.73s; }\n  @keyframes ping {\n    0%   { opacity: .9; transform: scale(.7); }\n    70%  { opacity: 0;  transform: scale(2.6); }\n    100% { opacity: 0;  transform: scale(2.6); }\n  }\n\n  /* ═══ routing ═══ traffic converging on the core */\n  .state-routing .link { stroke-opacity: .95; animation: flow .9s linear infinite; }\n  @keyframes flow { to { stroke-dashoffset: -20; } }\n  .state-routing #ringB { animation-duration: 5s; stroke-opacity: .7; }\n  .state-routing #coreDot { animation-duration: .8s; }\n  .state-routing #bars { opacity: 1; }\n  .state-routing #bars rect { animation: traffic .62s ease-in-out infinite; }\n  #bars rect:nth-child(1) { animation-delay: -.31s; }\n  #bars rect:nth-child(2) { animation-delay: -.08s; }\n  #bars rect:nth-child(3) { animation-delay: -.45s; }\n  #bars rect:nth-child(4) { animation-delay: -.19s; }\n  #bars rect:nth-child(5) { animation-delay: -.52s; }\n  @keyframes traffic { 0%,100% { transform: scaleY(.22); } 50% { transform: scaleY(1); } }\n\n  /* ═══ analyzing ═══ the rings close in; attention contracts to one point */\n  .state-analyzing #ringA { animation: spin 4s linear infinite, pullIn 2.8s ease-in-out infinite; }\n  .state-analyzing #ringB { animation: spinBack 3s linear infinite, pullIn 2.8s ease-in-out infinite .1s; }\n  .state-analyzing #ringC { animation: spin 6s linear infinite, pullIn 2.8s ease-in-out infinite .2s; }\n  @keyframes pullIn {\n    0%, 100% { transform: scale(1)   rotate(0deg); }\n    50%      { transform: scale(.72) rotate(180deg); }\n  }\n  .state-analyzing #hexInner { animation-duration: 1.3s; }\n  .state-analyzing #coreDot  { animation-duration: .55s; }\n  .state-analyzing #coreGlow { opacity: .4; }\n  .state-analyzing .link { stroke-opacity: .55; }\n\n  /* ═══ degraded ═══ one peer is unwell; the chrome goes amber, the rest keeps working */\n  .state-degraded .reticle,\n  .state-degraded .tickring,\n  .state-degraded .cardinal,\n  .state-degraded .bracket { stroke: var(--amber); }\n  .state-degraded #ringA   { stroke: var(--amber); stroke-opacity: .6; }\n  .state-degraded #coreGlow{ fill: var(--amber); }\n\n  /* ═══ critical ═══ a peer is gone; everything else deliberately keeps running */\n  .state-critical .reticle,\n  .state-critical .tickring,\n  .state-critical .cardinal,\n  .state-critical .bracket { stroke: var(--red); }\n  .state-critical #ringA { stroke: var(--red); animation: spin 46s linear infinite; }\n  .state-critical #ringB { stroke-opacity: .16; }\n  .state-critical #coreGlow { fill: var(--red); opacity: .3; }\n  .state-critical #coreDot  { fill: var(--red); filter: drop-shadow(0 0 12px rgba(255,92,106,.9));\n                              animation: faultBlink 1.5s steps(1) infinite; }\n  @keyframes faultBlink { 0%,70% { opacity: 1; } 71%,100% { opacity: .35; } }\n  .state-critical #hexOuter { stroke: var(--red); stroke-opacity: .55; }\n\n  /* ——— controls ——— */\n  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }\n  button {\n    font: inherit; font-weight: 500; letter-spacing: .01em;\n    color: var(--muted); background: var(--panel);\n    border: 1px solid #1c2331; border-radius: 999px;\n    padding: 9px 20px; cursor: pointer;\n    transition: color .2s, border-color .2s, box-shadow .2s, transform .1s;\n  }\n  button:hover { color: var(--ink); border-color: #2b3547; }\n  button:active { transform: translateY(1px); }\n  button[aria-pressed=\"true\"] {\n    color: var(--violet); border-color: var(--violet-d);\n    box-shadow: 0 0 0 1px rgba(125,108,255,.2), 0 0 18px -4px rgba(125,108,255,.6);\n  }\n  button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }\n\n  /* Clarvis quips here. NERVIS reports. */\n  .status {\n    color: var(--muted); font-size: 12.5px; min-height: 1.5em; text-align: center;\n    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n    max-width: 46ch; transition: opacity .25s;\n  }\n  .status b { color: var(--ink); font-weight: 500; }\n\n\n  /* ——— idle drift ———\n     Same 4s bob as Clarvis, and applied the same way: the chrome is a fixed frame,\n     so only what it frames moves. Children keep their own transform-origins, so the\n     spins and gauge fills compose on top of this untouched. */\n  #float { animation: bob 4s ease-in-out infinite; transform-origin: 100px 100px; }\n  @keyframes bob {\n    0%, 100% { transform: translateY(0)     rotate(-1.1deg); }\n    50%      { transform: translateY(-11px) rotate(1.1deg); }\n  }\n\n  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"stage\">\n  <div class=\"halo\"><\/div>\n  <svg class=\"core state-nominal\" id=\"nervis\" viewBox=\"0 0 200 200\" role=\"img\"\n       aria-label=\"NERVIS, a control-plane instrument watching three services\">\n    <defs>\n      <radialGradient id=\"sweepFade\" cx=\"0\" cy=\"0\" r=\"1\"\n                      gradientUnits=\"userSpaceOnUse\" gradientTransform=\"translate(100 100) scale(76)\">\n        <stop offset=\"0\"   stop-color=\"#7d6cff\" stop-opacity=\".55\"/>\n        <stop offset=\"1\"   stop-color=\"#7d6cff\" stop-opacity=\"0\"/>\n      <\/radialGradient>\n      <linearGradient id=\"coreFill\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#a99bff\"/>\n        <stop offset=\"1\" stop-color=\"#3d3a8f\"/>\n      <\/linearGradient>\n    <\/defs>\n\n    <!-- HUD corner brackets -->\n    <g class=\"bracket\">\n      <path d=\"M14 34 V14 H34\"/>\n      <path d=\"M166 14 H186 V34\"/>\n      <path d=\"M186 166 V186 H166\"/>\n      <path d=\"M34 186 H14 V166\"/>\n    <\/g>\n\n    <!-- outer reticle + tick ring -->\n    <circle class=\"reticle\"  cx=\"100\" cy=\"100\" r=\"92\"/>\n    <circle class=\"tickring\" cx=\"100\" cy=\"100\" r=\"88\"/>\n    <g class=\"cardinal\">\n      <path d=\"M100 6  v9\"/>\n      <path d=\"M100 185 v9\"/>\n      <path d=\"M6 100  h9\"/>\n      <path d=\"M185 100 h9\"/>\n    <\/g>\n\n    <g id=\"float\">\n    <!-- radar sweep (scanning) -->\n    <path id=\"sweep\" d=\"M100 100 L100 24 A76 76 0 0 1 138 34.2 Z\" fill=\"url(#sweepFade)\"/>\n\n    <!-- rotating rings -->\n    <circle id=\"ringA\" cx=\"100\" cy=\"100\" r=\"76\"/>\n    <circle id=\"ringB\" cx=\"100\" cy=\"100\" r=\"62\"/>\n    <circle id=\"ringC\" cx=\"100\" cy=\"100\" r=\"42\"/>\n\n    <!-- spokes: peer → core -->\n    <g>\n      <path class=\"link\" d=\"M100 45  L100 82\"/>\n      <path class=\"link\" d=\"M148 124 L114 108\"/>\n      <path class=\"link\" d=\"M52 124  L86 108\"/>\n    <\/g>\n\n    <!-- aperture -->\n    <polygon id=\"hexOuter\" points=\"100,74 122.5,87 122.5,113 100,126 77.5,113 77.5,87\"/>\n    <polygon id=\"hexInner\" points=\"100,83 114.7,91.5 114.7,108.5 100,117 85.3,108.5 85.3,91.5\"/>\n\n    <!-- core -->\n    <circle id=\"coreGlow\" cx=\"100\" cy=\"100\" r=\"15\"/>\n    <circle id=\"coreDot\"  cx=\"100\" cy=\"100\" r=\"5.5\"/>\n\n    <!-- peers: CLARVIS top, RAVIS lower-right, SIRVIS lower-left -->\n    <g class=\"sat\" id=\"satC\">\n      <circle class=\"ping\" cx=\"100\" cy=\"38\" r=\"9\"/>\n      <circle class=\"body\" cx=\"100\" cy=\"38\" r=\"9\"/>\n      <text class=\"tag\" x=\"100\" y=\"41.2\">C<\/text>\n    <\/g>\n    <g class=\"sat\" id=\"satR\">\n      <circle class=\"ping\" cx=\"153.7\" cy=\"131\" r=\"9\"/>\n      <circle class=\"body\" cx=\"153.7\" cy=\"131\" r=\"9\"/>\n      <text class=\"tag\" x=\"153.7\" y=\"134.2\">R<\/text>\n    <\/g>\n    <g class=\"sat\" id=\"satS\">\n      <circle class=\"ping\" cx=\"46.3\" cy=\"131\" r=\"9\"/>\n      <circle class=\"body\" cx=\"46.3\" cy=\"131\" r=\"9\"/>\n      <text class=\"tag\" x=\"46.3\" y=\"134.2\">S<\/text>\n    <\/g>\n\n    <!-- throughput -->\n    <g id=\"bars\">\n      <rect x=\"82\"  y=\"150\" width=\"4\" height=\"16\"/>\n      <rect x=\"91\"  y=\"150\" width=\"4\" height=\"16\"/>\n      <rect x=\"100\" y=\"150\" width=\"4\" height=\"16\"/>\n      <rect x=\"109\" y=\"150\" width=\"4\" height=\"16\"/>\n      <rect x=\"118\" y=\"150\" width=\"4\" height=\"16\"/>\n    <\/g>\n    <\/g>\n  <\/svg>\n<\/div>\n\n<div class=\"controls\" role=\"group\" aria-label=\"Operational state\">\n  <button data-state=\"nominal\"   aria-pressed=\"true\">Nominal<\/button>\n  <button data-state=\"scanning\"  aria-pressed=\"false\">Scanning<\/button>\n  <button data-state=\"routing\"   aria-pressed=\"false\">Routing<\/button>\n  <button data-state=\"analyzing\" aria-pressed=\"false\">Analyzing<\/button>\n  <button data-state=\"degraded\"  aria-pressed=\"false\">Degraded<\/button>\n  <button data-state=\"critical\"  aria-pressed=\"false\">Critical<\/button>\n<\/div>\n\n<p class=\"status\" id=\"status\">All peers healthy · <b>4 models resident<\/b> · nothing requires attention<\/p>\n\n<script>\nconst svg    = document.getElementById('nervis');\nconst status = document.getElementById('status');\n\n// Peer health per state: 'ok' | 'degraded' | 'down'.\n// The avatar is a status light — health is data, not decoration.\nconst STATES = {\n  nominal:   { peers: { C:'ok', R:'ok', S:'ok' },\n               status: 'All peers healthy · <b>4 models resident<\/b> · nothing requires attention' },\n  scanning:  { peers: { C:'ok', R:'ok', S:'ok' },\n               status: 'Probing service endpoints · <b>2 of 3 responded<\/b> · negotiating capabilities' },\n  routing:   { peers: { C:'ok', R:'ok', S:'ok' },\n               status: 'trace <b>0x7F2A<\/b> · clarvis-agent → local coder · <b>41.2 tok/s<\/b>' },\n  analyzing: { peers: { C:'ok', R:'ok', S:'ok' },\n               status: 'Correlating <b>214 events<\/b> across 3 services · local-only analysis' },\n  degraded:  { peers: { C:'ok', R:'degraded', S:'ok' },\n               status: 'RAVIS degraded · <b>Anthropic error rate 37%<\/b> · traffic diverted to fallback' },\n  critical:  { peers: { C:'ok', R:'down', S:'ok' },\n               status: 'RAVIS unreachable · chat unavailable · <b>SIRVIS and Clarvis operational<\/b>' }\n};\n\nfunction setState(name) {\n  const s = STATES[name];\n  svg.setAttribute('class', 'core state-' + name);\n\n  for (const [id, health] of Object.entries(s.peers)) {\n    const sat = document.getElementById('sat' + id);\n    sat.classList.remove('degraded', 'down');\n    if (health !== 'ok') sat.classList.add(health);\n  }\n\n  status.style.opacity = 0;\n  setTimeout(() => { status.innerHTML = s.status; status.style.opacity = 1; }, 200);\n\n  document.querySelectorAll('.controls button').forEach(b =>\n    b.setAttribute('aria-pressed', String(b.dataset.state === name)));\n}\n\ndocument.querySelectorAll('.controls button')\n  .forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));\n\nsetState('nominal');\n<\/script>\n<\/body>\n<\/html>\n"};
const loaded = new Set();

function show(app) {
  if (!loaded.has(app)) {
    document.getElementById('f-' + app).srcdoc = SRC[app];
    loaded.add(app);
  }
  document.querySelectorAll('iframe').forEach(f =>
    f.setAttribute('data-active', String(f.id === 'f-' + app)));
  document.querySelectorAll('.tabs button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.app === app)));
}

document.querySelectorAll('.tabs button')
  .forEach(b => b.addEventListener('click', () => show(b.dataset.app)));

show('clarvis');
