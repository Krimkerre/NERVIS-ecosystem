# The gates from ECOSYSTEM_RUNBOOK.md §14.1.
#
# **This file does not run.** GitHub Actions is switched off on both
# repositories and is not coming back, so what follows is a record of what the
# gates are — the same list, in the same order, kept here because it is where
# somebody looks for it. `tools/check_clean_clone.sh` is what executes them, and
# it is the only thing that does: it clones from the remote and builds an
# environment from the packages' own metadata, which is the guarantee a local run
# cannot give.
#
# The header below is still true and is why this file was not simply deleted.
#
# §14.1 says the gate is the authority, not the prose describing it — so this
# file is what that sentence means in practice. A rule that only exists in a
# document is a preference; a rule that fails a build is a rule.
name: checks

on:
  push:
    # `main`, renamed from `master`. The rename silently disarmed this gate —
    # a push-triggered workflow naming a branch that no longer exists does not
    # fail, it just never runs, and the first commit after the rename went in
    # unchecked. A gate that cannot fail is not a gate.
    branches: [main]
  pull_request:

jobs:
  ravis:
    name: ravis — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ravis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The shared protocol package first: both services depend on it, and pip
      # will not find `ecosystem-protocol` on PyPI because it does not live there.
      - run: pip install -e ../protocol
      - run: pip install -e ".[dev]"

      # Complexity <= 8, import order, naming, unused names and arguments.
      - name: lint and complexity
        run: ruff check src tests

      - name: types
        run: mypy

      # §14.5: nothing here reaches a network or a live service, which is why
      # this stage needs no credentials and no services.
      - name: tests
        run: pytest

      # RAVIS.md §8.9 makes this the release gate for claiming Clarvis
      # compatibility. Running it on every push rather than only at release
      # means a regression is attributed to the commit that caused it.
      - name: clarvis conformance
        run: ravis conformance clarvis

  protocol:
    name: ecosystem-protocol — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: lint and complexity
        run: ruff check src tests
      - name: types
        run: mypy
      # Mounted on a bare FastAPI app with an invented service type, so a
      # RAVIS-shaped assumption fails here rather than surfacing in SIRVIS.
      - name: tests
        run: pytest

  sirvis:
    name: sirvis — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sirvis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ../protocol
      - run: pip install -e ".[dev]"
      - name: lint and complexity
        run: ruff check src tests
      - name: types
        run: mypy
      # M0's exit includes starting with no runtime present, so this stage
      # deliberately has no LM Studio and must still be green.
      - name: tests
        run: pytest

  status:
    name: status — STATUS.md matches the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Every package, because the gate collects every suite. Installing only
      # some of them makes the count unresolvable rather than wrong — which is
      # the design, and is how this step failed the first time it ran.
      - run: pip install -e ./protocol
      - run: pip install -e "./ravis[dev]"
      - run: pip install -e "./sirvis[dev]"
      - run: pip install -e "./nervis[dev]"
      # STATUS.md is what a cold session reads to learn where the build is,
      # which makes it the most damaging file to be wrong: a stale spec misleads
      # someone who is checking, a stale status file misleads someone who is not.
      # The gate checks only falsifiable claims — counts and paths — and rests on
      # one observation: finishing a milestone always adds tests.
      - name: STATUS.md is current
        run: python3 tools/check_status.py
      # Definitions nothing references. Ruff catches unused imports and locals;
      # it does not catch a function that is defined, exported, documented and
      # never called — which is how `capable()`, `is_due_for_refresh` and two
      # published error codes all came to describe behaviour that did not exist.
      - name: nothing is defined and unreferenced
        run: python3 tools/check_dead_code.py
      # The three specs' milestone and stage-mapping tables, which STATUS.md
      # reads to derive what is left to build. A row with the wrong column count
      # still renders — Markdown drops the extra cells — which is how NERVIS's
      # M26 had no visible row for a week, and how part of M25's acceptance went
      # with it. The mapping's own promise that "no milestone is silently
      # unassigned" had never been verified either; M22b was.
      - name: the build plans are readable and complete
        run: python3 tools/check_plans.py

  prototype:
    name: nervis — parse, endpoints, citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          # Only used so check.py can run `node --check` over the prototype's
          # inline script. Any maintained release parses it, so this tracks LTS
          # rather than pinning a number that silently ages into a warning.
          node-version: "lts/*"
      # Cross-checks every cited endpoint against the specification documents and
      # requires a citation on every mutation, so an invented endpoint fails here
      # rather than looking sanctioned in a list.
      - name: prototype checks
        run: python3 tools/check.py
        working-directory: nervis
      # Renders every screen with nothing running, in a DOM shim, and fails if
      # one throws. That invariant — the page opens from disk with no services
      # up — was checked by a person opening a browser, which caught four
      # screen-blanking crashes in one week and missed a fifth: SIRVIS's
      # Recommendations screen threw whenever SIRVIS was down, and nobody
      # noticed because nobody ran the dashboard with SIRVIS off.
      - name: install the dashboard's one dependency
        run: npm ci --no-audit --no-fund
        working-directory: nervis
      - name: every screen renders with nothing running
        run: node tools/render_check.js
        working-directory: nervis
      # The four Python packages are gated at ruff's max-complexity 8 with zero
      # exemptions. This file — the largest single source in the repository and
      # the one with the fewest tests — had no equivalent, so "we hold
      # complexity to 8" was true of the code easiest to hold and silent about
      # the code that needed it most.
      - name: nothing in the dashboard is more tangled than the worst survivor
        run: node tools/complexity_check.js
        working-directory: nervis
      # `render_check` makes every fetch reject, so it exercises the *mock* path
      # of every live reader and none of the shaping. That is where the
      # complexity actually was — `runtimeSet` alone reached 30, essentially all
      # of it optional-field handling, and not one of those branches had ever
      # been executed by a check. This runs the readers against recorded
      # payloads (including a sparse one, which is what proves the fallbacks do
      # what their author believed) and fails if the shaped output moves.
      - name: the live readers still shape their payloads the same way
        run: node tools/shaping_check.js
        working-directory: nervis
      # The fresh-install world: services up and holding nothing. Neither of the
      # checks above covers it — `render_check` makes every fetch reject and the
      # shaping fixtures are populated — and six screens threw in it the first
      # time it ran. PITFALLS.md claimed this ran in CI for some time before it
      # did, which is its own lesson about prose.
      - name: every screen renders against live-but-empty services
        run: node tools/empty_world_check.js
        working-directory: nervis
      # A card that hardcodes its liveness class cannot report where its data
      # came from. A two-sided ratchet, so the count moving in either direction
      # is something a reader is told about.
      - name: no new card hardcodes its liveness
        run: node tools/liveness_check.js
        working-directory: nervis
      # Feeds every screen data that is trying to inject markup and fails if a
      # tag the page did not write reaches the output — the §25.2 requirement,
      # measured rather than asserted. Also fails the other way, on markup the
      # page escaped into text, which is what makes fixing the first half safe.
      - name: provider data cannot write markup into the page
        run: node tools/injection_check.js
        working-directory: nervis
      # Every screen has an address that survives a round trip, and an address
      # nobody can serve resolves to a real screen with the correction stated.
      # "Run & debug" is the view that catches an unencoded fragment.
      - name: every screen is addressable
        run: node tools/routing_check.js
        working-directory: nervis
      # A refused read, a broken service, an absent one, a body that is not
      # JSON and an adapter that threw are five different things to do next.
      # `live()` reported them as one, and the binding holding the answer was
      # never read.
      - name: request outcomes stay distinct
        run: node tools/outcome_check.js
        working-directory: nervis
      # The 409 EVENT_CURSOR_EXPIRED path is the reason this client is not an
      # EventSource, and it is also the one case that cannot be produced
      # against a running NERVIS without deleting rows from under it.
      - name: the event stream client resumes and refuses correctly
        run: node tools/stream_check.js
        working-directory: nervis
      # A repaint must not throw away what somebody was in the middle of. The
      # RAVIS Credentials fields carry no value= and no backing state, so a
      # pasted key exists nowhere but the DOM until Save is pressed.
      # **This step had no `working-directory` and the one below had two.**
      # Every other gate here runs from `nervis/`; this one ran from the
      # repository root, where `tools/` holds Python and no gate script at all,
      # so it has been failing on a missing file rather than checking anything.
      # A duplicated key on the next step is how it went unnoticed — the block
      # read as though the setting were on both.
      - name: a repaint keeps what the reader was doing
        working-directory: nervis
        run: node tools/preserve_check.js

      - name: Dashboard — attachments are filed and read under one id
        working-directory: nervis
        run: node tools/attachment_check.js

      # M21's centre, and the three promises a plausible screen breaks quietly:
      # every note says why it exists, a model-produced note names its model and
      # cost, and dismissal is per-note with no way to silence a class. Plus the
      # structural one — the page reads the centre and never writes to it, so a
      # muted or closed tab cannot lose the record.
      - name: Dashboard — the notification centre keeps its promises
        working-directory: nervis
        run: node tools/notification_check.js

      # M22's one sentence: no outcome is inferred from silence. The tempting
      # implementation — mark it declined when the next message arrives, or on a
      # timer — breaks nothing visibly and fills the record with refusals nobody
      # made. Driven through the real controls, because "the word appears in the
      # source" is the check that passes while the handler sits unreachable.
      - name: Dashboard — an offer's fate is recorded only when answered
        working-directory: nervis
        run: node tools/proposal_check.js

      # M23 puts a writable file beside the notes NERVIS shipped with. The risk
      # is authorship, not corruption: a note must arrive because somebody
      # confirmed one, carrying their sentence rather than a model's summary of
      # it, and a note the shipped files overrule must still be visible.
      - name: Dashboard — nothing is written to NERVIS's notes unasked
        working-directory: nervis
        run: node tools/learned_check.js

      # M24's confirmation buys an ordering, not authority. Three things must
      # stay true once the button is pressed: the steps run in order and one at
      # a time, a stop lands at a boundary and can say what had already
      # happened, and a failure halts the rest rather than continuing past it.
      - name: Dashboard — a plan runs in order, stops cleanly, halts on failure
        working-directory: nervis
        run: node tools/plan_check.js

      # M25 is the one feature that spends money without being asked to. The
      # switch has to govern — every other control inert while it is off — and
      # the ledger has to show the runs that produced nothing, which are the
      # ones somebody paying for it most wants to see.
      - name: Dashboard — the unattended-work switch governs
        working-directory: nervis
        run: node tools/background_check.js

      # The dashboard wires its controls through inline handlers, and nothing
      # checked that the name on the left still exists. Not the parse, which
      # sees a string; not check_dead_code, which looks for the opposite. A
      # refactor took `toggleNote` and left its onclick behind — the page
      # parsed, the control drew, and pressing it threw into a console nobody
      # was reading.
      - name: Dashboard — every control names a function that exists
        working-directory: nervis
        run: node tools/handler_check.js

      # §12 is a list of negatives, and the browser can break every one without
      # the server noticing: a button enabled for an external service, a verb
      # the page invents, a control that acts without a confirmation. The server
      # refuses all of it — and a screen that offers it anyway teaches somebody
      # their machine works differently than it does.
      - name: Dashboard — service control offers only what §12 allows
        working-directory: nervis
        run: node tools/supervision_check.js

      # **Eighteen of the twenty gate scripts, and the other two are not an
      # oversight.** `honesty_check.js` and `recovery_check.js` drive the page
      # against a live NERVIS on 127.0.0.1:8790 — `recovery_check` exists to
      # watch screens survive a service that stops answering, which needs a
      # service to stop. §14.5 above keeps this workflow off the network, so
      # both belong to a local run against a started ecosystem, not here.
      #
      # Written down because the gap looks like a mistake: it was "fixed" once,
      # which would have hung a CI job on a socket that never opens.

  nervis:
    name: nervis — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nervis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ../protocol
      - run: pip install -e ".[dev]"
      - name: lint and complexity
        run: ruff check src tests
      - name: strict types
        run: mypy
      - name: tests
        run: pytest
