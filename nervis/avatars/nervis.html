<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NERVIS — Control Plane</title>
<style>
  :root {
    --bg:      #080a10;
    --panel:   #10141d;
    --violet:  #7d6cff;   /* structure: rings, reticle, chrome */
    --violet-d:#4a3fa8;
    --cyan:    #34e6f2;   /* data, and a healthy peer — Clarvis's colour, on purpose */
    --amber:   #ffb648;   /* degraded */
    --red:     #ff5c6a;   /* unreachable */
    --ink:     #cdd6e3;
    --muted:   #67788c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse 70% 55% at 50% 38%, #121728 0%, var(--bg) 72%);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 32px;
    -webkit-font-smoothing: antialiased;
  }

  .stage { width: 340px; height: 340px; display: grid; place-items: center; position: relative; }
  /* ground glow instead of a floor shadow — it hovers in a room, it does not stand in one */
  .halo {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(125,108,255,.13) 0%, transparent 62%);
    animation: haloBreath 4s ease-in-out infinite;
  }
  @keyframes haloBreath {
    0%, 100% { transform: scale(1);    opacity: .9; }
    50%      { transform: scale(1.07); opacity: .55; }
  }

  svg.core { width: 320px; height: 320px; overflow: visible; display: block; }

  /* ——— structure ——— */
  .reticle { fill: none; stroke: var(--violet); stroke-opacity: .38; stroke-width: 1.2; }
  .tickring {
    fill: none; stroke: var(--violet); stroke-opacity: .5; stroke-width: 3;
    stroke-dasharray: 2.4 20.6;               /* 24 ticks around r=88 */
    transform-origin: 100px 100px;
  }
  .cardinal { stroke: var(--violet); stroke-opacity: .75; stroke-width: 1.8; stroke-linecap: round; }
  .bracket  { fill: none; stroke: var(--violet); stroke-opacity: .45; stroke-width: 1.6; stroke-linecap: round; }

  /* two counter-rotating rings: the thing is always working, even at rest */
  #ringA {
    fill: none; stroke: var(--violet); stroke-opacity: .55; stroke-width: 1.6;
    stroke-dasharray: 34 14; transform-origin: 100px 100px;
    animation: spin 26s linear infinite;
  }
  #ringB {
    fill: none; stroke: var(--cyan); stroke-opacity: .3; stroke-width: 2.4;
    stroke-dasharray: 62 68; stroke-linecap: round; transform-origin: 100px 100px;
    animation: spinBack 17s linear infinite;
  }
  #ringC {
    fill: none; stroke: var(--violet); stroke-opacity: .3; stroke-width: 1;
    transform-origin: 100px 100px; animation: spin 40s linear infinite;
  }
  @keyframes spin     { to { transform: rotate(360deg); } }
  @keyframes spinBack { to { transform: rotate(-360deg); } }

  /* ——— aperture ——— */
  /* A hexagonal iris. It is an eye without being a face — it opens, it does not look. */
  #hexOuter { fill: none; stroke: var(--violet); stroke-opacity: .8; stroke-width: 2;
              transform-origin: 100px 100px; animation: spinBack 30s linear infinite; }
  #hexInner { fill: none; stroke: var(--cyan); stroke-opacity: .6; stroke-width: 1.6;
              transform-origin: 100px 100px; animation: irisBreath 5s ease-in-out infinite; }
  @keyframes irisBreath {
    0%, 100% { transform: scale(1)    rotate(0deg);  stroke-opacity: .6; }
    50%      { transform: scale(.84)  rotate(24deg); stroke-opacity: 1; }
  }

  #coreGlow { fill: var(--violet); opacity: .22; transform-origin: 100px 100px;
              animation: corePulse 3.4s ease-in-out infinite; }
  #coreDot  { fill: var(--cyan); transform-origin: 100px 100px;
              filter: drop-shadow(0 0 10px rgba(52,230,242,.9));
              animation: corePulse 3.4s ease-in-out infinite; }
  @keyframes corePulse {
    0%, 100% { transform: scale(1);    opacity: 1; }
    50%      { transform: scale(1.22); opacity: .82; }
  }

  /* ——— peers ——— */
  /* Three satellites, because NERVIS observes exactly three services. */
  .sat        { transition: opacity .35s; }
  .sat .body  { fill: #0b0f18; stroke: var(--cyan); stroke-width: 2;
                filter: drop-shadow(0 0 7px rgba(52,230,242,.65)); transition: stroke .4s, filter .4s; }
  .sat .ping  { fill: none; stroke: var(--cyan); stroke-width: 1.4; opacity: 0; transform-box: fill-box;
                transform-origin: center; }
  .sat .tag   { fill: var(--cyan); font: 600 8px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                text-anchor: middle; letter-spacing: .5px; transition: fill .4s; }

  /* health overrides — the avatar is a status light, not a mood */
  .sat.degraded .body { stroke: var(--amber); filter: drop-shadow(0 0 9px rgba(255,182,72,.8)); }
  .sat.degraded .tag  { fill: var(--amber); }
  .sat.degraded       { animation: satWarn 1.1s ease-in-out infinite; }
  @keyframes satWarn { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .sat.down .body { stroke: var(--red); filter: drop-shadow(0 0 10px rgba(255,92,106,.85)); }
  .sat.down .tag  { fill: var(--red); }
  .sat.down       { animation: satFail .5s steps(1) infinite; }
  @keyframes satFail { 0%,60% { opacity: 1; } 61%,100% { opacity: .32; } }

  /* ——— links ——— */
  /* Dashed spokes. Idle they sit still; under load the dashes run inward. */
  .link { stroke: var(--cyan); stroke-width: 1.4; stroke-opacity: .3; fill: none;
          stroke-dasharray: 3 7; transition: stroke-opacity .35s; }

  /* ——— radar sweep ——— */
  #sweep { opacity: 0; transform-origin: 100px 100px; transition: opacity .3s; }

  /* ——— throughput bars: family resemblance to Clarvis's waveform, read as traffic ——— */
  #bars { opacity: 0; transition: opacity .3s; }
  #bars rect { fill: var(--cyan); rx: 1.5; transform-origin: center 158px;
               filter: drop-shadow(0 0 5px rgba(52,230,242,.7)); }

  /* ═══ speaking ═══ the core moves with the voice ═══

     `--pulse` is set by the host from the playing audio's amplitude, so this is
     the one animation here that is not on a timer: it is the waveform. At rest
     it is 0 and everything below collapses to its ordinary size, which is why
     no separate "not speaking" rule is needed. */
  :root { --pulse: 0; }
  .state-speaking #coreGlow { opacity: calc(.22 + var(--pulse) * .55); }
  .state-speaking #coreDot  { transform: scale(calc(1 + var(--pulse) * .85));
                              transform-origin: 100px 100px; animation-duration: .7s; }
  .state-speaking #hexInner { animation-duration: 1.1s; }
  .state-speaking #ringB    { stroke-opacity: calc(.35 + var(--pulse) * .5); }
  .state-speaking .link     { stroke-opacity: calc(.35 + var(--pulse) * .5);
                              animation: flow 1.1s linear infinite; }
  .state-speaking #bars     { opacity: 1; }
  /* Each bar takes a different share of the level, so the group reads as a
     waveform rather than as one block growing and shrinking together. */
  .state-speaking #bars rect { transform: scaleY(calc(.35 + var(--pulse) * 1.5)); }
  .state-speaking #bars rect:nth-child(2n)   { transform: scaleY(calc(.3 + var(--pulse) * 2.1)); }
  .state-speaking #bars rect:nth-child(3n)   { transform: scaleY(calc(.4 + var(--pulse) * 1.2)); }
  @media (prefers-reduced-motion: reduce) {
    .state-speaking #coreDot, .state-speaking #bars rect { transform: none; }
  }

  /* ═══ nominal ═══ everything slow, nothing to report */

  /* ═══ scanning ═══ radar sweeps, peers answer in turn */
  .state-scanning #sweep { opacity: 1; animation: spin 2.6s linear infinite; }
  .state-scanning #ringA { animation-duration: 9s; }
  .state-scanning .ping  { animation: ping 2.6s ease-out infinite; }
  .state-scanning #satC .ping { animation-delay: .0s;  }
  .state-scanning #satR .ping { animation-delay: .87s; }
  .state-scanning #satS .ping { animation-delay: 1.73s; }
  @keyframes ping {
    0%   { opacity: .9; transform: scale(.7); }
    70%  { opacity: 0;  transform: scale(2.6); }
    100% { opacity: 0;  transform: scale(2.6); }
  }

  /* ═══ routing ═══ traffic converging on the core */
  .state-routing .link { stroke-opacity: .95; animation: flow .9s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  .state-routing #ringB { animation-duration: 5s; stroke-opacity: .7; }
  .state-routing #coreDot { animation-duration: .8s; }
  .state-routing #bars { opacity: 1; }
  .state-routing #bars rect { animation: traffic .62s ease-in-out infinite; }
  #bars rect:nth-child(1) { animation-delay: -.31s; }
  #bars rect:nth-child(2) { animation-delay: -.08s; }
  #bars rect:nth-child(3) { animation-delay: -.45s; }
  #bars rect:nth-child(4) { animation-delay: -.19s; }
  #bars rect:nth-child(5) { animation-delay: -.52s; }
  @keyframes traffic { 0%,100% { transform: scaleY(.22); } 50% { transform: scaleY(1); } }

  /* ═══ analyzing ═══ the rings close in; attention contracts to one point */
  .state-analyzing #ringA { animation: spin 4s linear infinite, pullIn 2.8s ease-in-out infinite; }
  .state-analyzing #ringB { animation: spinBack 3s linear infinite, pullIn 2.8s ease-in-out infinite .1s; }
  .state-analyzing #ringC { animation: spin 6s linear infinite, pullIn 2.8s ease-in-out infinite .2s; }
  @keyframes pullIn {
    0%, 100% { transform: scale(1)   rotate(0deg); }
    50%      { transform: scale(.72) rotate(180deg); }
  }
  .state-analyzing #hexInner { animation-duration: 1.3s; }
  .state-analyzing #coreDot  { animation-duration: .55s; }
  .state-analyzing #coreGlow { opacity: .4; }
  .state-analyzing .link { stroke-opacity: .55; }

  /* ═══ degraded ═══ one peer is unwell; the chrome goes amber, the rest keeps working */
  .state-degraded .reticle,
  .state-degraded .tickring,
  .state-degraded .cardinal,
  .state-degraded .bracket { stroke: var(--amber); }
  .state-degraded #ringA   { stroke: var(--amber); stroke-opacity: .6; }
  .state-degraded #coreGlow{ fill: var(--amber); }

  /* ═══ critical ═══ a peer is gone; everything else deliberately keeps running */
  .state-critical .reticle,
  .state-critical .tickring,
  .state-critical .cardinal,
  .state-critical .bracket { stroke: var(--red); }
  .state-critical #ringA { stroke: var(--red); animation: spin 46s linear infinite; }
  .state-critical #ringB { stroke-opacity: .16; }
  .state-critical #coreGlow { fill: var(--red); opacity: .3; }
  .state-critical #coreDot  { fill: var(--red); filter: drop-shadow(0 0 12px rgba(255,92,106,.9));
                              animation: faultBlink 1.5s steps(1) infinite; }
  @keyframes faultBlink { 0%,70% { opacity: 1; } 71%,100% { opacity: .35; } }
  .state-critical #hexOuter { stroke: var(--red); stroke-opacity: .55; }

  /* ——— controls ——— */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-weight: 500; letter-spacing: .01em;
    color: var(--muted); background: var(--panel);
    border: 1px solid #1c2331; border-radius: 999px;
    padding: 9px 20px; cursor: pointer;
    transition: color .2s, border-color .2s, box-shadow .2s, transform .1s;
  }
  button:hover { color: var(--ink); border-color: #2b3547; }
  button:active { transform: translateY(1px); }
  button[aria-pressed="true"] {
    color: var(--violet); border-color: var(--violet-d);
    box-shadow: 0 0 0 1px rgba(125,108,255,.2), 0 0 18px -4px rgba(125,108,255,.6);
  }
  button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  /* Clarvis quips here. NERVIS reports. */
  .status {
    color: var(--muted); font-size: 12.5px; min-height: 1.5em; text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    max-width: 46ch; transition: opacity .25s;
  }
  .status b { color: var(--ink); font-weight: 500; }


  /* ——— idle drift ———
     Same 4s bob as Clarvis, and applied the same way: the chrome is a fixed frame,
     so only what it frames moves. Children keep their own transform-origins, so the
     spins and gauge fills compose on top of this untouched. */
  #float { animation: bob 4s ease-in-out infinite; transform-origin: 100px 100px; }
  @keyframes bob {
    0%, 100% { transform: translateY(0)     rotate(-1.1deg); }
    50%      { transform: translateY(-11px) rotate(1.1deg); }
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<div class="stage">
  <div class="halo"></div>
  <svg class="core state-nominal" id="nervis" viewBox="0 0 200 200" role="img"
       aria-label="NERVIS, a control-plane instrument watching three services">
    <defs>
      <radialGradient id="sweepFade" cx="0" cy="0" r="1"
                      gradientUnits="userSpaceOnUse" gradientTransform="translate(100 100) scale(76)">
        <stop offset="0"   stop-color="#7d6cff" stop-opacity=".55"/>
        <stop offset="1"   stop-color="#7d6cff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="coreFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#a99bff"/>
        <stop offset="1" stop-color="#3d3a8f"/>
      </linearGradient>
    </defs>

    <!-- HUD corner brackets -->
    <g class="bracket">
      <path d="M14 34 V14 H34"/>
      <path d="M166 14 H186 V34"/>
      <path d="M186 166 V186 H166"/>
      <path d="M34 186 H14 V166"/>
    </g>

    <!-- outer reticle + tick ring -->
    <circle class="reticle"  cx="100" cy="100" r="92"/>
    <circle class="tickring" cx="100" cy="100" r="88"/>
    <g class="cardinal">
      <path d="M100 6  v9"/>
      <path d="M100 185 v9"/>
      <path d="M6 100  h9"/>
      <path d="M185 100 h9"/>
    </g>

    <g id="float">
    <!-- radar sweep (scanning) -->
    <path id="sweep" d="M100 100 L100 24 A76 76 0 0 1 138 34.2 Z" fill="url(#sweepFade)"/>

    <!-- rotating rings -->
    <circle id="ringA" cx="100" cy="100" r="76"/>
    <circle id="ringB" cx="100" cy="100" r="62"/>
    <circle id="ringC" cx="100" cy="100" r="42"/>

    <!-- spokes: peer → core -->
    <g>
      <path class="link" d="M100 45  L100 82"/>
      <path class="link" d="M148 124 L114 108"/>
      <path class="link" d="M52 124  L86 108"/>
    </g>

    <!-- aperture -->
    <polygon id="hexOuter" points="100,74 122.5,87 122.5,113 100,126 77.5,113 77.5,87"/>
    <polygon id="hexInner" points="100,83 114.7,91.5 114.7,108.5 100,117 85.3,108.5 85.3,91.5"/>

    <!-- core -->
    <circle id="coreGlow" cx="100" cy="100" r="15"/>
    <circle id="coreDot"  cx="100" cy="100" r="5.5"/>

    <!-- peers: CLARVIS top, RAVIS lower-right, SIRVIS lower-left -->
    <g class="sat" id="satC">
      <circle class="ping" cx="100" cy="38" r="9"/>
      <circle class="body" cx="100" cy="38" r="9"/>
      <text class="tag" x="100" y="41.2">C</text>
    </g>
    <g class="sat" id="satR">
      <circle class="ping" cx="153.7" cy="131" r="9"/>
      <circle class="body" cx="153.7" cy="131" r="9"/>
      <text class="tag" x="153.7" y="134.2">R</text>
    </g>
    <g class="sat" id="satS">
      <circle class="ping" cx="46.3" cy="131" r="9"/>
      <circle class="body" cx="46.3" cy="131" r="9"/>
      <text class="tag" x="46.3" y="134.2">S</text>
    </g>

    <!-- throughput -->
    <g id="bars">
      <rect x="82"  y="150" width="4" height="16"/>
      <rect x="91"  y="150" width="4" height="16"/>
      <rect x="100" y="150" width="4" height="16"/>
      <rect x="109" y="150" width="4" height="16"/>
      <rect x="118" y="150" width="4" height="16"/>
    </g>
    </g>
  </svg>
</div>

<div class="controls" role="group" aria-label="Operational state">
  <button data-state="nominal"   aria-pressed="true">Nominal</button>
  <button data-state="scanning"  aria-pressed="false">Scanning</button>
  <button data-state="routing"   aria-pressed="false">Routing</button>
  <button data-state="analyzing" aria-pressed="false">Analyzing</button>
  <button data-state="degraded"  aria-pressed="false">Degraded</button>
  <button data-state="critical"  aria-pressed="false">Critical</button>
</div>

<p class="status" id="status">All peers healthy · <b>4 models resident</b> · nothing requires attention</p>

<script>
const svg    = document.getElementById('nervis');
const status = document.getElementById('status');

// Peer health per state: 'ok' | 'degraded' | 'down'.
// The avatar is a status light — health is data, not decoration.
const STATES = {
  nominal:   { peers: { C:'ok', R:'ok', S:'ok' },
               status: 'All peers healthy · <b>4 models resident</b> · nothing requires attention' },
  scanning:  { peers: { C:'ok', R:'ok', S:'ok' },
               status: 'Probing service endpoints · <b>2 of 3 responded</b> · negotiating capabilities' },
  routing:   { peers: { C:'ok', R:'ok', S:'ok' },
               status: 'trace <b>0x7F2A</b> · clarvis-agent → local coder · <b>41.2 tok/s</b>' },
  analyzing: { peers: { C:'ok', R:'ok', S:'ok' },
               status: 'Correlating <b>214 events</b> across 3 services · local-only analysis' },
  degraded:  { peers: { C:'ok', R:'degraded', S:'ok' },
               status: 'RAVIS degraded · <b>Anthropic error rate 37%</b> · traffic diverted to fallback' },
  critical:  { peers: { C:'ok', R:'down', S:'ok' },
               status: 'RAVIS unreachable · chat unavailable · <b>SIRVIS and Clarvis operational</b>' },
  /* NERVIS is talking. Distinct from `routing`, which is traffic passing
     through: this one is driven by real playback amplitude from the host, so
     the core moves with the voice rather than on a timer. */
  speaking:  { peers: { C:'ok', R:'ok', S:'ok' },
               status: 'Speaking · <b>voice synthesis</b> · playback drives this animation' }
};

function setState(name) {
  /* An unrecognised name used to throw on the next line and leave the avatar
     frozen in whatever state it was already in — silently, because the host
     calls this inside a try/catch. Falling back to nominal keeps it moving. */
  const s = STATES[name] || STATES.nominal;
  svg.setAttribute('class', 'core state-' + (STATES[name] ? name : 'nominal'));

  for (const [id, health] of Object.entries(s.peers)) {
    const sat = document.getElementById('sat' + id);
    sat.classList.remove('degraded', 'down');
    if (health !== 'ok') sat.classList.add(health);
  }

  status.style.opacity = 0;
  setTimeout(() => { status.innerHTML = s.status; status.style.opacity = 1; }, 200);

  document.querySelectorAll('.controls button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.state === name)));
}

/**
 * How loud the voice is right now, 0..1, from the host's audio analyser.
 *
 * Exposed as a function rather than read from anywhere, because this frame has
 * no access to the audio: the parent owns the element, the AudioContext and the
 * animation frame, and hands over one number. Everything it drives is CSS, so a
 * host that never calls this simply gets the resting look.
 */
window.setPulse = function (level) {
  const clamped = Math.max(0, Math.min(1, Number(level) || 0));
  document.documentElement.style.setProperty('--pulse', clamped.toFixed(3));
};

document.querySelectorAll('.controls button')
  .forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));

setState('nominal');
</script>
</body>
</html>
