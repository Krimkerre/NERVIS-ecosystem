<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar — Teal Menace</title>
<style>
  :root {
    --bg: var(--vscode-editor-background, #0a0d12);
    --panel: var(--vscode-sideBar-background, #12161f);
    /* Miku's signature teal, plus the two hair tones it is built from */
    --teal:      #39c5bb;
    --teal-br:   #6ff6e8;
    --teal-dim:  #1b7d78;
    /* the "she is annoyed with you" register */
    --pink:      #ff5fa2;
    --pink-hot:  #ff2f77;
    --ink: var(--vscode-foreground, #cdd6e3);
    --muted: var(--vscode-descriptionForeground, #67788c);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse 80% 60% at 50% 30%, #131a24 0%, var(--bg) 70%);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 32px;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    width: 340px; height: 400px;
    display: grid; place-items: center;
    position: relative;
  }
  /* floor shadow, breathes with the bob */
  .shadow {
    position: absolute; bottom: 2px; left: 50%;
    width: 130px; height: 18px; margin-left: -65px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 70%);
    animation: shadowPulse 4s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: scale(1);   opacity: .55; }
    50%      { transform: scale(.86); opacity: .35; }
  }

  svg.diva { width: 330px; height: 330px; overflow: visible; display: block; }

  /* ——— accent colour is a per-state variable ———
     Every glow, stroke and rim reads from --accent / --accent-soft, so one state
     class recolours the whole face: teal when she is fine with you, pink when
     she is decidedly not. The overrides are qualified with `svg` so they
     out-specify the base `svg.diva` declaration. */
  svg.diva { --accent: var(--teal); --accent-soft: rgba(57,197,187,.55); }
  svg.state-annoyed   { --accent: var(--pink);     --accent-soft: rgba(255,95,162,.6); }
  svg.state-flustered { --accent: var(--pink-hot); --accent-soft: rgba(255,47,119,.6); }
  svg.state-mischief  { --accent: var(--teal-br);  --accent-soft: rgba(111,246,232,.6); }

  /* idle float — on a wrapper group so expression transforms stay independent */
  #float { animation: bob 4s ease-in-out infinite; transform-origin: 100px 100px; }
  @keyframes bob {
    0%, 100% { transform: translateY(0)      rotate(-1.1deg); }
    50%      { transform: translateY(-11px)  rotate(1.1deg); }
  }

  /* ——— twintails ———
     Hair lags behind the head: same 4s period as the bob, quarter-second delay,
     so the tails always look dragged rather than driven. */
  #tailL { transform-origin: 44px 64px; animation: swayL 4s ease-in-out -.25s infinite; }
  #tailR { transform-origin: 156px 64px; animation: swayR 4s ease-in-out -.25s infinite; }
  @keyframes swayL {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg);  }
  }
  @keyframes swayR {
    0%, 100% { transform: rotate(3deg);  }
    50%      { transform: rotate(-3deg); }
  }
  /* annoyed: the hair bristles — tiny, fast, involuntary */
  .state-annoyed #tailL { animation: bristleL .16s ease-in-out infinite; }
  .state-annoyed #tailR { animation: bristleR .16s ease-in-out infinite; }
  @keyframes bristleL { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(-4deg); } }
  @keyframes bristleR { 0%,100% { transform: rotate(6deg);  } 50% { transform: rotate(4deg);  } }
  /* mischief: a wide, delighted swish */
  .state-mischief #tailL { animation: swayL 1.5s ease-in-out infinite; }
  .state-mischief #tailR { animation: swayR 1.5s ease-in-out infinite; }
  /* singing: gentle, on the beat */
  .state-singing #tailL, .state-singing #tailR { animation-duration: 2s; }

  /* ——— ahoge (the rogue hair strand) ———
     The tell. It flicks when she is amused and stands rigid when she is caught out. */
  #ahoge { fill: none; stroke: url(#hairGrad); stroke-width: 5.5; stroke-linecap: round;
           transform-origin: 100px 22px; animation: ahogeIdle 7s ease-in-out infinite; }
  @keyframes ahogeIdle {
    0%, 62%, 100% { transform: rotate(0); }
    68%           { transform: rotate(-16deg); }
    74%           { transform: rotate(9deg); }
    80%           { transform: rotate(0); }
  }
  .state-teasing  #ahoge { animation: ahogeWag .9s ease-in-out infinite; }
  .state-mischief #ahoge { animation: ahogeWag .6s ease-in-out infinite; }
  @keyframes ahogeWag {
    0%, 100% { transform: rotate(-13deg); }
    50%      { transform: rotate(13deg);  }
  }
  .state-annoyed   #ahoge { animation: ahogeTwitch .25s steps(2) infinite; }
  @keyframes ahogeTwitch { 0% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }
  .state-flustered #ahoge { animation: none; transform: rotate(0) scaleY(1.15); }

  /* ——— eyes ——— */
  /* Lids are rects sliding down over the eye; a full close is a blink or a wink. */
  .lid { fill: #171d28; }
  .lidbot { fill: #171d28; transition: transform .25s cubic-bezier(.34,1.4,.5,1); }
  #lidL, #lidR { animation: blink 5.4s infinite; }
  #lidR { animation-delay: .04s; }
  @keyframes blink {
    0%, 93%, 100% { transform: translateY(0); }
    95.5%         { transform: translateY(30px); }
    98%           { transform: translateY(0); }
  }
  /* a wink is a held close — do not let the blink cycle fight it */
  .state-teasing #lidL,
  .state-singing .lid,
  .state-flustered .lid { animation: none; }

  /* lower lids ride up to meet the upper ones for the smug / annoyed squint.
     Paired with the lid values in STATES so a slit of iris always survives. */
  .state-annoyed  .lidbot { transform: translateY(-6px); }
  .state-mischief .lidbot { transform: translateY(-8px); }
  .state-teasing  .lidbot { transform: translateY(-4px); }
  .state-neutral  .lidbot { transform: translateY(-3px); }

  .pupils { transition: transform .32s cubic-bezier(.4,.9,.3,1); }
  /* scale each iris in place, not about the two-eye bounding box */
  .iris { transform-box: fill-box; transform-origin: center;
          transition: transform .18s; }
  .lash { stroke: #0c1018; stroke-width: 5; stroke-linecap: round; fill: none; }

  /* closed-eye arcs: a shut lid alone reads as "asleep", the ^ ^ arc reads as
     "pleased". Used for singing (both eyes) and the teasing wink (one eye). */
  .happyeye { display: none; fill: none; stroke: var(--accent); stroke-width: 4;
              stroke-linecap: round; filter: drop-shadow(0 0 5px var(--accent-soft)); }
  .state-singing .happyeye { display: block; }
  .state-teasing #eyeArcL  { display: block; }

  /* ——— brows ———
     Drawn over the bangs on purpose: anime convention, and they carry most of
     the mood. Overshoot easing makes every mood change land a little hard. */
  .brow {
    stroke: var(--accent); stroke-width: 4.6; stroke-linecap: round; fill: none;
    filter: drop-shadow(0 0 4px var(--accent-soft));
    transition: transform .28s cubic-bezier(.34,1.6,.5,1), stroke .4s;
  }
  #browL { transform-origin: 75px 62px; }
  #browR { transform-origin: 125px 62px; }
  /* neutral: sporadic single-brow raise — she is never fully at rest */
  .state-neutral #browR { animation: browTwitch 6.5s ease-in-out infinite; }
  @keyframes browTwitch {
    0%, 66%, 100% { transform: translateY(-4px) rotate(-6deg); }
    73%           { transform: translateY(-11px) rotate(-12deg); }
    86%           { transform: translateY(-11px) rotate(-12deg); }
  }
  /* annoyed: a fast tension tremor in both brows */
  .state-annoyed .brow { animation: browTremor .18s ease-in-out infinite alternate; }
  @keyframes browTremor { from { translate: 0 0; } to { translate: 0 -1.4px; } }

  /* ——— mouth ——— */
  .mouth { stroke: var(--accent); stroke-width: 4.5; stroke-linecap: round;
           stroke-linejoin: round; fill: none;
           filter: drop-shadow(0 0 5px var(--accent-soft));
           transition: stroke .4s; transform-origin: 100px 120px; }
  /* neutral: the smirk twitches every few seconds, unprompted */
  .state-neutral .mouth { animation: smirkTwitch 6.5s ease-in-out infinite; }
  @keyframes smirkTwitch {
    0%, 70%, 100% { transform: none; }
    76%, 84%      { transform: translateX(2px) rotate(-3deg); }
  }

  /* tongue — teasing only, because that is the entire point of it */
  #tongue { display: none; }
  .state-teasing #tongue { display: block; }

  /* talking / singing waveform replaces the mouth stroke */
  .wave { display: none; }
  .state-talking .mouth, .state-singing .mouth { display: none; }
  .state-talking .wave,  .state-singing .wave  { display: block; }
  .wave rect { fill: var(--accent); rx: 2;
               filter: drop-shadow(0 0 6px var(--accent-soft));
               animation: talk .48s ease-in-out infinite; transform-origin: center 120px; }
  .wave rect:nth-child(1) { animation-delay: -.34s; animation-duration: .43s; }
  .wave rect:nth-child(2) { animation-delay: -.17s; animation-duration: .57s; }
  .wave rect:nth-child(3) { animation-delay: -.42s; animation-duration: .38s; }
  .wave rect:nth-child(4) { animation-delay: -.08s; animation-duration: .61s; }
  .wave rect:nth-child(5) { animation-delay: -.25s; animation-duration: .47s; }
  @keyframes talk {
    0%, 100% { transform: scaleY(.25); }
    50%      { transform: scaleY(1); }
  }
  /* singing holds notes longer than speech does */
  .state-singing .wave rect:nth-child(n) { animation-duration: .9s; }

  /* ——— talking ———
     The waveform alone reads as a speaker grille, not as a person talking, so
     the whole avatar performs: an uneven nod, brows punctuating the sentence,
     hair keeping up, and bars that no longer share one tempo. */
  .state-talking #float { animation: chatter 2.6s ease-in-out infinite; }
  @keyframes chatter {
    0%, 100% { transform: translateY(0)     rotate(-1.4deg); }
    22%      { transform: translateY(-8px)  rotate(1deg);    }
    38%      { transform: translateY(-3px)  rotate(-.6deg);  }
    60%      { transform: translateY(-11px) rotate(1.8deg);  }
    78%      { transform: translateY(-5px)  rotate(-1deg);   }
  }
  .state-talking #tailL, .state-talking #tailR { animation-duration: 2.6s; }
  .state-talking #ahoge { animation: ahogeChat 1.3s ease-in-out infinite; }
  @keyframes ahogeChat {
    0%, 100% { transform: rotate(-9deg); }
    50%      { transform: rotate(7deg);  }
  }
  /* `translate`, not `transform`, so the per-state brow pose set in JS survives */
  .state-talking #browR { animation: browPunct 1.9s ease-in-out infinite; }
  .state-talking #browL { animation: browPunct 1.9s ease-in-out -.3s infinite; }
  @keyframes browPunct {
    0%, 100% { translate: 0 0; }
    30%      { translate: 0 -5px; }
    55%      { translate: 0 1.5px; }
  }
  /* eyes wander the way people's do mid-sentence, and she blinks more */
  .state-talking .pupils { animation: talkGlance 4.2s ease-in-out infinite; }
  @keyframes talkGlance {
    0%, 22%  { transform: translate(0,0); }
    38%      { transform: translate(-4px,-2px); }
    58%      { transform: translate(3px,1px); }
    76%, 100%{ transform: translate(0,0); }
  }
  .state-talking .lid { animation-duration: 3.4s; }

  /* ——— blush ———
     On for teasing (she is enjoying herself), singing, and flustered (she is not). */
  .blush { fill: url(#blushGrad); opacity: 0; transition: opacity .35s; }
  .state-teasing .blush   { opacity: .3; }
  .state-singing .blush   { opacity: .24; }
  .state-flustered .blush { opacity: .6; animation: blushThrob .8s ease-in-out infinite; }
  @keyframes blushThrob { 0%,100% { opacity: .5; } 50% { opacity: .8; } }

  /* ——— anger vein (＃) ———
     The one piece of pure anime shorthand here. Pops on the temple, pulses,
     and reads instantly as "she is out of patience". */
  #vein { opacity: 0; stroke: var(--pink-hot); stroke-width: 3; stroke-linecap: round;
          fill: none; transform-origin: 141px 44px;
          filter: drop-shadow(0 0 6px rgba(255,47,119,.85)); }
  .state-annoyed #vein { animation: veinPop .7s ease-out infinite; }
  @keyframes veinPop {
    0%   { opacity: 0; transform: scale(.6); }
    15%  { opacity: 1; transform: scale(1.12); }
    45%  { opacity: 1; transform: scale(1); }
    100% { opacity: .25; transform: scale(1.02); }
  }

  /* ——— sparkles (mischief) ———
     Whatever she just did, she is very pleased about it. */
  #sparks { opacity: 0; fill: var(--teal-br); transition: opacity .3s;
            filter: drop-shadow(0 0 6px rgba(111,246,232,.9)); }
  .state-mischief #sparks { opacity: 1; }
  #sparks > * { transform-box: fill-box; transform-origin: center;
                animation: twinkle 1.5s ease-in-out infinite; }
  #sparks > *:nth-child(2) { animation-delay: .5s; }
  #sparks > *:nth-child(3) { animation-delay: 1s; }
  #sparks > *:nth-child(4) { animation-delay: .25s; }
  @keyframes twinkle {
    0%, 100% { transform: scale(.3) rotate(0);     opacity: .2; }
    50%      { transform: scale(1)  rotate(45deg); opacity: 1; }
  }

  /* ——— music notes (singing) ——— */
  #notes { opacity: 0; fill: var(--teal-br); transition: opacity .3s;
           filter: drop-shadow(0 0 7px rgba(111,246,232,.8)); }
  .state-singing #notes { opacity: 1; }
  #notes > * { transform-box: fill-box; transform-origin: center;
               animation: noteFloat 2.6s ease-in-out infinite; }
  #notes > *:nth-child(2) { animation-delay: -.9s; }
  #notes > *:nth-child(3) { animation-delay: -1.8s; }
  @keyframes noteFloat {
    0%   { opacity: 0; transform: translateY(10px) rotate(-8deg) scale(.8); }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-34px) rotate(12deg) scale(1.05); }
  }

  /* ——— glow / accents ——— */
  #rim { stroke: var(--accent); transition: stroke .4s, filter .4s;
         filter: drop-shadow(0 0 3px var(--accent-soft)); }
  .state-mischief #rim { animation: glowPulse 1.4s ease-in-out infinite; }
  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 3px var(--accent-soft));  stroke-opacity: .7; }
    50%      { filter: drop-shadow(0 0 20px var(--accent));      stroke-opacity: 1; }
  }
  /* headset ring lights follow the mood colour */
  .canlight { fill: var(--accent); transition: fill .4s;
              filter: drop-shadow(0 0 7px var(--accent-soft)); }
  .state-talking .canlight, .state-singing .canlight {
    animation: canPulse .48s ease-in-out infinite alternate; }
  @keyframes canPulse { from { opacity: .5; } to { opacity: 1; } }

  /* ——— thinking ——— */
  /* eyes drift side to side; dots trail off like she is drafting a comeback */
  .state-thinking .pupils { animation: glance 2.6s ease-in-out infinite; }
  @keyframes glance {
    0%, 12%   { transform: translate(0,0); }
    30%, 46%  { transform: translate(-8px,-3px); }
    64%, 80%  { transform: translate(8px,-3px); }
    96%, 100% { transform: translate(0,0); }
  }
  #dots { opacity: 0; transition: opacity .3s; }
  .state-thinking #dots { opacity: 1; }
  #dots circle { fill: var(--accent); animation: dot 1.4s ease-in-out infinite; }
  #dots circle:nth-child(2) { animation-delay: .18s; }
  #dots circle:nth-child(3) { animation-delay: .36s; }
  @keyframes dot {
    0%, 100% { opacity: .2; transform: translateY(0); }
    50%      { opacity: 1;  transform: translateY(-4px); }
  }

  /* ——— flustered ———
     Not shock at the world — shock at being caught. Everything opens, the pupils
     shrink, the blush goes nuclear, and the composure leaves the building. */
  .state-flustered .iris { animation: quiver .15s ease-in-out infinite; }
  @keyframes quiver {
    0%, 100% { transform: scale(.62) translate(0, 0); }
    50%      { transform: scale(.62) translate(.9px, -.9px); }
  }

  /* dropped jaw replaces the mouth stroke */
  #jaw { display: none; transform-origin: 100px 118px; }
  .state-flustered .mouth { display: none; }
  .state-flustered .wave  { display: none; }
  .state-flustered #jaw   { display: block; animation: gasp 1.4s ease-in-out infinite; }
  @keyframes gasp {
    0%, 100% { transform: scaleY(1)    scaleX(1); }
    50%      { transform: scaleY(1.18) scaleX(.94); }
  }

  /* recoil: jolts up and back, then hovers unsteadily — replaces the idle bob */
  .state-flustered #float { animation: jolt 2.4s cubic-bezier(.2,.9,.3,1) infinite; }
  @keyframes jolt {
    0%   { transform: translateY(0)     rotate(0);      }
    7%   { transform: translateY(-19px) rotate(-4.5deg) scale(1.035); }
    16%  { transform: translateY(-9px)  rotate(3.5deg); }
    26%  { transform: translateY(-14px) rotate(-2deg);  }
    40%  { transform: translateY(-8px)  rotate(1.4deg); }
    70%  { transform: translateY(-12px) rotate(-1deg);  }
    100% { transform: translateY(0)     rotate(0);      }
  }
  /* tails fly out with the recoil */
  .state-flustered #tailL { animation: flailL .5s ease-in-out infinite; }
  .state-flustered #tailR { animation: flailR .5s ease-in-out infinite; }
  @keyframes flailL { 0%,100% { transform: rotate(-11deg); } 50% { transform: rotate(-2deg); } }
  @keyframes flailR { 0%,100% { transform: rotate(11deg);  } 50% { transform: rotate(2deg);  } }

  /* shock lines bursting off the head */
  #shock { opacity: 0; stroke: var(--pink-hot); stroke-width: 4; stroke-linecap: round;
           transform-origin: 100px 88px;
           filter: drop-shadow(0 0 6px rgba(255,47,119,.8)); }
  .state-flustered #shock { animation: burst .9s ease-out infinite; }
  @keyframes burst {
    0%   { opacity: 0; transform: scale(.55); }
    18%  { opacity: 1; transform: scale(1);   }
    100% { opacity: 0; transform: scale(1.3); }
  }

  /* one bead of coolant, for form's sake */
  #sweat { opacity: 0; }
  .state-flustered #sweat, .state-annoyed #sweat { animation: bead 2.4s ease-in .3s infinite; }
  @keyframes bead {
    0%       { opacity: 0;  transform: translateY(0); }
    12%      { opacity: .9; transform: translateY(0); }
    55%      { opacity: .9; transform: translateY(26px); }
    70%, 100%{ opacity: 0;  transform: translateY(30px); }
  }

  /* ——— glitch / corruption ———
     Three states are "not running clean": annoyed (she is fraying), mischief
     (she is the one doing the tampering) and flustered (something got out).
     Two cheap layers do all of it, no filters on the whole tree except the
     brief chromatic split:
       #glitch      — wraps the entire avatar, jumps it in hard steps()
       #glitchbands — tear lines sliding down the face, clipped to its shape */

  /* whole-avatar displacement. steps(1) keeps every jump instant — an eased
     glitch reads as a wobble, not as corruption. */
  .state-annoyed #glitch { animation: jitter .11s steps(1) infinite; }
  @keyframes jitter {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(-1px, .5px); }
    100% { transform: translate(1px, 0); }
  }

  /* mischief: clean most of the time, then one deliberate slip. She is not
     malfunctioning — she is doing it on purpose, so it lands and stops. */
  .state-mischief #glitch { animation: slip 3.4s steps(1) infinite; }
  @keyframes slip {
    0%, 78%   { transform: none; filter: none; }
    80%       { transform: translate(-5px, 1px) skewX(4deg);
                filter: drop-shadow(3px 0 0 rgba(255,95,162,.75)); }
    83%       { transform: translate(4px, -1px) skewX(-3deg);
                filter: drop-shadow(-3px 0 0 rgba(57,197,187,.8)); }
    86%, 100% { transform: none; filter: none; }
  }

  /* flustered: a full signal fault — channel split, stutter, dropped frames */
  .state-flustered #glitch { animation: chroma .19s steps(1) infinite; }
  @keyframes chroma {
    0%   { transform: translate(0,0);      filter: none; opacity: 1; }
    25%  { transform: translate(-2.5px,0); opacity: .9;
           filter: drop-shadow(3px 0 0 rgba(255,47,119,.85))
                   drop-shadow(-3px 0 0 rgba(57,197,187,.85)); }
    50%  { transform: translate(2px,-1px); opacity: 1;
           filter: drop-shadow(-2px 0 0 rgba(255,47,119,.7)); }
    75%  { transform: translate(0,1px);    opacity: .82; filter: none; }
    100% { transform: translate(-1px,0);   opacity: 1;
           filter: drop-shadow(2px 0 0 rgba(57,197,187,.6)); }
  }

  /* tear lines. Hidden unless something is wrong; each rect runs the same
     keyframes on its own delay so the face is never torn in one place twice. */
  #glitchbands { display: none; fill: var(--accent); mix-blend-mode: screen; }
  .state-annoyed #glitchbands,
  .state-mischief #glitchbands,
  .state-flustered #glitchbands { display: block; }
  #glitchbands rect { animation: tear 1.8s steps(1) infinite; }
  #glitchbands rect:nth-child(2) { animation-delay: -.7s; }
  #glitchbands rect:nth-child(3) { animation-delay: -1.25s; }
  .state-mischief  #glitchbands rect { animation-duration: 3.4s; }
  .state-flustered #glitchbands rect { animation-duration: .85s; }
  @keyframes tear {
    0%        { transform: translate(-6px, 26px); opacity: 0; }
    6%        { transform: translate(-6px, 26px); opacity: .42; }
    14%       { transform: translate(7px, 58px);  opacity: .26; }
    22%       { transform: translate(-4px, 44px); opacity: .5; }
    30%       { transform: translate(5px, 96px);  opacity: .2; }
    38%       { transform: translate(-7px, 118px); opacity: .38; }
    46%, 100% { transform: translate(0, 130px);   opacity: 0; }
  }

  /* ——— background corruption ———
     The glitch is not contained to her: stray data blocks and scan tears fire
     in the empty space around the avatar, behind the chrome frame. Same three
     states, same steps(1) rule — nothing here eases. */
  #bgglitch { display: none; }
  .state-annoyed #bgglitch,
  .state-mischief #bgglitch,
  .state-flustered #bgglitch { display: block; }

  #bgglitch .blk { fill: var(--accent); animation: bgblock 1.6s steps(1) infinite; }
  #bgglitch .blk:nth-of-type(2n) { fill: var(--pink); }
  #bgglitch .blk:nth-of-type(2) { animation-delay: -.35s; }
  #bgglitch .blk:nth-of-type(3) { animation-delay: -.8s;  }
  #bgglitch .blk:nth-of-type(4) { animation-delay: -1.1s; }
  #bgglitch .blk:nth-of-type(5) { animation-delay: -.55s; }
  #bgglitch .blk:nth-of-type(6) { animation-delay: -1.35s; }
  @keyframes bgblock {
    0%, 100% { opacity: 0; }
    4%       { opacity: .55; transform: translateX(0); }
    9%       { opacity: 0;   transform: translateX(9px); }
    13%      { opacity: .35; transform: translateX(9px); }
    18%      { opacity: 0;   transform: translateX(-6px); }
    52%      { opacity: .45; transform: translateX(-6px); }
    56%      { opacity: 0; }
  }

  /* full-width tears sweeping the backdrop */
  #bgglitch .bgtear { fill: var(--accent); opacity: 0;
                      animation: bgtear 2.4s steps(1) infinite; }
  #bgglitch .bgtear:last-child { animation-delay: -1.3s; }
  @keyframes bgtear {
    0%        { transform: translateY(-16px); opacity: 0; }
    5%        { transform: translateY(-16px); opacity: .3; }
    16%       { transform: translateY(48px);  opacity: .16; }
    27%       { transform: translateY(104px); opacity: .28; }
    38%       { transform: translateY(172px); opacity: .12; }
    46%, 100% { transform: translateY(214px); opacity: 0; }
  }

  /* per-state tempo: annoyed frays, mischief is sparse and deliberate,
     flustered is a full fault */
  .state-mischief  #bgglitch .blk    { animation-duration: 3.4s; }
  .state-mischief  #bgglitch .bgtear { animation-duration: 4.2s; }
  .state-flustered #bgglitch .blk    { animation-duration: .7s; }
  .state-flustered #bgglitch .bgtear { animation-duration: 1s; }

  /* scanline wash over the whole stage, not just the SVG box */
  .stage::after {
    content: ""; position: absolute; inset: -10%; pointer-events: none;
    opacity: 0; transition: opacity .3s;
    background: repeating-linear-gradient(0deg,
                rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 45%, transparent 88%);
            mask-image: radial-gradient(ellipse at center, #000 45%, transparent 88%);
  }
  .stage:has(.state-annoyed)::after,
  .stage:has(.state-mischief)::after,
  .stage:has(.state-flustered)::after {
    opacity: 1; animation: scanroll 5s linear infinite;
  }
  @keyframes scanroll { to { transform: translateY(3px); } }

  /* ——— chrome ———
     Shared ecosystem frame: reticle, ticking ring, crosshairs, corner brackets.
     Sits OUTSIDE #float so it never inherits the bob — she drifts, the
     instrument around her holds still. */
  #reticle  { fill: none; stroke: var(--accent); stroke-opacity: .3; stroke-width: 1.2;
              transition: stroke .4s; }
  #tickring { fill: none; stroke: var(--accent); stroke-opacity: .42; stroke-width: 3;
              stroke-dasharray: 2.4 20.6; transform-origin: 100px 100px;
              animation: chromeSpin 32s linear infinite; transition: stroke .4s; }
  .cardinal { stroke: var(--accent); stroke-opacity: .6; stroke-width: 1.8;
              stroke-linecap: round; transition: stroke .4s; }
  .cbracket { fill: none; stroke: var(--accent); stroke-opacity: .36; stroke-width: 1.6;
              stroke-linecap: round; transition: stroke .4s; }
  @keyframes chromeSpin { to { transform: rotate(360deg); } }

  /* Ring speed reads as effort, not as a second thing to interpret. */
  .state-thinking  #tickring { animation-duration: 11s; }
  .state-talking   #tickring { animation-duration: 22s; }
  .state-singing   #tickring { animation-duration: 8s;  }
  .state-mischief  #tickring { animation-duration: 9s;  }
  .state-annoyed   #tickring { animation-duration: 4s;  }
  .state-flustered #tickring { animation-duration: 3s;  }
  .state-mischief #reticle { animation: chromeFlare 1.4s ease-in-out infinite; }
  @keyframes chromeFlare {
    0%, 100% { stroke-opacity: .3; }
    50%      { stroke-opacity: .9; filter: drop-shadow(0 0 10px var(--accent-soft)); }
  }

  /* ——— controls ——— */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
              max-width: 460px; }
  button {
    font: inherit; font-weight: 500; letter-spacing: .01em;
    color: var(--muted); background: var(--panel);
    border: 1px solid #202836; border-radius: 999px;
    padding: 9px 20px; cursor: pointer;
    transition: color .2s, border-color .2s, box-shadow .2s, transform .1s;
  }
  button:hover { color: var(--ink); border-color: #2e3a4d; }
  button:active { transform: translateY(1px); }
  button[aria-pressed="true"] {
    color: var(--teal); border-color: var(--teal-dim);
    box-shadow: 0 0 0 1px rgba(57,197,187,.18), 0 0 18px -4px rgba(57,197,187,.55);
  }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .quip { color: var(--muted); font-size: 13px; min-height: 1.5em; text-align: center;
          font-style: italic; max-width: 38ch; transition: opacity .25s; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    #glitchbands, #bgglitch { display: none !important; }
    .stage::after { display: none; }
  }
</style>
</head>
<body>

<p class="quip" id="quip">Oh good, you're back. I was so bored. Truly. Devastated.</p>

<script>
const svg  = document.getElementById('diva');
const quip = document.getElementById('quip');
const el   = id => document.getElementById(id);

// Per-state geometry.
// Upper lid y: 44 = wide open, 56 = neutral, 52-54 = squint (paired with the
// raised lower lid in CSS), 70-72 = fully closed.
// lidL and lidR are separate so a wink is just an asymmetric pair.
const STATES = {
  neutral:   { lidL: 62, lidR: 62,
               browL: 'translateY(3px) rotate(5deg)',
               browR: 'translateY(-4px) rotate(-6deg)',
               mouth: 'M86 120 q13 6 28 -9', pupils: 'translate(4px,-1px)',
               quip: "Oh good, you're back. I was so bored. Truly. Devastated." },

  // one eye shut, brow up on the open side, grin dragged off-centre, tongue out
  teasing:   { lidL: 72, lidR: 56,
               browL: 'translateY(2px) rotate(6deg)',
               browR: 'translateY(-12px) rotate(-12deg)',
               mouth: 'M84 115 q15 13 30 -7', pupils: 'translate(4px,-2px)',
               quip: "You typed that with your whole chest, huh. Adorable." },

  // brows down and in, hard squint, frown — plus the vein and the bristling hair
  annoyed:   { lidL: 54, lidR: 54,
               browL: 'translateY(9px) rotate(15deg)',
               browR: 'translateY(9px) rotate(-15deg)',
               mouth: 'M87 123 q13 -9 26 1', pupils: 'translate(0,-3px)',
               quip: "I heard you the first time. And the second. And the—" },

  // narrowed, delighted, cat-mouth. Something has already been done to your repo.
  mischief:  { lidL: 52, lidR: 52,
               browL: 'translateY(-6px) rotate(9deg)',
               browR: 'translateY(-6px) rotate(-9deg)',
               mouth: 'M86 120 q7 -10 14 0 q7 -10 14 0', pupils: 'translate(5px,-3px)',
               quip: "I renamed all your variables. Sleep well~" },

  thinking:  { lidL: 58, lidR: 58, browL: 'translateY(-4px)', browR: 'translateY(-2px)',
               mouth: 'M89 120 q11 3 22 -3', pupils: 'none',
               quip: "Give me a second. Not for you — I just like the suspense." },

  talking:   { lidL: 52, lidR: 52,
               browL: 'translateY(-3px)', browR: 'translateY(-7px) rotate(-7deg)',
               mouth: 'M86 118 q14 7 28 -3', pupils: 'none',
               quip: "—and that is why your loop runs 400,000 times. You're welcome." },

  // eyes happily shut, brows up: the only state where she is unguardedly pleased
  singing:   { lidL: 70, lidR: 70,
               browL: 'translateY(-9px) rotate(-4deg)',
               browR: 'translateY(-9px) rotate(4deg)',
               mouth: 'M86 116 q14 12 28 0', pupils: 'none',
               quip: "♪ nine nine nine nine nine nine nine ♪" },

  // caught out, not shocked at you: lids clear of the sockets, brows at the ceiling
  flustered: { lidL: 44, lidR: 44,
               browL: 'translateY(-11px) rotate(-10deg)',
               browR: 'translateY(-12px) rotate(11deg)',
               mouth: 'M86 118 q14 7 28 -3', pupils: 'none',
               quip: "W-wait— you weren't supposed to read that log." }
};

function setState(name) {
  /* An unrecognised name used to throw on the next line and leave her frozen —
     silently, because the host calls this inside a try/catch. */
  const s = STATES[name] || STATES.neutral;
  svg.className.baseVal = 'diva state-' + (STATES[name] ? name : 'neutral');

  el('lidL').setAttribute('y', s.lidL);
  el('lidR').setAttribute('y', s.lidR);
  el('browL').style.transform = s.browL;
  el('browR').style.transform = s.browR;
  el('mouth').setAttribute('d', s.mouth);
  // thinking drives the pupils via CSS keyframes; don't fight it with an inline transform
  document.querySelector('.pupils').style.transform =
    name === 'thinking' ? '' : s.pupils;

  quip.style.opacity = 0;
  setTimeout(() => { quip.textContent = s.quip; quip.style.opacity = 1; }, 200);

  document.querySelectorAll('.controls button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.state === name)));
}

document.querySelectorAll('.controls button')
  .forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));

setState('neutral');
</script>
</body>
</html>
