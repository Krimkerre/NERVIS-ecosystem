<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarvis — Desktop Butler</title>
<style>
  :root {
    --bg: var(--vscode-editor-background, #0b0e13);
    --panel: var(--vscode-sideBar-background, #12161f);
    --cyan: var(--vscode-charts-blue, #34e6f2);
    --cyan-dim: var(--vscode-charts-blue, #1b8a92);
    --amber: var(--vscode-charts-orange, #ffb648);
    --ink: var(--vscode-foreground, #cdd6e3);
    --muted: var(--vscode-descriptionForeground, #67788c);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse 80% 60% at 50% 30%, #151b26 0%, var(--bg) 70%);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 32px;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    width: 320px; height: 320px;
    display: grid; place-items: center;
    position: relative;
  }
  /* floor shadow, breathes with the bob */
  .shadow {
    position: absolute; bottom: 26px; left: 50%;
    width: 130px; height: 18px; margin-left: -65px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 70%);
    animation: shadowPulse 4s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: scale(1);    opacity: .55; }
    50%      { transform: scale(.86);  opacity: .35; }
  }

  svg.butler { width: 300px; height: 300px; overflow: visible; display: block; }
  /* idle float — applied to a wrapper group so expression transforms stay independent */
  #float { animation: bob 4s ease-in-out infinite; transform-origin: 100px 100px; }
  @keyframes bob {
    0%, 100% { transform: translateY(0)      rotate(-1.1deg); }
    50%      { transform: translateY(-11px)  rotate(1.1deg); }
  }

  /* ——— eyes ——— */
  /* Lids are rects sliding down over the eye; blink = quick full close. */
  .lid { fill: #1b222e; }
  #lidL, #lidR { animation: blink 6.2s infinite; }
  #lidR { animation-delay: .04s; }
  @keyframes blink {
    0%, 92%, 100% { transform: translateY(0); }
    94.5%         { transform: translateY(15px); }
    97%           { transform: translateY(0); }
  }
  .pupils { transition: transform .32s cubic-bezier(.4,.9,.3,1); }
  /* scale each iris in place, not about the two-eye bounding box */
  .iris { transform-box: fill-box; transform-origin: center; transition: transform .18s; }

  /* ——— brows ——— */
  .brow {
    stroke: var(--cyan); stroke-width: 5; stroke-linecap: round; fill: none;
    filter: drop-shadow(0 0 4px rgba(52,230,242,.55));
    transition: transform .3s cubic-bezier(.34,1.4,.5,1);
  }
  #browL { transform-origin: 74px 60px; }
  #browR { transform-origin: 126px 60px; }
  /* neutral: sporadic single-brow raise, because it is always a little unimpressed */
  .state-neutral #browR { animation: browTwitch 7s ease-in-out infinite; }
  @keyframes browTwitch {
    0%, 70%, 100% { transform: none; }
    76%           { transform: translateY(-8px) rotate(-9deg); }
    88%           { transform: translateY(-8px) rotate(-9deg); }
  }

  /* ——— mouth ——— */
  .mouth { stroke: var(--cyan); stroke-width: 4.5; stroke-linecap: round; fill: none;
           filter: drop-shadow(0 0 5px rgba(52,230,242,.5)); }
  .wave { display: none; }
  .state-talking .mouth { display: none; }
  .state-talking .wave  { display: block; }
  .wave rect { fill: var(--cyan); rx: 2;
               filter: drop-shadow(0 0 6px rgba(52,230,242,.7));
               animation: talk .48s ease-in-out infinite; transform-origin: center 116px; }
  .wave rect:nth-child(1) { animation-delay: -.34s; }
  .wave rect:nth-child(2) { animation-delay: -.17s; }
  .wave rect:nth-child(3) { animation-delay: -.42s; }
  .wave rect:nth-child(4) { animation-delay: -.08s; }
  .wave rect:nth-child(5) { animation-delay: -.25s; }
  @keyframes talk {
    0%, 100% { transform: scaleY(.25); }
    50%      { transform: scaleY(1); }
  }

  /* ——— glow / accents ——— */
  #rim { transition: stroke .4s, filter .4s; }
  .state-impressed #rim { animation: glowPulse 1.1s ease-out 2; }
  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(52,230,242,.4));  stroke-opacity: .7; }
    35%      { filter: drop-shadow(0 0 22px rgba(52,230,242,1));  stroke-opacity: 1; }
  }
  .monocle-chain { stroke: var(--cyan-dim); stroke-width: 1.6; fill: none; opacity: .8; }

  /* ——— thinking ——— */
  /* eyes glance side to side; dots trail off like it is drafting an insult */
  .state-thinking .pupils { animation: glance 2.6s ease-in-out infinite; }
  @keyframes glance {
    0%, 12%   { transform: translate(0,0); }
    30%, 46%  { transform: translate(-8px,-3px); }
    64%, 80%  { transform: translate(8px,-3px); }
    96%, 100% { transform: translate(0,0); }
  }
  #dots { opacity: 0; transition: opacity .3s; }
  .state-thinking #dots { opacity: 1; }
  #dots circle { fill: var(--cyan); animation: dot 1.4s ease-in-out infinite; }
  #dots circle:nth-child(2) { animation-delay: .18s; }
  #dots circle:nth-child(3) { animation-delay: .36s; }
  @keyframes dot {
    0%, 100% { opacity: .2; transform: translateY(0); }
    50%      { opacity: 1;  transform: translateY(-4px); }
  }

  /* ——— surprised ——— */
  /* For when the user does something genuinely unwise. Everything opens at once:
     lids all the way up, pupils constrict to pinpricks, jaw drops, monocle quits. */
  .state-surprised .lid { animation: none; }          /* no blinking through a crisis */
  .state-surprised .iris { animation: quiver .16s ease-in-out infinite; }
  @keyframes quiver {
    0%, 100% { transform: scale(.6) translate(0, 0); }
    50%      { transform: scale(.6) translate(.9px, -.9px); }
  }

  /* dropped jaw replaces the mouth stroke */
  #jaw { display: none; transform-origin: 100px 114px; }
  .state-surprised .mouth { display: none; }
  .state-surprised .wave  { display: none; }
  .state-surprised #jaw   { display: block; animation: gasp 1.6s ease-in-out infinite; }
  @keyframes gasp {
    0%, 100% { transform: scaleY(1)    scaleX(1); }
    50%      { transform: scaleY(1.18) scaleX(.94); }
  }

  /* recoil: jolts up and back, then hovers unsteadily — replaces the idle bob */
  .state-surprised #float { animation: jolt 2.4s cubic-bezier(.2,.9,.3,1) infinite; }
  @keyframes jolt {
    0%   { transform: translateY(0)     rotate(0);      }
    7%   { transform: translateY(-19px) rotate(-4.5deg) scale(1.035); }
    16%  { transform: translateY(-9px)  rotate(3.5deg); }
    26%  { transform: translateY(-14px) rotate(-2deg);  }
    40%  { transform: translateY(-8px)  rotate(1.4deg); }
    70%  { transform: translateY(-12px) rotate(-1deg);  }
    100% { transform: translateY(0)     rotate(0);      }
  }

  /* the monocle gives up entirely */
  #monocle { transform-origin: 126px 83px; }
  .state-surprised #monocle { animation: monocleDrop .85s cubic-bezier(.5,.05,.75,1) forwards; }
  @keyframes monocleDrop {
    0%   { transform: translate(0,0)      rotate(0);    opacity: 1; }
    22%  { transform: translate(3px,-4px) rotate(9deg); opacity: 1; }
    100% { transform: translate(11px,74px) rotate(58deg); opacity: 0; }
  }

  /* shock lines bursting off the shell */
  #shock { opacity: 0; stroke: var(--amber); stroke-width: 4; stroke-linecap: round;
           transform-origin: 100px 88px;
           filter: drop-shadow(0 0 6px rgba(255,182,72,.8)); }
  .state-surprised #shock { animation: burst .9s ease-out infinite; }
  @keyframes burst {
    0%   { opacity: 0; transform: scale(.55); }
    18%  { opacity: 1; transform: scale(1);   }
    100% { opacity: 0; transform: scale(1.3); }
  }

  /* antenna bulb goes to amber alarm; rim flares with it */
  .state-surprised #bulb {
    fill: var(--amber); animation: alarm .42s steps(1) infinite;
  }
  @keyframes alarm {
    0%, 49%   { filter: drop-shadow(0 0 14px rgba(255,182,72,1)); opacity: 1; }
    50%, 100% { filter: drop-shadow(0 0 4px rgba(255,182,72,.5)); opacity: .55; }
  }
  .state-surprised #rim { stroke: var(--amber); animation: alarmRim .42s ease-in-out infinite alternate; }
  @keyframes alarmRim {
    from { filter: drop-shadow(0 0 3px  rgba(255,182,72,.4)); stroke-opacity: .55; }
    to   { filter: drop-shadow(0 0 18px rgba(255,182,72,.9)); stroke-opacity: 1; }
  }

  /* one bead of coolant, for form's sake */
  #sweat { opacity: 0; }
  .state-surprised #sweat { animation: bead 2.4s ease-in .3s infinite; }
  @keyframes bead {
    0%       { opacity: 0; transform: translateY(0); }
    12%      { opacity: .9; transform: translateY(0); }
    55%      { opacity: .9; transform: translateY(26px); }
    70%, 100%{ opacity: 0; transform: translateY(30px); }
  }

  /* ——— controls ——— */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-weight: 500; letter-spacing: .01em;
    color: var(--muted); background: var(--panel);
    border: 1px solid #202836; border-radius: 999px;
    padding: 9px 20px; cursor: pointer;
    transition: color .2s, border-color .2s, box-shadow .2s, transform .1s;
  }
  button:hover { color: var(--ink); border-color: #2e3a4d; }
  button:active { transform: translateY(1px); }
  button[aria-pressed="true"] {
    color: var(--cyan); border-color: var(--cyan-dim);
    box-shadow: 0 0 0 1px rgba(52,230,242,.18), 0 0 18px -4px rgba(52,230,242,.55);
  }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .quip { color: var(--muted); font-size: 13px; min-height: 1.5em; text-align: center;
          font-style: italic; max-width: 34ch; transition: opacity .25s; }


  /* ——— chrome ———
     The shared ecosystem frame: reticle, ticking ring, crosshairs, corner brackets.
     Sits OUTSIDE #float so it never inherits the bob — the butler drifts, the
     instrument around him holds still. Purely additive: no existing rule changes,
     and the viewBox is unchanged, so he renders at exactly the size he did before;
     the chrome only fills margin that was already empty. */
  #reticle  { fill: none; stroke: var(--cyan); stroke-opacity: .3; stroke-width: 1.2;
              transition: stroke .4s; }
  #tickring { fill: none; stroke: var(--cyan); stroke-opacity: .42; stroke-width: 3;
              stroke-dasharray: 2.4 20.6; transform-origin: 100px 100px;
              animation: chromeSpin 32s linear infinite; transition: stroke .4s; }
  .cardinal { stroke: var(--cyan); stroke-opacity: .6; stroke-width: 1.8;
              stroke-linecap: round; transition: stroke .4s; }
  .cbracket { fill: none; stroke: var(--cyan); stroke-opacity: .36; stroke-width: 1.6;
              stroke-linecap: round; transition: stroke .4s; }
  @keyframes chromeSpin { to { transform: rotate(360deg); } }

  /* The chrome reacts only where he already does — no new vocabulary, and the ring
     speed reads as effort rather than as a second thing to interpret. */
  .state-thinking  #tickring { animation-duration: 11s; }
  .state-talking   #tickring { animation-duration: 22s; }
  .state-surprised #tickring { animation-duration: 5s; }
  .state-surprised #reticle, .state-surprised #tickring,
  .state-surprised .cardinal, .state-surprised .cbracket { stroke: var(--amber); }
  .state-impressed #reticle { animation: chromeFlare 1.1s ease-out 2; }
  @keyframes chromeFlare {
    0%, 100% { stroke-opacity: .3; }
    35%      { stroke-opacity: .95; filter: drop-shadow(0 0 10px rgba(52,230,242,.8)); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="shadow"></div>
  <svg class="butler state-neutral" id="butler" viewBox="0 0 200 200" role="img"
       aria-label="Clarvis, a small sarcastic robotic butler">
    <defs>
      <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#2b3546"/>
        <stop offset=".55" stop-color="#1a2130"/>
        <stop offset="1"   stop-color="#10151f"/>
      </linearGradient>
      <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="tie" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2ad3e0"/>
        <stop offset="1" stop-color="#127a83"/>
      </linearGradient>
      <clipPath id="eyeL"><rect x="60" y="72" width="28" height="22" rx="11"/></clipPath>
      <clipPath id="eyeR"><rect x="112" y="72" width="28" height="22" rx="11"/></clipPath>
    </defs>

    <!-- chrome: static frame + slow ticking ring, behind the butler and outside #float -->
    <g class="chrome">
      <circle id="reticle"  cx="100" cy="100" r="92"/>
      <circle id="tickring" cx="100" cy="100" r="88"/>
      <g class="cardinal">
        <path d="M100 4 v8"/><path d="M100 188 v8"/>
        <path d="M4 100 h8"/><path d="M188 100 h8"/>
      </g>
      <g class="cbracket">
        <path d="M12 32 V12 H32"/><path d="M168 12 H188 V32"/>
        <path d="M188 168 V188 H168"/><path d="M32 188 H12 V168"/>
      </g>
    </g>

    <g id="float">
      <!-- head shell -->
      <rect x="36" y="36" width="128" height="106" rx="34" fill="url(#shell)"/>
      <rect id="rim" x="36" y="36" width="128" height="106" rx="34" fill="none"
            stroke="var(--cyan)" stroke-opacity=".7" stroke-width="1.6"
            style="filter: drop-shadow(0 0 3px rgba(52,230,242,.4))"/>
      <rect x="44" y="43" width="112" height="46" rx="24" fill="url(#gloss)"/>

      <!-- antenna -->
      <path d="M100 36 V22" stroke="#39465b" stroke-width="3.5" stroke-linecap="round"/>
      <circle id="bulb" cx="100" cy="18" r="5" fill="var(--cyan)"
              style="filter: drop-shadow(0 0 8px rgba(52,230,242,.9))"/>

      <!-- eyes: whites, then pupils clipped to socket, then lids -->
      <rect x="60" y="72" width="28" height="22" rx="11" fill="#080b11"/>
      <rect x="112" y="72" width="28" height="22" rx="11" fill="#080b11"/>

      <g class="pupils">
        <g clip-path="url(#eyeL)">
          <circle class="iris" cx="74" cy="84" r="7.5" fill="var(--cyan)"
                  style="filter: drop-shadow(0 0 7px rgba(52,230,242,.85))"/>
          <circle cx="76.5" cy="81.5" r="2.4" fill="#eafeff"/>
        </g>
        <g clip-path="url(#eyeR)">
          <circle class="iris" cx="126" cy="84" r="7.5" fill="var(--cyan)"
                  style="filter: drop-shadow(0 0 7px rgba(52,230,242,.85))"/>
          <circle cx="128.5" cy="81.5" r="2.4" fill="#eafeff"/>
        </g>
      </g>

      <!-- half-lidded by default: lids parked partway down -->
      <g clip-path="url(#eyeL)"><rect id="lidL" class="lid" x="58" y="65" width="32" height="14"/></g>
      <g clip-path="url(#eyeR)"><rect id="lidR" class="lid" x="110" y="65" width="32" height="14"/></g>

      <!-- monocle over right eye (pops off when startled) -->
      <g id="monocle">
        <circle cx="126" cy="83" r="21" fill="rgba(52,230,242,.05)"
                stroke="var(--cyan)" stroke-opacity=".55" stroke-width="2"/>
        <path class="monocle-chain" d="M143 94 q7 14 1 26"/>
      </g>

      <!-- brows -->
      <path id="browL" class="brow" d="M62 60 q12 -6 24 -1"/>
      <path id="browR" class="brow" d="M114 59 q12 -5 24 1"/>

      <!-- mouth: flat, faintly disapproving -->
      <path id="mouth" class="mouth" d="M84 116 q16 5 32 0"/>

      <!-- talking waveform -->
      <g class="wave">
        <rect x="80"  y="108" width="5" height="16"/>
        <rect x="90"  y="108" width="5" height="16"/>
        <rect x="100" y="108" width="5" height="16"/>
        <rect x="110" y="108" width="5" height="16"/>
        <rect x="120" y="108" width="5" height="16"/>
      </g>

      <!-- dropped jaw (surprised) -->
      <ellipse id="jaw" cx="100" cy="118" rx="11" ry="13" fill="#05080d"
               stroke="var(--cyan)" stroke-width="3.5"
               style="filter: drop-shadow(0 0 7px rgba(52,230,242,.6))"/>

      <!-- shock burst -->
      <g id="shock" fill="none">
        <path d="M30 52  L18 40"/>
        <path d="M24 90  L9 90"/>
        <path d="M34 128 L21 140"/>
        <path d="M170 52  L182 40"/>
        <path d="M176 90  L191 90"/>
        <path d="M166 128 L179 140"/>
      </g>

      <!-- coolant bead -->
      <path id="sweat" d="M150 48 q6 8 0 12 q-6 -4 0 -12" fill="#8fe9ff" opacity="0"/>

      <!-- thinking dots -->
      <g id="dots">
        <circle cx="92"  cy="130" r="2.6"/>
        <circle cx="100" cy="130" r="2.6"/>
        <circle cx="108" cy="130" r="2.6"/>
      </g>

      <!-- bow tie -->
      <g>
        <path d="M100 152 L78 143 L78 161 Z" fill="url(#tie)"/>
        <path d="M100 152 L122 143 L122 161 Z" fill="url(#tie)"/>
        <circle cx="100" cy="152" r="5.5" fill="#0e1620" stroke="var(--cyan)"
                stroke-opacity=".8" stroke-width="1.6"/>
      </g>
    </g>
  </svg>
</div>

<div class="controls" role="group" aria-label="Expression">
  <button data-state="neutral"   aria-pressed="true">Neutral</button>
  <button data-state="judging"   aria-pressed="false">Judging</button>
  <button data-state="impressed" aria-pressed="false">Impressed</button>
  <button data-state="thinking"  aria-pressed="false">Thinking</button>
  <button data-state="talking"   aria-pressed="false">Talking</button>
  <button data-state="surprised" aria-pressed="false">Surprised</button>
</div>

<p class="quip" id="quip">Ah. You're back. And it compiles this time, I hope.</p>

<script>
const svg  = document.getElementById('butler');
const quip = document.getElementById('quip');
const el   = id => document.getElementById(id);

// Per-state geometry. Lid y: 65 = half-lidded, 58 = wide, 72 = squint.
const STATES = {
  neutral:   { lid: 65, browL: '', browR: '',
               mouth: 'M84 116 q16 5 32 0', pupils: 'none',
               quip: "Ah. You're back. And it compiles this time, I hope." },
  judging:   { lid: 70, browL: 'translateY(3px) rotate(7deg)',
                        browR: 'translateY(-11px) rotate(-13deg)',
               mouth: 'M84 118 q16 -2 32 -6', pupils: 'translate(4px,-5px)',
               quip: "A global variable. Bold. Historic, even." },
  impressed: { lid: 56, browL: 'translateY(-11px) rotate(-4deg)',
                        browR: 'translateY(-11px) rotate(4deg)',
               mouth: 'M84 114 q16 12 32 0', pupils: 'none',
               quip: "Oh. That's… genuinely elegant. I'll allow it." },
  thinking:  { lid: 68, browL: 'translateY(-4px)', browR: 'translateY(-2px)',
               mouth: 'M88 117 q12 2 24 -2', pupils: 'none',
               quip: "Parsing your intent. This may take a while." },
  talking:   { lid: 62, browL: 'translateY(-3px)', browR: 'translateY(-6px) rotate(-6deg)',
               mouth: 'M84 116 q16 5 32 0', pupils: 'none',
               quip: "As I was saying — that loop runs 400,000 times." },
  // genuine shock: lids clear of the sockets, brows near the ceiling, jaw open
  surprised: { lid: 50, browL: 'translateY(-15px) rotate(-9deg)',
                        browR: 'translateY(-17px) rotate(10deg)',
               mouth: 'M84 116 q16 5 32 0', pupils: 'none',
               quip: "You force-pushed to main. On a Friday. I need a moment." }
};

function setState(name) {
  const s = STATES[name];
  svg.className.baseVal = 'butler state-' + name;

  el('lidL').setAttribute('y', s.lid);
  el('lidR').setAttribute('y', s.lid);
  el('browL').style.transform = s.browL;
  el('browR').style.transform = s.browR;
  el('mouth').setAttribute('d', s.mouth);
  // thinking drives pupils via CSS keyframes; don't fight it with an inline transform
  document.querySelector('.pupils').style.transform =
    name === 'thinking' ? '' : s.pupils;

  quip.style.opacity = 0;
  setTimeout(() => { quip.textContent = s.quip; quip.style.opacity = 1; }, 200);

  document.querySelectorAll('.controls button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.state === name)));
}

document.querySelectorAll('.controls button')
  .forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));

setState('neutral');
</script>
</body>
</html>
