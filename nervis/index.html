function avatarFrame(app,extra=''){return `<iframe class="avatar-frame ${extra}" data-avatar="${app}" title="${escapeHtml(app.toUpperCase())} animated avatar"></iframe>`}
/* Map each visible screen to the avatar vocabulary defined by its own source.
   Add future routes here instead of scattering avatar decisions through views. */
function desiredAvatarState(app=state.app,view=state.view){const maps={
 nervis:{Overview:'nominal',Chat:'routing',Notifications:'scanning',Voice:'scanning','Ecosystem map':'scanning',Events:'scanning',Traces:'analyzing',Diagnostics:'analyzing',Settings:'nominal'},
 sirvis:{Dashboard:'loading',Models:'loading',Benchmarks:'measuring','Runtime sets':'warmup',Results:'verdict',Recommendations:'verdict',Downloads:'loading',System:'thermal'},
 ravis:{Dashboard:'ranking',Routes:'ranking',Pools:'selected',Providers:'eligibility',Policies:'eligibility',Evidence:'ranking',Logs:'selected',Diagnostics:'fallback'},
 miku:{Chat:'neutral',Voice:'singing',Overview:'neutral',Events:'thinking',Traces:'thinking',Diagnostics:'annoyed',Settings:'neutral'},
 clarvis:{Workspace:'thinking',Explorer:'neutral',Search:'thinking','Source control':'judging','Run & debug':'talking',Extensions:'neutral',Terminal:'talking'}
 };return maps[app]?.[view]||({nervis:'nominal',sirvis:'loading',ravis:'ranking',clarvis:'thinking',miku:'neutral'})[app]}
function syncFrameState(frame){const app=frame.dataset.avatar;const wanted=desiredAvatarState(app,app==='clarvis'?state.view:state.view);try{frame.contentWindow.setState(wanted)}catch(e){/* canonical initial state remains until the frame is ready */}}
function hydrateAvatarFrames(){document.querySelectorAll('iframe[data-avatar]:not([data-ready])').forEach(frame=>{const app=frame.dataset.avatar;const presentation='<style>html,body{width:340px!important;height:340px!important;min-height:0!important;margin:0!important;padding:0!important;display:block!important;overflow:hidden!important;background:transparent!important}.stage{width:340px!important;height:340px!important;margin:0!important}.controls,.status,.quip{display:none!important}</style>';frame.onload=()=>syncFrameState(frame);frame.srcdoc=atob(AVATAR_SOURCE_B64[app]).replace('</head>',presentation+'</head>');frame.dataset.ready='true'})}
/* The Clarvis extension panel uses the same canonical avatar as the header. */
/* Embedded, the extension renders its chat panel WITHOUT an avatar: one butler
   per screen, and he lives in the header with the other three. Standalone VS Code
   is unaffected and keeps the panel avatar — the extension decides which, from
   the host signal described at CLARVIS_BRIDGE. */
function replaceClarvisPanelAvatar(){const old=document.querySelector('.mini-butler');if(old)old.remove()}
/* Embedded, the header carries him. In focus mode there is no header, so the panel
   does — which is also what the extension does when it runs in a plain editor. */
function syncPanelAvatar(){
 const chat=document.querySelector('.clarvis-chat');if(!chat)return;
 const has=chat.querySelector('iframe[data-avatar="clarvis"]');
 const want=document.body.classList.contains('zen');
 if(want&&!has){chat.insertAdjacentHTML('afterbegin',
   '<div class="panel-avatar-wrap">'+avatarFrame('clarvis','panel-avatar')+'</div>');hydrateAvatarFrames()}
 else if(!want&&has)has.closest('.panel-avatar-wrap')?.remove()}
/* ══ API ═══════════════════════════════════════════════════════════════════
   One method per real endpoint, each returning exactly the shape its owning
   spec defines. Wiring this to live services is mechanical:

     1. delete the `return` body
     2. `return (await fetch(BASE.sirvis + '/api/v1/models')).json()`
     3. keep the shape

   Methods are already async and the views already `await` them, so nothing
   about the render path changes when the body starts doing real I/O. Field
   names are the contract ones, not display ones — rename at the view, never
   here, or the swap stops being mechanical.

   Endpoints are cited per method. Anything not cited does not exist yet and is
   a STOP item, not an invitation to invent one. */
/* Ports come from ECOSYSTEM_RUNBOOK.md §5, which assigns them because they cross
   product boundaries. Hardcoding them is correct *here* — this file opens from disk
   with no configuration — and wrong in a real client, which reads its peers from
   configuration or the registry. NERVIS is same-origin because it serves this page;
   its own default is 127.0.0.1:8711. The Clarvis Bridge port is per extension host,
   so 7071 is only the first instance. */
/* ── Reading a real service, without ever depending on one ──────────────────
   Every method in `API` models one endpoint. `live()` lets a method *try* that
   endpoint and fall back to its own mock when anything at all goes wrong — the
   service is down, the port moved, the origin is not allow-listed, the body is
   not what we expected.

   That fallback is the property this page cannot lose: it opens from disk with
   nothing running, and a `fetch` that threw and stopped the render would
   destroy that silently for everyone not currently running the service under
   test. So the failure path is the *default* path, not an afterthought.

   Reading from a file:// page sends `Origin: null`, which RAVIS refuses — so
   opening this from disk always shows mocks. Serve it over http and allow that
   origin to see real data; `README.md` has the two commands.

   `SOURCE` records which happened, per service, so a screen can say so rather
   than leaving the reader to guess whether a number is real. */
const SOURCE={};
const LIVE_TIMEOUT_MS=1500;
/* The deadline every *read* carries, said once.
 *
 * A refused connection fails instantly; a filtered port hangs forever, and four
 * reads had no deadline at all — two of them awaited inside a `Promise.all`
 * before their screen painted, so the screen did not paint. `live()` has always
 * had one; these are the calls written by hand around it.
 *
 * **A function, not a constant, and that distinction is the whole of it.**
 * `AbortSignal.timeout` starts counting when it is *created*. A shared object
 * built once at load would expire a second and a half into the session and then
 * abort every read for as long as the tab stayed open — a page that worked when
 * you opened it and quietly stopped fetching, which is the most expensive shape
 * of bug this file collects.
 *
 * **Reads only, and mutations deliberately not.** Aborting a fetch stops this
 * page listening; it does not stop the server doing the thing. A deadline on a
 * PUT turns "slow" into "nobody knows whether that applied", which is a worse
 * place to leave somebody than a spinner — this dashboard loads models and
 * writes credentials. The mutations keep waiting, on purpose.
 */
function readDeadline(){return{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)}}
/* What NERVIS's registry last published beside the entries: §5.2's negotiated
   operations, and any endpoint its SSRF guard refused. Empty until a live read
   fills them, so a screen must treat empty as "not read" rather than "none". */
/* §11.2's filters, held across renders. A filter that reset every time the
   screen repainted would be unusable on a live feed, which repaints. */
const EVENT_FILTERS={service:'',severity:'',event_type:'',text:''};
function setEventFilter(name,value){
 EVENT_FILTERS[name]=EVENT_FILTERS[name]===value&&name!=='text'?'':value;
 render();
}
function clearEventFilters(){
 for(const k of Object.keys(EVENT_FILTERS))EVENT_FILTERS[k]='';
 render();
}

let OPERATIONS=[];
let REFUSED=[];
let REGISTRY_ROWS=[];
/* When the registry was last read, so a reading can say how old it is instead
   of implying it is current. 0 means never. */
let REGISTRY_AT=0;

/* Which peers were reachable last time we looked, as one comparable string, and
   whether that changed on the most recent read.

   **A screen rendered while a service was still starting stayed wrong until you
   clicked something.** Opening the dashboard as the ecosystem comes up is the
   ordinary case -- the launcher opens the browser the moment the ports answer --
   and Pools rendered its from-disk fallback, then kept it: six invented pools
   against a RAVIS that was by then serving fourteen. Nothing was stale in the
   data; the screen simply never asked again.

   `LIVE_VIEWS` already repaints four screens on every poll, which is right for a
   feed and wrong as a general answer: rebuilding every screen every eight
   seconds costs a reader their scroll position, their open disclosures and
   their half-typed input for no new information. A *transition* is the thing
   worth re-rendering for, and it is cheap to detect. */
let REGISTRY_SIGNATURE='';
let REGISTRY_CHANGED=false;
/* Which services the screen currently on display actually fell back on, and how
   many times we have tried to recover it under this registry state. */
let RENDERED_MOCK=[];
let RECOVER_TRIES=0;
const RECOVER_LIMIT=3;

/* One place that writes what a registry body means, because two callers need
   it: the Overview's own read, and the poll that keeps the status bar true on
   screens that never read the registry at all. */
function absorbRegistry(d){
 SOURCE.nervis='live';
 /* The registry's own view of each peer replaces the hard-coded SERVICES map
    wherever one is live. `capable()` reads that map, so this is what makes
    control gating real rather than a promise. */
 for(const e of d.items){
  if(SERVICES[e.key]){
   SERVICES[e.key].state=e.state;
   SERVICES[e.key].caps=Object.entries(e.capabilities||{})
     .filter(([,state])=>state==='available'||state==='degraded').map(([id])=>id);
  }
  if(e.state==='healthy'||e.state==='degraded')SOURCE[e.key]='live';
 }
 OPERATIONS=d.operations||[];
 REFUSED=d.refused||[];
 /* `quiet` is an optional peer that has never answered — absent rather than
    broken. Without it a machine with LM Studio and no Ollama reads "Ollama
    unreachable" in the status bar forever, which is an alarm about software
    that was never installed. */
 REGISTRY_ROWS=d.items.map(e=>({label:e.label,state:e.state,
   quiet:e.awaiting_first_contact===true}));
 REGISTRY_AT=Date.now();
 /* Sorted, so the order the registry happens to return does not read as a
    change. The first read only records the signature: the page has just
    rendered against it, so there is nothing to correct. */
 const signature=d.items.map(e=>`${e.key}:${e.state}`).sort().join('|');
 REGISTRY_CHANGED=REGISTRY_SIGNATURE!==''&&signature!==REGISTRY_SIGNATURE;
 REGISTRY_SIGNATURE=signature;
 announceStates(d.items);
 /* The badge, on the same timer that produced most of what it counts. Not
    awaited: a slow read of the centre must not delay the registry repaint. */
 paintNotePip();
}

/* What each service was doing last time we looked, so a change can be named.
   The signature above answers *whether* something moved; this answers what,
   from what, to what — which is the difference between repainting and being
   able to say "RAVIS has stopped answering". */
const LAST_STATE={};
let ANNOUNCED_ONCE=false;
/* The most recent registry rows, so a welcome held back for a user gesture
   describes the machine as it is when spoken rather than as it was on load. */
let WELCOME_ITEMS=[];

/* How a state reads out loud. The status bar's own words are for a glance;
   these are for a sentence, and a person hearing "stale" without seeing the
   age beside it has learned nothing. */
const SPOKEN_STATE={
 healthy:'is back to healthy', degraded:'is degraded',
 unreachable:'has stopped answering', stale:'has gone quiet',
 unhealthy:'reports itself unhealthy', incompatible:'is speaking a protocol I do not support',
 unauthorized:'is refusing my credential', stopped:'has stopped',
 discovering:'is still negotiating'};

/* Say what changed, if anything did, and if anybody asked to be told.

   **On the poll rather than on a screen**, which is the point: the registry is
   fetched on a timer whatever is open, so this reaches somebody working in
   Traces or in another tab entirely. The status bar has always carried the same
   fact silently; this is for when nobody is looking at it. */
function announceStates(items){
 WELCOME_ITEMS=items||[];
 const changed=[];
 for(const e of items||[]){
  const was=LAST_STATE[e.key];
  LAST_STATE[e.key]=e.state;
  /* Never on the first read. Everything is a "change" from nothing known, and
     announcing six services at once on open is not news, it is a roll call. */
  if(was===undefined||was===e.state)continue;
  /* An optional peer nobody configured is absent, not broken — the same rule
     the status bar uses, and the reason a machine without Ollama does not
     announce Ollama every time it is opened. */
  if(e.awaiting_first_contact===true)continue;
  changed.push({label:e.label||e.key,state:e.state});
 }
 /* **Attempted on every read, not only the first.** Two paths absorb the
    registry: the poll, which loads voice settings first, and the page-load
    render, which does not. The load path wins the race, so a welcome tried
    once was tried in the one moment it could not succeed — `announcing()` was
    false because the settings had not arrived, and the single chance was
    spent. `welcome()` guards itself with `welcomed`, so calling it every time
    costs nothing and is the only version that survives whichever path is
    first. */
 SPEECH.welcome(items);
 if(!ANNOUNCED_ONCE){
  ANNOUNCED_ONCE=true;
  return;
 }
 if(!changed.length)return;
 if(!SPEECH.announcing())return;
 /* One sentence however many moved. Three services falling over together is
    one event to a person and three to a loop. */
 const said=changed.slice(0,3).map(c=>
   `${c.label} ${SPOKEN_STATE[c.state]||('is now '+c.state)}`).join(', and ');
 const more=changed.length>3?`, and ${changed.length-3} others`:'';
 SPEECH.announce(`${said}${more}, sir.`);
}

/* Whether the reader is in the middle of typing something.

   A re-render replaces `#content`, which takes the focused element with it —
   and with it the caret, the selection and anything typed but not yet
   submitted. The Discover search box and the chat composer are both in that
   category, and both are places a reader may sit for a while. A service coming
   up is worth a repaint; it is not worth eating a sentence. The next poll will
   catch it, because the signature only clears once a repaint actually runs. */
/* Whether this page is showing transcribed data for a service that is up.

   A transition is not the only way a screen ends up wrong. A read can simply
   fail while the service is fine -- a timeout, a rate limit, a restart caught
   mid-request -- and `live()` falls back to the transcription and records
   `SOURCE[service] = 'mock'`. Nothing retried, so the screen kept the fallback
   until the reader clicked something. That is what produced six invented pools
   against a RAVIS serving fourteen, with the registry saying RAVIS was healthy
   the whole time.
 
   **Read from what the screen drew, not from `SOURCE` directly.** `SOURCE` is
   global and any later fetch overwrites it -- the status bar's own reads set
   `ravis` back to `live` while the screen in front of the reader was still
   showing six transcribed pools. `RENDERED_MOCK` is recorded at the end of a
   render and describes that render, which is the thing being corrected.

   Bounded at three attempts per registry state: a service that has just come up
   may not answer the first read after it, so one attempt is too few, and a read
   that will never succeed should not rebuild the screen under the reader's
   cursor every eight seconds forever. */
function recoverable(){
 return RENDERED_MOCK.some(key=>['healthy','degraded'].includes((SERVICES[key]||{}).state));
}

function editing(){
 const el=document&&document.activeElement;
 if(!el)return false;
 if(el.isContentEditable===true)return true;
 return ['input','textarea','select'].includes(String(el.tagName||'').toLowerCase());
}

/* ── One negotiated read of a RAVIS surface, through NERVIS (M3, §8) ────────
   NERVIS checks the capability before it calls, so a surface RAVIS has not
   advertised produces **no request at all** rather than a 404 this page then
   has to interpret — §5.2's gate is "never calls a guessed endpoint", and a
   check that lives in this file is one that anything not this file can skip.

   Every outcome has the same shape: `{available, reason, availability, data}`.
   `data` is null on every failure and never an empty list, because an empty
   list means *RAVIS has none of these* and confusing the two is how a screen
   renders a confident zero over an outage. */
async function peerRead(service,surface,params,method){
 const q=method==='POST'?'':new URLSearchParams(params||{}).toString();
 try{
  const r=await fetch(BASE.nervis+'/api/v1/'+service+'/'+surface+(q?'?'+q:''),
    method==='POST'
      /* Thirty seconds for a POST, against the ordinary 1.5. The only POST
         surface is §14.3's recommendation, which reads every evidence record
         for the roles asked about — slow enough that the read timeout would
         abort a working call. */
      ? {method:'POST',headers:{'content-type':'application/json'},
         body:JSON.stringify(params||{}),signal:AbortSignal.timeout(30000)}
      : {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const body=await r.json();
  /* **A read that succeeded through NERVIS is that peer answering**, and this
     did not say so. `live()` sets `SOURCE[service]` on every direct fetch, but
     a proxied read set nothing — so a screen fed entirely through NERVIS left
     `SOURCE.ravis` at whatever a previous screen had put there. The Logs
     tiles showed one of four as real for exactly that reason: the data arrived,
     and nothing recorded where it came from. Negotiation refusing the surface
     is *not* the peer answering, so only an available read counts. */
  /* **And a read that did not succeed has to say so too.** Only the success
     half was recorded, so a proxied read that failed left `SOURCE[service]`
     wherever a previous screen had put it — usually `live`. Two things go wrong
     with that: a badge keeps claiming a live read that failed, and the repaint
     that recovers a screen once its service answers never fires, because it
     asks which services this render fell back on and is told none did.
     Credentials and Policies are read entirely this way; both changed
     completely between a running RAVIS and a stopped one while reporting that
     nothing had fallen back. */
  SOURCE[service]=body&&body.available?'live':'mock';
  return body;
 }catch(e){
  /* NERVIS itself is not answering — which, since it serves this page, mostly
     means this file was opened from disk. Distinct from RAVIS being down, and
     said differently, because the two need different things done about them. */
  SOURCE[service]='mock';
  return{surface,available:false,availability:'unknown',data:null,
         reason:'NERVIS is not answering, so nothing negotiated this read'};
 }
}

/* The two peers, spelled the way each screen reads best. One implementation,
   because a second copy of the envelope handling would drift and a screen would
   then need to know which service it was talking to in order to read a
   failure. */
const ravisRead=(surface,params)=>peerRead('ravis',surface,params);
const sirvisRead=(surface,params,method)=>peerRead('sirvis',surface,params,method);

/* Why the last read of each service ended the way it did.
   Keyed by service, like `SOURCE`, and written by the same helper — a screen
   that wants to say *what* went wrong now has something to read, where before
   the answer existed for one line inside a `catch` and was dropped.

   §25.2 puts it as "service-level absence is handled; request-level is not",
   and this is the whole of the gap: `live()` distinguished five different
   failures and reported one. A refusal, a timeout, a 500, a body that is not
   JSON and an adapter that threw are five different things to do next, and
   they all rendered as the transcription with no badge change. */
const OUTCOME={};

/* What went wrong, in the words a reader can act on.

   The status is kept because 401 and 503 send somebody to different places, and
   the *kind* is kept separately because "the service refused this" and "the
   service is not there" must never collapse — that collapse is why a refused
   read has always looked exactly like an outage on this page. */
function classifyFailure(failure,status){
 if(status===401||status===403)
  return{kind:'refused',status,detail:'this read was refused: HTTP '+status};
 if(status)
  return{kind:'failed',status,detail:'the service answered HTTP '+status};
 if(failure&&failure.name==='AbortError')
  return{kind:'slow',status:0,
    detail:`no answer within ${LIVE_TIMEOUT_MS} ms`};
 /* By name, not by `instanceof`. A `SyntaxError` raised in another realm — an
    iframe, or the check harness's own context — is not an instance of *this*
    realm's `SyntaxError`, so the test read a malformed body as an unreachable
    service. The `AbortError` line above already tests by name; this one did
    not, and the inconsistency was the bug. */
 if(failure&&failure.name==='SyntaxError')
  return{kind:'malformed',status:0,detail:'the answer was not JSON'};
 return{kind:'unreachable',status:0,detail:'the service did not answer'};
}

async function live(service,path,mock,adapt){
 /* The status, carried out of the block that knows it. Throwing
    `new Error('HTTP '+response.status)` and re-reading the number out of a
    message is how the distinction was lost in the first place.

    Two variables rather than one, because they answer different questions.
    `status` is what the service said, and is kept for a successful read too.
    `refusedWith` is set *only* when the status is itself the failure — a 200
    whose body is not JSON has a status of 200, and a single variable made that
    case classify as "the service answered HTTP 200", which is true and useless.
    Found by `outcome_check` on its first run. */
 let status=0,refusedWith=0;
 try{
  /* A refused connection fails instantly; a filtered port hangs forever. The
     timeout is what stops the second case turning into a blank screen. */
  const stop=new AbortController();
  const timer=setTimeout(()=>stop.abort(),LIVE_TIMEOUT_MS);
  let payload;
  try{
   const response=await fetch(BASE[service]+path,{signal:stop.signal});
   status=response.status;
   if(!response.ok){refusedWith=response.status;throw new Error('HTTP '+response.status)}
   payload=await response.json();
  }finally{clearTimeout(timer)}
  /* **Outside the fetch's try, deliberately.** The adapter used to run inside
     it, so a field this page reads that a service stopped publishing threw and
     was reported as the service being unreachable — a defect in the dashboard,
     displayed as a fault in something else. It is now its own outcome, and the
     service is still recorded as having answered, because it did. */
  let adapted;
  try{
   adapted=await adapt(payload);
  }catch(shaping){
   SOURCE[service]='mock';
   OUTCOME[service]={kind:'unreadable',status,
     detail:'the answer arrived but this page could not read it: '+shaping.message};
   return withSource(await mock(),false);
  }
  SOURCE[service]='live';
  OUTCOME[service]={kind:'answered',status,detail:''};
  return withSource(adapted,true);
 }catch(failure){
  SOURCE[service]='mock';
  OUTCOME[service]=classifyFailure(failure,refusedWith);
  /* Awaited, because several mocks are `async` methods. Without this the flag
     was set on the *Promise* — `withSource` saw an object, tagged it, and the
     await handed back the resolved value with no flag on it at all. Every
     screen fed by an async mock therefore still had `live === undefined`,
     which is the silent half of this bug: no error, just no answer. */
  return withSource(await mock(),false);
 }
}

/* **The answer, attached to the thing that was answered.**

   This helper knew whether the service replied — it sets `SOURCE[service]` two
   lines up — and then returned the adapted payload with no trace of it, so a
   card holding the result had nothing to read. The global was the only witness,
   and it is overwritten by the next call to the same service, so a screen that
   fetched twice could not tell which answer it was looking at.

   That is the root of the badge defect rather than one instance of it: every
   card wired to `SOURCE` was reading a variable that had moved on, and every
   card that hardcoded ` live` did so because there was nothing else to read.

   An existing `live` is never overwritten — several adapters set it themselves,
   and an adapter knows more than this does. Arrays and primitives pass through
   untouched: a flag on an array is a property nobody looks at. */
function withSource(value,answered){
 if(value===null||typeof value!=='object'||Array.isArray(value))return value;
 if('live'in value)return value;
 value.live=answered;
 return value;
}

/* GET /api/v1/route-decisions → the shape the Routes table already reads.
   Contract names stay in `API`; this is the rename-in-the-view boundary.

   **`execution_path` is now read rather than blanked.** This said it "is not
   published — RAVIS has only built Path A, and asserting TRANSPARENT_OPENAI
   here would be this page claiming something the API never said". Path B
   shipped at M4 and `execution_path` is on every decision record; NERVIS.md §8
   makes showing it mandatory, because *transparent versus translated* is the
   one thing a compatibility regression turns on. Blanking a field the API
   started publishing is the same failure as inventing one, in the direction
   nobody checks.

   `ttft_s` stays empty and stays honest: it is not per-decision. It exists per
   *target* on /api/v1/health, and averaging one into this column would be
   manufacturing a number. It renders as an em dash. */
/* One route decision, opened out — what RAVIS recorded and why.

   Everything here was already on the wire; the Logs screen was throwing it away
   at the mapping step and printing a footnote about where to look for it. The
   bounds are the only editorial: a pool decision considers five hundred models
   and excludes forty, and pasting both lists into a disclosure is a way of not
   answering the question. Counts, then the first few, then the count of the
   rest. */
function decisionDetail(d){
 if(!d)return '';
 const rows=[
  ['decision',d.decision_id],['request',d.request_id],['trace',d.trace_id],
  ['caller',d.application_id],['at',d.decided_at],
  ['requested',d.requested],['pool',d.pool],['selected',d.selected],
  ['path',d.execution_path]];
 const facts=rows.filter(([,v])=>v)
   .map(([k,v])=>`<div class="trace-step"><b>${escapeHtml(k)}</b><span class="mono">${escapeHtml(String(v))}</span></div>`).join('');
 return `<div class="log-detail">${facts}
  ${d.reason?`<p class="mono dim">${escapeHtml(d.reason)}</p>`:''}
  ${listOf('required',d.requirements)}
  ${listOf('fallbacks, in order',d.fallbacks)}
  ${attemptLines(d.execution)}
  ${exclusionsOf(d.excluded)}
  ${Array.isArray(d.considered)&&d.considered.length
    ?`<small class="mono dim">${d.considered.length} candidate(s) considered: ${escapeHtml(d.considered.slice(0,8).join(', '))}${d.considered.length>8?` … and ${d.considered.length-8} more`:''}</small>`:''}
 </div>`;
}

/* A bounded list, or nothing at all when there is nothing to say. */
function listOf(label,values){
 if(!Array.isArray(values)||!values.length)return '';
 const shown=values.slice(0,6).map(v=>escapeHtml(String(v))).join(' · ');
 return `<small class="mono dim"><b>${escapeHtml(label)}:</b> ${shown}${values.length>6?` … +${values.length-6}`:''}</small>`;
}

/* An attempt's destination and its two measurements, where they exist.

   `elapsed_ms` and `ttft_ms` are absent rather than zero when nothing was
   measured — a skipped candidate never opened a connection, and a non-streamed
   response has no first byte to time. Printing 0 ms for either would read as an
   instant answer, which is the opposite of what happened. */
function attemptFacts(a){
 const bits=[];
 if(a.provider)bits.push('via '+escapeHtml(a.provider));
 if(typeof a.ttft_ms==='number')bits.push('first byte '+Math.round(a.ttft_ms)+' ms');
 if(typeof a.elapsed_ms==='number')bits.push(Math.round(a.elapsed_ms)+' ms total');
 return bits.length?` <span class="dim">· ${bits.join(' · ')}</span>`:'';
}

/* What actually ran, which is the half a routing table cannot tell you.

   Named for the markup rather than the data, because `attemptsOf` already
   exists and returns the list itself — two functions with one name is a bug the
   language does not report. */
function attemptLines(execution){
 const attempts=(execution&&execution.attempts)||[];
 if(!attempts.length)return '';
 const lines=attempts.map(a=>`<div class="trace-step"><b>${escapeHtml(a.model||'?')}</b><span>${escapeHtml(a.outcome||'?')}${a.detail?' — '+escapeHtml(a.detail):''}${attemptFacts(a)}</span></div>`).join('');
 const provider=execution.provider?`<small class="mono dim">through ${escapeHtml(execution.provider)}</small>`:'';
 const stopped=execution.stopped_because
   ?`<small class="mono dim">stopped: ${escapeHtml(execution.stopped_because)}</small>`:'';
 return provider+lines+stopped;
}

/* Exclusions grouped by their reason rather than listed by model.

   Forty rows saying "not among the models chosen for this pool" is one fact
   about the pool, printed forty times. Grouping turns the list into the
   sentence a reader was going to have to write themselves. */
function exclusionsOf(excluded){
 if(!Array.isArray(excluded)||!excluded.length)return '';
 const groups=new Map();
 for(const item of excluded){
  for(const reason of (item.reasons||['excluded'])){
   const seen=groups.get(reason)||[];
   seen.push(item.model);
   groups.set(reason,seen);
  }
 }
 /* Each reason opens onto the models it excluded. The group answers "why
    were most of them out"; the list answers "was *mine* one of them", and that
    second question is the reason somebody opens a log line at all. Nested
    disclosures rather than one long list, because forty model ids inline turn
    the interesting line — the one attempt that ran — into scrollback. */
 const lines=[...groups.entries()].sort((a,b)=>b[1].length-a[1].length).slice(0,8)
  .map(([reason,models])=>`<details class="excluded-group"><summary><b>${models.length} excluded</b> <span>${escapeHtml(reason)}</span></summary>
    <div class="mono dim">${models.slice(0,60).map(m=>escapeHtml(String(m))).join('<br>')}${models.length>60?`<br>… and ${models.length-60} more`:''}</div></details>`).join('');
 return `<small class="mono dim">why the rest were not chosen — open one for the models it names:</small>${lines}`;
}

function recentDecisions(payload){
 const outcome=d=>{
  if(!d.selected)return 'NO_ROUTE';
  const attempts=(d.execution&&d.execution.attempts)||[];
  if(!attempts.length)return 'PENDING';
  const last=attempts[attempts.length-1].outcome;
  return last==='succeeded'?'OK':last.toUpperCase();
 };
 return{items:payload.items.map(d=>({
  pool:d.pool||d.requested,
  model:d.selected,
  execution_path:d.execution_path||null,
  ttft_s:null,
  result:outcome(d),
  reason:d.reason,
  /* The record the row was made from. The five columns are what fits on a
     line; the decision holds the requirements, the candidates, every exclusion
     with its reason, and what the attempt actually did. The Logs screen's own
     footnote promised "every row is a decision id away from its full record"
     and then left the reader to go and find it. */
  record:d}))};
}
/* **The token NERVIS put in this page, sent back on configuration changes.**
   §16 item 4 stopped RAVIS trusting a loopback bind, and NERVIS proxies six of
   those mutations with the credential that replaced it. The header is what
   proves the request came from this page rather than from any other thing that
   can reach the port: a page on another origin may issue the request and cannot
   read this document, so it never learns the value. Empty when the file is
   opened directly from disk, which is a page with no NERVIS to change anything
   in. Every configuration write goes through `control_headers()` — a helper
   rather than six literals, so the seventh cannot quietly ship without it. */
const CONTROL_TOKEN=(document.querySelector('meta[name="nervis-control"]')||{}).content||'';
function control_headers(){return{'content-type':'application/json','x-nervis-control':CONTROL_TOKEN}}
const BASE={sirvis:'http://127.0.0.1:8721',ravis:'http://127.0.0.1:8731',
            nervis:'',clarvis:'http://127.0.0.1:7071'};

/* Live SIRVIS, or null when it is not there.

   Null rather than a throw, because absence is a state on this page and not an
   error: every caller below falls back to the transcription and says which one
   it drew. The timeout is short on purpose — a dashboard that hangs for thirty
   seconds because a service is down is worse than one that says it is down. */
async function liveSirvis(path,headers){
 try{const r=await fetch(BASE.sirvis+path,{signal:AbortSignal.timeout(2000),headers});
     return r.ok?await r.json():null}
 catch(e){return null}}

/* One stored benchmark result as this page's evidence record.

   The same pattern as `lmstudioBuilds()`: a real payload mapped onto the record
   shape the views already read, rather than the views rewritten around a second
   vocabulary. The engine's envelope is the authority — `metrics` there is an
   object per measure carrying median, spread, every repetition and its
   provenance, and this takes the median because that is what a table cell can
   hold. The rest stays one request away at /api/v1/benchmark-results/{id}.

   **Four measures are deliberately absent.** `tool_calls`, `code`, `fib` and
   `follow_up` come from capability suites SIRVIS cannot run yet (M13, M18), so
   a live record carries no such fields and the views render them as absent.
   Filling them from the transcription would put measured and transcribed
   numbers in one row with nothing to tell them apart. */
function sirvisEvidence(result){
 const t=result.target||{}, med=n=>result.metrics&&result.metrics[n]
   ? Math.round(result.metrics[n].median*100)/100 : null;
 /* A trial rate as the [passed,total] pair the tables render, or null when the
    trials did not run. Never a zero pair: "nobody asked" and "asked eight times
    and failed" are different findings, and only one is about the model.

    Defined here beside `med` because this is the closure that reads `result`.
    An earlier edit put both helpers next to a *different* `med` one function
    over, which reads `e` — so the names the call site needed did not exist and
    the screen threw `rate is not defined`. Two helpers with the same job in
    neighbouring scopes is how that happens. */
 const rate=n=>{const b=(result.metrics||{})[n];
   return b&&typeof b.total==='number'&&b.total?[b.passed,b.total]:null};
 const followup=()=>{const f=(result.metrics||{})['tool_followup_used_result'];
   if(!f||!f.total)return null;
   const m=(((f.provenance||{}).notes)||'').match(/outcome: (.+)$/);
   return m?m[1]:(f.passed?'used-result':null)};
 return{evidence_type:result.evidence_type,role:result.role,
  target:{family:t.model_family,
          variant:[t.format,t.quantization].filter(Boolean).join(' ')||dash(t.variant),
          runtime:t.runtime,lmstudio_id:result.target_key,
          runtime_config:t.runtime_config||{}},
  samples:result.samples,
  /* Effective rate is not derivable from this envelope — it needs the token
     count against total latency, and the envelope publishes a rate rather than
     a count. Absent beats invented. */
  metrics:{generation_tok_s:med('generation_tokens_per_second'),
           first_token_s:med('time_to_first_token_seconds'),
           /* M13's trial rates. `EvidenceRecord.as_dict()` merges rates into
              `metrics` beside the measurements, so a rate arrives here as
              {passed,total} rather than a median — which is the distinction
              §13.2 draws: a median over ones and zeros means nothing, and 6/8
              versus 60/80 are different amounts of evidence for one rate.

              Absent on every record until a `clarvis-agent` role run has been
              made, because nothing else asks a build to call a tool. */
           tool_calls:rate('tool_call_well_formed'),
           follow_up:followup()},
  validity:result.validity,warnings:result.validity_notes||[],
  evidence_id:result.evidence_id,measured_at:result.created_at,
  caveat:null,note:null,live:true,
  /* The record the row was made from, kept whole. Six columns are what fits on
     a line; the record holds the spread behind every median, the provenance of
     each axis — which is what makes a record *partly* measured rather than
     measured — the trial's outcome tally, and the validity notes that say what
     the run could not measure and why. Adapting those away and then writing a
     footnote about them is how a screen ends up describing evidence it is not
     showing. */
  record:result}}




/* Clarvis's own deadlines, from its source. These are not routing constraints —
   missing one substitutes a written fallback line rather than failing — but they
   are what makes a first-token figure mean anything: past 2 s the character
   quietly becomes a static bank, which is the product switching its own thesis
   off. Only the chat role has them; a build has no deadline at all. */
const CLARVIS_DEADLINES=[['Voice.say','rewriting a written line',2],
 ['intentModel','question or job?',2.5],['LiveQuips','an unprompted remark',4],
 ['Voice.open','writing a line for the moment',5],['BriefingService','the opening briefing',12]];


/* Whether a build can serve a role that requires tools. A measurement outranks
   the advertised capability in BOTH directions, which is the entire lesson of the
   two records disagreeing:

     · qwen2.5-coder-7b, -14b and phi-4-mini advertise no tool_use and make
       well-formed calls in every attempt. Trusting the flag would exclude the
       recommended model outright.
     · granite-4.0-h-tiny on MLX advertises tool_use and loses the arguments of
       seven calls in eight. Trusting the flag would route an agent to a build
       that cannot ask for a file.

   Unmeasured builds fall back to the claim, and carry UNKNOWN evidence so nothing
   downstream mistakes the fallback for a result. */


const API={
 sirvis:{
  /* GET /api/v1/models — installed builds, derived from the LM Studio snapshot
     above. Identity is family + variant + runtime + config; `state` is SIRVIS's
     closed runtime enum, mapped from LM Studio's own `state` field. */
  /* GET /api/v1/models -> the build row this page's tables already read.

     Four fields the API does not carry, each rendered absent rather than
     defaulted, because every default here would be a positive claim:

       size_gb           nothing records an installed size — LM Studio's
                         catalogue does not report one, so `installed_size_bytes`
                         is declared and never populated.
       resident_gb       the Resource Manager counts references, not bytes.
       measured          throughput and tool reliability live on evidence
                         records, not on a build; the Results screen has them.
       tools_advertised  SIRVIS's inventory does not republish LM Studio's
                         capability list, so "advertises nothing" is unknowable
                         here and must not be printed as `none`.

     `runtime` is derived from `runtime_format` and stops at absence: a null
     format is not llama.cpp, it is a format nobody reported. Same rule the
     variant string follows one line down. */
  async models(){return live('sirvis','/api/v1/models',this._modelsMock,payload=>({
   snapshot_revision:payload.snapshot_revision,
   items:payload.items.map(m=>{const v=m.variant||{};
    const instances=m.instances||[];
    return{
     model_id:m.runtime_key,
     /* Both carried because they answer different questions: `local_model_id`
        addresses one installed build, and `variant_id` is what evidence is
        keyed by — §12.2 forbids evidence keyed by model, so "this build's
        measurements" is a variant query, not a model lookup. */
     local_model_id:m.local_model_id,
     variant_id:v.variant_id,
     family:(m.family&&m.family.display_name)||m.display_name,
     variant:[v.runtime_format&&v.runtime_format.toUpperCase(),v.quantization].filter(Boolean).join(' ')||null,
     runtime:v.runtime_format==='mlx'?'mlx':v.runtime_format==='gguf'?'llama.cpp':null,
     state:m.is_loaded?'loaded':'stopped',
     instance_count:instances.length,
     runtime_config:{
      context_length:instances.length?instances[0].effective_context:null,
      max_context_length:m.declared_context?m.declared_context.value:null},
     size_gb:null,
     resident_gb:null,
     measured:null,
     tools_advertised:null,
     vision:null}})}))},

  async _modelsMock(){return{snapshot_revision:null,items:[]}},

  /* GET /api/v1/benchmark-results — EvidenceRecord per SIRVIS.md §12.3, built
     from the real suite in ../clarvis/docs/benchmarks.md rather than written out.

     There is deliberately no `score`. Two of the four accuracy measures did not
     discriminate at all — code was 6/6 for every model including the 1.8 GB one,
     tool calls were clean for everything that reached the table — and a composite
     that averages a measure with no variance in it manufactures a difference the
     run did not find. What varied was rate, first token, and behaviour on the
     second turn, so those are what the record carries. Ranking is RAVIS's job
     from these measures, not a number SIRVIS hands over pre-decided. */
  async evidence(){
   /* Live SIRVIS first. Every stored run carries its results inline, so one
      request answers the whole screen; when nothing answers, the transcription
      below stands in and `source` says so on screen. */
   const live=await liveSirvis('/api/v1/benchmark-runs?limit=50');
   /* **SIRVIS answering with no runs is an answer.** This fell through to the
      transcription whenever the list was empty, so a machine that has never run
      a benchmark — every fresh install — was shown a table of MEASURED results
      for builds it has never measured. The rows fade, because the fallback
      carries no `source`, but a faded table of fabricated measurements is still
      a table of fabricated measurements, and this is the screen whose whole
      subject is what was actually measured here. */
   if(live&&!live.items.length)return{source:'live',live:true,empty:true,items:[]};
   if(live&&live.items.length){
    /* One row per *identity*, not per run. §12.2 keys evidence on the machine,
       the build, the runtime configuration, the role and the suite — so two
       runs of one suite against one build are two results and one evidence ID,
       and this table wants the current answer rather than the history. Runs
       arrive newest first, so the first sighting of an ID is the latest.

       Deliberately not deduplicated by build name: the same weights measured at
       a different context are a different identity and belong on their own row,
       which is the whole reason the configuration is in the key. */
    const seen=new Set(),items=[];
    for(const run of live.items)for(const result of run.results||[]){
     const rec=sirvisEvidence(result);
     if(seen.has(rec.evidence_id))continue;
     seen.add(rec.evidence_id);items.push(rec)}
    /* `live` as well as `source`. These three adapters predate the flag and
       still speak the older idiom, which is exactly the drift that produced
       ten ways of asking one question — a card reading `.live` here got
       `undefined` and faded a live read. `source` is kept because several
       cards already read it and it carries more than a boolean. */
    return{source:'live',live:true,items}}
   /* **No evidence, rather than transcribed evidence.** This built MEASURED
      records from a bundled LM Studio snapshot and a table of benchmark numbers
      in this file — real measurements, taken on one machine on one evening, and
      presented as though this deployment had them. §12.3 makes an evidence
      record a claim about *this* installation.

      RAVIS publishes real ones at `/api/v1/evidence`, which the branch above
      reads. This is what a reader sees when it has none. */
   return{items:[],live:false};
},

  /* GET /api/v1/benchmark-runs?result={id} — the detail behind one headline.

     The individual takes live in the harness output (`n_*.json` in the
     clarvis-firstrun repository) and were not copied into this snapshot, so this
     endpoint returns what the write-up retained: the medians, the sample count,
     the warmups that were run and discarded, and the control re-measurement.

     That control is the honest substitute for showing three bars. The same model
     was re-run the same evening after the machine had been working, and came back
     within 3.4% — which is what makes the granite rows measured later in the day
     comparable to the ones above them at all. On a fanless machine a table
     assembled across two days flatters or punishes for reasons that are not the
     model. */
  async runs(){
   const live=await liveSirvis('/api/v1/benchmark-runs?limit=1');
   if(live&&live.items.length){const r=live.items[0],e=(r.results||[])[0]||{};
    /* Both consumers of this method — the SIRVIS dashboard card and the
       Results run-detail card — read `x.median`, so every measure is an object
       whether or not it has a number in it. `effective_tok_s` never does: it
       needs a token count against total latency and the envelope publishes a
       rate rather than a count. Null median, guarded at both display sites,
       beats a plausible number nobody measured. */
    const med=n=>(e.metrics||{})[n]?Math.round(e.metrics[n].median*100)/100:null;

    return{source:'live',live:true,suite:(e.suite||{}).id,version:(e.suite||{}).version,
     role:e.role,target:e.target_key,samples:e.samples,
     generation_tok_s:{median:med('generation_tokens_per_second')},
     first_token_s:{median:med('time_to_first_token_seconds')},
     effective_tok_s:{median:null},
     /* A control is a property of a *sweep*, not of a run. Today's cooled sweep
        bracketed itself with one; the engine records runs, so a live detail has
        none and the cards say so rather than printing a drift nobody measured. */
     control:null,
     /* Warmups are run and discarded by the engine and are not published in the
        envelope, so this says that rather than printing a number it does not
        have. */
     warmups:'run and discarded — not carried in the envelope',parallel:1,
     raw_runs:r.results_path||'written beside the run',validity:e.validity}}
   /* **No run, rather than a specimen of one.** This returned a complete
      benchmark envelope — target, medians, a control comparison, a validity
      verdict — for a run nobody had performed. The live branch above is the
      real one; this is what a reader sees when SIRVIS has recorded nothing. */
   return{suite:'',version:null,role:'',target:'',warmups:null,samples:null,parallel:null,
   generation_tok_s:{},effective_tok_s:{},ttft_s:{},first_token_s:{},
   control:null,measures:{},raw_runs:'',validity:''}},

  /* GET /api/v1/benchmark-jobs — states are the closed contract enum. The
     internal phase rides in `detail`; consumers switch on `state`. */
  async jobs(){
   /* **The queue exists since SIRVIS M14**, so this reads it. A job is not a
      run: a job may sit queued, be cancelled before anything loads, or fail
      before a run exists — and `run_id` is what links the two once the engine
      opens one.

      Runs remain the fallback, and deliberately rather than as a leftover. A
      SIRVIS from before M14 answers 404 here and still has a run history, and
      showing that history is better than showing nothing; the screen says which
      of the two it is looking at. */
   const queue=await liveSirvis('/api/v1/benchmark-jobs?limit=25');
   if(queue)return{source:'live',live:true,queue:true,items:(queue.items||[]).map(j=>({
    job_id:j.job_id,state:j.state,detail:j.detail||null,
    suite:j.suite||'—',target:dash(j.model),
    /* Still null. Nothing publishes a fraction, and a zero bar would claim a
       job that had started and achieved nothing. */
    progress:null,submitted:(j.submitted_at||'').slice(11)||j.submitted_at,
    run_id:j.run_id,cancellable:['queued','running'].includes(j.state)}))};
   const live=await liveSirvis('/api/v1/benchmark-runs?limit=25');
   /* Answered-with-nothing is live, the last of three fetches that read it as
      absent. A SIRVIS that has run no benchmarks yet is answering, and falling
      back here put four invented jobs on the queue of a working service whose
      real answer was "none". The screen counts with `filter` and `find`, so an
      empty list renders as an empty queue rather than throwing. */
   if(live)return{source:'live',live:true,items:live.items.map(r=>{
    const e=(r.results||[])[0]||{},s=e.suite||{};
    return{job_id:r.run_id,state:r.state,detail:r.detail||null,
     suite:s.id?s.id+'@'+s.version:'—',target:dash(e.target_key),
     /* Null, not zero. A run is created already running and either finishes or
        does not; nothing publishes a fraction, and a zero bar would claim a job
        that had started and achieved nothing. */
     progress:null,submitted:(r.started_at||'').slice(11)||r.started_at}})}
   return{items:[]}},

  /* GET /api/v1/downloads — persistent jobs; a browser reload must not lose them.
     The completed and already_present rows are builds this machine really has, at
     their real size on disk. */
  async downloads(){return{disk_free_gb:null,items:[]}},

  /* GET /api/v1/machines/{id} — the snapshot every result is pinned to. Read from
     this machine: sysctl for the chip and memory, sw_vers for the OS, df for the
     disk, and `lms runtime ls` for the engine versions. */
  async machine(){
   /* The runtime list is a second endpoint, fetched alongside rather than
      nulled: SIRVIS publishes it at /api/v1/runtimes, and the System screen
      renders it. An empty list is a real answer (no runtime configured); a
      null one crashed the screen, which is how this was found. */
   let runtimes=[];
   try{
    const read=await sirvisRead('runtimes');
    if(read.available)runtimes=((read.data.items)||[]).map(x=>({
      name:x.runtime_key,
      version:x.version||`${x.model_count} builds · ${x.state}`}));
   }catch(e){runtimes=[]}
   return live('sirvis','/api/v1/system',this._machineMock,p=>{
   /* GiB, not decimal GB. This divided by 1e9 and rendered a 24 GB Mac as
      "25.8 GB" — technically correct and something nobody, including Apple,
      calls that machine. It also put two different totals for one machine on
      the System screen the moment NERVIS's own live sample landed beside it,
      because the runtime-set adapter below already used 1073741824. */
   const gb=b=>b==null?null:+(b/1073741824).toFixed(1);
   return{
    machine_id:p.machine_id,
    chip:p.chip,
    cpu_cores:p.cpu_cores,cpu_performance_cores:p.performance_cores,
    cpu_efficiency_cores:p.efficiency_cores,gpu_cores:p.gpu_cores,
    memory_gb:gb(p.unified_memory_bytes),
    available_gb:gb(p.memory_available_bytes),
    swap_gb:gb(p.swap_used_bytes),
    disk_free_gb:gb(p.disk_free_bytes),
    macos:p.os_description||p.os_version,
    thermal_state:p.thermal_state,
    /* Three fields SIRVIS does not report, left null rather than defaulted.
       `model` — it reads the *chip* (`Apple M5`), not the enclosure; nothing on
       the machine says "MacBook Air" to a sysctl.
       `system_baseline_gb` — the memory this machine uses at rest with LM Studio
       open before any model loads. That was *measured by hand*, not computed,
       and nothing detects it.
       `model_budget_gb` — derived from the baseline, so it inherits its absence.
       Each renders as unknown, because a fit decision made against a made-up
       budget is worse than one nobody made. */
    /* The machine's own name, and the board identifier §5.1 names as snapshot
       metadata. `model` was rendering "not detected" because SIRVIS never read
       either — it does now. The marketing name ("MacBook Air") is still absent
       and stays absent: it needs a lookup table that is wrong the week a new
       machine ships, and `Mac17,3` is exact. */
    hostname:p.hostname,
    model:p.model_identifier,
    sensitive_fields:p.sensitive_fields||[],
    system_baseline_gb:null,model_budget_gb:null,cooling:null,
    runtimes};
   })},

  async _machineMock(){return{machine_id:'',model:'',chip:'',cpu_cores:null,cpu_performance_cores:null,cpu_efficiency_cores:null,gpu_cores:null,memory_gb:null,swap_gb:null,disk_free_gb:null,macos:{version:''},thermal_state:'',cooling:'',system_baseline_gb:null,model_budget_gb:null,available_gb:null,runtimes:[],accelerators:[]}},

  /* POST /api/v1/recommendations — ranked WITH exclusions and uncertainty, never
     a bare winner. SIRVIS suggests; RAVIS decides.

     This is the benchmark's own conclusion, including the part that is still
     open: a build that may beat the recommendation has not been through the full
     suite, and the ranking does not move until it has. An engine that hid that
     would be more decisive and less useful. */
  /* POST /api/v1/recommendations -> the ranked/excluded shape this screen reads.

     Live, the two things this page most wants are usually absent, and both are
     rendered as absences rather than filled:

       fit / headroom  §14.2's tiers exist and their input does not — nothing
                       records an installed size — so every tier is UNKNOWN.
       a second role   a pair needs chat evidence, and nothing has measured the
                       clarvis-chat role on this machine.

     `coverage` is the field to read first. The agent profile puts 35% of its
     weight on coding and 15% on reasoning, and no suite measures either, so a
     live score rests on 45% of its own profile. The mock has none of that
     because it was written when the numbers were transcribed rather than
     computed. */
  async recommendations(){
   try{
    /* Through NERVIS since M5, which negotiates `sirvis.recommendations` before
       calling. The four-second timeout became thirty in `peerRead`: this reads
       every evidence record for the roles asked about, and the read timeout was
       aborting calls that were working. */
    const read=await sirvisRead('recommendations',
      {profile:'clarvis',roles:['clarvis-chat','clarvis-agent'],mode:'verified'},'POST');
    if(!read.available)throw new Error(read.reason);
    const d=read.data;
    SOURCE.sirvis='live';
    const ranked=Object.entries(d.roles).filter(([,u])=>u).map(([role,u],i)=>({
      rank:i+1,target:u.runtime_key,role,
      fit:d.fit.tier,headroom_gb:null,
      evidence_type:'MEASURED',samples:null,coverage:u.coverage,
      why:`score ${u.score} on ${Math.round(u.coverage*100)}% of the profile — `
         +Object.entries(u.axes).map(([k,v])=>`${k} ${v}`).join(', ')
         +`. No evidence for: ${Object.keys(u.missing).sort().join(', ')||'nothing'}`}));
    const excluded=Object.entries(d.excluded).flatMap(([role,items])=>items.map(e=>({
      target:e.runtime_key,why:`${role} · ${e.reasons.join('; ')}`})));
    return{profile:d.profile,generated_at:d.generated_at.slice(0,16).replace('T',' '),
      algorithm_version:d.algorithm_version,mode:d.mode,
      expires_in_min:Math.round(d.expires_after_seconds/60),
      ranked,excluded,uncertainty:d.uncertainty,
      proposed:d.proposed_benchmarks||[],live:true};
   }catch(e){return this._recommendationsMock()}},

  async _recommendationsMock(){return{profile:'',generated_at:null,algorithm_version:null,mode:'',expires_in_min:null,evidence_type:'',samples:null,excluded:[],ranked:[]}},

  /* GET /api/v1/runtime-sets/{id} — combination evidence, which is the whole
     point: per-member numbers do not predict the pair.

     On this machine the memory answer was boring and the behaviour answer was
     not. Holding two builds costs almost nothing up to 12.9 GB resident, and
     every pairing still cleared the deadlines — but ministral-8b, which handles a
     failed tool call correctly when it is alone, stopped using the tool in both
     pairings it appeared in. Nothing in either build's own record predicts that,
     and no amount of single-model benchmarking would have found it. */
  /* Two endpoints, because the definition and the measurements live apart and
     should: GET /api/v1/runtime-sets is what somebody *declared*, and the pair
     numbers are on a benchmark result like any other measurement.

     Joined on the set NAME **and** the revision, both of which the matrix
     snapshots at run time. Name alone would let a revision-1 measurement
     describe a revision-3 definition — the thing §10's immutable-at-use rule
     exists to prevent, reintroduced in the presentation layer.

     Three absences:
       follow_up  no tool-call trial exists. `TrialRate` is declared on the
                  evidence record and constructed nowhere, so this column has no
                  source until M13. It is the most load-bearing column on the
                  screen, so it renders absent and says why rather than showing
                  a solo figure in a co-residency column.
       peak_gb    M10's matrix carries `memory` per condition, added *after* the
                  only run that exists — so this run's matrix has memory: null.
                  The figures are in that run's telemetry, not on this endpoint.
       pairs      one measured combination exists, not five. */
  async runtimeSet(){
   const [sets,runs]=await Promise.all([
     liveSirvis('/api/v1/runtime-sets'),
     liveSirvis('/api/v1/benchmark-runs?limit=50')]);
   const items=(sets&&sets.items)||[];
   /* **An empty answer is an answer.** This fell back to the transcription
      whenever the list was empty, so a SIRVIS with no Runtime Set defined — an
      ordinary state on a fresh install — rendered invented pairings between
      builds nobody had ever measured together. That is the emptiness-as-absence
      fault found three times already on other screens, and it is worse here
      because the invented rows look like measurements.

      Four outcomes now, and they are four different sentences: a read failed;
      SIRVIS has no set defined; sets exist but no run carries an interaction
      matrix; or there is a matrix to show. */
   if(!sets||!runs)return withSource(await this._runtimeSetMock(),false);
   const measured=this._measuredMatrices(runs);
   if(!items.length||!measured.length){
    SOURCE.sirvis='live';
    /* Every key the mock carries, because two other screens read this object
       and a shape that is missing one of them blanks them. The SIRVIS Dashboard
       reads `rs.members` and threw on the first version of this empty answer —
       found by rendering every screen against services that are up and hold
       nothing, which is the fresh-install world nothing else exercises. */
    return{live:true,empty:true,runtime_set_id:null,revision:null,name:null,
     evidence_type:'UNKNOWN',samples:0,combined_peak_gb:null,swap_gb:null,
     members:[],pairs:[],validity:{},finding:null,
     reason:items.length?'sets are defined, but no benchmark run carries an interaction matrix yet'
                        :'no Runtime Set is defined on this machine'};
   }
   const newest=measured[0];
   const set=items.find(s=>s.name===newest.m.runtime_set)||items[0];
   SOURCE.sirvis='live';
   return withSource(this._runtimeSetView(set,newest,
     this._matrixLens(newest,this._resultsByRole(measured,newest))),true);
  },

  /* Every stored result that carries an interaction matrix, newest first.
     Split out of `runtimeSet`, which measured cyclomatic complexity 30 — the
     highest in the file and nearly four times the gate the Python is held to.
     Almost all of it was optional-field shaping: `||{}` and `||[]` repeated at
     each of twenty reads. Those are genuinely branches, and no reader ever
     experienced them as thirty decisions, which is exactly why they
     accumulated unnoticed. */
  _measuredMatrices(runs){
   return ((runs&&runs.items)||[]).flatMap(run=>((run.results)||[])
     .filter(res=>res.interaction_matrix)
     .map(res=>({res,m:res.interaction_matrix})));
  },

  /* The result per role, for the newest matrix only.
     Keyed by revision as well as set name: two runs of the same Runtime Set at
     different revisions are different measurements, and merging them would
     read one revision's throughput under another's label. */
  _resultsByRole(measured,newest){
   const forRole={};
   for(const {res,m} of measured)
    if(m.runtime_set===newest.m.runtime_set&&m.revision===newest.m.revision)
     forRole[res.target_key]=res;
   return forRole;
  },

  /* One place where every optional field is defaulted, instead of twenty.
     The accessors below are the reason the complexity collapsed: `fig(role,
     cond)` states "a figure may be absent" once, and the twelve call sites
     that used to spell `(row.figures||{})[cond]||{}` inline now state nothing
     at all. */
  _matrixLens(newest,forRole){
   const m=newest.m,rows=m.rows||{};
   const roles=m.load_order||Object.keys(rows);
   const round=(n,d=2)=>n==null?null:Math.round(n*Math.pow(10,d))/Math.pow(10,d);
   const row=role=>rows[role]||{};
   const fig=(role,cond)=>(row(role).figures||{})[cond]||{};
   const build=role=>{const r=forRole[role];if(!r)return role;
    return [r.target.model_family,[r.target.format&&r.target.format.toUpperCase(),
      r.target.quantization].filter(Boolean).join(' ')].filter(Boolean).join(' · ');};
   return{roles,round,row,fig,build,
    gb:b=>b==null?null:round(b/1073741824,1),
    deg:role=>row(role).degradation_percent||{},
    conc:(m.memory||{}).concurrent||{},
    conditions:m.conditions||[],
    samples:fig(roles[0],'alone').samples||0,
    anyResult:forRole[roles[0]]||newest.res};
  },

  _runtimeSetMembers({roles,round,fig,deg,build}){
   return roles.map(role=>({
    role,family:build(role),
    alone_tok_s:round(fig(role,'alone').tokens_per_second,1),
    sequential_tok_s:round(fig(role,'sequential').tokens_per_second,1),
    concurrent_tok_s:round(fig(role,'concurrent').tokens_per_second,1),
    first_token_alone_s:round(fig(role,'alone').time_to_first_token,3),
    first_token_concurrent_s:round(fig(role,'concurrent').time_to_first_token,3),
    degradation:deg(role),
    follow_up_alone:null,follow_up_concurrent:null}));
  },

  /* Co-residency is three states, not two.
     This read `complete ? 'every member resident together' : 'FAILED — ' +
     co_residency_failure`, so a matrix that simply had not recorded the field
     rendered as **"FAILED — undefined"** — an unknown printed as a confident
     failure, which is the one thing every honesty rule in these specifications
     forbids. Found by the sparse fixture in `tools/shaping_fixtures.js`, on the

      nothing remembered a previous answer.

      endpoint, and the states it renders are §5.1's observer-side eight rather
      than "did my fetch work". The per-service fallback below still exists for
      the case this file is opened from disk with nothing running. */
   try{
    const r=await fetch(BASE.nervis+'/api/v1/services',{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});

    const d=await r.json();
    absorbRegistry(d);

       registry from the per-service fallback below — and the Overview's
       registry card hardcoded ` live`, claiming a live read on a page opened

       live rows with mock ones. */
    return{live:true,items:d.items.map(e=>({
     service_type:e.key,label:e.label,build_version:dash(e.build_version),
     protocol_version:dash(e.protocol_version),
     /* The first *available* capability, not the first declared: a service that
        publishes ten and offers none should read as offering none. */
     capability:Object.entries(e.capabilities||{}).find(([,st])=>st==='available')?.[0]

     /* Published or derived, kept apart all the way to the screen. A capability
        NERVIS worked out by asking LM Studio's own API is a weaker fact than one
        a service published, and flattening the two into one column is how a
        control ends up bound to something nobody promised (SS5.2). */
     capability_source:e.capability_source||'',
     capabilities_available:Object.values(e.capabilities||{}).filter(st=>st==='available').length,
     capabilities_total:Object.keys(e.capabilities||{}).length,

        exit asks that unsupported hosts be blocked in the UI, and the answer
        for code-server lives in `codeserver.workbench` — a count cannot say
        *which* capability is down, and the reason is the whole message. */
     capabilities:e.capabilities||{},capability_reasons:e.capability_reasons||{},
     key:e.key,state:e.state,detail:e.detail,age:0,

        Clarvis tab embeds code-server in an iframe and takes the `src` from

      fetch(BASE[key]+'/ecosystem/identity',{signal:stop}).then(r=>r.ok?r.json():null),
      fetch(BASE[key]+'/ecosystem/capabilities',{signal:stop}).then(r=>r.ok?r.json():null)]);

      build_version:id.build_version,protocol_version:id.protocol_version,
      capability:up.length?up[0].id:'none available',
      state:'healthy',age:0,

/* DEMO_API covers user *actions* (the POSTs). Same rule: one method per real
   endpoint, replace the body with fetch and keep the signature. */
/* ── DEMO_API ───────────────────────────────────────────────────────────────
   Every control on this page that would *change* something, and what actually
   backs it. Eight of the nine had no endpoint at all and raised a toast, which
   is the worst available answer: the operator learns the system does something
   it does not, and finds out otherwise at the moment it matters.

   So a control whose endpoint does not exist now renders **disabled**, with the
   endpoint it is waiting for in its tooltip. `unbuilt()` is that answer, and
   `control()` is how a caller asks for a button without having to know which
   kind it gets. The one live operation — loading a model under a lease — is on
   the Runtime screen, where the session it creates can also be seen and
   released. A control that starts something invisible is only half a control. */
const UNBUILT={
 download:'POST /api/v1/downloads · SIRVIS M11',
 activateProfile:'POST /api/v1/profiles/{id}/activate · no endpoint; RAVIS management is read-only at M18a',
 setProvider:'POST /api/v1/providers/{id}/enable · no endpoint; RAVIS management is read-only at M18a',
 refreshEvidence:'POST /api/v1/evidence/refresh · RAVIS M13',
 runBenchmark:'POST /api/v1/benchmark-jobs · specified in SIRVIS §4.2, not built — benchmarks run on the CLI',
 reroute:'POST /api/v1/route-tests · no endpoint',
};

/* Which declared operation governs a control, where one does.
 
   **NERVIS publishes this and nothing read it.** `/api/v1/services` carries
   fifteen operations, each naming its owning service, the capability it needs,
   whether it is usable right now and why not — §5.2's requirement that a
   control cannot exist without having answered those questions. The page stored
   the list in `OPERATIONS` and never looked at it again, and `capable()` was
   defined and never called, under a comment claiming it "makes control gating
   real rather than a promise". Stage 6's exit is that every control is
   capability-driven; it was driven by a hand-written map in the browser.
 
   Mapped only where an operation genuinely governs the control. `reroute` and
   `refreshEvidence` have no declared operation -- claiming a *read* operation
   governs a write would be the same overstatement in a new place -- and
   `loadModel` and `clearEventFilters` touch no service at all. Those stay with
   `UNBUILT`, which answers a different question: not "the service says no" but
   "there is nothing to call". */
const CONTROL_OPERATION={
 runBenchmark:'sirvis.jobs',
 activateProfile:'ravis.management',
 setProvider:'ravis.management',
};

function operationFor(action){
 const key=CONTROL_OPERATION[action];
 return key?OPERATIONS.find(op=>op.key===key)||null:null;
}

/* A button for an operation that exists, or a disabled one that names what it
   is waiting for. Never a button that looks live and is not. */
function control(label,action,extra){
 /* The owning service's own answer leads. A capability it reports unavailable

    the service changes its mind -- which is what "capability-driven" has to
    mean if it is to survive the next milestone shipping. `UNBUILT` is the
    fallback for an action no operation covers. */
 const op=operationFor(action);
 const refused=op&&!op.usable
   ?(op.reason||`${op.service} reports ${op.capability} as ${op.availability}`):'';

    because the service refuses it or because this page has nothing to call, and
    those need different work from different people. When the capability is
    usable and no handler exists, saying "not built" about the *endpoint* would
    be wrong the moment the service ships it -- the same staleness the audit
    spent a day removing -- so the reason names the dashboard instead. */
 const wired=typeof DEMO_API[action]==='function'||typeof window[action]==='function';

   ?`${op.service.toUpperCase()} offers this; the dashboard has no control wired to it yet`
   :(UNBUILT[action]||'no control is wired to this yet'));

    TypeError on click. The helper exists to make a dead control impossible, so
    it has to know both shapes a handler comes in. */
