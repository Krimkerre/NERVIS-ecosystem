/* Credentials — the one screen that exists so a provider can be reached at all.
   Every other RAVIS screen answers a question about a running system; this one
   is what makes the system able to run. Without it Google, Anthropic and
   OpenRouter are configuration RAVIS can describe and never use.

   The value goes one way. RAVIS returns a status — configured or not, and from
   which source — and has no endpoint that reads a credential back, so this
   screen cannot show one even by mistake. That is why the field is always empty
   on load rather than pre-filled with dots pretending to be a stored value. */
async function ravisCredentials(){
 heading('Credentials','Provider keys. Entered here, stored by RAVIS, never read back.');
 let payload=null;
 try{
  const r=await fetch(BASE.ravis+'/api/v1/providers/credentials',readDeadline());
  if(r.ok)payload=await r.json();
 }catch(e){payload=null}

 if(!payload){
  $('#content').innerHTML=`<div class="card full"><h3>RAVIS is not answering</h3>${cell(`
   <div class="trace-step"><b>endpoint</b><span class="mono">GET /api/v1/providers/credentials</span></div>
   <small class="mono dim">no transcription to fall back to, deliberately. A remembered "configured" for a service that is not running would be the most misleading thing this screen could say.</small>`,'ravis')}</div>`;
  return;}

 const items=payload.items||[];
 const loose=items.filter(i=>i.configured&&!i.file_is_private);
 const label={file:'stored by RAVIS',keychain:'macOS Keychain',environment:'environment variable',absent:'not set'};

 /* The provider's own name for itself, from RAVIS, falling back to the id.
    The id stays `google` because it is a wire value — it keys the credential
    file, it is half of `RAVIS_GOOGLE_API_KEY`, and it is a path segment in
    `ravis/<provider>/<model>`. "Google AI Studio" is what a person should read:
    it names the surface these keys come from, as opposed to Vertex AI, which is
    the same models behind a service account and a different credential shape. */
 const row=i=>`<div class="table-row" style="grid-template-columns:1.1fr auto 1.6fr auto auto;align-items:center;gap:8px">
   <span class="mono"><b>${escapeHtml(i.label||i.name)}</b>${i.routable===false?' <span class="chip warn" title="no adapter or upstream is declared for this provider">unroutable</span>':''}</span>
   <span class="mono" style="opacity:.75">${escapeHtml(i.configured?'&#9679; '+label[i.source]:'&#9675; not set')}</span>
   <span><input id="${domId('cred',i.name)}" type="password" autocomplete="off"
     placeholder="${i.configured?'replace the stored key\u2026':'paste the API key\u2026'}"
     style="width:100%;background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:6px;font-family:inherit"></span>
   <button class="btn primary" onclick="CREDS.save('${jsAttr(i.name)}')">Save</button>
   <button class="btn" onclick="CREDS.forget('${jsAttr(i.name)}')"${i.source==='file'?'':' disabled title="RAVIS only removes what it stored itself" style="opacity:.45;cursor:not-allowed"'}>Remove</button>
  </div>`;

 $('#content').innerHTML=`
  <div class="card full${liveClass(Boolean(payload))}"><h3>Provider keys</h3>${cell(`
   ${items.map(row).join('')}
   ${items.some(i=>i.routable===false)?`<small class="mono dim" style="display:block;margin-top:6px"><b>Unroutable</b> means the key would be stored and never sent: no adapter and no declared upstream carries that provider. Until M10 connected the store, <b>every</b> row was unroutable — a key typed here was written to a 0600 file, reported as configured, and read by nothing. Declare an upstream with that <span class="mono">kind</span> to make one reachable.</small>`:''}
   <small class="mono dim">the field is empty because RAVIS has no endpoint that returns a credential — not because it is hiding one. Saving replaces whatever was there. <b>Remove</b> deletes only from RAVIS's own file: a key in an environment variable or the Keychain was put there by something else, so the row may still read configured afterwards, from the lower source.</small>
   ${explains('where these are written, and why the voice key is not among them',`
    <div class="trace-step"><b>written to</b><span class="mono">~/.config/ravis/credentials.json</span></div>
    <div class="trace-step"><b>permissions</b><span>0600 — owner only</span></div>
    <div class="trace-step"><b>also read from</b><span>macOS Keychain, then environment</span></div>
    <div class="trace-step"><b>read back by any endpoint</b><span>never</span></div>
    <div class="trace-step"><b>Fish Audio key</b><span><a href="#" onclick="go('nervis','Settings');return false" style="color:inherit"><b>NERVIS &rarr; Settings</b></a></span></div>
    <small class="mono dim">the same protection as the SSH private key sitting next to it — encryption at rest would need a key RAVIS can read unattended, which anyone with the same file access could read too.<br><br>every key on this screen is one <b>RAVIS</b> needs to route a completion. The text-to-speech key is not: §18.2 keeps voice credentials in NERVIS's own storage, and the deciding reason is the privacy gate — whether a sentence may reach a cloud voice depends on <i>which model produced it</i>, a fact NERVIS holds and RAVIS would have to be told.</small>`)}`,'ravis')}</div>

  ${loose.length?`<div class="card full"><h3>File permissions</h3>${cell(`
   <div class="trace-step"><b>${loose.map(i=>escapeHtml(i.name)).join(', ')}</b><span>readable by other accounts on this machine</span></div>
   <small class="mono dim">RAVIS writes the credential file at mode <b>0600</b>. Something has widened it since. Repair with <span class="mono">chmod 600 ~/.config/ravis/credentials.json</span> — the file is still being read, because refusing would lock you out of your own service over a permission bit.</small>`,'ravis')}</div>`:''}

`;
}

/* The Settings screen's one real writer.

   Separate from `SPEECH` on purpose: `SPEECH` owns playback and re-renders the
   chat strip after a change, and this screen has no strip to re-render. Both
   write the same endpoint, which is the point — a setting with two editors and
   one home, rather than a second copy of the state. */
const SETTINGS={
 async voice(key,value){
  try{
   const r=await fetch(BASE.nervis+'/api/v1/voice/settings',{method:'PUT',
     headers:{'content-type':'application/json'},
     body:JSON.stringify({[key]:value==='true'?true:value==='false'?false:value})});
   if(!r.ok)throw new Error(String(r.status));
   /* Mute has to bite now rather than at the end of whatever is playing
      (§18.2: "honoured immediately"), and this screen can be open while a
      reply is being spoken. */
   if(key==='muted'&&value===true)SPEECH.stop();
   notify('Saved');
   render();
  }catch(e){notify('NERVIS did not accept that change')}
 },
};

const PROVIDERS={
 /* The Protocol mode card, folded into the column it described.

    It was a second table listing which providers are transparent and which are
    translated — both already a column in the Health table above it — plus two
    sentences nobody reads until the moment they care. Attaching the sentences
    to the value makes the screen shorter and puts the explanation where the
    question is asked, which is the point at which somebody clicks "translated"
    wondering what it costs them. */
 PROTOCOL:{
  transparent:'proxied essentially unchanged — an OpenAI client is talking to an OpenAI API. '
    +'Nothing re-frames the stream, so tool-call fragments arrive exactly as the provider sent them.',
  translated:'request and streamed response are rewritten into another vendor\u2019s shape. '
    +'Every translated path is a place tool-call framing can be lost: fragmented arguments, a '
    +'renumbered tool index, a dropped tool_call_id \u2014 which is what the conformance suite checks, '
    +'and why a provider passing "chat works" is not yet a provider Clarvis can use.',
 },
 explainProtocol(mode){
  const box=document.getElementById('protocolNote');
  if(!box)return;
  /* Clicking the same value again closes it: the row is an answer to a
     question, not a permanent third of the screen. */
  if(box.dataset.mode===mode&&box.style.display!=='none'){box.style.display='none';return}
  box.dataset.mode=mode;
  box.style.display='';
  box.innerHTML=`<b>${mode}</b><span style="opacity:.8">${escapeHtml(this.PROTOCOL[mode])}</span>`;
 },
 /* One provider's catalogue while its picker is open, keyed by provider.
    Held here rather than read back off the checkboxes: a search narrows what is
    *rendered*, and a selection made before searching has to survive the list
    being rebuilt. Reading the DOM would silently drop every tick that scrolled
    out of the filter. */
 picked:{},

 editFilter(name){
  const panel=document.getElementById(domId('mf',name));
  if(!panel)return;
  const opening=panel.style.display==='none';
  panel.style.display=opening?'block':'none';
  document.getElementById(domId('mfp',name)).style.display='none';
  if(opening)this.load(name);
 },

 patterns(name){
  /* Patterns and ticks edit the same filter, so only one is shown at a time —
     two views of one value, both editable, is how a screen writes back the one
     nobody touched. */
  document.getElementById(domId('mf',name)).style.display='none';
  document.getElementById(domId('mfp',name)).style.display='grid';
 },

 /* The whole catalogue, paged until it is exhausted.
    Every page, not a sample: a checkbox list that omits a model is one the
    operator cannot see and cannot select, and RAVIS caps its *sample* endpoint
    precisely so a truncated list is never mistaken for the answer. */
 async load(name){
  const list=document.getElementById(domId('mfl',name));
  list.innerHTML='<div class="picker-empty">reading the catalogue\u2026</div>';
  const items=[];
  let offset=0;
  try{
   while(offset!==null){
    const r=await fetch(BASE.ravis+'/api/v1/providers/'+encodeURIComponent(name)
      +'/catalogue?offset='+offset+'&limit=500',{signal:AbortSignal.timeout(8000)});
    if(!r.ok){list.innerHTML=`<div class="picker-empty">RAVIS refused: HTTP ${escapeHtml(r.status)}</div>`;return}
    const page=await r.json();
    items.push(...(page.items||[]));
    offset=page.next_offset;
   }
  }catch(e){
   list.innerHTML='<div class="picker-empty">RAVIS is not reachable.</div>';return;
  }
  if(!items.length){
   list.innerHTML='<div class="picker-empty">this provider publishes no catalogue yet \u2014 it may need a credential, or its first refresh.</div>';
  }
  this.picked[name]={all:items.map(i=>i.id),on:new Set(items.filter(i=>i.selected).map(i=>i.id)),q:''};
  this.render(name);
 },

 /* The search box matches the model id and the provider's own name, so
    "openrouter" narrows to that provider's rows even though its ids do not all
    carry the word. */
 matching(name){
  const st=this.picked[name];
  if(!st)return[];
  if(!st.q)return st.all;
  return st.all.filter(id=>id.toLowerCase().includes(st.q)
    || name.toLowerCase().includes(st.q));
 },

 render(name){
  const st=this.picked[name];
  if(!st)return;
  const list=document.getElementById(domId('mfl',name));
  const shown=this.matching(name);
  list.innerHTML=shown.length
   ?shown.map(id=>`<label class="picker-item" title="${id}">
     <input type="checkbox"${st.on.has(id)?' checked':''}
       onchange="PROVIDERS.tick('${jsAttr(name)}','${jsAttr(id).replace(/'/g,"&#39;")}',this.checked)">
     <span>${id}</span></label>`).join('')
   :'<div class="picker-empty">nothing matches that.</div>';
  const count=document.getElementById(domId('mfc',name));
  /* Says what is selected out of the whole catalogue, never out of what the
     search happens to show — the second number is the one an operator is about
     to act on, and reporting the visible subset would make "all" mean two
     different things depending on the search box. */
  count.textContent=`${st.on.size} of ${st.all.length} selected`
    +(st.q?` \u00b7 ${shown.length} shown`:'');
 },

 tick(name,id,on){
  const st=this.picked[name];
  if(!st)return;
  if(on)st.on.add(id); else st.on.delete(id);
  document.getElementById(domId('mfc',name)).textContent=
    `${st.on.size} of ${st.all.length} selected`+(st.q?` \u00b7 ${this.matching(name).length} shown`:'');
 },

 search(name,q){
  const st=this.picked[name];
  if(!st)return;
  st.q=(q||'').trim().toLowerCase();
  this.render(name);
 },

 /* Acts on what the search shows, which is the only reading that makes sense
    of "All" next to a filtered list — otherwise typing `gemini` then clicking
    All would tick four hundred unrelated models. */
 checkAll(name,on){
  const st=this.picked[name];
  if(!st)return;
  const shown=this.matching(name);
  for(const id of shown){if(on)st.on.add(id); else st.on.delete(id)}
  this.render(name);
 },

 async applyPicked(name){
  const st=this.picked[name];
  if(!st)return;
  /* **Everything ticked is stored as no filter, not as a list of every id.**
     The two select the same models today and diverge tomorrow: a provider that
     adds a model would have it excluded by the explicit list and included by
     the empty one, and "I ticked everything" plainly means the second. */
  const all=st.on.size===st.all.length;
  const body={include:all?[]:[...st.on],exclude:[]};
  if(!all&&!st.on.size&&!armed('filter:'+name,'Nothing is ticked, which leaves this provider with no models at all'))return;
  try{
   const r=await fetch('/api/v1/ravis/providers/'+encodeURIComponent(name)+'/models',
    {method:'PUT',headers:control_headers(),body:JSON.stringify(body)});
   if(!r.ok){alert('RAVIS refused: HTTP '+r.status);return}
  }catch(e){alert('RAVIS is not reachable.');return}
  delete this.picked[name];
  ravisProviders();
 },

 async applyFilter(name,clear){
  const split=v=>(v||'').split(',').map(s=>s.trim()).filter(Boolean);
  const body=clear?{include:[],exclude:[]}:{
   include:split((document.getElementById(domId('mfi',name))||{}).value),
   exclude:split((document.getElementById(domId('mfe',name))||{}).value)};
  try{
   const r=await fetch('/api/v1/ravis/providers/'+encodeURIComponent(name)+'/models',
    {method:'PUT',headers:control_headers(),body:JSON.stringify(body)});
   if(!r.ok){alert('RAVIS refused: HTTP '+r.status);return}
  }catch(e){alert('RAVIS is not reachable.');return}
  ravisProviders();
 },
 async toggle(name,enabled){
  try{
   const r=await fetch('/api/v1/ravis/providers/'+encodeURIComponent(name)+'/enabled',
    {method:'PUT',headers:control_headers(),body:JSON.stringify({enabled})});
   if(!r.ok){alert('RAVIS refused: HTTP '+r.status);return}
  }catch(e){alert('RAVIS is not reachable.');return}
  ravisProviders();
 }};

/* The chat screen is a real client of RAVIS's OpenAI-compatible API.

   It was previously wired to a button calling `sendChat`, which was never
   defined anywhere — pressing send threw a ReferenceError. So the screen was
   not merely showing a transcribed conversation, it could not have held a real
   one.

   Conversations are persisted by `CHAT_STORE` below — this comment used to say
   nothing was written to disk, which was true when it was written and stopped
   being true the moment storage landed. */
/* Conversation storage.

   §7.2 asks for exactly this and no more: "Local only by default: conversation
   ID, title, timestamps, messages, RAVIS route IDs. Allow deletion." NERVIS M4
   adds "history persists locally".

   **This is `localStorage`, not the database §7.2 eventually wants.** That was
   once because there was nowhere else to put it — M0 was unbuilt and `nervis/`
   was one HTML file on a static server. M0 shipped the package, SQLite and the
   migrations, so a backend now exists and this is a choice rather than a
   constraint: §7.2 says local by default, and per-browser storage cannot leak
   a conversation to another account on this machine. Moving it is NERVIS M20's
   business. `localStorage` satisfies the requirement that matters
   (local, deletable, survives a reload) and is honest about being per-browser
   rather than per-machine: another browser, or a private window, sees nothing.

   Nothing here is sent anywhere. Prompts do not travel to the trace collector,
   which is what the screen has always claimed and can now claim truthfully. */
const CHAT_STORE={
 KEY:'nervis.conversations.v1',
 read(){
  try{
   const raw=localStorage.getItem(this.KEY);
   const list=raw?JSON.parse(raw):[];
   return Array.isArray(list)?list:[];
  }catch(e){
   /* A corrupt or unavailable store yields no history rather than throwing.
      Private browsing refuses localStorage entirely, and a chat screen that
      cannot open is a worse outcome than one that cannot remember. */
   return [];
  }
 },
 write(list){
  try{localStorage.setItem(this.KEY,JSON.stringify(list));return true}
  catch(e){return false}
 },
 save(session){
  if(!session.messages.length)return;
  const list=this.read().filter(c=>c.conversation_id!==session.id);
  list.unshift({
   conversation_id:session.id,
   /* **NERVIS's own id for the same conversation.** Without it this list could
      name a conversation only in the browser's terms, so deleting one removed
      the local copy and left NERVIS holding every message — which is not what
      anybody pressing Delete believes they are doing, and with cross-session
      memory on it left "deleted" conversations still readable by the next one. */
   remote_id:session.remote_id||'',
   title:session.title,
   created_at:session.created_at,
   updated_at:new Date().toISOString(),
   /* Route ids are kept — §7.2 names them explicitly. They are what lets a
      stored reply still explain why that model answered, provided the decision
      is still in RAVIS's in-memory window. */
   messages:session.messages.map(m=>({role:m.role,text:m.text,
     served:m.served||null,route_decision_id:m.route_decision_id||null})),
   params:{system:session.system,temperature:session.temperature,
     max_tokens:session.max_tokens,top_p:session.top_p,profile:session.profile}});
  this.write(list.slice(0,50));
 },
 remove(id){this.write(this.read().filter(c=>c.conversation_id!==id))},
 clear(){this.write([])}
};

/* The user's own name, and the house style.

   Kept by NERVIS through §14's key/value settings store rather than in this
   browser: a name is a fact about the person, not about the tab they happen to
   have open, and it should survive a different browser on the same machine. */
/* Coercions, one per shape, so `load` below is a list of assignments rather
   than a list of guards. It crossed the complexity ratchet at nine settings —
   the ratchet pointing at a function whose every line was `typeof` written out
   longhand. */
const asText=v=>typeof v==='string'?v:'';
const asList=v=>Array.isArray(v)?v:[];
const asMap=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
/* Absent means the default. `!== false` is what distinguishes "never set" from
   "turned off", which the settings store keeps apart on purpose. */
const asFlag=(v,fallback)=>v===undefined?fallback:v!==false;

const USER={
 name:'', system:'', brief:true, pages:true, mode:'', preset:'cp_nervis', params:{}, hydrated:false,
 excluded:[], memory:'session',
 async load(){
  try{
   const r=await fetch(BASE.nervis+'/api/v1/settings',{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
   if(!r.ok)return;
   const items=(await r.json()).items||{};
   this.name=asText(items['user.display_name']);
   /* NERVIS's own voice, seeded by the service on first start and editable
      here. Held on USER rather than only on CHAT_SESSION because the session
      is per-tab and this is not: a system prompt that vanished on reload is
      the complaint that produced all of this. */
   this.system=asText(items['chat.system']);
   PRESETS.items=asList(items['chat.presets']);
   this.brief=asFlag(items['chat.brief'],true);
   this.pages=asFlag(items['chat.page_images'],true);
   this.mode=asText(items['chat.mode']);
   /* NERVIS unless something else was chosen. The seeded settings already hold
      that preset's values, so naming it is a readout rather than a claim. */
   this.preset=items['chat.preset']===undefined?'cp_nervis':asText(items['chat.preset']);
   this.params=asMap(items['chat.params']);
   this.excluded=asList(items['chat.memory_excluded']);
   this.memory=items['chat.memory']==='all'?'all':'session';
  }catch(e){}
 },

 async write(key,value){
  try{await fetch(BASE.nervis+'/api/v1/settings/'+encodeURIComponent(key),{method:'PUT',
    headers:{'content-type':'application/json'},body:JSON.stringify({value})})}catch(e){}
 },
 setName(value){this.name=value;this.write('user.display_name',value)},
 setBrief(on){this.brief=on;this.write('chat.brief',on)},
 setPages(on){this.pages=on;this.write('chat.page_images',on)},
 /* Presentation only: the avatar and the accent. Sends nothing, routes
    nothing, records nothing — the same category as the Focus toggle. */
 setMode(mode){this.mode=mode;this.write('chat.mode',mode)},
 setPreset(id){this.preset=id;this.write('chat.preset',id)},
 setExcluded(list){this.excluded=list;this.write('chat.memory_excluded',list)},
 /* The sampling fields, on blur rather than per keystroke. Everything else
    on this panel already outlived the tab; these did not, so a temperature
    somebody set was gone on the next reload with nothing to say it had
    been. Captured from the session rather than read off the inputs, so a
    value set by applying a preset is saved on the same path as a typed one. */
 saveParams(){
  const taken={};
  for(const key of samplingKeys())taken[key]=CHAT_SESSION[key];
  this.params=taken;
  this.write('chat.params',taken);
 },
 setMemory(scope){this.memory=scope;this.write('chat.memory',scope);render()},
 /* Written on `change` rather than `input`: a PUT per keystroke would be a
    request storm for a textarea somebody is composing a paragraph in. */
 setSystem(value){this.system=value;this.write('chat.system',value)}
};

/* Named sets of chat parameters.

   **Kept in §14's settings store as one value, not in a table of their own.**
   A preset is a handful of short strings and there are never many; a migration,
   four endpoints and a router for that would be more machinery than the thing
   it stores. The voice profiles earned a table because they are joined against
   a credential and a selection; these are not. */
/* The generation parameters, as opposed to the pool and the persona — which are
   kept under their own keys because they are chosen in their own controls. */
function samplingKeys(){return PRESETS.keys().filter(k=>k!=='profile'&&k!=='system')}

const PRESETS={
 items:[],

 /* Built from `ADVANCED_PARAMS` rather than listed twice, so a knob added there
    is captured here automatically. The alternative is the bug that list already
    exists to prevent: a parameter that works in the form, travels in the
    request, and is silently dropped by the thing that saves it. */
 keys(){
  return ['profile','system','temperature','max_tokens','top_p',
    ...ADVANCED_PARAMS.map(p=>p.key),'stop'];
 },

 capture(){
  const taken={};
  for(const key of this.keys())taken[key]=CHAT_SESSION[key];
  /* The voice, which lives on NERVIS rather than on the session — so it is
     read from the loaded settings instead of from `CHAT_SESSION`. A mode is
     what it sounds like as much as what it says: "the butler" is a persona, a
     model *and* a voice, and a preset that restored two of the three would be
     the one nobody trusts. */
  taken.voice_profile=(SPEECH.settings||{}).selected_profile||'';
  /* Length belongs to the mode too. "Just the facts" that still runs six
     paragraphs is not the mode it says it is, and "Deep think" capped at two
     sentences is the house limit quietly defeating the preset. */
  taken.brief=USER.brief;
  taken.mode=USER.mode;
  return taken;
 },

 apply(id){
  const found=this.items.find(p=>p.id===id);
  if(!found)return;
  /* **Every key, not only the ones the preset carries.** A preset is a whole
     mode, so a field it does not name is *unset* rather than "keep whatever was
     there" — switching from Code to NERVIS used to leave Code's temperature of
     0.2 behind, because NERVIS names no temperature. The residue is invisible
     on the screen it came from and changes every reply after it, which makes a
     mode unreproducible: the same preset gives different answers depending on
     what you had selected before it.

     Only the listed keys are touched. `Object.assign` with the whole stored
     object would let a preset carrying a stale field write it back onto the
     session — including `messages`, if one were ever saved with one.

     `profile` is the exception: an empty pool is not a valid request, so a
     preset that names none keeps the current one. */
  for(const key of this.keys()){
   if(key in found.params)CHAT_SESSION[key]=found.params[key];
   else if(key!=='profile')CHAT_SESSION[key]='';
  }
  if(found.params.profile)PROFILE_STORE.write(found.params.profile);
  if(found.params.system!==undefined)USER.setSystem(found.params.system);
  if(found.params.brief!==undefined)USER.setBrief(found.params.brief);
  /* Unconditional, and empty when the preset names none: switching away
     from Miku has to put the face back, and a preset that carries no mode
     is saying *the ordinary one* rather than *leave whatever was there*. */
  USER.setMode(found.params.mode||'');
  USER.setPreset(id);
  USER.saveParams();
  notify('Applied '+found.name);
  /* The voice is NERVIS's, so switching it is a write rather than an
     assignment. Quiet, because the notify above already said what happened —
     and awaited only to the extent that the re-render below picks it up. */
  if(found.params.voice_profile)
   VOICE.flag('selected_profile',found.params.voice_profile,true).then(render);
  render();
 },

 async save(){
  const name=fieldValue('cpPresetName');
  if(!name)return notify('Name it first');
  /* Same name replaces, rather than accumulating three "default"s that differ
     in ways nobody can see from the list. */
  const existing=this.items.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(existing)existing.params=this.capture();
  else this.items.push({id:'cp_'+Math.random().toString(36).slice(2,8),name,params:this.capture()});
  await USER.write('chat.presets',this.items);
  USER.setPreset((existing||this.items[this.items.length-1]).id);
  notify(existing?'Replaced '+name:'Saved '+name);
  render();
 },

 async remove(id){
  const gone=this.items.find(p=>p.id===id);
  if(!gone)return notify('Pick one to delete first');
  this.items=this.items.filter(p=>p.id!==id);
  await USER.write('chat.presets',this.items);
  /* The selection cannot survive the thing it names. Falls back to whatever is
     left rather than to nothing, so the picker never names a preset that is
     gone while the settings underneath still hold its values. */
  if(USER.preset===id)USER.setPreset(this.items.length?this.items[0].id:'');
  notify('Deleted '+gone.name);
  render();
 }
};

/* Whether this conversation is kept out of the pool Miku reads from.

   **Held locally until the conversation exists.** A conversation has no id
   until its first turn is stored, and the moment you most want to mark one
   private is *before* you have typed the thing you did not want remembered —
   so the intent is kept on the session and written the instant an id arrives.

   Reading falls back to the stored list, so reopening a barred conversation
   shows it barred rather than showing the default and quietly re-including it. */
/* Who is speaking, for the label above a reply.

   Stamped onto the message when it arrives rather than read at paint time, so a
   conversation held with her still says Miku when it is reopened in the
   ordinary mode. Messages from before this existed, and any restored from the
   browser's copy, fall back to whichever mode is on — which is the best that
   can be said about a reply nobody recorded a speaker for. */
function speakerName(){return inMikuMode()?'Miku':'NERVIS'}

/* When a turn happened, in the zone of whoever is reading it.

   Stored as an ISO instant and formatted at paint time rather than stored
   formatted: the same conversation opened on a machine in another zone should
   read in that zone, and a string frozen at 22:41 cannot do that.

   Missing on anything from before this existed, and on messages restored from
   the browser's copy — those render without one rather than with a guess, for
   the same reason a decision record carries no cost estimate. */
function stampOf(m){
 if(!m.at)return '';
 const when=new Date(m.at);
 if(isNaN(when))return '';
 /* 24-hour, and explicitly so rather than by locale: `hour12` follows the
    browser's locale otherwise, which would print the same conversation as
    23:35 on one machine and 11:35 PM on another. The zone still follows the
    reader, because that part genuinely is theirs. */
 const clock={hour:'2-digit',minute:'2-digit',hour12:false};
 return `<span class="mono dim stamp" title="${escapeHtml(when.toLocaleString([],{dateStyle:'medium',timeStyle:'medium',hour12:false}))}">${escapeHtml(when.toLocaleTimeString([],clock))}</span>`;
}

function conversationIsPrivate(){
 if(CHAT_SESSION.private!==null)return CHAT_SESSION.private;
 const id=CHAT_SESSION.remote_id;
 return Boolean(id&&USER.excluded.includes(id));
}

function togglePrivate(){
 CHAT_SESSION.private=!conversationIsPrivate();
 persistPrivate();
 render();
}

/* Writes the decision once there is something to key it on. Called again after
   the first reply, which is when an id first exists. */
function persistPrivate(){
 const id=CHAT_SESSION.remote_id;
 if(!id||CHAT_SESSION.private===null)return;
 const barred=new Set(USER.excluded);
 if(CHAT_SESSION.private)barred.add(id); else barred.delete(id);
 USER.setExcluded([...barred]);
}

/* The control, beside New chat, because that is where a conversation is decided
   about rather than three clicks into a settings drawer. */
function privateButton(){
 const off=conversationIsPrivate();
 return `<button class="btn" onclick="togglePrivate()"${off?' style="border-color:#ffb648;color:#ffb648"':''}
   title="${off?'Kept out of the pool Miku reads from — she will not go through this conversation later'
              :'This conversation can be recalled in later ones. Click to keep it out.'}">${off?'&#128274; Private':'Private'}</button>`;
}

/* The pool this browser last chose, across reloads.

   Its own key rather than a field on the conversation: the preference is about
   how *you* like to be answered, not about one conversation, and starting a new
   chat should not quietly send you back to `ravis/auto`. */
const PROFILE_STORE={
 KEY:'nervis.chat.profile',
 read(){
  try{return localStorage.getItem(this.KEY)||'ravis/chat'}
  catch(e){return 'ravis/chat'}
 },
 write(id){try{localStorage.setItem(this.KEY,id)}catch(e){}}
};

function rememberProfile(id){
 CHAT_SESSION.profile=id;
 PROFILE_STORE.write(id);
 notify('Routing on '+id);
}

const CHAT_SESSION={
 id:'cv_'+Math.random().toString(36).slice(2,6),
 created_at:new Date().toISOString(),
 title:'New conversation',
 messages:[],
 /* Whatever was chosen last, or the router's own default. Held across reloads
    because `ravis/auto` weighs §9.2's soft preferences — local, cheap, already
    loaded — and the model that wins on those is not always the one somebody
    wants to have a conversation with. Making that choice stick is the honest
    fix; teaching `auto` to prefer API models would change what every other
    client gets from the same pool, to settle a preference held by one screen. */
 profile:PROFILE_STORE.read(),
 /* Generation parameters, held for the tab like everything else here. Defaults
    are *unset* rather than guessed: an omitted `temperature` lets the model and
    the runtime apply their own, and sending 0.7 because it is a common default
    would override a deliberate choice somebody made elsewhere. Only what is
    filled in gets sent. */
 /* Which drawer pane is out, and it survives a re-render: `render()` runs after
    every message, and a panel that snapped shut each time you sent one would be
    unusable exactly when you are adjusting it. `null` is closed. */
 drawer:null,
 system:'',
 temperature:'',
 max_tokens:'',
 top_p:'',
 /* The sampling knobs LM Studio exposes, kept unset for the same reason as the
    three above: an omitted parameter lets the model and the runtime apply their
    own, and sending a common default would override a deliberate choice made
    elsewhere. Only what is filled in gets sent. */
 top_k:'',
 min_p:'',
 frequency_penalty:'',
 presence_penalty:'',
 repetition_penalty:'',
 seed:'',
 stop:'',
 /* Whether the advanced block is unfolded. Not a parameter — it changes what is
    visible and nothing about the request. */
 advanced:false,
 /* Whether NERVIS has already opened this conversation. Not a parameter — it
    changes what has happened, not what is sent. Reset by "New chat", because a
    new conversation is a new opening. */
 greeted:false,
 /* Whether this conversation is kept out of the pool Miku reads from. `null`
    is *undecided* — distinct from false, which is somebody having looked at the
    button and left it off. Not `undefined`: that is the literal the template
    check bans, because a rendered one is how a missing field announces itself. */
 private:null,
 busy:false};

/* What NERVIS itself is holding, as opposed to what this browser remembers. */
const HELD={count:0,ids:[],titles:{}};

async function readHeld(){
 try{
  const r=await fetch(BASE.nervis+'/api/v1/chat/conversations',
    {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!r.ok)return;
  const items=(await r.json()).items||[];
  HELD.count=items.length;
  HELD.ids=items.map(c=>c.conversation_id);
  /* **The titles were in this response all along and were being thrown away.**
     The browser stored its own row when the conversation was saved — at which
     point the title is "New conversation", because NERVIS generates one *after*
     the first exchange as a background call. So the drawer listed a dozen
     conversations all called the same thing while NERVIS knew every name.
     §7.2 makes NERVIS the store of record; the browser's copy is a cache, and a
     cache that ignores the source is just a stale list. */
  HELD.titles=Object.fromEntries(items.map(c=>[c.conversation_id,c.title||'']));
 }catch(e){}
}

/* What a conversation is called, preferring NERVIS's answer over the browser's.

   Falls back to the local title, then to the id — a row with no name at all is
   still a row somebody can open, and "New conversation" is at least honest
   about a conversation NERVIS has not titled yet. */
function conversationTitle(row){
 const held=HELD.titles[row.remote_id||row.conversation_id];
 return held||row.title||row.conversation_id;
}

/* Everything NERVIS holds, gone. Deliberately separate from the per-row
   Delete: this is the one that clears what the browser never knew about. */
async function forgetEverythingHeld(){
 if(!armed('held:all',`This deletes all ${HELD.count} conversations from NERVIS itself`))return;
 for(const id of [...HELD.ids])await forgetOnNervis(id);
 await readHeld();
 notify(`NERVIS now holds ${HELD.count}`);
 render();
}

/* Remove one conversation from NERVIS's own store. True when it is gone.
   A 404 counts as gone: something else already deleted it, and reporting a
   failure for a conversation that no longer exists would leave a row nobody
   can clear. */
async function forgetOnNervis(id){
 try{
  const r=await fetch(BASE.nervis+'/api/v1/chat/conversations/'+encodeURIComponent(id),
    {method:'DELETE'});
  return r.ok||r.status===404;
 }catch(e){return false}
}

/* Drop a conversation's attachments. Best effort on purpose: a workspace that
   is switched off has none to drop, and failing a delete over that would leave
   a row on screen the person cannot clear. */
async function forgetAttachments(id){
 try{
  await fetch(BASE.nervis+'/api/v1/workspace/files?conversation_id='+encodeURIComponent(id),
    {method:'DELETE'});
 }catch(e){/* said louder elsewhere */}
}

const CHAT_SESSIONS={
 start(){
  /* The current conversation is saved before it is replaced. A "New chat"
     button that discarded what was on screen would be a data-loss control
     wearing a friendly label. */
  CHAT_STORE.save(CHAT_SESSION);
  Object.assign(CHAT_SESSION,{
   /* A new id is a new attachment directory, which is the whole of what
      "attachments do not persist between sessions" means here. */
   id:'cv_'+Math.random().toString(36).slice(2,6),
   created_at:new Date().toISOString(),
   title:'New conversation',
   greeted:false,
   private:null,
   system:USER.system,
   profile:PROFILE_STORE.read(),
   messages:[]});
  render();
  notify('New conversation');
 },
 open(id){
  const found=CHAT_STORE.read().find(c=>c.conversation_id===id);
  if(!found)return notify('That conversation is no longer stored');
  CHAT_STORE.save(CHAT_SESSION);
  const p=found.params||{};
  Object.assign(CHAT_SESSION,{
   id:found.conversation_id,
   /* **The server's id travels with it, and it did not.** Reopening restored
      the browser's copy of the messages and nothing else, so the next turn
      carried no `conversation_id` — NERVIS started a *fresh* conversation and
      appended to that. Everything said before the reopen stayed in the old one,
      which is why exporting a reopened conversation produced only the turns
      added since: the store was asked for a conversation that was minutes old.

      The browser copy is what is drawn; the server copy is what is exported,
      recalled and titled. Restoring one without the other silently forked the
      two apart. */
   remote_id:found.remote_id||'',
   created_at:found.created_at,
   title:found.title,
   messages:(found.messages||[]).map(m=>({...m})),
   /* Parameters travel with the conversation. Reopening a chat that used a
      system prompt and finding it silently gone would make the next reply
      inexplicable. */
   system:p.system||'',temperature:p.temperature||'',
   max_tokens:p.max_tokens||'',top_p:p.top_p||'',
   profile:p.profile||'ravis/auto'});
  render();
 },
 async remove(id){
  if(!armed('conversation:'+id,'This deletes it from NERVIS as well as from this browser'))return;
  /* NERVIS first, because it is the copy that outlives the browser and the one
     cross-session memory reads. If it fails the local entry stays too, so the
     row remains on screen to try again rather than vanishing while the real
     copy survives. */
  const held=(CHAT_STORE.read().find(c=>c.conversation_id===id)||{}).remote_id;
  if(held&&!await forgetOnNervis(held))return notify('NERVIS would not delete it — the browser copy is kept');
  /* And the files attached to it, keyed on the browser's id rather than the
     server's — attachments expire on their own after a fortnight, but delete
     should mean delete now. */
  await forgetAttachments(id);
  CHAT_STORE.remove(id);
  if(CHAT_SESSION.id===id)Object.assign(CHAT_SESSION,{
    id:'cv_'+Math.random().toString(36).slice(2,6),
    created_at:new Date().toISOString(),title:'New conversation',messages:[]});
  render();
 }};

/* Health and capabilities, read from whichever services answer.

   Every service publishes `/ecosystem/health` (§1) and `/ecosystem/capabilities`,
   so a diagnostics screen has real material without any diagnostics endpoint —
   which is fortunate, because there is not one: `/api/v1/diagnostics` is a 404
   on RAVIS and SIRVIS alike, and the Clarvis conformance suite is a CLI command
   with no HTTP surface at all. NERVIS's own reads are included since M0 — it
   publishes the same three surfaces its peers do. */
/* The Test button, which used to raise a toast describing a test it did not
   run. §14's health test is exactly the three metadata reads this already does,
   so the control now performs them and reports what came back — including
   "nothing", which is the answer it exists to surface. */
async function healthTest(key){
 if(!BASE[key]&&key!=='nervis')return notify(`${key}: no address configured`);
 /* NERVIS was refused here on the grounds that M0 was unbuilt. It shipped:
    NERVIS serves this page and publishes all three `/ecosystem/*` reads, which
    are exactly what this control performs. The button did nothing for the one
    service that is certainly running. */
 notify(`${key.toUpperCase()}: testing…`);
 const d=await serviceDiagnostics(key);
 if(!d||!d.health)return notify(`${key.toUpperCase()}: not answering`);
 const checks=(d.health.checks||[]).map(c=>`${c.name} ${c.status}`).join(', ')||'no checks';
 notify(`${key.toUpperCase()}: ${d.health.status} · ${checks} · `
   +`${d.available.length}/${d.capabilities.length} capabilities`);
}

/* What to say about one peer, when the direct probe and the registry can
   disagree and only one of them is telling the truth.

   Four cases, and only one of them is really "not answering": the registry
   is the server-to-server read CORS cannot touch, so when it says a peer is
   up and the browser's own probe still failed, the honest sentence names the
   browser as the boundary rather than accusing the peer. */
function peerAnswerNote(direct,registry,key){
 if(direct)return 'answering';
 const row=(registry.items||[]).find(x=>x.key===key);
 const reachablePerRegistry=row&&['healthy','degraded'].includes(row.state);
 if(reachablePerRegistry){
  return registry.live
   ?'reachable — NERVIS\'s own registry has it healthy, but this browser could not '
    +'reach it directly (most likely a CORS boundary between two different origins)'
   :'reachable per its last known state, unconfirmed just now';
 }
 return 'not answering';
}

async function serviceDiagnostics(key){
 const get=async path=>{
  try{
   const r=await fetch(BASE[key]+path,{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
   return r.ok?await r.json():null;
  }catch(e){return null}
 };
 const [health,caps,id]=await Promise.all([
   get('/ecosystem/health'),get('/ecosystem/capabilities'),get('/ecosystem/identity')]);
 if(!health&&!caps&&!id)return null;
 const list=(caps&&caps.capabilities)||[];
 return{key,health,identity:id,
   capabilities:list,
   available:list.filter(c=>c.state==='available'),
   unavailable:list.filter(c=>c.state!=='available')};
}

function healthChip(d){
 if(!d||!d.health)return '<span class="chip warn">not answering</span>';
 const h=d.health;
 return `<span class="chip${warnUnless(h.status==='healthy')}">${escapeHtml(h.status||'unknown')}</span>`
   +` <span class="mono dim">live ${escapeHtml(h.live?'yes':'no')} · ready ${escapeHtml(h.ready?'yes':'no')}</span>`;
}

/* Which drawer pane is out, or null. One value rather than two open flags: the
   panel is one drawer showing one thing, and two booleans would allow a state
   the layout has no way to draw. */
/* Which model answers, and where the choice comes from.
 *
 * The chat screen offered RAVIS's routing profiles and nothing else, which is
 * the right default — choosing a model per request is what RAVIS is *for*, and
 * a pool stays correct as the catalogue changes. But with four providers
 * configured there was no way to say "this one, now", which is what somebody
 * comparing two models needs, and no way to see what was even available.
 *
 * A pinned model is addressed `ravis/<provider>/<model>`, which is RAVIS's own
 * direct-address form: it names the upstream outright and is the only way to
 * reach a model two providers both serve. Anthropic's models are on Anthropic
 * and on OpenRouter, and those are different routes with different prices.
 */
/* One provider's row in the picker. Split out of `MODELPICK.load`, which
   crossed the complexity ratchet the moment the hidden-model count added a
   third thing to say in its hint — the ratchet pointing at a loop that was
   also a formatter. */
function providerGroup(provider,found){
 const withheld=found.hidden
   ? ` · ${found.hidden} hidden, this provider answered 404 for them`:'';
 return {
  name:provider.label||provider.name,
  local:Boolean(provider.local),
  hint:provider.local
    ? `on this machine · ${found.ids.length} model(s) · nothing leaves the machine and nothing is billed${withheld}`
    : `pinned to this provider · ${found.ids.length} model(s) pass its filter${withheld}`,
  items:found.ids.map(id=>({id:`ravis/${provider.name}/${id}`,label:id,
    note:provider.local?'local':''})),
 };
}

const MODELPICK={
 /* Pools and per-provider models, once per open. Not cached across opens: a
    provider keyed or filtered in another tab should show up, and this list is
    four small reads against loopback. */
 state:null,

 async load(){
  const node=()=>document.getElementById('modelPickList');
  if(!node())return;
  const groups=[];
  let profiles={items:[]};
  try{profiles=await API.ravis.profiles()}catch(e){}
  if((profiles.items||[]).length){
   groups.push({name:'RAVIS pools',
     hint:'RAVIS picks the model per request, and keeps picking as the catalogue changes.',
     items:(profiles.items||[]).map(p=>({id:p.profile_id,label:p.profile_id,
       note:p.default?'default':''}))});
  }
  /* **Upstreams, not credentials.** This listed only providers with a stored
     key, so LM Studio and Ollama never appeared — a local runtime needs no
     credential, which meant the one place to pick a model offered every cloud
     model and none of the twenty on the machine. `/api/v1/providers` lists
     every declared upstream and says which are local. */
  let providers={items:[]};
  try{
   const r=await fetch(BASE.ravis+'/api/v1/providers',
     {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
   if(r.ok)providers=await r.json();
  }catch(e){}
  /* Enabled, and either local or holding a credential. A row for a provider
     that cannot answer is an invitation to pick a model and get a refusal. */
  const usable=(providers.items||[]).filter(
    c=>c.enabled!==false&&(c.local||c.credential_configured));
  for(const provider of usable){
   const found=await this.catalogue(provider.name);
   if(!found.ids.length)continue;
   groups.push(providerGroup(provider,found));
  }
  this.state={groups,q:''};
  this.render();
 },

 /* One provider's *selected* models — what its filter lets through, which is
    what the operator chose to expose. Paged to exhaustion for the same reason
    the Providers picker is: a list that omits a model is one nobody can pick. */
 async catalogue(name){
  const ids=[];
  /* Models this provider lists and has then refused as non-existent. Counted
     rather than merely dropped: a picker that silently shows fewer models than
     the provider publishes is one nobody can debug, and "3 hidden" with the
     reason attached is the difference between a filter and a mystery. */
  let hidden=0;
  let offset=0;
  try{
   while(offset!==null){
    const r=await fetch(BASE.ravis+'/api/v1/providers/'+encodeURIComponent(name)
      +'/catalogue?offset='+offset+'&limit=500',{signal:AbortSignal.timeout(8000)});
    if(!r.ok)return {ids,hidden};
    const page=await r.json();
    for(const item of page.items||[]){
     if(!item.selected)continue;
     /* `=== true` and not truthiness: the field is tri-state, and `null` means
        RAVIS has never called this model — which is not a claim that it works,
        and equally not grounds for hiding it. */
     if(item.unavailable===true){hidden++;continue}
     ids.push(item.id);
    }
    offset=page.next_offset;
   }
  }catch(e){}
  return {ids,hidden};
 },

 render(){
  const list=document.getElementById('modelPickList');
  if(!list||!this.state)return;
  const q=this.state.q;
  const current=CHAT_SESSION.profile;
  /* Matches the model, the group it is in, and where it runs — so `local`
     finds the on-machine models and `openai` finds that provider's, neither of
     which every id spells out. */
  const hit=(g,i)=>!q || i.label.toLowerCase().includes(q)
    || g.name.toLowerCase().includes(q)
    || (g.name==='RAVIS pools'?'pool':'remote cloud api').includes(q)
    || (g.local?'local on-machine':'').includes(q);
  const shown=this.state.groups
    .map(g=>({...g,items:g.items.filter(i=>hit(g,i))}))
    .filter(g=>g.items.length);
  if(!shown.length){list.innerHTML='<div class="picker-empty">nothing matches that.</div>';return}
  list.innerHTML=shown.map(g=>`<div class="pick-group"><b>${escapeHtml(g.name)}</b>
    <small class="mono dim">${escapeHtml(g.hint)}</small></div>
   ${g.items.map(i=>`<button class="pick-row${i.id===current?' on':''}"
     onclick="MODELPICK.pick('${jsAttr(i.id)}')">
     <span>${escapeHtml(i.label)}</span>
     ${i.note?`<em>${escapeHtml(i.note)}</em>`:''}
     ${i.id===current?'<em>in use</em>':''}</button>`).join('')}`).join('');
 },

 search(q){
  if(!this.state)return;
  this.state.q=(q||'').trim().toLowerCase();
  this.render();
 },

 pick(id){
  rememberProfile(id);
  CHAT_SESSION.drawer=null;
  /* Not saved to the stored conversation. The profile travels with each request
     and NERVIS records it per turn, so a conversation that switched models
     halfway keeps both facts rather than being retconned to the latest one. */
  render();
 },
};

/* Rendered synchronously and filled in after, because the drawer opens on a
   render pass and the catalogue is four network reads away. */
function modelPane(){
 queueMicrotask(()=>MODELPICK.load());
 const pinned=String(CHAT_SESSION.profile||'').startsWith('ravis/')
   && String(CHAT_SESSION.profile||'').split('/').length>2;
 return `<div class="picker-head" style="margin:0 0 8px">
   <input class="picker-search mono" placeholder="filter models…"
     oninput="MODELPICK.search(this.value)">
  </div>
  <div id="modelPickList" class="picker-list" style="max-height:none;grid-template-columns:1fr;border-top:0;padding-top:0">
   <div class="picker-empty">reading catalogues…</div>
  </div>
  <small class="mono dim">a <b>pool</b> lets RAVIS choose per request and keeps working as models come and go. Pinning names one upstream outright — the only way to reach a model two providers both serve, and Anthropic's models are on Anthropic <i>and</i> on OpenRouter at different prices. ${pinned?'<b>Pinned right now</b>, so RAVIS is not choosing and a model that stops being offered becomes a refusal rather than a fallback.':''} Only providers that are keyed <i>and</i> reachable are listed, and only the models their filter lets through.</small>`;
}

/* The fold-out panel: model, parameters, history.
   Extracted because `chatView` hit the complexity gate the moment a third pane
   was added — which is the gate doing its job, since a screen function that
   also renders three alternative panels is two jobs. */
/* One pane per drawer tab. Extracted because `chatDrawerMarkup` was a template
   holding three alternative panels behind two nested ternaries, and it crossed
   the complexity ratchet the moment the parameters pane grew a third control —
   the ratchet pointing at a function doing three jobs in one string. */
function chatDrawerMarkup(){
 const pane={model:modelPane,history:historyPane}[CHAT_SESSION.drawer]||paramsPane;
 return `<aside class="chat-drawer"${CHAT_SESSION.drawer?' data-open':''} aria-hidden="${escapeHtml(CHAT_SESSION.drawer?'false':'true')}">
   <header>${escapeHtml({model:'Model',history:'History'}[CHAT_SESSION.drawer]||'Parameters')}
    <span class="mono dim" style="margin-left:auto;text-transform:none;letter-spacing:0">esc to close</span></header>
   <div class="drawer-body">
   ${pane()}
   </div></aside>`;
}
/* Conversations kept in this browser, and the way back into one. */
function historyPane(){
 const saved=CHAT_STORE.read().filter(c=>c.conversation_id!==CHAT_SESSION.id);
 return heldRow()+(saved.length?`${saved.map(historyRow).join('')}
   <small class="mono dim">this list is what <b>this browser</b> remembers. The conversations themselves are stored by <b>NERVIS</b>, on this machine — §7.2 keeps them local to the machine, which is not the same as local to the tab, and another browser keeps a different list of the same conversations. <b>Delete removes both copies.</b></small>`
  :`<small class="mono dim">this browser lists no other conversation. That is not the same as none existing: the conversations are stored by <b>NERVIS</b>, and a different browser keeps a different list of them.</small>`);
}

function historyRow(c){
 const armedHere=ARMED_ACTION==='conversation:'+c.conversation_id;
 const renaming=RENAMING===c.conversation_id;
 return `<div class="trace-step" style="align-items:flex-start">
   <b style="min-width:0">${renaming
     ?`<input id="rename-${jsAttr(c.conversation_id)}" class="mono" value="${escapeHtml(conversationTitle(c))}"
         style="width:100%;background:#0b1118;border:1px solid #2a3541;color:#cfe;border-radius:5px;padding:4px 6px"
         onkeydown="if(event.key==='Enter')renameConversation('${jsAttr(c.conversation_id)}');if(event.key==='Escape'){RENAMING='';render()}">`
     :`<a href="#" onclick="CHAT_SESSIONS.open('${jsAttr(c.conversation_id)}');return false" style="color:inherit">${escapeHtml(conversationTitle(c))}</a>`}</b>
   <span class="mono dim">${escapeHtml(String(c.updated_at||'').slice(0,16).replace('T',' '))} · ${escapeHtml((c.messages||[]).length)} msg
   <button class="btn" style="margin-left:6px" onclick="${renaming
     ?`renameConversation('${jsAttr(c.conversation_id)}')`
     :`RENAMING='${jsAttr(c.conversation_id)}';render()`}">${renaming?'Save':'Rename'}</button>
   <button class="btn"${armedHere?' style="margin-left:6px;border-color:#ffb648;color:#ffb648"':' style="margin-left:6px"'} onclick="CHAT_SESSIONS.remove('${jsAttr(c.conversation_id)}')">${armedHere?'Confirm':'Delete'}</button></span></div>`;
}

/* Which conversation is being renamed, if any.

   **A title is generated and then owned.** NERVIS asks RAVIS for one as a
   background call (SS7, and RAVIS SS9.6.1's marker) — that is a stand-in, not a
   decision, and the person who had the conversation is the one who knows what it
   was about. `PUT /conversations/{id}/title` has existed since M4 with nothing
   on the screen to call it. */
let RENAMING='';

async function renameConversation(id){
 const box=document.getElementById('rename-'+id);
 const title=(box&&box.value||'').trim();
 RENAMING='';
 if(!title)return render();
 try{
  const r=await fetch(BASE.nervis+'/api/v1/chat/conversations/'+encodeURIComponent(id)+'/title',
    {method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({title})});
  if(!r.ok){notify('NERVIS refused the rename');return render()}
  /* Both copies, because the browser keeps its own list: NERVIS stores the
     conversation and this tab stores the row it draws from. Updating one leaves
     the drawer showing the old name until something else reloads it. */
  /* `write` takes the whole list — handing it one row emptied the drawer on the
     first rename, which is the kind of mistake a typed store would have caught
     and a JSON blob cannot. */
  const list=CHAT_STORE.read();
  const kept=list.find(c=>c.conversation_id===id);
  if(kept){kept.title=title;CHAT_STORE.write(list)}
  if(CHAT_SESSION.id===id)CHAT_SESSION.title=title;
 }catch(failure){notify('NERVIS did not answer: '+failure.message)}
 render();
}

/* What NERVIS holds beyond what this browser can name.

   The two drifted for as long as Delete removed only the local copy, and the
   gap was invisible: this list is built from `localStorage`, so a conversation
   NERVIS still held appeared nowhere at all. Shown only when the numbers
   disagree, because a store nobody can see is a store nobody can empty — and
   with cross-session memory on, those are conversations still readable by the
   next one. */
function heldRow(){
 const listed=CHAT_STORE.read().length;
 if(HELD.count<=listed)return '';
 const armedHere=ARMED_ACTION==='held:all';
 return `<div class="trace-step" style="align-items:flex-start">
   <b style="min-width:0">NERVIS holds ${escapeHtml(HELD.count)}</b>
   <span class="mono dim">more than this browser lists — from another browser, or deleted here while Delete still left NERVIS's copy behind
   <button class="btn"${armedHere?' style="margin-left:6px;border-color:#ffb648;color:#ffb648"':' style="margin-left:6px"'} onclick="forgetEverythingHeld()">${armedHere?`Confirm — delete all ${escapeHtml(HELD.count)}`:`Forget all ${escapeHtml(HELD.count)}`}</button></span></div>`;
}

/* Which voice reads the replies, on the panel where the rest of a mode lives.

   The same setting the Voice screen writes — there is one selected voice, not a
   per-screen one — and it is here because it is half of what a preset restores.
   Choosing a mode and then having to leave the conversation to change what it
   sounds like is the seam a preset exists to close.

   Absent entirely when no key is configured: a picker over an empty list is a
   control that cannot do anything, and the Voice screen is where a key gets
   entered. */
function voicePickerRow(){
 const set=SPEECH.settings;
 if(!set||!set.credential||!set.credential.configured)return '';
 const saved=set.profiles||[];
 if(!saved.length)return `<small class="mono dim" style="grid-column:1/-1">a key is configured but no voice is named yet — add one on <a href="#" onclick="go(state.app,'Settings');return false" style="color:inherit"><b>Settings</b></a>.</small>`;
 return `<label style="grid-column:1/-1">Voice
   <select style="width:100%;background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:6px;font-family:inherit"
     onchange="VOICE.flag('selected_profile',this.value)">
    <option value=""${set.selected_profile?'':' selected'}>— the browser's own voice —</option>
    ${saved.map(v=>`<option value="${escapeHtml(v.profile_id)}"${v.profile_id===set.selected_profile?' selected':''}>${escapeHtml(v.name)} · ${escapeHtml(v.engine)}</option>`).join('')}
   </select>
   <small class="mono dim" style="display:block;margin-top:4px;text-transform:none;letter-spacing:0">travels in a preset, so a mode carries what it sounds like. A local model's reply is read by the browser whichever voice is chosen here — that is §18.2 and not a setting.</small></label>`;
}

/* Everything that shapes a reply: the preset, who you are, how long it should
   be, how far back it may remember, and the sampling underneath. */
function paramsPane(){
 return `
   <div class="param-grid">
    <label style="grid-column:1/-1">Preset
     <select id="cpPreset" style="width:100%;background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:6px;font-family:inherit"
       onchange="PRESETS.apply(this.value)">
      <option value=""${USER.preset?'':' selected'}>— everything below, unsaved —</option>
      ${PRESETS.items.map(p=>`<option value="${escapeHtml(p.id)}"${p.id===USER.preset?' selected':''}>${escapeHtml(p.name)}</option>`).join('')}
     </select>
     <!-- On its own row. The drawer is about 230px wide, and a select, a text
          field and a button abreast in that space pushed the button off the
          edge — a control you cannot reach is worse than one that wraps. -->
     <span style="display:flex;gap:6px;align-items:center;margin-top:6px">
      <input id="cpPresetName" placeholder="name it" style="flex:1;min-width:0">
      <button class="btn primary" onclick="PRESETS.save()">Save</button>

     </span>

    ${voicePickerRow()}
    <label style="grid-column:1/-1">Your name

    <label style="grid-column:1/-1">Memory
     <select style="width:100%;background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:6px;font-family:inherit"
       onchange="USER.setMemory(this.value)">
      <option value="session"${USER.memory==='session'?' selected':''}>This conversation only</option>
      <option value="all"${USER.memory==='all'?' selected':''}>All conversations on this machine</option>
     </select></label>

    <label class="adv-toggle" style="grid-column:1/-1"><input type="checkbox"${USER.brief?' checked':''}
      onchange="USER.setBrief(this.checked)"> Keep replies short — about two or three sentences
      <small class="mono dim" style="display:block;margin-top:3px;text-transform:none;letter-spacing:0">a switch rather than a silent rule: a question that needs a list, a walkthrough or code still gets one.</small></label>
    <label class="adv-toggle" style="grid-column:1/-1"><input type="checkbox"${USER.pages?' checked':''}
      onchange="USER.setPages(this.checked)"> Show the model a PDF's pages, not only its text
      <small class="mono dim" style="display:block;margin-top:3px;text-transform:none;letter-spacing:0">extraction returns prose intact and destroys the rest — a table arrives as loose runs of numbers, a diagram as nothing — so up to six pages carrying a table or a figure travel as pictures beside the full text, densest first, and the reading names which ones. <b>The pictures ride on your question</b>, so whatever answers it has to be able to see: on this machine that usually means a hosted model, which is a cost and an egress decision rather than a detail. Turn it off and a PDF is read exactly as it was before — all of the text, none of the pictures, routing untouched. To keep it local instead, pin a local vision model under <b>Model</b>; the layout glance on a saved PDF is already local and is not affected by this switch.</small></label>

    <label>Temperature
     <input id="cpTemp" class="mono" inputmode="decimal" placeholder="model default"

     <input id="cpMax" class="mono" inputmode="numeric" placeholder="model default"

    <label>Top&nbsp;p
     <input id="cpTopP" class="mono" inputmode="decimal" placeholder="model default"
       value="${escapeHtml(String(CHAT_SESSION.top_p))}"
       oninput="CHAT_SESSION.top_p=this.value" onchange="USER.saveParams()"></label>
   </div>
   <label class="adv-toggle"><input type="checkbox"${CHAT_SESSION.advanced?' checked':''}
     onchange="CHAT_SESSION.advanced=this.checked;render()"> Advanced sampling</label>
   ${CHAT_SESSION.advanced?`<div class="param-grid adv">
    ${ADVANCED_PARAMS.map(p=>`<label>${p.label}
     <input class="mono" inputmode="${escapeHtml(p.mode||'decimal')}" placeholder="${escapeHtml(p.hint)}"
       value="${escapeHtml(String(CHAT_SESSION[p.key]))}"
       oninput="CHAT_SESSION['${jsAttr(p.key)}']=this.value" onchange="USER.saveParams()" title="${escapeHtml(p.help)}"></label>`).join('')}

     <input class="mono" placeholder="comma separated — empty sends none"
       value="${escapeHtml(String(CHAT_SESSION.stop))}"
       oninput="CHAT_SESSION.stop=this.value" onchange="USER.saveParams()"></label>
   </div>
   <small class="mono dim">these are the knobs <b>LM Studio</b> exposes, and they travel to any provider RAVIS reaches <b>transparently</b> — every local runtime, OpenAI, Google and OpenRouter — where the upstream itself decides whether it understands each one. <b>Anthropic is the exception</b>: it is reached through a translating adapter that normalises a request to a fixed shape, so the sampling knobs are dropped there rather than refused. A parameter that works on one provider and quietly does nothing on another is worth knowing about before you spend an afternoon on it.</small>`:''}
   <small class="mono dim">an empty field is <b>not sent at all</b>, so the model and runtime apply their own defaults — filling one in with a common value like 0.7 would be this page inventing a choice nobody made.</small>`;
}


/* The sampling parameters behind the Advanced toggle, modelled on LM Studio's
   own set. Data rather than markup so the form, the session and the request
   body stay one list — adding a knob used to be three edits, and the one that
   got forgotten produced a control that visibly did nothing. */
const ADVANCED_PARAMS=[
 {key:'top_k',label:'Top&nbsp;k',mode:'numeric',hint:'model default',
  help:'Sample only from the k most likely tokens. Lower is more focused.'},
 {key:'min_p',label:'Min&nbsp;p',hint:'model default',
  help:'Drop tokens below this fraction of the most likely one. An alternative to top-p.'},
 {key:'frequency_penalty',label:'Frequency penalty',hint:'model default',
  help:'Discourage repeating a token in proportion to how often it has appeared.'},
 {key:'presence_penalty',label:'Presence penalty',hint:'model default',
  help:'Discourage repeating any token that has appeared at all.'},
 {key:'repetition_penalty',label:'Repetition penalty',hint:'model default',
  help:'The local-runtime spelling of the same idea. Not an OpenAI parameter.'},
 {key:'seed',label:'Seed',mode:'numeric',hint:'random each time',
  help:'Ask for a reproducible sample. Honoured by some providers and ignored by others.'},
];

function chatDrawer(pane){
 CHAT_SESSION.drawer = CHAT_SESSION.drawer===pane ? null : pane;
 render();
}

/* Silence, without leaving the conversation to find it.

   The same switch as the one on the Voice screen, because mute is a NERVIS
   setting rather than a property of this tab — §18.2 requires it to persist,
   and a second tab that kept talking would not be a mute. Hidden entirely until
   a voice is configured: a control that does nothing is worse than no control,
   and this one would do nothing on most installations. */
function voiceToggleButton(){
 const set=SPEECH.settings;
 if(!set||!set.credential||!set.credential.configured)return '';
 const off=!set.enabled||set.muted;
 return `<button class="chat-tool" id="chatVoiceBtn"${off?'':' data-on'}
   title="${off?'Voice is off — replies are not read aloud':'Replies are read aloud. Click to mute'}"
   onclick="VOICE.quickMute(${off?'false':'true'})">${off?'&#128263; Muted':'&#128266; Voice'}</button>`;
}

function paramsAreSet(){
 /* Whether anything is in force. A parameters panel that folds away must not
    fold away the fact that a system prompt is set — the dot on the button is
    what keeps that visible with the drawer shut. */
 const c=CHAT_SESSION;
 return Boolean(String(c.system).trim() || String(c.temperature).trim()
   || String(c.max_tokens).trim() || String(c.top_p).trim());
}

function savedCount(){
 return CHAT_STORE.read().filter(c=>c.conversation_id!==CHAT_SESSION.id).length;
}


async function chatDecision(id){
 /* The chat screen's own lookup, deliberately not `API.ravis.routeDecision`.

    That one is a *mock* the RAVIS dashboard is written against — it expects
    `eligible`, `affinity`, `timings_ms` and a `requirements` object, none of
    which a real decision record carries. Repurposing it for live data broke
    that dashboard, which is the argument for a screen owning its own adapter
    rather than reaching into a shared one shaped for somebody else. */
 try{
  const r=await fetch(BASE.ravis+'/api/v1/route-decisions?limit=50',
    {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!r.ok)return null;
  return ((await r.json()).items||[]).find(x=>x.decision_id===id)||null;
 }catch(e){return null}
}

/* Every numeric generation parameter, in the order the drawer shows them.
   One list rather than a call per field: adding a knob was three edits — the
   session, the form and the body builder — and the third was the one that got
   forgotten, which produces a control that visibly does nothing. */
/* What a bubble shows while it is still waiting.
   Dots until the first token arrives, then the text with a caret after it —
   two different statements, and the caret alone made the first look like the
   second. */
function pendingTail(text){
 if(!CHAT_SESSION.busy)return '';
 return text ? '<span class="stream-caret">▌</span>'
   : '<span class="typing-dots" aria-label="waiting for a reply"><i></i><i></i><i></i></span>';
}

const CHAT_NUMERIC=['temperature','max_tokens','top_p','top_k','min_p',
  'frequency_penalty','presence_penalty','repetition_penalty','seed'];

function chatRequestBody(conversationId){
 /* Built from what is set, and nothing else. An empty box means the field is
    omitted from the request entirely rather than sent as null or as a default
    picked here — the model and the runtime own their own defaults, and §14's
    rule about never presenting a guess as a measurement has an equivalent here:
    do not present a guess as a choice.

    **NERVIS's shape since M4, not RAVIS's.** It used to assemble the whole
    `messages` array here, which meant the browser owned the conversation and
    NERVIS could not have stored it even if it wanted to. Now the last message
    goes up and NERVIS supplies the history it already holds — one copy, on the
    side that persists it. */
 const c=CHAT_SESSION;
 /* `kind` excluded: an attachment is recorded as the person's turn because
    they did it, but it carries no words. Without this the request body would
    send an empty `content` for every message sent after a file was attached. */
 const last=[...c.messages].reverse().find(m=>m.role==='user'&&!m.pending&&!m.kind);
 const system=String(c.system).trim();
 const body={content:last?last.text:'',profile:c.profile,brief:USER.brief,
   /* Whether a PDF's pages travel as pictures beside its text. Sent every
      turn rather than remembered server-side per conversation, for the same
      reason `brief` is: it is a preference about how to ask, and the person
      may change it between two questions about the same document. */
   page_images:USER.pages,
   /* **The browser's id, and it has to be on every chat request** — this is the
      one the attachments are filed under. NERVIS only mints a conversation id
      once a turn is stored, and clip-then-question is the ordinary order, so a
      file attached before the first message has nowhere else to go.

      It was briefly sent only on the unprompted-remark path, which is not the
      path a typed message takes: uploads landed correctly and every question
      about them was answered "nothing is attached". */
   attachment_id:c.id||''};
 if(conversationId)body.conversation_id=conversationId;
 if(system)body.system=system;
 const num=(v,key)=>{const t=String(v).trim();if(t==='')return;
   const n=Number(t);if(Number.isFinite(n))body[key]=n};
 for(const key of CHAT_NUMERIC)num(c[key],key);
 /* Stop sequences are a list on the wire and a comma-separated line in the box,
    because typing JSON into a settings field is not a settings field. Empty
    entries are dropped rather than sent as `""`, which every provider treats as
    "stop immediately". */
 const stops=String(c.stop||'').split(',').map(t=>t.trim()).filter(Boolean);
 if(stops.length)body.stop=stops;
 return body;
}

/* One SSE body as a stream of parsed frames.
 *
 * Read by hand rather than with `EventSource`: that one cannot POST, cannot
 * send a body and cannot be aborted, which rules out all three things a chat
 * turn needs.
 *
 * Extracted from `sendChat`, which measured **cyclomatic complexity 41** — the
 * worst function in this file by a wide margin — with the reader, the decoder,
 * the buffer, the frame splitting, the JSON parsing and the reply assembly all
 * in one scope. The parsing has nothing to do with the conversation; separating
 * them means the tangle is now two ordinary jobs.
 *
 * Yields `{frame}` for a data frame and `{error:true}` for the stream's own
 * error event. `[DONE]` and unparseable payloads are skipped here rather than at
 * the caller, because "what is a frame" is this function's question. */
async function* sseFrames(body){
 const reader=body.getReader(),decoder=new TextDecoder();
 let buffer='';
 for(;;){
  const {value,done}=await reader.read();
  if(done)return;
  buffer+=decoder.decode(value,{stream:true});
  const parts=buffer.split('\n\n');
  buffer=parts.pop();
  for(const part of parts){
   for(const line of part.split('\n')){
    if(line.startsWith('event: error')){yield{error:true};continue}
    if(!line.startsWith('data:'))continue;
    const payload=line.slice(5).trim();
    if(payload==='[DONE]')continue;
    let frame;
    try{frame=JSON.parse(payload)}catch(e){continue}
    yield{frame};
   }
  }
 }
}

/* What one finished turn became, as a message. Pure: no DOM, no session, no
   fetch — which is what makes the four outcomes readable side by side instead of
   spread down a ladder inside `sendChat`.

   The four are genuinely different and none of them may borrow another's
   explanation. That was a real defect: stopping a reasoning model before it
   produced text fell through to the budget-exhaustion branch and announced "the
   model spent its whole budget on reasoning", which is a confident diagnosis of
   something that did not happen. */
/* What NERVIS offered to do, if it offered anything.

   Parsed defensively: a header this page cannot read must leave the reply
   intact and simply carry no button, rather than throwing inside the stream
   handler and losing the answer along with the offer. */
function parseOffer(header){
 if(!header)return null;
 try{const offer=JSON.parse(header);return offer&&offer.operation?offer:null}
 catch(e){return null}
}

/* The plan, if what was asked for was a sequence (M24).

   Parsed as defensively as the single offer, and with one extra requirement: a
   plan with fewer than two steps is not a plan. Drawing one would put a "Run
   plan" button on a single operation, which is a second confirmation road to
   the same place — and two roads to one act is how the enumerated set stops
   being the only way in. */
function parsePlan(header){
 if(!header)return null;
 try{
  const plan=JSON.parse(header);
  if(!plan||!Array.isArray(plan.steps)||plan.steps.length<2)return null;
  return plan;
 }catch(e){return null}
}

/* The offer, drawn as a control the person presses.

   **The button is the confirmation, and there is no other path.** §12 gives
   NERVIS an enumerated set of operations and no free-form one; §11.5 says
   nothing a model returns may become an action. So what runs is what is written
   on this button, and it runs because somebody pressed it — not because a
   sentence was interpreted, and not because a reply said it would. */
function offerRow(offer,index){
 if(!offer)return '';
 if(offer.done)return `<div class="mono dim" style="margin-top:7px;font-size:11px">${escapeHtml(offer.done)}${downloadLink(offer.file)}</div>`;
 /* **Candidates are buttons, not a list to read** (M22). An offer NERVIS
    could not prepare — an ambiguous model name, most often — used to print the
    matches and stop there, leaving the person to retype one of them. Pressing
    one now says "this one, not the one you guessed", which is the *edited*
    outcome: the only one of the three that carries what they actually wanted
    rather than merely whether they wanted it. */
 const candidates=(offer.candidates||[]).length
   ?`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${(offer.candidates||[])
       .map(name=>`<button class="mode-chip" onclick="chooseCandidate(${index},'${jsAttr(name)}')">${escapeHtml(name)}</button>`)
       .join('')}</div>`:'';
 if(!offer.ready)
  return `<div style="margin-top:7px"><div class="mono dim" style="font-size:11px">${escapeHtml(offer.detail||'this cannot be prepared')}</div>${candidates}</div>`;
 /* No token gate on this button. It used to require one pasted into this tab
    and was reported as "forbidden, scope needed" — the API being exactly right
    and the product being wrong. NERVIS holds its own `benchmark`-scoped
    credential now, minted by the launcher, so the person presses Run. */

 /* **What happened the last times this exact offer was made** (M22), in a
    sentence NERVIS can be argued with about. It is drawn beside the button
    rather than applied behind it: nothing about the offer changes because of
    it, and a person who disagrees can clear the record in Settings and get the
    unlearned offer back exactly. */
 const past=offer.history&&offer.history.sentence
   ?`<span class="mono dim" style="font-size:11px;opacity:.75">· ${escapeHtml(offer.history.sentence)}</span>`:'';
 /* **Decline is a control because silence must not be one.** M22 refuses to
    infer an outcome from an unanswered offer — somebody who closed the tab did
    not decline — so the only way "no" becomes a fact is for there to be a
    button that says it. Without this, the record would only ever contain
    agreement, which is a preference NERVIS learned about itself. */
 /* **The other things this offer could be**, as chips beside the button.
    An annotated copy with no style named defaults to sticky notes, softly:
    the button is there, and the margin and inline copies are one press away.
    Drawn here rather than asked of the model, which was told twice — in two
    placements — to name them in its reply and did not either time. */
 const alternatives=(offer.alternatives||[]).length
   ?`<span class="mono dim" style="font-size:11px">or</span>${(offer.alternatives||[])
       .map(alt=>`<button class="mode-chip" onclick="switchOffer(${index},'${jsAttr(alt.operation)}','${jsAttr(alt.action)}')">${escapeHtml(alt.action)}</button>`)
       .join('')}`:'';
 return `<div style="margin-top:8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap">
   <button class="btn primary" onclick="runOffer(${index})">${escapeHtml(offer.action||'Run')}</button>
   ${alternatives}
   <button class="mode-chip" onclick="declineOffer(${index})">No thanks</button>
   <span class="mono dim" style="font-size:11px">not run yet · ${escapeHtml(offer.summary)}</span>
   ${past}
  </div>`;
}

/* One of the offer's alternatives, pressed: the same file, a different copy.
   Filed as `edited` the way a chosen candidate is — the person changed what
   the offer was before saying yes to it — then run under the operation they
   picked. */
function switchOffer(index,operation,action){
 const message=CHAT_SESSION.messages[index];
 const offer=message&&message.offer;
 if(!offer||offer.done)return;
 noteOutcome(offer,'edited',action);
 offer.operation=operation;
 offer.action=action;
 offer.alternatives=[];
 offer.proposal_id='';
 return runOffer(index);
}

/* A file NERVIS wrote, offered as a download.

   **`download` on the anchor as well as `Content-Disposition` on the response.**
   Either alone mostly works; together they also cover the case the person
   actually complains about, which is a PDF opening in a tab instead of landing
   in Downloads.

   The name is the only thing sent, and the endpoint resolves it inside the
   workspace before comparing — so what is linked here cannot name a file
   outside it however this markup is assembled. */
function downloadLink(file){
 if(!file||!file.name)return '';
 const href=`${BASE.nervis}/api/v1/documents/${encodeURIComponent(file.name)}`;
 return ` · <a href="${escapeHtml(href)}" download="${escapeHtml(file.name)}"
   style="color:var(--cyan)">download</a>`;
}

/* A plan, drawn whole before any of it runs (M24).

   **The whole sequence is on screen and the button confirms the order.** Not
   the authority: every step here is an offer `propose` would have made on its
   own, from a clause the person typed, so pressing this says *these, in this
   order* and cannot say more than that. There is no step in a plan that could
   not have been offered alone.

   Each step keeps its own state and its own outcome, because each remains
   individually bounded — a plan is a sequence of the same acts, not a bigger
   act made of them. */
function planRow(plan,index){
 if(!plan)return '';
 const state=n=>{
  const step=plan.steps[n];
  if(step.done)return `<span class="mono dim">${escapeHtml(step.done)}${downloadLink(step.file)}</span>`;
  if(plan.running===n)return '<span class="chip">running</span>';
