/* When NERVIS is allowed to talk at all. */
function voiceSpeaksCard(data){
 return `
  <div class="card wide live"><h3>When NERVIS speaks</h3>${cell(`
   <div class="trace-step"><b>spoken replies</b><span><label style="cursor:pointer"><input type="checkbox"${data.enabled?' checked':''} onchange="VOICE.flag('enabled',this.checked)"> read chat replies aloud</label></span></div>
   <div class="trace-step"><b>mute</b><span><label style="cursor:pointer"><input type="checkbox"${data.muted?' checked':''} onchange="VOICE.flag('muted',this.checked)"> silence everything now</label></span></div>
   <div class="trace-step"><b>status</b><span><label style="cursor:pointer"><input type="checkbox"${data.announce_status?' checked':''} onchange="VOICE.flag('announce_status',this.checked)"> say it aloud when a service changes state</label>
     <small class="mono dim">Off by default. Spoken on whatever screen is open, and on none — the registry is polled on a timer rather than by a view, so this reaches you in Traces or in another tab. Muting silences it with everything else.</small></span></div>
   <div class="trace-step"><b>when it cannot be used</b><span><select onchange="VOICE.flag('fallback',this.value)" style="background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:4px;font-family:inherit">
    <option value="browser"${data.fallback==='browser'?' selected':''}>let this browser read it</option>
    <option value="silence"${data.fallback==='silence'?' selected':''}>say nothing</option>
   </select></span></div>
   <div class="trace-step"><b>local replies</b><span>${data.fallback==='silence'?'not read aloud at all':'spoken by this browser, never by Fish Audio'}</span></div>
   <small class="mono dim"><b>When it cannot be used</b> is §18.2's own sentence, which offers both halves: <i>fall back to local system TTS, or stay silent and say so</i>. The browser's voice is free, offline and sends nothing, which is why it is the right refusal for a local model's reply — and it sounds nothing like the voice you chose, which is why the other half exists. The text is on screen either way. A silence caused by a <b>fault</b> rather than by this setting is still announced once, because that one is not a choice anybody made.<br><br>mute is kept by <b>NERVIS</b> rather than by this page, because §18.2 requires it to persist — a mute a second tab does not honour is not a mute. It also drops whatever was queued: a merely paused queue floods out on unmute and narrates replies from ten minutes ago.</small>
   ${explains('which voice speaks which reply, and what leaves this machine',`
    <div class="trace-step"><b>a cloud model answered</b><span>spoken by Fish Audio</span></div>
    <div class="trace-step"><b>a local model answered</b><span>spoken by this browser</span></div>
    <div class="trace-step"><b>NERVIS cannot tell</b><span>spoken by this browser</span></div>
    <div class="trace-step"><b>key written to</b><span class="mono">~/.config/nervis/voice-credential.json</span></div>
    <div class="trace-step"><b>read back by any endpoint</b><span>never</span></div>
    <small class="mono dim">a reply a privacy constraint kept on this machine must not then be read aloud by a third party — §18.2: <b>failing closed on the route and open on the voice is still a leak</b>. NERVIS asks RAVIS which models are reached over the network and speaks only what it can positively confirm already left; anything it cannot confirm is treated as local. The browser's own voice costs nothing and sends nothing, so the line is still heard either way.</small>`)}`,'nervis')}</div>`;
}


/* One form field's trimmed value, or empty. Written because reading four of
   them inline was `(document.getElementById(id)||{}).value||''` four times over
   — two branches each, and eight branches is most of a complexity budget spent
   on the possibility that an element this same function just rendered is
   missing. */
function fieldValue(id){
 const el=document.getElementById(id);
 return el?String(el.value||'').trim():'';
}

const VOICE={
 /* The user's own Fish voices, once Test has been pressed. `null` means never
    asked, which is a different row from "asked and there are none". */
 catalogue:null,
 /* The last thing the service said about a key, shown until it changes. */
 note:null,

 async saveKey(){
  const box=document.getElementById('voiceKey');
  const secret=(box&&box.value||'').trim();
  if(!secret)return notify('Paste a key first');
  const r=await fetch(BASE.nervis+'/api/v1/voice/credential',{method:'PUT',
    headers:{'content-type':'application/json'},body:JSON.stringify({secret})});
  this.note=r.ok?null:{head:'refused',body:await refusalMessage(r)};
  notify(r.ok?'Key stored':'Key not stored');
  render();
 },

 async forgetKey(){
  await fetch(BASE.nervis+'/api/v1/voice/credential',{method:'DELETE'});
  this.catalogue=null;this.note=null;
  notify('Key removed from NERVIS');
  render();
 },

 async test(){
  const r=await fetch(BASE.nervis+'/api/v1/voice/catalogue',readDeadline());
  if(!r.ok){
   this.catalogue=null;
   this.note={head:'key rejected',body:await refusalMessage(r)};
  }else{
   const body=await r.json();
   this.catalogue=body.items||[];
   this.note={head:'key accepted',body:`${this.catalogue.length} voice${this.catalogue.length===1?'':'s'} on this account`};
  }
  render();
 },

 /* Fill the add-a-voice form from one of the account's own voices. Faster and
    less error-prone than copying a thirty-two character id by hand. */
 fill(voiceId,title){
  const id=document.getElementById('vpId'),name=document.getElementById('vpName');
  if(id)id.value=voiceId;
  if(name&&!name.value.trim())name.value=title;
 },

 async add(){
  const name=fieldValue('vpName'),voiceId=fieldValue('vpId');
  if(!name||!voiceId)return notify('A voice needs a name and an id');
  const engine=fieldValue('vpEngine');
  const speed=Number(fieldValue('vpSpeed')||1);
  /* POST creates under an id NERVIS generates. This used to PUT to
     `/profiles/new`, and `new` is a perfectly good id — so every voice added
     was stored under it and replaced the one before. */
  const r=await fetch(BASE.nervis+'/api/v1/voice/profiles',{method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({name,voice_id:voiceId,engine,speed})});
  if(!r.ok)return notify('Not saved: '+await refusalMessage(r));
  const saved=await r.json();
  /* Selected on the way in when it is the only one. Someone who has entered a
     voice has expressed a preference, and making them then pick it out of a
     list of one is a step that exists only because a column is nullable. */
  if(!(SPEECH.settings&&SPEECH.settings.selected_profile))await this.select(saved.profile_id,true);
  notify('Voice saved');
  render();
 },

 async remove(id){
  await fetch(BASE.nervis+'/api/v1/voice/profiles/'+encodeURIComponent(id),{method:'DELETE'});
  render();
 },

 async select(id,quiet){
  await this.flag('selected_profile',id,true);
  if(!quiet)notify('Voice selected');
  if(!quiet)render();
 },

 async flag(key,value,quiet){
  const r=await fetch(BASE.nervis+'/api/v1/voice/settings',{method:'PUT',
    headers:{'content-type':'application/json'},body:JSON.stringify({[key]:value})});
  if(r.ok)SPEECH.settings=await r.json();
  /* Mute has to bite now, not at the end of whatever is playing — §18.2:
     "honoured immediately". */
  if(key==='muted'&&value)SPEECH.stop();
  if(!quiet)render();
 },

 /* The chat strip's switch. Unmuting also enables, because somebody clicking
    a speaker icon means "talk to me" rather than "clear one of the two flags
    that are stopping you". */
 async quickMute(on){
  await this.flag('muted',on,true);
  if(!on)await this.flag('enabled',true,true);
  if(on)SPEECH.stop();
  render();
 },

 /* Hear a voice before choosing it. NERVIS's own line, so the gate lets it
    through with no model attached — it was never anybody's private data. */
 async preview(id){
  const r=await fetch(BASE.nervis+'/api/v1/voice/speak',{method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({text:VOICE_PREVIEW,profile_id:id})});
  if(r.ok)return SPEECH._play(await r.blob());
  const body=await r.json().catch(()=>({}));
  notify(body.detail||'That voice did not answer');
 }
};

/* ── ECOSYSTEM MAP ─────────────────────────────────────────────────────────
   The registry, drawn instead of listed. Every node is one row of
   API.nervis.services(); every edge is a connection NERVIS itself holds. There
   is deliberately no RAVIS→SIRVIS edge here: NERVIS observes peers, it does not
   watch them talk to each other, and drawing a link it cannot measure would be
   the same class of lie as filling in a missing span. */
/* The ring of nodes this ecosystem draws, shared by the Overview card and the
   Ecosystem map tab.
   It was built here and hard-coded there: the Overview card was five fixed
   `<div class="node">` elements — RAVIS, SIRVIS, CLARVIS, LM Studio — drawn at
   fixed positions regardless of what the registry said, which is why that card
   carried a PROTOTYPE badge while the tab beside it was live. A diagram that
   ignores the registry is not a smaller version of one that reads it. */
/* How many peers are answering, out of how many were ever expected to.

   **An optional peer that has never answered is not counted against you.** The
   denominator used to be every registry entry, so a machine without Ollama and
   without a Bridge on the assumed port read `5 / 7` for ever — two of them
   absent by design rather than broken. That is the same distinction the map
   already draws with `awaiting_first_contact`, and the two disagreeing about the
   same registry was the confusing part: the diagram said all clear and the tile
   beside it said five out of seven.

   A peer that answered once and then stopped still counts. `awaiting_first_contact`
   is false the moment `last_seen` is set, so an outage is an outage. */
function reachability(svc){
 const expected=svc.items.filter(s=>!s.awaiting_first_contact);
 const live=expected.filter(s=>['healthy','degraded'].includes(s.state));
 const absent=svc.items.length-expected.length;
 return{live:live.length,expected:expected.length,absent,
   note:absent?`reachable · ${absent} optional peer(s) never configured`:'reachable · observer-side'};
}

function ecosystemNodes(svc,inst){
 /* Nodes sit on a circle so the count can change without a layout rewrite. The
    inline position beats the `.node:nth-of-type` rules a fixed map relies on. */
 /* A wider horizontal radius than vertical. A node's label is far wider than
    it is tall, so an even circle puts the left and right nodes into the hub
    while leaving space above and below unused. */
 const pos=(i,n)=>{const a=(-90+i*360/n)*Math.PI/180;return{x:50+Math.cos(a)*38,y:50+Math.sin(a)*32}};
 /* **LM Studio and Ollama are one node.** They are interchangeable local
    runtimes serving the same purpose, and this diagram answers "can NERVIS
    reach a local model", not "which of two ports is listening" — that question
    has a better home on the registry table, which still lists both separately.

    Green when **either** answers, because either is enough to serve one. The
    label says which, so a bundled node never hides that one of them is down. */
 const local=svc.items.filter(s=>s.key==='lmstudio'||s.key==='ollama');
 const up=local.filter(s=>['healthy','degraded'].includes(s.state));
 /* A runtime nobody configured and which has never answered is not counted as
    missing either — otherwise this node reads "LM Studio and Ollama
    unreachable" on a machine that only ever had one of them installed. */
 const missing=local.filter(s=>!up.includes(s)&&!s.awaiting_first_contact);
 const bundled=local.length?[{
   key:'local', label:'Local models',
   state:up.length?'healthy':'unreachable',
   detail:localDetail(up,missing),
   publishes_mep:false, capabilities:{}, age:0,
 }]:[];
 /* NERVIS is the hub, so it does not also get a spoke. §5.1 puts NERVIS in its
    own registry — a control plane that skipped its own entry would be the one
    row nobody could check — and drawing every entry put two boxes labelled
    NERVIS on the diagram, one at the centre and one on the ring. */
 /* **The Bridge's state comes from the registrations, never from its address.**
    The runbook's port table says the Bridge's port is "dynamic and discovered
    through registration, never assumed", and §6.6 has each editor window take an
    OS-assigned one — so NERVIS's configured `clarvis_base_url` is an address no
    Bridge ever binds, and this node was red on a machine with two live windows
    on it. The instance registry is where the answer actually is.

    Left in the ring rather than dropped: a diagram that answers "can NERVIS see
    an editor" needs the node whether or not one is open. */
 const ring=[...svc.items.filter(s=>!['nervis','lmstudio','ollama'].includes(s.key)), ...bundled]
   .map(s=>s.key==='clarvis'?bridgeNode(s,inst):s)
   /* **The map names the application; the registry names what was probed.**
      This diagram answers "which of the four apps can NERVIS see", and the
      fourth is Clarvis — code-server is the host it runs in, not one of the
      four. The registry table a screen away still says `code-server`, because
      that is literally what answered `/healthz`, and the two are not in
      conflict: one is the product, the other is the process.

      Renamed here rather than in the declaration for exactly that reason. A
      registry row labelled Clarvis would claim NERVIS had reached Clarvis when
      what it reached was an editor that may or may not have the extension
      installed — and whether it does is a different fact, from the
      registrations. */
   .map(s=>s.key==='codeserver'?{...s,label:'CLARVIS'}:s);
 return ring.map((s,i)=>({...s,...pos(i,ring.length),
   /* `awaiting_first_contact` is not a fault. NERVIS says it about an optional
      peer that has never answered, the registry table has always honoured it,
      and this map did not — so a Bridge nobody has started, on a machine that
      never had one, drew the same alarming red as a service that had crashed. */
   ok:['healthy','degraded'].includes(s.state)||s.awaiting_first_contact}));
}

/* What a node says under its name.

   `unreachable` is the right word for a service that should be answering and is
   not. It is the wrong word for an optional peer nobody has started — the
   registry table has said `not configured` for that case since M2, and the map
   went on printing the enum, so a Bridge with no editor open read as a fault on
   a machine where nothing was wrong. Each node carries its own phrasing where
   the generic one would mislead. */
function nodeState(n){
 if(!n.awaiting_first_contact)return n.state;
 return n.key==='clarvis'?'no editor window':'not configured';
}

/* One node for the Bridge, described by how many windows have registered.

   `inst` may be absent — `ecosystemNodes` is called from two screens and only
   one of them had a reason to read the instances before now — in which case
   this falls back to whatever the service probe said rather than inventing an
   answer it does not have. */
function bridgeNode(entry,inst){
 if(!inst)return entry;
 const windows=(inst.items||[]).filter(c=>c.live).length;
 if(!inst.live)return{...entry,state:'unknown',
   detail:'NERVIS is not answering, so whether a Bridge is running is unknown'};
 if(!windows)return{...entry,state:'unreachable',awaiting_first_contact:true,
   detail:'no editor window has registered; the Bridge is per extension host'};
 return{...entry,state:'healthy',awaiting_first_contact:false,
   detail:windows===1?'one editor window registered':`${windows} editor windows registered`};
}

function localDetail(up,missing){
 if(up.length)return `${up.map(s=>s.label).join(' and ')} answering`;
 if(missing.length)return missing.map(s=>s.label).join(' and ')+' unreachable';
 return 'no local runtime is configured or answering';
}

/* The topology itself, at whatever height the card it sits in can spare. */
function topologyMap(pts,height,compact){
 return `<div class="map${compact?' compact':''}" style="height:${height}px">
    <svg>${pts.map(n=>`<line x1="50%" y1="50%" x2="${escapeHtml(n.x)}%" y2="${escapeHtml(n.y)}%"${n.ok?'':' style="stroke:#ff5c6a;stroke-opacity:.3;animation:none"'}/>`).join('')}</svg>
    <div class="hub">NERVIS</div>
    ${pts.map(n=>`<div class="node" style="left:${escapeHtml(n.x)}%;top:${escapeHtml(n.y)}%;right:auto;bottom:auto;transform:translate(-50%,-50%);text-align:center;white-space:nowrap${n.ok?'':';border-color:#5a2530;opacity:.7'}"><b>${escapeHtml(n.label)}</b></div>`).join('')}
   </div>`;
}

 heading('Ecosystem map','Every node is a registry entry. Every edge is a connection NERVIS itself holds.');

 const reach=reachability(svc);
 const pts=ecosystemNodes(svc,inst);
 $('#content').innerHTML=kpis([
   /* Stated rather than derived from `SOURCE`, which is a global the next

   ['Registered',String(svc.items.length),'one row per identity','nervis',svc.live],

    <div class="hub">NERVIS</div>
    ${pts.map(n=>`<div class="node" style="left:${escapeHtml(n.x)}%;top:${escapeHtml(n.y)}%;right:auto;bottom:auto;transform:translate(-50%,-50%);text-align:center;white-space:nowrap${n.ok?'':';border-color:#5a2530;opacity:.7'}"><b>${escapeHtml(n.label)}</b><br><small style="opacity:.6">${escapeHtml(nodeState(n))}</small></div>`).join('')}
   </div>
   <small class="mono dim"><b>LM Studio and Ollama draw as one node.</b> They are interchangeable local runtimes serving the same purpose, and this diagram answers <i>can NERVIS reach a local model</i> rather than <i>which of two ports is listening</i> — it is green when <b>either</b> answers, and the label says which. Both are still listed separately on the registry table, which is where the narrower question belongs; that is also why <b>Registered</b> counts six and this draws four. The hub is the only vantage point NERVIS has. An edge here means "NERVIS holds this connection and negotiated this capability" — nothing more. Peer-to-peer traffic, such as RAVIS reading SIRVIS evidence, is visible only where a trace correlates it, which is the Traces screen and not this one.</small></div>
  <div class="card wide${escapeHtml(liveClass(svc.live))}"><h3>Capability negotiation</h3>
   <div class="table-row head five caps"><span>Service</span><span>Build</span><span title="The Minimal Ecosystem Protocol major version this peer publishes — the wire-format contract NERVIS negotiates before anything else. A number outside NERVIS's supported range would mark the whole peer incompatible, separately from any one capability being unavailable. Shown as '—' for a peer with no protocol surface, like a local runtime or code-server.">Protocol</span><span>Negotiated capability</span><span>State</span></div>
   ${svc.items.map(s=>`<div class="table-row five caps"><span>${escapeHtml(s.label)}</span><span class="mono">${escapeHtml(s.build_version)}</span><span class="mono">${escapeHtml(s.protocol_version?'proto '+s.protocol_version:'—')}</span><span class="mono" style="opacity:.7">${escapeHtml(s.capability)}${s.capability_source==='adapted'?' <i style="font-style:normal;opacity:.6">· adapted</i>':''}</span><span class="chip${['healthy','degraded'].includes(s.state)?'':(s.awaiting_first_contact?' dim':' warn')}">${s.awaiting_first_contact?'not configured':escapeHtml(s.state)}</span></div>`).join('')}
   <small class="mono dim">an unknown capability is unavailable, not disabled-and-hopeful. An unsupported required major marks that one <b>feature</b> incompatible — never the whole dashboard, while other surfaces still negotiate.</small></div>
  <div class="card narrow${escapeHtml(liveClass(svc.live))}"><h3>Observer-side state</h3>
   ${svc.items.map(s=>`<div class="trace-step"><b>${escapeHtml(s.label)}</b><span>${escapeHtml(s.state)}${REASON[s.state]?' · '+REASON[s.state]:''} ${stamp(s.age ?? 0)}</span></div>`).join('')}
   <small class="mono dim">these are NERVIS's own states, not the <b>healthy | degraded | unhealthy</b> a peer reports about itself. Healthy means a truthful response <i>plus</i> reachability: a successful TCP connect is not readiness.</small></div>`}

/* ── TRACES ────────────────────────────────────────────────────────────────
   Correlation only. NERVIS joins spans by trace id across four services and owns
   none of them, so the honest failure mode is a hole: `missing` is carried in the
   list, counted in the KPI and drawn as a dashed gap in the waterfall. */
/* Which trace the waterfall is showing. Null means the newest. */
let TRACE_SHOWN=null;
function showTrace(id){TRACE_SHOWN=id;render()}

/* One attempt list, one outcome, one clock reading — shared by the two cards
   below so neither has to restate what an absent execution record means. */
function attemptsOf(d){return((d.execution||{}).attempts)||[]}
function outcomeOf(d){const a=attemptsOf(d);return a.length?a[a.length-1].outcome:(d.selected?'routed':'no_route')}
function clockOf(t){return dash(String(t||'').slice(11,19))}

/* The trace index, and whichever trace is being shown.
   Both reads in one place, and a failure of either yields "nothing recorded"
   rather than a broken screen — the hub is NERVIS's own, so this must render
   whether or not any peer is answering. */
/* `answered` travels with the traces, because an empty list means two opposite
   things and the screen below prints one of them as a fact.

   "No trace has been recorded" is a statement about NERVIS having seen no
   inbound `traceparent`. This function produced `{items:[]}` for a non-2xx and
   for any throw as well, so a read that never landed rendered as that sentence
   — telling a reader that the thing they came to look at does not exist, when
   what actually happened is that nobody asked. */
async function readTraces(){
 const empty={items:[]};
 try{
  const r=await fetch(BASE.nervis+'/api/v1/traces?limit=500',
    {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!r.ok)return{traces:empty,shown:null,answered:false};
  const traces=await r.json();
  const pick=TRACE_SHOWN||((traces.items[0]||{}).trace_id);
  if(!pick)return{traces,shown:null,answered:true};
  /* **The unified read, which is a superset.** It returns the same assembled
     trace under `trace` plus M17's three additions, so one request replaces
     two — and a caller that only wanted the waterfall still gets it. */
  const t=await fetch(BASE.nervis+'/api/v1/traces/'+encodeURIComponent(pick)+'/unified',
    {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!t.ok)return{traces,shown:null,answered:true};
  const whole=await t.json();
  return{traces,shown:{...whole.trace,unified:whole},answered:true};
 }catch(e){return{traces:empty,shown:null,answered:false}}
}

async function routeDecisions(){
 try{const read=await ravisRead('routes',{limit:25});return read.available?read.data:null}
 catch(e){return null}
}

/* One span's bar, or its moment.
   **A point, not a bar.** One event is a recorded moment; giving it width would
   be the invented duration §11.2 forbids. */
/* Renamed from `spanBar`, which already existed at the top of this file taking
   `(sp, win)` and drawing the Overview card's bars. Two top-level declarations
   with one name means the later one wins silently — so splitting `tracesView`
   quietly repointed the Overview at a three-argument function it was calling
   with two, and its bars rendered at left 0, full width, with no error. Nothing
   threw, so `render_check` passed it. */
function waterfallBar(sp,offsetPct,win){
 if(sp.is_point)
  return `<i style="position:absolute;left:${escapeHtml(win?Math.min(offsetPct,99):0)}%;width:3px;height:16px;background:var(--accent);border-radius:2px"></i>`;
 return `<i style="position:absolute;left:${win?offsetPct:0}%;width:${escapeHtml(win?Math.max(sp.duration_ms/win*100,1):100)}%;height:16px;background:rgba(var(--rgb),.5);border-radius:3px"></i>`;
}

/* **The waterfall since M7.** Assembled by NERVIS from the event hub and
   nothing else: §11.1 makes the hub operational telemetry rather than the
   system of record, so a trace here is what was *recorded*, not what happened,
   and where those differ the difference is reported rather than filled in.

   Split out of `tracesView`, which measured cyclomatic complexity 25. */
function traceWaterfall(traces,shown,answered=true){
 /* A read that never landed is not a machine with no traces. Saying "no
    trace has been recorded" to somebody whose request simply failed tells
    them the thing they came to look at does not exist. */
 if(!answered)return `<div class="card full"><h3>Trace waterfall</h3>${cell(`
   <small class="mono dim">the trace index could not be read, so this is empty because nothing was fetched — not because nothing has been traced. <b>NERVIS /api/v1/traces</b> did not answer.</small>`,'nervis')}</div>`;
 if(!traces.items.length)return `<div class="card full"><h3>Trace waterfall</h3>${cell(`
   <small class="mono dim">no trace has been recorded. A trace needs a <b>traceparent</b> on an inbound request — NERVIS creates a span when it has one and never manufactures one when it does not, because a trace containing a single service is a fact about nothing. <b>RAVIS and SIRVIS do not publish events yet</b> (their Stage 7 milestones), so a cross-service waterfall needs those first.</small>`,'nervis')}</div>`;
 const win=(shown&&shown.window_ms)||0;
 const at=sp=>shown.started!=null&&sp.started!=null?(sp.started-shown.started)*1000:0;
 const pct=sp=>win?at(sp)/win*100:0;
 const chips=traces.items.slice(0,6).map(t=>`<button class="mode-chip${escapeHtml(shown&&t.trace_id===shown.trace_id?' on':'')}" onclick="showTrace('${jsAttr(t.trace_id)}')">${escapeHtml(t.trace_id.slice(0,8))} · ${escapeHtml(t.services.join('+'))}</button>`).join('');
 const body=shown
  ?`${shown.spans.map(sp=>`<div class="trace-step" style="align-items:center">
     <b style="min-width:88px">${escapeHtml(sp.label)}</b>
     <span style="flex:1;position:relative;height:16px">${waterfallBar(sp,pct(sp),win)}</span>
     <span class="mono dim" style="min-width:104px;text-align:right">${escapeHtml(sp.is_point?'one moment':(sp.duration_ms+' ms'))} · ${escapeHtml(sp.events)} ev</span></div>`).join('')}
   ${(shown.warnings||[]).map(w=>`<div class="trace-step"><b style="color:#ffb648">gap</b><span>${w}</span></div>`).join('')}`
  :'<small class="mono dim">that trace is no longer recorded.</small>';
 return `<div class="card full live"><h3>Trace waterfall <span class="chip mono">${escapeHtml((shown&&shown.trace_id||'').slice(0,16))}</span></h3>${cell(`
   <div class="filter-row">${chips}</div>
   ${body}
   <small class="mono dim">a span is <b>the interval a service's events cover</b>, which is a weaker claim than a real start/end pair and is said so here because the difference matters when reading a waterfall. <b>One event is drawn as a moment</b>, not a zero-length bar. A service that recorded nothing gets <b>no bar at all</b> — §11.2 forbids synthesizing a span as fact, and a hole in the record is the finding rather than something to fill. Clock skew is reported and never corrected: a straightened waterfall deletes the only evidence two clocks disagree.</small>`,'nervis')}</div>`;
}

function decisionsCard(items,latest){
 return `<div class="card full live"><h3>Recent routing decisions</h3>${cell(`
   <div class="table-row head six"><span>Decision</span><span>At</span><span>Application</span><span>Pool</span><span>Selected</span><span>Outcome</span></div>
   ${items.map(d=>`<div class="table-row six${d.decision_id===latest.decision_id?' selected':''}">
     <span class="mono">${escapeHtml(dash(d.decision_id))}</span>
     <span class="mono">${escapeHtml(clockOf(d.decided_at))}</span>
     <span>${escapeHtml(dash(d.application_id))}</span>
     <span class="mono" style="opacity:.8">${escapeHtml(d.pool||dash(d.requested))}</span>
     <span class="mono">${escapeHtml(dash(d.selected))}</span>
     <span class="chip${warnUnless(['ok','success','succeeded','routed'].includes(outcomeOf(d)))}">${escapeHtml(outcomeOf(d))}</span></div>`).join('')}
   <small class="mono dim"><b>no_route</b> is an outcome rather than a failure — it means a hard constraint could not be satisfied and RAVIS refused rather than routing around it (§9.2). These are held in memory only: §17 does not list route decisions as stored state, so a restart loses them and that is the intended trade.</small>`,'ravis')}</div>`;
}

/* Everything about one decision that is only shown when it happened.
   A list rather than five inline conditionals: each `? … : ''` was a branch on
   the gate, and a row that is absent because there was nothing to say is not a
   decision the reader makes. */
function decisionDetailRows(latest){
 const fallbacks=latest.fallbacks||[],requirements=latest.requirements||[];
 const stopped=(latest.execution||{}).stopped_because;
 const rows=[];
 if(fallbacks.length)
  rows.push(`<div class="trace-step"><b>fallbacks</b><span class="mono" style="opacity:.75">${fallbacks.map(escapeHtml).join(' · ')}</span></div>`);
 rows.push(...requirements.map(r=>`<div class="trace-step"><b>required</b><span class="mono">${r}</span></div>`));
 rows.push(`<div class="trace-step"><b>considered</b><span>${escapeHtml((latest.considered||[]).length)} candidate(s), ${escapeHtml((latest.excluded||[]).length)} excluded</span></div>`);
 rows.push(...attemptsOf(latest).map((a,n)=>`<div class="trace-step"><b>attempt ${n+1}</b><span class="mono">${escapeHtml(a.model)} → ${escapeHtml(a.outcome)}${a.detail?' · '+escapeHtml(a.detail):''}</span></div>`));
 if(stopped)
  rows.push(`<div class="trace-step"><b>stopped</b><span style="opacity:.75">${stopped}</span></div>`);
 return rows.join('');
}

function latestDecisionCard(latest){
 return `<div class="card wide live"><h3>Decision ${escapeHtml(latest.decision_id||'')} <span class="chip">${escapeHtml(latest.execution_path||'')}</span></h3>${cell(`
   <div class="trace-step"><b>requested</b><span class="mono">${escapeHtml(dash(latest.requested))}</span></div>
   <div class="trace-step"><b>selected</b><span class="mono">${escapeHtml(latest.selected||'no route')}</span></div>
   ${decisionDetailRows(latest)}
   <small class="mono dim">${escapeHtml(latest.reason||'')}</small>`,'ravis')}</div>

`;
}

/* Its own card, because it is its own claim: what is above is RAVIS's decision
   record, not a distributed trace. */
function crossServiceCard(){
 return `<div class="card narrow"><h3>Cross-service spans <span class="chip warn">unavailable</span></h3>${cell(`
   <div class="trace-step"><b>RAVIS events</b><span class="mono">M18b · Stage 7</span></div>
   <div class="trace-step"><b>SIRVIS events</b><span class="mono">M21 · Stage 7</span></div>
   <div class="trace-step"><b>span timeline</b><span>not drawn</span></div>
   <small class="mono dim">what is above is <b>RAVIS's own decision record</b>, not a distributed trace. A timeline correlating Clarvis, RAVIS, SIRVIS and the runtime needs event publication, which both services currently declare <b>unavailable</b> on their own capability surface. Drawing a timeline from one service's record would invent the other three rows.</small>`,'ravis')}</div>`;
}


/* ── M17: what else was going on, around one trace ───────────────────────────

   §11.3 requires diagnostics to keep three kinds of claim apart — a
   service-reported fact, a NERVIS observation, an operator inference — and the
   rule earns its place here rather than being quoted. A log line carrying the
   trace id *is* part of the trace; one written in the same second is evidence
   about the second. Drawn differently on purpose. */

function healthOverlay(rows){
 if(!rows.length)return banner('No health overlay',
   'NERVIS has no registry reading to place against this trace.','info');
 return `<div class="table-row head caps" style="grid-template-columns:1fr 1fr 1fr 1fr">
   <span>Service</span><span>State then</span><span>State now</span><span></span></div>`
  +rows.map(r=>`<div class="table-row" style="grid-template-columns:1fr 1fr 1fr 1fr">
    <span><b>${escapeHtml(r.service)}</b></span>
    <span class="${r.known?'':'dim'}">${escapeHtml(r.state_then)}${r.known?''
      :' <small>(nothing recorded)</small>'}</span>
    <span class="mono dim">${escapeHtml(r.state_now)}</span>
    <span>${r.changed_since?'<span class="chip warn">changed since</span>':''}</span>
   </div>`).join('');
}

/* The link's strength, said in the card rather than left to the reader. */
function logCorrelation(logs){
 const exact=logs.how==='carries the trace id';
 const head=banner(exact?'These lines are part of this trace'
     :'These lines are from around the same time',
   exact
    ?'Each one carries the trace id, so it belongs to this request rather than merely '
     +'coinciding with it.'
    :escapeHtml(logs.reason||'')+'.',
   exact?'info':'warn');
 if(!logs.items.length)return head;
 return head+logs.items.map(one=>`<div class="table-row" style="grid-template-columns:.7fr .6fr 3fr">
   <span class="mono dim">${escapeHtml(one.service||'')}</span>
   <span class="mono dim">${escapeHtml(one.level||'—')}</span>
   <span class="mono" style="word-break:break-word">${escapeHtml(
     String(one.message||'')).slice(0,300)}</span>
  </div>`).join('');
}

function runtimeContext(runtime){
 if(!runtime.available)return banner('No runtime evidence',
   escapeHtml(runtime.reason||'')+'. '
   +'SIRVIS measures what somebody asked it to measure, so most models have none — and a '
   +'measurement is never borrowed from a similar build.','info');
 return Object.entries(runtime.evidence||{}).map(([model,ev])=>`
   <div class="trace-step"><b>${escapeHtml(model)}</b><span class="mono">${escapeHtml(
     ev.evidence_type||'')}</span></div>`).join('');
}

/* The three cards, drawn only where a trace is on screen. */
function unifiedCards(unified){
 if(!unified)return '';
 const partial=unified.partial
   ? banner('This trace is incomplete','A span is missing or a clock disagrees — the waterfall '
     +'says which. What follows describes what was recorded, not what happened.','warn')
   : '';
 return partial
  +`<div class="card half${liveClass(true)}"><h3>Health at the time</h3>${cell(
    healthOverlay(unified.health||[]),'nervis')}</div>
  <div class="card half${liveClass(true)}"><h3>Runtime evidence</h3>${cell(
    runtimeContext(unified.runtime||{}),'nervis')}</div>
  <div class="card full${liveClass(true)}"><h3>Correlated log lines
    <span class="chip">${escapeHtml((unified.logs||{}).items?.length||0)}</span></h3>${cell(
    logCorrelation(unified.logs||{items:[],how:''}),'nervis')}
    <small class="mono dim"><b>How each thing was linked is shown, because the three are not
    equally certain.</b> A log line carrying the trace id belongs to this request. One matched only
    by time belongs to the same few seconds and may be about something else. Health <b>then</b> is
    reconstructed from the transitions NERVIS recorded — where none was recorded it says so rather
    than showing today's state as history.</small></div>`;
}

async function tracesView(){
 heading('Traces','One request across services — as recorded, with the holes marked.');
 const {traces,shown,answered}=await readTraces();
 const payload=await routeDecisions();
 /* Built before the early returns below, so a trace still renders when RAVIS
    is not answering — the hub is NERVIS's own and does not need a peer. */
 const waterfall=traceWaterfall(traces,shown,answered)
   /* M17's three additions sit under the waterfall and beside every early
      return below, because they come from NERVIS's own hub, registry and log
      adapters — none of which needs RAVIS to be answering. A trace read during
      an outage is exactly when the health overlay is worth having. */
   +unifiedCards((shown||{}).unified);

 if(!payload){
  $('#content').innerHTML=waterfall+`<div class="card full"><h3>RAVIS is not answering</h3>${cell(`
   <div class="trace-step"><b>endpoint</b><span class="mono">GET /api/v1/route-decisions</span></div>
   <small class="mono dim">no remembered traces to fall back on, deliberately. A trace describes one request that actually happened; a transcribed one would describe a request nobody made.</small>`,'ravis')}</div>`;
  return;}

 const items=payload.items||[];
 if(!items.length){
  $('#content').innerHTML=waterfall+`<div class="card full${escapeHtml(liveClass(SOURCE.ravis==='live'))}"><h3>Nothing has routed yet</h3>${cell(`
   <div class="trace-step"><b>decisions recorded</b><span>0</span></div>
   <small class="mono dim">RAVIS records a decision per request and keeps them in memory — §17's storage model does not list them, and a breaker that survived a restart would be worse than one that did not. Send a request through <span class="mono">/v1/chat/completions</span> and this fills in.</small>`,'ravis')}</div>`;
  return;}

 const routed=items.filter(d=>d.selected).length;
 $('#content').innerHTML=waterfall+kpis([
   /* **Not fed by NERVIS's traces.** `items` is RAVIS's decision log, read
      through the peer surface, and this screen has already returned if that
      read produced nothing — so all four of these are arithmetic over a live
      answer and all four asserted `false`. */
   ['Decisions',String(items.length),'kept in memory, not persisted','ravis',SOURCE.ravis==='live'],
   ['Routed',`${routed} / ${items.length}`,'no-route is an outcome, not a failure','ravis',SOURCE.ravis==='live'],
   ['Pools',String(new Set(items.map(d=>dash(d.pool))).size),'distinct pools addressed','ravis',SOURCE.ravis==='live'],
   ['Paths',String(new Set(items.map(d=>d.execution_path)).size),'transparent vs translated','ravis',SOURCE.ravis==='live']])
 +decisionsCard(items,items[0])+latestDecisionCard(items[0])+crossServiceCard();
}

/* ── SETTINGS ──────────────────────────────────────────────────────────────
   Several of these are safety boundaries rather than preferences, so they are
   rendered as state with the rule attached, and the only control is the health
   test §14 actually specifies. Flipping payload capture or a supervision mode is
   a mutation: it needs an actor, an audit record and a revalidated capability,
   and none of that exists to be called yet. */
async function settingsView(){
 heading('Settings','Endpoints, ownership, privacy and retention. Some of these are boundaries, not preferences.');
 const s=await API.nervis.settings();
 /* NERVIS.md §12: ownership is recorded, never inferred from localhost or a
    process name, and it decides what supervision may do at all. */
 const MAY={external:'observe only',
            user_managed:'open documented instructions · never kill or restart',
            nervis_managed:'stop and restart · NERVIS started it through a configured adapter'};
 /* A chip is warned only when the switch sits in the *less private* position.
   Redaction on is the safe state and reads green; payload capture on does not. */
 const flag=(on,safe=false)=>`<span class="chip${warnUnless(on===safe)}">${on?'on':'off'}</span>`;
 
 /* NERVIS's own configuration. This said there was no NERVIS service to ask,
    that `nervis/` was one HTML file, and that M0 had never been built — all
    true when written and none of it true since M0 shipped the package,
    database and migrations. NERVIS serves this page and answers
    `/api/v1/settings`; the peers below are still read for their own state. */
 /* **Two reads, because one of them can lie.** `serviceDiagnostics` fetches a
    peer straight from the browser, which is a genuine cross-origin request —
    and a NERVIS running on anything but the port a peer's CORS allowlist
    expects gets every one of those refused. `fetch()` cannot tell the caller
    *why* a request failed: a CORS refusal and a dead socket both surface as
    the same opaque rejection, by design, so browser code has no way to ask
    which one happened. Caught live running two NERVIS instances side by
    side — the second one's Settings screen called a demonstrably-running
    RAVIS "not answering", because the browser's own request to it, not RAVIS
    itself, was what failed.

    NERVIS's own registry read has no such blind spot: it is a server-to-server
    probe, immune to a browser's CORS rules, and it is the same read Overview's
    "healthy" chip already trusts. Asked alongside the direct probe so a
    contradiction between them is answerable rather than silently believed. */
 const [registry,...peers]=await Promise.all(
   [API.nervis.services(),...['ravis','sirvis'].map(k=>serviceDiagnostics(k))]);

 /* NERVIS's own stored settings, since M0 gave it a database to store them in.
    `null` rather than 0 when it does not answer: nought settings and no service
    are different facts and the card says which. */
 const STORED_SETTINGS=await (async()=>{
  try{
   const r=await fetch(BASE.nervis+'/api/v1/settings',{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
   if(!r.ok)return null;
   return Object.keys((await r.json()).items||{}).length;
  }catch(e){return null}
 })();
 /* Live when anything actually answered — either peer's diagnostics, or
    NERVIS's own settings store. It hardcoded ` live`, so from disk it reported
    an observed configuration it had observed nothing about. */
 const configObserved=[...peers,STORED_SETTINGS].some(x=>x!==null&&x!==undefined);
 const liveCard=`<div class="card full${liveClass(configObserved)}"><h3>What NERVIS is configured with <span class="chip">${answeredChip(configObserved)}</span></h3>${cell(`
   ${['ravis','sirvis','clarvis'].map((k,n)=>{
     const d=n<2?peers[n]:null;
     return `<div class="trace-step"><b>${escapeHtml(k.toUpperCase())}</b><span class="mono" style="opacity:.85">${escapeHtml(BASE[k])} · ${
       n<2?peerAnswerNote(d,registry,k):'no MEP surface — the optional bridge'}</span></div>`;}).join('')}
   <div class="trace-step"><b>NERVIS</b><span class="mono" style="opacity:.85">${escapeHtml(location.origin)} · serving this page</span></div>
   <div class="trace-step"><b>stored settings</b><span>${STORED_SETTINGS==null?'<span class="chip warn">NERVIS not answering</span>':STORED_SETTINGS+' in the NERVIS database'}</span></div>
   <div class="trace-step"><b>conversations</b><span>${escapeHtml(CHAT_STORE.read().length)} stored in this browser</span></div>
   <div class="trace-step"><b>runtime token</b><span>${RUNTIME_TOKEN?'<span class="chip">held for this tab</span>':'<span class="chip warn">none</span>'}</span></div>
   <small class="mono dim"><b>NERVIS M0 shipped, so there is a service to configure.</b> <span class="mono">nervis serve</span> serves this page, holds a migrated SQLite database and answers <span class="mono">/api/v1/settings</span> — the count above is read from it. This card said the opposite for as long as the dashboard was a statically served file, which it no longer is. <b>Conversations are still in this browser</b>, not the database: moving them is M20. Everything below describes settings the service does not yet expose and is prototype content until the screens that own them land.</small>`,'nervis')}</div>`;
 $('#content').innerHTML=
  section('Ecosystem', liveCard + `<div class="card full"><h3>Services</h3>
   <div class="table-row head five"><span>Service</span><span>Endpoint</span><span>Ownership</span><span>NERVIS may</span><span>Test</span></div>
   ${s.services.map(([name,url,mode])=>`<div class="table-row five"><span>${escapeHtml(name)}</span><span class="mono" style="opacity:.7">${escapeHtml(url||'in-process')}</span><span class="mono">${escapeHtml(mode)}</span><span style="opacity:.75">${escapeHtml(MAY[mode]==null?'':MAY[mode])}</span><span><button class="btn" onclick="healthTest('${jsAttr(String(name).toLowerCase())}')">Test</button></span></div>`).join('')}
   <small class="mono dim">supervision acts only on what NERVIS started, by explicit executable identity. It never kills a process group, never touches an instance it did not launch, and never assumes a stale PID is still that service.<br>each endpoint is NERVIS's <b>copy</b> of where a peer said it listens — the peer sets its own bind address at start, and NERVIS records it. When the two disagree the service reads as <b>unreachable</b>, not as misconfigured, because from here those are indistinguishable: a peer that moved and a peer that stopped both fail to answer. The health test above is what tells them apart.</small></div>`)
  + section('Voice', await voiceSection())
  + section('Privacy and retention', `<div class="card wide"><h3>Privacy</h3>
   <div class="table-row head"><span>Setting</span><span>State</span><span style="grid-column:3/-1">Why it is here</span></div>
   <div class="table-row"><span>Content logging</span><span>${flag(s.privacy.content_logging,false)}</span><span style="opacity:.7;grid-column:3/-1">prompts and completions are never written to the event or trace store</span></div>
   <div class="table-row"><span>Payload capture</span><span>${flag(s.privacy.payload_capture,false)}</span><span style="opacity:.7;grid-column:3/-1">spans carry timings, decisions and states — not bodies</span></div>
   <div class="table-row"><span>Redact paths</span><span>${flag(s.privacy.redact_paths,true)}</span><span style="opacity:.7;grid-column:3/-1">workspace paths are removed by the producer, before NERVIS receives the frame</span></div>
   <div class="table-row"><span>Redact prompts</span><span>${flag(s.privacy.redact_prompts,true)}</span><span style="opacity:.7;grid-column:3/-1">defence in depth: NERVIS re-applies redaction it already expects upstream</span></div>
   <div class="table-row"><span>Diagnostics route</span><span class="mono">${escapeHtml(s.privacy.diagnostics_route)}</span><span style="opacity:.7;grid-column:3/-1">cloud analysis is never implicit — sending a diagnostic packet is still sending your data somewhere</span></div>
   <small class="mono dim"><b>None of these five is enforced by NERVIS.</b> They describe what the specification requires and are read from a fixed shape, not from any setting NERVIS honours — no code reads <span class="mono">redact_paths</span> or <span class="mono">redact_prompts</span>, and <span class="mono">/api/v1/system</span> publishes this machine's hostname by default. Said plainly because a switch rendered <b>ON</b> beside "workspace paths are removed" is a claim of protection, and an unenforced claim of protection is worse than no claim: it is the reason nobody checks. What <i>is</i> enforced today is narrower and elsewhere — the event quarantine stores a shape digest rather than a producer's values, and <span class="mono">/api/v1/system?redact=true</span> withholds the fields it labels sensitive. These read as state because changing one is a mutation: it needs an actor, an audit record with precondition and result, and a revalidated capability. A toggle wired to nothing would be a claim that the endpoint exists.</small></div>
<div class="card narrow"><h3>Retention</h3>
   <div class="trace-step"><b>events</b><span class="chip">set at start</span></div>
   <div class="trace-step"><b>chat</b><span>until deleted, in this browser</span></div>
   <small class="mono dim">event retention is a <span class="mono">nervis serve</span> setting read once at start, so it is not a control here and the numbers this card used to print — 14 days, 7 days, a 200 MB log cap — were a fixed object rather than anything the service had been told. Chat is the one store on this screen a person empties directly, and it is emptied from <b>Chat → history</b> where the conversations are.</small></div>`, false)
  + section('Backup', backupSection())
  + section('Unattended work', await backgroundSection())
  + section('What NERVIS remembers', await recallSection() + await learnedSection() + await rememberedSection())
  + section('Supervision', await supervisionSection() + `<div class="card wide"><h3>Ownership</h3>
   <div class="table-row head"><span>Mode</span><span style="grid-column:2/-1">Services</span></div>
   <div class="table-row"><span>restartable</span><span style="grid-column:2/-1" class="mono">${escapeHtml(s.supervision.restartable.join(' · '))}</span></div>
   <div class="table-row"><span>observed only</span><span style="grid-column:2/-1" class="mono">${escapeHtml(s.supervision.observed.join(' · '))}</span></div>
   <small class="mono dim">${escapeHtml(s.supervision.observed.length)} of ${escapeHtml(s.supervision.observed.length+s.supervision.restartable.length)} services are observe-only. That is the safe default: NERVIS earns the right to stop something by having started it.</small></div>`, false);
}


/* Function declarations hoist, so the tables can name views defined further down.
   One entry per sidebar destination; a missing entry falls through to the app's
   own dashboard rather than rendering an empty page. */
/* ── Runtime — what is loaded, who holds it, and the controls that are real ──
   The first screen on this page whose buttons reach a service. Everything else
   that would change something is disabled and says which endpoint it is waiting
   for; these four exist today:

     POST   /api/v1/runtime/sessions              take a lease on one or more models
     DELETE /api/v1/runtime/sessions/{id}         release it
     POST   /api/v1/runtime/sessions/{id}/renew   extend it
     GET    /api/v1/runtime/residency             what is held, by whom

   §9's whole argument is that a loaded model has *owners*, and unloading one
   because a single owner finished is how two clients fight. That is only true
   if somebody can see the reference counts, which is what this screen is.

   **Mutations need a runtime-scoped token and reads do not** (§4.5: every
   mutating endpoint requires a scope even on loopback). So the token box below
   gates the four controls and nothing else — the tables fill in without it. It
   is held in memory for the tab and never written to storage: a dashboard that
   persisted a runtime-scoped credential would be a worse place to keep it than
   the store it came from. */
let RUNTIME_TOKEN='';
/* The launcher hands the dashboard its runtime token in the URL fragment, so
   nobody has to open a terminal, run a CLI and paste 43 characters into a field
   — a manual step that had wrong instructions printed next to it for months.

   The fragment is used rather than a query string because everything after `#`
   is never sent to a server: not to the file server that served this page, not
   in a Referer, not into any access log. It is read here, erased from the
   address bar with replaceState before the first render, and kept for this tab
   only — so a bookmark or a shared URL does not carry it.

   **`sessionStorage`, not a variable, and the difference was a reported bug.**
   "This tab only" was implemented as "this page load only", which is stricter
   than it sounds: every reload silently disarmed the dashboard, so Load and
   Release went back to "a runtime-scoped token is required" with no way to tell
   that from never having had one. Reported as *can't load models in sirvis*,
   and the token was sitting valid in `.run/dashboard.token` the whole time.
   Routing made it worse rather than causing it — an addressable page is one
   people reload.

   `sessionStorage` is exactly the documented intent: scoped to this tab, gone
   when it closes, never in a URL, a bookmark or a Referer. What it does add is
   that any script on this origin can read it — and the only thing served from
   this origin is this page. */
const TOKEN_KEY='nervis.runtime-token';
function rememberToken(value){
 RUNTIME_TOKEN=value||'';
 try{
  if(value)sessionStorage.setItem(TOKEN_KEY,value);
  else sessionStorage.removeItem(TOKEN_KEY);
 }catch(e){/* private mode, or storage disabled: the token stays in memory */}
}

/* SIRVIS redacts a lease's `owner` for a caller presenting no token — a
   Claude Security scan found that once `owner` became a real caller identity
   (the fix for close/renew's missing ownership check), the residency read's
   open-to-anyone design started naming which real token opened each session
   to a fully anonymous network peer. This tab already holds a real token for
   the writes on the Runtime screen, so sending it on this one read too costs
   nothing and is what un-redacts the Owner column there. Its own function,
   not inlined at the call site, so the one branch it needs does not count
   against `sirvisRuntime`'s own complexity. */
function residencyAuthHeader(){
 return RUNTIME_TOKEN?{authorization:'Bearer '+RUNTIME_TOKEN}:undefined;
}
(function(){
 /* The remembered one first, so a reload keeps working; the fragment overrides
    it, because a launcher that just minted a fresh token means it. */
 try{RUNTIME_TOKEN=sessionStorage.getItem(TOKEN_KEY)||''}catch(e){}
 const m=/[#&]token=([^&]+)/.exec(location.hash||'');
 if(!m)return;
 rememberToken(decodeURIComponent(m[1]));
 /* Cleared twice, and the second time is not belt-and-braces. Clearing during
    parsing is not reliably final: the browser still has the fragment to process
    for anchor scrolling once the document finishes, and it can reappear in the
    address bar afterwards. Observed on a cold-start test — the token was picked
    up, so this ran, and the fragment was back by the time the page settled. */
 /* Only the token. This used to erase the whole fragment, which was correct
    while the fragment held nothing else — and would have deleted the route on
    every launcher start now that it does. Both scrubs below fire after the
    first render, so the symptom would have been an address bar that forgets
    the screen you are on rather than anything that looked like a scrub. */
 const scrub=()=>{
  const kept=(location.hash||'').replace(/^#/,'').split('&')
    .filter(part=>part&&!part.startsWith('token='));
  const rest=kept.length?'#'+kept.join('&'):'';
  if((location.hash||'')!==rest)
   history.replaceState(null,'',location.pathname+location.search+rest);
 };
 scrub();
 addEventListener('DOMContentLoaded',scrub);
 addEventListener('load',scrub);
})();

/* The effective configuration of one resident model, as a sentence.
   An empty configuration is a dash rather than an empty cell: "SIRVIS reported
   no overrides" and "this table failed to render a value" look identical
   otherwise, and only one of them is fine. */
function effectiveConfig(h){
 const parts=Object.entries(h.effective_configuration||{}).map(([k,v])=>`${k} ${v}`);
 return dash(parts.join(' · '));
}

/* Whether the mutation controls on this screen are usable.
   Reads are open on loopback; loading or releasing a model is not, because it
   spends gigabytes and can evict a model another client is holding. */
/* What to do about a refusal that names a scope.

   §4.5 separates SIRVIS's scopes by what they cost, so the token that loads a
   model is *not* the token that occupies the machine for ten minutes with a
   benchmark. That is a good rule with a bad failure mode on a dashboard: one
   token box, and a refusal that says which scope is missing without saying that
   one token can carry both. */
function scopeHint(failure){
 if(!failure||!/scope/i.test(failure.message||''))return '';
 return ' · mint one that carries both: sirvis token --mint dashboard --scopes "runtime benchmark"';
}

/* Starting and stopping the services NERVIS started (M16).

   **Off until somebody turns it on**, and every control is disabled with the
   reason beside it rather than merely greyed. "External" and "owned but never
   started by NERVIS" refuse for different reasons, and a screen that showed one
   disabled button for both would be telling somebody the wrong thing about
   their own machine. */
async function supervisionSection(){
 let b=null,live=false;
 try{
  const r=await fetch(BASE.nervis+'/api/v1/supervision',{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(r.ok){b=await r.json();live=true}
 }catch(e){}
 if(!b)return `<div class="card wide${liveClass(false)}"><h3>Service control</h3>${cell(
   banner('NERVIS is not answering','Supervision lives in NERVIS\'s own store and cannot be read or changed from here until it is up.','warn'),'nervis')}</div>`;

 const rows=(b.services||[]).map(s=>supervisionRow(s,b.enabled)).join('');
 return `<div class="card wide${liveClass(live)}"><h3>Service control
   <span class="chip${b.enabled?' warn':' dim'}">${b.enabled?'on':'off'}</span></h3>${cell(`
   <label style="display:flex;gap:8px;align-items:baseline;cursor:pointer">
     <input type="checkbox"${b.enabled?' checked':''} onchange="setSupervision(this.checked)">
     <span><b>Let NERVIS start and stop the services it started</b><br>
       <small class="mono dim">never anything it did not start, and never an external service</small></span></label>
   <div class="table-row head caps" style="grid-template-columns:1fr 1.1fr 1.5fr 1.3fr;margin-top:10px">
     <span>Service</span><span>Ownership</span><span>State</span><span></span></div>
   ${rows}`,'nervis')}
   <small class="mono dim"><b>NERVIS may only stop what NERVIS started.</b> A service brought up by the launcher is one it observes — it holds no record of starting it, so it will not signal it, which is what §12 forbids. <b>A PID is not an identity</b>: what is recorded is the process, the program behind it and the moment it began, and all three must still agree before anything is signalled. <b>Three failed attempts open a service's circuit</b> and only clearing it here reopens the door, so a crash-loop cannot be re-entered by retrying. Every attempt is published to the event hub, refusals included.</small></div>`;
}

/* One service: what it is owned as, what NERVIS knows about its process, and
   the controls — each disabled with the reason it is disabled. */
function supervisionRow(s,on){
 const managed=s.mode==='nervis_managed';
 const state=s.circuit&&s.circuit.opened_at
   ? `<span class="chip warn">circuit open</span> <small class="mono dim">${escapeHtml(s.circuit.reason||'')}</small>`
   : s.started_by_nervis
     ? `<span class="chip">started here</span> <small class="mono dim">pid ${escapeHtml(s.pid)}</small>`
     : `<small class="mono dim">${escapeHtml(s.why_not||'not started by NERVIS')}</small>`;
 const verbs=(s.circuit&&s.circuit.opened_at)
   ? `<button class="mode-chip" onclick="clearCircuit('${jsAttr(s.service)}')">Clear circuit</button>`
   : ['start','stop','restart'].map(v=>`<button class="mode-chip"
       onclick="superviseNow('${jsAttr(s.service)}','${v}')"${on&&managed?'':' disabled'}>${v}</button>`).join(' ');
 return `<div class="table-row" style="grid-template-columns:1fr 1.1fr 1.5fr 1.3fr">
   <span><b>${escapeHtml(s.label||s.service)}</b></span>
   <span class="mono" style="opacity:.8">${escapeHtml(s.mode)}${s.declared!==s.mode
     ? `<br><small class="dim">declared ${escapeHtml(s.declared)}</small>`:''}</span>
   <span>${state}</span>
   <span>${verbs}</span></div>`;
}

/* Work NERVIS does with nobody watching (M25).

   **Off until somebody turns it on, and the switch is the first thing here.**
   This is the only feature that spends money without being asked to, so the
   control governing it is a control rather than a preference buried in a list.

   The card shows what it did as well as what it may do. A ledger of runs that
   produced a note would answer the cheerful half of "what has this been doing"
   and leave the expensive half — the runs that thought and said nothing — out
   of view, which is exactly the half somebody paying for it wants. */
/* M18 — export and import, without secrets. What may cross this boundary is
   decided once, server-side, in nervis.settings_transfer.EXPORTABLE; this is
   the button that calls it and the file-picker that sends one back. Nothing
   here re-decides what is safe — a client-side allowlist duplicated from the
   server's is a second copy that can drift, and drifting *open* is the one
   direction that matters here. */
let BACKUP_RESULT=null;

async function exportSettings(){
 try{
  const r=await fetch(BASE.nervis+'/api/v1/settings/export',
    {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const body=await r.json();
  const blob=new Blob([JSON.stringify(body,null,1)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const stamp=new Date().toISOString().slice(0,10);
  const a=document.createElement('a');
  a.href=url;a.download=`nervis-settings-${stamp}.json`;
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
 }catch(e){notify('Export failed: '+e.message)}
}

function pickSettingsFile(){$('#settingsFilePicker').click()}

async function importSettingsFile(input){
 const file=input.files&&input.files[0];
 input.value='';
 if(!file)return;
 let parsed;
 try{parsed=JSON.parse(await file.text())}
 catch(e){BACKUP_RESULT={ok:false,message:'That file is not valid JSON.'};render();return}
 try{
  const r=await fetch(BASE.nervis+'/api/v1/settings/import',
    {method:'POST',headers:{'content-type':'application/json'},
     body:JSON.stringify(parsed),signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  const body=await r.json();
  if(!r.ok){BACKUP_RESULT={ok:false,message:body.message||('NERVIS refused it: HTTP '+r.status)};render();return}
  BACKUP_RESULT={ok:true,applied:body.applied||[],skipped:body.skipped||[]};
 }catch(e){BACKUP_RESULT={ok:false,message:'The import request did not complete: '+e.message}}
 render();
}

/* What just happened, or nothing — cleared page state, not carried in a
   toast that could be missed. `skipped` is shown with its reason every time,
   never just a count: a person who exported five preferences and gets back
   two applied should be able to tell *which* three did not travel, and why,
   without guessing. */
function backupResultCard(){
 if(!BACKUP_RESULT)return '';
 if(!BACKUP_RESULT.ok)return banner('Import failed',escapeHtml(BACKUP_RESULT.message),'warn');
 const {applied,skipped}=BACKUP_RESULT;
 // Built directly rather than string-splicing into banner()'s own markup —
 // that worked only by knowing its exact template shape, and broke silently
 // the moment that shape changed. This owns its own HTML instead.
 return `<div class="banner" data-tone="info"><div>
   <b>Import complete — ${escapeHtml(applied.length)} setting(s) applied</b>
   <div class="trace-step"><b>applied</b><span>${applied.length
      ?applied.map(k=>`<span class="mono">${escapeHtml(k)}</span>`).join(', ')
      :"nothing — the file matched none of this build's exportable settings"}</span></div>
   ${skipped.map(one=>`<div class="trace-step"><b>skipped ·
     <span class="mono">${escapeHtml(one.key)}</span></b><span style="opacity:.75">${escapeHtml(one.reason)}</span></div>`).join('')}
  </div></div>`;
}

function backupSection(){
 return `<div class="card wide"><h3>Settings backup</h3>${cell(`
   ${backupResultCard()}
   <div class="filter-row">
     <button class="btn primary" onclick="exportSettings()">Export settings</button>
     <button class="btn" onclick="pickSettingsFile()">Import settings…</button>
     <input id="settingsFilePicker" type="file" accept="application/json,.json"
       style="display:none" onchange="importSettingsFile(this)">
   </div>
   <small class="mono dim"><b>Export saves a file to your downloads folder</b> — chat presets and
   parameters, background and recall preferences, voice settings, the display name. <b>Never a
   credential</b>: nothing this dashboard treats as a secret has ever lived in the settings this reads
   from, and the export is built from an allowlist rather than a filter — a preference added to NERVIS
   later is excluded by default until it is deliberately added to that list, not included by default
   until someone thinks to exclude it. <b>Not everything in "settings" travels</b>, on purpose: a
   supervision adapter is a filesystem path bound to this machine, a background session id was minted
   for this install, and a voice request counter describes a day that already happened — none of those
   mean anything on another machine, or on this one after a reinstall. <b>Import applies only what the
   same allowlist accepts</b>, whichever machine or person wrote the file, and reports the rest rather

}

/* The ledger, newest first. Its own function because the card crossed the
   complexity ratchet: a switch, a set of triggers, a row of numbers and a
   history are four things, and they were one expression. */
function backgroundLedger(runs){
 return (runs||[]).slice(0,8).map(r=>`<div class="table-row" style="grid-template-columns:1.1fr 2fr .9fr 1fr">
   <span class="mono" style="opacity:.8">${escapeHtml(r.trigger)}</span>

   <span><span class="chip${r.outcome==='failed'?' warn':''}">${escapeHtml(r.outcome)}</span></span>
   <span class="mono dim" style="font-size:11px">${escapeHtml(r.model||'—')}${r.cost?' · '+escapeHtml(r.cost):''}</span></div>`).join('');
}

/* One checkbox per trigger, disabled while the whole thing is off — a trigger
   that can be switched on inside a feature that is off is a control that does
   nothing, which is worse than one that is not offered. */
function backgroundTriggers(b){
 return (b.triggers||[]).map(t=>`<label style="display:flex;gap:7px;align-items:baseline;cursor:pointer;margin-top:5px">
   <input type="checkbox"${t.on?' checked':''}${b.enabled?'':' disabled'}

   <span><b class="mono">${escapeHtml(t.name)}</b> <span class="dim">— ${escapeHtml(t.about)}</span></span></label>`).join('');
}

async function sirvisRuntime(){
 heading('Runtime','What is resident, who holds it, and when their claim lapses.',
   control('Refresh evidence','refreshEvidence'));
 const [res,mdl]=await Promise.all([
   liveSirvis('/api/v1/runtime/residency',residencyAuthHeader()),API.sirvis.models()]);
 if(!res){$('#content').innerHTML=runtimeUnreachable();return}

 const held=res.holdings||[],leases=res.leases||[],foreign=res.foreign||[];
 const owned=held.filter(h=>h.owned).length;
