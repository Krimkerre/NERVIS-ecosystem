/* The four real mutations. Each one re-renders from the service afterwards
   rather than patching the table optimistically: the answer to "what is loaded"
   is the service's to give, and a screen that predicted it would be wrong in
   exactly the case that matters — when the load failed. */
/* Clicking an installed build (2026-08-24).

   Three things a click can do, all backed by endpoints that already existed —
   the click had simply never been wired to them:

     GET    /api/v1/models/{local_model_id}        what this build is
     GET    /api/v1/evidence?variant={variant_id}  what has been measured of it
     POST   /api/v1/runtime/sessions               load it, under a lease

   The evidence query is a *variant* query rather than a model lookup, and that
   is §12.2 showing through rather than an inconvenience: evidence is never
   keyed by model, because two packagings of one model are two different things
   — which this machine proved when granite's GGUF build passed 24 of 24 tool
   trials and its MLX build passed 3. The panel says so, because a reader
   otherwise wonders why it did not just ask for the model. */
const BUILD={
 async select(row,localId,variantId){
  if(row)selectOne(row,'.model');
  if(!localId){
   return this.paint(`<small class="mono dim">this row came from the prototype catalogue and carries no identifier to look up. Start SIRVIS and reload to get real builds.</small>`);
  }
  this.current={localId,variantId};
  this.paint('<small class="mono dim">reading…</small>');
  const [detail,evidence,residency]=await Promise.all([
   /* Still direct: `/api/v1/models/{id}` is not one of §9's declared surfaces,
      and adding a NERVIS route for it to save one cross-origin call would be
      inventing a surface the specification does not list. Its failure is
      already tolerated below. */
   fetch(BASE.sirvis+'/api/v1/models/'+encodeURIComponent(localId),readDeadline()).then(r=>r.ok?r.json():null).catch(()=>null),
   variantId?sirvisRead('evidence',{limit:200,variant:variantId}).then(x=>({ok:x.available,json:()=>x.data}))
     .then(r=>r.ok?r.json():null).catch(()=>null):Promise.resolve(null),
   sirvisRead('residency').then(x=>x.available?x.data:null)]);
  if(!detail)return this.paint('<small class="mono dim">SIRVIS did not answer for this build.</small>');
  this.paint(this.render(detail,evidence,residency));
 },

 paint(inner){const el=document.getElementById('buildPanel');
  if(el)el.innerHTML=`<h3>Selected build</h3>`+cell(inner,'sirvis');},

 /* The declared identity of a build: what it is, how it is packaged, and what
    it says about itself.

    Split out of `render`, which measured cyclomatic complexity 28 — the second
    highest in the file. Not one branch here is a decision a reader would
    recognise as one; it is twenty optional fields each falling back to an em
    dash, which is how a render function reaches 28 without anybody noticing it
    happening. */
 _identityRows(m){
  const v=m.variant||{},f=m.family||{};
  /* A measured field arrives either bare or wrapped with its provenance, and
     both spellings are live in SIRVIS's payloads. */
  const val=x=>x&&typeof x==='object'&&'value' in x?x.value:x;
  const prov=x=>x&&typeof x==='object'&&x.provenance?` <span class="mono" style="opacity:.5">${escapeHtml(x.provenance)}</span>`:'';
  const step=(label,body)=>`<div class="trace-step"><b>${label}</b>${body}</div>`;
  const mono=inner=>`<span class="mono">${inner}</span>`;

  const rows=[
   step('family',`<span>${escapeHtml(f.display_name||dash(m.display_name))}</span>`),
   step('packaging',mono(escapeHtml(dash([v.runtime_format,v.quantization].filter(Boolean).join(' · '))))),
   step('architecture',mono(escapeHtml(String(val(f.architecture)||dash(v.architecture)))+prov(f.architecture)))];
  if(val(f.parameter_billions)!=null)
   rows.push(step('parameters',mono(escapeHtml(String(val(f.parameter_billions)))+' B'+prov(f.parameter_billions))));
  rows.push(step('declared context',mono(escapeHtml(String(val(m.declared_context)??'—'))+prov(m.declared_context))));
  rows.push(step('publisher',mono(escapeHtml(dash(v.publisher)))));
  return rows.join('')+this._stateRows(m);
 },

 /* What is true of this build right now, as opposed to what it declares. */
 _stateRows(m){
  const inst=m.instances||[];
  const step=(label,body)=>`<div class="trace-step"><b>${label}</b>${body}</div>`;
  const rows=[];
  if((m.variant||{}).family_architecture_disagrees)
   rows.push(step('architecture','<span class="chip warn">family and variant disagree</span>'));
  rows.push(step('loaded',`<span>${m.is_loaded
    ?`<span class="chip">${escapeHtml(inst.length)} instance(s)</span>`
    :'<span class="chip warn">not resident</span>'}</span>`));
  inst.forEach(x=>rows.push(step('effective context',
    `<span class="mono">${escapeHtml(String(x.effective_context??'—'))}</span>`)));
  return rows.join('');
 },

 /* Evidence, grouped by role. A count per role rather than one number, because
    a build measured for chat says nothing about whether it can drive an agent —
    the distinction the whole role vocabulary exists for. */
 _evidenceRow(ev){
  if(!ev)return '';
  const byRole={};(ev.items||[]).forEach(e=>{byRole[e.role]=(byRole[e.role]||0)+1});
  const roles=Object.keys(byRole).sort();
  return roles.length
   ?`<div class="trace-step"><b>evidence</b><span>${roles.map(r=>`${r} <span class="mono" style="opacity:.6">${byRole[r]}</span>`).join(' · ')}</span></div>`
   :`<div class="trace-step"><b>evidence</b><span class="chip warn">none for this packaging</span></div>`;
 },

 /* Only *this* dashboard's lease may be released from here. A model can be held
    by several owners at once — that is the entire point of §9's reference
    counting — and the first lease a search happens to return may belong to
    somebody else. Offering to release it would be the dashboard unloading
    another client's model on their behalf, which is precisely the fight the
    reference count exists to prevent. Caught in testing, with a probe holding
    one lease and the dashboard the other. */
 _leaseState(m,res){
  const onModel=(res&&res.leases||[]).filter(l=>(l.models||[]).includes(m.runtime_key));
  const held=onModel.find(l=>l.owner==='nervis-dashboard');
  const others=onModel.filter(l=>l!==held);
  const armed=RUNTIME_TOKEN?'':' disabled title="a runtime-scoped token is required — set one on the Runtime screen" style="opacity:.45;cursor:not-allowed"';
  return{held,others,
   actions:held
    ? `<button class="btn"${armed} onclick="BUILD.release('${jsAttr(held.session_id)}',${(held.models||[]).length})">Release lease</button>`
    : `<button class="btn primary"${armed} onclick="BUILD.load('${jsAttr(m.runtime_key)}')">Load</button>`,
   heldElsewhere:others.length
    ? `<div class="trace-step"><b>also held by</b><span>${others.map(l=>escapeHtml(l.owner||'unknown')).join(' · ')}</span></div>`
    : ''};
 },

 /* The two things a reader must know before clicking Release. */
 _leaseNote({held,others}){
  const bundled=held&&(held.models||[]).length>1
   ? ` <b>This lease holds ${(held.models||[]).length} models</b> — releasing it unloads all of them.` : '';
  const shared=others.length
   ? ` It is also held by ${others.length} other owner(s), so releasing this lease will not unload it.` : '';
  return bundled+shared;
 },

 render(m,ev,res){
  const lease=this._leaseState(m,res);
  return this._identityRows(m)+this._evidenceRow(ev)+lease.heldElsewhere
   +`<div style="margin-top:10px">${/* markup, not data: `actions` holds the buttons this panel just built,
        and escaping it printed them on screen as text. Caught by the golden
        file rather than by the injection check, because the build panel is
        painted on interaction and no screen render reaches it. */lease.actions}</div>`
   +`<small class="mono dim">measurements are looked up by <b>variant</b>, not by model: two packagings of one model are two different things, and on this machine one granite build passed 24 of 24 tool trials while the other passed 3.${/* markup: the note carries a <b> emphasis, so escaping it printed the tag. */this._leaseNote(lease)}</small>`;
 },

 async load(runtimeKey){
  const out=await RUNTIME._send('/api/v1/runtime/sessions','POST',
    {owner:'nervis-dashboard',models:[{model_id:runtimeKey}],policy:'wait'});
  if(out)notify(`Loaded under session ${String(out.session_id).slice(0,12)}`);
  if(this.current)this.select(null,this.current.localId,this.current.variantId);
 },
 async release(sessionId,count){
  /* `sessionId`, not `id`. There is no `id` in scope and no global of that
     name, so this raised a ReferenceError before `armed` was ever called:
     whenever a lease held more than one model — the multi-model case this
     confirmation exists for — Release did nothing at all. No toast, no DELETE,
     no re-render. The single-model branch took the other path and worked, which
     is why it looked fine. */
  if(count>1&&!armed('lease:'+sessionId,`That lease holds ${count} models — releasing it unloads all of them`))return;
  const out=await RUNTIME._send('/api/v1/runtime/sessions/'+sessionId,'DELETE');
  if(out)notify(`Released · unloaded ${(out.unloaded||[]).length}`);
  if(this.current)this.select(null,this.current.localId,this.current.variantId);
 }};

const RUNTIME={
 setToken(){rememberToken((($('#rtToken')||{}).value||'').trim());
   notify(RUNTIME_TOKEN?'Token set for this tab':'Token cleared');render()},
 /* `body` defaults rather than being tested against the literal — nervis's own
    check forbids that string anywhere in this file, because the way it usually
    arrives is a view rendering a field the API stopped returning. */
 async _send(path,method,body={}){
  try{
   const r=await fetch(BASE.sirvis+path,{method,
     headers:{'content-type':'application/json','authorization':'Bearer '+RUNTIME_TOKEN},
     body:JSON.stringify(body)});
   const payload=await r.json().catch(()=>({}));
   if(!r.ok){const e=(payload.error||{});
     /* The scope hint rides on the refusal itself. Runtime operations still go
        straight from this tab with the runtime-scoped token, and a refusal that
        names a scope without saying one token can carry both is where the
        benchmark button lost ten minutes of somebody's evening. */
     notify(`${e.code||r.status}: ${e.message||'refused'}${scopeHint(e)}`);return null}
   return payload;
  }catch(failure){notify('SIRVIS did not answer: '+failure.message);return null}},
 async load(){
  const model=($('#rtModel')||{}).value,ctx=($('#rtCtx')||{}).value,lease=($('#rtLease')||{}).value;
  if(!model)return notify('no model selected');
  const entry={model_id:model};
  if(ctx)entry.configuration={context_length:Number(ctx)};
  const out=await this._send('/api/v1/runtime/sessions','POST',{
    owner:'nervis-dashboard',models:[entry],
    policy:($('#rtPolicy')||{}).value||'wait',
    ...(lease?{lease_seconds:Number(lease)}:{})});
  if(out)notify(`Session ${String(out.session_id).slice(0,12)} · ${(out.models||[]).length} model(s)`);
  render()},
 async release(id){const out=await this._send('/api/v1/runtime/sessions/'+id,'DELETE');
  if(out)notify(`Released · unloaded ${(out.unloaded||[]).length}`);render()},
 async renew(id){const out=await this._send('/api/v1/runtime/sessions/'+id+'/renew','POST');
  if(out)notify('Lease renewed');render()}};

const SIRVIS_VIEWS={'Models':sirvisModels,'Runtime':sirvisRuntime,'Discover':sirvisDiscover,'Benchmarks':sirvisBenchmarks,'Runtime sets':sirvisRuntimeSets,
 'Results':sirvisResults,'Recommendations':sirvisRecommendations,'Downloads':sirvisDownloads};
const RAVIS_VIEWS={'Routes':ravisRoutes,'Sessions':ravisSessions,'Pools':ravisPools,'Providers':ravisProviders,'Credentials':ravisCredentials,
 'Policies':ravisPolicies,'Evidence':ravisEvidence,'Logs':ravisLogs,'Diagnostics':ravisDiagnostics,'Settings':ravisSettings};
async function sirvis(){const v=SIRVIS_VIEWS[state.view];if(v)return v();
 /* Through `control()`, which is the whole reason it exists: "a button for
    an operation that exists, or a disabled one that names what it is waiting
    for. Never a button that looks live and is not." Both of these were
    hand-written around it, and the primary one called
    `DEMO_API.runBenchmark()` -- a method `DEMO_API` does not have. It rendered
    enabled, as the screen's main action, and threw a TypeError on click.
    `runBenchmark` has been in `UNBUILT` the whole time, naming the endpoint it
    waits for; nothing consulted it here. */
 heading('Benchmark laboratory','Model loading, repeated measurements and role-specific evidence.',
   control('Runtime & sessions','loadModel')+control('New benchmark','runBenchmark',' primary'));
 const [mdl,ev,rs,rn,mc]=await Promise.all([API.sirvis.models(),API.sirvis.evidence(),
   API.sirvis.runtimeSet(),API.sirvis.runs(),API.sirvis.machine()]);
 /* Loaded builds first, then the rest in catalogue order. What is resident now is
    the thing a reader is looking for, and it is two rows out of eleven. */
 /* Whether SIRVIS answered, computed once. Four inline ternaries asking the
    same question put this function over the complexity gate, which is the gate
    doing its job: the condition is one fact about the screen, not four. */
 const fromSirvis=SOURCE.sirvis==='live'?' live':'';
 const builds=[...mdl.items].sort((a,b)=>(a.state==='stopped')-(b.state==='stopped'));
 const loaded=builds.filter(m=>m.state!=='stopped');
 const resident=loaded.reduce((n,m)=>n+(m.resident_gb||0),0);
 const measured=builds.filter(m=>m.measured);
 /* Seeded with null AND guarded on it, which are two separate requirements
    this got half right twice.

    Unseeded, an empty array throws — and live `/api/v1/models` carried no
    measurements at all for a while, because throughput lives on evidence
    records rather than on a build. So a seed was added.

    But `null` as the seed makes the *first* callback call read `a.measured` on
    null, so it then threw for the opposite reason the moment any build did
    carry a measurement. Both failures land on the **default** SIRVIS screen,
    and `render()` has no catch, so either one blanks the whole app.

    `!a||` is the half that was missing. Empty array returns null; non-empty
    starts from its first element. */
 const fastest=measured.filter(m=>m.measured&&m.measured.gen_tok_s)
   .reduce((a,b)=>!a||b.measured.gen_tok_s>a.measured.gen_tok_s?b:a,null);
 const K=n=>n==null?null:n>=1024?Math.round(n/1024)+'K':n;
 const ctx=c=>c.context_length?K(c.context_length)+' loaded'
   :c.max_context_length?K(c.max_context_length)+' max':'—';
 /* Measured tool reliability, and the disagreement with the advertised flag where
    there is one. That mismatch is the most useful single fact in this data, so it
    is on the dashboard rather than buried a screen deep. */
 const toolCell=m=>{if(!m.measured)return `<span class="prov" data-kind="UNKNOWN">UNKNOWN</span>`;
  const [ok,n]=m.measured.tools,works=ok===n;
  /* Only a *known* advertisement can disagree with a measurement. Null is not
     a "no", and comparing against it manufactures a clash on every row. */
  const clash=m.tools_advertised!=null&&works!==m.tools_advertised;
  return `<span class="chip${warnUnless(works)}">${ok}/${n} tools</span>${clash?` <span class="prov" data-kind="ESTIMATED">claim says ${escapeHtml(m.tools_advertised?'yes':'no')}</span>`:''}`};
 $('#content').innerHTML=kpis([
   ['Loaded',`${loaded.length} / ${builds.length}`,'builds resident now'],
   ['Memory',resident.toFixed(1)+' GB',mc.model_budget_gb==null?'resident now · budget not detected':`of a ${mc.model_budget_gb} GB budget · ${mc.system_baseline_gb} GB baseline`],
   ['Fastest measured',fastest?String(fastest.measured.gen_tok_s):'—',
     fastest?`tok/s · ${fastest.family}`:'no throughput on this endpoint — see Results'],
   ['Evidence',`${measured.length} / ${builds.length}`,
     safe(`${prov('MEASURED')} n=${escapeHtml(rn.samples)} each`)]],'sirvis')
 /* `fromSirvis`, like the sibling cards on this screen. These two hardcoded
    ` live` and so rendered the eleven mock builds — a fictional catalogue — as
    a live read of what is installed on this machine. */

/* ── SIRVIS SCREENS ────────────────────────────────────────────────────────
   Every card body goes through cell(…,'sirvis'): SIRVIS owns all of it, so all
   of it can go absent at once, and none of it may quietly survive as a stale
   number when the lab is not answering. The recurring discipline on these pages
   is that a score is never allowed to travel alone — build, runtime config, role,
   sample count and spread go with it, because that tuple *is* the evidence and
   the median on its own is only a rumour about it. */

/* Models — installed builds. Identity here is family + variant + runtime +
   runtime config, never the family name. This machine has granite-4.0-h-tiny
   twice — once GGUF through llama.cpp, once MLX — and they are different subjects
   with different context ceilings and different evidence. */
/* One measured capability, as a chip.
   `null` is not a no. A measurement that was never taken and a measurement
   that came back negative are different facts, and the column says so — a
   dash for unknown, never a quiet "none". */
function toolChip(x){
 const t=x.measured&&x.measured.tools;
 if(!t)return{t:null,works:null,html:'<span class="prov" data-kind="UNKNOWN">UNKNOWN</span>'};
 const works=t[0]===t[1];
 return{t,works,html:`<span class="chip${warnUnless(works)}">${t[0]}/${t[1]}</span>`};
}

function advertisedChip(x){
 if(x.tools_advertised==null)return '<span class="mono" style="opacity:.35">—</span>';
 return x.tools_advertised
  ?'<span class="chip">tool_use</span>'
  :'<span class="mono" style="opacity:.35">none</span>';
}

/* One build's row. Split out of the table, where it measured cyclomatic
   complexity 16 inline — the highest remaining in the file, and entirely made
   of "this field may be absent" repeated across seven columns. */
function buildRow(x,contextLabel){
 const {t,works,html:measured}=toolChip(x);
 /* Only a known advertisement can clash with a measurement; null is not a no. */
 const clash=works!==null&&x.tools_advertised!=null&&works!==x.tools_advertised;
 const size=x.size_gb==null?'—':x.size_gb+' GB';
 return `<div class="table-row seven"><span>${escapeHtml(x.family)}</span><span class="mono">${escapeHtml(dash(x.variant))}</span><span class="mono">${escapeHtml(dash(x.runtime))} · ${escapeHtml(contextLabel(x.runtime_config))}</span><span>${advertisedChip(x)}${x.vision?' <span class="chip">vision</span>':''}</span><span${clash?' style="background:rgba(255,182,72,.08)"':''}>${measured}</span><span class="mono">${size}${escapeHtml(x.resident_gb?' / '+x.resident_gb:'')}</span><span class="chip${warnIf(x.state==='stopped')}">${escapeHtml(x.state)}</span></div>`;
}

async function sirvisModels(){
 heading('Installed builds','Identity is family, variant, runtime and runtime config — never the model name alone.',
  control('Runtime & sessions','loadModel'));
 const [m,mc]=await Promise.all([API.sirvis.models(),API.sirvis.machine()]);
 const loaded=m.items.filter(x=>x.state!=='stopped');
 const resident=loaded.reduce((n,x)=>n+(x.resident_gb||0),0);
 /* Two different context numbers, and conflating them is a real error: the
    ceiling is what the build supports, and context_length is what it was actually
    loaded with. Evidence is filed against the second one. */
 const K=n=>n==null?null:n>=1024?Math.round(n/1024)+'K':n;
 /* Both halves are nullable on the live payload: nothing is resident, so there
    is no loaded length, and `declared_context` is a Claim whose value is null
    whenever the runtime reported no maximum. Unguarded this rendered the
    literal string "null max". */
 const ctx=c=>{const on=K(c.context_length),max=K(c.max_context_length);
  return on?`${on} loaded${max?' · '+max+' max':''}`:max?`${max} max`:'—';};
 /* An installed-but-empty catalogue is a real state: LM Studio running with

 +`<div class="card full${escapeHtml(liveClass(m.live))}"><h3>Builds</h3>${cell(`

/* Discover — the model browser. SIRVIS.md §8 splits Models into Installed /
   Discover / Downloads, and this is the middle one: search a remote catalog,
   filter it, and queue a download as a persistent job.

   The filter state is module-level and the results repaint on their own, because
   re-running render() on every keystroke would rebuild #content and take the
   caret out of the search box with it. In the real build these three values are
   query parameters on /api/v1/catalog — the catalog is remote and much larger
   than one page of it, so filtering client-side is a property of the mock and not
   of the design. */
const DISCOVER={q:'',runtime:'all',installed:'all'};
function discoverFilter(items){
 const q=DISCOVER.q.trim().toLowerCase();
 return items.filter(x=>
  (DISCOVER.runtime==='all'||x.runtime===DISCOVER.runtime)
  &&(DISCOVER.installed==='all'||(DISCOVER.installed==='yes')===x.installed)
  &&(!q||`${x.family} ${x.variant} ${x.architecture} ${x.quantization} ${x.source}`.toLowerCase().includes(q)));}
/* One row. The disk arithmetic is SIRVIS.md §8's rule rendered per candidate:
   size against free space, and what is left afterwards — checked before the job
   is queued rather than discovered when the last byte fails to land. */
function discoverRows(items,free){
 if(!items.length)return `<div class="table-row"><span style="grid-column:1/-1;opacity:.6">no catalog entry matches these filters</span></div>`;
 return items.map(x=>{const after=+(free-x.size_gb).toFixed(1),tight=after<0||after<free*0.1;
  return `<div class="table-row seven"><span>${escapeHtml(x.family)}</span><span class="mono">${escapeHtml(x.variant)}</span><span class="mono" style="opacity:.75">${escapeHtml(x.runtime)} · ${escapeHtml(x.quantization)}</span><span>${x.params_b?x.params_b+' B':'<small style="opacity:.45">unknown</small>'}${x.tools_measured?` <span class="chip${warnUnless(x.tools)}" title="measured">${escapeHtml(x.tools_measured.join('/'))}</span>`:x.tools?' <span class="chip" title="published claim, not measured" style="opacity:.6">claims</span>':''}</span><span>${escapeHtml(x.size_gb)} GB</span><span class="mono"${tight?' style="color:#ffb648"':''}>${after<0?'does not fit':after+' GB left'}</span><span>${x.installed
   ?'<span class="chip">installed</span>'
   :(after<0?`<button class="btn" disabled title="insufficient disk" style="opacity:.45;cursor:not-allowed">Download</button>`:control('Download','download'))}</span></div>`}).join('')}
async function sirvisDiscover(){
 heading('Discover','Search the catalog, check it against this machine, and queue the download as a job.');
 const [cat,mc]=await Promise.all([API.sirvis.catalog(),API.sirvis.machine()]);
 const free=mc.disk_free_gb;
 const installed=cat.items.filter(x=>x.installed).length;
 const runtimes=[...new Set(cat.items.map(x=>x.runtime))];
 /* Repaints the result rows only, so the search field keeps focus and caret. */
 window.paintDiscover=()=>{const box=$('#discoverRows');if(!box)return;
  const hits=discoverFilter(cat.items);box.innerHTML=discoverRows(hits,free);
  $('#discoverCount').textContent=`${hits.length} of ${cat.items.length}`};
 const chip=(group,val,label)=>`<button class="mode-chip${DISCOVER[group]===val?' on':''}" onclick="DISCOVER.${group}='${jsAttr(val)}';selectOne(this,'[data-filter=${group}] .mode-chip');paintDiscover()">${label}</button>`;
 $('#content').innerHTML=kpis([
   ['Catalog',String(cat.items.length),'entries on this page','sirvis',false],
   ['Installed',`${installed} / ${cat.items.length}`,'already on disk','sirvis',false],
   /* The catalogue above is a stored transcription and `false` is correct for
      it. This one is not: the disk figure comes from SIRVIS's live machine
      read, and it is what decides whether a row can be downloaded at all. */
   ['Disk free',free+' GB',safe(stamp(SERVICES.sirvis.age)),'sirvis',mc.live],
   ['Smallest',Math.min(...cat.items.filter(x=>!x.installed).map(x=>x.size_gb))+' GB',
    'of what is not installed','sirvis',false]])
 +`<div class="card full"><h3>Catalog <span class="chip" id="discoverCount">${escapeHtml(cat.items.length)} of ${escapeHtml(cat.items.length)}</span></h3>${cell(`
   <div class="profile-row"><input id="discoverQ" placeholder="Search family, architecture, quantization or source…" style="flex:1;min-width:220px" oninput="DISCOVER.q=this.value;paintDiscover()">
    <span data-filter="runtime">${chip('runtime','all','Any runtime')}${runtimes.map(r=>chip('runtime',r,r)).join('')}</span>
    <span data-filter="installed">${chip('installed','all','Any state')}${chip('installed','no','Not installed')}${chip('installed','yes','Installed')}</span></div>
   <div class="table-row head seven"><span>Family</span><span>Variant</span><span>Runtime · quant</span><span>Params · tools</span><span>Size</span><span>Disk after</span><span>Action</span></div>
   <div id="discoverRows">${discoverRows(cat.items,free)}</div>
   <small class="mono dim">the disk check runs before the job is queued: ${free} GB free, and each row says what would be left. A build that does not fit cannot be started — SIRVIS never auto-deletes a model to make room for another one.<br>the tools column reads two different ways on purpose: an installed build shows <b>calls made / attempted</b> from a real run, and a catalogue entry shows <b>claims</b>, which is the publisher's word and nothing more. On this machine those two disagree about four builds, so the distinction is not pedantry.</small>
   ${explains('what a catalogue entry cannot tell you',`
   <div class="table-row head"><span>Question</span><span style="grid-column:2/-1">Answered by</span></div>
   <div class="table-row"><span>Will it download?</span><span style="grid-column:2/-1;opacity:.75">this page — size against ${free} GB of free disk</span></div>
   <div class="table-row"><span>Will it load?</span><span style="grid-column:2/-1;opacity:.75">a load attempt against ${escapeHtml(mc.memory_gb)} GB of memory on ${escapeHtml(mc.model||mc.chip||'this machine')}</span></div>
   <div class="table-row"><span>Will it be any good at your work?</span><span style="grid-column:2/-1;opacity:.75">a benchmark run, per role — nothing on this page predicts it</span></div>
   <div class="table-row"><span>Will it run alongside your other model?</span><span style="grid-column:2/-1;opacity:.75">a Runtime set measurement, which is a separate subject again</span></div>
   <small class="mono dim">file size is a fact about the disk, not about the machine. Parameter count and quantization are the two numbers most often used to guess the other three answers, and guessing them is exactly what SIRVIS exists to stop.</small>`)}`,'sirvis')}</div>
  
  <div class="card narrow"><h3>Sources</h3>${cell([...new Set(cat.items.map(x=>x.source))].map(s=>`

   +`<small class="mono dim">the catalog provider is a field, not an assumption: LM Studio's index first, others later. A build's source travels with it into the evidence record, because the same family from two publishers is not guaranteed to be the same weights.</small>`,'sirvis')}</div>`;

/* Benchmarks — the job queue. `state` is the closed contract enum consumers switch
   on; `detail` carries the internal phase and is display-only. A partial result is
   kept and labelled, because three good runs are evidence of something and
   throwing them away to keep the table tidy loses real measurement. */
/* How to actually run one, on the screen where somebody looks for it.
 
   The New benchmark button is correctly disabled: SIRVIS answers 404 for
   `/api/v1/benchmark-jobs` and advertises `sirvis.benchmarks.jobs` as
   unavailable until its M14 builds the queue. But "disabled with a stated
   reason" was satisfied by a tooltip naming an endpoint that does not exist,
   which tells a reader what is missing and not one thing about what to do —
   and a greyed-out primary button reads as broken whatever the tooltip says.
   Reported as "the benchmark button does not work", which is fair: from the
   outside, an honest dead end and a bug look the same.
 
   Benchmarks do run today, from the CLI, so the screen says how. */
/* Submit one, through SIRVIS's own queue (its M14).
   Uses the same token the Runtime screen holds, and the same `_send` — so a
   refusal arrives as SIRVIS's own words rather than as a generic failure. A
   benchmark needs the `benchmark` scope, which is not the `runtime` scope: §4.5
   separates them because they cost different things, so a runtime-only token is
   refused here and the message says which scope is missing. */
async function submitBenchmark(){
 const model=(($('#bmModel')||{}).value||'').trim();
 if(!model){notify('Name a model to benchmark');return}
 /* The same road the chat offer takes: one enumerated operation, one narrow
    credential, held by NERVIS and not by this tab. */
 const out=await runCommand('sirvis.benchmark.submit',model);
 notify(out.job?`Queued ${out.job.job_id}`:out.error);
 repaint();
}

async function cancelBenchmark(jobId){
 /* Through NERVIS, like the submit above it: cancelling needs the same
    `benchmark` scope, and this tab deliberately holds no token that has it. */
 const out=await runCommand('sirvis.benchmark.cancel',jobId);
 notify(out.job?`${out.job.job_id} is ${out.job.state}`:out.error);
 repaint();
}

function howToBenchmark(){
 return `<div class="card full"><h3>Running a benchmark</h3>

  <div style="margin:9px 0;display:flex;gap:7px;align-items:center">
   <input id="bmModel" class="mono" placeholder="model id to benchmark" style="flex:1;min-width:0;background:#0b1118;border:1px solid #2a3541;color:#cfe;border-radius:6px;padding:7px 9px">
  </div>
  <pre class="editor" style="margin-top:9px;white-space:pre-wrap">sirvis benchmark run sirvis/examples/basic.yaml --model &lt;model-id&gt;</pre>
  <small class="mono dim"><b>--clarvis-role clarvis-agent</b> runs Clarvis's own workload and the tool-call trials instead of the file's tests; <b>--runtime-set</b> measures every member of a set alone and then co-resident. Add <b>-y</b> to skip the confirmation before the model is loaded — a benchmark loads it for real, which is the whole point of the measurement.</small>
  </div>`;
}

   <small class="mono dim">the card stays rather than disappearing. <b>partial</b> is a state §11.10 names and this engine can reach — fewer runs than requested, the ones that completed kept — and an empty card says the state exists and has not occurred. A card that vanished would say the opposite by saying nothing.</small>`,'sirvis')}</div>`}

/* Runtime sets — combination evidence. The entire reason this screen exists is
   that per-member numbers do not predict the pair, and this run is the cleanest
   possible demonstration: memory behaved exactly as arithmetic predicted, and
   behaviour did not. A build that recovers correctly from a failed tool call when
   it is alone stopped calling the tool at all with a second model resident, in
   two different ways, and nothing in its solo record hints at it. */
/* What the pairing rows add up to.

   A follow-up outcome of null is *unmeasured*, not a failure: counting nulls as
   degradation would report every pairing as broken the moment the column lost
   its source. Lifted out of the screen with the same reasoning as `liveClass` —
   these are four readings of one table, not four decisions the screen makes. */
function pairingSummary(rs){
 const known=p=>(p.follow_up||[]).filter(f=>f!=null);
 const withPeak=rs.pairs.filter(p=>p.peak_gb!=null);
 return{known,
  degraded:rs.pairs.filter(p=>known(p).some(f=>f!=='used-result'&&f!=='never-reached')),
  anyFollowUp:rs.pairs.some(p=>known(p).length),
  heaviest:withPeak.length?withPeak.reduce((a,b)=>b.peak_gb>a.peak_gb?b:a):null};
}

/* SIRVIS answered and has nothing to show. Its own function, so the screen
   below keeps one job and stays inside the complexity ratchet. */
function noPairingsScreen(rs){
 return kpis([
   ['Pairings','0','none measured co-resident','sirvis',rs.live],
   ['Evidence','—','§11.3 needs a set and a run','sirvis',rs.live]])
  +`<div class="card full${escapeHtml(liveClass(rs.live))}"><h3>No measured pairing</h3>${cell(`
   <div class="trace-step"><b>SIRVIS says</b><span>${escapeHtml(rs.reason)}</span></div>
   <small class="mono dim">a Runtime Set is §10's versioned multi-model target, and a pairing is only real once §11.3 has run one — every member measured alone first as the control, then together. Nothing is estimated from the solo figures: this screen exists because per-member numbers <b>do not</b> predict the pair, and inventing a row from them would be the exact error it was built to demonstrate.</small>`,'sirvis')}</div>`;
}

/* Results — what the suite actually found, which includes what it failed to find.
   Two of the four accuracy measures did not discriminate at all, and saying so is
   the result: eight identical scores presented as a ranking would be a table that
   looks like evidence and contains none. */
/* Deleting one measurement.

   **Two steps, because this one does not come back.** A single button next to
   twelve rows of numbers is a button somebody presses while reading, so the
   first press only asks — it names what goes, what stays, and offers the reason
   that ends up on the tombstone. The second press is the one that acts.

   NERVIS makes the call, not this page. Deleting a result needs `admin` on
   SIRVIS, and a credential in a browser tab is a credential in every script
   that tab runs — so the page names a result and NERVIS, which holds the token,
   carries out the enumerated operation and audits it (§12). */
function deleteControl(r){
 const id=r.result_id;
 if(!id)return '';
 return `<div class="delete-row" id="del-${escapeHtml(id)}">
   <button class="btn danger" onclick="askDelete('${escapeHtml(id)}')">Delete this result</button>
   <small class="mono dim">removes the record from every surface and leaves a tombstone in its place. The run row and the raw takes on disk are kept.</small>
  </div>`}

/* The ask. Nothing has happened yet, and the wording says which parts are
   permanent — a confirmation that only says "are you sure" makes the reader
   guess at the scope of what they are agreeing to. */
function askDelete(id){
 const box=document.getElementById('del-'+id);
 if(!box)return;
 box.innerHTML=`<div class="delete-ask">
   <b>Delete this result permanently?</b>
   <small class="mono dim">the measurement goes — metrics, spread, provenance, validity notes. A tombstone keeps the fact that it existed, so RAVIS can tell a withdrawn measurement from one nobody took. The run and the raw takes stay on disk.</small>
   <input id="why-${escapeHtml(id)}" placeholder="why, for the tombstone — optional but the field nobody can reconstruct later">
   <div><button class="btn danger" onclick="confirmDelete('${escapeHtml(id)}')">Delete permanently</button>
   <button class="btn" onclick="sirvisResults()">Keep it</button></div>
  </div>`;
 const field=document.getElementById('why-'+id);
 if(field)field.focus()}

/* The act, and then a full re-read rather than a row removed from the DOM: the
   record count, the grouping, the rate spread and the bar chart are all derived
   from what SIRVIS holds, and patching one row would leave four summaries
   describing a result that is gone. */
async function confirmDelete(id){
 const box=document.getElementById('del-'+id);
 if(box)box.innerHTML='<small class="mono dim">deleting…</small>';
 const answer=await runCommand('sirvis.result.delete',id,
   (document.getElementById('why-'+id)||{}).value||'');
 if(answer.error){
  if(box)box.innerHTML=`<small class="mono" style="color:#ffb648">${escapeHtml(answer.error)}</small>
    <button class="btn" onclick="askDelete('${escapeHtml(id)}')">Try again</button>`;
  return}
 sirvisResults()}

/* What one benchmark result actually holds, under the row it made.

   Six columns are a summary of a record with far more in it, and every part
   below was already fetched and thrown away: the spread behind each median,
   the provenance of each axis, the trial's outcome tally, and the notes saying
   what the run could not measure. The last two are the ones worth clicking
   for — a 24/24 whose failures are all one kind is a different build from a
   24/24 that failed four different ways, and "no load time was measured
   because the model was already resident" is the difference between a warm
   number and a cold one. */
function resultDetail(g){
 const runs=g.runs||[g];
 if(!runs.some(r=>r.record))return '<div class="log-detail"><small class="mono dim">this row was adapted from a transcription, which carries no record behind it.</small></div>';
 return `<div class="log-detail">
  ${g.merged?`<small class="mono dim"><b>${escapeHtml(runs.length)} runs of this build.</b> The row above takes each column from the newest run that measured it, because the newest run did not measure all of them — each run below says what it took.</small>`
    :runs.length>1?`<small class="mono dim">${escapeHtml(runs.length)} runs of this build, newest first.</small>`:''}
  ${runs.map((e,i)=>runBlock(e,g,runs.length>1,i)).join('')}
 </div>`}

/* One run inside a build. Collapsed when there is more than one, because the
   point of grouping was to stop four runs of one build filling the screen —
   and re-expanding all four inside the group would put them back. */
function runBlock(e,group,grouped,index){
 const body=runFacts(e,group);
 if(!grouped)return body;
 const r=e.record||{};
 return `<details class="log-line run-line"${index?'':' open'}><summary class="run-head">
   <span class="mono">${escapeHtml(r.role||'—')}</span>
   <span class="mono dim">${escapeHtml((r.suite||{}).id||'')}</span>
   <span class="mono dim">${escapeHtml(runContext(e))}</span>
   <span class="mono dim">${escapeHtml(e.measured_at||'')}</span></summary>${body}</details>`}

/* The context this run loaded the build with, where it was recorded. It sits on
   the run rather than the build for the same reason role does: it is what the
   run chose, and two runs of one build at 8K and at 118K are not the same
   measurement. */
function runContext(e){
 const c=((e.record||{}).target||{}).runtime_config||{};
 return c.context_length?Math.round(c.context_length/1024)+'K ctx':''}

/* Two columns. These are short label-and-value pairs, and one per full-width
   row turned thirteen facts into a page of scrolling. */
function runFacts(e,group){
 const r=e.record;
 if(!r)return '<small class="mono dim">no record behind this run.</small>';
 const t=r.target||{},suite=r.suite||{};
 const facts=[
  ['family',t.model_family],['format',t.format],
  ['quantization',t.quantization],['runtime',t.runtime],
  ['runtime version',t.runtime_version],['context',(t.runtime_config||{}).context_length],
  ['role',r.role],['suite',suite.id?suite.id+' v'+suite.version:''],
  ['samples',r.samples],['measured',r.measured_at||r.created_at],
  ['evidence',r.evidence_id],['result',r.result_id],
  ['sirvis',r.sirvis_version]];
 return `<div class="fact-grid">${facts.filter(([,v])=>v!==null&&v!==undefined&&v!=='')
    .map(([k,v])=>`<div class="trace-step"><b>${escapeHtml(k)}</b><span class="mono">${escapeHtml(String(v))}</span></div>`).join('')}</div>
  ${columnsFrom(e,group)}
  ${deleteControl(r)}
  ${validityBlock(r)}
  ${measureTable(r.metrics||{})}
  ${trialBlocks(r.metrics||{})}`}

/* Which columns of the row above came from this run. Only on a merged row,
   where the question "where did that number come from" has more than one
   answer. */
function columnsFrom(e,group){
 if(!group||!group.merged)return '';
 const mine=Object.entries(group.from||{}).filter(([,id])=>id===e.evidence_id).map(([k])=>k);
 return mine.length
  ?`<div class="trace-step"><b>row above</b><span class="mono">${escapeHtml(mine.join(' · '))}</span></div>`
  :'<div class="trace-step"><b>row above</b><span class="dim">nothing — every column had a newer measurement</span></div>'}

/* Validity first, because it changes how every number under it reads. */
function validityBlock(r){
 const notes=r.validity_notes||[];
 if(!r.validity&&!notes.length)return '';
 return `<div class="trace-step"><b>validity</b><span class="${r.validity==='VALID'?'chip':'chip warn'}">${escapeHtml(r.validity||'unknown')}</span></div>
  ${notes.map(n=>`<p class="mono dim">— ${escapeHtml(n)}</p>`).join('')}`}

/* The spread, not just the median. A median with a 15–30 tok/s range behind it
   is a different claim from one with a 24–25 range, and the table above has
   room for exactly one number. */
function measureTable(metrics){
 const rows=Object.entries(metrics).filter(([,b])=>b&&b.median!==undefined);
 if(!rows.length)return '';
 return `<div class="table-row head five" style="margin-top:6px"><span>Axis</span><span>Median</span><span>Range</span><span>p10–p90</span><span>How</span></div>
  ${rows.map(([name,b])=>`<div class="table-row five"><span class="mono">${escapeHtml(name)}</span>
   <span class="mono">${escapeHtml(round(b.median))}</span>
   <span class="mono dim">${escapeHtml(round(b.min))} – ${escapeHtml(round(b.max))}</span>
   <span class="mono dim">${escapeHtml(round(b.p10))} – ${escapeHtml(round(b.p90))}</span>
   <span>${prov((b.provenance||{}).kind||'UNKNOWN')} <small class="mono dim">${escapeHtml((b.provenance||{}).method||'')}</small></span></div>`).join('')}
  <small class="mono dim">a record is <b>partly measured</b> when its axes disagree about their own provenance — the kinds in the last column are where that comes from, and the one that is not MEASURED is the reason.</small>`}

/* Trials are counted, not averaged: §13.2. Eight phrasings times three
   repetitions is the shape, and the tally says how the failures failed —
   which is the difference between a build that declines to call a tool and one
   that calls it with empty arguments. */
function trialBlocks(metrics){
 const trials=Object.entries(metrics).filter(([,b])=>b&&b.total!==undefined&&b.passed!==undefined);
 return trials.map(([name,b])=>{
  const outcomes=Object.entries(b.outcomes||{});
  return `<div class="trace-step"><b>${escapeHtml(name)}</b><span class="mono">${escapeHtml(b.passed)}/${escapeHtml(b.total)}${b.phrasings?` · ${escapeHtml(b.phrasings)} phrasing(s) × ${escapeHtml(b.repetitions)} repetition(s)`:''}</span></div>
   ${outcomes.length?`<p class="mono dim">${outcomes.map(([k,n])=>`${escapeHtml(k)} <b>${escapeHtml(n)}</b>`).join(' · ')}</p>`:''}
   ${(b.provenance||{}).notes?`<p class="mono dim">— ${escapeHtml(b.provenance.notes)}</p>`:''}`}).join('')}

/* Two decimals, and only where they mean something. */
function round(v){
 if(v===null||v===undefined)return '—';
 if(typeof v!=='number')return String(v);
 return String(Math.abs(v)>=100?Math.round(v):Math.round(v*100)/100)}

/* One row per build, not per run — a build benchmarked four times is one thing
   measured four times, and four rows of it push the twenty other builds off
   the screen. The runs are kept whole underneath.

   Grouped on the build, which is §12.2's identity minus what a run chooses:
   family, format, quantization and runtime. Role, suite and context length are
   *of the run*, so they belong to the rows inside rather than to the build. */
function groupRuns(items){
 const groups=new Map();
 for(const e of items){
  const key=[e.target.family,e.target.variant,e.target.runtime].join('|');
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(e)}
 return [...groups.values()].map(mergeRuns)}

/* Each column from the newest run that measured it — not from the newest run.

   The difference is a real row on this machine: granite's most recent run is a
   throughput suite with no tool trial in it, and the run that put 24/24 on the
   board is a week older. Taking every column from the newest would have shown
   that build as having no tool evidence at all, which is the failure this whole
   screen keeps having. Mixing runs in one row is only honest if the row says
   so, so a merged row carries its run count and every column names the run it
   came from in the detail below. */
function mergeRuns(runs){
 const newest=runs[0],metrics={},from={};
 for(const name of ['generation_tok_s','effective_tok_s','first_token_s','tool_calls','follow_up']){
  const source=runs.find(r=>r.metrics[name]!=null&&r.metrics[name]!=='');
  if(source){metrics[name]=source.metrics[name];from[name]=source.evidence_id}}
 return {...newest,metrics,runs,from,
         merged:runs.length>1&&new Set(Object.values(from)).size>1}}

/* The Results table sorts in the browser over the records already fetched. A
   column click is a question about the same evidence, not a reason to read it
   again — a refetch would let rows move for reasons that have nothing to do
   with the column that was clicked. */
const RESULT_COLUMNS=[
 ['build','Build',e=>e.target.family+' '+e.target.variant],
 ['rate','Generating',e=>e.metrics.generation_tok_s],
 ['effective','Effective',e=>e.metrics.effective_tok_s],
 ['first','First token',e=>e.metrics.first_token_s],
 /* Sorted as a rate, not as the count: 21/24 beats 3/8, and a column that
    ordered by passes alone would put the worse build on top. */
 ['tools','Tools',e=>e.metrics.tool_calls?e.metrics.tool_calls[0]/e.metrics.tool_calls[1]:null],
 ['follow','Follow-up',e=>e.metrics.follow_up]];
let RESULTS={items:[],key:'rate',dir:-1,row:()=>''};

/* Records with nothing in the sorted column go to the bottom in *both*
   directions rather than to whichever end the arithmetic puts them. They stay
   on the table — a build that produced no output is a result — but reversing
   a column must not promote a blank to the top of it. */
function resultOrder(){
 const col=RESULT_COLUMNS.find(c=>c[0]===RESULTS.key)||RESULT_COLUMNS[1],read=col[2];
 const seen=[],absent=[];
 RESULTS.items.forEach(e=>{const v=read(e);(v==null||v===''?absent:seen).push(e)});
 seen.sort((a,b)=>{const x=read(a),y=read(b);
   return RESULTS.dir*(typeof x==='string'?x.localeCompare(y):x-y)});
 return seen.concat(absent)}

/* Text reads best ascending and every measure best descending, so a first
   click on a column opens it the way that column is worth reading; clicking
   the one already sorted reverses it. */
function sortResults(key){
 RESULTS.dir=RESULTS.key===key?-RESULTS.dir:(key==='build'||key==='follow'?1:-1);
 RESULTS.key=key;
 $('#result-head').innerHTML=RESULTS.head();
 $('#result-rows').innerHTML=resultOrder().map(RESULTS.row).join('')}

async function sirvisResults(){
 const [ev,rn]=await Promise.all([API.sirvis.evidence(),API.sirvis.runs()]);
 /* Which SIRVIS answered is part of the result, not a footnote. A screen that
    looks identical whether it is showing this machine or a transcription of an
    older run is the one way this page could lie without a wrong number in it. */
 heading('Results',ev.source==='live'
   ?'Live from SIRVIS on this machine. Rate and first token are measured; the accuracy suites are not built yet.'
   :'Rate, first token and behaviour. Two of the four accuracy measures found no difference at all — that is a result.');
 /* PARTIALLY_MEASURED belongs on this table. The kind means *some axes
    measured, some not*, which is exactly what a tool-call trial is — it counts
    calls and measures nothing else — so filtering on MEASURED alone hid every
    trial ever run behind a screen whose whole subject is what the suite found.
    The two gemma builds this page exists to compare were both invisible here.
    They are marked rather than flattened: each row carries its own kind. */
 const m=ev.items.filter(e=>e.evidence_type==='MEASURED'||e.evidence_type==='PARTIALLY_MEASURED');
 const partly=m.filter(e=>e.evidence_type==='PARTIALLY_MEASURED');
 /* The default order: by rate, then the builds that have no rate — appended
    rather than filtered out. A build that produced no visible output is a result, and
    dropping it from the table because it has no bar to draw would turn the
    worst outcome in the run into a blank space nobody counts. */
 const builds=groupRuns(m);
 const withRate=builds.filter(e=>e.metrics.generation_tok_s).sort((a,b)=>b.metrics.generation_tok_s-a.metrics.generation_tok_s);
 const noRate=builds.filter(e=>!e.metrics.generation_tok_s);
 const rated=[...withRate,...noRate];
 const top=withRate[0],caveats=m.filter(e=>e.caveat);
 const warned=m.filter(e=>e.warnings&&e.warnings.length);
 const fastLine=e=>e.metrics.first_token_s!=null?e.metrics.first_token_s+'s':'—';
 /* A record either carries a capability measure or it does not, and the two
    live side by side once a live run sits next to a transcribed one. */
 const carrying=n=>m.filter(e=>e.metrics[n]);
 /* Only for a build with a single run. Once runs are grouped the context
    belongs to the run — two runs of one build at 8K and 118K are two different
    measurements — so it is printed on the run heads inside, and the row says
    how many runs there are instead.

    Kept for the single-run case, where it is still the field that explains two
    rows that otherwise look identical. Two rows for a build are not a duplicate — the runtime loaded it
    differently, which §12.2 makes a different identity and a different result —
    but two rows that *look* identical and disagree read as a bug, and the field
    that explains them is the one nobody thought to print. */
 const contexts={};m.forEach(e=>{const k=e.target.family+e.target.variant;
   (contexts[k]=contexts[k]||new Set()).add((e.target.runtime_config||{}).context_length)});
 const ctx=e=>{const c=(e.target.runtime_config||{}).context_length;
   return c&&contexts[e.target.family+e.target.variant].size>1
     ? ' · '+Math.round(c/1024)+'K ctx' : ''};
 const consistent=(e,n)=>e.metrics[n]&&e.metrics[n][0]===e.metrics[n][1];
 /* One row, drawn by a function rather than an inline template, because a
    column click repaints the rows without refetching and both paths have to

    readable as one. */
 const resultRow=e=>`<details class="log-line"><summary class="table-row six"><span>${escapeHtml(e.target.family)} <small class="mono" style="opacity:.5">${escapeHtml(e.target.variant)}${e.runs&&e.runs.length>1?` · ${e.runs.length} runs`:ctx(e)}</small>${e.evidence_type==='PARTIALLY_MEASURED'?prov(e.evidence_type):''}</span><span class="mono">${e.metrics.generation_tok_s?e.metrics.generation_tok_s+' tok/s':'<span style="color:#ffb648">no output</span>'}</span><span class="mono">${escapeHtml(dash(e.metrics.effective_tok_s))}</span><span class="mono">${fastLine(e)}</span><span class="mono"${e.metrics.tool_calls&&!consistent(e,'tool_calls')?' style="color:#ffb648"':''}>${e.metrics.tool_calls?e.metrics.tool_calls.join('/'):'<span class="dim">—</span>'}</span><span class="${e.metrics.follow_up?'chip'+(e.metrics.follow_up==='used-result'?'':' warn'):'dim'}">${escapeHtml(dash(e.metrics.follow_up))}</span></summary>${resultDetail(e)}</details>`;
 /* Held for the sort, which is a question about these records rather than a
    reason to read them again. */
 RESULTS={items:rated,key:'rate',dir:-1,row:resultRow,head:()=>resultHead()};
 const resultHead=()=>RESULT_COLUMNS.map(([k,label])=>`<span class="sortable${RESULTS.key===k?' sorted':''}" onclick="sortResults('${k}')">${label}${RESULTS.key===k?(RESULTS.dir<0?' \u2193':' \u2191'):''}</span>`).join('');
 $('#content').innerHTML=kpis([
   /* Two numbers, because they are two different claims. A partly measured
      record is a real measurement of the axes it took and silent about the
      rest, and rolling it into one "measured" tally would overstate what the
      suite has actually covered. */
   /* Builds, then runs. The table has one row per build and the two numbers
      differ whenever anything was measured twice, so printing only the record
      count would make the row count look wrong. */
   ['Builds',String(builds.length),`${m.length} run${m.length===1?'':'s'}${partly.length?` · ${partly.length} partly measured`:''}`,'sirvis'],
   ['Rate spread',withRate.length?`${withRate[withRate.length-1].metrics.generation_tok_s}–${top.metrics.generation_tok_s}`:'—',`tok/s · ${noRate.length} produced none`,'sirvis'],
   /* Absent, not zero. `0 / 0` reads as "measured and found nothing"; the
      truth is that no suite here measures tool calls yet (M13) or code (M18),

   ['Tool calls',carrying('tool_calls').length?`${carrying('tool_calls').filter(e=>consistent(e,'tool_calls')).length} / ${carrying('tool_calls').length}`:'—',

 /* `ev.source`, for the reason the Evidence screen documents: the fetch has
     always reported whether SIRVIS answered and the card never read it. */
 +`<div class="card full${escapeHtml(liveClass(ev.source==='live'))}"><h3>Generation rate</h3>${cell(`
   <div class="benchmark-stage" style="height:170px;gap:7px">${withRate.map(e=>`<i style="--h:${escapeHtml(Math.round(e.metrics.generation_tok_s/top.metrics.generation_tok_s*100))}%" title="${escapeHtml(e.target.family)} · ${escapeHtml(e.metrics.generation_tok_s)} tok/s"></i>`).join('')}${noRate.map(e=>`<i style="--h:2%;opacity:.35" title="${escapeHtml(e.target.family)} · no visible output"></i>`).join('')}</div>
   <!-- The same scroller the Models list uses: the head stays put, the box is
        resizable, and ninety records no longer push every explanation on this
        card below the fold. -->
   <div class="scroller" style="--rows:12" tabindex="0">
   <div class="table-row head six" id="result-head">${resultHead()}</div>
   <div id="result-rows">${rated.map(resultRow).join('')}</div></div>
   <small class="mono dim"><b>Generating</b> is the sustained rate once the model is talking. <b>Effective</b> counts from the request being sent, so it carries prompt processing and any preamble before visible content. The distinction exists because a rejected build had a healthy generating rate and <b>27 seconds</b> of silence in front of it, and a table with only the first column would have recommended it.${m.some(e=>e.metrics.effective_tok_s)?' Here the two are within about 5% everywhere, which is itself the finding — none of these front-load.':' <b>The effective column is empty on every live record, and that is the honest cell rather than a gap.</b> An effective rate is a token count over the total latency, and SIRVIS\'s evidence envelope publishes the <i>rate</i> and the latency but never the count — so the only way to fill this column from what SIRVIS actually says would be to reconstruct the count from three separate medians and print the result as a measurement. It stays here because the moment SIRVIS publishes a count it fills in, and because a column that quietly disappeared would take the question with it.'}</small>
   ${explains('what a run detail keeps',`
   <div class="trace-step"><b>samples</b><span>${escapeHtml(rn.samples)} · median reported</span></div>
   <div class="trace-step"><b>warmups</b><span>${escapeHtml(rn.warmups)} · discarded</span></div>
   <div class="trace-step"><b>parallel</b><span>${escapeHtml(rn.parallel)}</span></div>
   <div class="trace-step"><b>raw takes</b><span>${escapeHtml(rn.raw_runs)}</span></div>
   <small class="mono dim">${rn.source==='live'?`the takes are kept beside the run at <b>${escapeHtml(rn.raw_runs)}</b> — this card names them rather than drawing bars it would have to fetch. <b>No control re-measurement:</b> a control is a property of a sweep, not of one run, and this engine records runs. Today's sweep bracketed itself with one and the two ends came back 26% apart, which is the number this card would otherwise be quietly missing.`:`SIRVIS has recorded no benchmark run, so there is nothing to show here yet. Run one from the Benchmarks screen and this card fills in with the takes, the medians and the control comparison for that run.`}</small>`)}
`,'sirvis')}</div>
  
  
  <!-- Keyed on ev.source, as the two cards above it already are. These rows

  <div class="card full${escapeHtml(liveClass(ev.source==='live'))}"><h3>What the automated scoring missed</h3>${cell(`

 +`<div class="card full${escapeHtml(liveClass(r.live))}"><h3>Ranked</h3>${cell(`<div class="route-lanes">${r.ranked.map(x=>`

   <small class="mono dim">no score column here either. The ranking is an argument made from measurements — rate, first token, tool reliability, recovery behaviour — and the argument is written out per row so it can be disagreed with. A single number would be easier to sort and impossible to check.</small>
