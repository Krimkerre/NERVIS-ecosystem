async function clarvisDiagnosticsView(){
 heading('Diagnostics','What each registered editor window is doing — read, never driven.');
 const inst=await API.nervis.clarvisInstances();
 const windows=inst.items||[];
 const sections=`<div class="card full">${cell(diagSections(),'nervis')}</div>`;
 if(!windows.length){$('#content').innerHTML=sections+clarvisNoWindows(inst.live);return}

 /* A selection that points at a window which has since closed is dropped rather
    than carried: it would 404 on every repaint, and the reader would be looking
    at an error instead of the window that is actually open. */
 if(!windows.some(w=>w.instance_id===CLARVIS_WINDOW))CLARVIS_WINDOW=windows[0].instance_id;
 const d=await API.nervis.clarvisDiagnostics(CLARVIS_WINDOW);
 const tabs=clarvisWindowTabs(windows,CLARVIS_WINDOW);

 if(!d.live){
  /* `d.live` is false here, and the class says so rather than the card simply
     not carrying one — the read failed, and that is a reading. */
  $('#content').innerHTML=sections+`<div class="card full${liveClass(d.live)}"><h3>Clarvis</h3>${cell(
   tabs+banner('That window could not be read',escapeHtml(d.reason||'')+'.','warn'),'clarvis')}</div>`;
  return;
 }

 /* Every card below is drawn from the one read that just succeeded, so they
    carry the same liveness the window card does rather than asserting it. */
 const on=liveClass(d.live);
 $('#content').innerHTML=sections+clarvisWindowCard(d,tabs)+clarvisGateCard(d.gate,on)+`
  <div class="card half${on}"><h3>Agent run</h3>${clarvisRunCard(d.agent_run)}</div>
  <div class="card half${on}"><h3>Tasks</h3>${cell(clarvisTaskRows(d.tasks||[]),'clarvis')}</div>
  <div class="card full${on}"><h3>Recent events
    <span class="chip">${escapeHtml(d.event_count||0)}</span></h3>${cell(
   clarvisEventRows(d.events||[]),'clarvis')}
   <small class="mono dim"><b>NERVIS reads Clarvis; it never drives it.</b> Everything on this screen
   was published by the editor window itself — the registry row it claimed, its own
   <code>/v1/status</code>, and the events it forwarded. <b>Nothing is stored as NERVIS's own copy</b>:
   a kept copy of "the agent is running" outlives the run and is indistinguishable from the truth
   until it is wrong. <b>Windows never merge</b> — events are selected by the window that sent them,
   so a quiet editor shows nothing rather than its neighbour's activity.</small></div>`;
}

async function clarvis(){
 /* **No `heading()` here, deliberately.** Every other screen opens with one; this
    one is a full-bleed editor, and a hero with an avatar above it made the tab a
    page about code-server rather than code-server. What the heading used to say —
    the address, and that NERVIS only observes — is on the strip below and in the
    note under the frame, where it is next to the thing it describes.

    `#pageTitle` still needs clearing, or the previous screen's title survives
    behind the hidden header and comes back on the next tab switch. */
 $('#pageTitle').textContent='Clarvis';
 $('#pageSubtitle').textContent='';
 $('#pageActions').innerHTML='';

 /* Both reads, and both are real. `services()` says whether there is an editor to
    embed at all; `clarvisInstances()` says what the extension inside it is doing.
    They answer different questions and either can be absent without the other. */
 const [svc,inst]=await Promise.all([API.nervis.services(),API.nervis.clarvisInstances()]);
 const editor=svc.items.find(x=>x.key==='codeserver');
 const windows=(inst.items||[]).filter(c=>c.live);

 /* The Bridge is optional by design: Clarvis activates and dies with its editor
    window and never depends on NERVIS. Its absence costs NERVIS visibility, not
    Clarvis function — so it is a note above the frame, never a reason to hide it. */
 const bridge=windows.length?'':banner('No Clarvis Bridge has registered',
  'The editor below still works. NERVIS cannot read what this workspace is doing until a '
  +'window registers — turn on <b>clarvis.bridge.enabled</b> in its settings.','info');

 /* **The frame is only drawn when something answered.** An <iframe> pointed at a
    port with nothing on it renders a browser error page inside the dashboard,
    which reads as NERVIS being broken rather than as code-server being absent. */
 if(!editor||!['healthy','degraded'].includes(editor.state)){
  $('#content').innerHTML=bridge+banner('No editor to embed',
   `NERVIS looked for code-server at <b>${escapeHtml((editor&&editor.endpoint)||'its configured address')}</b> `
   +`and found ${escapeHtml(editor?REASON[editor.state]||editor.state:'no configured address')}. `
   +'Start it and this tab becomes the editor; nothing else on the dashboard depends on it.','info');
  return;
 }

 /* **Nothing of NERVIS's between the tab bar and the editor.** There was a strip
    here carrying the framed address, a Bridge chip and an "Open separately"
    link. It went because it was the same class of thing as the hero header and
    the side nav: NERVIS chrome stacked on top of an application that has its
    own. The tab is the editor.

    What it carried is not lost, only moved to where it was already better said.
    The address and each window's state are on the Overview's Clarvis instances
    card, which is the screen whose subject they are. The editor's own address is
    the user's own configuration. And the framing fallback §7.3 asks for — open
    it in a tab of its own — is a URL they already have; a permanent link on
    every visit is a heavy way to carry an escape hatch for a case that has not
    happened. If framing ever does break, the honest banner above is what the
    reader gets, and it names the address. */
 const gate=workbenchGate(editor);
 if(gate.blocked){$('#content').innerHTML=bridge+gate.notice;return;}

 $('#content').innerHTML=bridge+gate.notice+`<iframe id="clarvis-frame" class="code-frame"
   src="${escapeHtml(editor.endpoint)}" title="code-server"></iframe>`;
}

/* **Stage 9's second exit clause: unsupported combinations are blocked here.**
   The matrix graded exactly one code-server, and a `PASS` on that one says
   nothing about a version nobody ran. The answer arrives as an ordinary
   capability state rather than a field invented for this screen, so blocking
   reads the same mechanism every other capability does — and carries the same
   mandatory reason, which is the part worth showing.

   Blocked means blocked: the caller draws no frame at all. Embedding an untested
   editor behind a warning would leave the reader looking at something that
   appears to work right up until the moment it does not.

   Its own function because the Clarvis view was at the complexity ratchet
   already, and two more branches took it over. */
function workbenchGate(editor){
 const state=(editor.capabilities||{})['codeserver.workbench']||'';
 const why=escapeHtml((editor.capability_reasons||{})['codeserver.workbench']||'');
 if(state==='unavailable')return{blocked:true,notice:banner('This code-server was never tested',
  why+' Nothing else on the dashboard depends on this tab, and the editor is still reachable at '
  +`<b>${escapeHtml(editor.endpoint)}</b> in a tab of its own.`,'warn')};
 /* Untested but not refused. The reason says *which way* it is untested — newer
    than the graded version, or a version NERVIS could not read — because those
    are different situations and only one of them is the user's to fix. */
 if(state==='degraded')return{blocked:false,notice:banner('Untested code-server',why,'info')};
 return{blocked:false,notice:''};
}

/* async because the views await real endpoints. With mocks these resolve on the
   same tick, so nothing changes today — and nothing changes when they stop being
   mocks either, which is the point. */

/* Screens safe to repaint under the poll: pure display, no input to lose.

   Chat has a half-typed message, Settings has toggles somebody is mid-way
   through, and the service dashboards have popovers that a rebuild would close.
   Repainting those on a timer would be a worse bug than the stale reading it
   fixes, so the list is an allowlist rather than an exclusion — a screen added
   later is not live until somebody says it is. */
/* Events joins the live views: it is a feed, and a feed that only updated when
   somebody navigated is a list of what had happened by the time they last
   clicked. Its filter inputs live in `EVENT_FILTERS` rather than the DOM, so a
   repaint cannot lose half-typed text. */
const LIVE_VIEWS={nervis:['Overview','Ecosystem map','System','Events']};

/* How often the dashboard re-reads the registry. NERVIS itself probes every 20
   seconds, so anything faster only re-reads the same answer; anything much
   slower makes the bar wrong for longer than it takes somebody to notice. */
const POLL_MS=8000;

/* Editor windows currently blocked on the user, and for how long.

   **The only thing on this dashboard that asks the reader for something.** Every
   other line reports; this one says an agent stopped and is waiting on a person
   who may be looking at a different tab, or a different window, or nothing at
   all. That case is the whole reason the Bridge exists — everything else it
   publishes can be read faster by looking at the editor.

   Read here rather than folded into `/api/v1/registry/instances`, which is drawn
   on every poll and deliberately cheap: one status read per live window, and
   only when there are live windows. With no Bridge registered this makes no
   requests at all.

   `Promise.all` is safe because NERVIS's status route never rejects — every
   failure comes back as a state. A window it could not reach reports `unknown`
   and is not counted as waiting, because "I could not read it" is not "it needs
   you". */
let WAITING = [];

async function pollGates(){
 try{
  const r=await fetch(BASE.nervis+'/api/v1/registry/instances',
    {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!r.ok){WAITING=[];return}
  const live=((await r.json()).items||[]).filter(one=>one.live);
  if(!live.length){WAITING=[];return}
  const read=await Promise.all(live.map(async one=>{
   try{
    const s=await fetch(BASE.nervis+'/api/v1/registry/instances/clarvis/'
      +encodeURIComponent(one.instance_id)+'/status',
      {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
    return s.ok?{...await s.json(),label:one.label}:null;
   }catch(e){return null}
  }));
  WAITING=read.filter(one=>one&&one.state==='waiting_for_approval');
 }catch(e){WAITING=[]}
}

async function pollRegistry(){
 /* The status bar's own source, independent of whatever screen is open.

    Before this, the bar was only as fresh as the last navigation — open LM
    Studio and nothing changed until you clicked something, and even then the
    bar lagged the table beneath it by one paint. M1's exit says the dashboard
    updates live and this is the half that was missing. */
 /* Voice settings alongside the registry, on the same timer.

    **They were only ever loaded by the chat screen**, so on Overview or Traces
    `SPEECH.settings` was null: the mute pip could not draw and the announcer
    could not fire — which is the whole of what "tell me even when I am not on
    the chat tab" asks for. Re-read rather than read once, because §18.2 wants
    mute honoured immediately and a second tab holding a stale "not muted"
    would talk after somebody silenced it here. One small local request every
    eight seconds, beside one that was already happening. */
 await SPEECH.load();
 paintVoicePip();
 try{
  const r=await fetch(BASE.nervis+'/api/v1/services',{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!r.ok)return;
  absorbRegistry(await r.json());
 }catch(e){
  /* NERVIS itself is not answering. The bar keeps its last reading rather than
     blanking: "I cannot reach the registry" is not "everything is down", and
     the age stamp beside it is what stops the difference being invisible. */
  return;
 }
 globalStatus();
 const live=(LIVE_VIEWS[state.app]||[]).includes(state.view);
 /* Not while a popover is open: a rebuild would close it under the cursor.
    Not while somebody is typing, for the same reason one level up. */
 if(document.querySelector('.route-pop')||editing())return;
 if(REGISTRY_CHANGED)RECOVER_TRIES=0;
 const recover=recoverable()&&RECOVER_TRIES<RECOVER_LIMIT;
 if(!live&&!REGISTRY_CHANGED&&!recover)return;
 /* Cleared only once the repaint is actually happening, so a transition that
    arrives while a popover is open or a field is focused is repainted at the
    next poll rather than dropped. */
 REGISTRY_CHANGED=false;
 if(recover)RECOVER_TRIES+=1;
 await repaint();
}

/* ── WHAT SURVIVES A RE-RENDER ─────────────────────────────────────────────
   §25.2: "Each view replaces the whole content region. Correct for a static
   prototype; wrong once an event stream drives it, because every event would
   rebuild the DOM and discard scroll position, focus, selection and any open
   control."

   That is now the ordinary case rather than a future one: the registry poll
   repaints on a transition, the recovery path repaints up to three more times,
   and the event stream repaints the Events screen whenever the hub says
   something. Meanwhile the things a reader is in the middle of live only in the
   DOM — the RAVIS Credentials fields carry no `value=` and no backing state, so
   a pasted API key exists nowhere else until Save is pressed, and any repaint
   between the paste and the press throws it away.

   **Preserve and restore rather than diff.** A keyed reconciler is the right
   answer for a framework and the wrong one to graft onto eight thousand lines
   of template literals: every view would have to be rewritten to describe its
   own identity before a single screen worked. This keeps the full re-render —
   which is simple, and which every screen already assumes — and makes the
   interaction survive it. It is bounded, it needed no view rewritten, and it
   covers the four things §25.2 actually lists.

   **Only what the reader touched.** Restoring every field would fight the
   screen: a form that was just saved and cleared would be un-cleared on the
   next repaint. A field is remembered from the moment somebody types in it and
   forgotten when they leave the screen, so a repaint cannot undo a save and
   navigating away cannot resurrect a draft. */
const TOUCHED=new Map();
addEventListener('input',event=>{
 const el=event.target;
 if(el&&el.id)TOUCHED.set(el.id,el.type==='checkbox'?el.checked:el.value);
},true);

/* What the reader is in the middle of, as plain values.
   Read before the content region is replaced; every handle is an id, because an
   element reference does not survive the thing this exists to survive. */
function captureInteraction(){

  y:window.scrollY,
  focus:active&&active.id?active.id:'',
  start:active&&active.selectionStart!=null?active.selectionStart:null,
  end:active&&active.selectionEnd!=null?active.selectionEnd:null,
  /* Disclosures, by id. `<details class="explains">` appears at twenty call

/* The caret, not just the element. Focus alone puts the cursor at the end, so a
   repaint while somebody is editing the middle of a value jumps them to the end

   being reportable as a bug. */
function restoreFocus(was){
 const el=was.focus?document.getElementById(was.focus):null;
 if(!el||typeof el.focus!=='function')return;

 try{el.setSelectionRange(was.start,was.end)}catch(e){/* not a text input */}

/* Values the reader typed, put back into the fields they were typed into. */
function restoreTyping(){

function restoreInteraction(was){
 restoreTyping();
 for(const id of was.open){const el=document.getElementById(id);if(el)el.open=true}
 for(const id of was.shown){const el=document.getElementById(id);if(el)el.style.display=''}

    they had open, typed, scrolled or selected. */

/* Place an opened routing popover, and keep only one open.

   `<details>` supplies the toggle, the keyboard handling and Escape; what it
   cannot do is escape a scrolling ancestor, so the panel is `position:fixed`
   and gets its coordinates here. It flips above the marker when there is not
   room below, and is clamped to the viewport so a bubble near the right edge
   does not push it off screen. */
function placeRoutePopover(details){
 const pop=details.querySelector('.route-pop');
 const mark=details.querySelector('summary');
 if(!pop||!mark)return;
 /* Anchored without ever measuring the panel.

    Reading `offsetHeight` here proved unreliable — the panel is measured while
    still mid-flow and reports a height it will not have once positioned, which
    put it off the bottom of the screen. So the two cases are expressed with the
    edge that is actually known: opening downward pins `top` to the marker's
    bottom, opening upward pins `bottom` to the marker's top. Neither needs to
    know how tall the panel is, and `max-height` is set to the space that
    remains so it can never overrun whichever way it opened.

    freshly-hidden pane can report 0 — so the document element is the fallback. */
 /* Clamped, not merely defaulted: a collapsed pane can report a *small*
    height as readily as a zero one, and either turns the arithmetic below into
    a panel positioned off-screen. Observed repeatedly while testing, with the
    same pane alternating between 720 and 0 across consecutive reads. */

 const vw=Math.max(window.innerWidth||document.documentElement.clientWidth||0,640);

 const below=vh-m.bottom-16, above=m.top-16;

 if(below>=Math.min(220,above)){

  pop.style.bottom='auto';
  pop.style.maxHeight=Math.round(below)+'px';

  pop.style.bottom=Math.round(vh-m.top+6)+'px';
  pop.style.maxHeight=Math.round(above)+'px';

}

/* Escape for markup, including the quotes.
 *

 * browser's own escape and therefore looks like the safest possible answer. It
 * escapes `&`, `<` and `>` and **not** quotes, because inside a text node a
 * quote needs no escaping — which is true, and is the whole problem: this
 * function's callers do not all use it in a text node.
 *
 *     <span title="${escapeHtml(model.id)}">      quote closes the attribute
 *     <button onclick="pick('${jsAttr(name)}')">   quote closes the string
 *

 * attribute it was interpolated into, and the browser round-trip cannot see it
 * because by then the value is no longer in an attribute. So the escape is
 * explicit and covers both quote forms: correct in a text node, correct in a
 * quoted attribute, and no longer dependent on a DOM at all — which also means
 * it returns the same answer under `tools/page_context.js` as in a browser.
 *
 * `&` first, or the ampersands introduced by the later replacements would
 * themselves be escaped and every entity would render as literal text.
 *
 * `String(s)` is left faithful rather than made null-safe. `escapeHtml(null)`
 * has always produced the word `null` on screen, and quietly turning that into
 * an empty cell would hide a missing field instead of showing it — the trade
 * this file makes everywhere else in the opposite direction. `tools/check.py`
 * also fails a build on a literal `undefined` reaching the markup, and that
 * check only works while the value survives to be seen.

/* A DOM id built from a service's own identifier.
 *
 * The write side and the read side disagreed, and the disagreement was
 * invisible until an id contained something interesting. `poolRow` emitted
 * `id="${domId('pm',key)}"` while every lookup used `domId('pm',key)` with the raw
 * value, so a pool id or provider name carrying `&`, `<` or `>` produced an id
 * that `getElementById` could never match. Five of those lookups dereference
 * the result without a guard, so the picker did not degrade — it threw.
 *
 * Escaping harder made it worse rather than better: now that `escapeHtml`
 * covers quotes too, a quote in a key writes `&#39;` into the id and widens the
 * same gap. The fix is not a better escape, it is one derivation used by both
 * sides.
 *
 * Reversible rather than merely safe. A slug that dropped or collapsed the
 * awkward characters would map two different pools onto one id, and a picker
 * that opens the wrong pool is worse than one that opens none. Every byte
 * outside the id-safe set becomes `_hh`, which is injective, so distinct keys
 * keep distinct ids.

function domId(prefix,value){

/* A value going into a JavaScript string inside an HTML attribute.
 *
 * `escapeHtml` is not enough here, and the reason is easy to get backwards.
 * An inline handler is parsed twice: the HTML parser decodes character
 * references in the attribute value, and *then* what is left is compiled as
 * JavaScript. So a quote written as `&#39;` arrives at the JavaScript compiler
 * as a plain `'` and closes the string exactly as an unescaped one would:
 *
 *     onclick="pick('${jsAttr(name)}')"      name = x'-alert(1)-'
 *     → attribute value decodes to  pick('x'-alert(1)-'')
 *     → runs alert(1)
 *
 * Three sites in this file appended `.replace(/'/g,'&#39;')` to close this and
 * are no safer for it — the fix reads correct and is undone by the parser one
 * step later. That is the whole reason this helper exists rather than a rule
 * about remembering to escape.
 *
 * The order is the point: escape for JavaScript **first**, so the backslashes
 * are part of the source the compiler sees, then escape for HTML so they
 * survive the attribute. `<` becomes `\x3c` so a value can never begin a tag
 * if this is ever used inside a script element rather than an attribute.
 *
 * A handler built from data at all is the thing worth removing; until every one
 * of them is, this makes the ones that remain safe.
 */
function jsAttr(value){

  .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"')
  .replace(/\n/g,'\\n').replace(/\r/g,'\\r').replace(/</g,'\\x3c');

}

/* Markdown, because §7's MVP asks for it and the bubble was showing the syntax.

   A model answering "how did the benchmark go" replies in headings, bold labels
   and bullets — that is what a chat model does — and rendering it through
   `escapeHtml` alone put literal asterisks and backticks on the screen next to
   the numbers. Worse than ugly: `**Total latency**` reads as emphasis somebody
   forgot to remove, which makes the whole answer look unfinished.

   **Escape first, then build.** Every branch below runs on text that has already
   been through `escapeHtml`, so nothing a model writes — or that reached it from
   a service's error message — can introduce a tag. That order is the whole
   security argument, and it is why this takes the escaped string rather than
   escaping inside: a second escape pass would double-encode the ampersands.

   Deliberately small. Headings, bold, italic, inline code, fenced blocks, both
   kinds of list, rules, and pipe tables — which exist here because a result is
   a table often enough to matter. No links and no images: a chat reply is not a
   place to introduce a clickable destination the model composed. */
function mdInline(escaped){

  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:)!?]|$)/g,'$1<em>$2</em>')
  .replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,;:)!?]|$)/g,'$1<em>$2</em>');
}

/* One pipe table, from the lines that form it. Returns the markup and how many
   lines were consumed, so the caller stays a simple walk. */
function mdTable(lines,at){
 const row=(line)=>line.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
 if(!/\|/.test(lines[at]||'')||!/^[\s|:-]+$/.test(lines[at+1]||'')||!/-/.test(lines[at+1]||''))return null;
 const head=row(lines[at]);
 let i=at+2;const body=[];
 while(i<lines.length&&/\|/.test(lines[i])&&lines[i].trim()){body.push(row(lines[i]));i++}
 const cells=(values,tag)=>values.map(v=>`<${tag}>${mdInline(v)}</${tag}>`).join('');
 return {consumed:i-at,
   html:`<table class="md"><thead><tr>${cells(head,'th')}</tr></thead><tbody>`+
     body.map(r=>`<tr>${cells(r,'td')}</tr>`).join('')+'</tbody></table>'};
}

/* A run of list items, bulleted or numbered. */
function mdList(lines,at){
 const bullet=/^\s*[-*+]\s+(.*)$/,numbered=/^\s*\d+[.)]\s+(.*)$/;
 const kind=bullet.test(lines[at])?bullet:numbered.test(lines[at])?numbered:null;
 if(!kind)return null;
 const items=[];let i=at;
 while(i<lines.length&&kind.test(lines[i])){items.push(lines[i].match(kind)[1]);i++}
 const tag=kind===bullet?'ul':'ol';
 return {consumed:i-at,
   html:`<${tag} class="md">${items.map(t=>`<li>${mdInline(t)}</li>`).join('')}</${tag}>`};
}

/* A fenced code block. An unclosed fence still renders as code — which is what
   a reply looks like mid-stream, and showing the syntax instead would flicker
   on the last frame. */
function mdFence(lines,at){
 if(!/^\s*```(\w*)\s*$/.test(lines[at]))return null;
 const body=[];let i=at+1;
 while(i<lines.length&&!/^\s*```\s*$/.test(lines[i])){body.push(lines[i]);i++}
 return {consumed:(i<lines.length?i+1:i)-at,
   html:`<pre class="md"><code>${body.join('\n')}</code></pre>`};
}

function mdRule(lines,at){
 return /^\s*(?:[-*_]\s*){3,}$/.test(lines[at])?{consumed:1,html:'<hr class="md">'}:null;
}

function mdHeading(lines,at){
 const found=lines[at].match(/^\s*(#{1,4})\s+(.*)$/);
 if(!found)return null;
 const level=Math.min(6,found[1].length+2);
 return {consumed:1,html:`<h${level} class="md">${mdInline(found[2])}</h${level}>`};

/* Consecutive non-empty lines are one paragraph, joined with breaks rather than
   spaces: a model that wrapped a caveat over two lines meant two lines. */
function mdParagraph(lines,at){
 const opener=/^\s*(?:```|#{1,4}\s|[-*+]\s|\d+[.)]\s|!\[)/;
 const taken=[];let i=at;
 do{taken.push(lines[i]);i++}
 while(i<lines.length&&lines[i].trim()&&!opener.test(lines[i])&&!mdTable(lines,i));
 return {consumed:i-at,html:`<p class="md">${mdInline(taken.join('<br>'))}</p>`};
}

/* A picture NERVIS saved, and the one exception to "no links and no images".

   A model that answers with an image sends a megabyte of base64 in a stream
   frame; the reply a conversation stores is text, so NERVIS writes the picture
   into the workspace and puts a link to it in the reply. That link has to
   render as the picture or the whole feature is a filename.

   **The destination is not the model's to choose**, which is what keeps the
   rule above intact. Only one shape matches: NERVIS's own documents endpoint,
   a bare filename of ordinary characters, an image suffix, and the whole line
   being nothing else. Anything else — a different host, a path, a query, a
   name with a slash in it — falls through to the paragraph renderer and is
   shown as the text it is. So the worst a model can do by writing this exact
   string is make the browser show an image already sitting in the workspace,
   same-origin and read-only, which is a thing the person can see in the files
   list anyway. */
const MD_PICTURE=/^!\[([\w.\-]{0,120})\]\(\/api\/v1\/documents\/([\w.\-]{1,120}\.(?:png|jpe?g|gif|webp))\)$/i;

 const found=MD_PICTURE.exec((lines[at]||'').trim());
 if(!found)return null;
 const src='/api/v1/documents/'+found[2];
 return {consumed:1,html:`<figure class="md"><img src="${src}" alt="${found[1]||found[2]}">`
   +`<figcaption>${found[2]}<a href="${src}" download="${found[2]}">Download</a></figcaption></figure>`};

/* Whichever block starts here. Ordered by how specific the opener is, and
   `mdParagraph` last because it accepts anything. */
function mdBlock(lines,at){
 return mdFence(lines,at)||mdRule(lines,at)||mdHeading(lines,at)||mdPicture(lines,at)
   ||mdTable(lines,at)||mdList(lines,at)||mdParagraph(lines,at);
}

function renderMarkdown(raw){

  const block=mdBlock(lines,i);
  out.push(block.html);
  i+=Math.max(1,block.consumed);
 }

}

  if(this.abort){this.abort.abort();this.abort=null}
 },

 /* How healthy the stream is, for the tiles that display it. Separate from
    `state` because "connected but we missed events" is not a healthy stream and
    is also not a broken one. */
 health(){
  if(this.state==='open')return this.gaps?'degraded':'ok';
  if(this.state==='expired'||this.state==='gap')return 'degraded';
  return this.state==='stopped'?'unknown':'down';
 },

 _later(){
  if(this.state==='stopped')return;
  if(this.timer!==null)clearTimeout(this.timer);
  /* The interval the *stream* advertised, floored. A server that said `retry:
     0` would otherwise turn a reconnect into a spin. */
  this.timer=setTimeout(()=>{this.timer=null;this._open()},
    Math.max(STREAM_RETRY_FLOOR_MS,this.retryMs));
 },

 async _open(){
  if(this.state==='stopped')return;
  this.abort=new AbortController();
  try{
   const response=await fetch(BASE.nervis+'/api/v1/events/stream',
     {headers:this.cursor?{'last-event-id':this.cursor}:{},signal:this.abort.signal});
   if(!(await this._accepted(response)))return;
   this.state='open';this.since=this.since||Date.now();this.detail='';
   await this._read(response.body);
   /* A stream that ends without an error is the ordinary end of a gap frame,
      or NERVIS restarting. Either way: reconnect from where we are. */
   if(this.state!=='stopped'){this.state='connecting';this._later()}
  }catch(failure){
   if(this.state==='stopped')return;
   this.state='offline';
   this.detail=failure&&failure.name==='AbortError'?'the connection was closed'
     :'NERVIS is not answering the event stream';
   this._later();
  }
 },

 /* Whether this response is a stream to read, and what to do when it is not.
    Split out because `_open` sits under the complexity gate and because the
    refusals are the interesting part of this module. */
 async _accepted(response){
  if(response.ok)return true;
  if(response.status===409){
   /* §4.1's expired cursor. The events between where this tab stopped and what
      the hub still holds are gone — not delayed, deleted. Resuming from the
      present is the only thing left to do, and saying so is the whole point of
      the status existing: a silent reconnect here is a feed with a hole in it
      and a reader with no reason to doubt it. */
   const body=await response.json().catch(()=>({}));
   /* **`error.details`, not `detail`.** This read Starlette's raw shape, and
      §16 item 10 moved every refusal onto §4.5's envelope — so the floor was
      `undefined` from that day, the sentence quietly dropped its most useful
      half, and nothing failed loudly enough to notice. The old path is kept as
      a fallback because a NERVIS older than that change answers the old way,
      and a missing number here should degrade to a shorter sentence rather
      than to a wrong one. */
   const floor=((body.error||{}).details||body.detail||{}).oldest_sequence;
   this.cursor='';this.gaps++;this.state='expired';
   this.detail=`this tab was away longer than the hub keeps events${floor?`, which now start at ${floor}`:''} — the ones in between are gone`;
   this._later();
   return false;
  }
  if(response.status===400){
   this.cursor='';this.state='connecting';
   this.detail='the stream refused this cursor; resuming from the present';
   this._later();
   return false;
  }
  this.state='offline';
  this.detail=`the event stream answered HTTP ${response.status}`;
  this._later();
  return false;
 },

 async _read(body){
  const reader=body.getReader(),decoder=new TextDecoder();
  let buffer='';
  for(;;){
   const {value,done}=await reader.read();
   if(done)return;
   buffer+=decoder.decode(value,{stream:true});
   const parts=buffer.split('\n\n');
   buffer=parts.pop();
   for(const part of parts)this._frame(part);
   if(this.state==='stopped')return;
  }
 },

 /* One frame. `id:` is tracked whatever else the frame carries, because that is
    the cursor a reconnect resumes from — and a frame with no `id:` must leave
    it alone rather than clear it, which is the client half of the same rule the
    server side of this stream had to be taught. */
 _frame(part){
  let type='message',data='';
  for(const line of part.split('\n')){
   if(line.startsWith('id:'))this.cursor=line.slice(3).trim();
   else if(line.startsWith('event:'))type=line.slice(6).trim();
   else if(line.startsWith('data:'))data=line.slice(5).trim();
   else if(line.startsWith('retry:')){
    const advertised=parseInt(line.slice(6).trim(),10);
    if(Number.isFinite(advertised))this.retryMs=advertised;
   }
  }
  if(type==='ecosystem.stream.gap'){
   this.gaps++;this.state='gap';
   this.detail='this tab fell behind and the hub dropped it; some events were missed';
   return;
  }
  if(type==='ecosystem.stream.live'||!data)return;
  this.received++;
  this._wake();
 },

 /* Repaint the screen the event belongs on, at most once a second.
    The frames are counted and then dropped rather than buffered. A buffer was
    the first version and it was dead weight: the Events screen reads the hub's
    own query, which filters and pages, and a second copy of the feed held in
    this tab would have to reimplement both to be usable — and would disagree
    with the first the moment it did.
    What the stream is actually good for here is knowing *when*, and this is
    that: the feed stops being eight seconds stale without growing a second
    source of truth. Throttled because a burst of forty events is one repaint
    worth of news, and unthrottled it is forty. */
 _wake(){
  if(state.view!=='Events'||state.app!=='nervis')return;
  const now=Date.now();
  if(now-(this._woke||0)<STREAM_WAKE_MS)return;
  this._woke=now;
  repaint();
 }
};
/* How often a stream of events may repaint the screen reading it. */
const STREAM_WAKE_MS=1000;

function stopPolling(){
 if(POLL_TIMER!==null){clearInterval(POLL_TIMER);POLL_TIMER=null}
 EVENTS.stop();
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){stopPolling()}
 else{pollRegistry();pollGates();startPolling();EVENTS.start()}
});
pollRegistry();
startPolling();
EVENTS.start();
</script></body></html>
