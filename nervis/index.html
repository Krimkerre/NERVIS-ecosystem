.map.compact .hub,.map.compact .node{padding:4px 7px;font-size:10px;line-height:1.3;

.hub,.node{position:absolute;border:1px solid var(--line);background:#0a1118;border-radius:7px;padding:8px 13px}.hub{color:var(--accent);border-color:var(--accent);z-index:2}.node:nth-of-type(2){top:15px}.node:nth-of-type(3){left:8%;bottom:18px}.node:nth-of-type(4){right:8%;bottom:18px}.node:nth-of-type(5){right:7%;top:15px}.map svg{position:absolute;inset:0;width:100%;height:100%}.map line{stroke:var(--accent);stroke-opacity:.55;stroke-dasharray:5 5;animation:flow 1.2s linear infinite}.event{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #1c2630;font:10px/1.4 "SFMono-Regular",monospace;color:#8797a7}.event time{color:#566779}.event.new{animation:flash .8s}/* The chat card fills whatever is left below the page heading rather than

/* Readability pass: human-facing content uses a clean UI face. Monospace remains
   limited to genuine telemetry, code, timestamps and compact HUD labels. */
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:0}.page-head h1{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:650;letter-spacing:.045em}.tab,.app-name b{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.07em}.side-nav button{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;letter-spacing:.01em}.card h3{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:650;letter-spacing:.09em}.table-row,.model,.lane,.bubble,.clarvis-panel{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.kpi strong{font-family:"SFMono-Regular",Consolas,monospace}.page-head p{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11px;letter-spacing:.01em}.backronym{margin:3px 0 4px;color:var(--accent);font:600 9px/1.3 "SFMono-Regular",Consolas,monospace;letter-spacing:.075em;text-transform:uppercase;text-shadow:0 0 10px rgba(var(--rgb),.4)}
/* Animated ecosystem field. Canvas is behind every panel and never captures input. */
#network-bg{position:fixed;inset:62px 0 0 220px;width:calc(100% - 220px);height:calc(100% - 62px);pointer-events:none;z-index:0;opacity:1}.body,.top{position:relative;z-index:1}.side,.main{position:relative}.main{background:radial-gradient(ellipse at 58% 44%,rgba(6,28,40,.035),transparent 65%)}
/* Character scale: avatars are a deliberate product-presence, not status icons. */
.page-head{height:150px;padding-right:205px}.page-head.no-avatar{padding-right:22px}.page-head.no-avatar .avatar-slot:after{display:none}.avatar-slot{width:190px;height:146px;right:8px;top:1px}.avatar-frame{transform:scale(.43)}.avatar-slot .top-avatar{margin:-170px}.avatar-slot:after{right:22px;bottom:8px;font-size:7px}.clarvis-panel .avatar-frame{transform:scale(.39);margin:-101px auto -88px}.clarvis-panel{padding-top:8px}
/* Explicit-color Firefox fallback: do not rely on backdrop-filter or blend modes
   to reveal the ambient network through panels. */
.card{background:linear-gradient(145deg,rgba(8,26,37,.55),rgba(4,14,21,.6))}.page-head{background:linear-gradient(115deg,rgba(8,28,40,.6),rgba(5,16,24,.54))}@supports not (backdrop-filter:blur(2px)){.card{background:linear-gradient(145deg,rgba(8,26,37,.82),rgba(4,14,21,.86))}}
@keyframes hudPulse{50%{opacity:.4;box-shadow:0 0 3px var(--hud)}}
@media(max-width:900px){#network-bg{left:72px;width:calc(100% - 72px)}}@media(max-width:620px){#network-bg{left:0;width:100%}.page-head{height:150px;padding-right:145px}.avatar-slot{width:140px}.avatar-frame{transform:scale(.36)}}

/* ── ABSENCE ──────────────────────────────────────────────────────────────
   A missing service must look missing. Never a zero, never an em-dash that
   reads like a measurement, never a stale figure presented as current. */
.absent{display:flex;flex-direction:column;gap:3px;padding:2px 0}
.absent b{font:600 12px/1.3 var(--mono,ui-monospace,monospace);letter-spacing:.04em;text-transform:uppercase}
.absent span{font-size:11px;color:#6c7b8c;line-height:1.35}
.absent[data-state="unreachable"] b,.absent[data-state="stopped"] b{color:#ff5c6a}
.absent[data-state="degraded"] b{color:#ffb648}
.absent[data-state="stale"] b,.absent[data-state="discovering"] b{color:#8b9bb0}
.absent[data-state="incompatible"] b,.absent[data-state="unauthorized"] b{color:#ff9d3d}
.card.is-absent{opacity:.82;border-style:dashed}
/* Prototype content. Faded and desaturated rather than hidden, because the
   layout is the part that is real — these screens are the design for a thing
   that is not built, and deleting them would lose that. Hovering restores them
   to readable: the point is "do not trust this number", not "you may not look".
   `.card.live` is the opt-out for a screen where only some cards are real. */
.model-picker{border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:9px;margin:6px 0 2px;
  background:rgba(255,255,255,.025)}
.picker-head{display:flex;gap:7px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.price-row{display:flex;gap:10px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.price-row label{display:flex;align-items:center;gap:7px;flex:1 1 220px;min-width:180px;
  font:9px/1.4 "SFMono-Regular",monospace;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.price-row input[type=range]{flex:1;accent-color:var(--accent);min-width:110px}
.picker-search{flex:1 1 180px;min-width:140px;background:rgba(255,255,255,.04);color:inherit;
  border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:5px 7px;font-family:inherit}
/* Bounded and scrollable, because this list is four hundred rows for OpenRouter
   and a panel that grows to fit pushes every card below it off the screen. */
.picker-list{max-height:270px;overflow-y:auto;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px 10px;
  border-top:1px solid rgba(255,255,255,.07);padding-top:7px}
.picker-item{display:flex;align-items:center;gap:6px;padding:2px 3px;border-radius:4px;
  font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
.picker-item:hover{background:rgba(255,255,255,.05)}
.picker-item input{accent-color:var(--accent);flex:none}
.picker-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.picker-item em{flex:none;font-style:normal;font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  opacity:.5;border:1px solid rgba(255,255,255,.14);border-radius:3px;padding:0 4px}
.pick-group{padding:9px 3px 3px;display:flex;flex-direction:column;gap:1px}
.pick-group b{font:600 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);opacity:.85}
.pick-group small{font-size:10px;line-height:1.4}
.pick-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:6px;
  color:inherit;padding:6px 9px;margin:2px 0;
  font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
.pick-row:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16)}
.pick-row.on{border-color:var(--accent);background:rgba(var(--rgb),.12)}
.pick-row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-row em{flex:none;font-style:normal;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  opacity:.6;border:1px solid rgba(255,255,255,.15);border-radius:3px;padding:1px 5px}
.picker-empty{padding:10px;opacity:.55;font:11px/1.5 ui-monospace,monospace}
.card.prototype-card{opacity:.4;filter:saturate(.25);border-style:dashed}
.card.prototype-card:hover{opacity:.82;filter:saturate(.6)}
#content[data-wip] .card:not(.live){opacity:.4;filter:saturate(.25);border-style:dashed}
#content[data-wip] .card:not(.live):hover{opacity:.82;filter:saturate(.6)}
#content[data-wip] .card:not(.live) h3:after{content:"PROTOTYPE";margin-left:8px;
  font-size:8px;letter-spacing:.14em;color:#8a6a3a;border:1px solid #4a3a20;
  border-radius:2px;padding:1px 5px;vertical-align:middle}
.wip-note{grid-column:1/-1;border:1px dashed #4a3a20;background:rgba(74,58,32,.12);
  border-radius:3px;padding:9px 12px;font:10px/1.5 "SFMono-Regular",monospace;
  color:#b08d55;letter-spacing:.04em}
.wip-note b{color:#d8b478}
.banner{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:9px;
        border:1px solid rgba(255,92,106,.32);background:rgba(255,92,106,.07);margin-bottom:12px}
.banner[data-tone="info"]{border-color:rgba(125,108,255,.3);background:rgba(125,108,255,.07)}
.banner b{font-size:12px;letter-spacing:.03em}
.banner p{margin:2px 0 0;font-size:11.5px;color:#8b9bb0;line-height:1.45}
/* provenance and staleness travel with the number, not in a footnote */
.prov{display:inline-block;font:600 9.5px/1 ui-monospace,monospace;letter-spacing:.08em;
      padding:3px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.prov[data-kind="MEASURED"]{color:#3ddc97;background:rgba(61,220,151,.13)}
.prov[data-kind="ESTIMATED"]{color:#ffb648;background:rgba(255,182,72,.13)}
.prov[data-kind="UNKNOWN"]{color:#8b9bb0;background:rgba(139,155,176,.13)}
.stamp{font:400 10px/1 ui-monospace,monospace;color:#5d6b7e;margin-left:6px}
.stamp.stale{color:#ffb648}
.top-status .dot[data-state="warn"]{background:#ffb648;box-shadow:0 0 8px #ffb648}
.top-status .dot[data-state="bad"]{background:#ff5c6a;box-shadow:0 0 8px #ff5c6a}
/* fault injection: the degradation gate should be walkable by clicking */

/* ── EMBEDDED EDITOR SEAM ────────────────────────────────────────────────
   code-server is a separate document in its own frame — that boundary is a
   security requirement, not a limitation. What can go is the *visible* seam:
   the template's rail steps aside so the editor's own activity bar and
   explorer occupy that column, and the editor bleeds to the chrome edges.
   The page head stays, so Clarvis carries the same title and avatar slot as
   every other app. */



.app[data-app="clarvis"] .page-head{margin:0;border-radius:0;border-left:0;border-right:0;border-top:0;
  padding:14px 20px;flex:0 0 auto}




/* ── CLARVIS PANEL ──────────────────────────────────────────────────────────
   Mirrors media/chat.css. The real panel resolves --vscode-* theme variables;
   here they map onto the template's tokens so the mock reads the same without
   pretending to be theme-aware. */
.clarvis-chat{display:flex;flex-direction:column;gap:6px;padding:4px 2px;height:100%;min-height:0;
  font-size:12px;color:#c6d2de}
#clarvis-transcript{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:2px}
.clarvis-turn{line-height:1.45;white-space:pre-wrap;word-break:break-word;padding-left:8px;
  border-left:2px solid transparent}
.clarvis-turn .who{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin-bottom:2px}
.clarvis-turn.user{color:#7f8fa1;border-left-color:#33445a}
.clarvis-turn.user .who{color:#7f8fa1}
.clarvis-turn.clarvis{color:#c6d2de;border-left-color:var(--cyan)}
.clarvis-turn.clarvis .who{color:var(--cyan);opacity:.8}
.clarvis-turn code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(255,255,255,.06);padding:0 3px;border-radius:3px}
/* Each option carries its own explanation, rather than a list above a row of bare
   labels repeating it. Stacked when explained; binary answers get pushed apart,
   because a misclick there is a decision nobody made. */
.clarvis-choices{display:flex;flex-wrap:wrap;gap:6px;padding-left:8px;margin-top:-2px}
.clarvis-choices.stacked{flex-direction:column;align-items:stretch}
.clarvis-choices.binary{justify-content:space-between;gap:16px;padding:2px 8px 0}
.clarvis-choice{font:inherit;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;
  padding:6px 10px;border-radius:5px;border:1px solid rgba(52,230,242,.35);background:transparent;color:#c6d2de}
.clarvis-choice:hover{background:rgba(52,230,242,.08)}
.clarvis-choice .label{font-weight:600;white-space:normal}
.clarvis-choice .detail{font-size:11px;line-height:1.35;opacity:.75;white-space:normal}
.clarvis-progress{flex:0 0 auto;padding:4px 8px;border-radius:4px;background:rgba(52,230,242,.06);font-size:11px}
.clarvis-progress[data-active="false"]{display:none}
.clarvis-progress .count{opacity:.6;letter-spacing:.04em}
.clarvis-progress .step{display:block;margin-top:2px}
.clarvis-progress .bar{display:block;height:2px;margin-top:5px;background:#1d2836;border-radius:2px;overflow:hidden}
.clarvis-progress .bar i{display:block;height:100%;border-radius:2px;background:var(--cyan);transition:width .3s ease}
.clarvis-chat-head{display:flex;align-items:center;justify-content:flex-end;flex:0 0 auto;gap:6px}
.clarvis-mute{background:none;border:1px solid transparent;border-radius:4px;color:#c6d2de;cursor:pointer;
  padding:2px 8px;font-size:11px;opacity:.75}
.clarvis-mute:hover{opacity:1;background:rgba(255,255,255,.06)}
.clarvis-mode{opacity:1;font-weight:600}
.clarvis-mode[data-safe="true"]{color:#3ddc97}
.clarvis-prompt{display:flex;align-items:flex-end;gap:6px;flex:0 0 auto}
.clarvis-bowtie{display:flex;align-items:center;justify-content:center;flex:0 0 auto;height:32px;width:28px;
  padding:0;cursor:pointer;background:none;border:1px solid #223041;border-radius:4px;color:#c6d2de;opacity:.7}
.clarvis-bowtie:hover{opacity:1;background:rgba(255,255,255,.06)}
.clarvis-stop[data-busy="false"]{opacity:.4;cursor:default}
.clarvis-stop[data-busy="true"]{color:#ff5c6a;opacity:1}
#clarvis-input{flex:1 1 auto;box-sizing:border-box;resize:none;padding:6px 8px;border-radius:4px;
  border:1px solid #223041;background:#0a0f16;color:#c6d2de;font:inherit}
#clarvis-input:focus{outline:1px solid var(--cyan)}
/* code-server keeps its side *panel* — explorer, search, source control — but not
   its activity bar: the template's rail selects the view instead, so an embedded
   editor shows one navigation column rather than two stacked side by side. */
/* visibility, not display: the explorer, editor and terminal are auto-placed, so
   removing the activity bar from the grid would shift every one of them a column
   left. It keeps its cell and simply occupies no width. */
.app[data-app="clarvis"] .activity{visibility:hidden;width:0;padding:0;border:0;overflow:hidden}
/* collapse the activity track rather than removing it: the editor, terminal and
   Clarvis panel all place themselves by explicit column number. */
.app[data-app="clarvis"] .code-server{grid-template-columns:0 200px 1fr 285px}
/* Fallback with teeth: no Bridge, no remote control — the editor's own activity bar
   comes back and the workspace stays navigable without NERVIS. */
.app[data-app="clarvis"].bridge-down .activity{visibility:visible;width:auto;padding:13px;border-right:1px solid #202832}
.app[data-app="clarvis"].bridge-down .code-server{grid-template-columns:42px 200px 1fr 285px}
.app[data-app="clarvis"].bridge-down .side-nav button{opacity:.45;pointer-events:none}
.app[data-app="clarvis"] .clarvis-panel{display:flex;padding:10px 12px;min-height:0}
/* Grid items default to min-width:auto, so one long line of code refuses to shrink
   and widens the 1fr track past its share — which pushed the Clarvis panel clean
   outside the frame. Let the editor scroll instead of shoving its siblings. */
.app[data-app="clarvis"] .editor{min-width:0;overflow:auto}
.app[data-app="clarvis"] .code-server{max-width:100%;overflow:hidden}
.app[data-app="clarvis"] .terminal{white-space:pre-line;min-width:0;overflow:auto}
/* The editor fills whatever height is left rather than a fixed 580px, stopping
   clear of the demo and fault strips pinned to the bottom of the viewport. Flex
   column, so the Bridge banner keeps its natural height above it. */
.app[data-app="clarvis"] .main{display:flex;flex-direction:column;overflow:hidden;padding-bottom:80px}
.app[data-app="clarvis"] .page-head{flex:0 0 auto;margin-bottom:13px}
.app[data-app="clarvis"] .grid{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.app[data-app="clarvis"] .banner{flex:0 0 auto}
.app[data-app="clarvis"] .code-server{height:auto;flex:1 1 auto;min-height:320px}

/* ── FOCUS MODE ─────────────────────────────────────────────────────────────
   code-server does have a Zen Mode (workbench.action.toggleZenMode) and it works
   in the browser — but it only reaches inside its own document. It cannot hide
   this dashboard's rail or page head, because those belong to a different page.
   So focus is two coordinated halves: the template hides its own chrome, and the
   editor is asked to go Zen through the same closed command enum. The top bar
   stays, so there is always a way back. */
.zen-toggle{margin-left:auto;background:rgba(6,20,29,.9);border:1px solid #1b4050;border-radius:2px;
  color:#8494a5;padding:5px 9px;cursor:pointer;font:9px/1 monospace;text-transform:uppercase;
  letter-spacing:.06em}
.zen-toggle:hover{color:var(--hud,var(--accent));border-color:var(--hud,var(--accent))}
.app.zen .zen-toggle{color:var(--accent);border-color:var(--accent)}
.app.zen .side{display:none}
.app.zen .body{grid-template-columns:minmax(0,1fr)}
.app.zen .page-head{display:none}
.app.zen .main{padding:10px}

/* Focus mode hides the dashboard header, and with it the shared avatar slot — so
   the chat panel takes him back, exactly as standalone VS Code renders him. One
   butler on screen at a time, wherever there is room for him. Same 340px frame as
   the header, scaled down with negative margins collapsing the layout box, since
   transform does not affect layout. */


/* ── BRAND SCAN ─────────────────────────────────────────────────────────────
   A camera lens, not an eye: it slews to a bearing, stops the aperture down while
   it moves, then opens and settles as focus locks. It never blinks and never
   follows the cursor — that is what keeps it an instrument rather than a creature.
   Clarvis is the only thing in this ecosystem with eyes.

   The mark is rotated 45°, so the dot counter-rotates first: transforms compose
   right-to-left, and rotate(-45) cancels the parent's rotate(45), leaving the
   travel in screen space instead of along the diamond's diagonals. */
.brand i:after{transform-origin:center;animation:brandScan 7s ease-in-out infinite}
@keyframes brandScan{
  0%,15%  {transform:rotate(-45deg) translate(0,0) scale(1)}
  18%     {transform:rotate(-45deg) translate(1.8px,-.5px) scale(.55)}   /* stopped down, slewing */
  21%,36% {transform:rotate(-45deg) translate(3.5px,-1px) scale(1)}      /* focus locked */
  39%     {transform:rotate(-45deg) translate(.7px,.8px) scale(.55)}
  42%,56% {transform:rotate(-45deg) translate(-2px,2.5px) scale(1)}
  59%     {transform:rotate(-45deg) translate(-.8px,2.9px) scale(.55)}
  62%,75% {transform:rotate(-45deg) translate(.5px,3.2px) scale(1)}
  78%     {transform:rotate(-45deg) translate(-1.2px,.6px) scale(.55)}
  81%,94% {transform:rotate(-45deg) translate(-3px,-2px) scale(1)}
  97%     {transform:rotate(-45deg) translate(-1.5px,-1px) scale(.55)}
  100%    {transform:rotate(-45deg) translate(0,0) scale(1)}
}
/* The barrel ring catches a highlight the instant focus lands. */
.brand i:before{animation:brandLock 7s ease-in-out infinite}
@keyframes brandLock{
  0%,19%,38%,40%,58%,60%,77%,79%,96%,100%{border-color:rgba(85,220,255,.2)}
  22%,43%,63%,82%{border-color:rgba(85,220,255,.6)}
}
/* Centred properly: the frame is 340px and only *drawn* at 116px, so it is
   absolutely positioned inside a box the size of what you actually see —
   the same trick .top-avatar uses. Negative margins alone left it off-centre. */
.panel-avatar-wrap{width:116px;height:116px;margin:2px 0 8px;flex:0 0 auto;align-self:center;
  position:relative;overflow:hidden}
/* a later theme layer restyles .avatar-frame, so this has to outrank it on
   specificity rather than order — margin centres the 340px canvas in the
   116px window, and the scale is what makes it 116px of drawn avatar. */
.clarvis-chat .panel-avatar-wrap iframe.avatar-frame{position:absolute;left:50%;top:50%;
  margin:-170px;width:340px;height:340px;border:0;background:transparent;
  transform:scale(.34);transform-origin:center;pointer-events:none}
@media(prefers-reduced-motion:reduce){.brand i:after,.brand i:before{animation:none}}

/* A candidate removed by a hard constraint is a different object from one that
   merely scored lower — it never reached the ranking phase, and the UI says so. */
.lane.excluded{opacity:.55;border-style:dashed}
.lane.excluded b{text-decoration:line-through;text-decoration-color:rgba(255,92,106,.5)}
.lane.excluded small{color:#ff8f99}
.chip.warn{color:#ffb648;border-color:rgba(255,182,72,.4)}
/* An optional peer nobody configured and which has never answered. Grey rather
   than amber: it is a fact about the machine, not a fault on it. */
.chip.dim{opacity:.45}
/* the default row is four columns; the request log carries an execution path too */
.table-row.five{grid-template-columns:1.1fr .8fr 1.1fr .45fr .45fr}
/* Wider tables exist because collapsing a column is how build, runtime and role
   provenance quietly disappears. Six and seven tracks, same rhythm as .five. */
.table-row.six{grid-template-columns:1.15fr .8fr .8fr .5fr .5fr .6fr}
.table-row.seven{grid-template-columns:1.15fr .7fr .6fr .45fr .45fr .5fr .55fr}
/* Each .table-row is its own grid, so a grid item's default min-width:auto let
   one long identifier widen its track and knock that row out of line with the
   rows above it — the columns stopped being columns. min-width:0 restores the
   track, and anywhere-wrapping keeps a long capability string whole rather than
   truncating it: an elided contract name is worse than two lines. */
.table-row>span,.metric-row>span{min-width:0;overflow-wrap:anywhere}
/* Capability strings are long and load-bearing, so that column gets the room. */
.table-row.caps{grid-template-columns:.85fr .5fr .5fr 1.9fr .55fr}
/* A long list inside a card scrolls rather than growing the page, and the user
   can drag it taller. `resize` needs a non-visible overflow to work at all, so
   the two properties belong together; --rows sets how many are visible before
   scrolling, measured in table rows rather than pixels so it survives a font
   change. The sticky header keeps the column labels in view while scrolling. */
.scroller{max-height:calc(var(--rows,4) * var(--row-h,32px) + 26px);overflow-y:auto;resize:vertical;
 min-height:96px;border:1px dashed #16323f;border-radius:3px;padding:0 6px}
.scroller .table-row.head{position:sticky;top:0;z-index:1;background:#071119;margin:0 -6px;padding-left:13px;padding-right:13px}
.scroller::-webkit-resizer{background:transparent}
.scroller:focus-visible{outline:1px solid var(--hud);outline-offset:2px}
/* ── MIKU MODE ─────────────────────────────────────────────────────────────
   An easter egg, and deliberately not a routing profile. NERVIS.md §7 forbids
   inventing one, so this button sits outside the profile group behind a divider,
   sends nothing to RAVIS, claims no route and writes no record. Everything it
   touches is local presentation that reverts: a theme attribute, the avatar
   frame, the heading and the message list. That is the same category as the
   Focus toggle and the demo tour, both of which are template-side chrome with no
   endpoint behind them either. */
.app[data-miku]{--accent:#39c5bb;--rgb:57,197,187;--hud:#6ff6e8}
.app[data-miku] .brand span,.app[data-miku] .app-name b{color:#6ff6e8}

   redefined: two blink rates on one screen reads as two different things

   blinking after "NERVIS" and nothing else reads as a finished empty answer.

.typing-dots{display:inline-flex;gap:4px;align-items:center;height:1em;vertical-align:middle}

/* ── SCREEN CORRUPTION ─────────────────────────────────────────────────────
   Fires once, on the one line where she loses containment. Nothing here filters
   the real DOM — a filter on .app would repaint every backdrop-blurred card at
   60fps for no visual gain. It is one fixed overlay of scanlines, tear bars and
   channel-split blocks, plus a hard translate on .app. Every animation uses
   steps(1): an eased glitch reads as a wobble, not as corruption. */
#corrupt{position:fixed;inset:0;z-index:80;pointer-events:none;display:none;overflow:hidden}
#corrupt.on{display:block}
#corrupt i{position:absolute;display:block}
#corrupt .scan{inset:0;background:repeating-linear-gradient(0deg,rgba(111,246,232,.07) 0 1px,transparent 1px 3px);animation:cScan .8s linear infinite}
#corrupt .tear{left:-4%;width:108%;mix-blend-mode:screen;animation:cTear 1.1s steps(1) infinite}
#corrupt .t1{top:18%;height:26px;background:linear-gradient(90deg,transparent,rgba(57,197,187,.5),transparent)}
#corrupt .t2{top:46%;height:12px;background:linear-gradient(90deg,rgba(255,47,119,.45),transparent 60%);animation-delay:-.4s;animation-duration:.75s}
#corrupt .t3{top:71%;height:34px;background:linear-gradient(90deg,transparent 30%,rgba(111,246,232,.4));animation-delay:-.75s;animation-duration:1.4s}
@keyframes cTear{0%{transform:translate(-40px,0);opacity:0}
 8%{transform:translate(26px,0);opacity:.9}
 18%{transform:translate(-18px,42px);opacity:.5}
 30%{transform:translate(30px,-30px);opacity:.8}
 44%{transform:translate(-9px,70px);opacity:.35}
 60%,100%{transform:translate(0,110px);opacity:0}}
#corrupt .blk{mix-blend-mode:screen;animation:cBlk .55s steps(1) infinite}
#corrupt .b1{top:29%;left:12%;width:190px;height:9px;background:rgba(255,47,119,.6)}
#corrupt .b2{top:62%;right:9%;width:240px;height:6px;background:rgba(57,197,187,.6);animation-delay:-.3s}
#corrupt .b3{top:8%;left:38%;width:120px;height:14px;background:rgba(111,246,232,.45);animation-delay:-.18s;animation-duration:.4s}
@keyframes cBlk{0%,100%{opacity:0;transform:translateX(0)}
 10%{opacity:1;transform:translateX(-14px)}
 22%{opacity:0}
 46%{opacity:.85;transform:translateX(22px)}
 58%{opacity:0}}
#corrupt .flash{inset:0;background:#6ff6e8;mix-blend-mode:overlay;animation:cFlash 1.3s steps(1) infinite}
@keyframes cFlash{0%,88%,100%{opacity:0}90%{opacity:.22}93%{opacity:0}96%{opacity:.13}}
/* the page itself jumps — hard cuts, never a slide */
body.corrupting .app{animation:cShake .1s steps(1) infinite}
@keyframes cShake{0%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}
 50%{transform:translate(2px,-2px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(3px,0)}}

/* Waterfall. Fast steps really are hairlines next to inference — that contrast is
   the finding, so the bars stay to scale and get a minimum width instead. */
.wf{display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:center;margin-bottom:5px;

  background:var(--accent);box-shadow:0 0 7px rgba(var(--rgb),.55)}
.wf .track .gap{position:absolute;top:3px;height:9px;border:1px dashed rgba(255,182,72,.55);border-radius:2px}

/* Chat carries its own route explanation, because a router that cannot say why is
   just a proxy. Neutral throughout: NERVIS has no personality — that is Clarvis's job. */
.profile-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
/* The event feed's filter strip: the same chips, plus a free-text box. */
.filter-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

  color:#8494a5;cursor:pointer}
.mode-chip.on{color:var(--accent);border-color:var(--accent)}
/* armed = chosen, not yet committed. Deliberately not the active styling. */
.mode-chip.armed{color:#ffb648;border-color:#ffb648;background:rgba(255,182,72,.09)}
.chat-params{border:1px solid rgba(var(--rgb),.16);border-radius:3px;padding:6px 9px;margin:0 0 8px;
  background:rgba(var(--rgb),.03)}

/* ── The chat side drawer ────────────────────────────────────────────────────
   Parameters and history used to sit stacked above the transcript, each pushing
   it further down — and both are reference material consulted occasionally
   rather than read while typing. They fold out from the right instead.

   `position:absolute` inside the chat card rather than `fixed`: the drawer
   belongs to this panel, and a fixed one would sit over the navigation and the
   page heading, which it has nothing to do with. */
.chat{position:relative}
.chat-drawer{position:absolute;top:0;right:0;height:100%;width:min(340px,86%);
  display:flex;flex-direction:column;z-index:6;
  background:rgba(10,14,20,.97);backdrop-filter:blur(9px);
  border-left:1px solid rgba(var(--rgb),.24);
  box-shadow:-18px 0 40px -22px rgba(0,0,0,.9);
  transform:translateX(101%);transition:transform .18s ease;
  /* Off-screen means out of the way *and* out of the tab order: a drawer whose
     inputs are still focusable is a keyboard trap with no visible cursor. */
  visibility:hidden}
.chat-drawer[data-open]{transform:translateX(0);visibility:visible}
/* 101% rather than 100% so the border-left clears the edge too — at 100% a
   one-pixel line stays visible against the card. */
@media (prefers-reduced-motion:reduce){.chat-drawer{transition:none}}
.chat-drawer header{display:flex;align-items:center;gap:8px;padding:9px 11px;
  border-bottom:1px solid rgba(var(--rgb),.16);
  font:9px/1.4 "SFMono-Regular",monospace;letter-spacing:.14em;text-transform:uppercase;color:#72b9cf}
/* No close button in the header: it would land exactly under the openers,
   which are pinned to the same corner and above this panel. The opener that
   brought the drawer out closes it, and so does Escape — the header says so. */
.chat-drawer .drawer-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 11px}
/* Stacked in the drawer: four fields side by side in 340px is four unusable
   fields. The system prompt gets the room it needs. */
.chat-drawer .param-grid{grid-template-columns:1fr;gap:10px}
.chat-drawer .param-grid.adv{grid-template-columns:1fr 1fr;gap:8px}
.adv-toggle{display:flex;align-items:center;gap:7px;margin:11px 0 4px;cursor:pointer;
  font:9px/1.4 "SFMono-Regular",monospace;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);opacity:.85}
.adv-toggle input{accent-color:var(--accent)}
.adv-toggle:hover{opacity:1}
.chat-drawer .param-grid textarea{min-height:76px}
/* The two openers, pinned to the chat card's top-right corner and **above the
   drawer**. They started inside the profile row, which wraps thirteen chips and
   then gets covered by the drawer — so the buttons scrolled out of reach and
   the one that closes the panel was underneath it. */
.chat-tools{position:absolute;top:10px;right:11px;display:flex;gap:6px;z-index:7}
/* Room for them, so a wrapped profile chip never slides underneath. */
.chat .profile-row{padding-right:190px}

.route-card{border:1px solid rgba(var(--rgb),.22);border-radius:7px;padding:8px 10px;margin:2px 0 12px;
  background:rgba(var(--rgb),.04)}
/* The routing explanation, moved out of the transcript. It is reference
   material rather than conversation: worth reaching for on the one reply that
   surprised you, not worth a card under every single one.

   `<details>` rather than a hover tooltip, deliberately. Hover has no answer on
   a touch screen, cannot be reached by keyboard, and vanishes the moment the
   pointer crosses a gap — and this panel is a table somebody may want to read
   rather than glance at. `details` brings toggle, focus and Escape with it and
   needs no outside-click handler. */
.bubble{position:relative}
.route-info{position:absolute;top:6px;right:8px}
.route-info>summary{list-style:none;cursor:pointer;width:15px;height:15px;border-radius:50%;
  border:1px solid rgba(var(--rgb),.45);color:rgba(var(--rgb),.85);font:600 10px/13px ui-monospace,monospace;
  text-align:center;opacity:.5;transition:opacity .12s}
.route-info>summary::-webkit-details-marker{display:none}
.route-info>summary:after{content:"i"}
.route-info>summary:hover,.route-info[open]>summary{opacity:1;background:rgba(var(--rgb),.14)}
.route-info>summary:focus-visible{outline:1px solid rgba(var(--rgb),.8);outline-offset:2px;opacity:1}
/* Fixed rather than absolute, and positioned on open. The transcript is a
   scroll container, so an absolutely positioned panel is clipped by it — tried,
   and the panel came out two rows tall with the rest cut off. Fixed positioning
   escapes the clip without touching the scrolling the transcript depends on. */
.route-pop{position:fixed;width:min(460px,72vw);max-height:min(340px,52vh);overflow:auto;z-index:60;
  border:1px solid rgba(var(--rgb),.3);border-radius:4px;padding:2px 8px 0;
  background:#0a1520;box-shadow:0 12px 30px #000a}

   drives `scrollTop`), so the popover deliberately scrolls *with* it rather
   than escaping it. Forcing `overflow:visible` to let the panel out would have
   broken the scrolling the transcript depends on — a worse trade than a panel
   that occasionally needs a scroll to read in full. */
.route-card .table-row{padding:5px 2px}

function avatarFrame(app,extra=''){return `<iframe class="avatar-frame ${extra}" data-avatar="${app}" title="${app.toUpperCase()} animated avatar"></iframe>`}
/* Map each visible screen to the avatar vocabulary defined by its own source.
   Add future routes here instead of scattering avatar decisions through views. */
function desiredAvatarState(app=state.app,view=state.view){const maps={
 nervis:{Overview:'nominal',Chat:'routing','Ecosystem map':'scanning',Events:'scanning',Traces:'analyzing',Diagnostics:'analyzing',Settings:'nominal'},
 sirvis:{Dashboard:'loading',Models:'loading',Benchmarks:'measuring','Runtime sets':'warmup',Results:'verdict',Recommendations:'verdict',Downloads:'loading',System:'thermal'},
 ravis:{Dashboard:'ranking',Routes:'ranking',Pools:'selected',Providers:'eligibility',Policies:'eligibility',Evidence:'ranking',Logs:'selected',Diagnostics:'fallback'},
 clarvis:{Workspace:'thinking',Explorer:'neutral',Search:'thinking','Source control':'judging','Run & debug':'talking',Extensions:'neutral',Terminal:'talking'}
 };return maps[app]?.[view]||({nervis:'nominal',sirvis:'loading',ravis:'ranking',clarvis:'thinking',miku:'neutral'})[app]}
function syncFrameState(frame){const app=frame.dataset.avatar;const wanted=desiredAvatarState(app,app==='clarvis'?state.view:state.view);try{frame.contentWindow.setState(wanted)}catch(e){/* canonical initial state remains until the frame is ready */}}
function hydrateAvatarFrames(){document.querySelectorAll('iframe[data-avatar]:not([data-ready])').forEach(frame=>{const app=frame.dataset.avatar;const presentation='<style>html,body{width:340px!important;height:340px!important;min-height:0!important;margin:0!important;padding:0!important;display:block!important;overflow:hidden!important;background:transparent!important}.stage{width:340px!important;height:340px!important;margin:0!important}.controls,.status,.quip{display:none!important}</style>';frame.onload=()=>syncFrameState(frame);frame.srcdoc=atob(AVATAR_SOURCE_B64[app]).replace('</head>',presentation+'</head>');frame.dataset.ready='true'})}
/* The Clarvis extension panel uses the same canonical avatar as the header. */
/* Embedded, the extension renders its chat panel WITHOUT an avatar: one butler
   per screen, and he lives in the header with the other three. Standalone VS Code
   is unaffected and keeps the panel avatar — the extension decides which, from
   the host signal described at CLARVIS_BRIDGE. */
function replaceClarvisPanelAvatar(){const old=document.querySelector('.mini-butler');if(old)old.remove()}
/* Embedded, the header carries him. In focus mode there is no header, so the panel
   does — which is also what the extension does when it runs in a plain editor. */
function syncPanelAvatar(){
 const chat=document.querySelector('.clarvis-chat');if(!chat)return;
 const has=chat.querySelector('iframe[data-avatar="clarvis"]');
 const want=document.body.classList.contains('zen');
 if(want&&!has){chat.insertAdjacentHTML('afterbegin',
   '<div class="panel-avatar-wrap">'+avatarFrame('clarvis','panel-avatar')+'</div>');hydrateAvatarFrames()}
 else if(!want&&has)has.closest('.panel-avatar-wrap')?.remove()}
/* ══ API ═══════════════════════════════════════════════════════════════════
   One method per real endpoint, each returning exactly the shape its owning
   spec defines. Wiring this to live services is mechanical:

     1. delete the `return` body
     2. `return (await fetch(BASE.sirvis + '/api/v1/models')).json()`

   about the render path changes when the body starts doing real I/O. Field
   names are the contract ones, not display ones — rename at the view, never
   here, or the swap stops being mechanical.

   Endpoints are cited per method. Anything not cited does not exist yet and is
   a STOP item, not an invitation to invent one. */
/* Ports come from ECOSYSTEM_RUNBOOK.md §5, which assigns them because they cross
   product boundaries. Hardcoding them is correct *here* — this file opens from disk
   with no configuration — and wrong in a real client, which reads its peers from
   configuration or the registry. NERVIS is same-origin because it serves this page;
   its own default is 127.0.0.1:8711. The Clarvis Bridge port is per extension host,
   so 7071 is only the first instance. */
/* ── Reading a real service, without ever depending on one ──────────────────
   Every method in `API` models one endpoint. `live()` lets a method *try* that
   endpoint and fall back to its own mock when anything at all goes wrong — the
   service is down, the port moved, the origin is not allow-listed, the body is
   not what we expected.

   That fallback is the property this page cannot lose: it opens from disk with
   nothing running, and a `fetch` that threw and stopped the render would
   destroy that silently for everyone not currently running the service under
   test. So the failure path is the *default* path, not an afterthought.

   Reading from a file:// page sends `Origin: null`, which RAVIS refuses — so
   opening this from disk always shows mocks. Serve it over http and allow that
   origin to see real data; `README.md` has the two commands.

   `SOURCE` records which happened, per service, so a screen can say so rather
   than leaving the reader to guess whether a number is real. */
const SOURCE={};
const LIVE_TIMEOUT_MS=1500;
/* What NERVIS's registry last published beside the entries: §5.2's negotiated
   operations, and any endpoint its SSRF guard refused. Empty until a live read
   fills them, so a screen must treat empty as "not read" rather than "none". */
/* §11.2's filters, held across renders. A filter that reset every time the
   screen repainted would be unusable on a live feed, which repaints. */
const EVENT_FILTERS={service:'',severity:'',event_type:'',text:''};
function setEventFilter(name,value){
 EVENT_FILTERS[name]=EVENT_FILTERS[name]===value&&name!=='text'?'':value;
 render();
}
function clearEventFilters(){
 for(const k of Object.keys(EVENT_FILTERS))EVENT_FILTERS[k]='';
 render();
}

let OPERATIONS=[];
let REFUSED=[];
let REGISTRY_ROWS=[];
/* When the registry was last read, so a reading can say how old it is instead
   of implying it is current. 0 means never. */
let REGISTRY_AT=0;

/* One place that writes what a registry body means, because two callers need
   it: the Overview's own read, and the poll that keeps the status bar true on
   screens that never read the registry at all. */
function absorbRegistry(d){
 SOURCE.nervis='live';
 /* The registry's own view of each peer replaces the hard-coded SERVICES map
    wherever one is live. `capable()` reads that map, so this is what makes
    control gating real rather than a promise. */
 for(const e of d.items){
  if(SERVICES[e.key]){
   SERVICES[e.key].state=e.state;
   SERVICES[e.key].caps=Object.entries(e.capabilities||{})
     .filter(([,state])=>state==='available'||state==='degraded').map(([id])=>id);
  }
  if(e.state==='healthy'||e.state==='degraded')SOURCE[e.key]='live';
 }
 OPERATIONS=d.operations||[];
 REFUSED=d.refused||[];
 /* `quiet` is an optional peer that has never answered — absent rather than
    broken. Without it a machine with LM Studio and no Ollama reads "Ollama
    unreachable" in the status bar forever, which is an alarm about software
    that was never installed. */
 REGISTRY_ROWS=d.items.map(e=>({label:e.label,state:e.state,
   quiet:e.awaiting_first_contact===true}));
 REGISTRY_AT=Date.now();
}

/* ── One negotiated read of a RAVIS surface, through NERVIS (M3, §8) ────────
   NERVIS checks the capability before it calls, so a surface RAVIS has not
   advertised produces **no request at all** rather than a 404 this page then
   has to interpret — §5.2's gate is "never calls a guessed endpoint", and a
   check that lives in this file is one that anything not this file can skip.

   Every outcome has the same shape: `{available, reason, availability, data}`.
   `data` is null on every failure and never an empty list, because an empty
   list means *RAVIS has none of these* and confusing the two is how a screen
   renders a confident zero over an outage. */
async function peerRead(service,surface,params,method){
 const q=method==='POST'?'':new URLSearchParams(params||{}).toString();
 try{
  const r=await fetch(BASE.nervis+'/api/v1/'+service+'/'+surface+(q?'?'+q:''),
    method==='POST'
      /* Thirty seconds for a POST, against the ordinary 1.5. The only POST
         surface is §14.3's recommendation, which reads every evidence record
         for the roles asked about — slow enough that the read timeout would
         abort a working call. */
      ? {method:'POST',headers:{'content-type':'application/json'},
         body:JSON.stringify(params||{}),signal:AbortSignal.timeout(30000)}
      : {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return await r.json();
 }catch(e){
  /* NERVIS itself is not answering — which, since it serves this page, mostly
     means this file was opened from disk. Distinct from RAVIS being down, and
     said differently, because the two need different things done about them. */
  return{surface,available:false,availability:'unknown',data:null,
         reason:'NERVIS is not answering, so nothing negotiated this read'};
 }
}

/* The two peers, spelled the way each screen reads best. One implementation,
   because a second copy of the envelope handling would drift and a screen would
   then need to know which service it was talking to in order to read a
   failure. */
const ravisRead=(surface,params)=>peerRead('ravis',surface,params);
const sirvisRead=(surface,params,method)=>peerRead('sirvis',surface,params,method);

async function live(service,path,mock,adapt){
 try{
  /* A refused connection fails instantly; a filtered port hangs forever. The
     timeout is what stops the second case turning into a blank screen. */
  const stop=new AbortController();
  const timer=setTimeout(()=>stop.abort(),LIVE_TIMEOUT_MS);
  let payload;
  try{
   const response=await fetch(BASE[service]+path,{signal:stop.signal});
   if(!response.ok)throw new Error('HTTP '+response.status);
   payload=await response.json();
  }finally{clearTimeout(timer)}
  const adapted=adapt(payload);
  SOURCE[service]='live';
  return adapted;
 }catch(failure){
  SOURCE[service]='mock';
  return mock();
 }
}

/* GET /api/v1/route-decisions → the shape the Routes table already reads.
   Contract names stay in `API`; this is the rename-in-the-view boundary.

   **`execution_path` is now read rather than blanked.** This said it "is not
   published — RAVIS has only built Path A, and asserting TRANSPARENT_OPENAI
   here would be this page claiming something the API never said". Path B
   shipped at M4 and `execution_path` is on every decision record; NERVIS.md §8
   makes showing it mandatory, because *transparent versus translated* is the
   one thing a compatibility regression turns on. Blanking a field the API
   started publishing is the same failure as inventing one, in the direction
   nobody checks.

   `ttft_s` stays empty and stays honest: it is not per-decision. It exists per
   *target* on /api/v1/health, and averaging one into this column would be
   manufacturing a number. It renders as an em dash. */
function recentDecisions(payload){
 const outcome=d=>{
  if(!d.selected)return 'NO_ROUTE';
  const attempts=(d.execution&&d.execution.attempts)||[];
  if(!attempts.length)return 'PENDING';
  const last=attempts[attempts.length-1].outcome;
  return last==='succeeded'?'OK':last.toUpperCase();
 };
 return{items:payload.items.map(d=>({
  pool:d.pool||d.requested,
  model:d.selected,
  execution_path:d.execution_path||null,
  ttft_s:null,
  result:outcome(d),
  reason:d.reason}))};
}
const BASE={sirvis:'http://127.0.0.1:8721',ravis:'http://127.0.0.1:8731',
            nervis:'',clarvis:'http://127.0.0.1:7071'};

/* Live SIRVIS, or null when it is not there.

   Null rather than a throw, because absence is a state on this page and not an
   error: every caller below falls back to the transcription and says which one
   it drew. The timeout is short on purpose — a dashboard that hangs for thirty
   seconds because a service is down is worse than one that says it is down. */
async function liveSirvis(path){
 try{const r=await fetch(BASE.sirvis+path,{signal:AbortSignal.timeout(2000)});
     return r.ok?await r.json():null}
 catch(e){return null}}

/* One stored benchmark result as this page's evidence record.

   The same pattern as `lmstudioBuilds()`: a real payload mapped onto the record
   shape the views already read, rather than the views rewritten around a second
   vocabulary. The engine's envelope is the authority — `metrics` there is an
   object per measure carrying median, spread, every repetition and its
   provenance, and this takes the median because that is what a table cell can
   hold. The rest stays one request away at /api/v1/benchmark-results/{id}.

   **Four measures are deliberately absent.** `tool_calls`, `code`, `fib` and
   `follow_up` come from capability suites SIRVIS cannot run yet (M13, M18), so
   a live record carries no such fields and the views render them as absent.
   Filling them from the transcription would put measured and transcribed
   numbers in one row with nothing to tell them apart. */
function sirvisEvidence(result){
 const t=result.target||{}, med=n=>result.metrics&&result.metrics[n]
   ? Math.round(result.metrics[n].median*100)/100 : null;
 /* A trial rate as the [passed,total] pair the tables render, or null when the
    trials did not run. Never a zero pair: "nobody asked" and "asked eight times
    and failed" are different findings, and only one is about the model.

    Defined here beside `med` because this is the closure that reads `result`.
    An earlier edit put both helpers next to a *different* `med` one function
    over, which reads `e` — so the names the call site needed did not exist and
    the screen threw `rate is not defined`. Two helpers with the same job in
    neighbouring scopes is how that happens. */
 const rate=n=>{const b=(result.metrics||{})[n];
   return b&&typeof b.total==='number'&&b.total?[b.passed,b.total]:null};
 const followup=()=>{const f=(result.metrics||{})['tool_followup_used_result'];
   if(!f||!f.total)return null;
   const m=(((f.provenance||{}).notes)||'').match(/outcome: (.+)$/);
   return m?m[1]:(f.passed?'used-result':null)};
 return{evidence_type:result.evidence_type,role:result.role,
  target:{family:t.model_family,
          variant:[t.format,t.quantization].filter(Boolean).join(' ')||dash(t.variant),
          runtime:t.runtime,lmstudio_id:result.target_key,
          runtime_config:t.runtime_config||{}},
  samples:result.samples,
  /* Effective rate is not derivable from this envelope — it needs the token
     count against total latency, and the envelope publishes a rate rather than
     a count. Absent beats invented. */
  metrics:{generation_tok_s:med('generation_tokens_per_second'),
           first_token_s:med('time_to_first_token_seconds'),
           /* M13's trial rates. `EvidenceRecord.as_dict()` merges rates into
              `metrics` beside the measurements, so a rate arrives here as
              {passed,total} rather than a median — which is the distinction
              §13.2 draws: a median over ones and zeros means nothing, and 6/8
              versus 60/80 are different amounts of evidence for one rate.

              Absent on every record until a `clarvis-agent` role run has been
              made, because nothing else asks a build to call a tool. */
           tool_calls:rate('tool_call_well_formed'),
           follow_up:followup()},
  validity:result.validity,warnings:result.validity_notes||[],
  evidence_id:result.evidence_id,measured_at:result.created_at,
  caveat:null,note:null,live:true}}

     · granite-4.0-h-tiny on MLX advertises tool_use and loses the arguments of
       seven calls in eight. Trusting the flag would route an agent to a build
       that cannot ask for a file.

   Unmeasured builds fall back to the claim, and carry UNKNOWN evidence so nothing
   downstream mistakes the fallback for a result. */
const toolsWork=b=>b.measured&&b.measured.tools
 ?b.measured.tools[0]===b.measured.tools[1]
 :b.tools_advertised;

/* Maps LM Studio's model record onto the identity SIRVIS files evidence under:
   family, build/variant, runtime, runtime configuration. LM Studio's `id` is not
   that identity — it is a catalogue key — so the two are kept apart rather than
   one standing in for the other.

   `tool_use` is load-bearing far past this file: RAVIS's clarvis-agent pool holds
   tools as a hard invariant, so a build that does not advertise it is ineligible
   there no matter how good it is at the work. */
function lmstudioBuilds(payload=LMSTUDIO_SNAPSHOT){
 return payload.data.filter(m=>m.type!=='embeddings').map(m=>{
  const over=SCENARIO_LOADED[m.id]||{};
  const family=m.id.includes('/')?m.id.split('/')[1]:m.id;
  return{model_artifact_id:'ma_'+m.id.replace(/[^a-z0-9]+/gi,'_').toLowerCase(),
   lmstudio_id:m.id,family,
   variant:(m.compatibility_type==='mlx'?'MLX ':'GGUF ')+m.quantization,
   source:m.publisher,runtime:m.compatibility_type==='mlx'?'mlx':'llama.cpp',
   architecture:m.arch,params_b:LMSTUDIO_PARAMS[m.id],size_gb:LMSTUDIO_SIZES[m.id],
   /* max_context_length is the ceiling the build supports; context_length is what
      it was actually loaded with, which only exists once it is loaded. */
   runtime_config:{max_context_length:m.max_context_length,
                   context_length:over.state?Math.min(m.max_context_length,32768):null},
   /* Two different claims about the same thing, deliberately not merged.
      `tools_advertised` is LM Studio's capability array — metadata. `measured` is
      what a run of ../clarvis/docs/benchmarks.md observed. They disagree about
      four builds here, so collapsing them into one boolean would either exclude
      builds that demonstrably work or admit one whose calls are being discarded. */
   tools_advertised:!!(m.capabilities&&m.capabilities.includes('tool_use')),
   measured:BENCHMARK[m.id]||null,
   vision:m.type==='vlm',
   state:over.state||'stopped',resident_gb:over.resident_gb||null}})}

const API={
 sirvis:{
  /* GET /api/v1/models — installed builds, derived from the LM Studio snapshot
     above. Identity is family + variant + runtime + config; `state` is SIRVIS's
     closed runtime enum, mapped from LM Studio's own `state` field. */
  /* GET /api/v1/models -> the build row this page's tables already read.

     Four fields the API does not carry, each rendered absent rather than
     defaulted, because every default here would be a positive claim:

       size_gb           nothing records an installed size — LM Studio's
                         catalogue does not report one, so `installed_size_bytes`
                         is declared and never populated.
       resident_gb       the Resource Manager counts references, not bytes.
       measured          throughput and tool reliability live on evidence
                         records, not on a build; the Results screen has them.
       tools_advertised  SIRVIS's inventory does not republish LM Studio's
                         capability list, so "advertises nothing" is unknowable
                         here and must not be printed as `none`.

     `runtime` is derived from `runtime_format` and stops at absence: a null
     format is not llama.cpp, it is a format nobody reported. Same rule the
     variant string follows one line down. */
  async models(){return live('sirvis','/api/v1/models',this._modelsMock,payload=>({
   snapshot_revision:payload.snapshot_revision,
   items:payload.items.map(m=>{const v=m.variant||{};
    const instances=m.instances||[];
    return{
     model_id:m.runtime_key,
     /* Both carried because they answer different questions: `local_model_id`
        addresses one installed build, and `variant_id` is what evidence is
        keyed by — §12.2 forbids evidence keyed by model, so "this build's
        measurements" is a variant query, not a model lookup. */
     local_model_id:m.local_model_id,
     variant_id:v.variant_id,
     family:(m.family&&m.family.display_name)||m.display_name,
     variant:[v.runtime_format&&v.runtime_format.toUpperCase(),v.quantization].filter(Boolean).join(' ')||null,
     runtime:v.runtime_format==='mlx'?'mlx':v.runtime_format==='gguf'?'llama.cpp':null,
     state:m.is_loaded?'loaded':'stopped',
     instance_count:instances.length,
     runtime_config:{
      context_length:instances.length?instances[0].effective_context:null,
      max_context_length:m.declared_context?m.declared_context.value:null},
     size_gb:null,
     resident_gb:null,
     measured:null,
     tools_advertised:null,
     vision:null}})}))},

  async _modelsMock(){return{snapshot_revision:412,items:lmstudioBuilds()}},

  /* GET /api/v1/benchmark-results — EvidenceRecord per SIRVIS.md §12.3, built
     from the real suite in ../clarvis/docs/benchmarks.md rather than written out.

     There is deliberately no `score`. Two of the four accuracy measures did not
     discriminate at all — code was 6/6 for every model including the 1.8 GB one,
     tool calls were clean for everything that reached the table — and a composite
     that averages a measure with no variance in it manufactures a difference the
     run did not find. What varied was rate, first token, and behaviour on the
     second turn, so those are what the record carries. Ranking is RAVIS's job
     from these measures, not a number SIRVIS hands over pre-decided. */
  async evidence(){
   /* Live SIRVIS first. Every stored run carries its results inline, so one
      request answers the whole screen; when nothing answers, the transcription
      below stands in and `source` says so on screen. */
   const live=await liveSirvis('/api/v1/benchmark-runs?limit=50');
   if(live&&live.items.length){
    /* One row per *identity*, not per run. §12.2 keys evidence on the machine,
       the build, the runtime configuration, the role and the suite — so two
       runs of one suite against one build are two results and one evidence ID,
       and this table wants the current answer rather than the history. Runs
       arrive newest first, so the first sighting of an ID is the latest.

       Deliberately not deduplicated by build name: the same weights measured at
       a different context are a different identity and belong on their own row,
       which is the whole reason the configuration is in the key. */
    const seen=new Set(),items=[];
    for(const run of live.items)for(const result of run.results||[]){
     const rec=sirvisEvidence(result);
     if(seen.has(rec.evidence_id))continue;
     seen.add(rec.evidence_id);items.push(rec)}
    return{source:'live',items}}
   const builds=lmstudioBuilds().filter(b=>b.measured);
   const rec=(b,role)=>({
    evidence_type:'MEASURED',role,
    target:{family:b.family,variant:b.variant,runtime:b.runtime,lmstudio_id:b.lmstudio_id,
            runtime_config:{context_length:32768}},
    samples:b.measured.samples,
    metrics:{first_token_s:b.measured.first_token_s,
             generation_tok_s:b.measured.gen_tok_s,effective_tok_s:b.measured.eff_tok_s,
             tool_calls:b.measured.tools,follow_up:b.measured.follow_up,
             code:b.measured.code,fib:b.measured.fib},
    /* A measurement is valid or not on its own terms; a caveat is a true thing
       about the result that no number in it expresses. They are different fields
       because a reader who only sees VALID has not seen the whole record. */
    validity:b.measured.tools[0]===b.measured.tools[1]?'VALID':'VALID_WITH_WARNINGS',
    warnings:b.measured.tools[0]===b.measured.tools[1]?[]:['tool calls discarded by the runtime'],
    caveat:b.measured.caveat||null,note:b.measured.note||null});
   return{items:[
    /* The agent role is builds that write files; chat carries everything else and
       is where the deadlines live. The same build measured for two roles is two
       records, because the roles ask different things of it. */
    ...builds.map(b=>rec(b,'clarvis-agent')),
    /* Not benchmarked at all — present and empty on purpose. An absent row would
       read as "nothing wrong here", and a zero would read as "measured and bad". */
    {evidence_type:'UNKNOWN',role:'clarvis-agent',
     target:{family:'qwen3-1.7b',variant:'MLX 8bit',runtime:'mlx',lmstudio_id:'qwen/qwen3-1.7b',
             runtime_config:{}},
     samples:0,metrics:{},validity:null,warnings:[],
     caveat:'installed and never run — it advertises tool_use and nothing has checked',note:null}]}},

  /* GET /api/v1/benchmark-runs?result={id} — the detail behind one headline.

     The individual takes live in the harness output (`n_*.json` in the
     clarvis-firstrun repository) and were not copied into this snapshot, so this
     endpoint returns what the write-up retained: the medians, the sample count,
     the warmups that were run and discarded, and the control re-measurement.

     That control is the honest substitute for showing three bars. The same model
     was re-run the same evening after the machine had been working, and came back
     within 3.4% — which is what makes the granite rows measured later in the day
     comparable to the ones above them at all. On a fanless machine a table
     assembled across two days flatters or punishes for reasons that are not the
     model. */
  async runs(){
   const live=await liveSirvis('/api/v1/benchmark-runs?limit=1');
   if(live&&live.items.length){const r=live.items[0],e=(r.results||[])[0]||{};
    /* Both consumers of this method — the SIRVIS dashboard card and the
       Results run-detail card — read `x.median`, so every measure is an object
       whether or not it has a number in it. `effective_tok_s` never does: it
       needs a token count against total latency and the envelope publishes a
       rate rather than a count. Null median, guarded at both display sites,
       beats a plausible number nobody measured. */
    const med=n=>(e.metrics||{})[n]?Math.round(e.metrics[n].median*100)/100:null;

    return{source:'live',suite:(e.suite||{}).id,version:(e.suite||{}).version,
     role:e.role,target:e.target_key,samples:e.samples,
     generation_tok_s:{median:med('generation_tokens_per_second')},
     first_token_s:{median:med('time_to_first_token_seconds')},
     effective_tok_s:{median:null},
     /* A control is a property of a *sweep*, not of a run. Today's cooled sweep
        bracketed itself with one; the engine records runs, so a live detail has
        none and the cards say so rather than printing a drift nobody measured. */
     control:null,
     /* Warmups are run and discarded by the engine and are not published in the
        envelope, so this says that rather than printing a number it does not
        have. */
     warmups:'run and discarded — not carried in the envelope',parallel:1,
     raw_runs:r.results_path||'written beside the run',validity:e.validity}}
   return{suite:'clarvis-agent',version:1,role:'clarvis-agent',
   target:'qwen2.5-coder-7b-instruct · MLX 4bit',
   warmups:2,samples:3,parallel:1,
   generation_tok_s:{median:29.5},effective_tok_s:{median:27.0},ttft_s:{median:0.22},
   first_token_s:{median:0.26},
   control:{generation_tok_s:28.5,when:'same evening',drift_pct:3.4},
   measures:{code:[6,6],fib:[6,6],tool_calls:[8,8],follow_up:'used-result'},
   raw_runs:'retained by the harness, not in this snapshot',
   validity:'VALID'}},

  /* GET /api/v1/benchmark-jobs — states are the closed contract enum. The
     internal phase rides in `detail`; consumers switch on `state`. */
  async jobs(){
   /* There is no queue. §11.10's coarse state enum is real and stored on every
      run, but the queue behind it — submit, pause, retry, reorder, survive a
      restart — is unbuilt, and so is `/api/v1/benchmark-jobs`. What exists is
      the run history, and a run carries the same contract state a job would.
      So this maps runs onto the job record rather than inventing an endpoint,
      and the screen says which it is looking at. */
   const live=await liveSirvis('/api/v1/benchmark-runs?limit=25');
   if(live&&live.items.length)return{source:'live',items:live.items.map(r=>{
    const e=(r.results||[])[0]||{},s=e.suite||{};
    return{job_id:r.run_id,state:r.state,detail:r.detail||null,
     suite:s.id?s.id+'@'+s.version:'—',target:dash(e.target_key),
     /* Null, not zero. A run is created already running and either finishes or
        does not; nothing publishes a fraction, and a zero bar would claim a job
        that had started and achieved nothing. */
     progress:null,submitted:(r.started_at||'').slice(11)||r.started_at}})}
   return{items:[
   {job_id:'bj_5521',state:'running',detail:'warming_up',suite:'clarvis-agent@1',
    target:'granite-4.0-h-tiny · GGUF Q4_K_M',progress:0.6,submitted:'10:24:02'},
   {job_id:'bj_5520',state:'succeeded',detail:null,suite:'clarvis-chat@1',
    target:'qwen2.5-coder-7b-instruct · MLX 4bit',progress:1,submitted:'10:11:47'},
   {job_id:'bj_5519',state:'partial',detail:'2 of 3 runs before thermal abort — fanless',suite:'clarvis-chat@1',
    target:'qwen2.5-coder-14b-instruct-mlx · MLX 4bit',progress:0.66,submitted:'09:52:10'},
   {job_id:'bj_5518',state:'failed',detail:'7 of 8 tool calls lost their arguments in the runtime',suite:'clarvis-agent@1',
    target:'granite-4.0-h-tiny · MLX 4bit',progress:0,submitted:'09:40:33'}]}},

  /* GET /api/v1/downloads — persistent jobs; a browser reload must not lose them.
     The completed and already_present rows are builds this machine really has, at
     their real size on disk. */
  async downloads(){return{disk_free_gb:501,items:[
   {download_id:'dl_88',variant:'Qwen3-Coder-30B-A3B · MLX 4bit',status:'downloading',bytes:9.4,total:17.2},
   {download_id:'dl_87',variant:'qwen2.5-coder-14b-instruct-mlx · MLX 4bit',status:'completed',bytes:8.33,total:8.33},
   {download_id:'dl_86',variant:'phi-4-mini-instruct · MLX 4bit',status:'already_present',bytes:2.18,total:2.18},
   {download_id:'dl_85',variant:'Llama-3.3-70B · GGUF Q4_K_M',status:'failed',bytes:12.0,total:39.6,
    error:'cancelled — 39.6 GB will not load in 24 GB of memory'}]}},

  /* GET /api/v1/machines/{id} — the snapshot every result is pinned to. Read from
     this machine: sysctl for the chip and memory, sw_vers for the OS, df for the
     disk, and `lms runtime ls` for the engine versions. */
  async machine(){
   /* The runtime list is a second endpoint, fetched alongside rather than
      nulled: SIRVIS publishes it at /api/v1/runtimes, and the System screen
      renders it. An empty list is a real answer (no runtime configured); a
      null one crashed the screen, which is how this was found. */
   let runtimes=[];
   try{
    const read=await sirvisRead('runtimes');
    if(read.available)runtimes=((read.data.items)||[]).map(x=>({
      name:x.runtime_key,
      version:x.version||`${x.model_count} builds · ${x.state}`}));
   }catch(e){runtimes=[]}
   return live('sirvis','/api/v1/system',this._machineMock,p=>{
   /* GiB, not decimal GB. This divided by 1e9 and rendered a 24 GB Mac as
      "25.8 GB" — technically correct and something nobody, including Apple,
      calls that machine. It also put two different totals for one machine on
      the System screen the moment NERVIS's own live sample landed beside it,
      because the runtime-set adapter below already used 1073741824. */
   const gb=b=>b==null?null:+(b/1073741824).toFixed(1);
   return{
    machine_id:p.machine_id,
    chip:p.chip,
    cpu_cores:p.cpu_cores,cpu_performance_cores:p.performance_cores,
    cpu_efficiency_cores:p.efficiency_cores,gpu_cores:p.gpu_cores,
    memory_gb:gb(p.unified_memory_bytes),
    available_gb:gb(p.memory_available_bytes),
    swap_gb:gb(p.swap_used_bytes),
    disk_free_gb:gb(p.disk_free_bytes),
    macos:p.os_description||p.os_version,
    thermal_state:p.thermal_state,
    /* Three fields SIRVIS does not report, left null rather than defaulted.
       `model` — it reads the *chip* (`Apple M5`), not the enclosure; nothing on
       the machine says "MacBook Air" to a sysctl.
       `system_baseline_gb` — the memory this machine uses at rest with LM Studio
       open before any model loads. That was *measured by hand*, not computed,
       and nothing detects it.
       `model_budget_gb` — derived from the baseline, so it inherits its absence.
       Each renders as unknown, because a fit decision made against a made-up
       budget is worse than one nobody made. */
    /* The machine's own name, and the board identifier §5.1 names as snapshot
       metadata. `model` was rendering "not detected" because SIRVIS never read
       either — it does now. The marketing name ("MacBook Air") is still absent
       and stays absent: it needs a lookup table that is wrong the week a new
       machine ships, and `Mac17,3` is exact. */
    hostname:p.hostname,
    model:p.model_identifier,
    sensitive_fields:p.sensitive_fields||[],
    system_baseline_gb:null,model_budget_gb:null,cooling:null,
    runtimes};
   })},

  async _machineMock(){return{machine_id:'mc_7a1f',model:'MacBook Air M5',chip:'M5',
   cpu_cores:10,cpu_performance_cores:4,cpu_efficiency_cores:6,gpu_cores:10,
   memory_gb:24,available_gb:12.1,swap_gb:0,macos:'27.0',disk_free_gb:501,
   /* Fanless, and that outranks the core count: sustained inference throttles, so
      a build that finishes quickly is worth more than one that scores better and
      grinds. Thermal state is read at the start and the end of every run. */
   cooling:'passive',thermal_state:'nominal',
   /* Measured with an ordinary working set open — editor, browser, LM Studio
      itself — before any model loaded. The usable budget for models is about
      14 GB, not 24, and every fit decision on this machine is against that. */
   system_baseline_gb:7.6,model_budget_gb:14,
   runtimes:[{name:'LM Studio',version:'0.4.21+2'},{name:'llama.cpp',version:'2.29.1'},
             {name:'MLX',version:'mlx-llm-mac-arm64-apple-metal-advsimd-1.11.0'}]}},

  /* POST /api/v1/recommendations — ranked WITH exclusions and uncertainty, never
     a bare winner. SIRVIS suggests; RAVIS decides.

     This is the benchmark's own conclusion, including the part that is still
     open: a build that may beat the recommendation has not been through the full
     suite, and the ranking does not move until it has. An engine that hid that
     would be more decisive and less useful. */
  /* POST /api/v1/recommendations -> the ranked/excluded shape this screen reads.

     Live, the two things this page most wants are usually absent, and both are
     rendered as absences rather than filled:

       fit / headroom  §14.2's tiers exist and their input does not — nothing
                       records an installed size — so every tier is UNKNOWN.
       a second role   a pair needs chat evidence, and nothing has measured the
                       clarvis-chat role on this machine.

     `coverage` is the field to read first. The agent profile puts 35% of its
     weight on coding and 15% on reasoning, and no suite measures either, so a
     live score rests on 45% of its own profile. The mock has none of that
     because it was written when the numbers were transcribed rather than
     computed. */
  async recommendations(){
   try{
    /* Through NERVIS since M5, which negotiates `sirvis.recommendations` before
       calling. The four-second timeout became thirty in `peerRead`: this reads
       every evidence record for the roles asked about, and the read timeout was
       aborting calls that were working. */
    const read=await sirvisRead('recommendations',
      {profile:'clarvis',roles:['clarvis-chat','clarvis-agent'],mode:'verified'},'POST');
    if(!read.available)throw new Error(read.reason);
    const d=read.data;
    SOURCE.sirvis='live';
    const ranked=Object.entries(d.roles).filter(([,u])=>u).map(([role,u],i)=>({
      rank:i+1,target:u.runtime_key,role,
      fit:d.fit.tier,headroom_gb:null,
      evidence_type:'MEASURED',samples:null,coverage:u.coverage,
      why:`score ${u.score} on ${Math.round(u.coverage*100)}% of the profile — `
         +Object.entries(u.axes).map(([k,v])=>`${k} ${v}`).join(', ')
         +`. No evidence for: ${Object.keys(u.missing).sort().join(', ')||'nothing'}`}));
    const excluded=Object.entries(d.excluded).flatMap(([role,items])=>items.map(e=>({
      target:e.runtime_key,why:`${role} · ${e.reasons.join('; ')}`})));
    return{profile:d.profile,generated_at:d.generated_at.slice(0,16).replace('T',' '),
      algorithm_version:d.algorithm_version,mode:d.mode,
      expires_in_min:Math.round(d.expires_after_seconds/60),
      ranked,excluded,uncertainty:d.uncertainty,
      proposed:d.proposed_benchmarks||[],live:true};
   }catch(e){return this._recommendationsMock()}},

  async _recommendationsMock(){return{profile:'clarvis',generated_at:'20 Aug 2026',algorithm_version:2,
   mode:'verified',expires_in_min:45,
   ranked:[
    {rank:1,target:'qwen2.5-coder-7b-instruct · MLX 4bit',role:'clarvis-agent + clarvis-chat',
     fit:'IDEAL',headroom_gb:9.7,evidence_type:'MEASURED',samples:3,
     why:'0.26 s to first token, 29.5 tok/s, 8/8 tool calls, correct follow-up, 6/6 on both coding tasks, no invented facts. One model covers both roles at 4.3 GB'},
    {rank:2,target:'granite-4.0-h-tiny · GGUF Q4_K_M',role:'clarvis-agent',
     fit:'IDEAL',headroom_gb:9.8,evidence_type:'MEASURED',samples:3,
     why:'twice the rate at 55.2 tok/s, 0.06 s to first token, 8/8 streamed calls, correct recovery — on eight requests and three recovery runs, not the full suite'},
    {rank:3,target:'meta-llama-3.1-8b-instruct · MLX 4bit',role:'clarvis-chat',
     fit:'GOOD',headroom_gb:9.5,evidence_type:'MEASURED',samples:3,
     why:'the closest thing to the character in the whole run, at 19.9 tok/s. Pair with rank 1 for 8.8 GB total'}],
   excluded:[
    {target:'granite-4.0-h-tiny · MLX 4bit',
     why:'MEASURED · 1 of 8 tool calls survived — the MLX runtime discards them. The GGUF build of the same model is rank 2'},
    {target:'ministral-8b-instruct-2410 · MLX 4bit',
     why:'MEASURED · agent role only. Correct alone, and its follow-up degraded to no-call and gave-up in both co-resident pairings'},
    {target:'lfm2.5-2.6b-mlx · MLX 4bit',
     why:'MEASURED · chat role only. Forced reasoning: 5.5 s to first token alone and 11.1 s co-resident, against a 2 s deadline'},
    {target:'qwen2.5-coder-14b-instruct-mlx · MLX 4bit',
     why:'MEASURED · identical accuracy to rank 1 at 9.6 tok/s against 29.5 — three times slower for no measured gain'},
    {target:'Qwen3-Coder-30B-A3B · MLX 4bit',
     why:'DOES_NOT_FIT · 17.2 GB against a 14 GB budget once the system baseline is counted. Not rejected on merit and never tested'}],
   /* A list, because that is what SIRVIS publishes and what the live adapter
      passes straight through. It was one long string here, and `.length` on a
      string is truthy — so the guard passed and `.map` threw, blanking this
      screen for anyone whose SIRVIS was not running. Which is the exact
      condition this page promises to survive. */
   uncertainty:['rank 2 rests on a partial suite and could displace rank 1 once it has been run properly — it is faster on every figure taken so far',
                'rank 3 is chosen for tone, and it invented \"one commit ahead\" in a briefing the automated grounding check scored clean — a trade rather than a free upgrade']}},

  /* GET /api/v1/runtime-sets/{id} — combination evidence, which is the whole
     point: per-member numbers do not predict the pair.

     On this machine the memory answer was boring and the behaviour answer was
     not. Holding two builds costs almost nothing up to 12.9 GB resident, and
     every pairing still cleared the deadlines — but ministral-8b, which handles a
     failed tool call correctly when it is alone, stopped using the tool in both
     pairings it appeared in. Nothing in either build's own record predicts that,
     and no amount of single-model benchmarking would have found it. */
  /* Two endpoints, because the definition and the measurements live apart and
     should: GET /api/v1/runtime-sets is what somebody *declared*, and the pair
     numbers are on a benchmark result like any other measurement.

     Joined on the set NAME **and** the revision, both of which the matrix
     snapshots at run time. Name alone would let a revision-1 measurement
     describe a revision-3 definition — the thing §10's immutable-at-use rule
     exists to prevent, reintroduced in the presentation layer.

     Three absences:
       follow_up  no tool-call trial exists. `TrialRate` is declared on the
                  evidence record and constructed nowhere, so this column has no
                  source until M13. It is the most load-bearing column on the
                  screen, so it renders absent and says why rather than showing
                  a solo figure in a co-residency column.
       peak_gb    M10's matrix carries `memory` per condition, added *after* the
                  only run that exists — so this run's matrix has memory: null.
                  The figures are in that run's telemetry, not on this endpoint.
       pairs      one measured combination exists, not five. */
  async runtimeSet(){
   const [sets,runs]=await Promise.all([
     liveSirvis('/api/v1/runtime-sets'),
     liveSirvis('/api/v1/benchmark-runs?limit=50')]);
   const items=(sets&&sets.items)||[];
   if(!runs||!items.length)return this._runtimeSetMock();
   const measured=this._measuredMatrices(runs);
   if(!measured.length)return this._runtimeSetMock();
   const newest=measured[0];
   const set=items.find(s=>s.name===newest.m.runtime_set)||items[0];
   SOURCE.sirvis='live';
   return this._runtimeSetView(set,newest,
     this._matrixLens(newest,this._resultsByRole(measured,newest)));
  },

  /* Every stored result that carries an interaction matrix, newest first.
     Split out of `runtimeSet`, which measured cyclomatic complexity 30 — the
     highest in the file and nearly four times the gate the Python is held to.
     Almost all of it was optional-field shaping: `||{}` and `||[]` repeated at
     each of twenty reads. Those are genuinely branches, and no reader ever
     experienced them as thirty decisions, which is exactly why they
     accumulated unnoticed. */
  _measuredMatrices(runs){
   return ((runs&&runs.items)||[]).flatMap(run=>((run.results)||[])
     .filter(res=>res.interaction_matrix)
     .map(res=>({res,m:res.interaction_matrix})));
  },

  /* The result per role, for the newest matrix only.
     Keyed by revision as well as set name: two runs of the same Runtime Set at
     different revisions are different measurements, and merging them would
     read one revision's throughput under another's label. */
  _resultsByRole(measured,newest){
   const forRole={};
   for(const {res,m} of measured)
    if(m.runtime_set===newest.m.runtime_set&&m.revision===newest.m.revision)
     forRole[res.target_key]=res;
   return forRole;
  },

  /* One place where every optional field is defaulted, instead of twenty.
     The accessors below are the reason the complexity collapsed: `fig(role,
     cond)` states "a figure may be absent" once, and the twelve call sites
     that used to spell `(row.figures||{})[cond]||{}` inline now state nothing
     at all. */
  _matrixLens(newest,forRole){
   const m=newest.m,rows=m.rows||{};
   const roles=m.load_order||Object.keys(rows);
   const round=(n,d=2)=>n==null?null:Math.round(n*Math.pow(10,d))/Math.pow(10,d);
   const row=role=>rows[role]||{};
   const fig=(role,cond)=>(row(role).figures||{})[cond]||{};
   const build=role=>{const r=forRole[role];if(!r)return role;
    return [r.target.model_family,[r.target.format&&r.target.format.toUpperCase(),
      r.target.quantization].filter(Boolean).join(' ')].filter(Boolean).join(' · ');};
   return{roles,round,row,fig,build,
    gb:b=>b==null?null:round(b/1073741824,1),
    deg:role=>row(role).degradation_percent||{},
    conc:(m.memory||{}).concurrent||{},
    conditions:m.conditions||[],
    samples:fig(roles[0],'alone').samples||0,
    anyResult:forRole[roles[0]]||newest.res};
  },

  _runtimeSetMembers({roles,round,fig,deg,build}){
   return roles.map(role=>({
    role,family:build(role),
    alone_tok_s:round(fig(role,'alone').tokens_per_second,1),
    sequential_tok_s:round(fig(role,'sequential').tokens_per_second,1),
    concurrent_tok_s:round(fig(role,'concurrent').tokens_per_second,1),
    first_token_alone_s:round(fig(role,'alone').time_to_first_token,3),
    first_token_concurrent_s:round(fig(role,'concurrent').time_to_first_token,3),
    degradation:deg(role),
    follow_up_alone:null,follow_up_concurrent:null}));
  },

  /* Co-residency is three states, not two.
     This read `complete ? 'every member resident together' : 'FAILED — ' +
     co_residency_failure`, so a matrix that simply had not recorded the field
     rendered as **"FAILED — undefined"** — an unknown printed as a confident
     failure, which is the one thing every honesty rule in these specifications
     forbids. Found by the sparse fixture in `tools/shaping_fixtures.js`, on the
     first run of a check that had ever executed this branch. */
  _coResidency(m){
   if(m.complete===true)return 'every member resident together';
   if(m.complete===false)return `FAILED — ${m.co_residency_failure||'reason not recorded'}`;
   return 'not recorded';
  },

  _runtimeSetView(set,newest,lens){
   const m=newest.m;
   const {roles,round,fig,deg,gb,build,conc,conditions,samples,anyResult}=lens;
   return{
    runtime_set_id:set.runtime_set_id,name:set.name,revision:m.revision,
    evidence_type:anyResult.evidence_type,
    samples,
    combined_peak_gb:gb(conc.lowest_available_bytes),
    swap_gb:gb(conc.swap_used_bytes),
    complete:m.complete,
    co_residency_failure:m.co_residency_failure,
    conditions,
    members:this._runtimeSetMembers(lens),
    pairs:[{members:roles.map(build),
      peak_gb:gb(conc.lowest_available_bytes),
      first_token_s:roles.map(r=>round(fig(r,'concurrent').time_to_first_token,3)),
      follow_up:roles.map(()=>null),
      note:`${conditions.length} conditions · ${samples} repetitions each`}],
    validity:{measurement:anyResult.validity,
      notes:(anyResult.validity_notes||[]).join('; ')||'none recorded',
      basis:m.basis,
      co_residency:this._coResidency(m)},
    finding:roles.map(r=>`${r} lost ${round((deg(r).concurrent||{}).tokens_per_second,1)}% of its throughput under concurrent load`).join(', and ')};
  },

     rather than one — what the runtime advertises, what a measurement found, and
     which of the two RAVIS is acting on.
