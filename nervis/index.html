   from its neighbours. `win` is the trace window, so bars stay comparable. */
function spanBar(sp,win){const w=Math.max(sp.duration_ms/win*100,.4),l=sp.start_ms/win*100;
 return sp.missing?`<span class="gap" style="left:${l}%;width:${w}%"></span><b class="miss" style="left:${l+w+1}%">${escapeHtml(sp.label)}</b>`
                  :`<i style="left:${l}%;width:${w}%"></i><b style="left:${escapeHtml(Math.min(l+w+1,55))}%">${escapeHtml(sp.label)}${sp.duration_ms<100?' · '+sp.duration_ms+' ms':''}</b>`}
/* An event's time, at the grain a card can show.
   The hub records ISO-8601 with microseconds; the mock recorded "10:26:08".
   Both arrive here, and a card that printed the first raw would push the event
   type off the edge. */
function eventClock(at){
 const text=String(at||'');
 return text.includes('T')?text.slice(11,19):text;
}

/* The newest trace, or the honest absence of one.
   `empty` means NERVIS answered and has recorded nothing — a fact, and the
   card says so rather than drawing an invented waterfall over it. §11.2 forbids
   synthesizing a span as fact, and a card is not exempt from that because it
   is small. */
function overviewTraceCard(tr,mockBar){
 if(tr.empty)
  return `<div class="card wide live"><h3>Trace <span class="chip">none recorded</span></h3>
   <small class="mono dim">no trace has been recorded yet. A trace needs a <b>traceparent</b> on an inbound request, and NERVIS never manufactures one — a trace containing a single service is a fact about nothing. <b>RAVIS and SIRVIS do not publish events yet</b> (their Stage 7 milestones), so a cross-service waterfall needs those first.</small></div>`;
 /* Two span shapes reach this card and they are not interchangeable. The hub
    publishes `label`, `is_point`, `events` and an absolute `started`; the mock
    predates all of that and carries `service` and `start_ms`. Drawing one with
    the other's geometry is how a bar ends up at left 0, full width, with
    nothing thrown to say so. */
 const rows=tr.live?liveSpanRows(tr):(tr.spans||[]).map(sp=>`<div class="wf"><span>${escapeHtml(sp.service||'')}</span><div class="track">${mockBar(sp)}</div></div>`).join('');
 return `<div class="card wide${escapeHtml(liveClass(tr.live))}"><h3>Trace ${escapeHtml(String(tr.trace_id||'').slice(0,16))} <span class="chip">cross-service</span></h3>
   ${rows}
   <small class="mono dim">a missing span is drawn as missing, and one event is drawn as a moment rather than a zero-length bar. A gap invented as a duration would be worse than a hole.</small></div>`;
}

function liveSpanRows(tr){
 const win=tr.window_ms||0;
 const at=sp=>tr.started!=null&&sp.started!=null?(sp.started-tr.started)*1000:0;
 return (tr.spans||[]).map(sp=>`<div class="trace-step" style="align-items:center">
   <b style="min-width:88px">${escapeHtml(sp.label||'')}</b>
   <span style="flex:1;position:relative;height:16px">${waterfallBar(sp,win?at(sp)/win*100:0,win)}</span>
   <span class="mono dim" style="min-width:96px;text-align:right">${escapeHtml(sp.is_point?'one moment':(sp.duration_ms+' ms'))}</span></div>`).join('');
}


/* One entry per screen that is not the overview, the way RAVIS_VIEWS already
   does it. Was a chain of eight `if`s, which cost a branch per screen and put
   this function over the complexity ratchet the moment a ninth was added — the
   ratchet pointing at a dispatch table written out longhand. */
const NERVIS_VIEWS={'Chat':chatView,'Events':eventsView,'Notifications':notificationsView,
 'Diagnostics':diagnosticsView,'Traces':tracesView,'Settings':settingsView,
 'Ecosystem map':mapView,'System':systemView};

/* The Overview's two headline numbers, measured rather than asserted.

   Both were invented: the tiles read a fixed "128" and "0.42s" beside live
   service states — a rate nobody counted and a latency nobody timed, on the
   screen most likely to be glanced at and least likely to be questioned.

   Requests per minute is counted from the decision log's own timestamps, a
   real rate over a real window. That log is bounded and in memory, so this is
   *recent* traffic rather than all-time, and the tile's subtitle says which.

   Latency is the median of what RAVIS has actually timed — `OBSERVED_BY_RAVIS`
   in §13.3's vocabulary — across models past its sample floor. Models it has
   barely called are excluded rather than averaged in: a median of two calls is
   two numbers, and this is the tile someone would quote.

   Extracted because folding both into `nervis()` took it to 17 against a
   ratchet of 13. The measurement is not the screen. */
function throughput(obs,recent){
 const since=Date.now()-60000;
 const perMinute=(recent.items||[]).filter(d=>Date.parse(d.decided_at||'')>=since).length;
 const timed=(obs.items||[]).filter(o=>o.confident&&o.median_ttft_ms!=null)
   .map(o=>o.median_ttft_ms).sort((a,b)=>a-b);
 const p50=timed.length?timed[Math.floor(timed.length/2)]:null;
 /* The tiles as well as the figures, so the caller places them rather than
    re-deriving when a number is absent. Absence has two different sentences
    here — "RAVIS is not answering" and "nothing has been measured yet" — and
    they send a reader to different places. */
 return [
  ['Requests / min',recent.live?String(perMinute):'—',
   recent.live?'routed in the last 60s':'RAVIS not answering','ravis',recent.live],
  ['Latency p50',p50==null?'—':(p50/1000).toFixed(2)+'s',
   p50==null?'nothing measured past the sample floor'
            :`median TTFT across ${timed.length} model(s) RAVIS has timed`,
   'ravis',obs.live&&p50!=null],
 ];
}

/* §6.3's six interpreted states, in words rather than in the Bridge's spelling.

   Written out rather than prettified from the string, because the mapping is
   the honest place to say what each one means to a reader: `waiting_for_approval`
   is the only one that asks something of the person looking at it, and §6.7
   permits NERVIS to display exactly that fact and nothing more — no button.

   An unrecognised state is `unknown` with the reason NERVIS has, never a blank:
   a blank cell in this column reads as `idle`, which is a claim about a window
   nobody reached. */
const BRIDGE_DOING={idle:'idle',chatting:'answering',agent_running:'running a job',
  waiting_for_approval:'waiting for you',stopping:'stopping',failed:'failed'};

function bridgeDoing(row){
 const said=BRIDGE_DOING[row.activity];
 if(!said)return 'unknown'+(row.activity_detail?' · '+row.activity_detail:'');
 if(row.activity==='waiting_for_approval'&&row.awaiting)return said+' · '+row.awaiting;
 if(row.activity==='agent_running'&&row.steps_taken!=null)return said+' · step '+row.steps_taken;
 return said;
}

async function nervis(){
 const view=NERVIS_VIEWS[state.view];
 if(view)return view();
 heading('Ecosystem overview','What each service reports, when it said so, and how sure it is.',control('Run diagnostics','diagnose',' primary'));
 const [svc,inst,tr,ev,usage,obs,recent]=await Promise.all([API.nervis.services(),API.nervis.clarvisInstances(),
   API.nervis.trace(),API.nervis.events(),API.ravis.usage(),API.ravis.observations(),API.ravis.decisions(200)]);
 const measured=throughput(obs,recent);
 /* From the rows NERVIS just published, not from the fallback `SERVICES` map
    and not against a hardcoded four. §5.1 declares six entries and the map
    holds four, so the two disagreed the moment the registry went live. */
 const reach=reachability(svc);
 const bar=sp=>spanBar(sp,tr.window_ms);
 $('#content').innerHTML=kpis([...measured,
   /* `local_share`, not `local_pct`. The mock defines `local_pct` and RAVIS
      publishes `local_share`, so this tile read **undefined%** against a live
      RAVIS and the correct figure against nothing running — the one direction a
      mock fallback must never fail in. Rendered the way the RAVIS dashboard
      renders it: a share nobody has measured says so rather than showing 0%. */
   ['Local',usage.local_share==null?'not measured':Math.round(usage.local_share*100)+'%',
    usage.executed?`of ${usage.executed} executed`:'nothing routed yet','ravis',Boolean(usage.live)],
   /* `true` was written here literally, so the tile counted mock rows as
      reachable services on a page with nothing running. */
   ['Services',`${reach.live} / ${reach.expected}`,reach.note,'nervis',svc.live]])
 +`<div class="card wide${escapeHtml(liveClass(svc.live))}"><h3>Service registry</h3>
   <div class="table-row head five caps"><span>Service</span><span>Build</span><span title="The Minimal Ecosystem Protocol major version this peer publishes — the wire-format contract NERVIS negotiates before anything else. A number outside NERVIS's supported range would mark the whole peer incompatible, separately from any one capability being unavailable. Shown as '—' for a peer with no protocol surface, like a local runtime or code-server.">Protocol</span><span>Negotiated capability</span><span>State</span></div>
   ${svc.items.map(r=>`<div class="table-row five caps"><span>${escapeHtml(r.label)}</span><span class="mono">${escapeHtml(r.build_version)}</span><span class="mono">${escapeHtml(r.protocol_version?'proto '+r.protocol_version:'—')}</span><span class="mono" style="opacity:.7">${escapeHtml(r.capability)}${r.capability_source==='adapted'?' <i style="font-style:normal;opacity:.6">· adapted</i>':''}</span><span class="chip${['healthy','degraded'].includes(r.state)?'':(r.awaiting_first_contact?' dim':' warn')}">${r.awaiting_first_contact?'not configured':escapeHtml(r.state)}</span></div>`).join('')}
   <small class="mono dim">every control on this dashboard is bound to one of these capabilities. Unknown capability means the control is absent, not disabled-and-hopeful. <b>Read from NERVIS's own registry</b> — one call to <b>/api/v1/services</b>, not six from this browser. Until M2 this table was assembled here, which made every open of the page re-probe the ecosystem, put a stopped service's timeout in the render path, and left <i>stale</i> unobservable because nothing remembered a previous answer. NERVIS probes on a timer; these are §5.1's <b>observer-side</b> states — a service reports <i>healthy/degraded/unhealthy</i> about itself and NERVIS adds reachability, so "healthy" here means a truthful response <b>plus</b> reachability, never a successful connect. The capability shown is the first each reports as <i>available</i> rather than the first it declares. <b>Clarvis Bridge, LM Studio and Ollama publish no MEP surface</b>, so reachability is all that can honestly be claimed about them and no capability is inferred.</small></div>
  <!-- Read from the registry, like the Ecosystem map tab it is a smaller
       version of. It was five fixed nodes at fixed positions — RAVIS, SIRVIS,
       CLARVIS, LM Studio — drawn identically whatever the registry said, which
       is why this card carried a PROTOTYPE badge while the tab beside it was
       live. Ollama never appeared at all, and a node stayed green for a service
       that had been down for an hour. -->
  <div class="card narrow${escapeHtml(liveClass(svc.live))}"><h3>Ecosystem map</h3>
   ${topologyMap(ecosystemNodes(svc,inst),230,true)}
   <small class="mono dim">every node is a registry entry and every edge is a connection NERVIS holds. Red is a service that should be answering and is not — <b>an optional peer nobody has started is not drawn red</b>, because that is an absence rather than a fault. <b>The Clarvis Bridge node is read from registrations, never from an address</b>: its port is assigned per extension host and discovered when a window announces itself, so a configured address for it would be an assumption the runbook forbids. <b>LM Studio and Ollama draw as one node</b> — either answering is enough to serve a local model. The <b>Ecosystem map</b> tab has the same topology with the capability negotiation behind it.</small></div>
  <div class="card wide${escapeHtml(liveClass(inst.live))}"><h3>Clarvis instances</h3>
   ${inst.items.length?`<div class="table-row head five"><span>Instance</span><span>Endpoint</span><span>Registration</span><span>Doing</span><span>Lease</span></div>
   <!-- Every Bridge-supplied string is escaped. §6.1 is explicit that any local
        process can bind the port a Bridge would have used and impersonate one,
        so this is untrusted input arriving in NERVIS's own origin — and the
        event feed two hundred lines below escaped every field while this table
        escaped none.

        **Gated on the rows, not on the SERVICES map.** It read usable('clarvis')
        from the hard-coded fallback map, so a Bridge that had registered was
        hidden behind a banner whenever that map disagreed — the same defect
        found twice before on other screens. The rows are the live answer; if
        there are rows, there are Bridges. -->
   ${inst.items.map(c=>`<div class="table-row five"><span>${escapeHtml(c.label)}</span><span class="mono" style="opacity:.6">${escapeHtml(c.endpoint)}</span><span class="chip${warnUnless(c.live)}">${escapeHtml(c.state)}</span><span class="mono">${escapeHtml(bridgeDoing(c))}</span><span class="mono">${c.live?escapeHtml(String(c.expires_in))+'s':'—'}</span></div>`).join('')}
   <small class="mono dim">two editor windows, two extension hosts, two separate lifetimes — <b>never merged</b>, because §6.6 says an instance describes the host serving it. Each registered itself with the enrollment secret only this user can read, and holds a lease it renews; a window that closes stops counting within ${escapeHtml(String(inst.lease||45))}s. <b>No workspace path, file or token is stored</b> — the registration has no field for one. <b>Doing</b> is a second read, of each Bridge's own <b>/v1/status</b>, presenting the token NERVIS issued it — one window, one answer, never merged; a row NERVIS could not read says <i>unknown</i> and why, because a blank cell reads as <i>idle</i>. NERVIS reads these and never acts on them: it cannot resolve a gate, run a tool, or widen a workspace root — and <b>waiting for you</b> is displayed, never answered.</small>`
   :banner('No Clarvis Bridge has registered',inst.live?'NERVIS is answering and no editor window has announced itself. Registration is per extension host, so this is the ordinary state with no editor open. Clarvis itself is unaffected.':'NERVIS is not reachable from this page, so whether a Bridge is running is unknown.','info')}</div>
  <div class="card narrow${escapeHtml(liveClass(ev.live))}"><h3>Recent events</h3>${ev.items.slice(0,4).map(e=>`<div class="event"><time>${escapeHtml(eventClock(e.occurred_at))}</time><span class="mono">${escapeHtml(e.event_type)}</span></div>`).join('')}<small class="mono dim">identifiers and result classes only — no prompt, source, path or key.${ev.live?' Read from <b>NERVIS /api/v1/events</b>.':''}</small></div>
  ${overviewTraceCard(tr,bar)}
  <!-- **This card demonstrated the point it was making.** It set out to show
       that a service-reported fact, a NERVIS observation and an operator
       inference are three different things — and then printed a live figure
       from RAVIS beside "NERVIS timed 4.0 ms" and "0.9 ms is transport", both
       string literals. Nothing timed 4.0 ms. The subtraction was written by
       hand. A card explaining why numbers must not be stacked was stacking two
       invented ones under the labels "observation" and "inference".

       §9.8's routing overhead is not measured yet, so the honest card has one
       row and says what the other two would need. -->
  <div class="card narrow${escapeHtml(liveClass(usage.live))}"><h3>Diagnostics</h3>
   <div class="trace-step"><b>fact</b><span>${usage.live&&usage.routing_p50_ms!=null?`RAVIS reported ${escapeHtml(usage.routing_p50_ms)} ms`:'RAVIS has reported no routing time'}</span></div>
   <div class="trace-step dim"><b>observation</b><span>not measured — NERVIS does not time its own call to RAVIS</span></div>
   <div class="trace-step dim"><b>inference</b><span>needs both of the above; transport is their difference</span></div>
   <small class="mono dim">service-reported fact, NERVIS observation and operator inference are three different things and are never stacked into one number — so the two NERVIS has not measured say so instead of carrying a plausible figure. §9.8's routing overhead is the milestone that fills these in.</small></div>`}

/* ── EVENTS ────────────────────────────────────────────────────────────────
   The hub is operational telemetry, not the system of record: producers stay
   authoritative for their own domain. So this screen reports the *stream's*
   condition — buffer, drops, quarantine, gaps — alongside the frames, because a
   feed that silently lost events looks identical to a quiet one. */
/* The SSE connection, as a card.
   Its own function so `eventsView` stays under the gate, and because a stream
   that is connected-but-lossy is a state worth a sentence rather than a colour:
   `gaps` is the count of times this tab was told it had missed events, and a
   feed that looks continuous while having holes in it is the failure the whole
   gap mechanism exists to make visible. */
function streamCard(){
 const health=EVENTS.health();
 const age=EVENTS.since?Math.round((Date.now()-EVENTS.since)/1000):null;
 return `<div class="card narrow${EVENTS.state==='open'?' live':''}"><h3>Stream</h3>
  <div class="trace-step"><b>connection</b><span><span class="chip${health==='ok'?'':' warn'}">${escapeHtml(EVENTS.state)}</span></span></div>
  <div class="trace-step"><b>cursor</b><span class="mono">${escapeHtml(EVENTS.cursor||'—')}</span></div>
  <div class="trace-step"><b>delivered here</b><span class="mono">${escapeHtml(EVENTS.received)}</span></div>
  <div class="trace-step"><b>gaps</b><span><span class="chip${EVENTS.gaps?' warn':''}">${escapeHtml(EVENTS.gaps)}</span></span></div>
  ${age!=null?`<div class="trace-step"><b>connected</b><span class="mono">${escapeHtml(age)}s ago</span></div>`:''}
  ${EVENTS.detail?`<small class="mono dim">${escapeHtml(EVENTS.detail)}</small>`:
    '<small class="mono dim">the cursor is what a reconnect resumes from. A gap means the hub dropped this tab and some events were never delivered — they are not late, they are gone.</small>'}
  </div>`;
}

/* Which slice of the centre is on screen: what is still waiting, everything
   outstanding, or what has been dealt with.

   Page state rather than a stored setting: it is a way of looking at the list
   for a moment, not a preference about it.

   **Unread is a tab and not a filter checkbox** because it is the question the
   badge in the header asks. Clicking "9 unread" and landing on a list of forty
   notes, thirty-one of which were read last week, means finding the nine by
   eye. The tabs are also why `only_unread` had to be pushed into the SQL: the
   badge counts every unread note, this list is capped at fifty, and a tab that
   quietly showed fewer than the badge promised would be worse than no tab. */
let NOTES_TAB='unread';

/* Which notes are open, kept across a repaint. Without it a poll landing while
   somebody is reading collapses what they were reading, which §25.2 is
   emphatic about. */
const NOTES_OPEN=new Set();

/* Which notes are ticked. Cleared after every action, because a selection that
   outlives what it was for is how somebody dismisses a note they had forgotten
   was still checked. */
const NOTES_PICKED=new Set();

/* How long ago, in the units somebody actually reads at each distance. */
function noteAgo(stamp,now){
 const d=Math.max(0,(now-Date.parse(stamp||''))/1000);
 if(!isFinite(d))return '—';
 if(d<90)return `${escapeHtml(Math.round(d))}s ago`;
 if(d<5400)return `${escapeHtml(Math.round(d/60))}m ago`;
 if(d<172800)return `${escapeHtml(Math.round(d/3600))}h ago`;
 return `${escapeHtml(Math.round(d/86400))}d ago`;
}

/* The exact moment, for the case where "2h ago" is not the question. Local
   time rather than the stored UTC: somebody reading this is reconciling it
   against when they were at their desk. */
function noteExact(stamp){
 const d=new Date(stamp);
 return isNaN(d)?escapeHtml(stamp||'—'):escapeHtml(d.toLocaleString());
}

/* What a note holds beyond the one line the table shows. Its own function
   rather than part of the row: together they were one 16-branch expression,
   over the page's complexity ratchet, and they answer different questions —
   the row is the summary, this is the record. */
function noteDetail(n){
 return `<div class="note-more"><dl>
   ${n.body?`<dt>what was observed</dt><dd>${escapeHtml(n.body)}</dd>`:
     '<dt>what was observed</dt><dd style="opacity:.6">the producer recorded no further detail</dd>'}
   <dt>why you are told</dt><dd>${escapeHtml(n.reason)}</dd>
   <dt>filed by</dt><dd>${escapeHtml(n.source||'—')}${n.produced_by
     ?` · written by <b>${escapeHtml(n.produced_by.model)}</b>, costing ${escapeHtml(n.produced_by.cost)}`
     :' · observed directly, so no model wrote it'}</dd>
   <dt>kind</dt><dd>${escapeHtml(n.kind||'—')}</dd>
   <dt>filed at</dt><dd>${noteExact(n.created_at)}</dd>
   ${n.read_at?`<dt>read at</dt><dd>${noteExact(n.read_at)}</dd>`:''}
   ${n.dismissed_at?`<dt>dismissed at</dt><dd>${noteExact(n.dismissed_at)}</dd>`:''}
   <dt>reference</dt><dd style="opacity:.7">${escapeHtml(n.note_id)}</dd>
  </dl></div>`;
}

/* What can be done to one note, which is nothing once it has been dismissed. */
function noteActions(n){
 if(n.dismissed_at)return '<small class="mono dim">dismissed</small>';
 const read=n.unread
   ?`<button class="mode-chip" onclick="actOnNote('${jsAttr(n.note_id)}','read')">mark read</button>`:'';
 return `${read}<button class="mode-chip" onclick="actOnNote('${jsAttr(n.note_id)}','dismiss')">dismiss</button>`;
}

const NOTE_COLUMNS='grid-template-columns:2.4fr 2.6fr .7fr .9fr 1.4fr';

function noteRow(n,now){
 const open=NOTES_OPEN.has(n.note_id);
 const model=n.produced_by
   ?`<br><small class="mono dim">written by ${escapeHtml(n.produced_by.model)} · ${escapeHtml(n.produced_by.cost)}</small>`:'';
 return `<div class="table-row note-row${open?' note-open':''}" data-note="${escapeHtml(n.note_id)}"
    onclick="toggleNote(event,'${jsAttr(n.note_id)}')"
    style="${NOTE_COLUMNS}${n.dismissed_at?';opacity:.5':''}">
   <span><input type="checkbox" class="note-tick"${NOTES_PICKED.has(n.note_id)?' checked':''}
      aria-label="select this note" onclick="pickNote(event,'${jsAttr(n.note_id)}',this.checked)">
     <svg class="caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 2L6.5 5L3.5 8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
     <b>${escapeHtml(n.title)}</b>${n.unread?' <span class="chip">new</span>':''}</span>
   <span style="opacity:.8">${escapeHtml(n.reason)}${model}</span>
   <span><span class="chip${n.severity==='warning'||n.severity==='error'?' warn':''}">${escapeHtml(n.severity)}</span></span>
   <span class="mono" style="opacity:.7">${noteAgo(n.created_at,now)}</span>
   <span>${noteActions(n)}</span></div>${noteDetail(n)}`;
}

/* Three empty states, and they are three different facts. A page opened from
   disk cannot tell the user anything; a running NERVIS with no notes is a quiet
   week; and hiding the dismissed ones can empty a list that is not actually
   empty. Collapsing these into "nothing here" is how a broken read reads as
   good news. */
function noteEmptyState(live){
 if(!live)return banner('NERVIS is not answering',
   'The notification centre lives in NERVIS\'s own database, so nothing can be read or dismissed from here until it is up. Nothing has been lost — notes are written by the probe loop, not by this page.','warn');
 if(NOTES_TAB==='unread')return banner('Nothing waiting',
   'Every note has been read. <b>Everything</b> still has the ones you have dealt with.','info');
 if(NOTES_TAB==='dismissed')return banner('Nothing dismissed',
   'No note has been put away yet. Dismissed notes are kept for a month, then swept.','info');
 return banner('Nothing outstanding',
   'No note is waiting or unread. Anything dealt with is under <b>Dismissed</b>.','info');
}

/* The three tabs.

   Unread carries a count and the others do not, because it is the only one
   answering a question with a number behind it — the badge in the header. The
   count is `d.unread` from the same response as the rows, so the tab and the
   badge cannot drift apart mid-render. */
function noteTabs(d){
 const tab=(key,label,count)=>`<button class="mode-chip${NOTES_TAB===key?' on':''}"
   aria-pressed="${NOTES_TAB===key?'true':'false'}"
   onclick="setNoteTab('${jsAttr(key)}')">${escapeHtml(label)}${
   count?` <b>${escapeHtml(count)}</b>`:''}</button>`;
 return `<div class="filter-row note-tabs" role="group" aria-label="Which notes to list">
   ${tab('unread','unread',d.unread)}${tab('all','everything',0)}${tab('dismissed','dismissed',0)}
  </div>`;
}

/* The selection toolbar. Its counts are recomputed in place by `paintNoteBar`
   when a box is ticked, so this draws the state a fresh render starts from. */
function noteToolbar(d,picked){
 const waiting=d.unread?`${escapeHtml(d.unread)} waiting`:'nothing waiting';
 return `<div class="filter-row note-bar">
   <span class="mono dim">${picked?`${escapeHtml(picked)} selected`:waiting}</span>
   <button class="mode-chip" onclick="actOnPicked('read')"${picked?'':' disabled'}>mark read</button>
   <button class="mode-chip" onclick="actOnPicked('dismiss')"${picked?'':' disabled'}>dismiss</button>
   <span class="rule"></span>
   <button class="mode-chip" onclick="markEverythingListedRead()"${d.unread?'':' disabled'}>mark all read</button>
  </div>`;
}

async function notificationsView(){
 heading('Notifications','What NERVIS wanted to tell you, whether or not anybody was here.');
 const d=await API.nervis.notifications(NOTES_TAB);

 /* **A tick only counts while its note is on screen.** Switching tab changes
    what is listed, and a selection that quietly kept notes nobody can see any
    more would act on them anyway — which is the one thing a checkbox must never
    do. `setNoteTab` clears outright; this prunes whatever a refetch dropped. */
 const listed=new Set(d.items.map(n=>n.note_id));
 for(const id of [...NOTES_PICKED])if(!listed.has(id))NOTES_PICKED.delete(id);
 const picked=NOTES_PICKED.size;
 const allPicked=d.items.length>0&&picked===d.items.length;
 const now=Date.now();

 const table=`
    <div class="table-row head five caps" style="${NOTE_COLUMNS}">
      <span><input type="checkbox" class="note-tick" id="notePickAll"
        aria-label="select every note listed"${allPicked?' checked':''}
        onclick="pickEveryNote(this.checked)"> What happened</span>
      <span>Why you are being told</span><span>Severity</span><span>When</span><span></span></div>
    ${d.items.map(n=>noteRow(n,now)).join('')}`;

 $('#content').innerHTML=`
  <div class="card full${liveClass(d.live)}"><h3>Notification centre
    <span class="chip${d.unread?' warn':''}">${escapeHtml(d.unread)} unread</span></h3>${cell(
   /* The tabs are drawn even when the list is empty. An empty tab whose only
      way out is drawn *inside* the emptiness is a trap, and "nothing waiting"
      is exactly when somebody wants to look at what they dismissed. */
   (d.live?noteTabs(d):'')+
   (d.items.length?noteToolbar(d,picked)+table:noteEmptyState(d.live)),'nervis')}
   <small class="mono dim"><b>Every note says why it exists</b>, which is the column beside the title — NERVIS refuses to file one that cannot. <b>Notes are written by NERVIS, not by this page</b>: the probe loop files them whether a browser is open, muted, or on another tab, so a spoken announcement and the note here are one event seen twice rather than two events that can disagree. <b>Every note acted on is one you could see</b>: tick the ones you mean, or use <b>mark all read</b>, which acts on exactly the notes listed here and resolves to one request per note — so a note filed a second after you clicked is not swept up by a click that happened before it existed. What is deliberately absent is a <b>per-kind mute</b>: a standing rule silences notes nobody has read yet, and that is how the one that mattered gets missed. <b>Unread is its own tab</b> because it is the question the header badge asks, and it is filtered in the database rather than in the browser — the badge counts every unread note while this list stops at fifty, so filtering here would eventually promise nine and show four. Dismissed notes are hidden rather than deleted, kept under <b>Dismissed</b> and swept a month later. <b>Click any note to open it</b> — the producer's own words, who filed it, whether a model wrote it and what that cost, and the exact moment rather than "2h ago".</small></div>`;
}

/* Open or close one note, without re-rendering the screen underneath it.

   Toggled on the element rather than through `render()`: everything the
   expansion shows is already in the row's markup, so a refetch would buy
   nothing and would discard scroll position on the way. The Set is updated too,
   so a later repaint reopens what was open.

   The guard is what makes the whole row clickable safely — `mark read`,
   `dismiss` and the selection tick all live inside it, and without this a
   dismiss would also toggle and a tick would also open. */
function toggleNote(event,id){
 if(event&&event.target&&event.target.closest('button.mode-chip, .note-tick'))return;
 const row=document.querySelector(`.note-row[data-note="${CSS.escape(id)}"]`);
 if(!row)return;
 const open=row.classList.toggle('note-open');
 if(open)NOTES_OPEN.add(id);else NOTES_OPEN.delete(id);
}

/* Switch tabs.

   The selection is dropped rather than carried across, for the same reason
   `notificationsView` prunes it: a tick made on one list acting on a note the
   next list does not show is the one thing a checkbox must never do. Changing
   tab is a bigger change of context than toggling a filter was, so it clears
   outright instead of pruning. */
function setNoteTab(tab){
 if(NOTES_TAB===tab)return;
 NOTES_TAB=tab;
 NOTES_PICKED.clear();
 render();
}

/* Tick or untick one note.

   Stops the event so the row underneath does not also expand: the checkbox
   lives inside the clickable row, and picking a note is not the same gesture
   as opening it. */
function pickNote(event,id,checked){
 if(event)event.stopPropagation();
 if(checked)NOTES_PICKED.add(id);else NOTES_PICKED.delete(id);
 paintNoteBar();
}

/* Every note *currently listed* — not every note that exists. What is hidden
   behind "show dismissed" is not selected by a box the reader can see. */
function pickEveryNote(checked){
 NOTES_PICKED.clear();
 if(checked)for(const row of document.querySelectorAll('.note-row[data-note]'))
   NOTES_PICKED.add(row.dataset.note);
 for(const box of document.querySelectorAll('.note-row .note-tick'))box.checked=checked;
 paintNoteBar();
}

/* Repaint the toolbar's count and enable state without rebuilding the table.

   A full render would rebuild every row, which discards any note the reader had
   opened — and ticking boxes is exactly when somebody is reading them. */
function paintNoteBar(){
 const bar=document.querySelector('.note-bar');
 if(!bar)return;
 const picked=NOTES_PICKED.size;
 const label=bar.querySelector('.mono');
 if(label&&picked)label.textContent=`${picked} selected`;
 else if(label)label.textContent=NOTE_UNREAD?`${NOTE_UNREAD} waiting`:'nothing waiting';
 const [read,dismiss]=bar.querySelectorAll('.mode-chip');
 for(const b of [read,dismiss])if(b)b.disabled=!picked;
 const all=document.getElementById('notePickAll');
 const rows=document.querySelectorAll('.note-row[data-note]').length;
 if(all)all.checked=rows>0&&picked===rows;
}

/* Act on the ticked notes, one request each.

   **Per-note requests rather than a bulk endpoint**, which is the point rather
   than a shortcut: every note acted on was named by somebody who could see it,
   and the server has no operation that means "and everything like it". A
   handful of parallel requests against a local service costs nothing, and if a
   list ever grows large enough for that to matter, the fix is a bulk endpoint
   that still takes explicit ids.
*/
async function actOnPicked(verb){
 const ids=[...NOTES_PICKED];
 if(!ids.length)return;
 await Promise.all(ids.map(id=>verb==='read'
   ?API.nervis.markNoteRead(id):API.nervis.dismissNote(id)));
 NOTES_PICKED.clear();
 await paintNotePip();
 render();
}

/* "Mark all read" — every note *on this screen*, by id.

   Deliberately not a server-side mark-everything: it acts on what is listed, so
   a note filed between the page loading and the button being pressed is not
   swept up by a click that happened before it existed. Reading is also the mild
   half — it clears the badge and leaves every note on the list. */
async function markEverythingListedRead(){
 const ids=[...document.querySelectorAll('.note-row[data-note]')]
   .map(row=>row.dataset.note);
 if(!ids.length)return;
 await Promise.all(ids.map(id=>API.nervis.markNoteRead(id)));
 NOTES_PICKED.clear();
 await paintNotePip();
 render();
}

/* Act, then repaint from the server rather than from what we assume happened.
   The badge is a count the server owns, and a page that decremented its own
   copy would drift the first time two tabs were open. */
async function actOnNote(id,verb){
 const ok=verb==='read'?await API.nervis.markNoteRead(id):await API.nervis.dismissNote(id);
 if(ok){await paintNotePip();render()}
}

async function eventsView(){
 heading('Event hub','NERVIS\'s own hub. Live, filtered, and honest about who is producing.',
  control('Clear filters','clearEventFilters'));
 /* **Live since M6.** This screen used to read each service's `events@1`
    capability and report that publication was unavailable, which was the honest
    thing while NERVIS had no hub. It has one now — §11.1's envelope, ingestion,
    bounded persistence, filters and an SSE broadcast.
 
    What has *not* changed is who produces. RAVIS and SIRVIS still advertise
    `events@1` as unavailable until their Stage 7 milestones, so every event
    here is NERVIS's own until then, and the producer table below still says so.
    A feed that implied otherwise would be the invented traffic this build is
    careful about. */
 const f=EVENT_FILTERS;
 const query=Object.entries({limit:200,service:f.service,severity:f.severity,
   event_type:f.event_type,text:f.text}).filter(([,v])=>v!=='' && v!=null);
 /* Each of the three cards below hardcoded ` live`, so on a page opened from
    disk — or with NERVIS stopped — an empty feed, an empty producer table and
    an empty quarantine all read as live reads of a quiet hub. They are three
    separate answers and are tracked separately. */
 let feed={items:[],latest_sequence:0},quarantine={items:[]},feedLive=false,quarantineLive=false;
 try{
  const [a,b]=await Promise.all([
   fetch(BASE.nervis+'/api/v1/events?'+new URLSearchParams(query),
     {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)}).then(r=>r.ok?r.json():null),
   fetch(BASE.nervis+'/api/v1/events/quarantine?limit=10',
     {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)}).then(r=>r.ok?r.json():null)]);
  if(a){feed=a;feedLive=true;SOURCE.nervis='live'}
  if(b){quarantine=b;quarantineLive=true}
 }catch(e){}

 const ask=async key=>{
  try{
   const r=await fetch(BASE[key]+'/ecosystem/capabilities',
     {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
   if(!r.ok)return null;
   const all=((await r.json()).capabilities)||[];
   return all.find(c=>/\bevents?@?\d*$/.test(c.id))||null;
  }catch(e){return null}};
 const [rv,sv]=await Promise.all([ask('ravis'),ask('sirvis')]);

 const row=(label,cap)=>`<div class="table-row" style="grid-template-columns:.8fr .9fr 1fr 2.2fr">

   <span><span class="chip${warnUnless(cap&&cap.state==='available')}">${cap?escapeHtml(cap.state):'not reachable'}</span></span>
   <span style="opacity:.75">${cap?escapeHtml(cap.reason||''):'the service did not answer, so nothing is claimed about it either way'}</span></div>`;

 /* Newest first for reading. The API returns oldest-first because it doubles as
    replay, and a client resuming wants what it missed in the order it happened —
    reversing here is easier than reconstructing an order that was thrown away. */
 const shown=[...feed.items].reverse();
 const sev=s=>s==='error'||s==='critical'?' warn':'';

 $('#content').innerHTML=`
  <div class="card full${liveClass(feedLive)}"><h3>Feed <span class="chip">${escapeHtml(feed.items.length)} shown · seq ${escapeHtml(feed.latest_sequence)}</span></h3>${cell(`
   <div class="filter-row">
    ${['','nervis','ravis','sirvis'].map(v=>`<button class="mode-chip${escapeHtml(f.service===v?' on':'')}" onclick="setEventFilter('service','${jsAttr(v)}')">${v||'all services'}</button>`).join('')}
    ${['','info','warning','error'].map(v=>`<button class="mode-chip${escapeHtml(f.severity===v?' on':'')}" onclick="setEventFilter('severity','${jsAttr(v)}')">${v||'any severity'}</button>`).join('')}
    <input class="mono" id="evText" placeholder="free text over the envelope"
      value="${escapeHtml(f.text)}" onchange="setEventFilter('text',this.value)"
      style="flex:1;min-width:150px;background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:5px 7px">
   </div>
   ${shown.length?`<div class="table-row head five"><span>When</span><span>Service</span><span>Type</span><span>Severity</span><span>Detail</span></div>
   ${shown.map(e=>`<div class="table-row five">
     <span class="mono dim">${escapeHtml(String(e.occurred_at||'').slice(11,23))}</span>
     <span class="mono">${escapeHtml(dash((e.source||{}).service_type))}</span>
     <span class="mono">${escapeHtml(e.event_type||'')}</span>
     <span><span class="chip${sev(e.severity)}">${escapeHtml(e.severity||'info')}</span></span>
     <span style="opacity:.8">${escapeHtml(JSON.stringify(e.data||{}).slice(0,90))}</span></div>`).join('')}`
    :(feedLive
      ?`<small class="mono dim">no event matches. The hub is running — <b>seq ${escapeHtml(feed.latest_sequence)}</b> events have passed through it — so this is a filter, not an outage.</small>`
      /* The same empty list, from a read that failed. `feed` is seeded as
         `{items:[],latest_sequence:0}` and the failure is swallowed above, so
         this branch used to state — as a positive fact, to somebody trying to
         work out why they can see nothing — that the hub is running and that
         seq 0 events had passed through it. Both halves were made up. The
         reader tracks whether it answered; this sentence just did not ask. */
      :`<small class="mono dim">the event feed could not be read, so this is empty because nothing was fetched — not because nothing has happened. <b>NERVIS /api/v1/events</b> did not answer.</small>`)}
   <small class="mono dim">read from <b>NERVIS /api/v1/events</b>. Ordering is guaranteed only <b>within one source stream</b> (§4.4), so this list is arrival order across producers and not a global sequence of what happened. <b>occurred_at</b> is the producer's clock and <b>_received_at</b> is NERVIS's; both are kept, because §11.2 requires clock skew to be visible rather than smoothed away.</small>`,'nervis')}</div>

  <!-- The stream's own health, which NERVIS.md said "already renders from
       mocks" and which in fact nothing on any screen read: the mock's
       cursor, buffered, dropped, gaps and connected_since fields were
       defined and never referenced. This is the live client's state
       instead of a mock's, which is the only version worth showing. -->
  ${streamCard()}

  <!-- Live when either peer answered its own /ecosystem/capabilities. Neither
       publishing events yet is a *finding*, not an outage — but "nobody
       answered" and "both answered and neither publishes" are different facts

  <div class="card wide${rv||sv?' live':''}"><h3>Who is producing</h3>${cell(`
   <div class="table-row head" style="grid-template-columns:.8fr .9fr 1fr 2.2fr"><span>Service</span><span>Capability</span><span>State</span><span>Why</span></div>
   ${row('RAVIS',rv)}
   ${row('SIRVIS',sv)}
   <small class="mono dim">read live from each service's own <b>/ecosystem/capabilities</b>. The hub exists and ingests, and <b>RAVIS publishes since its M18b</b> — a routed request emits a selection and a completion under the caller's trace_id, which is what gives RAVIS a lane on the Traces screen rather than a note saying it has none. <b>SIRVIS lands at its M21</b>, so a benchmark still shows no lane. Whether RAVIS actually publishes depends on it being configured with a hub to reach; the table above reads that from each service rather than assuming it.</small>`,'nervis')}</div>

  <div class="card wide${liveClass(quarantineLive)}"><h3>Quarantine <span class="chip${warnIf(quarantine.items.length)}">${escapeHtml(quarantine.items.length)}</span></h3>${cell(`
   ${quarantine.items.length?`<div class="table-row head"><span>Reason</span><span style="grid-column:2/-1">Detail</span></div>
   ${quarantine.items.map(q=>`<div class="table-row"><span class="mono">${escapeHtml(q.reason)}</span><span class="mono dim" style="grid-column:2/-1">${escapeHtml(q.detail||'')} · ${escapeHtml(String(q.payload).slice(0,70))}</span></div>`).join('')}`
    :'<small class="mono dim">nothing has been refused.</small>'}
   <small class="mono dim">§11.1: malformed events are <b>quarantined with safe diagnostics and never crash the hub</b>. Kept rather than dropped, because "the hub is quiet" and "a producer is sending rubbish" look identical from outside and need different things done about them. Ingestion answers <b>202 with the reason</b> rather than an error, so a producer's mistake never becomes a retry storm.</small>
   ${explains('what travels in an envelope, and what never does',`
    <div class="trace-step"><b>envelope</b><span class="mono">event_id · event_type · event_version · occurred_at · source · trace_id</span></div>
    <div class="trace-step"><b>ordering</b><span>guaranteed within one source stream only</span></div>
    <div class="trace-step"><b>duplicates</b><span>tolerated, resolved by <span class="mono">event_id</span></span></div>
    <div class="trace-step"><b>gaps</b><span>a <span class="mono">ecosystem.stream.gap</span> frame is itself an event</span></div>

    <small class="mono dim">no prompt, completion, source or path travels in an envelope — a trace says what happened and how long it took, not what was said. This was a card headed <b>specified, not built</b>, which had stopped being true: the hub ships, and a stored event carries every field listed here.</small>`)}
   ${explains('where routing and benchmark history live instead',`
    <div class="trace-step"><b>routing decisions</b><span><a href="#" onclick="go(state.app,'Traces');return false" style="color:inherit">Traces</a> · live</span></div>
    <div class="trace-step"><b>benchmark history</b><span>SIRVIS → Results · live</span></div>

}

/* M12's Analyze, wired to the real endpoints.

   **The preview is the point, not a nicety.** NERVIS.md §11.5's exit condition
   is that *the user sees exactly what will be sent before it is sent*, and the
   two routes call one builder so this really is the thing — not an
   illustration of it. So the button previews, and sending is a second,
   deliberate press. */
const DIAGNOSE={packet:null,prompt:'',analysis:'',reason:'',busy:false,local:false};

async function diagnose(){
 DIAGNOSE.busy=true;DIAGNOSE.analysis='';DIAGNOSE.reason='';repaint();
 try{
  const r=await fetch(BASE.nervis+'/api/v1/diagnostics/packet',
    {method:'POST',headers:{'content-type':'application/json'},
     body:JSON.stringify({trace_id:TRACE_SHOWN||''}),
     signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  const body=await r.json();
  DIAGNOSE.packet=body.packet;DIAGNOSE.prompt=body.prompt;
 }catch(e){DIAGNOSE.reason='the packet could not be built: '+e.message}
 DIAGNOSE.busy=false;repaint();
}

/* Send what is on screen. Separate from building it, because §11.5 puts a
   decision between the two and a single button would remove it. */
async function sendAnalysis(){
 DIAGNOSE.busy=true;repaint();
 try{
  const r=await fetch(BASE.nervis+'/api/v1/diagnostics/analyze',
    {method:'POST',headers:{'content-type':'application/json'},
     body:JSON.stringify({trace_id:TRACE_SHOWN||'',local_only:DIAGNOSE.local}),
     signal:AbortSignal.timeout(180000)});
  const body=await r.json();
  DIAGNOSE.analysis=body.analysis||'';
  DIAGNOSE.reason=body.available?'':(body.reason||'the analysis did not complete');
 }catch(e){DIAGNOSE.reason='the analysis did not complete: '+e.message}
 DIAGNOSE.busy=false;repaint();
}

function toggleLocalAnalysis(){DIAGNOSE.local=!DIAGNOSE.local;repaint()}

/* What would be sent, rendered as text rather than summarised.
   Escaped like everything else on this page — and with more reason than most,
   since the whole point of the packet is that it is full of strings other
   programs wrote. */
function diagnosePanel(){
 if(!DIAGNOSE.packet&&!DIAGNOSE.reason)return '';
 const bounds=(DIAGNOSE.packet||{}).bounds||{};
 /* Derived, not hardcoded. The panel also renders when the packet could not
    be built, and a `live` class on that state would badge an error as a
    successful read — which is the whole defect the liveness ratchet counts. */
 return `<div class="card full${DIAGNOSE.packet?' live':''}"><h3>What would be sent</h3>
  <div class="trace-step"><b>events</b><span class="mono">${escapeHtml(bounds.events_included)} of ${escapeHtml(bounds.events_available)}${bounds.truncated?' · truncated':''}</span></div>
  <div class="trace-step"><b>routed to</b><span class="mono">${DIAGNOSE.local?'ravis/local':'ravis/auto'}</span></div>
  <pre class="editor" style="max-height:340px;overflow:auto;white-space:pre-wrap">${escapeHtml(DIAGNOSE.prompt)}</pre>
  <div style="margin-top:10px;display:flex;gap:7px;align-items:center">
   <button class="btn primary"${DIAGNOSE.busy?' disabled':''} onclick="sendAnalysis()">${DIAGNOSE.busy?'Analysing…':'Send this to RAVIS'}</button>
   <button class="btn" onclick="toggleLocalAnalysis()">${DIAGNOSE.local?'☑':'☐'} Local analysis only</button>
  </div>
  ${DIAGNOSE.reason?`<small class="mono dim">${escapeHtml(DIAGNOSE.reason)}</small>`:''}
  ${DIAGNOSE.analysis?`<div class="trace-step" style="margin-top:10px"><b>analysis</b></div><pre style="white-space:pre-wrap">${escapeHtml(DIAGNOSE.analysis)}</pre>
    <small class="mono dim">this is text. NERVIS does nothing with it — §11.5 forbids anything a model returns from analysing a packet becoming an action.</small>`:''}
  </div>`;
}

/* Which half of Diagnostics is on screen.

   **Clarvis is a section here rather than a screen of its own.** The Service
   health card above covers RAVIS and SIRVIS and deliberately not Clarvis — it
   has no management API, and the Bridge is read-only status by design. So "how
   you see Clarvis" is the same question this screen already answers for the
   other two, asked about the one peer that cannot be asked the same way.

   It briefly lived on the CLARVIS tab, which was wrong twice: that tab hides
   the side rail so the editor can be full-bleed, and putting a NERVIS screen
   first in its rail moved the whole tab off code-server. */
let DIAG_SECTION='services';

function diagSections(){
 const tab=(key,label)=>`<button class="mode-chip${DIAG_SECTION===key?' on':''}"
   aria-pressed="${DIAG_SECTION===key?'true':'false'}"
   onclick="setDiagSection('${jsAttr(key)}')">${escapeHtml(label)}</button>`;
 return `<div class="filter-row note-tabs" role="group" aria-label="Which diagnostics">
   ${tab('services','services')}${tab('clarvis','clarvis in the editor')}${
   tab('inspector','api inspector')}${tab('logs','raw logs')}</div>`;
}

function setDiagSection(section){
 if(DIAG_SECTION===section)return;
 DIAG_SECTION=section;
 /* An open inspection does not survive leaving the screen. Coming back to a
    decision somebody opened ten minutes ago — which RAVIS may no longer hold —
    would greet them with an error instead of the list they asked for. */
 INSPECT_ID='';
 render();
}

async function diagnosticsView(){
 if(DIAG_SECTION==='clarvis')return clarvisDiagnosticsView();
 if(DIAG_SECTION==='inspector')return inspectorView();
 if(DIAG_SECTION==='logs')return logsView();
 heading('Diagnostics','Structured first, logs last, and never a number that mixes the three.',
  control('Analyze trace…','diagnose',' primary'));
 const d=await API.nervis.diagnostics();
 const tick=v=>v?'<span class="chip">yes</span>':'<span class="mono" style="opacity:.35">—</span>';
 /* The live half: each service's own health and capability surface. Prepended
    rather than replacing what follows, because the cards below describe AI
    diagnostics — the trace packet builder and its redaction — which is NERVIS
    M12 and does not exist. Those stay marked as prototype. */
 const [dr,ds]=await Promise.all([serviceDiagnostics('ravis'),serviceDiagnostics('sirvis')]);
 const checksOf=d=>((d&&d.health&&d.health.checks)||[]);
 /* The chip said "live" in words while the class said it unconditionally —
    both wrong together when neither peer answers, which is exactly when a
    reader most needs to know. */
 const liveCard=`<div class="card full${dr||ds?' live':''}"><h3>Service health <span class="chip">${dr||ds?'live':'no service answered'}</span></h3>${cell(`
   <div class="table-row head" style="grid-template-columns:.7fr 1.1fr 1fr 1.6fr"><span>Service</span><span>State</span><span>Checks</span><span>Capabilities</span></div>
   ${[['RAVIS',dr],['SIRVIS',ds]].map(([label,d])=>`<div class="table-row" style="grid-template-columns:.7fr 1.1fr 1fr 1.6fr">
     <span><b>${label}</b></span>
     <span>${healthChip(d)}</span>
     <span class="mono" style="opacity:.8">${checksOf(d).length?checksOf(d).map(c=>escapeHtml(c.name)+' '+escapeHtml(c.status)).join(' · '):'—'}</span>
     <span class="mono" style="opacity:.8">${d?`${escapeHtml(d.available.length)} available · ${escapeHtml(d.unavailable.length)} not yet`:'—'}</span></div>`).join('')}
   ${[['RAVIS',dr],['SIRVIS',ds]].filter(([,d])=>d&&d.unavailable.length).map(([label,d])=>
     d.unavailable.map(c=>`<div class="trace-step"><b>${label} · ${escapeHtml(c.id)}</b><span style="opacity:.75">${escapeHtml(c.reason||'')}</span></div>`).join('')).join('')}
   <small class="mono dim">read from each service's <b>/ecosystem/health</b> and <b>/ecosystem/capabilities</b>. There is no diagnostics endpoint to call — <span class="mono">/api/v1/diagnostics</span> is a 404 on both — so this is assembled from the surfaces every service already publishes. A capability listed as <b>not yet</b> names its own milestone, which is more useful than a red light.</small>`,'nervis')}</div>`;

 $('#content').innerHTML=`<div class="card full">${cell(diagSections(),'nervis')}</div>`+liveCard+diagnosePanel()+`<div class="card wide"><h3>Source priority</h3>

/* Keep the newest message in view, without fighting the reader.
 *
 * Only scrolls when the view is already near the bottom. Someone who scrolled
 * up to re-read an earlier answer is *doing something*, and yanking them back
 * every time a token arrives would make a streaming reply impossible to read
 * around. Near-bottom is the standard test for "following along", and the
 * threshold is generous because a reply grows under the cursor: a strict
 * `scrollTop + clientHeight === scrollHeight` stops matching the moment one
 * more line lands.
 */
const CHAT_FOLLOW_PX = 120;

function chatFollowing(box){
 return box.scrollHeight - box.scrollTop - box.clientHeight <= CHAT_FOLLOW_PX;
}

function scrollChatToEnd(force){
 const box=document.getElementById('messages');
 if(!box)return;
 if(force||chatFollowing(box))box.scrollTop=box.scrollHeight;
}

/* One attached file, in the transcript rather than in a strip under the box.

   **Where it happened is where it belongs.** A list beneath the composer says
   *these files exist*; a card in the conversation says *you attached this, at
   this point, and everything after it can see it*. The second is the true
   statement — attachments are per-conversation — and it is what every chat
   client does, so it needs no explaining.

   It is not a message anybody said. It carries no `text`, is skipped when the
   request body looks for the last thing the person typed, and is drawn as a
   card rather than a bubble so nobody reads it as words in the conversation. */
/* Bytes below a kilobyte, kilobytes above it. Rounding everything up to "1 KB"
   makes a 78-byte file and a 900-byte one look identical, and the question an
   attachment card exists to answer — did the right thing upload — is exactly
   the one that distinction settles. */
function fileSize(bytes){
 const n=Number(bytes)||0;
 if(n<1024)return n+' B';
 if(n<1024*1024)return Math.round(n/1024)+' KB';
 return (n/(1024*1024)).toFixed(1)+' MB';
}

/* Which files chat can read, kept in step with `documents.py` by hand.
   The card states this at the moment of upload, and a card promising a reading
   NERVIS cannot give would be a lie told in the transcript. */
const READABLE_SUFFIXES=['.txt','.md','.markdown','.rst','.log','.csv','.tsv','.json',
 '.yaml','.yml','.toml','.ini','.cfg','.conf','.py','.js','.ts','.tsx','.jsx','.html',
 '.css','.sh','.sql','.pdf'];
function readableName(name){
 const at=String(name||'').lastIndexOf('.');
 return at>0&&READABLE_SUFFIXES.includes(String(name).slice(at).toLowerCase());
}

function attachmentCard(m){
 const f=m.file||{};
 const size=fileSize(f.bytes);
 return `<div class="attachment${f.readable?'':' unread'}" title="${escapeHtml(
    f.readable?'chat can read this file':'stored, but not a text file chat can read')}">`
  +`<span class="clip">${f.readable?'📄':'📎'}</span>`
  +`<span class="what"><b>${escapeHtml(f.name||'file')}</b>`
  +`<small class="mono dim">${escapeHtml(size)}${f.readable?'':' · not readable as text'}</small></span>`
  +`${stampOf(m)}</div>`;
}

   explain themselves on first open; Chat was the one screen that did not.

   message is sent — `conv.messages.length` is the same check that decides

   already" flag to fall out of sync with what is on screen. */

   what changed in the last few minutes. Ask a question about this ecosystem, or nothing in
   particular — it still gets fenced context about what is up, and answers from that rather
   than guessing.</p>
  </div>`;
}

async function chatView(){heading('General chat','A plain RAVIS client. Not a workspace, not an agent.',

 $('#content').innerHTML=`<div class="card full chat live">
  <div class="chat-tools">

        : ''}<b>${escapeHtml(m.speaker||speakerName())}</b>${stampOf(m)}${renderMarkdown(m.text)}${m.pending?pendingTail(m.text):''}${m.reading?`<div class="mono dim" style="margin-top:7px;font-size:11px;letter-spacing:.04em">${escapeHtml(m.reading)}</div>`:''}${recalledRow(m.recalled)}${offerRow(m.offer,mi)}${planRow(m.plan,mi)}</div>`).join('')}

  if(!USER.hydrated){

/* Measured rather than guessed: the card's distance from the top of the
   viewport depends on the heading, which wraps differently at narrow widths.
   Re-run on resize for the same reason. */
function sizeChat(){
 const card=document.querySelector('.card.chat');
 if(!card)return;
 const top=card.getBoundingClientRect().top;
 const vh=window.innerHeight||document.documentElement.clientHeight||800;
 card.style.setProperty('--chat-h',Math.max(320,Math.round(vh-top-22))+'px');

/* ── SPOKEN OUTPUT (NERVIS.md §18.2) ───────────────────────────────────────
   NERVIS speaks through Fish Audio, and the interesting part is what it
   refuses to say.

   **Synthesis is an egress path.** The text leaves the machine. §18.2 puts the
   consequence bluntly — *failing closed on the route and open on the voice is
   still a leak* — so a reply a local model produced is never sent to a cloud
   voice, however convenient that would be. NERVIS decides that, not this page:
   the browser states which model answered and the service checks it against
   what RAVIS says is remote, failing closed on anything it cannot confirm.

   What comes back from a refusal is the *reason*, and usually the text itself,
   so the line is still spoken — by the voice built into the browser, which is
   free, offline and sends nothing. That is §18.2's "fall back to local system
   TTS", with the fallback sitting where the speaker already is.

   **The key is never here.** It goes in on the Voice screen, is written to a
   0600 file, and no endpoint returns it. This page could not leak it if it
   tried, which is a stronger promise than one that remembers to redact. */

/* What a preview says. §18.1's own example of NERVIS's register: anticipatory,
   understated, and about the machine rather than about you. */
const VOICE_PREVIEW='RAVIS has been failing over to cloud for eleven minutes. Shall I show you why?';

/* Reasons a line went unspoken that are faults rather than policy. `muted`,
   `local_only` and `nothing_to_say` are all the design working and are absent
   from this list on purpose. */
const FAULTS=['unreachable','refused','no_credential','no_voice','daily_cap'];

const SPEECH={
 /* What the service says is in force, re-read whenever a screen paints. Held
    rather than fetched per utterance: mute must be honoured immediately, and a
    round trip between pressing it and the next sentence is a race. */
 settings:null,
 /* **Utterances are serialised.** Two overlapping ones are not "both quieter":
    `speechSynthesis.speak` after a `cancel()` chops the first off mid-sentence,
    and two audio elements simply talk over each other. A greeting followed by
    a reply is enough to reach this. */
 queue:Promise.resolve(),
 /* Bumped by `stop()`, so anything queued in an earlier era is skipped when its
    turn comes rather than spoken into a silence somebody asked for. */
 era:0,
 audio:null, context:null, frame:0,
 /* One notice per session for a voice that is failing rather than declining. */
 warned:false,
 /* Set when the browser refused to play without a user gesture, so the screen
    can say why it went quiet instead of looking broken. */
 blocked:false,

 async load(){
  try{
   const r=await fetch(BASE.nervis+'/api/v1/voice',{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
   this.settings=r.ok?await r.json():null;
  }catch(e){this.settings=null}
  return this.settings;
 },

 /* Whether anything should be said at all. Absent settings count as off: a
    dashboard that cannot reach NERVIS must not start talking on its own. */
 on(){return Boolean(this.settings&&this.settings.enabled&&!this.settings.muted)},

 /* Whether a state change is worth saying out loud. Its own flag: wanting
    replies read aloud and wanting to be told a service fell over are different
    wants, and mute silences both because mute means silence. */
 announcing(){return Boolean(this.on()&&this.settings.announce_status)},

 /* NERVIS's own words rather than a model's, so `source_model` is empty and the
    §18.2 gate passes it — there is no local reply here to leak.

    **It interrupts rather than queues**, which is the opposite of what this did
    first. Waiting is right for two remarks of equal weight; a service falling
    over is not equal weight. Held behind a long answer, the news arrives after
    the thing it should have stopped somebody doing — and the answer is on the
    screen to be read back, while the announcement is not.

    `stop()` voids the backlog along with the current line, so a queue of chat
    lines does not resume around the interruption and leave the announcement
    buried in the middle of one. */
 announce(text){
  if(!this.announcing())return;
  this.stop();
  this.say(text,'');
 },

 /* The line said once, when the dashboard has its first real reading.

    **Templated rather than generated.** A model call on page load costs money
    and latency before anybody has asked for anything, and the one thing this
    line must not do is invent a figure — it exists to state the count. The
    register is the persona's; the numbers are the registry's. */
 welcome(items){
  if(!this.announcing()||this.welcomed)return;
  this.welcomed=true;
  /* **Held until the page has been touched.** A browser refuses to play audio
     before a user gesture, and a freshly loaded dashboard has had none — so
     this line was synthesised, refused, and thrown away: a speech call spent to
     produce silence, on every refresh.

     Recomposed at the moment it is finally spoken rather than captured now. A
     welcome held for ten minutes and then read out is a report about ten
     minutes ago, and the whole point of it is the current status. */
  this.whenAudioIsAllowed(()=>{
   if(this.announcing())this.say(this.welcomeLine(WELCOME_ITEMS),'');
  });
 },

 /* Run this once the document is allowed to make noise.
    Immediately where it already is — a click on the nav counts, so navigating
    within the dashboard and then reloading does not wait for a second one. */
 whenAudioIsAllowed(run){
  const already=navigator.userActivation&&navigator.userActivation.hasBeenActive;
  if(already)return run();
  const once=()=>{
   document.removeEventListener('pointerdown',once);
   document.removeEventListener('keydown',once);
   run();
  };
  document.addEventListener('pointerdown',once,{once:true});
  document.addEventListener('keydown',once,{once:true});
 },

 welcomeLine(items){
  /* **The local runtimes are left out of the count.** They get their own
     sentence, and counting them here named them twice — "LM Studio and Ollama
     are not answering; the rest are up. LM Studio and Ollama are down." They
     are model providers rather than services anyway, which is how the ecosystem
     map already treats them: one bundled node, not two rows on the ring. */
  const live=(items||[]).filter(e=>e.awaiting_first_contact!==true
    &&e.key!=='lmstudio'&&e.key!=='ollama');
  const well=live.filter(e=>e.state==='healthy');
  const off=live.filter(e=>e.state!=='healthy'&&e.state!=='degraded');
  const soft=live.filter(e=>e.state==='degraded');
  let line;
  /* "All 1 services are up and well" is what counting without checking reads
     like on a machine with one service answering. */
  const all=live.length===1?'The one service is':`All ${live.length} services are`;
  if(!live.length)line='Systems online, sir. Nothing is reporting in yet.';
  else if(off.length)
   line=`Good ${partOfDay()}, sir. ${off.map(e=>e.label).join(' and ')} `
      +`${off.length>1?'are':'is'} not answering; the rest are up.`;
  else if(soft.length)
   line=`Good ${partOfDay()}, sir. ${all} up, `
      +`${soft.map(e=>e.label).join(' and ')} running degraded.`;
  else line=`Good ${partOfDay()}, sir. ${all} up and well.`;
  return [line,localModelsLine(items)].filter(Boolean).join(' ');
 },
 welcomed:false,

 say(text,sourceModel){
  if(!text||!this.on())return;
  /* Stamped with the generation it was queued in, and checked again when its
     turn comes. Replacing `this.queue` cannot unmake a promise already chained
     onto the old one — those keep running whatever the tail is set to — so
     without this a line queued before a stop still speaks after it. */
  const era=this.era;
  this.queue=this.queue
    .then(()=>era===this.era?this._speak(text,sourceModel||''):undefined)
    .catch(()=>{});
 },

 /* Silence now, and drop the backlog. A merely-paused queue floods out on
    unmute and narrates replies from ten minutes ago, which is the opposite of
    what pressing mute asked for. */
 stop(){
  /* Everything queued before now is void. `this.queue=Promise.resolve()` only
     replaces the *tail*: the promises already chained onto the old one run to
     completion regardless, so the backlog this claimed to drop was still
     speaking. Found by interrupting a two-line reply and hearing the second
     line arrive after the interruption. */
  this.era+=1;
  this.queue=Promise.resolve();
  if(this.audio){this.audio.pause();this.audio=null}
  try{window.speechSynthesis.cancel()}catch(e){}
  cancelAnimationFrame(this.frame);
  this.pulse(0);
  chatMood(CHAT_SESSION.busy?'answering':null);
 },

 async _speak(text,sourceModel){
  /* Re-checked here rather than only at `say`. An utterance can wait seconds
     behind a long one, and mute pressed during that wait has to land. */
  if(!this.on())return;
  let answer;
  try{
   answer=await fetch(BASE.nervis+'/api/v1/voice/speak',{method:'POST',
     headers:{'content-type':'application/json'},
     body:JSON.stringify({text,source_model:sourceModel})});
  }catch(e){return this._fallback(text)}
  if(answer.ok)return this._play(await answer.blob());
  /* A refusal carrying text means "say this yourself"; one carrying none means
     say nothing — muted, or nothing in the reply was speakable. */
  const body=await answer.json().catch(()=>({}));
  if(body.fallback_text)return this._fallback(body.fallback_text);
  /* Nothing to say, for one of two very different reasons. A refusal by policy
     — muted, a local model's reply, nothing speakable — is the feature working
     and needs no announcement. A refusal by *fault* is §18.2's "stay silent and
     say so": once per session, because a broken key would otherwise say it on
     every line. */
  if(FAULTS.includes(body.reason)&&!this.warned){
   this.warned=true;
   notify('Voice: '+(body.detail||body.reason));
  }
 },

 async _play(blob){
  const url=URL.createObjectURL(blob);
  const audio=new Audio(url);
  this.audio=audio;
  chatMood('speaking');
  try{await audio.play()}
  catch(e){
   /* Chromium blocks audio until the document has had a user gesture. Sending
      a message is one, so a spoken reply is always fine — a greeting on a page
      opened straight into Chat is not, and this is that case. Recorded rather
      than retried: retrying cannot create a gesture. */
   this.blocked=true;URL.revokeObjectURL(url);this.audio=null;chatMood(null);return;
  }
  this._analyse(audio);
  await new Promise(done=>{audio.onended=done;audio.onerror=done});
  cancelAnimationFrame(this.frame);
  this.pulse(0);
  URL.revokeObjectURL(url);
  this.audio=null;
  chatMood(CHAT_SESSION.busy?'answering':null);
 },

 /* Real amplitude, sampled from the audio that is playing.
    The avatar's waveform is either the voice or a decoration pretending to be
    one, and §9.4's rule about never presenting a guess as a measurement does
    not stop applying because the output is pixels. Where no analyser is
    available the bars simply do not move. */
 _analyse(audio){
  try{
   const Ctx=window.AudioContext||window.webkitAudioContext;
   if(!Ctx)return;
   this.context=this.context||new Ctx();
   /* One source node per element, and an element may only ever be connected
      once — hence a fresh `Audio` per utterance rather than one reused. */
   const source=this.context.createMediaElementSource(audio);
   const analyser=this.context.createAnalyser();
   analyser.fftSize=256;
   source.connect(analyser);analyser.connect(this.context.destination);
   const bins=new Uint8Array(analyser.frequencyBinCount);
   const tick=()=>{
    analyser.getByteTimeDomainData(bins);
    let peak=0;
    for(let i=0;i<bins.length;i++)peak=Math.max(peak,Math.abs(bins[i]-128));
    /* 70 rather than 128: speech rarely reaches full scale, and dividing by the
       theoretical maximum leaves the avatar barely twitching. */
    this.pulse(Math.min(1,peak/70));
    this.frame=requestAnimationFrame(tick);
   };
   tick();
  }catch(e){/* no analyser — the resting speaking look is still correct */}
 },

 /* The voice built into the browser. Free, offline, and it sends nothing,
    which is exactly why §18.2 names it as the fallback for text that must not
    reach a cloud service. Given the text alone: a Fish reference id means
    nothing to an OS voice. */
 _fallback(text){
  return new Promise(done=>{
   let utterance;
   try{utterance=new SpeechSynthesisUtterance(text)}catch(e){return done()}
   /* `answering`, not `speaking`. The speaking state's bars are driven by
      measured amplitude and there is none here, so claiming it would draw a
      waveform of nothing. */
   chatMood('answering');
   const finish=()=>{chatMood(CHAT_SESSION.busy?'answering':null);done()};
   utterance.onend=finish;utterance.onerror=finish;
   try{window.speechSynthesis.speak(utterance)}catch(e){finish()}
  });
 },

 pulse(level){
  document.querySelectorAll(`iframe[data-avatar="${avatarFor('nervis')}"]`).forEach(f=>{
   try{f.contentWindow.setPulse(level)}catch(e){}
  });
 }
};

/* The avatar, driven by what is actually happening in the conversation rather
   than by which tab is open.

   The resting map in `desiredAvatarState` gives one state per screen, which is
   correct for a screen nobody is using and wrong for one that is mid-reply. A
   conversation has phases — waiting, answering, speaking — and an avatar that
   sits still through all three is a picture rather than an instrument.
   `null` hands it back to the resting state for the current view. */
const CHAT_MOODS={
 nervis:{thinking:'analyzing',answering:'routing',speaking:'speaking'},
 /* Her own vocabulary, which is a face rather than a machine: she thinks,
    then she talks. There is no separate speaking state because a mouth moving
    is a mouth moving whichever voice is driving it. */
 miku:{thinking:'thinking',answering:'talking',speaking:'talking'}
};
/* A small speaker beside the avatar: whether NERVIS can currently talk, and a
   click to change it.

   **Beside the face rather than on the Voice screen**, because it answers a
   question people ask at the moment it stops being obvious — the dashboard just
   said something, or did not, and the reason is one glyph away instead of two
   navigations. It is the same stored mute the Voice screen writes, so a second
   tab honours it; §18.2 asks that mute persist and a per-tab toggle would not
   be one.

   Absent entirely with no credential configured. A control for a feature nobody
   has set up is a control that can only disappoint. */
/* Redraw just the pip, without rebuilding the screen underneath it.

   The registry poll only repaints on a transition, which is correct — but the
   pip's state changes when *voice settings* change, and those move on their own
   schedule. A full repaint for a speaker glyph would discard scroll position
   and any open control, which §25.2 is emphatic about. */
function paintVoicePip(){
 const slot=document.getElementById('avatarSlot');
 if(!slot)return;
 const wanted=voicePip();
 const drawn=slot.querySelector('.voice-pip');
 if(!wanted){if(drawn)drawn.remove();return}
 if(!drawn){slot.insertAdjacentHTML('beforeend',wanted);return}
 const fresh=document.createElement('div');
 fresh.innerHTML=wanted;
 const next=fresh.firstElementChild;
 if(next&&next.outerHTML!==drawn.outerHTML)drawn.replaceWith(next);
}

/* How many notes are waiting, as the pip last read it. Cached so the badge can
   redraw without a fetch — the count is refreshed on the registry poll, which
   is the same timer that produces most of the notes in the first place. */
let NOTE_UNREAD=0;

/* The unread bell, in the frame's top-right corner beside the mute pip.

   **On the frame rather than on the Notifications screen**, which is the whole
   point of it: a note filed while somebody is reading Traces is exactly the
   case the centre exists for, and a badge only visible from the screen it
   counts is a badge nobody sees. Silent when zero — a permanent grey nought is
   a control, and this is meant to be a signal. */
function notePip(){
 if(!NOTE_UNREAD)return '';
 const label=`${NOTE_UNREAD} unread notification${NOTE_UNREAD===1?'':'s'} — click to read`;
 return `<button class="note-pip warn" title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}"
   onclick="go('nervis','Notifications')"
   ><svg class="bell" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.6a4 4 0 0 1 8 0c0 3 1.1 4 1.1 4H2.9S4 9.6 4 6.6z"/><path d="M6.6 12.8a1.5 1.5 0 0 0 2.8 0"/></svg>${escapeHtml(NOTE_UNREAD>99?'99+':NOTE_UNREAD)}</button>`;
}

/* Re-read the count and redraw just the badge.

   A full repaint for a number would throw away scroll position and any open
   control, which §25.2 is emphatic about — the same reason `paintVoicePip`
   exists beside it. */
async function paintNotePip(){
 const d=await API.nervis.notifications(false);
 NOTE_UNREAD=d.live?d.unread:0;
 const slot=document.getElementById('notePipSlot');
 if(!slot)return;
 const wanted=notePip();
 const drawn=slot.querySelector('.note-pip');
 if(!wanted){if(drawn)drawn.remove();return}
 if(!drawn){slot.insertAdjacentHTML('beforeend',wanted);return}
 const fresh=document.createElement('div');
 fresh.innerHTML=wanted;
 const next=fresh.firstElementChild;
 if(next&&next.outerHTML!==drawn.outerHTML)drawn.replaceWith(next);
}

function voicePip(){
 const set=SPEECH.settings;
 if(!set||!set.credential||!set.credential.configured)return '';
 const off=!set.enabled||set.muted;
 const label=off?'Voice is off — click to unmute'
   :(set.announce_status?'Voice on, and status changes are announced. Click to mute'
                        :'Voice on. Click to mute');
 return `<button class="voice-pip${off?' off':''}" title="${escapeHtml(label)}"
   aria-label="${escapeHtml(label)}" onclick="VOICE.quickMute(${off?'false':'true'})"
   >${off?'&#128263;':'&#128266;'}</button>`;
}

/* Whether anything on this machine can serve a model, said only when it cannot.

   **The same grouping the ecosystem map already makes**, rather than a second
   opinion about which peers are runtimes: LM Studio and Ollama bundle into one
   "Local models" node there, green when *either* answers, because either is
   enough to serve one.

   Silent when a runtime is up, because "local models are available" is not
   news. Silent too when neither was ever configured — a machine that has never
   had either installed is not missing anything, and announcing a lack of
   something nobody set up is the alarm-about-absent-software the registry
   already refuses to raise elsewhere. */
function localModelsLine(items){
 const local=(items||[]).filter(s=>s.key==='lmstudio'||s.key==='ollama');
 if(!local.length)return '';
 const up=local.filter(s=>['healthy','degraded'].includes(s.state));
 if(up.length===local.length)return '';
 /* Named only where NERVIS has actually watched it answer and then stop.
    `awaiting_first_contact` is not the reliable "never installed" it looks
    like — it means *not seen since NERVIS started*, so a runtime closed before
    the last restart wears it too. Naming one on that basis would report a
    machine that never had Ollama as having lost it. */
 const named=local.filter(s=>!up.includes(s)&&!s.awaiting_first_contact);
 const isare=(n)=>n.length>1?'are':'is';
 if(!up.length){
  /* True whichever way it got here — closed, crashed, or never installed — and
     it is the fact worth hearing: nothing on this machine can serve a model. */
  return named.length
   ?`${named.map(s=>s.label).join(' and ')} ${isare(named)} down, so no local `
     +'models are available at the moment.'
   :'No local models are available at the moment.';
 }
 /* One up and one down is not "no local models" — it is a named absence, and
    saying otherwise would be wrong in the direction that matters. */
 return named.length
  ?`${named.map(s=>s.label).join(' and ')} ${isare(named)} not answering, though `
    +`${up.map(s=>s.label).join(' and ')} still ${isare(up)}.`
  :'';
}

/* Morning, afternoon or evening, from the reader's own clock. */
function partOfDay(){
 const h=new Date().getHours();
 return h<12?'morning':h<18?'afternoon':'evening';
}

function chatMood(mood){
 const app=avatarFor('nervis');
 const wanted=mood?((CHAT_MOODS[app]||{})[mood]||CHAT_MOODS[app].answering)
                  :desiredAvatarState(app,state.view);
 document.querySelectorAll(`iframe[data-avatar="${app}"]`).forEach(f=>{
  try{f.contentWindow.setState(wanted)}catch(e){}
 });
}

/* ── VOICE SCREEN ─────────────────────────────────────────────────────────
   The key goes in here, the voices are named here, and both facts about
   privacy that §18.2 attaches to speech are stated here rather than assumed.

   This is a NERVIS screen and not a RAVIS one, which is deliberate and is what
   §18.2 requires: *voice credentials live in NERVIS's own secure storage*.
   RAVIS.md §5.0.1 says the same from its side, reserving `tts` and `audio` as
   substrings RAVIS ids must avoid. The deciding argument is the gate — whether
   a sentence may leave the machine depends on how the reply was produced, and
   that is a fact NERVIS holds. */
/* Voice used to be its own nav item, and every card on it is a setting: the
   credential, the named voices, the engine, and whether NERVIS speaks at all.
   A screen of nothing but settings sitting *beside* Settings is a second
   settings screen with a different name — so it returns its cards and
   `settingsView` places them, which also removed the duplicate voice toggles
   that had just been added to Settings to give that screen something real to
   write. One home, one editor. */
async function voiceSection(){
 const data=await SPEECH.load();
 if(!data){
  return `<div class="card full"><h3>Voice</h3>${cell(`
   <div class="trace-step"><b>endpoint</b><span class="mono">GET /api/v1/voice</span></div>
   <small class="mono dim">no transcription to fall back to, deliberately. A remembered "configured" for a service that is not running would be the most misleading thing this screen could say.</small>`,'nervis')}</div>`;
 }
 /* One function per card. It was one function for all five, which read fine and
    scored 22 against a ratchet of 13 — a template with a ternary in every other
    line is mostly branches, and there the branches are the content rather than
    the logic. Splitting on the card boundary is the seam already present. */
 return voiceKeyCard(data)+voiceVoicesCard(data)
   +voiceEngineCard(data)+voiceSpeaksCard(data);
}

     ${(data.engines||[]).map(e=>`<option value="${e}" title="${escapeHtml((data.engine_detail||{})[e]||'')}">${e}</option>`).join('')}</select></span>
