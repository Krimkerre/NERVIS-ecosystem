   <small class="mono dim">read from <b>NERVIS /api/v1/system</b>, sampled at the moment of the request rather than by a background timer — a value from a timer is whatever the timer last caught, not the state when you looked. Ordered by <b>memory</b> rather than CPU: this ecosystem's failure mode is a multi-gigabyte model resident when something else needs the room. A command name, never a command line — an argument list is where a workspace path leaks. <b>Thermal is macOS-only</b> and reads <i>not reported</i> elsewhere rather than a comfortable-looking <i>nominal</i>: SIRVIS's first probe collapsed those two and reported a happy machine while it lost 48% of its throughput to heat.</small>`,'nervis')}</div>
  <div class="card wide${escapeHtml(liveClass(m.live))}"><h3>Machine ${escapeHtml(m.machine_id)}</h3>${cell(`
   <div class="table-row head five" style="grid-template-columns:1fr .62fr .78fr 1.05fr .55fr"><span>Hostname</span><span>Model</span><span>Chip</span><span>Cores</span><span>OS</span></div>
   <div class="table-row five" style="grid-template-columns:1fr .62fr .78fr 1.05fr .55fr"><span>${orUnknown(m.hostname)}${(m.sensitive_fields||[]).includes('hostname')?' <span class="chip warn" title="§5.1: a hostname is often a person&#39;s name. Labelled so anything forwarding this snapshot knows to drop it.">personal</span>':''}</span><span class="mono">${orUnknown(m.model)}</span><span>${escapeHtml(m.chip)}</span><span class="mono">${escapeHtml(m.cpu_cores)} CPU · ${escapeHtml(m.gpu_cores)} GPU</span><span class="mono">${escapeHtml(m.macos)}</span></div>
   <div class="trace-step" style="margin-top:11px"><b>memory in use</b><span>${escapeHtml((m.memory_gb-m.available_gb).toFixed(1))} of ${escapeHtml(m.memory_gb)} GB</span></div>
   <div class="bar"><i style="--w:${usedPct}%"></i></div>
   <small class="mono dim">this identity is part of every evidence record. A result carried to another machine — a different chip, a different macOS, a different thermal state — is a fact about the machine it was measured on, and SIRVIS keeps it labelled that way rather than averaging across hardware.</small>`,'sirvis')}</div>
  <div class="card narrow${escapeHtml(liveClass(m.live))}"><h3>Runtimes</h3>${cell(`
   <div class="table-row head"><span>Runtime</span><span style="grid-column:2/-1">Version</span></div>
   ${m.runtimes.map(r=>`<div class="table-row"><span>${escapeHtml(r.name)}</span><span class="mono" style="grid-column:2/-1">${escapeHtml(r.version)}</span></div>`).join('')}
   <small class="mono dim">runtime versions are pinned too. An LM Studio or MLX upgrade is exactly the event that moves throughput without anything else changing, and comparing across one without saying so produces a regression nobody can locate.</small>`,'sirvis')}</div>
  <div class="card full${escapeHtml(liveClass(m.live))}"><h3>Conditions</h3>${cell(`
   <div class="table-row head five"><span>Condition</span><span>Now</span><span style="grid-column:3/-1">Effect on a measurement taken in it</span></div>
   <div class="table-row five"><span>Thermal state</span><span class="chip${warnUnless(m.thermal_state==='nominal')}">${escapeHtml(m.thermal_state)}</span><span style="grid-column:3/-1;opacity:.75">throttling lowers throughput; a run taken hot is marked, not silently averaged in</span></div>
   <div class="table-row five"><span>Swap</span><span class="chip${warnIf(m.swap_gb)}">${escapeHtml(m.swap_gb)} GB</span><span style="grid-column:3/-1;opacity:.75">any swap means the run partly measured the disk, and the result is invalid for throughput</span></div>
   <div class="table-row five"><span>Available memory</span><span class="mono">${escapeHtml(m.available_gb)} GB</span><span style="grid-column:3/-1;opacity:.75">bounds which builds and which combinations can be attempted at all</span></div>
   <small class="mono dim">these are read at the start and the end of every run. They are the difference between "this build is slow" and "this machine was busy".</small>`,'sirvis')}</div>`}

/* Which profile the operator has selected but not yet committed. A single
   module-level value: arming is transient UI state, not something the router
   knows about, and it is cleared by any render that follows a commit or cancel. */
/* A destructive action, confirmed in the page rather than by the browser.

   **`confirm()` can be switched off, and the page cannot tell.** Chrome offers
   "prevent this page from creating additional dialogs" after a couple of
   prompts, and once that is ticked every `confirm()` returns `false` with no
   dialog and no error — so the button does nothing, forever, and looks broken
   rather than cancelled. That is exactly what happened to Delete in the
   history list, and it applied equally to the four other destructive controls.

   Two clicks instead: the first arms and says what will happen, the second
   does it. The warning still gets read, nothing is one keystroke from being
   lost, and no part of it depends on a modal the browser may have muted. The
   same shape as `armProfile`, which was already here for the same reason. */
let ARMED_ACTION=null;

function armed(key,warning){
 if(ARMED_ACTION===key){ARMED_ACTION=null;return true}
 ARMED_ACTION=key;
 notify(warning+' — click again to confirm');
 render();
 return false;
}

let ARMED=null;
function armProfile(id){ARMED=ARMED===id?null:id;render()}
/* The RAVIS dashboard from RAVIS's own records.
 *
 * Four figures, and only two of them are knowable — which is the whole reason
 * this screen is written out rather than left to the transcription. The
 * transcription reported a routing P50 of 3.1 ms, 88% local and €0.42 spent
 * today, all invented, on the first page anybody opens.
 *
 * `local_share` is counted from the provider each decision actually used,
 * against the same `is_local_address` test `ravis/local` is enforced with, so
 * the number here and the promise in that pool cannot disagree.
 *
 * Routing time and spend stay absent. Nothing instruments the decision, and the
 * cost engine is M15 — RAVIS says so itself in `cost_detail`, and repeating its
 * sentence is better than inventing a figure to fill the tile.
 */
function liveRavisDashboard(decisions, usage, prof){
 const active=prof.items.find(x=>x.default)||prof.items[0];
 const share=usage.local_share;
 $('#content').innerHTML=kpis([
   ['Active profile',active?active.label:'—',
     active?`${active.profile_id} · rev ${active.revision}`:'','ravis',true],
   ['Decisions',`${usage.routed} / ${usage.decisions_recorded}`,
     usage.no_route?`${usage.no_route} refused as no-route`:'none refused','ravis',true],
   ['Local',share==null?'—':Math.round(share*100)+'%',
     share==null?'nothing has executed yet':`of ${usage.executed} executed`,'ravis',true],
   /* **Real since M15, and it still says what kind of number it is.** This read
      "not measured · the cost engine lands at M15" — true when written, and
      RAVIS now estimates from published prices and reports what providers
      state. Rendered as unknown rather than omitted when nothing has been
      priced: a missing tile reads as a page that forgot, and §14 forbids a
      confident nought. The subtitle carries the coverage rather than the
      total alone, because a sum without the calls behind it invites being
      read as a bill. */
   ['Spend',
     usage.cost_available?money(usage.spend_estimated,usage.spend_currency):'not measured',
     usage.cost_available
       ? `estimated · ${usage.calls_priced} of ${usage.calls_priced+usage.calls_unpriced} call(s) priced · 24h`
       : (usage.cost_detail||'nothing has been priced yet'),
     'ravis',true]])
 +(decisions.length
   ? decisionCard(decisions[0])+funnelCard(decisions[0])+attemptsCard(decisions[0])
     +recentDecisionsCard(decisions.slice(0,8))
   : `<div class="card full live"><h3>Nothing has routed yet</h3>${cell(`
   <div class="trace-step"><b>decisions recorded</b><span>0</span></div>
   <small class="mono dim">RAVIS records a decision per request and keeps them in memory — §17's storage model does not list them, and a breaker that survived a restart would be worse than one that did not. Send a request through <span class="mono">/v1/chat/completions</span> and this fills in.</small>`,'ravis')}</div>`);
}

async function ravis(){const v=RAVIS_VIEWS[state.view];if(v)return v();
 heading('Route intelligence','Hard constraints eliminate, then preferences rank. Every route explains itself.',control('Simulate request','reroute',' primary'));
 const [decisions,usage,prof]=await Promise.all([API.ravis.decisions(25),
   API.ravis.usage(),API.ravis.profiles()]);
 /* Live when RAVIS answers at all — the counts are real even before anything
    has routed, and "nothing has routed yet" is a better first screen than four
    invented figures. */
 if(usage.live)return liveRavisDashboard(decisions.items,usage,prof);
 $('#content').innerHTML=banner('RAVIS has recorded no route decision',
  'Nothing has been routed through RAVIS yet, or it is not answering. Send a request and '
  +'this screen explains exactly which model was chosen and why every other candidate was '
  +'eliminated.','info');
}

/* ── RAVIS SCREENS ─────────────────────────────────────────────────────────
   RAVIS owns every figure on these pages except the benchmark evidence, which is
   SIRVIS's and is labelled as such — that split is the point of the Evidence
   screen. The recurring discipline here is the difference between a constraint
   and a score: hard constraints eliminate candidates before ranking, so an
   excluded row never carries a number, and NO_ROUTE is a result rather than a
   failure. */

/* Routes — one decision, in full. The funnel is derived from the record itself
   (eligible + excluded → eligible) rather than captioned, so it cannot drift away
   from the data underneath it. */
/* The Routes screen, from RAVIS's own decision records.
 *
 * What the live record carries and the mock invented are different sets, and
 * the difference is the point of wiring it: there is no per-candidate `score`,
 * no per-candidate `ttft_s` and no phase breakdown of the routing time. RAVIS
 * publishes none of those — ranking on quality is M13, and nothing instruments
 * the decision in phases — so a live screen shows the funnel and the reasons
 * instead of a bar chart of numbers nobody measured.
 *
 * What it gains is the half that matters during an incident: **why each
 * candidate was excluded**, in RAVIS's own words.
 */
function exclusionSummary(excluded){
 /* Grouped by reason, never listed. A pool with six hundred candidates excludes
    five hundred and eighty of them, and the card that used to render one row
    each was forty thousand characters nobody read. The reason is the finding;
    the model list behind it is a detail. */
 const byReason={};
 for(const e of excluded||[]){
  for(const reason of (e.reasons||['unstated'])){
   (byReason[reason]=byReason[reason]||[]).push(e.model);
  }
 }
 return Object.entries(byReason).sort((a,b)=>b[1].length-a[1].length);
}

function decisionCard(d){
 const reqs=(d.requirements||[]).filter(r=>r&&r!=='none');
 return `<div class="card wide live"><h3>${escapeHtml(d.pool||d.requested||'')} · decision ${escapeHtml((d.decision_id||'').slice(0,12))}</h3>${cell(`
   <div class="trace-step"><b>requested</b><span class="mono">${escapeHtml(dash(d.requested))}</span></div>
   <div class="trace-step"><b>selected</b><span class="mono">${escapeHtml(d.selected||'no route')}</span></div>
   <div class="trace-step"><b>path</b><span class="mono">${escapeHtml(dash(d.execution_path))}</span></div>
   ${reqs.length?`<div class="trace-step"><b>required</b><span class="mono">${reqs.map(escapeHtml).join(' · ')}</span></div>`
     :'<div class="trace-step"><b>required</b><span style="opacity:.7">nothing — the request carried no hard constraint</span></div>'}
   <small class="mono dim">${escapeHtml(d.reason||'')}</small>`,'ravis')}</div>`;
}

function funnelCard(d){
 const groups=exclusionSummary(d.excluded);
 const considered=(d.considered||[]).length;
 const eligible=considered-(d.excluded||[]).length;
 return `<div class="card wide live"><h3>Constraint funnel <span class="chip">${eligible} of ${considered} survived</span></h3>${cell(`
   ${groups.length?`<div class="table-row head"><span>Removed because</span><span>Count</span><span style="grid-column:3/-1">For example</span></div>
   ${groups.map(([reason,models])=>`<div class="table-row">
     <span style="opacity:.85">${reason}</span>
     <span class="mono">${escapeHtml(models.length)}</span>
     <span class="mono" style="grid-column:3/-1;opacity:.6">${escapeHtml(models.slice(0,3).join(', '))}${models.length>3?' …':''}</span></div>`).join('')}`
   :'<div class="trace-step"><b>excluded</b><span>none — every candidate satisfied this pool</span></div>'}
   <small class="mono dim">grouped by reason rather than listed per model: a pool with six hundred candidates excludes most of them, and the reason is the finding. These are <b>hard</b> constraints — a candidate removed here never reached ranking, so none of them has an ordering to show. <b>There is no per-candidate score.</b> RAVIS publishes none: ranking on quality is M13, and inventing one to fill this column is exactly what §9.4 rules out.</small>`,'ravis')}</div>`;
}

function attemptsCard(d){
 const attempts=(d.execution||{}).attempts||[];
 const stopped=(d.execution||{}).stopped_because;
 return `<div class="card narrow live"><h3>Fallback chain</h3>${cell(`
   <div class="trace-step"><b>primary</b><span class="mono">${escapeHtml(d.selected||'—')}</span></div>
   ${(d.fallbacks||[]).map((f,i)=>`<div class="trace-step"><b>fallback ${i+1}</b><span class="mono">${f}</span></div>`).join('')}
   ${attempts.length?`<div class="trace-step" style="margin-top:6px"><b>attempted</b><span></span></div>
   ${attempts.map((a,i)=>`<div class="trace-step"><b>${i+1}</b><span class="mono">${escapeHtml(a.model)} → <span class="chip${warnUnless(a.outcome==='succeeded')}">${escapeHtml(a.outcome)}</span>${a.detail?' · '+escapeHtml(a.detail):''}${attemptFacts(a)}</span></div>`).join('')}`:''}
   ${stopped?`<div class="trace-step"><b>stopped</b><span style="opacity:.75">${stopped}</span></div>`:''}
   <small class="mono dim">every entry satisfies the same hard constraints and the same pool invariant — a fallback is a different candidate, never a relaxed one. The attempts below are what actually happened, which is not always the chain above.</small>`,'ravis')}</div>`;
}

function recentDecisionsCard(items){
 return `<div class="card full live"><h3>Recent decisions</h3>${cell(`
   <div class="table-row head five"><span>At</span><span>Requested</span><span>Selected</span><span>Path</span><span>Outcome</span></div>
   ${items.map(d=>`<div class="table-row five">
     <span class="mono">${escapeHtml(clockOf(d.decided_at))}</span>
     <span class="mono">${escapeHtml(dash(d.requested))}</span>
     <span class="mono">${escapeHtml(d.selected||'no route')}</span>
     <span class="mono" style="opacity:.75">${escapeHtml(dash(d.execution_path))}</span>
     <span class="chip${warnUnless(outcomeOf({selected:d.selected,execution:d.execution})==='succeeded'||Boolean(d.selected))}">${escapeHtml(outcomeOf({selected:d.selected,execution:d.execution}))}</span></div>`).join('')}
   <small class="mono dim">held in memory only — §17 does not list route decisions as stored state, so a restart loses them and that is the intended trade. <b>NO_ROUTE is a first-class result</b>: it means a hard constraint could not be satisfied and RAVIS refused rather than routing around it.</small>`,'ravis')}</div>`;
}

function liveRoutesScreen(decisions,prof){
 /* **RAVIS answering with nothing is not RAVIS being down**, and this screen
    could not say so: it read `decisions[0]` straight away, so the only thing
    keeping it from throwing was `decisions()` reporting an empty-but-successful
    response as a failure and handing back a mock instead. That made a restarted
    RAVIS — whose decision log is in memory and starts empty — render invented
    routes, and the Overview tile beside it say "RAVIS not answering" while
    RAVIS answered every request put to it.
    The log is bounded and in memory, so empty is the ordinary state after a
    restart rather than an error worth dressing up. */
 if(!decisions.length){
  const chosen=prof.items.find(p=>p.default)||prof.items[0];
  $('#content').innerHTML=`<div class="card full live"><h3>Nothing has routed yet</h3>${cell(`
   <div class="trace-step"><b>endpoint</b><span class="mono">GET /api/v1/route-decisions</span></div>
   <div class="trace-step"><b>returned</b><span>an empty list — RAVIS is answering</span></div>
   <div class="trace-step"><b>active profile</b><span>${chosen?escapeHtml(chosen.label):'—'}</span></div>
   <small class="mono dim">route decisions are kept <b>in memory and bounded</b>, so a restart empties them and that is the intended trade — §17 does not list them as stored state. Send a request through <span class="mono">ravis/auto</span> and the funnel, the fallback chain and the candidate snapshot appear here for it.</small>`,'ravis')}</div>`;
  return;
 }
 const newest=decisions[0];
 const active=prof.items.find(p=>p.profile_id===CHAT_SESSION.profile)||prof.items.find(p=>p.default)||prof.items[0];
 const considered=(newest.considered||[]).length;
 const eligible=considered-(newest.excluded||[]).length;
 $('#content').innerHTML=kpis([
   ['Profile',active?active.label:'—',active?active.profile_id:'','ravis',true],
   ['Candidates',`${considered} → ${eligible}`,'after hard constraints','ravis',true],
   ['Decisions kept',String(decisions.length),'in memory, not persisted','ravis',true],
   ['Path',dash(newest.execution_path),'transparent vs translated','ravis',true]])
 +decisionCard(newest)+funnelCard(newest)+attemptsCard(newest)+recentDecisionsCard(decisions);
}

async function ravisRoutes(){
 heading('Routes','One decision record: requirements, the constraint funnel, the ranking, and what it cost to decide.',
  control('Simulate request','reroute',' primary'));
 const [live,prof]=await Promise.all([API.ravis.decisions(25),API.ravis.profiles()]);
 /* The live record when RAVIS has one, and the transcription otherwise. Not a
    blend: the mock carries per-candidate scores and a phase breakdown that
    RAVIS does not publish, so mixing them would put invented numbers beside
    measured ones on the same screen. */
 if(live.live)return liveRoutesScreen(live.items,prof);
 $('#content').innerHTML=banner('RAVIS has recorded no route decision',
  'Nothing has been routed through RAVIS yet, or it is not answering. Send a request and '
  +'this screen explains exactly which model was chosen and why every other candidate was '
  +'eliminated.','info');
}

/* Pools — a pool is its invariants, and on this machine every one of them has a
   member, so the interesting question is not which pool is empty but who is in
   the strictest one and who is not. The membership card answers that per build,
   because a derived count nobody can audit is just a number with better manners. */
/* One pool, with its membership picker folded underneath.
   A pool is its invariants and picks from whatever satisfies them — the right
   default, and what keeps it working as a catalogue changes. With six hundred
   models across four providers that is a wider net than most people want
   `ravis/fast` casting, so the picker is an optional *narrowing*: tick fewer,
   and the pool chooses among those. Tick everything and it goes back to
   choosing for itself. */
/* Narrowing a pool to the models an operator wants it choosing among.
   The same shape as the provider picker, and deliberately so — one interaction
   learned once. What differs is what the list contains: a provider's picker
   offers its whole catalogue, and a pool's offers only what already satisfies
   that pool's invariants, because everything else is not a choice. */
const POOLEDIT={
 state:{},

 toggle(key){
  const panel=document.getElementById(domId('pm',key));
  if(!panel)return;
  const opening=panel.style.display==='none';
  panel.style.display=opening?'block':'none';
  if(opening)this.load(key);
 },

 async load(key){
  const list=document.getElementById(domId('pml',key));
  if(!list)return;
  list.innerHTML='<div class="picker-empty">reading candidates…</div>';
  try{
   const r=await fetch(BASE.ravis+'/api/v1/pools/'+encodeURIComponent(key)+'/members',
     {signal:AbortSignal.timeout(15000)});
   if(!r.ok){list.innerHTML=`<div class="picker-empty">RAVIS refused: HTTP ${escapeHtml(r.status)}</div>`;return}
   const d=await r.json();
   if(!(d.items||[]).length){
    list.innerHTML=`<div class="picker-empty">no model satisfies this pool’s invariants right now${escapeHtml(d.locality==='local'?' — no local runtime is answering, and this pool never leaves this machine':'')}.</div>`;
   }
   this.state[key]={all:(d.items||[]).map(i=>i.id),
     remote:new Set((d.items||[]).filter(i=>i.remote).map(i=>i.id)),
     tier:Object.fromEntries((d.items||[]).map(i=>[i.id,i.tier||''])),
     price:Object.fromEntries((d.items||[]).map(i=>[i.id,i.price_per_million])),
     on:new Set((d.items||[]).filter(i=>i.selected).map(i=>i.id)),
     narrowed:d.narrowed, defaultTier:d.default_tier||'', q:'', ceiling:null};
   this.explain(key,d);
   this.render(key);
  }catch(e){list.innerHTML='<div class="picker-empty">RAVIS is not reachable.</div>'}
 },

 /* The prices present in this pool's candidates, ascending, deduplicated.
    The slider steps through *these* rather than across a linear dollar range,
    because the distribution is nothing like linear: hundreds of models sit at
    exactly zero and a handful cost ninety dollars a million, so a linear slider
    spends nine tenths of its travel in empty space and cannot separate the
    cheap end at all. Stepping through the actual values gives every position
    something to select. */
 priceSteps(key){
  const st=this.state[key];
  if(!st)return[];
  const known=st.all.map(id=>st.price[id]).filter(p=>typeof p==='number');
  return [...new Set(known)].sort((a,b)=>a-b);
 },

 setCeiling(key,percent){
  const st=this.state[key];
  const steps=this.priceSteps(key);
  if(!st||!steps.length)return;
  const index=Math.round((Number(percent)/100)*(steps.length-1));
  /* The top of the slider means *no ceiling*, not "the most expensive model" —
     those differ the moment a pricier model appears, and only one of them is
     what someone dragging to the far right meant. */
  st.ceiling=Number(percent)>=100?null:steps[index];
  this.render(key);
 },

 /* Tick everything at or under the ceiling, and untick the rest.
    A separate button rather than something the slider does on its own: moving a
    slider is exploring, and a control that rewrote a selection on every pixel
    of travel would destroy a hand-made one before its owner let go. */
 tickWithinPrice(key){
  const st=this.state[key];
  if(!st)return;
  for(const id of st.all){
   const price=st.price[id];
   const within=typeof price==='number' && (st.ceiling===null || price<=st.ceiling);
   if(within)st.on.add(id); else st.on.delete(id);
  }
  this.render(key);
 },

 /* What this pool is currently choosing among, and where that came from.
    Three states, not two: an operator's selection, the pool's own default tier,
    or everything. "Narrowed or not" could not tell the middle case from the
    last, and the middle is the one that needs explaining. */
 explain(key,d){
  const note=document.getElementById(domId('pmn',key));
  if(!note)return;
  if(d.narrowed){
   note.innerHTML=`using <b>your selection</b> of ${escapeHtml(d.chosen_total)} model(s). Tick everything to hand the choice back to the pool.`;
   return;
  }
  if(!d.default_tier){
   note.innerHTML='using <b>every eligible model</b>. This pool declares no default tier.';
   return;
  }
  note.innerHTML=`using this pool\u2019s default <b>${escapeHtml(d.default_tier)}</b> tier \u2014 ${escapeHtml(d.chosen_total)} of ${escapeHtml(d.total)} eligible. Size is read from the parameter count in a name, or from the vendor\u2019s own tier word where there is none: <b>haiku / sonnet / opus</b> is the clearest case. That is <b>product tiering, not a latency measurement</b> \u2014 no cloud provider publishes one. Tick differently and your selection replaces the default outright.`;
 },

 render(key){
  const st=this.state[key];
  if(!st)return;
  this.paintPrice(key);
  const list=document.getElementById(domId('pml',key));
  const shown=this.matching(key);
  if(shown.length)list.innerHTML=shown.map(id=>`<label class="picker-item" title="${id}${escapeHtml(st.tier[id]?' \u00b7 '+st.tier[id]:'')}">
    <input type="checkbox"${st.on.has(id)?' checked':''}
      onchange="POOLEDIT.tick('${jsAttr(key)}','${jsAttr(id)}',this.checked)">
    <span>${id}</span>${typeof st.price[id]==='number'?`<em title="per million tokens, prompt plus completion">${escapeHtml(st.price[id]===0?'free':'$'+st.price[id].toFixed(2))}</em>`:''}${st.tier[id]?`<em>${escapeHtml(st.tier[id])}</em>`:''}</label>`).join('');
  else if(st.all.length)list.innerHTML='<div class="picker-empty">nothing matches that.</div>';
  this.count(key);
 },

 /* What the search box selects.
    Matches the model id, and also the words describing *where and what* it is —
    `local`, `remote`, `cloud`, and the size tier. A model id says nothing about
    placement, so filtering six hundred of them for "the ones on my machine" was
    impossible until now: the facts existed on every row as a badge and could
    not be searched for. */
 matching(key){
  const st=this.state[key];
  if(!st)return[];
  if(!st.q)return st.all;
  return st.all.filter(id=>{
   if(id.toLowerCase().includes(st.q))return true;
   const placement=st.remote.has(id)?'remote cloud api':'local on-machine';
   return (placement+' '+(st.tier[id]||'')).includes(st.q);
  });
 },

 paintPrice(key){
  const st=this.state[key];
  const row=document.getElementById(domId('pmp',key));
  if(!st||!row)return;
  const steps=this.priceSteps(key);

     could not move anything — a control that does nothing is worse than an

  row.style.display=steps.length>1?'flex':'none';
  if(steps.length<2)return;
  const within=st.all.filter(id=>typeof st.price[id]==='number'
    &&(st.ceiling===null||st.price[id]<=st.ceiling)).length;

  const st=this.state[key];

     search results — the second number changes meaning with the search box. */

  const st=this.state[key];

  const st=this.state[key];

      and the browser must not be given the credential that replaced it. */

   its undo is the same call. Confirmed first, because it overwrites every
   selection an operator made by hand, which is not something to discover
   afterwards. */

   selects from today's catalogue, rather than a list that was stored. Saying
   "curated 161" without that reads as a snapshot somebody now has to maintain,
   which is exactly the thing this stopped doing. */
function curateOutcome(d){

   +(pinned.length?`, ${pinned.length} released from a pinned selection`:'')
   +`. Right now: `+narrowed.map(x=>`${x.pool_id.replace('ravis/','')} ${x.selected}/${x.eligible}`).join(', ')

async function curatePools(){

  if((r.required||[]).length)parts.push(`${r.required.join(' + ')} required`);

   ${p.items.map(x=>`<div class="table-row six"><span>${escapeHtml(x.label)}</span><span class="mono" style="grid-column:2/4;opacity:.8">${escapeHtml(x.base_url)}</span><span class="mono">${escapeHtml(x.chat_path||'not published')}</span><span class="mono">${x.auth?escapeHtml(x.auth.scheme)+(x.auth.header?' · '+escapeHtml(x.auth.header):''):'not published'}</span><span class="mono" style="opacity:.7">${x.auth?escapeHtml(dash(x.auth.secret_ref)):'—'}</span></div>`).join('')}
   <small class="mono dim"><b>chat path</b> and <b>auth</b> read "not published" against a live RAVIS because <b>/api/v1/providers</b> does not carry them — which is an absence rendered as one rather than invented, so this card is live with two honest gaps in it. This is the whole of what an implementation needs to place a call, and none of it is a secret: <b>secret_ref</b> names where the key lives, and RAVIS resolves it at call time inside the process. The value never crosses into a browser, a log, an event or a diagnostic packet — which is what makes it safe to render the reference at all.</small>`,'ravis')}</div>`}

/* Policies — conditions and actions in evaluation order. Hard policies eliminate,
   soft policies bias the ranking; showing them in one list without that column
   would make a preference look like a guarantee. */
/* What governs a route when no policy engine exists, which is today.
   Not a placeholder: these are enforced on every request, by the pool
   invariants and the routing engine rather than by a rule table. Somebody
   asking "what decides where my request goes" deserves this answer rather than
   an empty list. */
/* §9.2's hard/soft split, rendered for both policy screens.

   Shared because both need it and neither owns it: a hard constraint eliminates
   a candidate, a soft preference only reorders the survivors, and showing them
   in one list without that column would make a preference look like a
   guarantee. Duplicating the table would let the two screens drift into
   describing the router differently. */
function constraintTable(){
 const HARD=[
  ['pool invariants','a capability, a minimum context or a locality the pool requires','core/pools.py'],
  ['locality','ravis/local and ravis/private never leave this machine','PoolRequirements.locality'],
  ['request requirements','tools or images in the request itself demand a model that handles them','routing/requirements.py'],
  ['application policy','§9.6\u2019s privacy level, provider allow/deny and model exclusions','policy.py'],
  ['open circuit','§10 routes away from a provider that is failing','reliability/health.py'],
  ['operator selection','the models ticked for this pool, which narrows and never widens','pool_membership.py'],
 ];
 const SOFT=[
  ['session affinity','§12.1 keeps a conversation on the model it started with','sessions.py'],
  ['load amortisation','§12.2 declines a model load when sessions are measurably short','LOAD_AMORTISES_AFTER_REQUESTS'],
  ['prefer already loaded','a resident model needs no load','residency'],
  ['prefer local','placement, where the pool asks for it','prefer_local'],
  ['prefer cheap','published price per million; unpriced sorts last','prefer_cheap'],
  ['prefer fast','measured time-to-first-token, above a sample floor','prefer_fast'],
  ['size tiebreak','among candidates a pool considers equal, the smaller','size_rank'],
 ];
 const rows=(list,kind)=>list.map(([name,effect,where])=>`<div class="table-row">
   <span class="mono">${name}</span>
   <span style="grid-column:2/4;opacity:.85">${effect}</span>
   <span class="mono" style="opacity:.55">${where}</span>
   <span class="chip${kind==='hard'?' warn':''}">${kind}</span></div>`).join('');
 return `<div class="table-row head"><span>Rule</span><span style="grid-column:2/4">Effect</span><span>Where</span><span>Kind</span></div>
   ${rows(HARD,'hard')}${rows(SOFT,'soft')}
   <small class="mono dim">a <b>hard</b> constraint eliminates a candidate and a <b>soft</b> preference only reorders the survivors — §9.2's split, and the reason a pool with no eligible member returns <b>NO_ROUTE</b> rather than the nearest thing available. Only the preferences a pool actually declares are consulted: an unconditional term would become the whole ranking for every pool that declares nothing.</small>`;
}

function noPoliciesScreen(){
 $('#content').innerHTML=kpis([
   ['Applications','0','none have a policy configured','ravis',true],
   ['Default','none','nothing is restricted','ravis',true],
   ['Enforcement','hard','applied before ranking, never as a score','ravis',true],
   ['Engine','M16','shipped','ravis',true]])
 +`<div class="card full live"><h3>No policy is configured</h3>${cell(`
   <div class="trace-step"><b>endpoint</b><span class="mono">GET /api/v1/policies</span></div>
   <div class="trace-step"><b>returned</b><span>an empty list</span></div>
   <small class="mono dim">and that is now a statement about <i>configuration</i> rather than about the engine. The policy engine shipped at <b>M16</b>: privacy levels, provider allow and deny lists, model exclusions and §9.6.1's background-call class, every one of them a hard constraint applied before ranking. An empty list means an operator has written no <b>policies.json</b>, so every application routes unrestricted — this page said "not built" for a while after that stopped being true, which is the same defect as a capability advertising a limit that has been lifted. What <i>does</i> govern a route regardless is below, and it is enforced on every request.</small>`,'ravis')}</div>
  <!-- Not live: constraintTable() builds its rows from two literal arrays
       declared inside itself, and nothing in it is read from RAVIS. The
       identical call on the other branch of this screen renders unbadged, and
       the page's own rule is stated a few lines below - the badge means
       provenance, not truth. -->
  <div class="card full"><h3>What actually decides a route <span class="chip">§9.2</span></h3>${cell(constraintTable(),'ravis')}</div>`;
}

/* Sessions — §12.1's correlation, and the one screen where isolation is visible.

   A session answers "what has this conversation been using", which is why the
   model, provider and pool revision are the columns rather than anything about
   the conversation itself. There is nothing about the conversation itself to
   show: §12.1 stores no prompt and no response, and this page cannot leak what
   RAVIS never held.

   `requests` is not decoration. It is what §12.2's load-versus-don't tradeoff
   reads — an application whose sessions are measurably short does not get a
   model load paid for it — so a reader wondering why a strong model was passed
   over can see the number that decided it. */
async function ravisSessions(){
 heading('Sessions','What each conversation has been routed to, and how long it has run.');
 const s=await API.ravis.sessions();
 const now=Date.now()/1000;
 const ago=t=>{const d=Math.max(0,now-(t||0));
   return d<90?`${escapeHtml(Math.round(d))}s ago`:d<5400?`${escapeHtml(Math.round(d/60))}m ago`:`${escapeHtml(Math.round(d/3600))}h ago`};
 const counts=s.items.map(x=>x.requests||0).sort((a,b)=>a-b);
 const median=counts.length?counts[Math.floor(counts.length/2)]:0;
 /* `s.live` on each, which this screen shipped without — and it is the same
    defect it was written days after criticising elsewhere: four tiles computed
    from a live /api/v1/sessions response, badged PROTOTYPE because nobody
    passed the flag. "Content stored" is the one hard-coded `true`, because it
    is a property of the schema rather than of the answer: there is nowhere in
    the record to put a prompt whether RAVIS replied or not. */
 $('#content').innerHTML=kpis([
   ['Sessions',String(s.items.length),'visible to this caller','ravis',s.live],
   ['Median length',counts.length?String(median):'—','requests per session','ravis',s.live],
   ['Load tradeoff',counts.length?(median>=8?'loads allowed':'loads declined'):'unknown',
    '§12.2, from measured history','ravis',s.live],
   /* Was hardcoded `true` on the argument that no-content-stored is a property
      of the schema rather than of the answer. True — but the badge does not
      mean "this is correct", it means "this came from the running service",
      and on a page opened from disk this tile glowed alone among four faded
      ones. Provenance, not truth. */
   ['Content stored','none','§12.1: no prompts, no responses','ravis',s.live]])
 +`<div class="card full${escapeHtml(liveClass(s.live))}"><h3>Routing sessions</h3>${cell(`
   <div class="table-row head six"><span>Session</span><span>Application</span><span>Pool</span><span style="grid-column:4/6">Model</span><span>Requests</span></div>
   ${s.items.map(x=>`<div class="table-row six"><span class="mono">${escapeHtml(x.session_id)}</span><span class="mono" style="opacity:.8">${escapeHtml(x.application_id)}</span><span class="mono" style="opacity:.75">${escapeHtml(x.pool||'—')}</span><span class="mono" style="grid-column:4/6">${escapeHtml(x.model||'—')}<span class="dim" style="opacity:.6"> via ${escapeHtml(x.provider||'—')}</span></span><span>${escapeHtml(x.requests||0)}<span class="dim" style="opacity:.6"> · ${escapeHtml(ago(x.last_activity))}</span></span></div>`).join('')||'<div class="table-row"><span style="grid-column:1/-1;opacity:.7">no sessions yet — a client supplies one with the <b>X-Session-ID</b> header</span></div>'}
   <small class="mono dim">RAVIS scopes this list to the <b>asking application</b>, so this is what NERVIS can see and not the machine's every session. Two applications may use the identical session ID and get two separate sessions — §12.1 requires that they never merge, and the stored key is an identity rather than a display name, which is what makes it structural instead of a rule somebody has to remember.</small>
   ${explains('what a session pins, and the two windows it lives by',`
    ${s.items.slice(0,3).map(x=>`<div class="trace-step"><b>${escapeHtml(x.session_id)}</b><span class="mono">${escapeHtml(x.pool||'—')} @ ${escapeHtml(x.pool_revision||'—')}</span></div>`).join('')||'<div class="trace-step"><b>—</b><span>nothing to pin yet</span></div>'}
    <div class="trace-step"><b>affinity</b><span>1 hour idle</span></div>
    <div class="trace-step"><b>retention</b><span>7 days idle</span></div>
    <small class="mono dim">§5.4: every session records the <b>pool revision</b> it used, so a consumer can tell that a pool's definition changed underneath a conversation already in progress — the revision is derived from the pool's behaviour, not its wording, so rewording a description keeps it.<br><br>the two windows are deliberately different. A stale session stops <i>steering</i> routing after the first and stays <i>readable</i> until the second: collapsing them would mean either routing on yesterday's choice or losing the correlation somebody is here to read.</small>`)}`,'ravis')}</div>`;
}

async function ravisPolicies(){
 heading('Policies','Conditions and actions, in evaluation order. Hard policies eliminate; soft policies only rank.');
 const p=await API.ravis.policies();
 /* RAVIS answering with nothing is a *fact*, not an empty screen to fill.
    This said the policy engine was unbuilt; M16 shipped it — §14's four privacy
    levels, provider allow and deny, model exclusions and §9.6.1's background
    class, every one a hard exclusion applied before ranking. So an empty list
    now means *no policy is configured*, which is a different sentence and the
    one the screen prints. The constraint table below it is real either way:
    §9.2's hard/soft split is enforced by pool invariants and the routing
    engine, and that is what governs a request when no policy names it. */
 /* Two absences, and they are not the same sentence. `!p.live` is RAVIS not
    answering — or refusing — and there is deliberately nothing remembered to
    draw in its place. Live-and-empty is the different fact that no policy is
    configured, which the screen below states. Neither is a blank page: §9.2's
    constraint table governs a route in both cases, and is rendered in both. */
 if(!p.live){
  $('#content').innerHTML=`<div class="card full"><h3>RAVIS is not answering</h3>${cell(`
   <div class="trace-step"><b>endpoint</b><span class="mono">GET /api/v1/policies</span></div>
   <small class="mono dim">no transcription to fall back to, deliberately. A remembered policy list would say this machine restricts something nobody configured, and on screen it is indistinguishable from a live answer — worse, an <i>empty</i> remembered list reads as "nothing is restricted", which is a confident zero standing where an outage should be. What governs a route regardless is below, and it is enforced on every request.</small>`,'ravis')}</div>
  <div class="card full"><h3>What actually decides a route <span class="chip">§9.2</span></h3>${cell(constraintTable(),'ravis')}</div>`;
  return;}
 if(!p.items.length)return noPoliciesScreen();
 /* One row per application, plus `*` for the default that governs anything
    unlisted. The constraint strings are RAVIS's own words, rendered rather than
    re-derived: this page reproducing the policy vocabulary is how the two drift
    into disagreeing about what a level means. */
 const governed=p.items.filter(x=>x.application_id!=='*').length;
 $('#content').innerHTML=kpis([
   ['Applications',String(governed),'have a policy of their own','ravis'],
   ['Default',p.items.some(x=>x.application_id==='*')?'set':'none',
    'governs everything unlisted','ravis'],
   /* `p.live`, not `true`. This path runs when RAVIS did *not* answer — the
      live-and-empty case returns above — so both tiles claimed a live read
      while the card beneath them correctly faded. A statement that is true of
      the design ("enforcement is hard") is still not something this page read
      from anywhere, and the badge means provenance, not truth. */
   ['Enforcement','hard','applied before ranking, never as a score','ravis',p.live],
   ['Engine','M16','shipped','ravis',p.live]])
 +`<div class="card full${escapeHtml(liveClass(p.live))}"><h3>Policy in force</h3>${cell(`
   <div class="table-row head"><span>Application</span><span style="grid-column:2/-1">Constraints</span></div>
   ${p.items.map(x=>`<div class="table-row"><span class="mono">${escapeHtml(x.application_id)}</span><span style="grid-column:2/-1;opacity:.85">${(x.constraints||[]).map(escapeHtml).join(' · ')||'—'}</span></div>`).join('')}
   <small class="mono dim"><b>*</b> is the default: an application with no row of its own is governed by it. Every constraint here is <b>hard</b> — §14 rule 14 says a privacy constraint can never be overridden by score, so these remove candidates before anything is ranked rather than penalising them inside it. <b>LOCAL_PREFERRED</b> is the one level that ranks instead of excluding, and it says so.</small>`,'ravis')}</div>
  <div class="card full"><h3>What else decides a route <span class="chip">§9.2</span></h3>${cell(constraintTable(),'ravis')}</div>`}

/* What the traffic cost, per call, with each figure's authority beside it.

   On the Evidence screen because it is the same question in a different
   currency: what does RAVIS actually know, and how did it come to know it.
   §14's states carry that — RAVIS multiplying a published price is ESTIMATED,
   a provider stating its own figure is REPORTED, and neither is a bill.

   The unpriced count is shown even when it is zero. A total whose coverage is
   invisible is a total that reads as complete, and that is the misreading §14
   spends a paragraph forbidding. */
function costCard(usage,spend){
 /* Neither read answered. §14's per-call records and the aggregate come from
    the same service, so when it is absent there is no total — and nothing
    remembered to put in its place. A transcribed cost prices traffic nobody
    sent, and is indistinguishable on screen from one that was. */
 if(!spend.live&&!usage.live)return `<div class="card full"><h3>RAVIS is not answering</h3>${cell(`
   <div class="trace-step"><b>endpoint</b><span class="mono">GET /api/v1/usage · GET /api/v1/usage/records</span></div>
   <small class="mono dim">what a call cost is a fact about a call that happened, so there is no transcription here on purpose. A remembered total would be read as this window's, and a nought computed from nothing reads as a window in which nothing was spent — the coverage misreading §14 spends a paragraph forbidding. Both endpoints are RAVIS's, so one absence takes the rows and the count beside them together.</small>`,'ravis')}</div>`;
 const rows=(spend.items||[]).slice(0,10);
 const state=r=>`<span class="chip${escapeHtml(r.cost_state==='UNKNOWN'?' warn':'')}">${escapeHtml(r.cost_state)}</span>`;
 const budget=usage.budget;
 return `<div class="card full${escapeHtml(liveClass(spend.live))}"><h3>What it cost <span class="chip">estimated</span></h3>${cell(`
   <div class="table-row head five"><span>Model</span><span>Provider</span><span>Tokens</span><span>Cost</span><span>Basis</span></div>
   ${rows.map(r=>`<div class="table-row five"><span class="mono">${escapeHtml(r.model)}</span><span class="mono" style="opacity:.75">${escapeHtml(r.provider||'—')}</span><span class="mono" style="opacity:.8">${r.input_tokens==null?'—':r.input_tokens} in · ${r.output_tokens==null?'—':r.output_tokens} out</span><span class="mono">${money(r.cost,r.currency)}</span><span>${state(r)}</span></div>`).join('')
    ||'<div class="table-row"><span style="grid-column:1/-1;opacity:.7">nothing has been priced yet — either no call has run, or no provider published a price for the models used</span></div>'}
   ${budget?`<div class="trace-step"><b>budget</b><span>${escapeHtml(budget.band)} · ${money(budget.spent_estimated,budget.currency)} of ${money(budget.limit,budget.currency)} ${escapeHtml(budget.period)}${escapeHtml(budget.hard?' · hard':'')}</span></div>`:''}
   <small class="mono dim"><b>REPORTED</b> is the provider's own figure for that call; <b>ESTIMATED</b> is RAVIS multiplying a published price by the tokens the provider reported. Neither is an invoice — §14 is explicit, and a per-call figure precedes credits, minimums and whatever a monthly statement reconciles to. <b>UNKNOWN</b> means one of the two halves was missing, and it is counted rather than treated as nought: ${escapeHtml(usage.calls_unpriced||0)} of the last ${escapeHtml((usage.calls_priced||0)+(usage.calls_unpriced||0))} call(s) could not be priced.${budget&&budget.calls_unpriced_in_window?`<br><br>the budget band above rests on a window in which <b>${escapeHtml(budget.calls_unpriced_in_window)}</b> call(s) had no price, which §14 requires be visible rather than inferred — a budget that fails has to fail predictably.`:''}</small>`,'ravis')}</div>`;
}

/* "What RAVIS concluded" -- the tool-support verdict per build, and the
   threshold it was judged against.

   Its own function because `ravisEvidence` reached complexity 18 assembling
   six cards, and this is the one whose payload is optional at three levels:
   the verdict record, its source, and that source's threshold. Reading them
   defensively inline cost a branch each, in the function that could least
   afford one. */
function ravisVerdictsCard(verdicts){
 if(!verdicts)return '';
 const source=verdicts.source||{};
 const threshold=source.threshold||{};
 const vsrc=source,vth=threshold;
 return `<div class="card full live"><h3>What RAVIS concluded <span class="chip">${vsrc.state||'no source'}</span></h3>${cell(`
   <div class="table-row head five"><span>Build</span><span>Tools</span><span>Provenance</span><span style="grid-column:4/-1">Why</span></div>
   ${verdicts.items.filter(v=>v.state!=='UNKNOWN'||v.evidence).map(v=>`<div class="table-row five"><span class="mono">${escapeHtml(v.model_id)}</span><span class="chip${warnUnless(v.state==='SUPPORTED')}">${escapeHtml(v.state)}</span><span class="mono" style="opacity:.7">${escapeHtml(v.evidence?v.evidence.provenance:'—')}</span><span style="grid-column:4/-1;opacity:.8">${escapeHtml(v.detail)}</span></div>`).join('')||'<div class="trace-step"><b>no SIRVIS evidence</b><span>nothing measured for this role yet</span></div>'}
   <small class="mono dim">this table exists because the capability surface cannot carry it: <b>/api/v1/models</b> publishes the winning claim per capability, and an <b>UNKNOWN</b> verdict deliberately records none — so the most useful sentence in the system, why a build was <i>not</i> admitted, had nowhere to live. "No reliable tool calls" and "measured once where the threshold needs three repetitions" send a reader to entirely different places. The threshold is SIRVIS's to set and RAVIS's to apply: <b>${escapeHtml(vth.tool_call_pass_rate==null?'—':vth.tool_call_pass_rate*100+'%')}</b> over <b>${escapeHtml(dash(vth.phrasings))}</b> phrasings × <b>${escapeHtml(dash(vth.repetitions_each))}</b> repetitions.</small>`,'ravis')}</div>`;
}

/* Evidence — what RAVIS is scoring on, and who owns it. The table is SIRVIS's
   data rendered on a RAVIS page, so it is cell()'d to sirvis: cycle SIRVIS off
   and the evidence goes with it while RAVIS's own observations stay. That is
   §13.4 optionality made visible rather than asserted. */
async function ravisEvidence(){
 heading('Evidence','What the ranking is standing on, and which service owns each part of it.');
 const [ev,usage,verdicts,obs,spend]=await Promise.all([API.sirvis.evidence(),
   API.ravis.usage(),API.ravis.evidenceVerdicts(),API.ravis.observations(),
   API.ravis.usageRecords()]);
 /* RAVIS's own provenance enum, and the mapping it applies on the way in. It never
    upgrades a value: SIRVIS's PARTIALLY_MEASURED arrives as ESTIMATED, not MEASURED. */
 const MAP=[['MEASURED_BY_SIRVIS','MEASURED','repeated benchmark runs on this machine, with spread and sample count'],
            ['OBSERVED_BY_RAVIS','OBSERVED','RAVIS’s own production timings — a measurement, but a rolling window over whatever traffic happened, not a controlled run'],
            ['PROVIDER_METADATA','ESTIMATED','the provider’s published claim; useful, unverified, and not a measurement'],
            ['ESTIMATED','ESTIMATED','interpolated from a neighbouring build — never promoted by being reused'],
            ['UNKNOWN','UNKNOWN','no evidence. Distinct from a bad score, and it stays distinct']];
 const measured=ev.items.filter(e=>e.evidence_type==='MEASURED').length;
 /* A figure, and the sentence it becomes when nobody answered for it.

    Four tiles here are owned by three different readers, and each has to say
    something true when its owner is absent — a dash and the name of the
    service, never a number some constant in this file supplied. `value` and
    `note` are read only when `on`, so a caller may compose them freely; and
    the ternary living in here rather than four times over in the array is what
    keeps this function under the ratchet. */
 const tile=(label,on,value,note,absent,service)=>[label,on?value:'—',on?note:absent,service,on];
 $('#content').innerHTML=kpis([
   tile('From SIRVIS',ev.live,String(ev.items.length),'evidence records consumed','SIRVIS not answering','sirvis'),
   tile('Measured',ev.live,String(measured),'runs on this machine','SIRVIS not answering','sirvis'),
   /* Counted from RAVIS's own observation store and from nothing else. It fell
      back to rows in the request log, so a stopped RAVIS still produced a
      count — taken off a transcription, of timings nobody made. */
   tile('Observed by RAVIS',obs.live,String(obs.items.length),`${obs.confident_total} with enough samples to rank on`,'RAVIS not answering','ravis'),
   /* §9.8 asks for normalization, capability, policy, scoring and total routing
      times against a P50 target of 5 ms, and RAVIS measures none of them yet:
      `routing_p50_ms` is a field the mock invented and `/api/v1/usage` has
      never published. So the honest tile is a dash, in either world. */
   tile('Routing p50',usage.live&&usage.routing_p50_ms!=null,usage.routing_p50_ms+' ms',
     'decision cost, cached evidence','not measured — §9.8 publishes no timing yet','ravis')])
 +costCard(usage,spend)
 +ravisVerdictsCard(verdicts)
 /* **`ev.source` says whether SIRVIS answered, and this card ignored it.** It
    was hardcoded `card full`, so thirty-two rows read live off SIRVIS's own
    benchmark runs sat under a PROTOTYPE badge — the badge erring quietly in
    the understating direction again, one level above the KPI tiles where the
    same default was fixed. The fetch has reported `source: 'live'` since it
    was written; nothing read it. */
 +`<div class="card full${escapeHtml(liveClass(ev.source==='live'))}"><h3>Evidence in the ranking <span class="chip">owned by SIRVIS</span></h3>${cell(`
   <div class="table-row head six"><span>Build</span><span>Role</span><span>Rate</span><span>First token</span><span>Tools</span><span>Provenance</span></div>
   ${ev.live?ev.items.map(e=>`<div class="table-row six"><span>${escapeHtml(e.target.family)} <small class="mono" style="opacity:.5">${escapeHtml(e.target.variant)}</small></span><span>${escapeHtml(e.role)}</span><span class="mono">${escapeHtml(e.metrics.generation_tok_s?e.metrics.generation_tok_s+' tok/s':'—')}</span><span class="mono">${escapeHtml(e.metrics.first_token_s==null?'—':e.metrics.first_token_s+'s')}</span><span class="mono"${e.metrics.tool_calls&&e.metrics.tool_calls[0]!==e.metrics.tool_calls[1]?' style="color:#ffb648"':''}>${escapeHtml(e.metrics.tool_calls?e.metrics.tool_calls.join('/'):'—')}</span><span>${prov(e.evidence_type,e.samples?'n='+e.samples:'')}</span></div>`).join('')||'<div class="table-row"><span style="grid-column:1/-1;opacity:.7">SIRVIS answered and holds no benchmark runs — nothing has been measured on this machine yet, so there is no measured evidence here for the ranking to stand on. A build with none ranks as UNKNOWN, which is not the same as ranking badly</span></div>':'<div class="table-row"><span style="grid-column:1/-1;opacity:.7">this read of SIRVIS returned nothing, so the table is empty rather than remembered — a measurement kept from an earlier session would read exactly like one taken now</span></div>'}
   <small class="mono dim">SIRVIS publishes measures, not a score. RAVIS computes the ranking from them and owns it — which is the split that lets the router be argued with: every number in this table came from a run, and every number in the Routes ranking is RAVIS's arithmetic on top of these. Collapsing the two would leave nobody able to say whether a bad route was a bad measurement or a bad weighting.</small>
   ${explains('how SIRVIS provenance maps onto RAVIS\'s',`
   <div class="table-row head"><span>Arrives as</span><span>RAVIS records</span><span style="grid-column:3/-1">What it means downstream</span></div>

/* Logs — the request record and the frames RAVIS emitted, side by side. There is
   deliberately no prompt or completion log to show: payload capture is off by
   default, so the honest thing is to say what is not being recorded. */
/* A stable id per row, so an opened one survives the repaint.

   The page already preserves `details[id]` across renders — that machinery
   exists because twenty `explains` disclosures were closing under readers on
   every poll. Keyed by *decision id* rather than by position: a new decision
   arriving at the top would otherwise hand the open state to whichever row slid
   into that slot, which is worse than closing it. */
function logRowId(row){
 const id=row&&row.record&&row.record.decision_id;
 return id?`log-${id}`:'';
}

async function ravisLogs(){
 heading('Logs','The request record, and the events RAVIS published about it. No payloads — by default there are none.');
 const [req,ev]=await Promise.all([API.ravis.requests(),API.nervis.events()]);
 const mine=ev.items.filter(e=>e.source.service_type==='ravis');
 const warn=mine.filter(e=>e.severity==='warning').length;
 $('#content').innerHTML=kpis([
   ['Requests',String(req.items.length),'in this window','ravis'],
   ['No-route',String(req.items.filter(r=>r.result!=='OK').length),'failed closed, recorded','ravis'],
   ['Events published',String(mine.length),`${warn} warning`,'nervis'],
   ['Payload capture','off','no prompt or completion is stored','ravis']])
 +`<div class="card full${escapeHtml(liveClass(SOURCE.ravis==='live'))}"><h3>Request log</h3>${cell(`
   <div class="table-row head five"><span>Pool</span><span>Model</span><span>Path</span><span>TTFT</span><span>Result</span></div>
   ${req.items.map(r=>`<details class="log-line" id="${escapeHtml(logRowId(r))}"><summary class="table-row five"><span class="mono">${escapeHtml(r.pool)}</span><span>${escapeHtml(dash(r.model))}</span><span class="mono">${escapeHtml(dash(r.execution_path))}</span><span>${escapeHtml(r.ttft_s?r.ttft_s+'s':'—')}</span><span class="chip${warnUnless(['OK','CANCELLED'].includes(r.result))}">${escapeHtml(r.result)}</span></summary>${decisionDetail(r.record)}</details>`).join('')}
   <small class="mono dim">open a row for the record behind it — requirements, what ran, why the rest were excluded. What no row leads to is the text of the request, because it was never written down.</small>`,'ravis')}</div>
  <div class="card wide${escapeHtml(liveClass(SOURCE.nervis==='live'))}"><h3>Events published by RAVIS</h3>${cell(`
   <div class="table-row head five"><span>Time</span><span>Type</span><span>Version</span><span>Trace</span><span>Severity</span></div>
   ${mine.map(e=>`<div class="table-row five"><span class="mono">${escapeHtml(e.occurred_at)}</span><span class="mono">${escapeHtml(e.event_type)}</span><span class="mono">${escapeHtml(e.event_version)}</span><span class="mono">${escapeHtml(dash(e.trace_id))}</span><span class="chip${warnIf(e.severity==='warning')}">${escapeHtml(e.severity)}</span></div>`).join('')}
   <small class="mono dim">these are the frames RAVIS handed the hub, carrying identifiers and result classes only. Export failing never blocks a route: telemetry is downstream of serving the request, and a collector outage must not become a routing outage.</small>
   ${explains('what a log line never carries',`
    <div class="trace-step"><b>prompt</b><span>never</span></div>
    <div class="trace-step"><b>completion</b><span>never</span></div>
    <div class="trace-step"><b>credentials</b><span>never</span></div>
    <div class="trace-step"><b>timings and decisions</b><span>always</span></div>
    <small class="mono dim">a policy rather than an empty table waiting to fill up. Turning payload capture on is a deliberate, audited change — and until someone makes it, "no prompts in the log" is a fact rather than a hope.</small>`)}`,'ravis')}</div>
`}

 /* What can be observed about how RAVIS is actually running, as opposed to what

 /* `.some(Boolean)` rather than a chain of `||`: three reads that fail

 $('#content').innerHTML=liveCard+kpis([
   ['Active profile',active.label,`${active.profile_id} · rev ${active.revision}`,'ravis'],

   ['Mutations','5','credentials, enabled, filter, members','ravis',false],
   /* Was the host and port read off the hardcoded settings object in this file

   ['Base address',BASE.ravis.replace(/^https?:\/\//,''),'where this page reaches RAVIS · not a setting RAVIS publishes','ravis',false]])
 +`<div class="card full"><h3>What a client can change</h3>${cell(`
   <div class="trace-step"><b>provider credentials</b><span class="mono">PUT · DELETE /api/v1/providers/credentials/{name}</span></div>

  <div class="card wide"><h3>Serving surface</h3>${cell(`
   <div class="table-row head"><span>Endpoint</span><span>Status</span><span style="grid-column:3/-1">Constraint</span></div>
