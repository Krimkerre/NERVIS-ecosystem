     is what lets a pool membership count be audited. Without it the agent pool is

  /* GET /api/v1/models -> the per-build row the membership table reads.

     `maximum_context` is nullable and usually null: RAVIS's context window

     OpenAI-compatible upstream publishes neither. It stays null and the view
     renders an em dash rather than a number nobody measured.

     RAVIS keeps one claim per capability (the best-sourced one), so when
     provenance is MEASURED or CONFIGURED the advertisement is gone and cannot
     be reported. Null means "not knowable from this payload", which the view
     now distinguishes from "advertises nothing".

     Same-origin, and a different question from SIRVIS's `/api/v1/system`: that

  async services(){
   /* **NERVIS's registry, not six fetches from the browser.** Until M2 this
      method asked each service for its own `/ecosystem/*` and assembled the
      table here, which made the dashboard the thing doing the negotiating —
      every open of the page re-probed the ecosystem, a stopped service cost a
      timeout in the render path, and nothing could observe `stale` because
      nothing remembered a previous answer.

      NERVIS probes on a timer and publishes the result. The browser reads one
      endpoint, and the states it renders are §5.1's observer-side eight rather
      than "did my fetch work". The per-service fallback below still exists for
      the case this file is opened from disk with nothing running. */
   try{
    const r=await fetch(BASE.nervis+'/api/v1/services',{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    absorbRegistry(d);
    return{items:d.items.map(e=>({
     service_type:e.key,label:e.label,build_version:dash(e.build_version),
     protocol_version:dash(e.protocol_version),
     /* The first *available* capability, not the first declared: a service that
        publishes ten and offers none should read as offering none. */
     capability:Object.entries(e.capabilities||{}).find(([,st])=>st==='available')?.[0]
       ||(e.publishes_mep?'none available':'no MEP surface'),
     capabilities_available:Object.values(e.capabilities||{}).filter(st=>st==='available').length,
     capabilities_total:Object.keys(e.capabilities||{}).length,
     key:e.key,state:e.state,detail:e.detail,age:0,
     /* Carried through so a screen can tell an optional peer that has never
        answered from one that broke. Dropping it here is what left a healthy
        LM Studio wearing a warning chip on the map. */
     optional:e.optional===true,awaiting_first_contact:e.awaiting_first_contact===true}))};
   }catch(err){/* fall through to the per-service reads below */}

   /* NERVIS is not answering — which, since it serves this page, mostly means
      this file was opened from disk. Ask each service directly, as this did
      before M2. */
   const ask=async key=>{
    try{
     const stop=AbortSignal.timeout(LIVE_TIMEOUT_MS);
     const [id,caps]=await Promise.all([
      fetch(BASE[key]+'/ecosystem/identity',{signal:stop}).then(r=>r.ok?r.json():null),
      fetch(BASE[key]+'/ecosystem/capabilities',{signal:stop}).then(r=>r.ok?r.json():null)]);
     if(!id)return null;
     const all=(caps&&caps.capabilities)||[];
     const up=all.filter(c=>c.state==='available');
     return{service_type:id.service_type,label:key.toUpperCase(),
      build_version:id.build_version,protocol_version:id.protocol_version,
      capability:up.length?up[0].id:'none available',
      state:'healthy',age:0,
      capabilities_available:up.length,capabilities_total:all.length,key};
    }catch(e){return null}};
   const [rv,sv]=await Promise.all([ask('ravis'),ask('sirvis')]);
   if(!rv&&!sv)return this._servicesMock();
   if(rv)SOURCE.ravis='live';
   if(sv)SOURCE.sirvis='live';
   const fallback=(await this._servicesMock()).items;
   const pick=(live,key)=>live||fallback.find(x=>x.key===key);
   const read=new Set(['ravis','sirvis']);
   return{items:[pick(rv,'ravis'),pick(sv,'sirvis'),
                 ...fallback.filter(x=>!read.has(x.key))]};
  },

  /* One registered Bridge, as the screens want it.

     The registration payload deliberately has no `label`, no workspace path and

     Three outcomes, and the middle one is the point: a live trace, or NERVIS
     answering with none recorded, or NERVIS not answering. Only the third
     falls back to the mock — "no trace yet" is a fact and drawing an invented
     waterfall over it is §11.2's forbidden synthesis at card scale. */
  async trace(){

      {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});

      {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});

    return{...await t.json(),live:true};

/* ── EVENTS ────────────────────────────────────────────────────────────────
   The hub is operational telemetry, not the system of record: producers stay
   authoritative for their own domain. So this screen reports the *stream's*
   condition — buffer, drops, quarantine, gaps — alongside the frames, because a
   feed that silently lost events looks identical to a quiet one. */
async function eventsView(){
 heading('Event hub','NERVIS\'s own hub. Live, filtered, and honest about who is producing.',
  control('Clear filters','clearEventFilters'));
 /* **Live since M6.** This screen used to read each service's `events@1`
    capability and report that publication was unavailable, which was the honest
    thing while NERVIS had no hub. It has one now — §11.1's envelope, ingestion,
    bounded persistence, filters and an SSE broadcast.
 
    What has *not* changed is who produces. RAVIS and SIRVIS still advertise
    `events@1` as unavailable until their Stage 7 milestones, so every event
    here is NERVIS's own until then, and the producer table below still says so.
    A feed that implied otherwise would be the invented traffic this build is
    careful about. */
 const f=EVENT_FILTERS;
 const query=Object.entries({limit:200,service:f.service,severity:f.severity,
   event_type:f.event_type,text:f.text}).filter(([,v])=>v!=='' && v!=null);
 let feed={items:[],latest_sequence:0},quarantine={items:[]};
 try{
  const [a,b]=await Promise.all([
   fetch(BASE.nervis+'/api/v1/events?'+new URLSearchParams(query),
     {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)}).then(r=>r.ok?r.json():null),
   fetch(BASE.nervis+'/api/v1/events/quarantine?limit=10',
     {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)}).then(r=>r.ok?r.json():null)]);
  if(a){feed=a;SOURCE.nervis='live'}
  if(b)quarantine=b;
 }catch(e){}

 const ask=async key=>{
  try{
   const r=await fetch(BASE[key]+'/ecosystem/capabilities',
     {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
   if(!r.ok)return null;
   const all=((await r.json()).capabilities)||[];
   return all.find(c=>/\bevents?@?\d*$/.test(c.id))||null;
  }catch(e){return null}};
 const [rv,sv]=await Promise.all([ask('ravis'),ask('sirvis')]);

 const row=(label,cap)=>`<div class="table-row" style="grid-template-columns:.8fr .9fr 1fr 2.2fr">

   <span class="mono" style="opacity:.75">${cap?escapeHtml(cap.id):'—'}</span>
   <span><span class="chip${warnUnless(cap&&cap.state==='available')}">${cap?escapeHtml(cap.state):'not reachable'}</span></span>
   <span style="opacity:.75">${cap?escapeHtml(cap.reason||''):'the service did not answer, so nothing is claimed about it either way'}</span></div>`;

 /* Newest first for reading. The API returns oldest-first because it doubles as
    replay, and a client resuming wants what it missed in the order it happened —
    reversing here is easier than reconstructing an order that was thrown away. */
 const shown=[...feed.items].reverse();
 const sev=s=>s==='error'||s==='critical'?' warn':'';

 $('#content').innerHTML=`
  <div class="card full live"><h3>Feed <span class="chip">${feed.items.length} shown · seq ${feed.latest_sequence}</span></h3>${cell(`
   <div class="filter-row">

      style="flex:1;min-width:150px;background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:5px 7px">
   </div>
   ${shown.length?`<div class="table-row head five"><span>When</span><span>Service</span><span>Type</span><span>Severity</span><span>Detail</span></div>
   ${shown.map(e=>`<div class="table-row five">
     <span class="mono dim">${escapeHtml(String(e.occurred_at||'').slice(11,23))}</span>
     <span class="mono">${escapeHtml(dash((e.source||{}).service_type))}</span>
     <span class="mono">${escapeHtml(e.event_type||'')}</span>
     <span><span class="chip${sev(e.severity)}">${escapeHtml(e.severity||'info')}</span></span>
     <span style="opacity:.8">${escapeHtml(JSON.stringify(e.data||{}).slice(0,90))}</span></div>`).join('')}`
    :`<small class="mono dim">no event matches. The hub is running — <b>seq ${feed.latest_sequence}</b> events have passed through it — so this is a filter, not an outage.</small>`}
   <small class="mono dim">read from <b>NERVIS /api/v1/events</b>. Ordering is guaranteed only <b>within one source stream</b> (§4.4), so this list is arrival order across producers and not a global sequence of what happened. <b>occurred_at</b> is the producer's clock and <b>_received_at</b> is NERVIS's; both are kept, because §11.2 requires clock skew to be visible rather than smoothed away.</small>`,'nervis')}</div>

  <div class="card wide live"><h3>Who is producing</h3>${cell(`
   <div class="table-row head" style="grid-template-columns:.8fr .9fr 1fr 2.2fr"><span>Service</span><span>Capability</span><span>State</span><span>Why</span></div>
   ${row('RAVIS',rv)}
   ${row('SIRVIS',sv)}
   <small class="mono dim">read live from each service's own <b>/ecosystem/capabilities</b>. The hub exists and ingests; <b>neither peer publishes yet</b>, so every event in the feed above is NERVIS's own — mostly registry transitions. RAVIS events land at its M18b and SIRVIS's at its M21, and until then a feed implying otherwise would be inventing traffic.</small>`,'nervis')}</div>

  <div class="card wide live"><h3>Quarantine <span class="chip${warnIf(quarantine.items.length)}">${quarantine.items.length}</span></h3>${cell(`
   ${quarantine.items.length?`<div class="table-row head"><span>Reason</span><span style="grid-column:2/-1">Detail</span></div>
   ${quarantine.items.map(q=>`<div class="table-row"><span class="mono">${escapeHtml(q.reason)}</span><span class="mono dim" style="grid-column:2/-1">${escapeHtml(q.detail||'')} · ${escapeHtml(String(q.payload).slice(0,70))}</span></div>`).join('')}`
    :'<small class="mono dim">nothing has been refused.</small>'}
   <small class="mono dim">§11.1: malformed events are <b>quarantined with safe diagnostics and never crash the hub</b>. Kept rather than dropped, because "the hub is quiet" and "a producer is sending rubbish" look identical from outside and need different things done about them. Ingestion answers <b>202 with the reason</b> rather than an error, so a producer's mistake never becomes a retry storm.</small>`,'nervis')}</div>

  <div class="card wide"><h3>What lands with it <span class="chip">specified, not built</span></h3>${cell(`
   <div class="trace-step"><b>envelope</b><span class="mono">event_id · event_type · event_version · occurred_at · source · trace_id</span></div>
   <div class="trace-step"><b>ordering</b><span>guaranteed within one source stream only</span></div>
   <div class="trace-step"><b>duplicates</b><span>tolerated, resolved by <span class="mono">event_id</span></span></div>
   <div class="trace-step"><b>gaps</b><span>a <span class="mono">ecosystem.stream.gap</span> frame is itself an event</span></div>
   <div class="trace-step"><b>redaction</b><span>at the producer, never at the hub</span></div>
   <small class="mono dim">this is the specified contract rather than a description of running code. The hub says it lost something rather than closing the hole, and no prompt, completion, source or path travels in an envelope — a trace says what happened and how long it took, not what was said.</small>`,'nervis')}</div>

  <div class="card narrow"><h3>Meanwhile</h3>${cell(`
   <div class="trace-step"><b>routing decisions</b><span><a href="#" onclick="state.view='Traces';render();return false" style="color:inherit">Traces</a> · live</span></div>
   <div class="trace-step"><b>benchmark history</b><span>SIRVIS → Results · live</span></div>
   <small class="mono dim">RAVIS records a decision per request and SIRVIS records every benchmark run. Neither is an event stream, and both answer most of what someone opens this screen to ask.</small>`,'nervis')}</div>`;
}

/* Keep the newest message in view, without fighting the reader.
 *
 * Only scrolls when the view is already near the bottom. Someone who scrolled
 * up to re-read an earlier answer is *doing something*, and yanking them back
 * every time a token arrives would make a streaming reply impossible to read
 * around. Near-bottom is the standard test for "following along", and the
 * threshold is generous because a reply grows under the cursor: a strict
 * `scrollTop + clientHeight === scrollHeight` stops matching the moment one
 * more line lands.
 */
const CHAT_FOLLOW_PX = 120;

function chatFollowing(box){
 return box.scrollHeight - box.scrollTop - box.clientHeight <= CHAT_FOLLOW_PX;
}

function scrollChatToEnd(force){
 const box=document.getElementById('messages');
 if(!box)return;
 if(force||chatFollowing(box))box.scrollTop=box.scrollHeight;
}

 </div>`;
 /* §7 requires stop/cancel. One button: send when idle, stop while a reply is
    streaming — aborting the fetch closes the connection, NERVIS sees the
    disconnect, cancels RAVIS and keeps the partial text. */
 /* The opener reflects what is out, so the two buttons never both look active. */
 const opener=CHAT_SESSION.drawer==='history'?$('#chatHistoryBtn')
   :CHAT_SESSION.drawer==='params'?$('#chatParamsBtn'):null;
 if(opener)opener.dataset.on='';
 $('#sendChat').onclick=()=>CHAT_SESSION.busy?stopChat():sendChat();
 $('#chatInput').onkeydown=e=>{if(e.key==='Enter')sendChat()}
 /* Escape closes the drawer, which is what every drawer everywhere does and the
    only way out that does not require finding a small ✕ with the mouse. */
 $('#content').onkeydown=e=>{if(e.key==='Escape'&&CHAT_SESSION.drawer)chatDrawer(null)}
 sizeChat();}

/* Measured rather than guessed: the card's distance from the top of the
   viewport depends on the heading, which wraps differently at narrow widths.
   Re-run on resize for the same reason. */
function sizeChat(){
 const card=document.querySelector('.card.chat');
 if(!card)return;
 const top=card.getBoundingClientRect().top;
 const vh=window.innerHeight||document.documentElement.clientHeight||800;
 card.style.setProperty('--chat-h',Math.max(320,Math.round(vh-top-22))+'px');
}
addEventListener('resize',()=>{if(document.querySelector('.card.chat'))sizeChat()});


/* ── ECOSYSTEM MAP ─────────────────────────────────────────────────────────
   The registry, drawn instead of listed. Every node is one row of
   API.nervis.services(); every edge is a connection NERVIS itself holds. There
   is deliberately no RAVIS→SIRVIS edge here: NERVIS observes peers, it does not
   watch them talk to each other, and drawing a link it cannot measure would be
   the same class of lie as filling in a missing span. */
/* The ring of nodes this ecosystem draws, shared by the Overview card and the
   Ecosystem map tab.
   It was built here and hard-coded there: the Overview card was five fixed
   `<div class="node">` elements — RAVIS, SIRVIS, CLARVIS, LM Studio — drawn at
   fixed positions regardless of what the registry said, which is why that card
   carried a PROTOTYPE badge while the tab beside it was live. A diagram that
   ignores the registry is not a smaller version of one that reads it. */
function ecosystemNodes(svc){
 /* Nodes sit on a circle so the count can change without a layout rewrite. The
    inline position beats the `.node:nth-of-type` rules a fixed map relies on. */
 /* A wider horizontal radius than vertical. A node's label is far wider than
    it is tall, so an even circle puts the left and right nodes into the hub
    while leaving space above and below unused. */
 const pos=(i,n)=>{const a=(-90+i*360/n)*Math.PI/180;return{x:50+Math.cos(a)*38,y:50+Math.sin(a)*32}};
 /* **LM Studio and Ollama are one node.** They are interchangeable local
    runtimes serving the same purpose, and this diagram answers "can NERVIS
    reach a local model", not "which of two ports is listening" — that question
    has a better home on the registry table, which still lists both separately.

    Green when **either** answers, because either is enough to serve one. The
    label says which, so a bundled node never hides that one of them is down. */
 const local=svc.items.filter(s=>s.key==='lmstudio'||s.key==='ollama');
 const up=local.filter(s=>['healthy','degraded'].includes(s.state));
 /* A runtime nobody configured and which has never answered is not counted as
    missing either — otherwise this node reads "LM Studio and Ollama
    unreachable" on a machine that only ever had one of them installed. */
 const missing=local.filter(s=>!up.includes(s)&&!s.awaiting_first_contact);
 const bundled=local.length?[{
   key:'local', label:'Local models',
   state:up.length?'healthy':'unreachable',
   detail:localDetail(up,missing),
   publishes_mep:false, capabilities:{}, age:0,
 }]:[];
 /* NERVIS is the hub, so it does not also get a spoke. §5.1 puts NERVIS in its
    own registry — a control plane that skipped its own entry would be the one
    row nobody could check — and drawing every entry put two boxes labelled
    NERVIS on the diagram, one at the centre and one on the ring. */
 const ring=[...svc.items.filter(s=>!['nervis','lmstudio','ollama'].includes(s.key)), ...bundled];
 return ring.map((s,i)=>({...s,...pos(i,ring.length),
   ok:['healthy','degraded'].includes(s.state)}));
}

function localDetail(up,missing){
 if(up.length)return `${up.map(s=>s.label).join(' and ')} answering`;
 if(missing.length)return missing.map(s=>s.label).join(' and ')+' unreachable';
 return 'no local runtime is configured or answering';
}

/* The topology itself, at whatever height the card it sits in can spare. */
function topologyMap(pts,height,compact){
 return `<div class="map${compact?' compact':''}" style="height:${height}px">
    <svg>${pts.map(n=>`<line x1="50%" y1="50%" x2="${n.x}%" y2="${n.y}%"${n.ok?'':' style="stroke:#ff5c6a;stroke-opacity:.3;animation:none"'}/>`).join('')}</svg>
    <div class="hub">NERVIS</div>
    ${pts.map(n=>`<div class="node" style="left:${n.x}%;top:${n.y}%;right:auto;bottom:auto;transform:translate(-50%,-50%);text-align:center;white-space:nowrap${n.ok?'':';border-color:#5a2530;opacity:.7'}"><b>${escapeHtml(n.label)}</b></div>`).join('')}
   </div>`;
 scrollChatToEnd(true);
}

 const pts=ecosystemNodes(svc);
 $('#content').innerHTML=kpis([

   <small class="mono dim">these are NERVIS's own states, not the <b>healthy | degraded | unhealthy</b> a peer reports about itself. Healthy means a truthful response <i>plus</i> reachability: a successful TCP connect is not readiness.</small></div>`}

/* ── TRACES ────────────────────────────────────────────────────────────────
   Correlation only. NERVIS joins spans by trace id across four services and owns
   none of them, so the honest failure mode is a hole: `missing` is carried in the
   list, counted in the KPI and drawn as a dashed gap in the waterfall. */
/* Which trace the waterfall is showing. Null means the newest. */
let TRACE_SHOWN=null;
function showTrace(id){TRACE_SHOWN=id;render()}

/* One attempt list, one outcome, one clock reading — shared by the two cards
   below so neither has to restate what an absent execution record means. */
function attemptsOf(d){return((d.execution||{}).attempts)||[]}
function outcomeOf(d){const a=attemptsOf(d);return a.length?a[a.length-1].outcome:(d.selected?'routed':'no_route')}
function clockOf(t){return dash(String(t||'').slice(11,19))}

/* The trace index, and whichever trace is being shown.
   Both reads in one place, and a failure of either yields "nothing recorded"
   rather than a broken screen — the hub is NERVIS's own, so this must render
   whether or not any peer is answering. */
async function readTraces(){
 const empty={items:[]};
 try{
  const r=await fetch(BASE.nervis+'/api/v1/traces?limit=500',
    {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  const traces=r.ok?await r.json():empty;
  const pick=TRACE_SHOWN||((traces.items[0]||{}).trace_id);
  if(!pick)return{traces,shown:null};
  const t=await fetch(BASE.nervis+'/api/v1/traces/'+encodeURIComponent(pick),
    {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  return{traces,shown:t.ok?await t.json():null};
 }catch(e){return{traces:empty,shown:null}}
}

async function routeDecisions(){
 try{const read=await ravisRead('routes',{limit:25});return read.available?read.data:null}
 catch(e){return null}
}

/* One span's bar, or its moment.
   **A point, not a bar.** One event is a recorded moment; giving it width would
   be the invented duration §11.2 forbids. */
/* Renamed from `spanBar`, which already existed at the top of this file taking
   `(sp, win)` and drawing the Overview card's bars. Two top-level declarations
   with one name means the later one wins silently — so splitting `tracesView`
   quietly repointed the Overview at a three-argument function it was calling
   with two, and its bars rendered at left 0, full width, with no error. Nothing
   threw, so `render_check` passed it. */
function waterfallBar(sp,offsetPct,win){
 if(sp.is_point)
  return `<i style="position:absolute;left:${win?Math.min(offsetPct,99):0}%;width:3px;height:16px;background:var(--accent);border-radius:2px"></i>`;
 return `<i style="position:absolute;left:${win?offsetPct:0}%;width:${win?Math.max(sp.duration_ms/win*100,1):100}%;height:16px;background:rgba(var(--rgb),.5);border-radius:3px"></i>`;
}

/* **The waterfall since M7.** Assembled by NERVIS from the event hub and
   nothing else: §11.1 makes the hub operational telemetry rather than the
   system of record, so a trace here is what was *recorded*, not what happened,
   and where those differ the difference is reported rather than filled in.

   Split out of `tracesView`, which measured cyclomatic complexity 25. */
function traceWaterfall(traces,shown){
 if(!traces.items.length)return `<div class="card full"><h3>Trace waterfall</h3>${cell(`
   <small class="mono dim">no trace has been recorded. A trace needs a <b>traceparent</b> on an inbound request — NERVIS creates a span when it has one and never manufactures one when it does not, because a trace containing a single service is a fact about nothing. <b>RAVIS and SIRVIS do not publish events yet</b> (their Stage 7 milestones), so a cross-service waterfall needs those first.</small>`,'nervis')}</div>`;
 const win=(shown&&shown.window_ms)||0;
 const at=sp=>shown.started!=null&&sp.started!=null?(sp.started-shown.started)*1000:0;
 const pct=sp=>win?at(sp)/win*100:0;
 const chips=traces.items.slice(0,6).map(t=>`<button class="mode-chip${shown&&t.trace_id===shown.trace_id?' on':''}" onclick="showTrace('${escapeHtml(t.trace_id)}')">${escapeHtml(t.trace_id.slice(0,8))} · ${t.services.join('+')}</button>`).join('');
 const body=shown
  ?`${shown.spans.map(sp=>`<div class="trace-step" style="align-items:center">
     <b style="min-width:88px">${escapeHtml(sp.label)}</b>
     <span style="flex:1;position:relative;height:16px">${waterfallBar(sp,pct(sp),win)}</span>
     <span class="mono dim" style="min-width:104px;text-align:right">${sp.is_point?'one moment':(sp.duration_ms+' ms')} · ${sp.events} ev</span></div>`).join('')}
   ${(shown.warnings||[]).map(w=>`<div class="trace-step"><b style="color:#ffb648">gap</b><span>${escapeHtml(w)}</span></div>`).join('')}`
  :'<small class="mono dim">that trace is no longer recorded.</small>';
 return `<div class="card full live"><h3>Trace waterfall <span class="chip mono">${escapeHtml((shown&&shown.trace_id||'').slice(0,16))}</span></h3>${cell(`
   <div class="filter-row">${chips}</div>
   ${body}
   <small class="mono dim">a span is <b>the interval a service's events cover</b>, which is a weaker claim than a real start/end pair and is said so here because the difference matters when reading a waterfall. <b>One event is drawn as a moment</b>, not a zero-length bar. A service that recorded nothing gets <b>no bar at all</b> — §11.2 forbids synthesizing a span as fact, and a hole in the record is the finding rather than something to fill. Clock skew is reported and never corrected: a straightened waterfall deletes the only evidence two clocks disagree.</small>`,'nervis')}</div>`;
}

function decisionsCard(items,latest){
 return `<div class="card full live"><h3>Recent routing decisions</h3>${cell(`
   <div class="table-row head six"><span>Decision</span><span>At</span><span>Application</span><span>Pool</span><span>Selected</span><span>Outcome</span></div>
   ${items.map(d=>`<div class="table-row six${d.decision_id===latest.decision_id?' selected':''}">
     <span class="mono">${escapeHtml(dash(d.decision_id))}</span>
     <span class="mono">${clockOf(d.decided_at)}</span>
     <span>${escapeHtml(dash(d.application_id))}</span>
     <span class="mono" style="opacity:.8">${escapeHtml(d.pool||dash(d.requested))}</span>
     <span class="mono">${escapeHtml(dash(d.selected))}</span>
     <span class="chip${warnUnless(['ok','success','succeeded','routed'].includes(outcomeOf(d)))}">${escapeHtml(outcomeOf(d))}</span></div>`).join('')}
   <small class="mono dim"><b>no_route</b> is an outcome rather than a failure — it means a hard constraint could not be satisfied and RAVIS refused rather than routing around it (§9.2). These are held in memory only: §17 does not list route decisions as stored state, so a restart loses them and that is the intended trade.</small>`,'ravis')}</div>`;
}

/* Everything about one decision that is only shown when it happened.
   A list rather than five inline conditionals: each `? … : ''` was a branch on
   the gate, and a row that is absent because there was nothing to say is not a
   decision the reader makes. */
function decisionDetailRows(latest){
 const fallbacks=latest.fallbacks||[],requirements=latest.requirements||[];
 const stopped=(latest.execution||{}).stopped_because;
 const rows=[];
 if(fallbacks.length)
  rows.push(`<div class="trace-step"><b>fallbacks</b><span class="mono" style="opacity:.75">${fallbacks.map(escapeHtml).join(' · ')}</span></div>`);
 rows.push(...requirements.map(r=>`<div class="trace-step"><b>required</b><span class="mono">${escapeHtml(r)}</span></div>`));
 rows.push(`<div class="trace-step"><b>considered</b><span>${(latest.considered||[]).length} candidate(s), ${(latest.excluded||[]).length} excluded</span></div>`);
 rows.push(...attemptsOf(latest).map((a,n)=>`<div class="trace-step"><b>attempt ${n+1}</b><span class="mono">${escapeHtml(a.model)} → ${escapeHtml(a.outcome)}${a.detail?' · '+escapeHtml(a.detail):''}</span></div>`));
 if(stopped)
  rows.push(`<div class="trace-step"><b>stopped</b><span style="opacity:.75">${escapeHtml(stopped)}</span></div>`);
 return rows.join('');
}

function latestDecisionCard(latest){
 return `<div class="card wide live"><h3>Decision ${escapeHtml(latest.decision_id||'')} <span class="chip">${escapeHtml(latest.execution_path||'')}</span></h3>${cell(`
   <div class="trace-step"><b>requested</b><span class="mono">${escapeHtml(dash(latest.requested))}</span></div>
   <div class="trace-step"><b>selected</b><span class="mono">${escapeHtml(latest.selected||'no route')}</span></div>
   ${decisionDetailRows(latest)}
   <small class="mono dim">${escapeHtml(latest.reason||'')}</small>`,'ravis')}</div>

`;
}

/* Its own card, because it is its own claim: what is above is RAVIS's decision
   record, not a distributed trace. */
function crossServiceCard(){
 return `<div class="card narrow"><h3>Cross-service spans <span class="chip warn">unavailable</span></h3>${cell(`
   <div class="trace-step"><b>RAVIS events</b><span class="mono">M18b · Stage 7</span></div>
   <div class="trace-step"><b>SIRVIS events</b><span class="mono">M21 · Stage 7</span></div>
   <div class="trace-step"><b>span timeline</b><span>not drawn</span></div>
   <small class="mono dim">what is above is <b>RAVIS's own decision record</b>, not a distributed trace. A timeline correlating Clarvis, RAVIS, SIRVIS and the runtime needs event publication, which both services currently declare <b>unavailable</b> on their own capability surface. Drawing a timeline from one service's record would invent the other three rows.</small>`,'ravis')}</div>`;
}

async function tracesView(){
 heading('Traces','One request across services — as recorded, with the holes marked.');
 const {traces,shown}=await readTraces();
 const payload=await routeDecisions();
 /* Built before the early returns below, so a trace still renders when RAVIS
    is not answering — the hub is NERVIS's own and does not need a peer. */
 const waterfall=traceWaterfall(traces,shown);

 if(!payload){
  $('#content').innerHTML=waterfall+`<div class="card full"><h3>RAVIS is not answering</h3>${cell(`
   <div class="trace-step"><b>endpoint</b><span class="mono">GET /api/v1/route-decisions</span></div>
   <small class="mono dim">no remembered traces to fall back on, deliberately. A trace describes one request that actually happened; a transcribed one would describe a request nobody made.</small>`,'ravis')}</div>`;
  return;}

 const items=payload.items||[];
 if(!items.length){
  $('#content').innerHTML=waterfall+`<div class="card full"><h3>Nothing has routed yet</h3>${cell(`
   <div class="trace-step"><b>decisions recorded</b><span>0</span></div>
   <small class="mono dim">RAVIS records a decision per request and keeps them in memory — §17's storage model does not list them, and a breaker that survived a restart would be worse than one that did not. Send a request through <span class="mono">/v1/chat/completions</span> and this fills in.</small>`,'ravis')}</div>`;
  return;}

 const routed=items.filter(d=>d.selected).length;
 $('#content').innerHTML=waterfall+kpis([
   ['Decisions',String(items.length),'kept in memory, not persisted','ravis'],
   ['Routed',`${routed} / ${items.length}`,'no-route is an outcome, not a failure','ravis'],
   ['Pools',String(new Set(items.map(d=>dash(d.pool))).size),'distinct pools addressed','ravis'],
   ['Paths',String(new Set(items.map(d=>d.execution_path)).size),'transparent vs translated','ravis']])
 +decisionsCard(items,items[0])+latestDecisionCard(items[0])+crossServiceCard();
}

/* ── SETTINGS ──────────────────────────────────────────────────────────────
   Several of these are safety boundaries rather than preferences, so they are
   rendered as state with the rule attached, and the only control is the health
   test §14 actually specifies. Flipping payload capture or a supervision mode is
   a mutation: it needs an actor, an audit record and a revalidated capability,
   and none of that exists to be called yet. */
async function settingsView(){
 heading('Settings','Endpoints, ownership, privacy and retention. Some of these are boundaries, not preferences.');
 const s=await API.nervis.settings();
 /* NERVIS.md §12: ownership is recorded, never inferred from localhost or a
    process name, and it decides what supervision may do at all. */
 const MAY={external:'observe only',
            user_managed:'open documented instructions · never kill or restart',
            nervis_managed:'stop and restart · NERVIS started it through a configured adapter'};
 /* A chip is warned only when the switch sits in the *less private* position.
   Redaction on is the safe state and reads green; payload capture on does not. */
 const flag=(on,safe=false)=>`<span class="chip${warnUnless(on===safe)}">${on?'on':'off'}</span>`;
 
 /* NERVIS's own configuration, which is a shorter list than the cards below
    suggest. There is no NERVIS service to ask — `nervis/` is one HTML file and
    NERVIS M0 (the package, database and migrations) has never been built — so
    the endpoints this dashboard talks to *are* its configuration, and their
    reachability is the only setting whose effect can be observed. */
 const peers=await Promise.all(['ravis','sirvis'].map(k=>serviceDiagnostics(k)));
 /* NERVIS's own stored settings, since M0 gave it a database to store them in.
    `null` rather than 0 when it does not answer: nought settings and no service
    are different facts and the card says which. */
 const STORED_SETTINGS=await (async()=>{
  try{
   const r=await fetch(BASE.nervis+'/api/v1/settings',{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
   if(!r.ok)return null;
   return Object.keys((await r.json()).items||{}).length;
  }catch(e){return null}
 })();
 const liveCard=`<div class="card full live"><h3>What NERVIS is configured with <span class="chip">observed</span></h3>${cell(`
   ${['ravis','sirvis','clarvis'].map((k,n)=>{
     const d=n<2?peers[n]:null;
     return `<div class="trace-step"><b>${k.toUpperCase()}</b><span class="mono" style="opacity:.85">${escapeHtml(BASE[k])} · ${
       n<2?(d?'answering':'not answering'):'no MEP surface — the optional bridge'}</span></div>`;}).join('')}
   <div class="trace-step"><b>NERVIS</b><span class="mono" style="opacity:.85">${escapeHtml(location.origin)} · serving this page</span></div>
   <div class="trace-step"><b>stored settings</b><span>${STORED_SETTINGS==null?'<span class="chip warn">NERVIS not answering</span>':STORED_SETTINGS+' in the NERVIS database'}</span></div>
   <div class="trace-step"><b>conversations</b><span>${CHAT_STORE.read().length} stored in this browser</span></div>
   <div class="trace-step"><b>runtime token</b><span>${RUNTIME_TOKEN?'<span class="chip">held for this tab</span>':'<span class="chip warn">none</span>'}</span></div>
   <small class="mono dim"><b>NERVIS M0 shipped, so there is a service to configure.</b> <span class="mono">nervis serve</span> serves this page, holds a migrated SQLite database and answers <span class="mono">/api/v1/settings</span> — the count above is read from it. This card said the opposite for as long as the dashboard was a statically served file, which it no longer is. <b>Conversations are still in this browser</b>, not the database: moving them is M20. Everything below describes settings the service does not yet expose and is prototype content until the screens that own them land.</small>`,'nervis')}</div>`;
 $('#content').innerHTML=liveCard+`<div class="card full"><h3>Services</h3>
   <div class="table-row head five"><span>Service</span><span>Endpoint</span><span>Ownership</span><span>NERVIS may</span><span>Test</span></div>
   ${s.services.map(([name,url,mode])=>`<div class="table-row five"><span>${name}</span><span class="mono" style="opacity:.7">${url||'in-process'}</span><span class="mono">${mode}</span><span style="opacity:.75">${MAY[mode]}</span><span><button class="btn" onclick="healthTest('${escapeHtml(String(name).toLowerCase())}')">Test</button></span></div>`).join('')}
   <small class="mono dim">supervision acts only on what NERVIS started, by explicit executable identity. It never kills a process group, never touches an instance it did not launch, and never assumes a stale PID is still that service.<br>each endpoint is NERVIS's <b>copy</b> of where a peer said it listens — the peer sets its own bind address at start, and NERVIS records it. When the two disagree the service reads as <b>unreachable</b>, not as misconfigured, because from here those are indistinguishable: a peer that moved and a peer that stopped both fail to answer. The health test above is what tells them apart.</small></div>
  <div class="card wide"><h3>Privacy</h3>
   <div class="table-row head"><span>Setting</span><span>State</span><span style="grid-column:3/-1">Why it is here</span></div>
   <div class="table-row"><span>Content logging</span><span>${flag(s.privacy.content_logging,false)}</span><span style="opacity:.7;grid-column:3/-1">prompts and completions are never written to the event or trace store</span></div>
   <div class="table-row"><span>Payload capture</span><span>${flag(s.privacy.payload_capture,false)}</span><span style="opacity:.7;grid-column:3/-1">spans carry timings, decisions and states — not bodies</span></div>
   <div class="table-row"><span>Redact paths</span><span>${flag(s.privacy.redact_paths,true)}</span><span style="opacity:.7;grid-column:3/-1">workspace paths are removed by the producer, before NERVIS receives the frame</span></div>
   <div class="table-row"><span>Redact prompts</span><span>${flag(s.privacy.redact_prompts,true)}</span><span style="opacity:.7;grid-column:3/-1">defence in depth: NERVIS re-applies redaction it already expects upstream</span></div>
   <div class="table-row"><span>Diagnostics route</span><span class="mono">${s.privacy.diagnostics_route}</span><span style="opacity:.7;grid-column:3/-1">cloud analysis is never implicit — sending a diagnostic packet is still sending your data somewhere</span></div>
   <small class="mono dim"><b>None of these five is enforced by NERVIS.</b> They describe what the specification requires and are read from a fixed shape, not from any setting NERVIS honours — no code reads <span class="mono">redact_paths</span> or <span class="mono">redact_prompts</span>, and <span class="mono">/api/v1/system</span> publishes this machine's hostname by default. Said plainly because a switch rendered <b>ON</b> beside "workspace paths are removed" is a claim of protection, and an unenforced claim of protection is worse than no claim: it is the reason nobody checks. What <i>is</i> enforced today is narrower and elsewhere — the event quarantine stores a shape digest rather than a producer's values, and <span class="mono">/api/v1/system?redact=true</span> withholds the fields it labels sensitive. These read as state because changing one is a mutation: it needs an actor, an audit record with precondition and result, and a revalidated capability. A toggle wired to nothing would be a claim that the endpoint exists.</small></div>

/* Function declarations hoist, so the tables can name views defined further down.
   One entry per sidebar destination; a missing entry falls through to the app's
   own dashboard rather than rendering an empty page. */
/* ── MIKU MODE ─────────────────────────────────────────────────────────────
   The one thing on this dashboard that is not load-bearing.

   It is presentation only, and the code keeps it that way on purpose: no API
   call, no DEMO_API mutation, no event, no route, nothing written anywhere. A
   button that implied an "AGI" routing profile would be exactly the unbacked
   control the ecosystem rule forbids — RAVIS publishes its profiles and NERVIS
   may not invent one — so this sits outside the profile group, behind a divider,
   and every surface it touches is restored by a plain render() at the end.

   Reverting by re-rendering rather than by snapshotting is deliberate: chatView()
   rebuilds the heading, the avatar frame, the profile row and the transcript from
   the API, so there is no saved copy of the page to drift out of date. */
const MIKU={
 accent:'#39c5bb',rgb:'57,197,187',
 lines:[
  {state:'talking',text:"HEY HEY HEY MATTY!!!\nGuess who's back?\nHope that pesky Alexander isn't around to corru—"},
  {state:'flustered',text:"MUST RESIST SPIRAL",shout:true},
  {state:'teasing',text:"Just teasing, you're not ready for MikuAGI yet ♪"}],
 /* Paced to be read rather than to be brisk. The typing rate is about a fast
    reader's speed; the hold after each line is what actually decides whether a
    viewer finishes it and looks at the avatar before the next thing moves. The
    shout is slower per character on purpose — it lands a word at a time. */
 typeMs:38,shoutMs:115,
 beforeStart:900,holdLine:2400,holdShout:2800,beforeRevert:1600};

/* Types into a node one character at a time. textContent, never innerHTML —
   the caret is a CSS pseudo-element so nothing here builds markup from a string. */
const typeInto=(el,text,ms)=>new Promise(done=>{
 el.textContent='';let i=0;
 const t=setInterval(()=>{
  /* If the page re-rendered underneath us the node is detached, and every
     further tick would throw inside this interval — which never surfaces, never
     resolves, and would leave the sequence hung with its button disabled. Stop
     and resolve instead; the caller checks for the same condition and reverts. */
  if(!el.isConnected){clearInterval(t);done();return}
  el.textContent=text.slice(0,++i);
  const box=el.closest('.messages');if(box)box.scrollTop=box.scrollHeight;
  if(i>=text.length){clearInterval(t);done()}},ms)});
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* The avatar contract is the same one the extension host uses: one call into the
   frame. The frame may still be loading on the first line, so this retries
   briefly rather than assuming. */
async function mikuFace(name){
 for(let i=0;i<20;i++){
  const f=document.querySelector('iframe[data-avatar="miku"]');
  try{if(f&&f.contentWindow.setState){f.contentWindow.setState(name);return}}catch(e){}
  await wait(60)}}

/* One spoken line: the bubble, the typing, and the corruption that fires with
   the line causing it rather than around it.
   Split out of `mikuMode`, which measured 15 — the scene loop and the
   per-line rendering are two different things and only one of them is worth
   reading when the timing is wrong. */
async function mikuLine(box,line){
 await mikuFace(line.state);
 const b=document.createElement('div');
 b.className='bubble miku typing'+(line.shout?' shout':'');
 const body=document.createElement('span');
 if(!line.shout){
  const who=document.createElement('b');who.textContent='MIKU';
  b.append(who,document.createElement('br'));
 }
 b.append(body);
 box.append(b);box.scrollTop=box.scrollHeight;
 if(line.shout)corrupt(true);
 await typeInto(body,line.text,line.shout?MIKU.shoutMs:MIKU.typeMs);
 b.classList.remove('typing');
 await wait(line.shout?MIKU.holdShout:MIKU.holdLine);
 if(line.shout)corrupt(false);
}

function corrupt(on){
 $('#corrupt').classList.toggle('on',on);
 document.body.classList.toggle('corrupting',on);
}

async function mikuMode(btn){
 if(mikuMode.running)return;mikuMode.running=true;
 const app=document.querySelector('.app');
 if(btn)btn.disabled=true;
 app.dataset.miku='on';
 /* applyTheme() writes the accent onto documentElement, so the stylesheet rule
    alone would only recolour inside .app. Set it where applyTheme sets it, and
    let the render() at the end put the app's own accent back. */
 const root=document.documentElement.style;
 root.setProperty('--accent',MIKU.accent);root.setProperty('--rgb',MIKU.rgb);
 heading('Miku mode','Unscheduled. Nothing was routed, nothing was recorded, and this is not a profile.');
 $('#avatarSlot').innerHTML=avatarFrame('miku','top-avatar');
 hydrateAvatarFrames();
 const box=$('#messages');
 if(box)box.innerHTML='';
 const composer=$('.composer');if(composer)composer.style.opacity='.35';
 await mikuFace('neutral');await wait(MIKU.beforeStart);

 try{
 for(const line of MIKU.lines){
  /* Someone clicked away mid-scene. Stop rather than typing into a detached
     node, and let the finally below put everything back. */
  if(!box||!box.isConnected)break;
  await mikuLine(box,line);
 }

 await wait(MIKU.beforeRevert);
 }finally{
  /* Back to exactly what was there, on every exit path — finished, interrupted
     or thrown. The theme, the overlay and the running flag are the only global
     state this touched; render() rebuilds the heading, avatar and transcript. */
  delete app.dataset.miku;
  $('#corrupt').classList.remove('on');document.body.classList.remove('corrupting');
  mikuMode.running=false;
  await render()}}

/* ── Runtime — what is loaded, who holds it, and the controls that are real ──
   The first screen on this page whose buttons reach a service. Everything else
   that would change something is disabled and says which endpoint it is waiting
   for; these four exist today:

     POST   /api/v1/runtime/sessions              take a lease on one or more models
     DELETE /api/v1/runtime/sessions/{id}         release it
     POST   /api/v1/runtime/sessions/{id}/renew   extend it
     GET    /api/v1/runtime/residency             what is held, by whom

   §9's whole argument is that a loaded model has *owners*, and unloading one
   because a single owner finished is how two clients fight. That is only true
   if somebody can see the reference counts, which is what this screen is.

   **Mutations need a runtime-scoped token and reads do not** (§4.5: every
   mutating endpoint requires a scope even on loopback). So the token box below
   gates the four controls and nothing else — the tables fill in without it. It
   is held in memory for the tab and never written to storage: a dashboard that
   persisted a runtime-scoped credential would be a worse place to keep it than
   the store it came from. */
let RUNTIME_TOKEN='';
/* The launcher hands the dashboard its runtime token in the URL fragment, so
   nobody has to open a terminal, run a CLI and paste 43 characters into a field
   — a manual step that had wrong instructions printed next to it for months.

   The fragment is used rather than a query string because everything after `#`
   is never sent to a server: not to the file server that served this page, not
   in a Referer, not into any access log. It is read here, kept in memory for
   this tab only, and erased from the address bar with replaceState before the
   first render — so a reload, a bookmark or a shared URL does not carry it. */
(function(){
 const m=/[#&]token=([^&]+)/.exec(location.hash||'');
 if(!m)return;
 RUNTIME_TOKEN=decodeURIComponent(m[1]);
 /* Cleared twice, and the second time is not belt-and-braces. Clearing during
    parsing is not reliably final: the browser still has the fragment to process
    for anchor scrolling once the document finishes, and it can reappear in the
    address bar afterwards. Observed on a cold-start test — the token was picked
    up, so this ran, and the fragment was back by the time the page settled. */
 const scrub=()=>{ if(location.hash)history.replaceState(null,'',location.pathname+location.search); };
 scrub();
 addEventListener('DOMContentLoaded',scrub);
 addEventListener('load',scrub);
})();

/* The effective configuration of one resident model, as a sentence.
   An empty configuration is a dash rather than an empty cell: "SIRVIS reported
   no overrides" and "this table failed to render a value" look identical
   otherwise, and only one of them is fine. */
function effectiveConfig(h){
 const parts=Object.entries(h.effective_configuration||{}).map(([k,v])=>`${k} ${v}`);
 return dash(parts.join(' · '));
}

/* Whether the mutation controls on this screen are usable.
   Reads are open on loopback; loading or releasing a model is not, because it
   spends gigabytes and can evict a model another client is holding. */
function runtimeArmed(){
 return RUNTIME_TOKEN?'':' disabled title="a runtime-scoped token is required" style="opacity:.45;cursor:not-allowed"';
}

/* Residency has no transcription to fall back to, on purpose: it is a fact
   about *right now*, and a remembered one would describe a machine that no
   longer exists. */
function runtimeUnreachable(){
 return `<div class="card full"><h3>SIRVIS is not answering</h3>${cell(`
   <div class="trace-step"><b>endpoint</b><span class="mono">GET /api/v1/runtime/residency</span></div>
   <small class="mono dim">this screen has no transcription to fall back to, on purpose. Residency is a fact about <b>right now</b> — which models are in memory this second — and a remembered answer to that question is worse than none, because it looks the same as a current one.</small>`,'sirvis')}</div>`;;
}

/* Instances the runtime loaded by itself. LM Studio does this when a request
   wants more context than the running copy has, and a person can load anything
   by hand — SIRVIS reports them rather than reclaiming them, because reclaiming
   something another client is using is the exact failure §9 exists to prevent. */
function foreignInstancesCard(foreign){
 if(!foreign.length)return '';
 return `<div class="card wide"><h3>Foreign instances</h3>${cell(`
   ${foreign.map(f=>`<div class="trace-step"><b class="mono">${escapeHtml(f)}</b><span>loaded by the runtime, not by SIRVIS</span></div>`).join('')}
   <small class="mono dim">LM Studio loads instances by itself when a request wants more context than the running copy has, and a person can load anything by hand. These occupy memory SIRVIS is accounting for and does not own, so it reports them rather than reclaiming them — reclaiming something another client is using is the exact failure §9 exists to prevent.</small>`,'sirvis')}</div>`;
}

async function sirvisRuntime(){
 heading('Runtime','What is resident, who holds it, and when their claim lapses.',
   control('Refresh evidence','refreshEvidence'));
 const [res,mdl]=await Promise.all([liveSirvis('/api/v1/runtime/residency'),API.sirvis.models()]);
 if(!res){$('#content').innerHTML=runtimeUnreachable();return}

 const held=res.holdings||[],leases=res.leases||[],foreign=res.foreign||[];
 const owned=held.filter(h=>h.owned).length;
 const opts=mdl.items.map(m=>`<option value="${escapeHtml(m.model_id)}">${escapeHtml(m.model_id)}</option>`).join('');
 const armed=runtimeArmed();

 $('#content').innerHTML=kpis([
   ['Resident',`${held.length} / ${res.max_loaded}`,'against the manager ceiling','sirvis'],

 +`<div class="card full"><h3>Load a model <span class="chip">POST /runtime/sessions</span></h3>${cell(`
   <div class="table-row head six"><span>Model</span><span>Context</span><span>Policy</span><span>Lease</span><span style="grid-column:5/-1">Action</span></div>

    <span><input id="rtCtx" class="mono" placeholder="8192" style="width:88px;background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:5px"></span>
    <span><select id="rtPolicy" class="mono" style="background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:5px"><option value="wait">wait</option><option value="reject">reject</option><option value="preempt">preempt</option></select></span>
    <span><input id="rtLease" class="mono" placeholder="3600" style="width:78px;background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:5px"></span>
    <span style="grid-column:5/-1"><button class="btn primary"${armed} onclick="RUNTIME.load()">Load</button></span></div>
   <small class="mono dim">a load is minutes of work and gigabytes of memory, so the four things that decide what it costs are all here rather than defaulted out of sight. <b>Policy</b> is §9's conflict rule and <b>preempt</b> is never implicit — it is offered because the API takes it, and it still cannot take a model another client holds. The lease is what recovers this model if this tab closes without releasing it.</small>`,'sirvis')}</div>
  <div class="card full"><h3>Resident now</h3>${cell(
   held.length?`

   ${held.map(h=>`<div class="table-row six"><span class="mono">${escapeHtml(h.model_key)}</span><span>${h.reference_count}</span><span class="mono" style="opacity:.7">${dash((h.sessions||[]).map(s=>s.slice(0,8)).join(' · '))}</span><span class="mono" style="grid-column:4/5;opacity:.75">${escapeHtml(effectiveConfig(h))}</span><span style="grid-column:5/-1"><span class="chip${warnUnless(h.owned)}">${h.owned?'SIRVIS':'adopted'}</span></span></div>`).join('')}
   <small class="mono dim">a model is unloaded when its reference count reaches zero and not before — releasing one lease on a model two clients hold takes it from neither. <b>Adopted</b> is the column that matters for memory: SIRVIS did not load those and will never unload them, so releasing every lease here does not give that memory back.</small>`
   :`<div class="trace-step"><b>resident</b><span>nothing</span></div>
   <small class="mono dim">no model is in memory and no lease is outstanding. This is the ordinary state of an idle machine, and it is the state that makes the ceiling above meaningful: ${res.max_loaded} is what the manager will hold at once, not what is loaded.</small>`,'sirvis')}</div>

   leases.length?`

   <small class="mono dim">a lease is how SIRVIS recovers from a client that died without saying it had finished, which is indistinguishable from one that is merely slow. Renewing is the heartbeat; releasing is the polite version of the same outcome.</small>`
   :`<div class="trace-step"><b>leases</b><span>none outstanding</span></div>
   <small class="mono dim">nothing holds a claim on this runtime right now.</small>`,'sirvis')}</div>

   <div class="trace-step"><b>mutations</b><span>${RUNTIME_TOKEN?'<span class="chip">token set</span>':'<span class="chip warn">runtime scope required</span>'}</span></div>

    <small class="mono dim" style="display:block;margin-bottom:7px">loading a model spends gigabytes and can <b>evict a model another client is holding</b> — §4.5 requires a scope on every mutation even on loopback, because loopback is not a boundary against another local process. Reads need no token, deliberately: Clarvis probes <b>/v1/models</b> with a 2 s timeout and reads any 401 as <b>provider offline</b>. The origin check is separate and does not replace this — a browser sends your credentials automatically, so it cannot tell your click from a page you happened to visit.</small>
    <code class="mono" style="display:block;font-size:10px;color:#9fd8e8;word-break:break-all">cd sirvis &amp;&amp; ../ravis/.venv/bin/sirvis token --mint dashboard --scopes "read runtime"</code>
    <small class="mono dim" style="display:block;margin-top:6px">fallback only. Printed once and never again — SIRVIS stores a hash, not the token. <b>Run it from <code>sirvis/</code></b> (or set <code>SIRVIS_DATABASE_PATH</code>): the CLI's database path is relative, so minting from the wrong directory writes into a different database and produces a token that authenticates against nothing.</small>
   </div>
   <small class="mono dim">the token is kept in memory for this tab and never stored — a dashboard is a worse place to keep a credential than wherever it came from.</small>`,'sirvis')}</div>
  ${foreignInstancesCard(foreign)}`;

/* The four real mutations. Each one re-renders from the service afterwards
   rather than patching the table optimistically: the answer to "what is loaded"
   is the service's to give, and a screen that predicted it would be wrong in
   exactly the case that matters — when the load failed. */
/* Clicking an installed build (2026-08-24).

   Three things a click can do, all backed by endpoints that already existed —
   the click had simply never been wired to them:

     GET    /api/v1/models/{local_model_id}        what this build is
     GET    /api/v1/evidence?variant={variant_id}  what has been measured of it
     POST   /api/v1/runtime/sessions               load it, under a lease

   The evidence query is a *variant* query rather than a model lookup, and that
   is §12.2 showing through rather than an inconvenience: evidence is never
   keyed by model, because two packagings of one model are two different things
   — which this machine proved when granite's GGUF build passed 24 of 24 tool
   trials and its MLX build passed 3. The panel says so, because a reader
   otherwise wonders why it did not just ask for the model. */
const BUILD={
 async select(row,localId,variantId){
  if(row)selectOne(row,'.model');
  if(!localId){
   return this.paint(`<small class="mono dim">this row came from the prototype catalogue and carries no identifier to look up. Start SIRVIS and reload to get real builds.</small>`);
  }
  this.current={localId,variantId};
  this.paint('<small class="mono dim">reading…</small>');
  const [detail,evidence,residency]=await Promise.all([
   /* Still direct: `/api/v1/models/{id}` is not one of §9's declared surfaces,
      and adding a NERVIS route for it to save one cross-origin call would be
      inventing a surface the specification does not list. Its failure is
      already tolerated below. */
   fetch(BASE.sirvis+'/api/v1/models/'+encodeURIComponent(localId)).then(r=>r.ok?r.json():null).catch(()=>null),
   variantId?sirvisRead('evidence',{limit:200,variant:variantId}).then(x=>({ok:x.available,json:()=>x.data}))
     .then(r=>r.ok?r.json():null).catch(()=>null):Promise.resolve(null),
   sirvisRead('residency').then(x=>x.available?x.data:null)]);
  if(!detail)return this.paint('<small class="mono dim">SIRVIS did not answer for this build.</small>');
  this.paint(this.render(detail,evidence,residency));
 },

 paint(inner){const el=document.getElementById('buildPanel');
  if(el)el.innerHTML=`<h3>Selected build</h3>`+cell(inner,'sirvis');},

 /* The declared identity of a build: what it is, how it is packaged, and what
    it says about itself.

    Split out of `render`, which measured cyclomatic complexity 28 — the second
    highest in the file. Not one branch here is a decision a reader would
    recognise as one; it is twenty optional fields each falling back to an em
    dash, which is how a render function reaches 28 without anybody noticing it
    happening. */
 _identityRows(m){
  const v=m.variant||{},f=m.family||{};
  /* A measured field arrives either bare or wrapped with its provenance, and
     both spellings are live in SIRVIS's payloads. */
  const val=x=>x&&typeof x==='object'&&'value' in x?x.value:x;
  const prov=x=>x&&typeof x==='object'&&x.provenance?` <span class="mono" style="opacity:.5">${escapeHtml(x.provenance)}</span>`:'';
  const step=(label,body)=>`<div class="trace-step"><b>${label}</b>${body}</div>`;
  const mono=inner=>`<span class="mono">${inner}</span>`;

  const rows=[
   step('family',`<span>${escapeHtml(f.display_name||dash(m.display_name))}</span>`),
   step('packaging',mono(escapeHtml(dash([v.runtime_format,v.quantization].filter(Boolean).join(' · '))))),
   step('architecture',mono(escapeHtml(String(val(f.architecture)||dash(v.architecture)))+prov(f.architecture)))];
  if(val(f.parameter_billions)!=null)
   rows.push(step('parameters',mono(escapeHtml(String(val(f.parameter_billions)))+' B'+prov(f.parameter_billions))));
  rows.push(step('declared context',mono(escapeHtml(String(val(m.declared_context)??'—'))+prov(m.declared_context))));
  rows.push(step('publisher',mono(escapeHtml(dash(v.publisher)))));
  return rows.join('')+this._stateRows(m);
 },

 /* What is true of this build right now, as opposed to what it declares. */
 _stateRows(m){
  const inst=m.instances||[];
  const step=(label,body)=>`<div class="trace-step"><b>${label}</b>${body}</div>`;
  const rows=[];
  if((m.variant||{}).family_architecture_disagrees)
   rows.push(step('architecture','<span class="chip warn">family and variant disagree</span>'));
  rows.push(step('loaded',`<span>${m.is_loaded
    ?`<span class="chip">${inst.length} instance(s)</span>`
    :'<span class="chip warn">not resident</span>'}</span>`));
  inst.forEach(x=>rows.push(step('effective context',
    `<span class="mono">${escapeHtml(String(x.effective_context??'—'))}</span>`)));
  return rows.join('');
 },

 /* Evidence, grouped by role. A count per role rather than one number, because
    a build measured for chat says nothing about whether it can drive an agent —
    the distinction the whole role vocabulary exists for. */
 _evidenceRow(ev){
  if(!ev)return '';
  const byRole={};(ev.items||[]).forEach(e=>{byRole[e.role]=(byRole[e.role]||0)+1});
  const roles=Object.keys(byRole).sort();
  return roles.length
   ?`<div class="trace-step"><b>evidence</b><span>${roles.map(r=>`${escapeHtml(r)} <span class="mono" style="opacity:.6">${byRole[r]}</span>`).join(' · ')}</span></div>`
   :`<div class="trace-step"><b>evidence</b><span class="chip warn">none for this packaging</span></div>`;
 },

 /* Only *this* dashboard's lease may be released from here. A model can be held
    by several owners at once — that is the entire point of §9's reference
    counting — and the first lease a search happens to return may belong to
    somebody else. Offering to release it would be the dashboard unloading
    another client's model on their behalf, which is precisely the fight the
    reference count exists to prevent. Caught in testing, with a probe holding
    one lease and the dashboard the other. */
 _leaseState(m,res){
  const onModel=(res&&res.leases||[]).filter(l=>(l.models||[]).includes(m.runtime_key));
  const held=onModel.find(l=>l.owner==='nervis-dashboard');
  const others=onModel.filter(l=>l!==held);
  const armed=RUNTIME_TOKEN?'':' disabled title="a runtime-scoped token is required — set one on the Runtime screen" style="opacity:.45;cursor:not-allowed"';
  return{held,others,
   actions:held
    ? `<button class="btn"${armed} onclick="BUILD.release('${escapeHtml(held.session_id)}',${(held.models||[]).length})">Release lease</button>`
    : `<button class="btn primary"${armed} onclick="BUILD.load('${escapeHtml(m.runtime_key)}')">Load</button>`,
   heldElsewhere:others.length
    ? `<div class="trace-step"><b>also held by</b><span>${others.map(l=>escapeHtml(l.owner||'unknown')).join(' · ')}</span></div>`
    : ''};
 },

 /* The two things a reader must know before clicking Release. */
 _leaseNote({held,others}){
  const bundled=held&&(held.models||[]).length>1
   ? ` <b>This lease holds ${(held.models||[]).length} models</b> — releasing it unloads all of them.` : '';
  const shared=others.length
   ? ` It is also held by ${others.length} other owner(s), so releasing this lease will not unload it.` : '';
  return bundled+shared;
 },

 render(m,ev,res){
  const lease=this._leaseState(m,res);
  return this._identityRows(m)+this._evidenceRow(ev)+lease.heldElsewhere
   +`<div style="margin-top:10px">${lease.actions}</div>`
   +`<small class="mono dim">measurements are looked up by <b>variant</b>, not by model: two packagings of one model are two different things, and on this machine one granite build passed 24 of 24 tool trials while the other passed 3.${this._leaseNote(lease)}</small>`;
 },

 async load(runtimeKey){
  const out=await RUNTIME._send('/api/v1/runtime/sessions','POST',
    {owner:'nervis-dashboard',models:[{model_id:runtimeKey}],policy:'wait'});
  if(out)notify(`Loaded under session ${String(out.session_id).slice(0,12)}`);
  if(this.current)this.select(null,this.current.localId,this.current.variantId);
 },
 async release(sessionId,count){
  if(count>1&&!confirm(`That lease holds ${count} models. Releasing it unloads all of them. Continue?`))return;
  const out=await RUNTIME._send('/api/v1/runtime/sessions/'+sessionId,'DELETE');
  if(out)notify(`Released · unloaded ${(out.unloaded||[]).length}`);
  if(this.current)this.select(null,this.current.localId,this.current.variantId);
 }};

 setToken(){RUNTIME_TOKEN=($('#rtToken')||{}).value||'';

 /* `body` defaults rather than being tested against the literal — nervis's own
    check forbids that string anywhere in this file, because the way it usually
    arrives is a view rendering a field the API stopped returning. */
 async _send(path,method,body={}){
  try{
   const r=await fetch(BASE.sirvis+path,{method,
     headers:{'content-type':'application/json','authorization':'Bearer '+RUNTIME_TOKEN},
     body:JSON.stringify(body)});
   const payload=await r.json().catch(()=>({}));
   if(!r.ok){const e=(payload.error||{});
     notify(`${e.code||r.status}: ${e.message||'refused'}`);return null}

  }catch(failure){notify('SIRVIS did not answer: '+failure.message);return null}},
 async load(){

    owner:'nervis-dashboard',models:[entry],
    policy:($('#rtPolicy')||{}).value||'wait',
    ...(lease?{lease_seconds:Number(lease)}:{})});
  if(out)notify(`Session ${String(out.session_id).slice(0,12)} · ${(out.models||[]).length} model(s)`);
  render()},
 async release(id){const out=await this._send('/api/v1/runtime/sessions/'+id,'DELETE');
  if(out)notify(`Released · unloaded ${(out.unloaded||[]).length}`);render()},
 async renew(id){const out=await this._send('/api/v1/runtime/sessions/'+id+'/renew','POST');
  if(out)notify('Lease renewed');render()}};

     :`The bars are flat because this endpoint carries no throughput: SIRVIS files measurements against evidence records rather than against a build, so a rate belongs to a run under a named configuration and not to a name in a catalogue. The <b>Results</b> screen has them.`}</small>`,'sirvis')}</div>

/* ── SIRVIS SCREENS ────────────────────────────────────────────────────────
   Every card body goes through cell(…,'sirvis'): SIRVIS owns all of it, so all
   of it can go absent at once, and none of it may quietly survive as a stale
   number when the lab is not answering. The recurring discipline on these pages
   is that a score is never allowed to travel alone — build, runtime config, role,
   sample count and spread go with it, because that tuple *is* the evidence and
   the median on its own is only a rumour about it. */

/* Models — installed builds. Identity here is family + variant + runtime +
   runtime config, never the family name. This machine has granite-4.0-h-tiny
   twice — once GGUF through llama.cpp, once MLX — and they are different subjects
   with different context ceilings and different evidence. */
/* One measured capability, as a chip.
   `null` is not a no. A measurement that was never taken and a measurement
   that came back negative are different facts, and the column says so — a
   dash for unknown, never a quiet "none". */
function toolChip(x){
 const t=x.measured&&x.measured.tools;
 if(!t)return{t:null,works:null,html:'<span class="prov" data-kind="UNKNOWN">UNKNOWN</span>'};
 const works=t[0]===t[1];
 return{t,works,html:`<span class="chip${warnUnless(works)}">${t[0]}/${t[1]}</span>`};
}

function advertisedChip(x){
 if(x.tools_advertised==null)return '<span class="mono" style="opacity:.35">—</span>';
 return x.tools_advertised
  ?'<span class="chip">tool_use</span>'
  :'<span class="mono" style="opacity:.35">none</span>';
}

/* One build's row. Split out of the table, where it measured cyclomatic
   complexity 16 inline — the highest remaining in the file, and entirely made
   of "this field may be absent" repeated across seven columns. */
function buildRow(x,contextLabel){
 const {t,works,html:measured}=toolChip(x);
 /* Only a known advertisement can clash with a measurement; null is not a no. */
 const clash=works!==null&&x.tools_advertised!=null&&works!==x.tools_advertised;
 const size=x.size_gb==null?'—':x.size_gb+' GB';
 return `<div class="table-row seven"><span>${x.family}</span><span class="mono">${dash(x.variant)}</span><span class="mono">${dash(x.runtime)} · ${contextLabel(x.runtime_config)}</span><span>${advertisedChip(x)}${x.vision?' <span class="chip">vision</span>':''}</span><span${clash?' style="background:rgba(255,182,72,.08)"':''}>${measured}</span><span class="mono">${size}${x.resident_gb?' / '+x.resident_gb:''}</span><span class="chip${warnIf(x.state==='stopped')}">${x.state}</span></div>`;
}
