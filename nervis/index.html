  if(plan.stopped||plan.halted)return '<span class="mono dim" style="opacity:.5">not reached</span>';
  return '<span class="mono dim" style="opacity:.6">waiting</span>';
 };
 const steps=plan.steps.map((step,n)=>`<div class="table-row" style="grid-template-columns:24px 2.6fr 1.3fr">
   <span class="mono dim">${n+1}</span>
   <span>${escapeHtml(step.action||'Run')} ${escapeHtml(step.summary)}
     ${step.ready?'':`<br><small class="mono dim">${escapeHtml(step.detail||'this cannot be prepared')}</small>`}</span>
   <span>${state(n)}</span></div>`).join('');

 /* Three endings, and each says something different. A plan that finished, one
    somebody stopped, and one that halted because a step failed are not the same
    outcome, and reporting them alike would make "it stopped" mean nothing. */
 let footer;
 if(plan.halted)
  footer=`<div class="mono dim" style="margin-top:8px">halted at step ${escapeHtml(plan.halted)} — ${escapeHtml(plan.reason||'a step failed')}. Nothing after it ran.</div>`;
 else if(plan.stopped)
  footer=`<div class="mono dim" style="margin-top:8px">stopped after step ${escapeHtml(plan.stopped)} of ${escapeHtml(plan.steps.length)}. What had already run is above; nothing after it was started.</div>`;
 else if(plan.finished)
  footer=`<div class="mono dim" style="margin-top:8px">all ${escapeHtml(plan.steps.length)} steps ran.</div>`;
 else if(plan.running!==undefined)
  footer=`<div style="margin-top:8px"><button class="mode-chip" onclick="stopPlan(${index})">Stop</button>
   <span class="mono dim" style="font-size:11px;margin-left:7px">a stop takes effect at the next step, never in the middle of one</span></div>`;
 else if(!plan.ready)
  footer='<div class="mono dim" style="margin-top:8px">this plan cannot be run: a step above could not be prepared.</div>';
 else
  footer=`<div style="margin-top:8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap">
   <button class="btn primary" onclick="runPlan(${index})">Run ${escapeHtml(plan.steps.length)} steps</button>
   <button class="mode-chip" onclick="declinePlan(${index})">No thanks</button>
   <span class="mono dim" style="font-size:11px">nothing has run yet · each step is the same operation you could run on its own</span>
  </div>`;

 return `<div class="plan-card" style="margin-top:9px">
   <div class="mono dim" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px">Plan · ${escapeHtml(plan.steps.length)} steps, in this order</div>
   ${steps}${footer}</div>`;
}

/* Run the steps in order, stopping at a boundary and halting on a failure.

   **Sequential and awaited, never fired together.** The order is the thing that
   was confirmed; starting them in parallel would run a sequence somebody
   approved as a sequence, and "then" would have meant nothing.

   `stopping` is read at each boundary rather than passed to an abort signal: a
   stop must not tear a step in half. What was started finishes, and nothing
   after it begins — which is also the only version that can honestly report
   what already happened. */
async function runPlan(index){
 const message=CHAT_SESSION.messages[index];
 const plan=message&&message.plan;
 if(!plan||!plan.ready||plan.running!==undefined||plan.finished)return;
 for(const step of plan.steps)noteOutcome(step,'accepted');
 for(let n=0;n<plan.steps.length;n++){
  if(plan.stopping){plan.stopped=n;break}
  plan.running=n;
  render();
  const step=plan.steps[n];
  const answer=await runCommand(step.operation,step.target,'',CHAT_SESSION.remote_id||'');
  if(answer.error){
   step.done=`failed — ${answer.error}`;
   plan.halted=n+1;
   plan.reason=answer.error;
   break;
  }
  step.done=planStepDone(step,answer);
 }
 plan.running=undefined;
 if(!plan.halted&&plan.stopped===undefined)plan.finished=true;
 render();
}

/* What one finished step reports, in the words of what answered it. */
function planStepDone(step,answer){
 /* The step keeps the file for the same reason a single offer does: a plan that
    exported something should hand it over, not merely mention it. */
 if(answer.file){step.file=answer.file;return `${escapeHtml(answer.file.name)} · ${escapeHtml(answer.file.detail||'')}`}
 if(answer.job)return `${escapeHtml(answer.job.state||'submitted')}${answer.job.id?' · job '+escapeHtml(answer.job.id):''}`;
 if(answer.learned)return `filed under “${escapeHtml(answer.learned.heading)}”`;
 return 'done';
}

/* Ask the plan to stop. It takes effect at the next boundary. */
function stopPlan(index){
 const plan=CHAT_SESSION.messages[index]&&CHAT_SESSION.messages[index].plan;
 if(!plan)return;
 plan.stopping=true;
 render();
}

/* Decline the whole plan — M22's rule, applied to an ordering.

   Every step is recorded declined rather than the plan as one verdict: the
   steps were offered individually and each is separately answerable, so a
   record saying "declined the plan" would lose which offers were refused. */
function declinePlan(index){
 const plan=CHAT_SESSION.messages[index]&&CHAT_SESSION.messages[index].plan;
 if(!plan||plan.finished||plan.running!==undefined||plan.declined)return;
 for(const step of plan.steps)noteOutcome(step,'declined');
 plan.declined=true;
 plan.stopped=0;
 render();
}

/* Ask NERVIS to carry out one enumerated operation.

   **Through NERVIS rather than straight at SIRVIS**, which is the change that
   made this usable: SIRVIS separates `runtime` from `benchmark` scope (§4.5),
   the dashboard's own token is runtime-only, and pressing Run answered
   "forbidden — a token with benchmark scope is required". Minting a second
   token and pasting it is the manual step the launcher exists to remove. NERVIS
   holds the narrow credential now, checks the operation against its own closed
   set, and publishes every attempt to the hub. */
/* The operations that answer with a file rather than a job: a saved reply, an
   exported conversation, and the three annotated copies of an attachment. */
const WRITES_A_FILE=['nervis.document.write','nervis.conversation.export',
 'nervis.document.annotate.notes','nervis.document.annotate.margin','nervis.document.annotate.inline'];

/* Saving a reply, or exporting the whole conversation.

   Its own function because `runOffer` crossed the complexity ratchet when the
   export joined it — and the two belong together anyway: they answer in the
   same shape, a file rather than a job, which is why neither shares a sentence
   with the SIRVIS queue they never touch. */
async function runFileOffer(offer){
 const exporting=offer.operation==='nervis.conversation.export';
 const annotating=offer.operation.startsWith('nervis.document.annotate.');
 offer.done=exporting?'exporting…':annotating?'annotating…':'writing…';
 render();
 /* **The server's conversation id, not the browser's.** Both of these read
    their content out of NERVIS's own store, and the store is keyed on the id
    NERVIS minted when the first turn landed. `CHAT_SESSION.id` names a
    conversation the store has never heard of, so this asked for a file to be
    written from a conversation that, as far as NERVIS was concerned, did not
    exist. */
 const saved=await runCommand(offer.operation,offer.target,'',CHAT_SESSION.remote_id||'');
 /* Kept on the offer so the finished line can offer the file itself. The
    workspace is on the machine NERVIS runs on, which is not always the machine
    somebody is reading the dashboard from — "written to /Users/…/workspace" is
    the right thing to have done and the wrong place to stop. */
 offer.file=saved.file||null;
 offer.done=saved.file
   ?`${exporting?'exported':annotating?'annotated':'saved'} ${saved.file.name} · ${saved.file.detail}`
   :`nothing was written — ${saved.error}`;
 render();
}

async function runCommand(operation,target,reason,conversationId){
 try{
  const r=await fetch(BASE.nervis+'/api/v1/commands/run',{method:'POST',
    headers:{'content-type':'application/json'},
    /* `reason` only where an operation has one. Sent as an empty string rather
       than omitted would put a blank line on a tombstone that is supposed to
       say why. */
    /* `conversation_id` only where an operation reads from one. Writing a
       reply to a file takes its content from NERVIS's own store rather than
       from this body — the browser says *which* conversation, never *what* to
       write, or the endpoint would write whatever any caller asked it to. */
    body:JSON.stringify(Object.assign({operation,target},
      reason?{reason}:{}, conversationId?{conversation_id:conversationId}:{}))});
  const payload=await r.json().catch(()=>({}));
  if(!r.ok)return{error:((payload.error||{}).message)||('NERVIS answered HTTP '+r.status)};
  return payload;
 }catch(failure){return{error:'NERVIS did not answer: '+failure.message}}
}

/* What actually became of the submission, in the words of the state SIRVIS
   returned.

   **"queued" was a fixed word with the real state appended after it**, so a job
   that started immediately read `queued on SIRVIS · job abc123 · running` —
   which says both things at once and leads with the wrong one. Reported: it read
   as work put in a waiting line, and the benchmark had already begun loading a
   model.

   SIRVIS runs one benchmark at a time, so the difference is real and worth the
   words: `queued` means something else is running and this waits, `running`
   means the machine is busy with it now. Neither is guessed — the job's own
   state decides which sentence is used, the same rule the cancel path already
   follows for the same reason. */
function submitted(stopping,job){
 if(stopping)return 'cancel asked of SIRVIS';
 const state=String(job.state||'').toLowerCase();
 if(state==='running')return 'started on SIRVIS — running now';
 if(state==='queued')return 'queued on SIRVIS — waiting for the current job to finish';
 /* Any other state is SIRVIS's own word and is shown rather than translated:
    inventing a sentence for a state this page has not seen is how the bug above
    happened in the first place. */
 return `accepted by SIRVIS · ${state||'pending'}`;
}

/* Carry out exactly what the button says, through the service's own API.

   The token belongs to this tab, not to NERVIS: the operator pasted it, and
   NERVIS holding a benchmark-scoped credential of its own would make "the
   control plane can be talked into running things" true in a way §12 spends a
   page preventing. So the call goes from here, with the operator's own
   authority, to SIRVIS's own endpoint. */
/* File what became of one offer (M22).

   **Never awaited by the thing it describes.** Recording an outcome must not be
   able to stop the operation the person actually asked for: a NERVIS that
   refused to run a benchmark because it could not write down that you wanted
   one has its priorities exactly backwards. Failures here are dropped on
   purpose — the record is a convenience, and the act is the point. */
function noteOutcome(offer,outcome,editedTo){
 if(!offer||!offer.proposal_id)return;
 fetch(BASE.nervis+'/api/v1/proposals/outcome',{method:'POST',
   headers:{'content-type':'application/json'},
   body:JSON.stringify({proposal_id:offer.proposal_id,operation:offer.operation,
     target:offer.target||'',outcome,edited_to:editedTo||'',
     conversation_id:CHAT_SESSION.remote_id||''})}).catch(()=>{});
}

/* Take the offer, but not the target NERVIS guessed (M22).

   Recorded as `edited` with what it was changed *to*, because that is the part
   worth keeping: "declined" says somebody did not want this, and "edited to
   granite-4-micro" says what they wanted instead. The next offer for the same
   ambiguous phrase can say so.

   It then runs, because choosing among candidates is the confirmation — the
   person pressed the name of the thing they meant, and asking them to press a
   second button afterwards would be ceremony rather than consent. */
function chooseCandidate(index,name){
 const message=CHAT_SESSION.messages[index];
 const offer=message&&message.offer;
 if(!offer||offer.done)return;
 noteOutcome(offer,'edited',name);
 offer.target=name;
 offer.ready=true;
 /* Cleared so `runOffer` does not record a second outcome for one decision:
    the answer has already been filed, and it was `edited`. */
 offer.proposal_id='';
 return runOffer(index);
}

/* "No thanks" — the only way a decline becomes a fact.

   The offer is spent afterwards, the same as running it: an offer that could be
   declined twice would put two rows in the record for one decision. */
function declineOffer(index){
 const message=CHAT_SESSION.messages[index];
 const offer=message&&message.offer;
 if(!offer||offer.done)return;
 noteOutcome(offer,'declined');
 offer.done='declined — nothing was run';
 render();
}

async function runOffer(index){
 const message=CHAT_SESSION.messages[index];
 const offer=message&&message.offer;
 if(!offer||offer.done||!offer.ready)return;
 /* Recorded before the operation rather than after it. What is being filed is
    the person's answer, and they gave it by pressing this — whether SIRVIS then
    accepts the job is a different fact, and one the event hub already holds. */
 noteOutcome(offer,'accepted');
 /* NERVIS's own state, changed here rather than through an endpoint: the
    profile is what the *next* request will carry, and it lives in this tab.
    There is nothing to ask a service for and nothing to audit — the change is
    visible in the composer the moment it happens. */
 if(offer.operation==='nervis.chat.profile'){
  CHAT_SESSION.profile=offer.target;
  offer.done=`this conversation now routes through ${offer.target}`;
  persistPrivate();
  return render();
 }
 /* Saving a reply to a file is NERVIS's own operation and answers in its own
    shape — a file, not a job — so it is handled before the SIRVIS wording
    below rather than sharing a sentence with a queue it never touches. */
 if(WRITES_A_FILE.includes(offer.operation))return runFileOffer(offer);
 const stopping=offer.operation==='sirvis.benchmark.cancel';
 /* "submitting" rather than "queueing": at this point the request has been
    sent and nothing yet knows whether it will wait or start, and naming one of
    them here is the same guess the finished message used to make. */
 offer.done=stopping?'asking SIRVIS to stop it…':'submitting to SIRVIS…';
 render();
 const out=await runCommand(offer.operation,offer.target);
 /* SIRVIS's own job and state, or the reason it refused — neither composed
    here, because the queue is the only thing that knows the state of a job.
    **A cancel is a request, not a kill** (§4.2): a running job winds down at its
    next boundary, so the state that comes back may still be `running` for a
    moment and saying "stopped" would be inventing the outcome. */
 offer.done=out.job
   ?`${submitted(stopping,out.job)} · job ${String(out.job.job_id).slice(0,12)}`
   :`${stopping?'nothing was cancelled':'nothing was started'} — ${out.error}`;
 render();
}

/* NERVIS's own figures, printed under the greeting and nowhere else.

   They travel on every turn — the model is given them, and a paraphrase needs
   something to be checked against — but *printing* them under every reply is a
   different decision, and the wrong one. It was first written that way with a
   dedupe: only show the line when it changed. That reasoning held while the
   reading was three counts; it stopped holding when the reading grew event
   tallies and ages, which change every minute, so "only when it changed" became
   "every time" and the answer arrived wearing a status bar.

   The welcome is where it earns its place: NERVIS is speaking first, the figures
   are the reason it has anything to say, and the model is told to state no
   numbers at all. Everywhere else the reply is the answer and the reading is
   furniture. */
function withReading(message,reading,recalled){
 const out=reading?{...message,reading}:{...message};
 /* M20: the sources, kept on the turn so a repaint does not lose them. Absent
    entirely when recall is off, which is the default. */
 if(recalled&&recalled.length)out.recalled=recalled;
 return out;
}

/* What the reply drew on, named. §7.2's exit asks for the *source
   conversation*, not merely that something was remembered: a title is what
   makes a recollection checkable, and clicking one opens the conversation it
   came from so the person can read the whole thing rather than the fragment. */
function recalledRow(recalled){
 if(!recalled||!recalled.length)return '';
 return `<div class="mono dim" style="margin-top:6px;font-size:10px;letter-spacing:.04em">
   drew on ${recalled.map(one=>`<button class="mode-chip"
     onclick="CHAT_SESSIONS.open('${jsAttr(one.id)}')">${escapeHtml(one.title||one.id.slice(0,8))}</button>`).join(' ')}
  </div>`;
}

/* Both of the things that ride beside a reply: what NERVIS read, and what it
   offered to do about what was asked. */
function withExtras(outcome){
 const message=replyMessage(outcome);
 /* A plan and a single offer never both draw: `plan` is tried first on the
    server and only produced for a sequence, so at most one is set. Carried
    separately anyway rather than folded into one field, because they are
    different things — an offer is an act, a plan is an order of acts. */
 const withOffer=outcome.offer?{...message,offer:outcome.offer}:message;
 return outcome.plan?{...withOffer,plan:outcome.plan}:withOffer;
}

function replyMessage({reply,failed,aborted,reasoning,served,requestId}){
 const base={role:'assistant',served,request_id:requestId,speaker:speakerName(),
   at:new Date().toISOString()};
 if(failed)return{...base,text:failed};
 if(aborted)return{...base,interrupted:true,
   /* What the reader saw, kept, and labelled stopped rather than finished.
      NERVIS stored the same partial with `interrupted` set, so the two agree. */
   text:reply?reply+'\n\n— stopped —':'— stopped before the model produced anything —'};
 if(reply)return{...base,text:reply};
 /* An empty answer is almost never an empty answer. On this corpus it is a
    reasoning model spending the whole budget thinking — SIRVIS measured exactly
    that on both Gemma-4 builds, 253 of 256 tokens with no answer — and the
    frames say so if anyone counts them. "(empty response)" would hide a cause
    the stream was carrying. */
 return{...base,reasoningOnly:true,
   text:reasoning
    ? `No answer. The model spent its whole budget on reasoning (${reasoning} frames) and stopped before producing any. Raise Max tokens.`
    : 'The model returned an empty message.'};
}

/* One arriving frame, folded into the accumulator.
   Pure apart from the repaint, which is why it is out here rather than inside
   the stream loop: `sendChat` measured cyclomatic complexity 30 — the joint
   highest in the file — and the only way to get coverage on this logic without
   a running model was to make it a function that takes a frame and returns
   nothing but its effect on an object. `tools/shaping_check.js` now feeds it
   recorded frames. */
/* The message from a frame that is an error envelope rather than a delta.
   Empty when the frame is an ordinary one.

   **Truthiness, not presence.** Some proxies put `"error": null` on every
   frame of a perfectly good stream, and testing for the key would turn each of
   them into a refusal — RAVIS learned this from an upstream and the note is in
   its own reader; this is the same rule on the other side of the wire. */
function failureIn(frame){
 const found=frame&&frame.error;
 if(!found)return '';
 return (typeof found==='string'?found:found.message)||'the provider refused mid-stream';
}

function frameDelta(frame){return((frame.choices||[{}])[0]||{}).delta||{}}

function absorbFrame(item,acc,paint){
 if(item.error){acc.failed='stream';return}
 const frame=item.frame;
 /* A refusal arrives as an error marker followed by the frame carrying the
    reason, so the second frame is read only once the first has been seen. */
 if(acc.failed==='stream'){acc.failed=frame.message||failureIn(frame)||'RAVIS refused mid-stream';return}
 /* **A frame carrying an error object is itself the refusal**, with no marker
    line before it — which is the shape RAVIS sends and NERVIS did not read.
    Two services, two spellings: NERVIS writes `event: error` ahead of the data
    because it is refusing something it never sent upstream, and RAVIS puts the
    whole envelope in one frame. Only the first was recognised, so a real,
    actionable refusal — "circuit open after 3 consecutive failures" — arrived
    as a frame with no `choices`, contributed no text, and was reported as *the
    model returned an empty message*. A confident diagnosis of something that
    did not happen, which is the one thing this dashboard is not allowed to do. */
 const refused=failureIn(frame);
 if(refused){acc.failed=refused;return}
 const delta=frameDelta(frame);
 /* The first token that is actually text. Reasoning frames do not count: the
    model is still thinking, and the avatar should still say so. */
 if(delta.content){if(!acc.reply)chatMood('answering');acc.reply+=delta.content;if(paint)paint()}
 /* Counted, not shown. Reasoning tokens are the model thinking, not its
    answer — but a reply that is *only* reasoning needs explaining, and the
    count is the explanation. */
 if(delta.reasoning_content)acc.reasoning++;
 acc.served=frame.model||acc.served;
}

/* Why a request was refused, from the error envelope if there is one. */
async function refusalMessage(r){
 const d=await r.json().catch(()=>({}));
 return (d.error&&(d.error.message||d.error))||('NERVIS returned HTTP '+r.status);
}

/* A stop is not a failure and must not borrow a failure's explanation.
   Without the distinction, stopping a reasoning model before it produced any
   text rendered "the model spent its whole budget on reasoning — raise Max
   tokens", which is a confident diagnosis of something that did not happen. */
function transportFailure(e){
 const aborted=e.name==='AbortError';
 return{aborted,failed:aborted?'':'NERVIS is not reachable: '+e.message};
}

/* The user's turn and the placeholder the stream paints into. */
function stageTurn(text){
 CHAT_SESSION.busy=true;
 CHAT_SESSION.messages.push({role:'user',text,at:new Date().toISOString()});
 if(CHAT_SESSION.messages.length===1)CHAT_SESSION.title=text.slice(0,42);
 CHAT_SESSION.messages.push({role:'assistant',text:'',pending:true});
}

/* **Through NERVIS since M4, and streamed.** This used to POST straight to
   RAVIS and wait for a whole completion — a blank screen for however long a
   local model took, and a conversation that lived only in `localStorage` and
   vanished with the browser profile.

   NERVIS forwards RAVIS's SSE frames unchanged, so what arrives here is exactly
   OpenAI's shape; what NERVIS adds is storing both turns and cancelling RAVIS
   when this connection goes away. */
async function streamReply(stop,extra){
 const acc={reply:'',requestId:'',served:'',
   conversationId:CHAT_SESSION.remote_id||'',reasoning:0,failed:'',aborted:false};
 const node=()=>document.getElementById('streaming');
 const paint=()=>{const el=node();if(el)el.innerHTML='<b>'+escapeHtml(speakerName())+'</b>'+renderMarkdown(acc.reply)+
   pendingTail(acc.reply);scrollChatToEnd()};
 try{
  const r=await fetch(BASE.nervis+'/api/v1/chat',{
   method:'POST',headers:{'content-type':'application/json'},signal:stop.signal,
   body:JSON.stringify({...chatRequestBody(acc.conversationId),...(extra||{})})});
  acc.requestId=r.headers.get('x-request-id')||'';
  acc.conversationId=r.headers.get('x-conversation-id')||acc.conversationId;
  /* NERVIS's own figures, printed rather than spoken by the model. A model
     asked to quote a measurement paraphrases it — observed live: a 1.5B build
     turned "4 of 6 services reachable" into "efficiently manages four key
     services", which is not a number anybody measured. */
  acc.reading=r.headers.get('x-ecosystem-reading')||'';
  /* **M20: what was remembered, shown rather than quietly used.** A recalled
     sentence changes an answer, and a person who cannot see which earlier
     conversation it came from cannot tell a good recollection from a stale one
     — "the model just knows things" is how a wrong answer becomes
     unaccountable. Empty whenever recall is off, which is the default. */
  acc.recalled=(r.headers.get('x-recalled')||'').split(' | ').filter(Boolean)
    .map(one=>{const at=one.indexOf(':');
      /* Percent-encoded on the way out, because a header is latin-1 and a
         title is arbitrary text — an ellipsis in one produced a 500. */
      let title=one.slice(at+1);
      try{title=decodeURIComponent(title)}catch(e){}
      return{id:one.slice(0,at),title}});
  /* An offer NERVIS made from the person's own words, before the model saw
     anything. It arrives beside the reply rather than inside it: a control the
     model could write into its own text would be a control the model has. */
  acc.offer=parseOffer(r.headers.get('x-command-offer'));
  acc.plan=parsePlan(r.headers.get('x-command-plan'));
  /* **A conversation the browser remembers and NERVIS no longer holds.** The
     local copy outlives the server one — a database rebuilt, retention, a
     delete from another tab — and reopening it then sends an id that answers
     404. Recovered once rather than reported: the person asked to continue a
     conversation, and starting a fresh one silently is what happened *before*
     the id was restored at all. Said out loud, because the earlier turns are on
     screen and will not be in the export. */
  if(r.status===404&&CHAT_SESSION.remote_id){
   CHAT_SESSION.remote_id='';
   notify('NERVIS no longer holds this conversation — continuing as a new one');
   return streamReply(stop,extra);
  }
  if(!r.ok)acc.failed=await refusalMessage(r);
  else for await(const item of sseFrames(r.body))absorbFrame(item,acc,paint);
 }catch(e){Object.assign(acc,transportFailure(e))}
 return acc;
}

/* Correlate the reply with the decision RAVIS recorded for it. NERVIS looks it
   up by the request id it sent, so the link is exact rather than "the most
   recent decision" — which would be wrong the moment two requests overlap. */
async function attachRouteDecision({requestId,failed}){
 if(!requestId||failed)return;
 try{
  const rd=await fetch(BASE.nervis+'/api/v1/ravis/routes/for/'+encodeURIComponent(requestId),
    {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!rd.ok)return;
  const hit=(await rd.json()).decision;
  if(hit)CHAT_SESSION.messages[CHAT_SESSION.messages.length-1].route_decision_id=hit.decision_id;
 }catch(e){}
}

async function sendChat(){
 const box=document.getElementById('chatInput');
 const text=(box&&box.value||'').trim();
 if(!text||CHAT_SESSION.busy)return;
 box.value='';
 IDLE.spoke();
 stageTurn(text);
 /* Waiting on a model looks different from receiving one, and both look
    different from talking. An avatar that sits still through all three is a
    picture rather than an instrument. */
 chatMood('thinking');
 /* **Awaited.** `render()` refetches this screen's profiles and decisions, so
    leaving it unawaited meant the reply bubble did not exist for the first
    second — and every delta arriving before it was written into nothing. The
    text still appeared, because the repaint writes the whole accumulated
    string rather than appending, but the first second was blank: exactly the
    blank screen streaming exists to remove. */
 await render();

 const stop=new AbortController();
 CHAT_SESSION.abort=stop;
 const outcome=await streamReply(stop);

 CHAT_SESSION.busy=false;
 CHAT_SESSION.abort=null;
 CHAT_SESSION.remote_id=outcome.conversationId;
 /* The id arrives with the first reply, which is the first moment a decision
    made before typing has somewhere to be written. */
 persistPrivate();
 CHAT_SESSION.messages.pop();
 const reply=withExtras(outcome);
 CHAT_SESSION.messages.push(reply);
 await attachRouteDecision(outcome);
 /* NERVIS stored both turns already; this keeps the browser copy for the case
    the page is opened from disk with nothing running. */
 CHAT_STORE.save(CHAT_SESSION);
 render();
 /* **Here, and not in the streaming loop.** The reply is final at this point:
    the stream has closed, the placeholder is gone and `outcome.served` names
    the model that produced it — which is the fact §18.2's gate needs, because
    whether these words may reach a cloud voice depends on whether they already
    left the machine.

    A stopped reply, a transport failure and an answer that was only reasoning
    are all skipped: reading "— stopped —" aloud, or an error string, is worse
    than saying nothing. */
 chatMood(null);
 if(!outcome.aborted&&!outcome.failed&&!reply.reasoningOnly)SPEECH.say(plainMarkdown(outcome.reply),outcome.served);
}

/* She talks first when nobody else does.

   **Only in Miku mode.** Being ignored is that persona's defining trait; an
   unprompted remark from a chief of staff is an interruption rather than a
   character, which is why this is tied to the mode and not to a toggle of its
   own. Choosing the preset is the opt-in.

   The browser owns the *timing* because it is the only side that knows the tab
   is visible and the composer has been quiet. NERVIS owns the *words*, so a
   page cannot put a line in her mouth — the same split as the greeting.

   **It stops.** Three remarks per silence, at widening intervals, and then
   nothing until the user says something. A character that hates being ignored
   is funny twice and a cost centre forever; each of these is a real completion.
   Hidden tabs are skipped entirely, because nudging a window nobody is looking
   at spends money to talk to a screensaver. */
const IDLE={
 /* Two minutes, then four, then seven. Widening rather than fixed: the first
    silence is often someone reading, and the third is someone who has left. */
 STEPS:[120000,240000,420000],
 timer:null,
 count:0,

 /* Called after every user message and on every paint of the chat screen. */
 restart(){
  clearTimeout(this.timer);
  this.timer=null;
  /* Anywhere in NERVIS, not only the chat screen. Being ignored *while you are
     visibly doing something else* is the case the character is about, and the
     remark still arrives: it lands in the transcript, and it is spoken aloud if
     the voice is on — which is how you notice one from another screen. */
  if(!inMikuMode())return;
  const wait=this.STEPS[this.count];
  if(wait===undefined)return;
  this.timer=setTimeout(()=>this.fire(),wait);
 },

 /* Reset by anything the user actually does. */
 spoke(){this.count=0;this.restart()},

 stop(){clearTimeout(this.timer);this.timer=null},

 async fire(){
  this.timer=null;
  /* Re-checked at fire time, not only when armed: a mode change, a tab switch
     or a reply in flight can all happen inside a four-minute wait. */
  if(!inMikuMode()||CHAT_SESSION.busy)return;
  if(document.hidden)return this.restart();
  this.count++;
  await nudge(this.count);
  this.restart();
 }
};

/* One unprompted remark. Shaped exactly like a greeting: ephemeral, streamed
   into the transcript, spoken if the voice is on, and stored nowhere. */
async function nudge(count){
 if(CHAT_SESSION.busy)return;
 CHAT_SESSION.busy=true;
 CHAT_SESSION.messages.push({role:'assistant',text:'',pending:true});
 chatMood('thinking');
 await render();
 const stop=new AbortController();
 CHAT_SESSION.abort=stop;
 /* Where you actually are, which is the whole of "nosy". She is told the
    screen's *name* and nothing on it — read off `state`, never off the numbers
    — so she can remark that you have been staring at Diagnostics without
    inventing what it says. */
 const outcome=await streamReply(stop,
   {nudge:count,screen:state.view,conversation_id:CHAT_SESSION.remote_id||''});
 CHAT_SESSION.busy=false;
 CHAT_SESSION.abort=null;
 CHAT_SESSION.messages.pop();
 chatMood(null);
 /* A nudge that fails leaves no trace. Nobody asked for it, so an error bubble
    in its place is worse than the silence it was trying to break. */
 if(outcome.failed||outcome.aborted||!outcome.reply){if(state.view==='Chat')render();return}
 CHAT_SESSION.messages.push(withExtras(outcome));
 if(state.view==='Chat')render();
 SPEECH.say(plainMarkdown(outcome.reply),outcome.served);
}

/* NERVIS speaks first, in whatever character the system prompt sets.

   **Why through the model rather than a fixed line.** A hardcoded "Hello" would
   say the same thing whatever persona somebody configured, which makes the
   system prompt look like it does nothing until the second message. Routing the
   greeting through the same pool as everything else means a persona is audible
   from the first sentence — and it is one short completion, on a conversation
   that has none of its own history to carry.

   **It is stored nowhere.** §7.2's list is what the user said and what the
   model answered; an opening line the user never asked for would appear there
   as a message they did not send, and would come back as history on the next
   real turn — teaching the model that the conversation began with an
   instruction it should follow again. NERVIS's `greeting` flag skips both the
   conversation and the store.

   The instruction itself lives in NERVIS, not here, so this page cannot give
   NERVIS a character that is not §18.1's. */
async function maybeGreet(){
 /* Only into an empty conversation, and only once. `greeted` is set before the
    first `await`: `render()` repaints this screen, which calls back into here,
    and a flag set afterwards would start a second greeting into the gap. */
 if(CHAT_SESSION.greeted||CHAT_SESSION.messages.length||CHAT_SESSION.busy)return;
 CHAT_SESSION.greeted=true;
 CHAT_SESSION.busy=true;
 CHAT_SESSION.messages.push({role:'assistant',text:'',pending:true});
 chatMood('thinking');
 await render();

 const stop=new AbortController();
 CHAT_SESSION.abort=stop;
 const outcome=await streamReply(stop,{greeting:true});

 CHAT_SESSION.busy=false;
 CHAT_SESSION.abort=null;
 CHAT_SESSION.messages.pop();
 chatMood(null);
 /* A greeting that fails leaves no trace. An error bubble in a conversation
    nobody has started yet reads as a broken dashboard, and the failure is
    already visible everywhere else NERVIS reports on RAVIS. */
 if(outcome.failed||outcome.aborted||!outcome.reply)return render();
 CHAT_SESSION.messages.push(withReading(replyMessage(outcome),outcome.reading,outcome.recalled));
 render();
 SPEECH.say(plainMarkdown(outcome.reply),outcome.served);
}

/* Stop a reply in flight. Aborting the fetch closes the connection, NERVIS's
   relay sees the disconnect, cancels RAVIS and stores the partial text — so
   stopping keeps what was said rather than discarding it. */
function stopChat(){if(CHAT_SESSION.abort)CHAT_SESSION.abort.abort()}

const CREDS={
 async save(name){
  const field=document.getElementById(domId('cred',name));
  const secret=(field&&field.value||'').trim();
  if(!secret){alert('Paste a key first.');return}
  try{
   /* **Through NERVIS, not straight to RAVIS (§15.1).** This used to PUT to
      RAVIS with no Authorization header at all, and it worked because RAVIS
      took a loopback bind as authorization for a credential write. It no longer
      does: re-pointing a provider key must not come free with the ability to
      call the gateway, so the write needs an admin credential — and a browser
      form is not a place to keep one. NERVIS holds it, exactly as it holds
      SIRVIS's admin token for deleting a result. */
   const r=await fetch(BASE.nervis+'/api/v1/ravis/credentials/'+encodeURIComponent(name),
    {method:'PUT',headers:control_headers(),body:JSON.stringify({secret})});
   /* Cleared whether or not the write succeeded: a failed save should not leave
      the key sitting in a DOM node for the next person at the screen. */
   field.value='';
   /* The upstream status travels verbatim, so this names which of three things
      went wrong rather than saying "it failed": NERVIS holding no admin
      credential, RAVIS refusing the value, or RAVIS not answering. */
   if(!r.ok){
    const said=await r.json().catch(()=>({}));
    alert(said.message||('The key was not saved: HTTP '+r.status));
    return;
   }
  }catch(e){field.value='';alert('RAVIS is not reachable.');return}
  ravisCredentials();
 },
 async forget(name){
  if(!armed('credential:'+name,'This removes the stored '+name+' key from RAVIS'))return;
  try{
   /* Through NERVIS for the same reason as saving: §15.1 is about who may
      change key material, and removing a key changes it. */
   const gone=await fetch(
    BASE.nervis+'/api/v1/ravis/credentials/'+encodeURIComponent(name),
    {method:'DELETE',headers:control_headers()});
   if(!gone.ok){
    const said=await gone.json().catch(()=>({}));
    alert(said.message||('The key was not removed: HTTP '+gone.status));
    return;
   }
  }catch(e){alert('RAVIS is not reachable.');return}
  ravisCredentials();
 }};

/* Diagnostics — is this build actually Clarvis-compatible, and is anything in the
   way right now. The conformance suite is the release gate: every check passes or
   the build does not claim compatibility. */
/* RAVIS's own health, read live.
   `ravis conformance clarvis` is a CLI command with no HTTP surface, so the
   conformance table cannot be read from anywhere and stays prototype. What
   *is* readable is whether RAVIS's upstream answers, how quickly, and how many
   models it can see. */
async function ravisHealth(){
 try{
  const r=await fetch(BASE.ravis+'/api/v1/health',{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  return r.ok?await r.json():null;
 }catch(e){return null}
}

function upstreamRow(rhealth){
 if(!rhealth.upstream_reachable)
  return `<span class="chip warn">not answering</span> <span class="mono dim">${escapeHtml(rhealth.upstream_detail||'')}</span>`;
 const ms=rhealth.upstream_latency_ms;
 return `<span class="chip">answering</span> <span class="mono dim">${escapeHtml(ms!=null?Math.round(ms)+' ms':'')}</span>`;
}

function ravisHealthCard(rhealth,rdiag){
 if(!rhealth)return '';
 const identity=(rdiag&&rdiag.identity)||null;
 return `<div class="card full live"><h3>RAVIS health <span class="chip">live</span></h3>${cell(`
   <div class="trace-step"><b>status</b><span>${healthChip(rdiag)}</span></div>
   <div class="trace-step"><b>upstream</b><span>${upstreamRow(rhealth)}</span></div>
   <div class="trace-step"><b>models visible</b><span class="mono">${escapeHtml(rhealth.models_known)}</span></div>
   ${identity?`<div class="trace-step"><b>build</b><span class="mono">${escapeHtml(dash(identity.build_version))} · protocol ${escapeHtml(dash(identity.protocol_version))}</span></div>`:''}
   ${((rdiag&&rdiag.unavailable)||[]).map(c=>`<div class="trace-step"><b>${escapeHtml(c.id)}</b><span style="opacity:.75">${escapeHtml(c.reason||'')}</span></div>`).join('')}
   <small class="mono dim">read from <b>/api/v1/health</b> and <b>/ecosystem/capabilities</b>. <b>Conformance is not here because it cannot be</b>: <span class="mono">ravis conformance clarvis</span> is a CLI command with no HTTP surface, so the ten checks below are a sample of the suite's shape rather than a run of it — the suite itself runs <b>seventeen</b>, and this card said sixteen while listing ten. Run the command to see a real result — it is the §8.9 release gate and passes today.</small>`,'ravis')}</div>`;
}

/* The behaviours the suite covers — not a verdict on them. This card used to
   render a green `pass` chip and ten green ticks out of a constant in this
   file. Nothing had run, and no run's result is readable from a browser at
   all: `ravis conformance clarvis` is a CLI command, and RAVIS publishes no
   endpoint carrying its outcome. The chip beside the heading said "shape, not
   a run" while the ticks said otherwise, and a reader believes the ticks. The
   names stay — knowing what Clarvis depends on is worth reading without a
   result. The ticks were the page marking its own homework. */
function conformanceCard(cf){
 return `<div class="card full"><h3>Clarvis conformance <span class="chip warn">not run from here</span></h3>${cell(`
   <div class="route-lanes" style="grid-template-columns:repeat(2,1fr)">${cf.checks.map(([name])=>`
    <div class="lane" style="cursor:default"><b>${escapeHtml(name)}</b></div>`).join('')}</div>
   <small class="mono dim">${escapeHtml(cf.checks.length)} of the suite's seventeen checks, listed rather than run: <span class="mono">ravis conformance clarvis</span> is a CLI command, <b>/api/v1/route-tests</b> answers 404, and no pass or fail reaches anywhere a browser can read. Run the command for a verdict — it is the §8.9 release gate. These are not unit tests of RAVIS; they are the behaviours Clarvis depends on. Streaming that ends without <b>[DONE]</b>, tool arguments split across frames, or a <b>tool_call_id</b> that changes on the way through all produce an editor that fails in ways no RAVIS log would explain.</small>`,'ravis')}</div>`;
}

function providerHealthCard(pr,breakers,live=false){
 const note=breakers.length
  ? `<b>${escapeHtml(breakers[0].label)}</b> is at ${escapeHtml(breakers[0].breaker)}: one probe at a time until it proves itself. Requests keep being served — from the local pool, at no cost — which is why the symptom of a cloud provider degrading is a bill going down, not an error page.`
  : 'Every breaker closed and every enabled provider answering.';
 return `<div class="card wide${liveClass(live)}"><h3>Provider health</h3>${cell(`
   <div class="table-row head five"><span>Provider</span><span>Breaker</span><span>Error rate</span><span>p50</span><span>Enabled</span></div>
   ${pr.items.map(x=>`<div class="table-row five"><span>${escapeHtml(x.label)}</span><span class="chip${warnUnless(x.breaker==='CLOSED')}">${escapeHtml(x.breaker)}</span><span>${escapeHtml(Math.round(x.error_rate*100))}%</span><span>${escapeHtml(x.p50_ms?x.p50_ms+' ms':'—')}</span><span class="chip${warnUnless(x.enabled)}">${escapeHtml(x.enabled?'yes':'no')}</span></div>`).join('')}
   <small class="mono dim">${note}</small>`,'ravis')}</div>`;
}

function unavailablePoolsCard(down,live=false){
 const body=down.length
  ? down.map(x=>`<div class="trace-step"><b>${escapeHtml(x.pool_id)}</b><span>${escapeHtml(x.reason||'no member satisfies its invariants')}</span></div>`).join('')
    +`<small class="mono dim">a request to ${escapeHtml(down[0].pool_id)} returns NO_ROUTE. The pool endpoint publishes availability and membership, not a per-pool diagnosis — the reason a <b>particular</b> request found no route is on that request's route decision, with the excluded builds and why each was excluded. Nothing installed satisfies the invariant, so the fix is a build, not a retry.</small>`
  : `<div class="trace-step"><b>all pools</b><span>at least one member</span></div><small class="mono dim">every published pool can be served.</small>`;
 return `<div class="card narrow${liveClass(live)}"><h3>Unavailable pools</h3>${cell(body,'ravis')}</div>`;
}

async function ravisDiagnostics(){
 heading('Diagnostics','The Clarvis conformance suite, breaker state and pool availability — the three things that break a client.',
  `<span class="mono" style="opacity:.6;font-size:12px">ravis conformance clarvis</span>`);
 const [cf,pr,pl,rhealth,rdiag]=await Promise.all([
   API.ravis.conformance(),API.ravis.providers(),API.ravis.pools(),
   ravisHealth(),serviceDiagnostics('ravis')]);
 const passed=cf.checks.filter(([,ok])=>ok).length;
 /* Second home of a bug fixed once on the Providers screen: `!== 'CLOSED'`
    sweeps up every provider RAVIS has never called, so this counted four open
    breakers while three of the four were answering. An open breaker is a
    verdict §10 reached; never probed is the absence of one. */
 const breakers=pr.items.filter(x=>x.breaker==='OPEN'||x.breaker==='HALF_OPEN');
 const unprobed=pr.items.filter(x=>x.breaker==null).length;
 const down=pl.items.filter(x=>!x.available);

 $('#content').innerHTML=ravisHealthCard(rhealth,rdiag)+kpis([
   ['Conformance',`${passed} / ${cf.checks.length}`,`suite ${cf.suite} · ${cf.ran_at}`,'ravis',false],
   ['Verdict',cf.pass?'PASS':'FAIL','all or nothing — there is no partial claim','ravis',false],
   ['Breakers',String(breakers.length),
     breakers.length?'open or recovering':unprobed?`none open · ${unprobed} never called`:'all closed','ravis'],
   ['Pools down',String(down.length),down.length?down[0].pool_id:'none','ravis']])
 +conformanceCard(cf)+providerHealthCard(pr,breakers,pr.live)+unavailablePoolsCard(down,pl.live);
}

/* ── EDITOR_PREVIEW ────────────────────────────────────────────────────────
   Everything in here is rendered by code-server and the Clarvis extension inside
   the frame — NOT by NERVIS, and NOT fetched from any endpoint. The Bridge is
   read-only status; it never carries a prompt, a model reply or file contents.
   When the Code tab becomes a real iframe this constant is deleted outright,
   not ported: the frame will render its own. */
const EDITOR_PREVIEW={
 code:`<span class="kw">def</span> <span class="fn">add_tag</span>(tag: str, tags: list[str] = []) -&gt; list[str]:
    <span class="str">"""Attach a tag to a post and return the full list."""</span>
    tags.append(tag)
    <span class="kw">return</span> tags


<span class="kw">def</span> <span class="fn">tags_for</span>(post: dict) -&gt; list[str]:
    <span class="kw">return</span> add_tag(post[<span class="str">"tag"</span>]) <span class="cursor"></span>`,
 turns:[
  ['clarvis','Welcome back. Four commits since you left, and <code>test_tags</code> has been failing since the second one.'],
  ['user','why is add_tag returning tags from other posts'],
  ['clarvis','Because <code>tags=[]</code> is evaluated once, when the function is defined — not on each call. Every caller that omits it shares the same list, and that list has been collecting since import. Python\'s oldest trap, and it still gets invited to things.']],
 choices:[
  ['Default to None and build inside','tags=None, then tags=[] on entry. Signature unchanged.'],
  ['Require the argument','Drops the default. Both call sites must pass a list.'],
  ['Leave it','No change. It keeps sharing.']]
};


/* ── M9: what one Clarvis window is doing ────────────────────────────────────

   The Clarvis tab is otherwise the editor itself; this is NERVIS's own screen
   about the editor, which is a different subject and gets a different view
   rather than a strip above the frame.

   **Everything here is read, and there is no control on the page.** §6.7 lets
   NERVIS display status, diagnostics and *that* a gate awaits the user, and
   forbids approving one on their behalf. So the gate card names the wait and
   says outright that answering happens in the editor — a screen that showed a
   pending approval with no explanation is one somebody eventually looks for a
   button on. */

/* Which windows exist, and which one is being read.

   Kept as page state rather than derived per render because the reader picks a
   window and a poll must not move them to another one. Cleared when the id
   stops being registered, which `clarvisDiagnosticsView` checks — a selection
   pointing at a closed editor would otherwise 404 on every repaint. */
let CLARVIS_WINDOW='';

/* One window's state, said the way §6.3 says it. `unknown` is the honest answer
   for a window NERVIS could not reach, and it is deliberately not `idle`: idle
   is a claim about a window somebody answered for. */
const CLARVIS_STATE={
 idle:['idle','ok'], chatting:['chatting','ok'], agent_running:['agent running','busy'],
 waiting_for_approval:['waiting for you','warn'], stopping:['stopping','warn'],
 failed:['failed','bad'], unknown:['unknown','dim']};

function clarvisStateChip(state){
 const [label,tone]=CLARVIS_STATE[state]||CLARVIS_STATE.unknown;
 return `<span class="chip${tone==='ok'?'':' '+tone}">${escapeHtml(label)}</span>`;
}

/* The window picker. Drawn even for a single window, because §6.6 makes "how
   many editors are registered" a fact worth seeing — two windows on the same
   project are two instance lifetimes and are presented honestly. */
function clarvisWindowTabs(windows,chosen){
 return `<div class="filter-row note-tabs" role="group" aria-label="Which editor window">
  ${windows.map(w=>`<button class="mode-chip${w.instance_id===chosen?' on':''}"
    onclick="pickClarvisWindow('${jsAttr(w.instance_id)}')"
    >${escapeHtml(w.label||w.instance_id.slice(0,8))}${w.live?'':' <b>lapsed</b>'}</button>`).join('')}
 </div>`;
}

function pickClarvisWindow(id){if(CLARVIS_WINDOW!==id){CLARVIS_WINDOW=id;render()}}

/* The agent run, which is read from events rather than from status.

   Status answers *now*, so a run that finished thirty seconds ago shows there
   as `idle` — and "what just happened" is the thing somebody opening this
   screen wants. A run NERVIS never saw start is absent rather than drawn with
   an empty start time. */
function clarvisRunCard(run){
 if(!run||!run.state)return cell(banner('No agent run recorded',
   'NERVIS has been sent no <code>clarvis.agent.*</code> event for this window. A run that '
   +'began before the window registered is one NERVIS did not watch, and is not guessed at.','info'),'clarvis');
 const ended=run.ended_at?`<dt>ended</dt><dd>${escapeHtml(noteExact(run.ended_at))}</dd>`:'';
 return cell(`<dl class="kv">
   <dt>state</dt><dd>${escapeHtml(run.state)}</dd>
   <dt>steps</dt><dd>${escapeHtml(run.steps)}</dd>
   <dt>started</dt><dd>${escapeHtml(noteExact(run.started_at))}</dd>${ended}
  </dl>`,'clarvis');
}

/* A gate, shown and never answered. */
function clarvisGateCard(gate,on){
 if(!gate||!gate.category)return '';
 return `<div class="card full${on}"><h3>Waiting for you</h3>${cell(banner(
   `Clarvis is waiting on a ${escapeHtml(gate.category)} approval`,
   `Requested ${escapeHtml(noteExact(gate.since))}. <b>Answer it in the editor</b> — NERVIS `
   +'shows that a gate is open and cannot resolve one, which is <code>CLARVIS.md</code> §6.7 '
   +'and is why there is no button here.','warn'),'clarvis')}</div>`;
}

function clarvisTaskRows(tasks){
 if(!tasks.length)return banner('No task recorded',
   'This window has sent no <code>clarvis.task.*</code> event.','info');
 return `<div class="table-row head caps" style="grid-template-columns:1.4fr .8fr 1fr 1fr">
   <span>Task</span><span>State</span><span>Started</span><span>Finished</span></div>`
  +tasks.map(t=>`<div class="table-row" style="grid-template-columns:1.4fr .8fr 1fr 1fr">
    <span class="mono">${escapeHtml(t.task_id)}</span>
    <span>${escapeHtml(t.state)}${t.outcome?` · ${escapeHtml(t.outcome)}`:''}</span>
    <span class="mono dim">${escapeHtml(t.started_at?noteExact(t.started_at):'not seen')}</span>
    <span class="mono dim">${escapeHtml(t.completed_at?noteExact(t.completed_at):'—')}</span>
   </div>`).join('');
}

function clarvisEventRows(events){
 if(!events.length)return banner('No events from this window',
   'Clarvis forwards its events to NERVIS best-effort and never waits on them, so a quiet '
   +'window and an unreachable hub look the same from here — nothing is inferred from the silence.','info');
 return events.map(e=>`<div class="table-row" style="grid-template-columns:1.6fr 2fr">
   <span class="mono">${escapeHtml(e.event_type||'')}</span>
   <span class="mono dim">${escapeHtml(noteExact(e.occurred_at||''))}</span>
  </div>`).join('');
}

/* The two states with no window to draw, which are different facts: a dashboard
   that cannot reach NERVIS knows nothing, and a NERVIS with no registered window
   knows that there is none — which is Clarvis's ordinary condition, not a fault. */
function clarvisNoWindows(live){
 return `<div class="card full${liveClass(live)}"><h3>Clarvis</h3>${cell(banner(
   live?'No editor window has registered':'NERVIS is not answering',
   live
    ?'Clarvis activates and dies with its VS Code window and never depends on NERVIS, so this is '
     +'the ordinary state rather than a fault. Turn on <b>clarvis.bridge.enabled</b> in a window\'s '
     +'settings and it appears here.'
    :'The registry lives in NERVIS\'s own database, so nothing can be read until it is up.',
   live?'info':'warn'),'clarvis')}</div>`;
}

/* The window's own card.

   **A lapsed lease is said, not implied.** M9's exit asks that a stale
   connection be clearly shown, and the failure mode is quiet: a window whose
   editor was closed keeps its last known state, and drawing that state without
   dating it is a dashboard reporting an editor that is not running. */
function clarvisWindowCard(d,tabs){
 const status=d.status||{};
 const lease=d.expires_in>0
   ?`renewed, expires in ${escapeHtml(d.expires_in)}s`
   :'<b>lease lapsed</b> — the editor stopped renewing, so everything below is its last known state';
 const rows=[
   ['window',escapeHtml(d.label||d.instance_id)],
   ['registration',lease],
   ['awaiting',status.awaiting?escapeHtml(status.awaiting):''],
   ['activity',status.activity_id?`<span class="mono">${escapeHtml(status.activity_id)}</span>`:''],
   ['elapsed',status.elapsed_ms!=null?`${escapeHtml(Math.round(status.elapsed_ms/100)/10)}s`:''],
 ].filter(([,value])=>value);
 return `<div class="card full${liveClass(d.expires_in>0)}"><h3>Window
   ${clarvisStateChip(status.state||'unknown')}</h3>${cell(tabs+`<dl class="kv">${
   rows.map(([label,value])=>`<dt>${label}</dt><dd>${value}</dd>`).join('')}</dl>`,'clarvis')}</div>`;
}


/* ── M11: one request through RAVIS, stage by stage (§11.4) ──────────────────

   §7.1 calls this the thing that makes ordinary chat a RAVIS debugging tool.
   M4 built the one-line version onto a reply; this is the whole sequence.

   **The stage list is chosen by the execution path, not filtered down to it.**
   §11.4 says outright *do not imply RAVIS normalized content it actually passed
   through untouched*, and an empty row labelled "normalized request" on a
   transparent route is exactly that implication. The server decides which list;
   this draws whichever it was handed. */

let INSPECT_ID='';

/* What each stage's state means, said in the row rather than in a legend
   somebody has to go and find. */
const STAGE_TONE={
 published:['from RAVIS','ok'],
 held:['NERVIS\'s own record','ok'],
 withheld:['hidden by the content setting','dim'],
 not_published:['not published','dim'],
};

function stageRow(stage){
 const [label,tone]=STAGE_TONE[stage.state]||['unknown','dim'];
 return `<div class="table-row" style="grid-template-columns:1.2fr .9fr 2.4fr">
   <span><b>${escapeHtml(stage.name)}</b></span>
   <span class="chip ${escapeHtml(tone==='ok'?'':tone)}">${escapeHtml(label)}</span>
   <span style="opacity:.8">${escapeHtml(stage.detail||'')}${stage.content
     ?`<br><span class="mono" style="opacity:.95">${escapeHtml(stage.content)}</span>`:''}</span>
  </div>`;
}

/* The path, named and explained. Two paths mean two different claims about what
   RAVIS did to the request, and §11.4 exists because conflating them misreports
   what actually happened. */
function pathCard(path){
 const transparent=path==='TRANSPARENT';
 return cell(banner(transparent?'Transparent route':'Translated route',
   transparent
    ?'RAVIS passed this through to an OpenAI-compatible upstream. It did <b>not</b> normalize '
     +'the content, so there is no normalized request to show — the stages below are the whole of it.'
    :`RAVIS translated this through its normalized form and out again (<span class="mono">${escapeHtml(path)}</span>). `
     +'The intermediate stages exist; RAVIS publishes no surface carrying them, which each row says.',
   'info'),'nervis');
}

function attemptRows(attempts){
 if(!attempts.length)return banner('No attempt recorded','RAVIS recorded a decision but no execution.','info');
 return `<div class="table-row head caps" style="grid-template-columns:1.6fr .8fr .8fr 1.4fr">
   <span>Model</span><span>Outcome</span><span>Elapsed</span><span>Detail</span></div>`
  +attempts.map(a=>`<div class="table-row" style="grid-template-columns:1.6fr .8fr .8fr 1.4fr">
    <span class="mono">${escapeHtml(a.model||'—')}</span>
    <span class="chip${a.outcome==='succeeded'?'':' bad'}">${escapeHtml(a.outcome||'—')}</span>
    <span class="mono dim">${a.elapsed_ms!=null?escapeHtml(Math.round(a.elapsed_ms))+' ms':'—'}</span>
    <span style="opacity:.75">${escapeHtml(a.detail||'')}</span>
   </div>`).join('');
}

function inspectorRows(items){
 if(!items.length)return banner('No route decision held',
   'RAVIS keeps decisions in memory, so this is empty after a restart until something routes. '
   +'Send a chat message and it appears here.','info');
 return `<div class="table-row head caps" style="grid-template-columns:1fr .8fr 1.4fr 1fr">
   <span>When</span><span>Client</span><span>Selected</span><span>Path</span></div>`
  +items.map(r=>`<div class="table-row" style="grid-template-columns:1fr .8fr 1.4fr 1fr;cursor:pointer"
    onclick="openInspection('${jsAttr(r.decision_id)}')">
    <span class="mono dim">${escapeHtml(noteExact(r.decided_at||''))}</span>
    <span>${escapeHtml(r.application_id||'—')}</span>
    <span class="mono">${escapeHtml(r.selected||'—')}${r.pool
      ?`<br><small class="dim">via ${escapeHtml(r.pool)}</small>`:''}</span>
    <span class="mono dim">${escapeHtml(r.execution_path||'—')}</span>
   </div>`).join('');
}

function openInspection(id){INSPECT_ID=id;render()}
function closeInspection(){INSPECT_ID='';render()}

async function toggleInspectorContent(on){
 await API.nervis.setInspectorContent(on);
 render();
}

/* The content switch, drawn with what it actually governs said next to it —
   §11.4's "content follows logging and privacy settings" is a sentence somebody
   has to be able to act on. */
function contentSwitch(on){
 return `<div class="filter-row">
   <button class="mode-chip${on?' on':''}" onclick="toggleInspectorContent(${on?'false':'true'})"
     >message content: ${on?'shown':'hidden'}</button>
   <small class="mono dim">${on
     ?'Requests NERVIS made itself show their text. Nothing else does — RAVIS publishes no content.'
     :'Off by default. The route is the subject here; the messages are the part you ask for.'}</small>
  </div>`;
}

/* The decision itself, as a card. Extracted because `inspectorView` reached 20
   against a ratchet of 13, and this half is pure markup over one object. */
function inspectorDecisionCard(d,back,showContent){
 const dec=d.decision||{};
 const rows=[
   ['asked for',`<span class="mono">${escapeHtml(dec.requested||'—')}</span>`],
   ['selected',`<span class="mono">${escapeHtml(dec.selected||'—')}</span>`],
   ['pool',dec.pool?`<span class="mono">${escapeHtml(dec.pool)}</span>`:''],
   ['because',escapeHtml(dec.reason||'no reason recorded')],
   ['client',escapeHtml(dec.application_id||'—')],
   ['considered',`${escapeHtml(d.considered_count)} model(s) — ${escapeHtml(
     (d.considered_sample||[]).slice(0,6).join(', '))}${d.considered_count>6?' …':''}`],
   ['request id',`<span class="mono">${escapeHtml(dec.request_id||'—')}</span>`],
 ].filter(([,value])=>value);
 return `<div class="card full${liveClass(true)}"><h3>Request
   <span class="chip">${escapeHtml(dec.execution_path||'—')}</span></h3>${cell(
   `<div class="filter-row">${back}</div>`+contentSwitch(showContent)+`<dl class="kv">${
   rows.map(([label,value])=>`<dt>${label}</dt><dd>${value}</dd>`).join('')}</dl>`,'nervis')}</div>`;
}


/* ── M10: the raw logs (§11.3) ────────────────────────────────────────────────

   Fourth and last on the diagnostics ladder, and the screen says so: a text log
   is never the thing to read when the event hub already has the answer. What it
   is for is the case the hub cannot serve — a service that died before it could
   publish, or an upstream's complaint that reached stderr and nowhere else. */

let LOG_SERVICE='nervis';
const LOG_FILTER={level:'',text:''};

function setLogService(service){if(LOG_SERVICE!==service){LOG_SERVICE=service;render()}}
function setLogFilter(field,value){LOG_FILTER[field]=value;render()}

/* Severity, from the field rather than from the words in the line. */
const LOG_TONE={ERROR:'bad',CRITICAL:'bad',WARNING:'warn',INFO:'',DEBUG:'dim'};

function logRow(entry){
 const level=String(entry.level||'').toUpperCase();
 const tone=LOG_TONE[level]!==undefined?LOG_TONE[level]:'dim';
 return `<div class="table-row" style="grid-template-columns:.6fr 1fr 4fr">
   <span>${level?`<span class="chip ${escapeHtml(tone)}">${escapeHtml(level)}</span>`
     :'<span class="mono dim">—</span>'}</span>
   <span class="mono dim">${escapeHtml(String(entry.logger||'—')).slice(0,34)}</span>
   <span class="mono" style="opacity:.9;word-break:break-word">${escapeHtml(
     String(entry.message||''))}${entry.parsed===false
     ?' <small class="dim">(not JSON — passed through)</small>':''}</span>
  </div>`;
}

function logSourceTabs(items){
 return `<div class="filter-row note-tabs" role="group" aria-label="Which log">
   ${items.map(one=>`<button class="mode-chip${one.service===LOG_SERVICE?' on':''}"
     onclick="setLogService('${jsAttr(one.service)}')"
     >${escapeHtml(one.service)}${one.present
       ?` <b>${escapeHtml((one.bytes/1048576).toFixed(1))} MB</b>`:' <b>absent</b>'}</button>`).join('')}
  </div>`;
}

/* The bounds, said as numbers rather than as a promise. §11.3's rule is that no
   service may quietly fill the disk, and "quietly" is the word this answers. */
function logLimits(limits,items){
 const total=items.reduce((sum,one)=>sum+(one.bytes||0),0);
 const rotated=items.reduce((sum,one)=>sum+(one.rotated||0),0);
 return `<small class="mono dim">Live logs total <b>${escapeHtml(
   (total/1048576).toFixed(1))} MB</b> across ${escapeHtml(items.filter(o=>o.present).length)}
   file(s), with ${escapeHtml(rotated)} rotated cop${rotated===1?'y':'ies'} kept.
   <b>Rotation is enforced on the probe timer</b>, not merely configured: a log over
   <b>${escapeHtml(Math.round((limits&&limits.max_bytes||0)/1048576))} MB</b> is copied aside and
   truncated in place — copied rather than renamed, because the service is still holding the file
   open and a rename leaves it writing somewhere nobody looks. At most
   <b>${escapeHtml(limits&&limits.max_files)}</b> copies are kept and anything older than
   <b>${escapeHtml(limits&&limits.retention_days)} days</b> is dropped. The live log is never
   deleted for being old.</small>`;
}

function logFilters(found){
 const chip=(value,label)=>`<button class="mode-chip${LOG_FILTER.level===value?' on':''}"
   onclick="setLogFilter('level','${jsAttr(value)}')">${escapeHtml(label)}</button>`;
 const scanned=found&&found.filtered
   ?`<small class="mono dim">searched the last ${escapeHtml(found.scanned)} line(s)</small>`:'';
 return `<div class="filter-row">
   ${chip('','any level')}${chip('ERROR','error')}${chip('WARNING','warning')}${chip('INFO','info')}
   <span class="rule"></span>
   <input class="log-find" placeholder="find in recent lines" value="${escapeHtml(LOG_FILTER.text)}"
     onchange="setLogFilter('text',this.value)">
   ${scanned}
  </div>`;
}

/* What the line pane shows, which is three different facts.

   An empty result under a filter is a statement about the window searched, not
   about the file — saying so is the difference between "it never happened" and
   "not in the last few hundred lines". Extracted because `logsView` reached 15
   against a ratchet of 13, and this is the branchy half. */
function logBody(lines){
 if(!lines.present)return banner('No log for this service',escapeHtml(lines.reason||'')+'.','info');
 if((lines.items||[]).length)return lines.items.slice().reverse().map(logRow).join('');
 if(LOG_FILTER.level||LOG_FILTER.text)return banner('Nothing matched',
   `No line in the last ${escapeHtml(lines.scanned||0)} matched. That is a statement about the `
   +'window searched, not about the whole file.','info');
 return banner('This log is empty','The service has written nothing here yet.','info');
}

async function logsView(){
 heading('Diagnostics','Raw process logs — the last resort, never the first read.');
 const sections=`<div class="card full">${cell(diagSections(),'nervis')}</div>`;
 const found=await API.nervis.logSources();

 if(!found.configured){
  $('#content').innerHTML=sections+`<div class="card full">${cell(banner(
    'No log adapter is configured',
    escapeHtml(found.reason||'')+'. The launcher is what documents where each service writes, '
    +'so a NERVIS started by hand has no source here rather than a guessed one.','info'),'nervis')}</div>`;
  return;
 }

 const items=found.items||[];
 const lines=await API.nervis.logLines(LOG_SERVICE,
   {...(LOG_FILTER.level?{level:LOG_FILTER.level}:{}),...(LOG_FILTER.text?{text:LOG_FILTER.text}:{})});
 const body=logBody(lines);

 $('#content').innerHTML=sections+`
  <div class="card full${liveClass(true)}"><h3>Log adapters
    <span class="chip">${escapeHtml(items.filter(o=>o.present).length)} of ${escapeHtml(items.length)}</span></h3>${cell(
   logSourceTabs(items)+logLimits(found.limits,items),'nervis')}</div>
  <div class="card full${liveClass(lines.present)}"><h3>${escapeHtml(LOG_SERVICE)}
    <span class="chip">${escapeHtml((lines.items||[]).length)} line(s)</span></h3>${cell(
   logFilters(lines)+body,'nervis')}
   <small class="mono dim"><b>This is the fourth source, not the first.</b> §11.3's ladder is
   structured event, management API, service log, then this — and a text log is never parsed when
   structured data already exists, so the Events screen is the one to reach for. <b>Secrets are
   blanked on the way out</b>, which is second best and honest about it: NERVIS does not write these
   files and cannot redact at the producer, so a secret is already on disk by the time it is read
   here — what this prevents is the screen and any export spreading it further. <b>Only the four
   documented files are read</b>; the same directory holds credentials, and a glob is how one of
   those reaches a screen.</small></div>`;
}

async function inspectorView(){
 heading('Diagnostics','One request through RAVIS, stage by stage.');
 const sections=`<div class="card full">${cell(diagSections(),'nervis')}</div>`;
 const list=await API.nervis.inspectorList();

 if(!INSPECT_ID){
  $('#content').innerHTML=sections+`<div class="card full${liveClass(list.live)}">
    <h3>Recent requests <span class="chip">${escapeHtml((list.items||[]).length)}</span></h3>${cell(
    contentSwitch(list.show_content)+(list.live?inspectorRows(list.items||[])
      :banner('RAVIS is not answering',escapeHtml(list.reason||'')+'.','warn')),'nervis')}
    <small class="mono dim"><b>Click a row to open it.</b> Every figure here is RAVIS's own — the
    decision it recorded and the attempts it made. <b>NERVIS adds nothing to it</b>: what RAVIS does
    not publish is shown as unpublished rather than filled in, because a stage list with honest gaps
    is a description of the missing surface and one with the gaps deleted is a screen that quietly
    redefines what an inspector is.</small></div>`;
  return;
 }

 const d=await API.nervis.inspectOne(INSPECT_ID);
 const back=`<button class="mode-chip" onclick="closeInspection()">← all requests</button>`;
 if(!d.live){
  /* `d.live` is false here, and the class reads it rather than the card simply

  $('#content').innerHTML=sections+`<div class="card full${liveClass(d.live)}"><h3>Request</h3>${cell(
   `<div class="filter-row">${back}</div>`+banner('That decision could not be read',
     escapeHtml(d.reason||'')+'.','warn'),'nervis')}</div>`;

 }
 $('#content').innerHTML=sections+inspectorDecisionCard(d,back,list.show_content)
  +`<div class="card full${liveClass(true)}"><h3>How it was executed</h3>${pathCard(d.path)}</div>
  <div class="card full${liveClass(true)}"><h3>Stages</h3>${cell(
   (d.stages||[]).map(stageRow).join(''),'nervis')}
   <small class="mono dim"><b>Credentials are never shown here</b>, and not because they are filtered
   out: the decision is copied field by field from a fixed list, so a field RAVIS adds later reaches
   no screen until somebody adds it deliberately. <b>Content follows the switch above</b> — and the
   only content NERVIS can ever show is its own, from requests it made itself.</small></div>
  <div class="card full${liveClass(true)}"><h3>Attempts</h3>${cell(
