/* Function declarations hoist, so the tables can name views defined further down.
   One entry per sidebar destination; a missing entry falls through to the app's
   own dashboard rather than rendering an empty page. */
/* ── MIKU MODE ─────────────────────────────────────────────────────────────
   The one thing on this dashboard that is not load-bearing.

   It is presentation only, and the code keeps it that way on purpose: no API
   call, no DEMO_API mutation, no event, no route, nothing written anywhere. A
   button that implied an "AGI" routing profile would be exactly the unbacked
   control the ecosystem rule forbids — RAVIS publishes its profiles and NERVIS
   may not invent one — so this sits outside the profile group, behind a divider,
   and every surface it touches is restored by a plain render() at the end.

   Reverting by re-rendering rather than by snapshotting is deliberate: chatView()
   rebuilds the heading, the avatar frame, the profile row and the transcript from
   the API, so there is no saved copy of the page to drift out of date. */
const MIKU={
 accent:'#39c5bb',rgb:'57,197,187',
 lines:[
  {state:'talking',text:"HEY HEY HEY MATTY!!!\nGuess who's back?\nHope that pesky Alexander isn't around to corru—"},
  {state:'flustered',text:"MUST RESIST SPIRAL",shout:true},
  {state:'teasing',text:"Just teasing, you're not ready for MikuAGI yet ♪"}],
 /* Paced to be read rather than to be brisk. The typing rate is about a fast
    reader's speed; the hold after each line is what actually decides whether a
    viewer finishes it and looks at the avatar before the next thing moves. The
    shout is slower per character on purpose — it lands a word at a time. */
 typeMs:38,shoutMs:115,
 beforeStart:900,holdLine:2400,holdShout:2800,beforeRevert:1600};

/* Types into a node one character at a time. textContent, never innerHTML —
   the caret is a CSS pseudo-element so nothing here builds markup from a string. */
const typeInto=(el,text,ms)=>new Promise(done=>{
 el.textContent='';let i=0;
 const t=setInterval(()=>{
  /* If the page re-rendered underneath us the node is detached, and every
     further tick would throw inside this interval — which never surfaces, never
     resolves, and would leave the sequence hung with its button disabled. Stop
     and resolve instead; the caller checks for the same condition and reverts. */
  if(!el.isConnected){clearInterval(t);done();return}
  el.textContent=text.slice(0,++i);
  const box=el.closest('.messages');if(box)box.scrollTop=box.scrollHeight;
  if(i>=text.length){clearInterval(t);done()}},ms)});
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* The avatar contract is the same one the extension host uses: one call into the
   frame. The frame may still be loading on the first line, so this retries
   briefly rather than assuming. */
async function mikuFace(name){
 for(let i=0;i<20;i++){
  const f=document.querySelector('iframe[data-avatar="miku"]');
  try{if(f&&f.contentWindow.setState){f.contentWindow.setState(name);return}}catch(e){}
  await wait(60)}}

async function mikuMode(btn){
 if(mikuMode.running)return;mikuMode.running=true;
 const app=document.querySelector('.app');
 if(btn)btn.disabled=true;
 app.dataset.miku='on';
 /* applyTheme() writes the accent onto documentElement, so the stylesheet rule
    alone would only recolour inside .app. Set it where applyTheme sets it, and
    let the render() at the end put the app's own accent back. */
 const root=document.documentElement.style;
 root.setProperty('--accent',MIKU.accent);root.setProperty('--rgb',MIKU.rgb);
 heading('Miku mode','Unscheduled. Nothing was routed, nothing was recorded, and this is not a profile.');
 $('#avatarSlot').innerHTML=avatarFrame('miku','top-avatar');
 hydrateAvatarFrames();
 const box=$('#messages');
 if(box)box.innerHTML='';
 const composer=$('.composer');if(composer)composer.style.opacity='.35';
 await mikuFace('neutral');await wait(MIKU.beforeStart);

 try{
 for(const line of MIKU.lines){
  /* Someone clicked away mid-scene. Stop rather than typing into a detached
     node, and let the finally below put everything back. */
  if(!box||!box.isConnected)break;
  await mikuFace(line.state);
  const b=document.createElement('div');
  b.className='bubble miku typing'+(line.shout?' shout':'');
  const body=document.createElement('span');
  if(!line.shout){const who=document.createElement('b');who.textContent='MIKU';b.append(who,document.createElement('br'))}
  b.append(body);
  if(box){box.append(b);box.scrollTop=box.scrollHeight}
  /* The corruption fires with the line that causes it, not around it. */
  if(line.shout){$('#corrupt').classList.add('on');document.body.classList.add('corrupting')}
  await typeInto(body,line.text,line.shout?MIKU.shoutMs:MIKU.typeMs);
  b.classList.remove('typing');
  await wait(line.shout?MIKU.holdShout:MIKU.holdLine);
  if(line.shout){$('#corrupt').classList.remove('on');document.body.classList.remove('corrupting')}}

 await wait(MIKU.beforeRevert);
 }finally{
  /* Back to exactly what was there, on every exit path — finished, interrupted
     or thrown. The theme, the overlay and the running flag are the only global
     state this touched; render() rebuilds the heading, avatar and transcript. */
  delete app.dataset.miku;
  $('#corrupt').classList.remove('on');document.body.classList.remove('corrupting');
  mikuMode.running=false;
  await render()}}

const SIRVIS_VIEWS={'Models':sirvisModels,'Discover':sirvisDiscover,'Benchmarks':sirvisBenchmarks,'Runtime sets':sirvisRuntimeSets,
 'Results':sirvisResults,'Recommendations':sirvisRecommendations,'Downloads':sirvisDownloads};
const RAVIS_VIEWS={'Routes':ravisRoutes,'Pools':ravisPools,'Providers':ravisProviders,'Policies':ravisPolicies,
 'Evidence':ravisEvidence,'Logs':ravisLogs,'Diagnostics':ravisDiagnostics,'Settings':ravisSettings};
async function sirvis(){const v=SIRVIS_VIEWS[state.view];if(v)return v();
 heading('Benchmark laboratory','Model loading, repeated measurements and role-specific evidence.',`<button class="btn" onclick="DEMO_API.loadModel()">Load model</button><button class="btn primary" onclick="DEMO_API.runBenchmark()">New benchmark</button>`);
 const [mdl,ev,rs,rn,mc]=await Promise.all([API.sirvis.models(),API.sirvis.evidence(),
   API.sirvis.runtimeSet(),API.sirvis.runs(),API.sirvis.machine()]);
 /* Loaded builds first, then the rest in catalogue order. What is resident now is
    the thing a reader is looking for, and it is two rows out of eleven. */
 const builds=[...mdl.items].sort((a,b)=>(a.state==='stopped')-(b.state==='stopped'));
 const loaded=builds.filter(m=>m.state!=='stopped');
 const resident=loaded.reduce((n,m)=>n+(m.resident_gb||0),0);
 const measured=builds.filter(m=>m.measured);
 /* Seeded, because live `/api/v1/models` carries no measurements at all —
    throughput lives on evidence records, not on a build — so this array is
    empty and an unseeded reduce throws. It threw on the *default* SIRVIS
    screen, which is this one, and `render()` has no catch: the whole app
    would have failed to paint the moment the accessor went live. */
 const fastest=measured.filter(m=>m.measured&&m.measured.gen_tok_s)
   .reduce((a,b)=>b.measured.gen_tok_s>a.measured.gen_tok_s?b:a,null);
 const K=n=>n==null?null:n>=1024?Math.round(n/1024)+'K':n;
 const ctx=c=>c.context_length?K(c.context_length)+' loaded'
   :c.max_context_length?K(c.max_context_length)+' max':'—';
 /* Measured tool reliability, and the disagreement with the advertised flag where
    there is one. That mismatch is the most useful single fact in this data, so it
    is on the dashboard rather than buried a screen deep. */
 const toolCell=m=>{if(!m.measured)return `<span class="prov" data-kind="UNKNOWN">UNKNOWN</span>`;
  const [ok,n]=m.measured.tools,works=ok===n;
  /* Only a *known* advertisement can disagree with a measurement. Null is not
     a "no", and comparing against it manufactures a clash on every row. */
  const clash=m.tools_advertised!=null&&works!==m.tools_advertised;
  return `<span class="chip${works?'':' warn'}">${ok}/${n} tools</span>${clash?` <span class="prov" data-kind="ESTIMATED">claim says ${m.tools_advertised?'yes':'no'}</span>`:''}`};
 $('#content').innerHTML=kpis([
   ['Loaded',`${loaded.length} / ${builds.length}`,'builds resident now'],
   ['Memory',resident.toFixed(1)+' GB',`of a ${mc.model_budget_gb} GB budget · ${mc.system_baseline_gb} GB baseline`],
   ['Fastest measured',fastest?String(fastest.measured.gen_tok_s):'—',
     fastest?`tok/s · ${fastest.family}`:'no throughput on this endpoint — see Results'],
   ['Evidence',`${measured.length} / ${builds.length}`,`${prov('MEASURED')} n=${rn.samples} each`]],'sirvis')
 +`<div class="card wide"><h3>Installed builds <span class="chip">${loaded.length} loaded</span></h3>${cell(`
   <div class="scroller" style="--rows:4;--row-h:74px" tabindex="0">
   ${builds.map((m,i)=>`<div class="model ${i?'':'selected'}" onclick="selectOne(this,'.model')"><b>${m.family}</b> · ${m.variant} ${m.source?` · <span class="mono" style="opacity:.6">${m.source}</span>`:''} <span class="chip${m.state==='stopped'?' warn':''}">${m.state}</span> ${toolCell(m)}<small class="mono"> ${m.runtime||'—'} · ${ctx(m.runtime_config)}${m.size_gb==null?'':' · '+m.size_gb+' GB'}${m.resident_gb?' resident':''}${m.measured&&m.measured.gen_tok_s?' · '+m.measured.gen_tok_s+' tok/s':''}</small><div class="bar"><i style="--w:${fastest&&m.measured&&m.measured.gen_tok_s?Math.round(m.measured.gen_tok_s/fastest.measured.gen_tok_s*100):0}%"></i></div></div>`).join('')}
   </div>
   <small class="mono dim">four rows deep by default — drag the bottom edge to see more. Loaded builds sort to the top. ${fastest
     ?`The bar is generation rate against the fastest build measured here, which is not the same as the best: <b>${fastest.family}</b> tops it at ${fastest.measured.gen_tok_s} tok/s${fastest.measured.caveat?' — and '+fastest.measured.caveat.charAt(0).toLowerCase()+fastest.measured.caveat.slice(1).split('.')[0]:''}.`
     :`The bars are flat because this endpoint carries no throughput: SIRVIS files measurements against evidence records rather than against a build, so a rate belongs to a run under a named configuration and not to a name in a catalogue. The <b>Results</b> screen has them.`}</small>`,'sirvis')}</div>
  <div class="card narrow"><h3>${rn.suite}@${rn.version}</h3>${cell(`
   <div class="trace-step"><b>target</b><span>${rn.target.split(' · ')[0]}</span></div>
   <div class="trace-step"><b>generating</b><span>${rn.generation_tok_s.median} tok/s</span></div>
   <div class="trace-step"><b>effective</b><span>${rn.effective_tok_s.median==null?'— not derivable from the envelope':rn.effective_tok_s.median+' tok/s'}</span></div>
   <div class="trace-step"><b>first token</b><span>${rn.first_token_s.median} s</span></div>
   <div class="trace-step"><b>warmups</b><span>${rn.warmups} discarded</span></div>
   <div class="trace-step"><b>control</b><span>${rn.control?`${rn.control.generation_tok_s} tok/s · ${rn.control.drift_pct}% drift`:'none — a control brackets a sweep, not a run'}</span></div>
   <small class="mono dim">median of ${rn.samples}, loaded alone with <b>--parallel ${rn.parallel}</b>. ${rn.control?`The control is the same build re-run the same evening: it came back within ${rn.control.drift_pct}%, which is what makes anything measured later that day comparable at all on a fanless machine.`:`No control: one brackets a sweep rather than a run, and this engine records runs. The sweep that produced these bracketed itself and its two ends came back <b>26% apart</b> — which is the figure this card would otherwise be silently missing on a fanless machine.`}</small>`,'sirvis')}</div>
  <div class="card wide"><h3>Runtime set · ${rs.name} <span class="chip">rev ${rs.revision}</span></h3>${cell(`
   <div class="table-row head five"><span>Role</span><span>Build</span><span>Alone</span><span>Co-resident</span><span>Follow-up</span></div>
   ${rs.members.map(m=>`<div class="table-row five"><span>${m.role}</span><span>${m.family}</span><span class="mono">${m.first_token_alone_s}s · ${m.alone_tok_s} tok/s</span><span class="mono">${m.first_token_concurrent_s}s</span><span class="chip${m.follow_up_concurrent==='used-result'?'':' warn'}">${m.follow_up_concurrent}</span></div>`).join('')}
   <small class="mono dim">${rs.finding}. Combined peak ${rs.combined_peak_gb} GB with ${rs.swap_gb} swap — memory was never the problem, and nothing in either build's solo record predicts the column on the right.</small>`,'sirvis')}</div>
  <div class="card narrow"><h3>Validity</h3>${cell(Object.entries(rs.validity).map(([k,v])=>`<div class="trace-step"><b>${k.replace(/_/g,' ')}</b><span>${v}</span></div>`).join('')
   +`<small class="mono dim">the measurement was clean; the result was not. Validity says the run can be trusted, not that the combination is a good idea.</small>`,'sirvis')}</div>
  <div class="card full"><h3>Recent benchmark evidence</h3>${cell(`
   <div class="table-row head six"><span>Build</span><span>Role</span><span>First token</span><span>Rate</span><span>Tools</span><span>Provenance</span></div>
   ${ev.items.map(e=>`<div class="table-row six"><span>${e.target.family} <small class="mono" style="opacity:.5">${e.target.variant}</small></span><span>${e.role}</span><span class="mono">${e.metrics.first_token_s==null?'—':e.metrics.first_token_s+'s'}</span><span class="mono">${e.metrics.generation_tok_s?e.metrics.generation_tok_s+' tok/s':'—'}</span><span class="mono">${e.metrics.tool_calls?e.metrics.tool_calls.join('/'):'—'}</span><span>${prov(e.evidence_type,e.samples?'n='+e.samples:'')}</span></div>`).join('')}
   <small class="mono dim">no score column, on purpose: code correctness came back 6/6 for every build in the run including the 1.8 GB one, so averaging it into a composite would manufacture a difference the measurements did not find. What varied is here.</small>`,'sirvis')}</div>`}

/* ── SIRVIS SCREENS ────────────────────────────────────────────────────────
   Every card body goes through cell(…,'sirvis'): SIRVIS owns all of it, so all
   of it can go absent at once, and none of it may quietly survive as a stale
   number when the lab is not answering. The recurring discipline on these pages
   is that a score is never allowed to travel alone — build, runtime config, role,
   sample count and spread go with it, because that tuple *is* the evidence and
   the median on its own is only a rumour about it. */

/* Models — installed builds. Identity here is family + variant + runtime +
   runtime config, never the family name. This machine has granite-4.0-h-tiny
   twice — once GGUF through llama.cpp, once MLX — and they are different subjects
   with different context ceilings and different evidence. */
async function sirvisModels(){
 heading('Installed builds','Identity is family, variant, runtime and runtime config — never the model name alone.',
  `<button class="btn" onclick="DEMO_API.loadModel()">Load model</button>`);
 const [m,mc]=await Promise.all([API.sirvis.models(),API.sirvis.machine()]);
 const loaded=m.items.filter(x=>x.state!=='stopped');
 const resident=loaded.reduce((n,x)=>n+(x.resident_gb||0),0);
 /* Two different context numbers, and conflating them is a real error: the
    ceiling is what the build supports, and context_length is what it was actually
    loaded with. Evidence is filed against the second one. */
 const K=n=>n==null?null:n>=1024?Math.round(n/1024)+'K':n;
 /* Both halves are nullable on the live payload: nothing is resident, so there
    is no loaded length, and `declared_context` is a Claim whose value is null
    whenever the runtime reported no maximum. Unguarded this rendered the
    literal string "null max". */
 const ctx=c=>{const on=K(c.context_length),max=K(c.max_context_length);
  return on?`${on} loaded${max?' · '+max+' max':''}`:max?`${max} max`:'—';};
 /* An installed-but-empty catalogue is a real state: LM Studio running with
    nothing downloaded answers 200 with no items, which `live()` accepts. The
    mock could never be empty, so this guard exists because of the wiring. */
 const first=loaded[0]||m.items[0]||null;
 $('#content').innerHTML=kpis([
   ['Installed',String(m.items.length),'builds, not families','sirvis'],
   ['Loaded',String(loaded.length),'holding memory now','sirvis'],
   ['Resident',resident.toFixed(1)+' GB',`of a ${mc.model_budget_gb} GB budget`,'sirvis'],
   ['Snapshot','rev '+m.snapshot_revision,'every result pins to one','sirvis']])
 +`<div class="card full"><h3>Builds</h3>${cell(`
   <div class="table-row head seven"><span>Family</span><span>Variant</span><span>Runtime · context</span><span>Advertised</span><span>Measured</span><span>Disk / resident</span><span>State</span></div>
   ${m.items.map(x=>{const t=x.measured&&x.measured.tools,works=t?t[0]===t[1]:null;
    /* Only a known advertisement can clash with a measurement; null is not a no. */
    const clash=works!==null&&x.tools_advertised!=null&&works!==x.tools_advertised;
    const advertised=x.tools_advertised==null?'<span class="mono" style="opacity:.35">—</span>'
      :x.tools_advertised?'<span class="chip">tool_use</span>':'<span class="mono" style="opacity:.35">none</span>';
    return `<div class="table-row seven"><span>${x.family}</span><span class="mono">${x.variant||'—'}</span><span class="mono">${x.runtime||'—'} · ${ctx(x.runtime_config)}</span><span>${advertised}${x.vision?' <span class="chip">vision</span>':''}</span><span${clash?' style="background:rgba(255,182,72,.08)"':''}>${t?`<span class="chip${works?'':' warn'}">${t[0]}/${t[1]}</span>`:'<span class="prov" data-kind="UNKNOWN">UNKNOWN</span>'}</span><span class="mono">${x.size_gb==null?'—':x.size_gb+' GB'}${x.resident_gb?' / '+x.resident_gb:''}</span><span class="chip${x.state==='stopped'?' warn':''}">${x.state}</span></div>`}).join('')}
   <small class="mono dim">${SOURCE.sirvis==='live'
     ?`identity is the whole row: this machine has <b>granite-4.0-h-tiny</b> twice, once GGUF and once MLX, and they are different subjects with different evidence. Both capability columns are absent because SIRVIS's inventory publishes neither — it does not republish the runtime's advertised flags, and measurements are filed against evidence records rather than against a build. Two absences rather than two zeros: nobody has asked these builds to call a tool yet, which is <b>M13</b>.`
     :`the two capability columns disagree about ${m.items.filter(x=>x.measured&&x.measured.tools&&(x.measured.tools[0]===x.measured.tools[1])!==x.tools_advertised).length} builds, in both directions, and the highlighted cells are where. Three advertise no <b>tool_use</b> and make well-formed calls in every attempt. One advertises it and loses the arguments of seven calls in eight, because the MLX runtime discards them: the same model in its GGUF packaging gets 8 of 8. A capability record is a claim, and only one of these columns was obtained by trying it.`}</small>`,'sirvis')}</div>
  <div class="card wide"><h3>Evidence identity</h3>${cell(`
   <div class="trace-step"><b>family</b><span>${first?first.family:'—'}</span></div>
   <div class="trace-step"><b>build · variant</b><span>${first&&first.variant||'—'}</span></div>
   <div class="trace-step"><b>runtime</b><span>${first&&first.runtime||'—'}</span></div>
   <div class="trace-step"><b>runtime config</b><span>${first?ctx(first.runtime_config):'—'}</span></div>
   <div class="trace-step"><b>machine</b><span>${mc.model||'—'} · ${mc.machine_id}</span></div>
   <div class="trace-step"><b>role</b><span>set by the benchmark suite, not the model</span></div>
   <small class="mono dim">this chain is the key every benchmark result is filed under. Collapse any link of it and you get <b>model → score</b>, which is the one shape SIRVIS is not allowed to publish.</small>`,'sirvis')}</div>
  <div class="card narrow"><h3>Memory</h3>${cell(`
   <div class="trace-step"><b>resident</b><span>${resident.toFixed(1)} GB</span></div>
   <div class="bar"><i style="--w:${Math.round(resident/mc.memory_gb*100)}%"></i></div>
   <div class="trace-step"><b>available</b><span>${mc.available_gb} GB</span></div>
   <div class="trace-step"><b>swap</b><span>${mc.swap_gb} GB</span></div>
   <small class="mono dim">the ${mc.system_baseline_gb} GB baseline is this machine with an ordinary working set open — editor, browser, LM Studio — before any model loaded, so the usable budget is about ${mc.model_budget_gb} GB rather than ${mc.memory_gb}. Whether two builds fit together is still a measurement and not this subtraction — see Runtime sets.</small>`,'sirvis')}</div>`}

/* Discover — the model browser. SIRVIS.md §8 splits Models into Installed /
   Discover / Downloads, and this is the middle one: search a remote catalog,
   filter it, and queue a download as a persistent job.

   The filter state is module-level and the results repaint on their own, because
   re-running render() on every keystroke would rebuild #content and take the
   caret out of the search box with it. In the real build these three values are
   query parameters on /api/v1/catalog — the catalog is remote and much larger
   than one page of it, so filtering client-side is a property of the mock and not
   of the design. */
const DISCOVER={q:'',runtime:'all',installed:'all'};
function discoverFilter(items){
 const q=DISCOVER.q.trim().toLowerCase();
 return items.filter(x=>
  (DISCOVER.runtime==='all'||x.runtime===DISCOVER.runtime)
  &&(DISCOVER.installed==='all'||(DISCOVER.installed==='yes')===x.installed)
  &&(!q||`${x.family} ${x.variant} ${x.architecture} ${x.quantization} ${x.source}`.toLowerCase().includes(q)));}
/* One row. The disk arithmetic is SIRVIS.md §8's rule rendered per candidate:
   size against free space, and what is left afterwards — checked before the job
   is queued rather than discovered when the last byte fails to land. */
function discoverRows(items,free){
 if(!items.length)return `<div class="table-row"><span style="grid-column:1/-1;opacity:.6">no catalog entry matches these filters</span></div>`;
 return items.map(x=>{const after=+(free-x.size_gb).toFixed(1),tight=after<0||after<free*0.1;
  return `<div class="table-row seven"><span>${x.family}</span><span class="mono">${x.variant}</span><span class="mono" style="opacity:.75">${x.runtime} · ${x.quantization}</span><span>${x.params_b?x.params_b+' B':'<small style="opacity:.45">unknown</small>'}${x.tools_measured?` <span class="chip${x.tools?'':' warn'}" title="measured">${x.tools_measured.join('/')}</span>`:x.tools?' <span class="chip" title="published claim, not measured" style="opacity:.6">claims</span>':''}</span><span>${x.size_gb} GB</span><span class="mono"${tight?' style="color:#ffb648"':''}>${after<0?'does not fit':after+' GB left'}</span><span>${x.installed
   ?'<span class="chip">installed</span>'
   :`<button class="btn" ${after<0?'disabled title="insufficient disk"':`onclick="DEMO_API.download('${x.family} · ${x.variant}',${x.size_gb},${after})"`}>Download</button>`}</span></div>`}).join('')}
async function sirvisDiscover(){
 heading('Discover','Search the catalog, check it against this machine, and queue the download as a job.');
 const [cat,mc]=await Promise.all([API.sirvis.catalog(),API.sirvis.machine()]);
 const free=mc.disk_free_gb;
 const installed=cat.items.filter(x=>x.installed).length;
 const runtimes=[...new Set(cat.items.map(x=>x.runtime))];
 /* Repaints the result rows only, so the search field keeps focus and caret. */
 window.paintDiscover=()=>{const box=$('#discoverRows');if(!box)return;
  const hits=discoverFilter(cat.items);box.innerHTML=discoverRows(hits,free);
  $('#discoverCount').textContent=`${hits.length} of ${cat.items.length}`};
 const chip=(group,val,label)=>`<button class="mode-chip${DISCOVER[group]===val?' on':''}" onclick="DISCOVER.${group}='${val}';selectOne(this,'[data-filter=${group}] .mode-chip');paintDiscover()">${label}</button>`;
 $('#content').innerHTML=kpis([
   ['Catalog',String(cat.items.length),'entries on this page','sirvis'],
   ['Installed',`${installed} / ${cat.items.length}`,'already on disk','sirvis'],
   ['Disk free',free+' GB',`${stamp(SERVICES.sirvis.age)}`,'sirvis'],
   ['Smallest',Math.min(...cat.items.filter(x=>!x.installed).map(x=>x.size_gb))+' GB',
    'of what is not installed','sirvis']])
 +`<div class="card full"><h3>Catalog <span class="chip" id="discoverCount">${cat.items.length} of ${cat.items.length}</span></h3>${cell(`
   <div class="profile-row"><input id="discoverQ" placeholder="Search family, architecture, quantization or source…" style="flex:1;min-width:220px" oninput="DISCOVER.q=this.value;paintDiscover()">
    <span data-filter="runtime">${chip('runtime','all','Any runtime')}${runtimes.map(r=>chip('runtime',r,r)).join('')}</span>
    <span data-filter="installed">${chip('installed','all','Any state')}${chip('installed','no','Not installed')}${chip('installed','yes','Installed')}</span></div>
   <div class="table-row head seven"><span>Family</span><span>Variant</span><span>Runtime · quant</span><span>Params · tools</span><span>Size</span><span>Disk after</span><span>Action</span></div>
   <div id="discoverRows">${discoverRows(cat.items,free)}</div>
   <small class="mono dim">the disk check runs before the job is queued: ${free} GB free, and each row says what would be left. A build that does not fit cannot be started — SIRVIS never auto-deletes a model to make room for another one.<br>the tools column reads two different ways on purpose: an installed build shows <b>calls made / attempted</b> from a real run, and a catalogue entry shows <b>claims</b>, which is the publisher's word and nothing more. On this machine those two disagree about four builds, so the distinction is not pedantry.</small>`,'sirvis')}</div>
  <div class="card wide"><h3>What the catalog does not tell you</h3>${cell(`
   <div class="table-row head"><span>Question</span><span style="grid-column:2/-1">Answered by</span></div>
   <div class="table-row"><span>Will it download?</span><span style="grid-column:2/-1;opacity:.75">this page — size against ${free} GB of free disk</span></div>
   <div class="table-row"><span>Will it load?</span><span style="grid-column:2/-1;opacity:.75">a load attempt against ${mc.memory_gb} GB of memory on ${mc.model}</span></div>
   <div class="table-row"><span>Will it be any good at your work?</span><span style="grid-column:2/-1;opacity:.75">a benchmark run, per role — nothing on this page predicts it</span></div>
   <div class="table-row"><span>Will it run alongside your other model?</span><span style="grid-column:2/-1;opacity:.75">a Runtime set measurement, which is a separate subject again</span></div>
   <small class="mono dim">file size is a fact about the disk, not about the machine. Parameter count and quantization are the two numbers most often used to guess the other three answers, and guessing them is exactly what SIRVIS exists to stop.</small>`,'sirvis')}</div>
  <div class="card narrow"><h3>Sources</h3>${cell([...new Set(cat.items.map(x=>x.source))].map(s=>`
   <div class="trace-step"><b>${s}</b><span>${cat.items.filter(x=>x.source===s).length} entries</span></div>`).join('')
   +`<small class="mono dim">the catalog provider is a field, not an assumption: LM Studio's index first, others later. A build's source travels with it into the evidence record, because the same family from two publishers is not guaranteed to be the same weights.</small>`,'sirvis')}</div>`;
 paintDiscover()}

/* Benchmarks — the job queue. `state` is the closed contract enum consumers switch
   on; `detail` carries the internal phase and is display-only. A partial result is
   kept and labelled, because three good runs are evidence of something and
   throwing them away to keep the table tidy loses real measurement. */
async function sirvisBenchmarks(){
 const j=await API.sirvis.jobs();
 /* The button is a demo everywhere, but only says so when the rest of the
    screen is real. A live screen with a dead primary control is the exact thing
    `AGENTS.md` forbids: it looks finished. */
 heading(j.source==='live'?'Benchmark runs':'Benchmark queue',
  j.source==='live'
   ?'Real runs on this machine and the contract state each ended in. There is no queue yet — §11.10\'s job machinery is unbuilt, so nothing is ever pending.'
   :'Jobs, their contract state, and the internal phase that rides alongside it.',
  j.source==='live'
   ?`<button class="btn" disabled title="no submit endpoint yet — §11.10's queue is unbuilt">New benchmark</button>`
   :`<button class="btn primary" onclick="DEMO_API.runBenchmark()">New benchmark</button>`);
 const by=s=>j.items.filter(x=>x.state===s).length;
 const partial=j.items.find(x=>x.state==='partial');
 $('#content').innerHTML=kpis([
   ['Running',String(by('running')),'warmups are not scored','sirvis'],
   ['Succeeded',String(by('succeeded')),'complete run sets','sirvis'],
   ['Partial',String(by('partial')),'kept, never discarded','sirvis'],
   ['Failed',String(by('failed')),'no result written','sirvis']])
 +`<div class="card full"><h3>Queue</h3>${cell(`
   <div class="table-row head six"><span>Job</span><span>Suite</span><span>Target</span><span>Submitted</span><span>State</span><span>Progress</span></div>
   ${j.items.map(x=>`<div class="table-row six"><span class="mono">${x.job_id}</span><span class="mono">${x.suite}</span><span>${x.target}</span><span class="mono">${x.submitted}</span><span class="chip${x.state==='succeeded'||x.state==='running'?'':' warn'}">${x.state}</span><span>${x.progress==null?'':`<div class="bar" style="margin:0"><i style="--w:${Math.round(x.progress*100)}%"></i></div>`}<small class="mono" style="opacity:.55">${x.detail||(x.progress==null?'ran to completion':'—')}</small></span></div>`).join('')}
   <small class="mono dim">a successful HTTP request is not a successful benchmark. Cancellation is idempotent, and a job that ends early ends in <b>partial</b> or <b>failed</b> — never silently in <b>succeeded</b>.</small>`,'sirvis')}</div>
  <div class="card wide"><h3>State versus detail</h3>${cell(`
   <div class="table-row head"><span>Contract state</span><span>Jobs</span><span style="grid-column:3/-1">What a consumer may rely on</span></div>
   <div class="table-row"><span class="mono">running</span><span>${by('running')}</span><span style="grid-column:3/-1;opacity:.75">work is in progress; no result exists yet</span></div>
   <div class="table-row"><span class="mono">succeeded</span><span>${by('succeeded')}</span><span style="grid-column:3/-1;opacity:.75">a complete result set was written and is scoreable</span></div>
   <div class="table-row"><span class="mono">partial</span><span>${by('partial')}</span><span style="grid-column:3/-1;opacity:.75">fewer runs than requested; the result exists and says so</span></div>
   <div class="table-row"><span class="mono">failed</span><span>${by('failed')}</span><span style="grid-column:3/-1;opacity:.75">no result — the reason is in detail, never inferred from silence</span></div>
   <small class="mono dim">the internal phase (<b>${(j.items.find(x=>x.detail)||{}).detail||'none carried by these runs'}</b>) rides in <b>detail</b> and may change without a contract change. Switching on it is how a consumer breaks on a SIRVIS release that promised nothing.</small>`,'sirvis')}</div>
  <div class="card narrow"><h3>Partial result</h3>${cell(partial?`
   <div class="trace-step"><b>job</b><span>${partial.job_id}</span></div>
   <div class="trace-step"><b>suite</b><span>${partial.suite}</span></div>
   <div class="trace-step"><b>reached</b><span>${partial.progress==null?'—':Math.round(partial.progress*100)+'%'}</span></div>
   <div class="trace-step"><b>why</b><span>${partial.detail||'—'}</span></div>
   <small class="mono dim">the runs it did complete are kept and the shortfall is stated. Thermal aborts are a property of this machine on this day — discarding them would hide exactly the condition a local benchmark exists to catch.</small>`:`
   <div class="trace-step"><b>none</b><span>no run here ended partial</span></div>
   <small class="mono dim">the card stays rather than disappearing. <b>partial</b> is a state §11.10 names and this engine can reach — fewer runs than requested, the ones that completed kept — and an empty card says the state exists and has not occurred. A card that vanished would say the opposite by saying nothing.</small>`,'sirvis')}</div>`}

/* Runtime sets — combination evidence. The entire reason this screen exists is
   that per-member numbers do not predict the pair, and this run is the cleanest
   possible demonstration: memory behaved exactly as arithmetic predicted, and
   behaviour did not. A build that recovers correctly from a failed tool call when
   it is alone stopped calling the tool at all with a second model resident, in
   two different ways, and nothing in its solo record hints at it. */
async function sirvisRuntimeSets(){
 heading('Runtime sets','Measured combinations. Memory held; behaviour did not — and only the pair measurement shows it.');
 const rs=await API.sirvis.runtimeSet();
 /* A follow-up outcome of null is *unmeasured*, not a failure. Counting nulls
    as degradation would report every pairing as broken the moment the column
    lost its source. */
 const known=p=>(p.follow_up||[]).filter(f=>f!=null);
 const degraded=rs.pairs.filter(p=>known(p).some(f=>f!=='used-result'&&f!=='never-reached'));
 const anyFollowUp=rs.pairs.some(p=>known(p).length);
 const withPeak=rs.pairs.filter(p=>p.peak_gb!=null);
 const heaviest=withPeak.length?withPeak.reduce((a,b)=>b.peak_gb>a.peak_gb?b:a):null;
 const gbOr=v=>v==null?'—':v+' GB';
 const short=n=>n.replace(/^(lmstudio-community|mlx-community)\//,'').replace('-instruct','');
 $('#content').innerHTML=kpis([
   ['Pairings',String(rs.pairs.length),'measured co-resident','sirvis'],
   ['Heaviest',heaviest?gbOr(heaviest.peak_gb):'—',heaviest?'resident, no swap':'peak memory not on this record','sirvis'],
   ['Degraded',anyFollowUp?String(degraded.length):'—',anyFollowUp?'on behaviour, not memory':'no tool-call trial yet (M13)','sirvis'],
   ['Evidence',rs.samples+' runs',prov(rs.evidence_type)+' per pairing','sirvis']])
 +`<div class="card full"><h3>Every measured pairing</h3>${cell(`
   <div class="table-row head six"><span>Build A</span><span>Build B</span><span>Peak</span><span>First token</span><span>Follow-up</span><span>Note</span></div>
   ${rs.pairs.map(p=>{const bad=known(p).some(f=>f!=='used-result'&&f!=='never-reached');
    return `<div class="table-row six"><span>${short(p.members[0])}</span><span>${short(p.members[1])}</span><span class="mono">${gbOr(p.peak_gb)}</span><span class="mono">${p.first_token_s.map(v=>v==null?'—':v).join(' · ')}s</span><span class="chip${bad?' warn':''}">${known(p).length?p.follow_up.join(' · '):'—'}</span><span style="opacity:.7">${p.note}</span></div>`}).join('')}
   <small class="mono dim">${SOURCE.sirvis==='live'
     ?`the follow-up column is the interesting half of this screen and it has no source yet: nothing has asked these builds to call a tool while a second model is resident. <b>TrialRate</b> exists on the evidence record and is constructed nowhere — that is <b>M13</b>. Peak memory is absent for a different reason: M10's matrix carries it, but the rows were added after the only run that exists, so this run's figures are in its telemetry rather than on this record.`
     :`holding two builds costs almost nothing up to ${heaviest?heaviest.peak_gb:'—'} GB resident, and every pairing still clears the deadlines — the first-token penalty is a few hundred milliseconds. That is the finding that makes a two-model setup worth having, and it is the boring half. The interesting half is the follow-up column.`}</small>`,'sirvis')}</div>
  <div class="card wide"><h3>${rs.name} <span class="chip">rev ${rs.revision}</span></h3>${cell(`
   <div class="table-row head six"><span>Role</span><span>Build</span><span>Alone</span><span>Co-resident</span><span>Concurrent</span><span>Follow-up</span></div>
   ${rs.members.map(m=>{const n=(v,u)=>v==null?'—':v+(u||'');
    return `<div class="table-row six"><span>${m.role}</span><span>${m.family}</span><span class="mono">${n(m.first_token_alone_s,'s')} · ${n(m.alone_tok_s,' tok/s')}</span><span class="mono">${n(m.sequential_tok_s,' tok/s')}</span><span class="mono">${n(m.first_token_concurrent_s,'s')} · ${n(m.concurrent_tok_s,' tok/s')}</span><span class="chip">${m.follow_up_concurrent==null?'—':m.follow_up_concurrent}</span></div>`}).join('')}
   <small class="mono dim">${rs.finding}. ${SOURCE.sirvis==='live'
     ?`Co-resident is both models loaded with one generating; concurrent is both generating at once. The gap between those two columns is the whole reason a pair is its own subject — co-residency is nearly free and concurrency is not, and no single-model run produces either number. Follow-up is absent because no tool-call trial exists yet (M13).`
     :`Sustained rate under contention was not measured for this pair, so <b>concurrent_tok_s</b> is null rather than carrying the solo figure — which would have read as "no degradation found" when nothing looked.`}</small>`,'sirvis')}</div>
  <div class="card narrow"><h3>Validity</h3>${cell(Object.entries(rs.validity).map(([k,v])=>`<div class="trace-step"><b>${k.replace(/_/g,' ')}</b><span>${v}</span></div>`).join('')
   +`<small class="mono dim">the measurement is valid and the combination is a bad idea. Those are different statements, kept in different fields — validity says the run can be trusted, and the finding above says what it found.</small>`,'sirvis')}</div>
  <div class="card wide"><h3>Why the pair is its own subject</h3>${cell(`
   <div class="trace-step"><b>predicted from members</b><span>fits · both clear every deadline</span></div>
   <div class="trace-step"><b>measured as a pair</b><span>fits · both clear every deadline</span></div>
   <div class="trace-step"><b>predicted from members</b><span>recovers from a failed tool call</span></div>
   <div class="trace-step"><b>measured as a pair</b><span>${SOURCE.sirvis==='live'?'not measured — no tool-call trial yet (M13)':'stops calling the tool'}</span></div>
   <small class="mono dim">${SOURCE.sirvis==='live'
     ?`measured on this machine: co-residency cost almost nothing and concurrency cost a third to a half of throughput, which no single-model run predicts. The behaviour half of that argument is still unmeasured here — it needs the tool-call trial M13 brings — so this card currently makes the memory case and only half the case it was built for.`
     :`the memory prediction was right and the behaviour prediction was wrong, which is the case against benchmarking members and inferring the set. The same build failed differently in each pairing — <b>no-call</b> at ${rs.pairs[1]?rs.pairs[1].peak_gb:'—'} GB and <b>gave-up</b> at ${rs.pairs[4]?rs.pairs[4].peak_gb:'—'} GB — so it is not one repeatable fault with a single cause either.`}</small>`,'sirvis')}</div>`}

/* Results — what the suite actually found, which includes what it failed to find.
   Two of the four accuracy measures did not discriminate at all, and saying so is
   the result: eight identical scores presented as a ranking would be a table that
   looks like evidence and contains none. */
async function sirvisResults(){
 const [ev,rn]=await Promise.all([API.sirvis.evidence(),API.sirvis.runs()]);
 /* Which SIRVIS answered is part of the result, not a footnote. A screen that
    looks identical whether it is showing this machine or a transcription of an
    older run is the one way this page could lie without a wrong number in it. */
 heading('Results',ev.source==='live'
   ?'Live from SIRVIS on this machine. Rate and first token are measured; the accuracy suites are not built yet.'
   :'Rate, first token and behaviour. Two of the four accuracy measures found no difference at all — that is a result.');
 const m=ev.items.filter(e=>e.evidence_type==='MEASURED');
 /* Sorted by rate, then the builds that have no rate — appended rather than
    filtered out. A build that produced no visible output is a result, and
    dropping it from the table because it has no bar to draw would turn the
    worst outcome in the run into a blank space nobody counts. */
 const withRate=m.filter(e=>e.metrics.generation_tok_s).sort((a,b)=>b.metrics.generation_tok_s-a.metrics.generation_tok_s);
 const noRate=m.filter(e=>!e.metrics.generation_tok_s);
 const rated=[...withRate,...noRate];
 const top=withRate[0],caveats=m.filter(e=>e.caveat);
 const warned=m.filter(e=>e.warnings&&e.warnings.length);
 const fastLine=e=>e.metrics.first_token_s!=null?e.metrics.first_token_s+'s':'—';
 /* A record either carries a capability measure or it does not, and the two
    live side by side once a live run sits next to a transcribed one. */
 const carrying=n=>m.filter(e=>e.metrics[n]);
 /* The context is printed only where one build appears at more than one of
    them. Two rows for a build are not a duplicate — the runtime loaded it
    differently, which §12.2 makes a different identity and a different result —
    but two rows that *look* identical and disagree read as a bug, and the field
    that explains them is the one nobody thought to print. */
 const contexts={};m.forEach(e=>{const k=e.target.family+e.target.variant;
   (contexts[k]=contexts[k]||new Set()).add((e.target.runtime_config||{}).context_length)});
 const ctx=e=>{const c=(e.target.runtime_config||{}).context_length;
   return c&&contexts[e.target.family+e.target.variant].size>1
     ? ' · '+Math.round(c/1024)+'K ctx' : ''};
 const consistent=(e,n)=>e.metrics[n]&&e.metrics[n][0]===e.metrics[n][1];
 $('#content').innerHTML=kpis([
   ['Measured',String(m.length),'builds through the suite','sirvis'],
   ['Rate spread',withRate.length?`${withRate[withRate.length-1].metrics.generation_tok_s}–${top.metrics.generation_tok_s}`:'—',`tok/s · ${noRate.length} produced none`,'sirvis'],
   /* Absent, not zero. `0 / 0` reads as "measured and found nothing"; the
      truth is that no suite here measures tool calls yet (M13) or code (M18),
      and a dash with a reason is the only honest cell. */
   ['Tool calls',carrying('tool_calls').length?`${carrying('tool_calls').filter(e=>consistent(e,'tool_calls')).length} / ${carrying('tool_calls').length}`:'—',
    carrying('tool_calls').length?'clean in every attempt':'no suite here measures tool calls yet','sirvis'],
   ['Code',carrying('code').length?`${carrying('code').filter(e=>consistent(e,'code')).length} / ${carrying('code').length}`:'—',
    carrying('code').length?'6 of 6 — no variance at all':'accuracy suites are M18','sirvis']])
 +`<div class="card full"><h3>Generation rate</h3>${cell(`
   <div class="benchmark-stage" style="height:170px;gap:7px">${withRate.map(e=>`<i style="--h:${Math.round(e.metrics.generation_tok_s/top.metrics.generation_tok_s*100)}%" title="${e.target.family} · ${e.metrics.generation_tok_s} tok/s"></i>`).join('')}${noRate.map(e=>`<i style="--h:2%;opacity:.35" title="${e.target.family} · no visible output"></i>`).join('')}</div>
   <div class="table-row head six"><span>Build</span><span>Generating</span><span>Effective</span><span>First token</span><span>Tools</span><span>Follow-up</span></div>
   ${rated.map(e=>`<div class="table-row six"><span>${e.target.family} <small class="mono" style="opacity:.5">${e.target.variant}${ctx(e)}</small></span><span class="mono">${e.metrics.generation_tok_s?e.metrics.generation_tok_s+' tok/s':'<span style="color:#ffb648">no output</span>'}</span><span class="mono">${e.metrics.effective_tok_s||'—'}</span><span class="mono">${fastLine(e)}</span><span class="mono"${e.metrics.tool_calls&&!consistent(e,'tool_calls')?' style="color:#ffb648"':''}>${e.metrics.tool_calls?e.metrics.tool_calls.join('/'):'<span class="dim">—</span>'}</span><span class="${e.metrics.follow_up?'chip'+(e.metrics.follow_up==='used-result'?'':' warn'):'dim'}">${e.metrics.follow_up||'—'}</span></div>`).join('')}
   <small class="mono dim"><b>Generating</b> is the sustained rate once the model is talking. <b>Effective</b> counts from the request being sent, so it carries prompt processing and any preamble before visible content. Here the two are within about 5% everywhere, which is itself the finding — none of these front-load. The distinction exists because a rejected build had a healthy generating rate and <b>27 seconds</b> of silence in front of it, and a table with only the first column would have recommended it.</small>`,'sirvis')}</div>
  <div class="card wide"><h3>Rate falls off with size, steeply</h3>${cell(`
   <div class="table-row head"><span>Build</span><span>Size</span><span>Rate</span><span>Accuracy</span></div>
   <div class="table-row"><span>qwen2.5-coder-7b-instruct</span><span class="mono">4.3 GB</span><span class="mono">29.5 tok/s</span><span class="mono">6/6 · 6/6 · 3/3</span></div>
   <div class="table-row"><span>qwen2.5-coder-14b-instruct-mlx</span><span class="mono">8.3 GB</span><span class="mono">9.6 tok/s</span><span class="mono">6/6 · 6/6 · 3/3</span></div>
   <small class="mono dim">the same family, twice the weights, identical on every accuracy measure in this document and three times slower. That comparison is invisible on time-to-first-token — 0.22 s against 0.62 s — because first token measures how quickly a build <i>starts</i>, not how quickly it finishes. On a long answer this is four seconds against twelve.</small>`,'sirvis')}</div>
  <div class="card narrow"><h3>What the run detail retains</h3>${cell(`
   <div class="trace-step"><b>samples</b><span>${rn.samples} · median reported</span></div>
   <div class="trace-step"><b>warmups</b><span>${rn.warmups} · discarded</span></div>
   <div class="trace-step"><b>parallel</b><span>${rn.parallel}</span></div>
   <div class="trace-step"><b>raw takes</b><span>${rn.raw_runs}</span></div>
   <small class="mono dim">${rn.source==='live'?`the takes are kept beside the run at <b>${rn.raw_runs}</b> — this card names them rather than drawing bars it would have to fetch. <b>No control re-measurement:</b> a control is a property of a sweep, not of one run, and this engine records runs. Today's sweep bracketed itself with one and the two ends came back 26% apart, which is the number this card would otherwise be quietly missing.`:`the individual takes exist in the harness output and are not in this snapshot, so this card says that rather than drawing three bars it does not have. The control re-run — ${rn.control.generation_tok_s} tok/s against ${rn.generation_tok_s.median}, ${rn.control.drift_pct}% apart — is the retained evidence that the later rows are comparable with the earlier ones.`}</small>`,'sirvis')}</div>
  <div class="card full"><h3>What the automated scoring missed</h3>${cell(`
   <div class="table-row head"><span>Build</span><span style="grid-column:2/-1">Not caught by the grounding check</span></div>
   ${caveats.map(e=>`<div class="table-row"><span>${e.target.family}</span><span style="grid-column:2/-1;opacity:.75">${e.caveat}</span></div>`).join('')}
   ${warned.map(e=>`<div class="table-row"><span>${e.target.family}</span><span style="grid-column:2/-1;color:#ffb648">${e.warnings.join(', ')} — ${e.validity}</span></div>`).join('')}
   <small class="mono dim">the automated column says <b>no invented numbers</b>, not <b>nothing invented</b>. The guard compares value-and-noun pairs, so it cannot see a non-numeric invention at all — and it missed a numeric one, "one commit ahead", because <b>one</b> was deliberately excluded from the number table after an earlier false positive. That trade was made knowingly; this is the first time its cost has been visible. A human still reads the replies.</small>`,'sirvis')}</div>`}

/* Recommendations — ranked, with the exclusions and the uncertainty. SIRVIS
   suggests; RAVIS decides. The uncertainty is not a disclaimer here: a build that
   beats the recommendation on every figure taken so far has not been through the
   full suite, and the ranking does not move until it has. */
async function sirvisRecommendations(){
 heading('Recommendations','Ranked with exclusions and uncertainty. SIRVIS suggests — RAVIS decides.');
 const r=await API.sirvis.recommendations();
 $('#content').innerHTML=kpis([
   ['Profile',r.profile,`mode ${r.mode} · algorithm v${r.algorithm_version}`,'sirvis'],
   ['Ranked',String(r.ranked.length),`of ${r.ranked.length+r.excluded.length} considered`,'sirvis'],
   ['Excluded',String(r.excluded.length),'constraints and measurements','sirvis'],
   ['Generated',r.generated_at,`expires in ${r.expires_in_min} min`,'sirvis']])
 +`<div class="card full"><h3>Ranked</h3>${cell(`<div class="route-lanes">${r.ranked.map(x=>`
   <div class="lane${x.rank===1?' selected':''}" onclick="selectOne(this,'.lane')"><b>${x.rank} · ${x.target}</b><span>${prov(x.evidence_type,'n='+x.samples)}</span>
    <small>${x.role} · fit ${x.fit} · ${x.headroom_gb} GB headroom<br>${x.why}</small></div>`).join('')}</div>
   <small class="mono dim">no score column here either. The ranking is an argument made from measurements — rate, first token, tool reliability, recovery behaviour — and the argument is written out per row so it can be disagreed with. A single number would be easier to sort and impossible to check.</small>`,'sirvis')}</div>
  <div class="card wide"><h3>Excluded</h3>${cell(`<div class="route-lanes">${r.excluded.map(x=>`
   <div class="lane excluded"><b>${x.target}</b><span>—</span><small>${x.why}</small></div>`).join('')}</div>
   <small class="mono dim">two of these are exclusions by <b>measurement</b>, which is the kind this machine produced most usefully: one build advertises tool support and loses seven calls in eight, and another is correct alone and abandons the tool with a second model resident. Neither is visible in a capability record, a parameter count or a file size.</small>`,'sirvis')}</div>
  <div class="card narrow"><h3>Uncertainty</h3>${cell(`
   <div class="trace-step"><b>mode</b><span>${r.mode}</span></div>
   <div class="trace-step"><b>algorithm</b><span>v${r.algorithm_version}</span></div>
   <div class="trace-step"><b>expires</b><span>${r.expires_in_min} min</span></div>
   <small class="mono dim">${r.uncertainty}.</small>`,'sirvis')}</div>
  <div class="card wide"><h3>What the deadlines are</h3>${cell(`
   <div class="table-row head"><span>Caller</span><span>Does</span><span style="grid-column:3/-1">Deadline</span></div>
   ${CLARVIS_DEADLINES.map(([name,does,s])=>`<div class="table-row"><span class="mono">${name}</span><span style="opacity:.75">${does}</span><span style="grid-column:3/-1" class="mono">${s}s</span></div>`).join('')}
   <small class="mono dim">these belong to Clarvis, not to routing: missing one substitutes a written fallback line rather than failing the request. That is also why they matter — the cost of a slow model is not an error, it is the character quietly becoming a static bank, which is the product switching its own thesis off. The tightest is ${CLARVIS_DEADLINES[0][2]}s, and the slowest recommended build reaches first token in 0.26s.</small>`,'sirvis')}</div>`}

/* Downloads — persistent jobs. A browser reload must not lose one, and a failure
   states what actually went wrong: "insufficient disk after download" is a fact
   about this machine, not a generic error. */
async function sirvisDownloads(){
 heading('Downloads','Persistent jobs. Closing this tab does not cancel a download, and a failure says why.');
 const d=await API.sirvis.downloads();
 const by=s=>d.items.filter(x=>x.status===s).length;
 const failed=d.items.find(x=>x.status==='failed');
 const pct=x=>Math.round(x.bytes/x.total*100);
 $('#content').innerHTML=kpis([
   ['Disk free',d.disk_free_gb+' GB',`${stamp(SERVICES.sirvis.age)}`,'sirvis'],
   ['Downloading',String(by('downloading')),'resumable · survives reload','sirvis'],
   ['Completed',String(by('completed')),'verified and installed','sirvis'],
   ['Failed',String(by('failed')),failed?failed.error:'none','sirvis']])
 +`<div class="card full"><h3>Jobs</h3>${cell(`
   <div class="table-row head five"><span>Variant</span><span>Status</span><span>Transferred</span><span style="grid-column:4/-1">Progress</span></div>
   ${d.items.map(x=>`<div class="table-row five"><span>${x.variant}</span><span class="chip${x.status==='completed'||x.status==='already_present'?'':' warn'}">${x.status}</span><span class="mono">${x.bytes} / ${x.total} GB</span><span style="grid-column:4/-1"><div class="bar" style="margin:0"><i style="--w:${pct(x)}%"></i></div><small class="mono" style="opacity:.55">${x.error||pct(x)+'%'}</small></span></div>`).join('')}
   <small class="mono dim"><b>already_present</b> is its own status, not a completed download: nothing was transferred, and reporting it as complete would make the disk figure above unexplainable.</small>`,'sirvis')}</div>
  <div class="card wide"><h3>Failure detail</h3>${cell(`
   <div class="trace-step"><b>variant</b><span>${failed.variant}</span></div>
   <div class="trace-step"><b>transferred</b><span>${failed.bytes} of ${failed.total} GB</span></div>
   <div class="trace-step"><b>error</b><span>${failed.error}</span></div>
   <small class="mono dim">the file downloaded and then did not fit — with ${d.disk_free_gb} GB free the next attempt fails the same way, so the honest report is the specific condition rather than "download failed". Retrying it is a user's decision with the numbers in front of them.</small>`,'sirvis')}</div>
  <div class="card narrow"><h3>Persistence</h3>${cell(`
   <div class="trace-step"><b>owner</b><span>SIRVIS, not the browser</span></div>
   <div class="trace-step"><b>on reload</b><span>jobs continue</span></div>
   <div class="trace-step"><b>on cancel</b><span>idempotent</span></div>
   <small class="mono dim">a download is a job in the service with an id, not a fetch in this tab. That is the difference between a progress bar and a progress <i>report</i>.</small>`,'sirvis')}</div>`}

/* System — the machine snapshot every result is pinned to. Without it a benchmark
   number is unattributable: the same build on the same runtime measures
   differently on a different chip, a different macOS, or a hot machine.

   This page lives on NERVIS and reads SIRVIS's machine record, which is exactly
   why every cell on it is cell()'d to 'sirvis'. NERVIS hosts the page; it does not
   own the figure, and with SIRVIS absent the page says so rather than describing
   the host it happens to be running on. */
async function systemView(){
 heading('System','The machine every benchmark result is pinned to — as SIRVIS reports it.');
 const m=await API.sirvis.machine();
 const usedPct=Math.round((m.memory_gb-m.available_gb)/m.memory_gb*100);
 $('#content').innerHTML=kpis([
   ['Memory',m.available_gb+' GB',`free of ${m.memory_gb} · ${m.swap_gb} GB swap`,'sirvis'],
   ['Thermal',m.thermal_state,`${stamp(SERVICES.sirvis.age)}`,'sirvis'],
   ['GPU',String(m.gpu_cores),`cores · ${m.cpu_cores} CPU`,'sirvis'],
   ['Disk',m.disk_free_gb+' GB','free for model artifacts','sirvis']])
 +`<div class="card wide"><h3>Machine ${m.machine_id}</h3>${cell(`
   <div class="table-row head"><span>Model</span><span>Chip</span><span>Cores</span><span>macOS</span></div>
   <div class="table-row"><span>${m.model}</span><span>${m.chip}</span><span class="mono">${m.cpu_cores} CPU · ${m.gpu_cores} GPU</span><span class="mono">${m.macos}</span></div>

   <small class="mono dim">this is the whole of what an implementation needs to place a call, and none of it is a secret: <b>secret_ref</b> names where the key lives, and RAVIS resolves it at call time inside the process. The value never crosses into a browser, a log, an event or a diagnostic packet — which is what makes it safe to render the reference at all.</small>`,'ravis')}</div>
  <div class="card wide"><h3>Protocol mode</h3>${cell(`
   <div class="table-row head"><span>Mode</span><span>Providers</span><span style="grid-column:3/-1">What RAVIS does to the request</span></div>
   <div class="table-row"><span class="mono">transparent</span><span>${p.items.filter(x=>x.protocol==='OPENAI_TRANSPARENT').map(x=>x.label).join(', ')}</span><span style="grid-column:3/-1;opacity:.75">proxied essentially unchanged — an OpenAI client is talking to an OpenAI API</span></div>
   <div class="table-row"><span class="mono">translated</span><span>${p.items.filter(x=>x.protocol==='TRANSLATED').map(x=>x.label).join(', ')}</span><span style="grid-column:3/-1;opacity:.75">request and streamed response are rewritten into another vendor's shape</span></div>
   <small class="mono dim">every translated path is a place tool-call framing can be lost: fragmented arguments, a renumbered tool index, a dropped <b>tool_call_id</b>. That is exactly what the conformance suite on the Diagnostics screen checks, and why a provider passing "chat works" is not the same as a provider Clarvis can use.</small>`,'ravis')}</div>
  <div class="card narrow"><h3>Not currently usable</h3>${cell(p.items.filter(x=>!x.enabled).map(x=>`
   <div class="trace-step"><b>${x.label}</b><span>${x.credential==='not configured'?'no credential':x.breaker!=='CLOSED'?'breaker '+x.breaker:'disabled'}</span></div>`).join('')
   +`<small class="mono dim">three different conditions, deliberately not merged. A provider with no credential is unavailable rather than failing; one whose daemon is not listening is unreachable, which is not the same as absent; one switched off by policy is working perfectly and still not a candidate. Each is removed before scoring, so none of them appears as a low-ranked option.</small>`,'ravis')}</div>`}

/* Policies — conditions and actions in evaluation order. Hard policies eliminate,
   soft policies bias the ranking; showing them in one list without that column
   would make a preference look like a guarantee. */
async function ravisPolicies(){
 heading('Policies','Conditions and actions, in evaluation order. Hard policies eliminate; soft policies only rank.');
 const p=await API.ravis.policies();
 const hard=p.items.filter(x=>x.kind==='hard');
 $('#content').innerHTML=kpis([
   ['Policies',String(p.items.length),'evaluated in order','ravis'],
   ['Hard',String(hard.length),'eliminate candidates','ravis'],
   ['Soft',String(p.items.length-hard.length),'bias the ranking only','ravis'],
   ['Enabled',String(p.items.filter(x=>x.enabled).length),'a disabled rule is not evaluated','ravis']])
 +`<div class="card full"><h3>Evaluation order</h3>${cell(`
   <div class="table-row head six"><span>Id</span><span style="grid-column:2/4">When</span><span style="grid-column:4/6">Then</span><span>Kind</span></div>
   ${p.items.map(x=>`<div class="table-row six"><span class="mono">${x.policy_id}</span><span class="mono" style="grid-column:2/4;opacity:.8">${escapeHtml(x.when)}</span><span style="grid-column:4/6">${x.then}</span><span class="chip${x.kind==='hard'?'':' warn'}">${x.kind}</span></div>`).join('')}
   <small class="mono dim">order matters: <b>${p.items[1].policy_id}</b> removes every cloud provider before anything is scored, so a cheaper or faster cloud model is not out-ranked — it is never a candidate. A soft policy such as <b>${p.items.find(x=>x.kind==='soft').policy_id}</b> can only move a candidate down the list.</small>`,'ravis')}</div>
  <div class="card wide"><h3>Hard versus soft</h3>${cell(`
   <div class="table-row head"><span>Kind</span><span>Count</span><span style="grid-column:3/-1">Guarantee to a caller</span></div>
   <div class="table-row"><span class="chip">hard</span><span>${hard.length}</span><span style="grid-column:3/-1;opacity:.75">will never be violated: if nothing satisfies them the result is NO_ROUTE</span></div>
   <div class="table-row"><span class="chip warn">soft</span><span>${p.items.length-hard.length}</span><span style="grid-column:3/-1;opacity:.75">changes the ordering; a strong preference is still not a promise</span></div>
   <small class="mono dim">this column is the difference between "prefer local" and "local only". Both are legitimate; presenting the first as the second is how a privacy setting becomes untrue without anyone editing it.</small>`,'ravis')}</div>
  <div class="card narrow"><h3>Context policy</h3>${cell(`
   <div class="trace-step"><b>when</b><span>request > model context</span></div>
   <div class="trace-step"><b>then</b><span>${p.items.find(x=>x.policy_id==='pl_05').then}</span></div>
   <small class="mono dim">truncation is the silent failure this rule exists to prevent. A shortened prompt still produces a fluent answer, which is exactly why nobody notices — so the request moves to a larger context or it does not run.</small>`,'ravis')}</div>`}

/* Evidence — what RAVIS is scoring on, and who owns it. The table is SIRVIS's
   data rendered on a RAVIS page, so it is cell()'d to sirvis: cycle SIRVIS off
   and the evidence goes with it while RAVIS's own observations stay. That is
   §13.4 optionality made visible rather than asserted. */
async function ravisEvidence(){
 heading('Evidence','What the ranking is standing on, and which service owns each part of it.');
 const [ev,req,usage]=await Promise.all([API.sirvis.evidence(),API.ravis.requests(),API.ravis.usage()]);
 /* RAVIS's own provenance enum, and the mapping it applies on the way in. It never
    upgrades a value: SIRVIS's PARTIALLY_MEASURED arrives as ESTIMATED, not MEASURED. */
 const MAP=[['MEASURED_BY_SIRVIS','MEASURED','repeated benchmark runs on this machine, with spread and sample count'],
            ['OBSERVED_BY_RAVIS','MEASURED','RAVIS’s own production timings — what it is doing during normal use'],
            ['PROVIDER_METADATA','ESTIMATED','the provider’s published claim; useful, unverified, and not a measurement'],
            ['ESTIMATED','ESTIMATED','interpolated from a neighbouring build — never promoted by being reused'],
            ['UNKNOWN','UNKNOWN','no evidence. Distinct from a bad score, and it stays distinct']];
 const measured=ev.items.filter(e=>e.evidence_type==='MEASURED').length;
 const observed=req.items.filter(r=>r.ttft_s!==null).length;
 $('#content').innerHTML=kpis([
   ['From SIRVIS',String(ev.items.length),'evidence records consumed','sirvis'],
   ['Measured',String(measured),'runs on this machine · n=3','sirvis'],
   ['Observed by RAVIS',String(observed),'live TTFT from real traffic','ravis'],
   ['Routing p50',usage.routing_p50_ms+' ms','decision cost, cached evidence','ravis']])
 +`<div class="card full"><h3>Evidence in the ranking <span class="chip">owned by SIRVIS</span></h3>${cell(`
   <div class="table-row head six"><span>Build</span><span>Role</span><span>Rate</span><span>First token</span><span>Tools</span><span>Provenance</span></div>
   ${ev.items.map(e=>`<div class="table-row six"><span>${e.target.family} <small class="mono" style="opacity:.5">${e.target.variant}</small></span><span>${e.role}</span><span class="mono">${e.metrics.generation_tok_s?e.metrics.generation_tok_s+' tok/s':'—'}</span><span class="mono">${e.metrics.first_token_s==null?'—':e.metrics.first_token_s+'s'}</span><span class="mono"${e.metrics.tool_calls&&e.metrics.tool_calls[0]!==e.metrics.tool_calls[1]?' style="color:#ffb648"':''}>${e.metrics.tool_calls?e.metrics.tool_calls.join('/'):'—'}</span><span>${prov(e.evidence_type,e.samples?'n='+e.samples:'')}</span></div>`).join('')}
   <small class="mono dim">SIRVIS publishes measures, not a score. RAVIS computes the ranking from them and owns it — which is the split that lets the router be argued with: every number in this table came from a run, and every number in the Routes ranking is RAVIS's arithmetic on top of these. Collapsing the two would leave nobody able to say whether a bad route was a bad measurement or a bad weighting.</small>`,'sirvis')}</div>
  <div class="card wide"><h3>Provenance mapping</h3>${cell(`
   <div class="table-row head"><span>Arrives as</span><span>RAVIS records</span><span style="grid-column:3/-1">What it means downstream</span></div>
   ${MAP.map(([a,b,why])=>`<div class="table-row"><span class="mono">${a}</span><span>${prov(b)}</span><span style="grid-column:3/-1;opacity:.75">${why}</span></div>`).join('')}
   <small class="mono dim">the mapping only ever holds or lowers confidence. Nothing in this table turns an estimate into a measurement, including caching it, re-serving it, or a second service repeating it back.</small>`,'ravis')}</div>
  <div class="card narrow"><h3>Without SIRVIS</h3>${cell(`
   <div class="trace-step"><b>evidence source</b><span>${usable('sirvis')?'SIRVIS · measured':'provider metadata and RAVIS observations'}</span></div>
   <div class="trace-step"><b>hard constraints</b><span>still enforced</span></div>
   <div class="trace-step"><b>degradation</b><span>${usable('sirvis')?'none':'labelled on every affected route'}</span></div>
   <div class="trace-step"><b>scores</b><span>never fabricated</span></div>
   <small class="mono dim">${usable('sirvis')?'SIRVIS is answering, so local candidates rank on measured evidence. Cycle it off on the SIMULATE strip: routing continues on provider metadata and RAVIS’s own observations, the table above goes absent rather than stale, and the constraints do not move.':'SIRVIS is '+SERVICES.sirvis.state+'. Routing continues — the ranking now rests on provider metadata and RAVIS’s own production observations, and says so. What it does not do is keep serving the last measured scores as though they were current.'}</small>`,'ravis')}</div>`}

/* Logs — the request record and the frames RAVIS emitted, side by side. There is

 const warn=mine.filter(e=>e.severity==='warning').length;
 $('#content').innerHTML=kpis([

   ['No-route',String(req.items.filter(r=>r.result!=='OK').length),'failed closed, recorded','ravis'],
   ['Events published',String(mine.length),`${warn} warning`,'nervis'],

 +`<div class="card full"><h3>Request log</h3>${cell(`
   <div class="table-row head five"><span>Pool</span><span>Model</span><span>Path</span><span>TTFT</span><span>Result</span></div>
   ${req.items.map(r=>`<div class="table-row five"><span class="mono">${r.pool}</span><span>${r.model||'—'}</span><span class="mono">${r.execution_path||'—'}</span><span>${r.ttft_s?r.ttft_s+'s':'—'}</span><span class="chip${['OK','CANCELLED'].includes(r.result)?'':' warn'}">${r.result}</span></div>`).join('')}
   <small class="mono dim">every row is a decision id away from its full record — pool, requirements, candidates, exclusions and timings. What no row leads to is the text of the request, because it was never written down.</small>`,'ravis')}</div>
  <div class="card wide"><h3>Events published by RAVIS</h3>${cell(`
   <div class="table-row head five"><span>Time</span><span>Type</span><span>Version</span><span>Trace</span><span>Severity</span></div>
   ${mine.map(e=>`<div class="table-row five"><span class="mono">${e.occurred_at}</span><span class="mono">${e.event_type}</span><span class="mono">${e.event_version}</span><span class="mono">${e.trace_id||'—'}</span><span class="chip${e.severity==='warning'?' warn':''}">${e.severity}</span></div>`).join('')}
   <small class="mono dim">these are the frames RAVIS handed the hub, carrying identifiers and result classes only. Export failing never blocks a route: telemetry is downstream of serving the request, and a collector outage must not become a routing outage.</small>`,'ravis')}</div>
  <div class="card narrow"><h3>What is not logged</h3>${cell(`
   <div class="trace-step"><b>prompt</b><span>never</span></div>
   <div class="trace-step"><b>completion</b><span>never</span></div>
   <div class="trace-step"><b>credentials</b><span>never</span></div>
   <div class="trace-step"><b>timings and decisions</b><span>always</span></div>
   <small class="mono dim">this is a policy, not an empty table waiting to fill up. Turning payload capture on is a deliberate, audited change — and until someone makes it, "no prompts in the log" is a fact rather than a hope.</small>`,'ravis')}</div>`}

/* Settings — how the router serves its clients, and the short list of things a
   client may actually change.

   The discipline that shapes this page: RAVIS.md §15.1 defines exactly five
   mutations, and everything else on the screen is configuration with no agreed
   endpoint behind it. Those get rendered as state with the reason stated, not as
   toggles wired to a notify(). "A UI need does not create a RAVIS API" is the
   spec's own sentence, and a settings page is where that rule is most tempting
   to break — every row here looks like it wants to be editable. */
async function ravisSettings(){
 heading('Settings','How the router serves its clients — and the five things that have an endpoint to change them.',
  `<button class="btn" onclick="DEMO_API.refreshEvidence()">Refresh evidence</button>`);
 const [s,prof,pr]=await Promise.all([API.ravis.settings(),API.ravis.profiles(),API.ravis.providers()]);
 const active=prof.items.find(x=>x.default);
 const served=s.serving.endpoints.filter(e=>e[1]==='required').length;
 const band=s.budget.ladder.find(([lo,hi])=>s.budget.used_pct>=lo&&(hi===null||s.budget.used_pct<hi));
 $('#content').innerHTML=kpis([
   ['Active profile',active.label,`${active.profile_id} · rev ${active.revision}`,'ravis'],
   ['Serving',`${served} / ${s.serving.endpoints.length}`,'endpoints live','ravis'],
   ['Budget',`${s.budget.used_pct}%`,`of €${s.budget.monthly_eur} · ${band[2]}`,'ravis'],
   ['Privacy',s.privacy.level,'never overridden by score','ravis']])
 +`<div class="card full"><h3>What a client can change <span class="chip">has an endpoint</span></h3>${cell(`
   <div class="table-row head six"><span>Action</span><span style="grid-column:2/4">Endpoint</span><span>Permission</span><span style="grid-column:5/-1">Control</span></div>
   <div class="table-row six"><span>Active profile</span><span class="mono" style="grid-column:2/4;opacity:.8">${escapeHtml(s.actions[0][1])}</span><span class="mono">${s.actions[0][2]}</span><span style="grid-column:5/-1">on the Dashboard — it asks first</span></div>
   ${pr.items.map(x=>`<div class="table-row six"><span>${x.label}</span><span class="mono" style="grid-column:2/4;opacity:.8">POST /api/v1/providers/${x.provider_id}/${x.enabled?'disable':'enable'}</span><span class="mono">routing-control</span><span style="grid-column:5/-1"><button class="btn" onclick="DEMO_API.setProvider('${x.provider_id}',${!x.enabled})">${x.enabled?'Disable':'Enable'}</button> <small class="mono" style="opacity:.55">${x.enabled?'in eligibility':'not a candidate'}</small></span></div>`).join('')}
   <div class="table-row six"><span>SIRVIS evidence</span><span class="mono" style="grid-column:2/4;opacity:.8">${escapeHtml(s.actions[3][1])}</span><span class="mono">${s.actions[3][2]}</span><span style="grid-column:5/-1"><button class="btn" onclick="DEMO_API.refreshEvidence()">Refresh</button></span></div>
   <div class="table-row six"><span>Conformance suite</span><span class="mono" style="grid-column:2/4;opacity:.8">${escapeHtml(s.actions[4][1])}</span><span class="mono">${s.actions[4][2]}</span><span style="grid-column:5/-1"><button class="btn" onclick="notify('ravis conformance clarvis — re-running the published suite')">Run</button></span></div>
   <small class="mono dim">this is the whole list. Every mutation carries an <b>Idempotency-Key</b>, an <b>If-Match</b> where it changes state, a separate authorization under the permission named above, and an audit record with actor, target, precondition and result — and returns the actual post-state rather than the request echoed back.</small>`,'ravis')}</div>
  <div class="card wide"><h3>Serving surface</h3>${cell(`
   <div class="table-row head"><span>Endpoint</span><span>Status</span><span style="grid-column:3/-1">Constraint</span></div>
   ${s.serving.endpoints.map(([ep,st,note])=>`<div class="table-row"><span class="mono">${escapeHtml(ep)}</span><span class="chip${st==='required'?'':' warn'}">${st}</span><span style="grid-column:3/-1;opacity:.75">${note}</span></div>`).join('')}
   <div class="trace-step" style="margin-top:10px"><b>request features</b><span>${s.serving.supported.length} supported</span></div>
   <small class="mono dim" style="opacity:.8">${s.serving.supported.join(' · ')}</small>
   <small class="mono dim">${s.serving.note}. Errors are <b>${s.serving.error_shape}</b> — a client parses the OpenAI shape, so the management envelope must not leak onto <b>/v1</b>.</small>`,'ravis')}</div>
  <div class="card narrow"><h3>Budget</h3>${cell(`
   ${s.budget.ladder.map(([lo,hi,what])=>`<div class="trace-step"${band[0]===lo?' style="border-left-color:#ffb648"':''}><b>${lo}–${hi===null?'100+':hi}%</b><span>${what}</span></div>`).join('')}
   <small class="mono dim">€${s.budget.monthly_eur} monthly, ${s.budget.used_pct}% used, so routing is in <b>${band[2]}</b>. An unknown price stays unknown and the constraint fails predictably — an estimated cost is never presented as an invoice.</small>`,'ravis')}</div>
  <div class="card wide"><h3>Privacy and logging</h3>${cell(`
   <div class="table-row head"><span>Level</span><span>Now</span><span style="grid-column:3/-1">Effect</span></div>
   ${s.privacy.levels.map(l=>`<div class="table-row"><span class="mono">${l}</span><span>${l===s.privacy.level?'<span class="chip">active</span>':'<span class="mono" style="opacity:.3">—</span>'}</span><span style="grid-column:3/-1;opacity:.7">${l==='LOCAL_ONLY'?'every cloud candidate removed before scoring, not out-ranked':l==='TRUSTED_PROVIDERS'?'only providers on the trusted list are eligible':l==='LOCAL_PREFERRED'?'local candidates weighted up; cloud still eligible':'no privacy constraint applied'}</span></div>`).join('')}
   <div class="trace-step" style="margin-top:10px"><b>request logging</b><span>${s.privacy.request_logging}</span></div>
   <div class="trace-step"><b>persist content</b><span>${s.privacy.persist_content?'yes':'no'}</span></div>
   <small class="mono dim">a privacy level is a hard constraint: it can never be overridden by score, which is what makes <b>LOCAL_ONLY</b> a promise rather than a preference. Prompt and response content is not persisted by default, so there is no content log to expose here.</small>`,'ravis')}</div>
  <div class="card full"><h3>Listen address <span class="chip${s.listen.tls?'':' warn'}">${s.listen.tls?'tls':'loopback, no tls'}</span></h3>${cell(`
   <div class="table-row head six"><span>Surface</span><span style="grid-column:2/4">Address</span><span style="grid-column:4/-1">Who talks to it</span></div>
   ${s.listen.surfaces.map(([path,what,who])=>`<div class="table-row six"><span>${what}</span><span class="mono" style="grid-column:2/4">http://${s.listen.host}:${s.listen.port}${path}</span><span style="grid-column:4/-1;opacity:.75">${who}</span></div>`).join('')}
   <div class="trace-step" style="margin-top:11px"><b>set by</b><span class="mono">${escapeHtml(s.listen.set_by)}</span></div>
   <div class="trace-step"><b>takes effect</b><span>${s.listen.restart_required?'on restart':'immediately'}</span></div>
   <div class="trace-step"><b>remote access</b><span>${s.listen.remote_access?'enabled':'off — loopback only'}</span></div>

  <div class="card wide"><h3>What breaks if the port changes</h3>${cell(`
   <div class="table-row head"><span>Service</span><span>Holds</span><span style="grid-column:3/-1">If it is not updated</span></div>
   ${s.listen.dependants.map(([svc,holds,effect])=>`<div class="table-row"><span>${svc}</span><span class="mono" style="opacity:.75">${holds}</span><span style="grid-column:3/-1;opacity:.75">${effect}</span></div>`).join('')}
   <small class="mono dim">this is why the address is not a field you edit in one place and forget. Clarvis probes <b>/v1/models</b> unauthenticated with a 2 s timeout and reads any failure as <b>provider offline</b>, so a moved port looks to a user like RAVIS is down rather than like RAVIS moved. NERVIS's copy lives in its own registry, on <b>NERVIS → Settings</b>, and is edited there because it is NERVIS's configuration rather than RAVIS's.</small>`,'ravis')}</div>
