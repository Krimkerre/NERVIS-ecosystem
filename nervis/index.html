/* Credentials — the one screen that exists so a provider can be reached at all.
   Every other RAVIS screen answers a question about a running system; this one
   is what makes the system able to run. Without it Google, Anthropic and
   OpenRouter are configuration RAVIS can describe and never use.

   The value goes one way. RAVIS returns a status — configured or not, and from
   which source — and has no endpoint that reads a credential back, so this
   screen cannot show one even by mistake. That is why the field is always empty
   on load rather than pre-filled with dots pretending to be a stored value. */
async function ravisCredentials(){
 heading('Credentials','Provider keys. Entered here, stored by RAVIS, never read back.');
 let payload=null;
 try{
  const r=await fetch(BASE.ravis+'/api/v1/providers/credentials');
  if(r.ok)payload=await r.json();
 }catch(e){payload=null}

 if(!payload){
  $('#content').innerHTML=`<div class="card full"><h3>RAVIS is not answering</h3>${cell(`
   <div class="trace-step"><b>endpoint</b><span class="mono">GET /api/v1/providers/credentials</span></div>
   <small class="mono dim">no transcription to fall back to, deliberately. A remembered "configured" for a service that is not running would be the most misleading thing this screen could say.</small>`,'ravis')}</div>`;
  return;}

 const items=payload.items||[];
 const loose=items.filter(i=>i.configured&&!i.file_is_private);
 const label={file:'stored by RAVIS',keychain:'macOS Keychain',environment:'environment variable',absent:'not set'};

 /* The provider's own name for itself, from RAVIS, falling back to the id.
    The id stays `google` because it is a wire value — it keys the credential
    file, it is half of `RAVIS_GOOGLE_API_KEY`, and it is a path segment in
    `ravis/<provider>/<model>`. "Google AI Studio" is what a person should read:
    it names the surface these keys come from, as opposed to Vertex AI, which is
    the same models behind a service account and a different credential shape. */
 const row=i=>`<div class="table-row" style="grid-template-columns:1.1fr auto 1.6fr auto auto;align-items:center;gap:8px">
   <span class="mono"><b>${escapeHtml(i.label||i.name)}</b>${i.routable===false?' <span class="chip warn" title="no adapter or upstream is declared for this provider">unroutable</span>':''}</span>
   <span class="mono" style="opacity:.75">${i.configured?'&#9679; '+label[i.source]:'&#9675; not set'}</span>
   <span><input id="cred-${escapeHtml(i.name)}" type="password" autocomplete="off"
     placeholder="${i.configured?'replace the stored key\u2026':'paste the API key\u2026'}"
     style="width:100%;background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:6px;font-family:inherit"></span>
   <button class="btn primary" onclick="CREDS.save('${escapeHtml(i.name)}')">Save</button>
   <button class="btn" onclick="CREDS.forget('${escapeHtml(i.name)}')"${i.source==='file'?'':' disabled title="RAVIS only removes what it stored itself" style="opacity:.45;cursor:not-allowed"'}>Remove</button>
  </div>`;

 $('#content').innerHTML=`
  <div class="card full"><h3>Provider keys</h3>${cell(`
   ${items.map(row).join('')}
   ${items.some(i=>i.routable===false)?`<small class="mono dim" style="display:block;margin-top:6px"><b>Unroutable</b> means the key would be stored and never sent: no adapter and no declared upstream carries that provider. Until M10 connected the store, <b>every</b> row was unroutable — a key typed here was written to a 0600 file, reported as configured, and read by nothing. Declare an upstream with that <span class="mono">kind</span> to make one reachable.</small>`:''}
   <small class="mono dim">the field is empty because RAVIS has no endpoint that returns a credential — not because it is hiding one. Saving replaces whatever was there. <b>Remove</b> deletes only from RAVIS's own file: a key in an environment variable or the Keychain was put there by something else, so the row may still read configured afterwards, from the lower source.</small>`,'ravis')}</div>

  ${loose.length?`<div class="card full"><h3>File permissions</h3>${cell(`
   <div class="trace-step"><b>${loose.map(i=>escapeHtml(i.name)).join(', ')}</b><span>readable by other accounts on this machine</span></div>
   <small class="mono dim">RAVIS writes the credential file at mode <b>0600</b>. Something has widened it since. Repair with <span class="mono">chmod 600 ~/.config/ravis/credentials.json</span> — the file is still being read, because refusing would lock you out of your own service over a permission bit.</small>`,'ravis')}</div>`:''}

  <div class="card narrow"><h3>Where these live</h3>${cell(`
   <div class="trace-step"><b>written to</b><span class="mono">~/.config/ravis/credentials.json</span></div>
   <div class="trace-step"><b>permissions</b><span>0600 — owner only</span></div>
   <div class="trace-step"><b>also read from</b><span>macOS Keychain, then environment</span></div>
   <div class="trace-step"><b>read back by any endpoint</b><span>never</span></div>
   <small class="mono dim">the same protection as the SSH private key sitting next to it. Encryption at rest would need a key RAVIS can read unattended, which anyone with the same file access could read too — moving the problem rather than solving it, for a native dependency on three platforms.</small>`,'ravis')}</div>`;
}

const PROVIDERS={
 /* One provider's catalogue while its picker is open, keyed by provider.
    Held here rather than read back off the checkboxes: a search narrows what is
    *rendered*, and a selection made before searching has to survive the list
    being rebuilt. Reading the DOM would silently drop every tick that scrolled
    out of the filter. */
 picked:{},

 editFilter(name){
  const panel=document.getElementById('mf-'+name);
  if(!panel)return;
  const opening=panel.style.display==='none';
  panel.style.display=opening?'block':'none';
  document.getElementById('mfp-'+name).style.display='none';
  if(opening)this.load(name);
 },

 patterns(name){
  /* Patterns and ticks edit the same filter, so only one is shown at a time —
     two views of one value, both editable, is how a screen writes back the one
     nobody touched. */
  document.getElementById('mf-'+name).style.display='none';
  document.getElementById('mfp-'+name).style.display='grid';
 },

 /* The whole catalogue, paged until it is exhausted.
    Every page, not a sample: a checkbox list that omits a model is one the
    operator cannot see and cannot select, and RAVIS caps its *sample* endpoint
    precisely so a truncated list is never mistaken for the answer. */
 async load(name){
  const list=document.getElementById('mfl-'+name);
  list.innerHTML='<div class="picker-empty">reading the catalogue\u2026</div>';
  const items=[];
  let offset=0;
  try{
   while(offset!==null){
    const r=await fetch(BASE.ravis+'/api/v1/providers/'+encodeURIComponent(name)
      +'/catalogue?offset='+offset+'&limit=500',{signal:AbortSignal.timeout(8000)});
    if(!r.ok){list.innerHTML=`<div class="picker-empty">RAVIS refused: HTTP ${r.status}</div>`;return}
    const page=await r.json();
    items.push(...(page.items||[]));
    offset=page.next_offset;
   }
  }catch(e){
   list.innerHTML='<div class="picker-empty">RAVIS is not reachable.</div>';return;
  }
  if(!items.length){
   list.innerHTML='<div class="picker-empty">this provider publishes no catalogue yet \u2014 it may need a credential, or its first refresh.</div>';
  }
  this.picked[name]={all:items.map(i=>i.id),on:new Set(items.filter(i=>i.selected).map(i=>i.id)),q:''};
  this.render(name);
 },

 /* The search box matches the model id and the provider's own name, so
    "openrouter" narrows to that provider's rows even though its ids do not all
    carry the word. */
 matching(name){
  const st=this.picked[name];
  if(!st)return[];
  if(!st.q)return st.all;
  return st.all.filter(id=>id.toLowerCase().includes(st.q)
    || name.toLowerCase().includes(st.q));
 },

 render(name){
  const st=this.picked[name];
  if(!st)return;
  const list=document.getElementById('mfl-'+name);
  const shown=this.matching(name);
  list.innerHTML=shown.length
   ?shown.map(id=>`<label class="picker-item" title="${escapeHtml(id)}">
     <input type="checkbox"${st.on.has(id)?' checked':''}
       onchange="PROVIDERS.tick('${escapeHtml(name)}','${escapeHtml(id).replace(/'/g,"&#39;")}',this.checked)">
     <span>${escapeHtml(id)}</span></label>`).join('')
   :'<div class="picker-empty">nothing matches that.</div>';
  const count=document.getElementById('mfc-'+name);
  /* Says what is selected out of the whole catalogue, never out of what the
     search happens to show — the second number is the one an operator is about
     to act on, and reporting the visible subset would make "all" mean two
     different things depending on the search box. */
  count.textContent=`${st.on.size} of ${st.all.length} selected`
    +(st.q?` \u00b7 ${shown.length} shown`:'');
 },

 tick(name,id,on){
  const st=this.picked[name];
  if(!st)return;
  if(on)st.on.add(id); else st.on.delete(id);
  document.getElementById('mfc-'+name).textContent=
    `${st.on.size} of ${st.all.length} selected`+(st.q?` \u00b7 ${this.matching(name).length} shown`:'');
 },

 search(name,q){
  const st=this.picked[name];
  if(!st)return;
  st.q=(q||'').trim().toLowerCase();
  this.render(name);
 },

 /* Acts on what the search shows, which is the only reading that makes sense
    of "All" next to a filtered list — otherwise typing `gemini` then clicking
    All would tick four hundred unrelated models. */
 checkAll(name,on){
  const st=this.picked[name];
  if(!st)return;
  const shown=this.matching(name);
  for(const id of shown){if(on)st.on.add(id); else st.on.delete(id)}
  this.render(name);
 },

 async applyPicked(name){
  const st=this.picked[name];
  if(!st)return;
  /* **Everything ticked is stored as no filter, not as a list of every id.**
     The two select the same models today and diverge tomorrow: a provider that
     adds a model would have it excluded by the explicit list and included by
     the empty one, and "I ticked everything" plainly means the second. */
  const all=st.on.size===st.all.length;
  const body={include:all?[]:[...st.on],exclude:[]};
  if(!all&&!st.on.size&&!confirm('Nothing is ticked. That leaves this provider with no models at all. Continue?'))return;
  try{
   const r=await fetch(BASE.ravis+'/api/v1/providers/'+encodeURIComponent(name)+'/models',
    {method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
   if(!r.ok){alert('RAVIS refused: HTTP '+r.status);return}
  }catch(e){alert('RAVIS is not reachable.');return}
  delete this.picked[name];
  ravisProviders();
 },

 async applyFilter(name,clear){
  const split=v=>(v||'').split(',').map(s=>s.trim()).filter(Boolean);
  const body=clear?{include:[],exclude:[]}:{
   include:split((document.getElementById('mfi-'+name)||{}).value),
   exclude:split((document.getElementById('mfe-'+name)||{}).value)};
  try{
   const r=await fetch(BASE.ravis+'/api/v1/providers/'+encodeURIComponent(name)+'/models',
    {method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
   if(!r.ok){alert('RAVIS refused: HTTP '+r.status);return}
  }catch(e){alert('RAVIS is not reachable.');return}
  ravisProviders();
 },
 async toggle(name,enabled){
  try{
   const r=await fetch(BASE.ravis+'/api/v1/providers/'+encodeURIComponent(name)+'/enabled',
    {method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({enabled})});
   if(!r.ok){alert('RAVIS refused: HTTP '+r.status);return}
  }catch(e){alert('RAVIS is not reachable.');return}
  ravisProviders();
 }};

/* The chat screen is a real client of RAVIS's OpenAI-compatible API.

   It was previously wired to a button calling `sendChat`, which was never
   defined anywhere — pressing send threw a ReferenceError. So the screen was
   not merely showing a transcribed conversation, it could not have held a real
   one.

   Conversations are persisted by `CHAT_STORE` below — this comment used to say
   nothing was written to disk, which was true when it was written and stopped
   being true the moment storage landed. */
/* Conversation storage.

   §7.2 asks for exactly this and no more: "Local only by default: conversation
   ID, title, timestamps, messages, RAVIS route IDs. Allow deletion." NERVIS M4
   adds "history persists locally".

   **This is `localStorage`, not the database §7.2 eventually wants.** NERVIS M0
   — the FastAPI package with SQLite and migrations — has never been built, and
   `nervis/` holds a single HTML file served by a static server. So there is no
   backend to persist to. `localStorage` satisfies the requirement that matters
   (local, deletable, survives a reload) and is honest about being per-browser
   rather than per-machine: another browser, or a private window, sees nothing.

   Nothing here is sent anywhere. Prompts do not travel to the trace collector,
   which is what the screen has always claimed and can now claim truthfully. */
const CHAT_STORE={
 KEY:'nervis.conversations.v1',
 read(){
  try{
   const raw=localStorage.getItem(this.KEY);
   const list=raw?JSON.parse(raw):[];
   return Array.isArray(list)?list:[];
  }catch(e){
   /* A corrupt or unavailable store yields no history rather than throwing.
      Private browsing refuses localStorage entirely, and a chat screen that
      cannot open is a worse outcome than one that cannot remember. */
   return [];
  }
 },
 write(list){
  try{localStorage.setItem(this.KEY,JSON.stringify(list));return true}
  catch(e){return false}
 },
 save(session){
  if(!session.messages.length)return;
  const list=this.read().filter(c=>c.conversation_id!==session.id);
  list.unshift({
   conversation_id:session.id,
   title:session.title,
   created_at:session.created_at,
   updated_at:new Date().toISOString(),
   /* Route ids are kept — §7.2 names them explicitly. They are what lets a
      stored reply still explain why that model answered, provided the decision
      is still in RAVIS's in-memory window. */
   messages:session.messages.map(m=>({role:m.role,text:m.text,
     served:m.served||null,route_decision_id:m.route_decision_id||null})),
   params:{system:session.system,temperature:session.temperature,
     max_tokens:session.max_tokens,top_p:session.top_p,profile:session.profile}});
  this.write(list.slice(0,50));
 },
 remove(id){this.write(this.read().filter(c=>c.conversation_id!==id))},
 clear(){this.write([])}
};

const CHAT_SESSION={
 id:'cv_'+Math.random().toString(36).slice(2,6),
 created_at:new Date().toISOString(),
 title:'New conversation',
 messages:[],
 profile:'ravis/auto',
 /* Generation parameters, held for the tab like everything else here. Defaults
    are *unset* rather than guessed: an omitted `temperature` lets the model and
    the runtime apply their own, and sending 0.7 because it is a common default
    would override a deliberate choice somebody made elsewhere. Only what is
    filled in gets sent. */
 /* Which drawer pane is out, and it survives a re-render: `render()` runs after
    every message, and a panel that snapped shut each time you sent one would be
    unusable exactly when you are adjusting it. `null` is closed. */
 drawer:null,
 system:'',
 temperature:'',
 max_tokens:'',
 top_p:'',
 /* The sampling knobs LM Studio exposes, kept unset for the same reason as the
    three above: an omitted parameter lets the model and the runtime apply their
    own, and sending a common default would override a deliberate choice made
    elsewhere. Only what is filled in gets sent. */
 top_k:'',
 min_p:'',
 frequency_penalty:'',
 presence_penalty:'',
 repetition_penalty:'',
 seed:'',
 stop:'',
 /* Whether the advanced block is unfolded. Not a parameter — it changes what is
    visible and nothing about the request. */
 advanced:false,
 busy:false};

const CHAT_SESSIONS={
 start(){
  /* The current conversation is saved before it is replaced. A "New chat"
     button that discarded what was on screen would be a data-loss control
     wearing a friendly label. */
  CHAT_STORE.save(CHAT_SESSION);
  Object.assign(CHAT_SESSION,{
   id:'cv_'+Math.random().toString(36).slice(2,6),
   created_at:new Date().toISOString(),
   title:'New conversation',
   messages:[]});
  render();
  notify('New conversation');
 },
 open(id){
  const found=CHAT_STORE.read().find(c=>c.conversation_id===id);
  if(!found)return notify('That conversation is no longer stored');
  CHAT_STORE.save(CHAT_SESSION);
  const p=found.params||{};
  Object.assign(CHAT_SESSION,{
   id:found.conversation_id,
   created_at:found.created_at,
   title:found.title,
   messages:(found.messages||[]).map(m=>({...m})),
   /* Parameters travel with the conversation. Reopening a chat that used a
      system prompt and finding it silently gone would make the next reply
      inexplicable. */
   system:p.system||'',temperature:p.temperature||'',
   max_tokens:p.max_tokens||'',top_p:p.top_p||'',
   profile:p.profile||'ravis/auto'});
  render();
 },
 remove(id){
  if(!confirm('Delete this conversation? It is not stored anywhere else.'))return;
  CHAT_STORE.remove(id);
  if(CHAT_SESSION.id===id)Object.assign(CHAT_SESSION,{
    id:'cv_'+Math.random().toString(36).slice(2,6),
    created_at:new Date().toISOString(),title:'New conversation',messages:[]});
  render();
 }};

/* Health and capabilities, read from whichever services answer.

   Every service publishes `/ecosystem/health` (§1) and `/ecosystem/capabilities`,
   so a diagnostics screen has real material without any diagnostics endpoint —
   which is fortunate, because there is not one: `/api/v1/diagnostics` is a 404
   on both, and the Clarvis conformance suite is a CLI command with no HTTP
   surface at all. */
/* The Test button, which used to raise a toast describing a test it did not
   run. §14's health test is exactly the three metadata reads this already does,
   so the control now performs them and reports what came back — including
   "nothing", which is the answer it exists to surface. */
async function healthTest(key){
 if(!BASE[key]&&key!=='nervis')return notify(`${key}: no address configured`);
 if(key==='nervis')return notify('NERVIS has no service to test — M0 is unbuilt');
 notify(`${key.toUpperCase()}: testing…`);
 const d=await serviceDiagnostics(key);
 if(!d||!d.health)return notify(`${key.toUpperCase()}: not answering`);
 const checks=(d.health.checks||[]).map(c=>`${c.name} ${c.status}`).join(', ')||'no checks';
 notify(`${key.toUpperCase()}: ${d.health.status} · ${checks} · `
   +`${d.available.length}/${d.capabilities.length} capabilities`);
}

async function serviceDiagnostics(key){
 const get=async path=>{
  try{
   const r=await fetch(BASE[key]+path,{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
   return r.ok?await r.json():null;
  }catch(e){return null}
 };
 const [health,caps,id]=await Promise.all([
   get('/ecosystem/health'),get('/ecosystem/capabilities'),get('/ecosystem/identity')]);
 if(!health&&!caps&&!id)return null;
 const list=(caps&&caps.capabilities)||[];
 return{key,health,identity:id,
   capabilities:list,
   available:list.filter(c=>c.state==='available'),
   unavailable:list.filter(c=>c.state!=='available')};
}

function healthChip(d){
 if(!d||!d.health)return '<span class="chip warn">not answering</span>';
 const h=d.health;
 return `<span class="chip${warnUnless(h.status==='healthy')}">${escapeHtml(h.status||'unknown')}</span>`
   +` <span class="mono dim">live ${h.live?'yes':'no'} · ready ${h.ready?'yes':'no'}</span>`;
}

/* Which drawer pane is out, or null. One value rather than two open flags: the
   panel is one drawer showing one thing, and two booleans would allow a state
   the layout has no way to draw. */
/* Which model answers, and where the choice comes from.
 *
 * The chat screen offered RAVIS's routing profiles and nothing else, which is
 * the right default — choosing a model per request is what RAVIS is *for*, and
 * a pool stays correct as the catalogue changes. But with four providers
 * configured there was no way to say "this one, now", which is what somebody
 * comparing two models needs, and no way to see what was even available.
 *
 * A pinned model is addressed `ravis/<provider>/<model>`, which is RAVIS's own
 * direct-address form: it names the upstream outright and is the only way to
 * reach a model two providers both serve. Anthropic's models are on Anthropic
 * and on OpenRouter, and those are different routes with different prices.
 */
const MODELPICK={
 /* Pools and per-provider models, once per open. Not cached across opens: a
    provider keyed or filtered in another tab should show up, and this list is
    four small reads against loopback. */
 state:null,

 async load(){
  const node=()=>document.getElementById('modelPickList');
  if(!node())return;
  const groups=[];
  let profiles={items:[]};
  try{profiles=await API.ravis.profiles()}catch(e){}
  if((profiles.items||[]).length){
   groups.push({name:'RAVIS pools',
     hint:'RAVIS picks the model per request, and keeps picking as the catalogue changes.',
     items:(profiles.items||[]).map(p=>({id:p.profile_id,label:p.profile_id,
       note:p.default?'default':''}))});
  }
  /* **Upstreams, not credentials.** This listed only providers with a stored
     key, so LM Studio and Ollama never appeared — a local runtime needs no
     credential, which meant the one place to pick a model offered every cloud
     model and none of the twenty on the machine. `/api/v1/providers` lists
     every declared upstream and says which are local. */
  let providers={items:[]};
  try{
   const r=await fetch(BASE.ravis+'/api/v1/providers',
     {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
   if(r.ok)providers=await r.json();
  }catch(e){}
  /* Enabled, and either local or holding a credential. A row for a provider
     that cannot answer is an invitation to pick a model and get a refusal. */
  const usable=(providers.items||[]).filter(
    c=>c.enabled!==false&&(c.local||c.credential_configured));
  for(const provider of usable){
   const ids=await this.catalogue(provider.name);
   if(!ids.length)continue;
   groups.push({name:provider.label||provider.name, local:Boolean(provider.local),
     hint:provider.local
       ? `on this machine · ${ids.length} model(s) · nothing leaves the machine and nothing is billed`
       : `pinned to this provider · ${ids.length} model(s) pass its filter`,
     items:ids.map(id=>({id:`ravis/${provider.name}/${id}`,label:id,
       note:provider.local?'local':''}))});
  }
  this.state={groups,q:''};
  this.render();
 },

 /* One provider's *selected* models — what its filter lets through, which is
    what the operator chose to expose. Paged to exhaustion for the same reason
    the Providers picker is: a list that omits a model is one nobody can pick. */
 async catalogue(name){
  const ids=[];
  let offset=0;
  try{
   while(offset!==null){
    const r=await fetch(BASE.ravis+'/api/v1/providers/'+encodeURIComponent(name)
      +'/catalogue?offset='+offset+'&limit=500',{signal:AbortSignal.timeout(8000)});
    if(!r.ok)return ids;
    const page=await r.json();
    ids.push(...(page.items||[]).filter(i=>i.selected).map(i=>i.id));
    offset=page.next_offset;
   }
  }catch(e){}
  return ids;
 },

 render(){
  const list=document.getElementById('modelPickList');
  if(!list||!this.state)return;
  const q=this.state.q;
  const current=CHAT_SESSION.profile;
  /* Matches the model, the group it is in, and where it runs — so `local`
     finds the on-machine models and `openai` finds that provider's, neither of
     which every id spells out. */
  const hit=(g,i)=>!q || i.label.toLowerCase().includes(q)
    || g.name.toLowerCase().includes(q)
    || (g.name==='RAVIS pools'?'pool':'remote cloud api').includes(q)
    || (g.local?'local on-machine':'').includes(q);
  const shown=this.state.groups
    .map(g=>({...g,items:g.items.filter(i=>hit(g,i))}))
    .filter(g=>g.items.length);
  if(!shown.length){list.innerHTML='<div class="picker-empty">nothing matches that.</div>';return}
  list.innerHTML=shown.map(g=>`<div class="pick-group"><b>${escapeHtml(g.name)}</b>
    <small class="mono dim">${escapeHtml(g.hint)}</small></div>
   ${g.items.map(i=>`<button class="pick-row${i.id===current?' on':''}"
     onclick="MODELPICK.pick('${escapeHtml(i.id).replace(/'/g,'&#39;')}')">
     <span>${escapeHtml(i.label)}</span>
     ${i.note?`<em>${escapeHtml(i.note)}</em>`:''}
     ${i.id===current?'<em>in use</em>':''}</button>`).join('')}`).join('');
 },

 search(q){
  if(!this.state)return;
  this.state.q=(q||'').trim().toLowerCase();
  this.render();
 },

 pick(id){
  CHAT_SESSION.profile=id;
  CHAT_SESSION.drawer=null;
  /* Not saved to the stored conversation. The profile travels with each request
     and NERVIS records it per turn, so a conversation that switched models
     halfway keeps both facts rather than being retconned to the latest one. */
  render();
 },
};

/* Rendered synchronously and filled in after, because the drawer opens on a
   render pass and the catalogue is four network reads away. */
function modelPane(){
 queueMicrotask(()=>MODELPICK.load());
 const pinned=String(CHAT_SESSION.profile||'').startsWith('ravis/')
   && String(CHAT_SESSION.profile||'').split('/').length>2;
 return `<div class="picker-head" style="margin:0 0 8px">
   <input class="picker-search mono" placeholder="filter models…"
     oninput="MODELPICK.search(this.value)">
  </div>
  <div id="modelPickList" class="picker-list" style="max-height:none;grid-template-columns:1fr;border-top:0;padding-top:0">
   <div class="picker-empty">reading catalogues…</div>
  </div>
  <small class="mono dim">a <b>pool</b> lets RAVIS choose per request and keeps working as models come and go. Pinning names one upstream outright — the only way to reach a model two providers both serve, and Anthropic's models are on Anthropic <i>and</i> on OpenRouter at different prices. ${pinned?'<b>Pinned right now</b>, so RAVIS is not choosing and a model that stops being offered becomes a refusal rather than a fallback.':''} Only providers that are keyed <i>and</i> reachable are listed, and only the models their filter lets through.</small>`;
}

/* The fold-out panel: model, parameters, history.
   Extracted because `chatView` hit the complexity gate the moment a third pane
   was added — which is the gate doing its job, since a screen function that
   also renders three alternative panels is two jobs. */
function chatDrawerMarkup(){
 return `<aside class="chat-drawer"${CHAT_SESSION.drawer?' data-open':''} aria-hidden="${CHAT_SESSION.drawer?'false':'true'}">
   <header>${{model:'Model',history:'History'}[CHAT_SESSION.drawer]||'Parameters'}
    <span class="mono dim" style="margin-left:auto;text-transform:none;letter-spacing:0">esc to close</span></header>
   <div class="drawer-body">
   ${CHAT_SESSION.drawer==='model'?modelPane():CHAT_SESSION.drawer==='history'?(()=>{
     const saved=CHAT_STORE.read().filter(c=>c.conversation_id!==CHAT_SESSION.id);
     return saved.length?`${saved.map(c=>`<div class="trace-step" style="align-items:flex-start">
        <b style="min-width:0"><a href="#" onclick="CHAT_SESSIONS.open('${escapeHtml(c.conversation_id)}');return false" style="color:inherit">${escapeHtml(c.title||c.conversation_id)}</a></b>
        <span class="mono dim">${escapeHtml(String(c.updated_at||'').slice(0,16).replace('T',' '))} · ${(c.messages||[]).length} msg
        <button class="btn" style="margin-left:6px" onclick="CHAT_SESSIONS.remove('${escapeHtml(c.conversation_id)}')">Delete</button></span></div>`).join('')}
      <small class="mono dim">stored in this browser only — <b>not</b> on the machine and not in any service. Another browser, or a private window, sees none of it. §7.2 keeps conversations local by default.</small>`
      :`<small class="mono dim">no other conversation is stored in this browser. §7.2 keeps them local by default, so another browser or a private window sees none of it.</small>`;
    })():`
   <div class="param-grid">
    <label>System prompt
     <textarea id="cpSystem" rows="3" placeholder="empty — no system message is sent"
       oninput="CHAT_SESSION.system=this.value">${escapeHtml(CHAT_SESSION.system)}</textarea></label>
    <label>Temperature
     <input id="cpTemp" class="mono" inputmode="decimal" placeholder="model default"
       value="${escapeHtml(String(CHAT_SESSION.temperature))}"
       oninput="CHAT_SESSION.temperature=this.value"></label>
    <label>Max tokens
     <input id="cpMax" class="mono" inputmode="numeric" placeholder="model default"
       value="${escapeHtml(String(CHAT_SESSION.max_tokens))}"
       oninput="CHAT_SESSION.max_tokens=this.value"></label>
    <label>Top&nbsp;p
     <input id="cpTopP" class="mono" inputmode="decimal" placeholder="model default"
       value="${escapeHtml(String(CHAT_SESSION.top_p))}"
       oninput="CHAT_SESSION.top_p=this.value"></label>
   </div>
   <label class="adv-toggle"><input type="checkbox"${CHAT_SESSION.advanced?' checked':''}
     onchange="CHAT_SESSION.advanced=this.checked;render()"> Advanced sampling</label>
   ${CHAT_SESSION.advanced?`<div class="param-grid adv">
    ${ADVANCED_PARAMS.map(p=>`<label>${p.label}
     <input class="mono" inputmode="${p.mode||'decimal'}" placeholder="${escapeHtml(p.hint)}"
       value="${escapeHtml(String(CHAT_SESSION[p.key]))}"
       oninput="CHAT_SESSION['${p.key}']=this.value" title="${escapeHtml(p.help)}"></label>`).join('')}
    <label style="grid-column:1/-1">Stop sequences
     <input class="mono" placeholder="comma separated — empty sends none"
       value="${escapeHtml(String(CHAT_SESSION.stop))}"
       oninput="CHAT_SESSION.stop=this.value"></label>
   </div>
   <small class="mono dim">these are the knobs <b>LM Studio</b> exposes, and they travel to any provider RAVIS reaches <b>transparently</b> — every local runtime, OpenAI, Google and OpenRouter — where the upstream itself decides whether it understands each one. <b>Anthropic is the exception</b>: it is reached through a translating adapter that normalises a request to a fixed shape, so the sampling knobs are dropped there rather than refused. A parameter that works on one provider and quietly does nothing on another is worth knowing about before you spend an afternoon on it.</small>`:''}
   <small class="mono dim">an empty field is <b>not sent at all</b>, so the model and runtime apply their own defaults — filling one in with a common value like 0.7 would be this page inventing a choice nobody made.</small>`}
   </div></aside>`;
}

/* The sampling parameters behind the Advanced toggle, modelled on LM Studio's
   own set. Data rather than markup so the form, the session and the request
   body stay one list — adding a knob used to be three edits, and the one that
   got forgotten produced a control that visibly did nothing. */
const ADVANCED_PARAMS=[
 {key:'top_k',label:'Top&nbsp;k',mode:'numeric',hint:'model default',
  help:'Sample only from the k most likely tokens. Lower is more focused.'},
 {key:'min_p',label:'Min&nbsp;p',hint:'model default',
  help:'Drop tokens below this fraction of the most likely one. An alternative to top-p.'},
 {key:'frequency_penalty',label:'Frequency penalty',hint:'model default',
  help:'Discourage repeating a token in proportion to how often it has appeared.'},
 {key:'presence_penalty',label:'Presence penalty',hint:'model default',
  help:'Discourage repeating any token that has appeared at all.'},
 {key:'repetition_penalty',label:'Repetition penalty',hint:'model default',
  help:'The local-runtime spelling of the same idea. Not an OpenAI parameter.'},
 {key:'seed',label:'Seed',mode:'numeric',hint:'random each time',
  help:'Ask for a reproducible sample. Honoured by some providers and ignored by others.'},
];

function chatDrawer(pane){
 CHAT_SESSION.drawer = CHAT_SESSION.drawer===pane ? null : pane;
 render();
}

 /* Whether anything is in force. A parameters panel that folds away must not
    fold away the fact that a system prompt is set — the dot on the button is
    what keeps that visible with the drawer shut. */
 const c=CHAT_SESSION;
 return Boolean(String(c.system).trim() || String(c.temperature).trim()
   || String(c.max_tokens).trim() || String(c.top_p).trim());
}

function savedCount(){
 return CHAT_STORE.read().filter(c=>c.conversation_id!==CHAT_SESSION.id).length;
}


async function chatDecision(id){
 /* The chat screen's own lookup, deliberately not `API.ravis.routeDecision`.

    That one is a *mock* the RAVIS dashboard is written against — it expects
    `eligible`, `affinity`, `timings_ms` and a `requirements` object, none of
    which a real decision record carries. Repurposing it for live data broke
    that dashboard, which is the argument for a screen owning its own adapter
    rather than reaching into a shared one shaped for somebody else. */
 try{
  const r=await fetch(BASE.ravis+'/api/v1/route-decisions?limit=50',
    {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!r.ok)return null;
  return ((await r.json()).items||[]).find(x=>x.decision_id===id)||null;
 }catch(e){return null}
}

/* Every numeric generation parameter, in the order the drawer shows them.
   One list rather than a call per field: adding a knob was three edits — the
   session, the form and the body builder — and the third was the one that got
   forgotten, which produces a control that visibly does nothing. */
/* What a bubble shows while it is still waiting.
   Dots until the first token arrives, then the text with a caret after it —
   two different statements, and the caret alone made the first look like the
   second. */
function pendingTail(text){
 if(!CHAT_SESSION.busy)return '';
 return text ? '<span class="stream-caret">▌</span>'
   : '<span class="typing-dots" aria-label="waiting for a reply"><i></i><i></i><i></i></span>';
}

const CHAT_NUMERIC=['temperature','max_tokens','top_p','top_k','min_p',
  'frequency_penalty','presence_penalty','repetition_penalty','seed'];

function chatRequestBody(conversationId){
 /* Built from what is set, and nothing else. An empty box means the field is
    omitted from the request entirely rather than sent as null or as a default
    picked here — the model and the runtime own their own defaults, and §14's
    rule about never presenting a guess as a measurement has an equivalent here:
    do not present a guess as a choice.

    **NERVIS's shape since M4, not RAVIS's.** It used to assemble the whole
    `messages` array here, which meant the browser owned the conversation and
    NERVIS could not have stored it even if it wanted to. Now the last message
    goes up and NERVIS supplies the history it already holds — one copy, on the
    side that persists it. */
 const c=CHAT_SESSION;
 const last=[...c.messages].reverse().find(m=>m.role==='user'&&!m.pending);
 const system=String(c.system).trim();
 const body={content:last?last.text:'',profile:c.profile};
 if(conversationId)body.conversation_id=conversationId;
 if(system)body.system=system;
 const num=(v,key)=>{const t=String(v).trim();if(t==='')return;
   const n=Number(t);if(Number.isFinite(n))body[key]=n};
 for(const key of CHAT_NUMERIC)num(c[key],key);
 /* Stop sequences are a list on the wire and a comma-separated line in the box,
    because typing JSON into a settings field is not a settings field. Empty
    entries are dropped rather than sent as `""`, which every provider treats as
    "stop immediately". */
 const stops=String(c.stop||'').split(',').map(t=>t.trim()).filter(Boolean);
 if(stops.length)body.stop=stops;
 return body;
}

/* One SSE body as a stream of parsed frames.
 *
 * Read by hand rather than with `EventSource`: that one cannot POST, cannot
 * send a body and cannot be aborted, which rules out all three things a chat
 * turn needs.
 *
 * Extracted from `sendChat`, which measured **cyclomatic complexity 41** — the
 * worst function in this file by a wide margin — with the reader, the decoder,
 * the buffer, the frame splitting, the JSON parsing and the reply assembly all
 * in one scope. The parsing has nothing to do with the conversation; separating
 * them means the tangle is now two ordinary jobs.
 *
 * Yields `{frame}` for a data frame and `{error:true}` for the stream's own
 * error event. `[DONE]` and unparseable payloads are skipped here rather than at
 * the caller, because "what is a frame" is this function's question. */
async function* sseFrames(body){
 const reader=body.getReader(),decoder=new TextDecoder();
 let buffer='';
 for(;;){
  const {value,done}=await reader.read();
  if(done)return;
  buffer+=decoder.decode(value,{stream:true});
  const parts=buffer.split('\n\n');
  buffer=parts.pop();
  for(const part of parts){
   for(const line of part.split('\n')){
    if(line.startsWith('event: error')){yield{error:true};continue}
    if(!line.startsWith('data:'))continue;
    const payload=line.slice(5).trim();
    if(payload==='[DONE]')continue;
    let frame;
    try{frame=JSON.parse(payload)}catch(e){continue}
    yield{frame};
   }
  }
 }
}

/* What one finished turn became, as a message. Pure: no DOM, no session, no
   fetch — which is what makes the four outcomes readable side by side instead of
   spread down a ladder inside `sendChat`.

   The four are genuinely different and none of them may borrow another's
   explanation. That was a real defect: stopping a reasoning model before it
   produced text fell through to the budget-exhaustion branch and announced "the
   model spent its whole budget on reasoning", which is a confident diagnosis of
   something that did not happen. */
function replyMessage({reply,failed,aborted,reasoning,served,requestId}){
 const base={role:'assistant',served,request_id:requestId};
 if(failed)return{...base,text:failed};
 if(aborted)return{...base,interrupted:true,
   /* What the reader saw, kept, and labelled stopped rather than finished.
      NERVIS stored the same partial with `interrupted` set, so the two agree. */
   text:reply?reply+'\n\n— stopped —':'— stopped before the model produced anything —'};
 if(reply)return{...base,text:reply};
 /* An empty answer is almost never an empty answer. On this corpus it is a
    reasoning model spending the whole budget thinking — SIRVIS measured exactly
    that on both Gemma-4 builds, 253 of 256 tokens with no answer — and the
    frames say so if anyone counts them. "(empty response)" would hide a cause
    the stream was carrying. */
 return{...base,reasoningOnly:true,
   text:reasoning
    ? `No answer. The model spent its whole budget on reasoning (${reasoning} frames) and stopped before producing any. Raise Max tokens.`
    : 'The model returned an empty message.'};
}

/* One arriving frame, folded into the accumulator.
   Pure apart from the repaint, which is why it is out here rather than inside
   the stream loop: `sendChat` measured cyclomatic complexity 30 — the joint
   highest in the file — and the only way to get coverage on this logic without
   a running model was to make it a function that takes a frame and returns
   nothing but its effect on an object. `tools/shaping_check.js` now feeds it
   recorded frames. */
function frameDelta(frame){return((frame.choices||[{}])[0]||{}).delta||{}}

function absorbFrame(item,acc,paint){
 if(item.error){acc.failed='stream';return}
 const frame=item.frame;
 /* A refusal arrives as an error marker followed by the frame carrying the
    reason, so the second frame is read only once the first has been seen. */
 if(acc.failed==='stream'){acc.failed=frame.message||'RAVIS refused mid-stream';return}
 const delta=frameDelta(frame);
 if(delta.content){acc.reply+=delta.content;if(paint)paint()}
 /* Counted, not shown. Reasoning tokens are the model thinking, not its
    answer — but a reply that is *only* reasoning needs explaining, and the
    count is the explanation. */
 if(delta.reasoning_content)acc.reasoning++;
 acc.served=frame.model||acc.served;
}

/* Why a request was refused, from the error envelope if there is one. */
async function refusalMessage(r){
 const d=await r.json().catch(()=>({}));
 return (d.error&&(d.error.message||d.error))||('NERVIS returned HTTP '+r.status);
}

/* A stop is not a failure and must not borrow a failure's explanation.
   Without the distinction, stopping a reasoning model before it produced any
   text rendered "the model spent its whole budget on reasoning — raise Max
   tokens", which is a confident diagnosis of something that did not happen. */
function transportFailure(e){
 const aborted=e.name==='AbortError';
 return{aborted,failed:aborted?'':'NERVIS is not reachable: '+e.message};
}

/* The user's turn and the placeholder the stream paints into. */
function stageTurn(text){
 CHAT_SESSION.busy=true;
 CHAT_SESSION.messages.push({role:'user',text});
 if(CHAT_SESSION.messages.length===1)CHAT_SESSION.title=text.slice(0,42);
 CHAT_SESSION.messages.push({role:'assistant',text:'',pending:true});
}

/* **Through NERVIS since M4, and streamed.** This used to POST straight to
   RAVIS and wait for a whole completion — a blank screen for however long a
   local model took, and a conversation that lived only in `localStorage` and
   vanished with the browser profile.

   NERVIS forwards RAVIS's SSE frames unchanged, so what arrives here is exactly
   OpenAI's shape; what NERVIS adds is storing both turns and cancelling RAVIS
   when this connection goes away. */
async function streamReply(stop){
 const acc={reply:'',requestId:'',served:'',
   conversationId:CHAT_SESSION.remote_id||'',reasoning:0,failed:'',aborted:false};
 const node=()=>document.getElementById('streaming');
 const paint=()=>{const el=node();if(el)el.innerHTML='<b>NERVIS</b><br>'+escapeHtml(acc.reply)+
   pendingTail(acc.reply);scrollChatToEnd()};
 try{
  const r=await fetch(BASE.nervis+'/api/v1/chat',{
   method:'POST',headers:{'content-type':'application/json'},signal:stop.signal,
   body:JSON.stringify(chatRequestBody(acc.conversationId))});
  acc.requestId=r.headers.get('x-request-id')||'';
  acc.conversationId=r.headers.get('x-conversation-id')||acc.conversationId;
  if(!r.ok)acc.failed=await refusalMessage(r);
  else for await(const item of sseFrames(r.body))absorbFrame(item,acc,paint);
 }catch(e){Object.assign(acc,transportFailure(e))}
 return acc;
}

/* Correlate the reply with the decision RAVIS recorded for it. NERVIS looks it
   up by the request id it sent, so the link is exact rather than "the most
   recent decision" — which would be wrong the moment two requests overlap. */
async function attachRouteDecision({requestId,failed}){
 if(!requestId||failed)return;
 try{
  const rd=await fetch(BASE.nervis+'/api/v1/ravis/routes/for/'+encodeURIComponent(requestId),
    {signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!rd.ok)return;
  const hit=(await rd.json()).decision;
  if(hit)CHAT_SESSION.messages[CHAT_SESSION.messages.length-1].route_decision_id=hit.decision_id;
 }catch(e){}
}

async function sendChat(){
 const box=document.getElementById('chatInput');
 const text=(box&&box.value||'').trim();
 if(!text||CHAT_SESSION.busy)return;
 box.value='';
 stageTurn(text);
 /* **Awaited.** `render()` refetches this screen's profiles and decisions, so
    leaving it unawaited meant the reply bubble did not exist for the first
    second — and every delta arriving before it was written into nothing. The
    text still appeared, because the repaint writes the whole accumulated
    string rather than appending, but the first second was blank: exactly the
    blank screen streaming exists to remove. */
 await render();

 const stop=new AbortController();
 CHAT_SESSION.abort=stop;
 const outcome=await streamReply(stop);

 CHAT_SESSION.busy=false;
 CHAT_SESSION.abort=null;
 CHAT_SESSION.remote_id=outcome.conversationId;
 CHAT_SESSION.messages.pop();
 CHAT_SESSION.messages.push(replyMessage(outcome));
 await attachRouteDecision(outcome);
 /* NERVIS stored both turns already; this keeps the browser copy for the case
    the page is opened from disk with nothing running. */
 CHAT_STORE.save(CHAT_SESSION);
 render();
}

/* Stop a reply in flight. Aborting the fetch closes the connection, NERVIS's
   relay sees the disconnect, cancels RAVIS and stores the partial text — so
   stopping keeps what was said rather than discarding it. */
function stopChat(){if(CHAT_SESSION.abort)CHAT_SESSION.abort.abort()}

    {method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({secret})});

/* RAVIS's own health, read live.
   `ravis conformance clarvis` is a CLI command with no HTTP surface, so the
   conformance table cannot be read from anywhere and stays prototype. What
   *is* readable is whether RAVIS's upstream answers, how quickly, and how many
   models it can see. */
async function ravisHealth(){
 try{
  const r=await fetch(BASE.ravis+'/api/v1/health',{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});

 }catch(e){return null}
}

}

  : 'Every breaker closed and every enabled provider answering.';

}

function unavailablePoolsCard(down){

  ? down.map(x=>`<div class="trace-step"><b>${x.pool_id}</b><span>${x.reason||'no member satisfies its invariants'}</span></div>`).join('')

  : `<div class="trace-step"><b>all pools</b><span>at least one member</span></div><small class="mono dim">every published pool can be served.</small>`;

}

$ ${se.terminal.cmd}
${se.terminal.output}</div>
  <div class="statusbar">${se.branch}　✓　Ln ${se.cursor.line}, Col ${se.cursor.col}　Spaces: ${se.indent}　${se.encoding}　${se.language}</div>
 </div>`}

/* async because the views await real endpoints. With mocks these resolve on the
   same tick, so nothing changes today — and nothing changes when they stop being
   mocks either, which is the point. */
/* Which screens show invented data (M18a and the sweep of 2026-08-24).
   
   A screen is listed here when some or all of what it renders has no endpoint
   behind it. `live:` names the cards on that screen that *are* real, so a mixed
   screen fades only the invented half — the alternative, one flag per screen,
   would either fade a working table or leave a fabricated one bright.

   The rule this enforces is the ecosystem rule stated on the Settings screen: a
   control that implies an endpoint exists is the one thing the dashboard must
   not do. This is the same rule applied to *numbers*. */
const PROTOTYPE={
 nervis:{'Overview':1,
         /* Chat is a real RAVIS client — live profiles, real completions, and
            the route decision behind each reply. The map draws the registry,
            which reads /ecosystem/identity, and asks the Clarvis bridge rather
            than inventing workspaces. */
         /* Events and Traces are no longer listed. Traces reads RAVIS's route
            decisions; Events reads each service's declared capability state,
            which is the honest live fact about a feed that does not exist. */
         'Diagnostics':1,'Settings':1,
         /* System is no longer listed: its KPI strip, machine card and runtime
            list all read SIRVIS's /api/v1/system and /api/v1/runtimes. The one
            card still inventing anything is `Conditions`, marked below. */},
 /* The service dashboards were the worst of it: SIRVIS's rendered from nine
    sources of which two were live. Seven are live now — everything except the
    catalogue and the download queue, neither of which SIRVIS publishes an
    endpoint for at all. A landing screen full of confident invented numbers is
    the most misleading page in the build, because it is the first one anyone
    sees, so the ones that remain are the ones with nothing behind them.

    `Benchmarks` stays listed for the same reason as RAVIS's Routes: it reads
    the run history live and falls back to a transcription when SIRVIS is not
    answering, and that fallback must not render unlabelled. Its cards carry
    `.live` when the read succeeded. */
 sirvis:{'Dashboard':1,'Discover':1,'Benchmarks':1,'Downloads':1},
 /* Every one of these stays listed, and Routes and Policies are why the flag
    is per *card* rather than per screen.

    Both read live and both keep a transcription for the case where RAVIS is not
    answering — Routes has no decision records to show on a fresh start, and
    Policies would otherwise render four invented rules. Taking them off this
    list would leave that fallback rendering **unlabelled**, which is the one
    outcome worse than a faded card: invented data at full contrast.

    So the banner stays and `.live` does the work. A live read shows at full
    contrast, the fallback fades, and neither has to be predicted here. */
 ravis:{'Dashboard':1,'Routes':1,'Providers':1,'Policies':1,'Evidence':1,
        'Logs':1,'Diagnostics':1,'Settings':1},
 clarvis:{'*':1}};

function prototypeNote(){
 const map=PROTOTYPE[state.app]||{};
 if(!(map[state.view]||map['*']))return '';
 return `<div class="wip-note"><b>Prototype.</b> Faded cards on this screen render
  invented data — there is no endpoint behind them yet. Anything at full contrast is
  read from a running service. Hover a faded card to read it.</div>`;
}

function markPrototype(){
 const map=PROTOTYPE[state.app]||{};
 const box=$('#content');
 if(!box)return;
 if(map[state.view]||map['*']){
  box.setAttribute('data-wip','');
  /* Prepended here rather than by each view, so a screen added later inherits
     the label instead of being forgotten. */
  if(!box.querySelector('.wip-note'))box.insertAdjacentHTML('afterbegin',prototypeNote());
 }else{
  box.removeAttribute('data-wip');
 }
}

/* Screens safe to repaint under the poll: pure display, no input to lose.

   Chat has a half-typed message, Settings has toggles somebody is mid-way
   through, and the service dashboards have popovers that a rebuild would close.
   Repainting those on a timer would be a worse bug than the stale reading it
   fixes, so the list is an allowlist rather than an exclusion — a screen added
   later is not live until somebody says it is. */
/* Events joins the live views: it is a feed, and a feed that only updated when
   somebody navigated is a list of what had happened by the time they last
   clicked. Its filter inputs live in `EVENT_FILTERS` rather than the DOM, so a
   repaint cannot lose half-typed text. */
const LIVE_VIEWS={nervis:['Overview','Ecosystem map','System','Events']};

/* How often the dashboard re-reads the registry. NERVIS itself probes every 20
   seconds, so anything faster only re-reads the same answer; anything much
   slower makes the bar wrong for longer than it takes somebody to notice. */
const POLL_MS=8000;

async function pollRegistry(){
 /* The status bar's own source, independent of whatever screen is open.

    Before this, the bar was only as fresh as the last navigation — open LM
    Studio and nothing changed until you clicked something, and even then the
    bar lagged the table beneath it by one paint. M1's exit says the dashboard
    updates live and this is the half that was missing. */
 try{
  const r=await fetch(BASE.nervis+'/api/v1/services',{signal:AbortSignal.timeout(LIVE_TIMEOUT_MS)});
  if(!r.ok)return;
  absorbRegistry(await r.json());
 }catch(e){
  /* NERVIS itself is not answering. The bar keeps its last reading rather than
     blanking: "I cannot reach the registry" is not "everything is down", and
     the age stamp beside it is what stops the difference being invisible. */
  return;
 }
 globalStatus();
 const live=(LIVE_VIEWS[state.app]||[]).includes(state.view);
 /* Not while a popover is open: a rebuild would close it under the cursor. */
 if(live&&!document.querySelector('.route-pop'))await repaint();
}

async function repaint(){
 /* Re-render the current screen without losing where the reader was. */
 const y=window.scrollY;
 await render();
 window.scrollTo(0,y);
}

async function render(){applyTheme();globalStatus();nav();$('#avatarSlot').innerHTML=avatar();
 if(state.app==='nervis')await nervis();if(state.app==='sirvis')await sirvis();
 if(state.app==='ravis')await ravis();if(state.app==='clarvis')await clarvis();markPrototype();replaceClarvisPanelAvatar();hydrateAvatarFrames();paintZen();
 /* Again, after the screen has fetched. The first call paints the bar
    immediately so it is never blank; this one corrects it with whatever the
    screen just learned. Cheap — it reads variables and writes two nodes. */
 globalStatus();syncPanelAvatar()}
/* Place an opened routing popover, and keep only one open.

   `<details>` supplies the toggle, the keyboard handling and Escape; what it
   cannot do is escape a scrolling ancestor, so the panel is `position:fixed`
   and gets its coordinates here. It flips above the marker when there is not
   room below, and is clamped to the viewport so a bubble near the right edge
   does not push it off screen. */
function placeRoutePopover(details){
 const pop=details.querySelector('.route-pop');
 const mark=details.querySelector('summary');
 if(!pop||!mark)return;
 /* Anchored without ever measuring the panel.

    Reading `offsetHeight` here proved unreliable — the panel is measured while
    still mid-flow and reports a height it will not have once positioned, which
    put it off the bottom of the screen. So the two cases are expressed with the
    edge that is actually known: opening downward pins `top` to the marker's
    bottom, opening upward pins `bottom` to the marker's top. Neither needs to
    know how tall the panel is, and `max-height` is set to the space that
    remains so it can never overrun whichever way it opened.

    `window.innerHeight` is not always trustworthy either — an embedded or
    freshly-hidden pane can report 0 — so the document element is the fallback. */
 /* Clamped, not merely defaulted: a collapsed pane can report a *small*
    height as readily as a zero one, and either turns the arithmetic below into
    a panel positioned off-screen. Observed repeatedly while testing, with the
    same pane alternating between 720 and 0 across consecutive reads. */
 const vh=Math.max(window.innerHeight||document.documentElement.clientHeight||0,480);
 const vw=Math.max(window.innerWidth||document.documentElement.clientWidth||0,640);
 const m=mark.getBoundingClientRect();
 const w=Math.min(460,vw*0.72);
 const below=vh-m.bottom-16, above=m.top-16;
 pop.style.left=Math.round(Math.min(Math.max(8,m.right-w),vw-w-8))+'px';
 if(below>=Math.min(220,above)){
  pop.style.top=Math.round(m.bottom+6)+'px';
  pop.style.bottom='auto';
  pop.style.maxHeight=Math.round(below)+'px';
 }else{
  pop.style.top='auto';
  pop.style.bottom=Math.round(vh-m.top+6)+'px';
  pop.style.maxHeight=Math.round(above)+'px';
 }
}
document.addEventListener('toggle',e=>{
 const d=e.target;
 if(!d.classList||!d.classList.contains('route-info'))return;
 if(!d.open)return;
 document.querySelectorAll('details.route-info[open]').forEach(o=>{if(o!==d)o.open=false});
 placeRoutePopover(d);
},true);

/* Highlight only. It used to end with notify('Selection updated'), which was a
   claim that something had been updated — nothing had. Under the same rule the
   rest of this file follows, a control must not imply an effect it does not
   have, and a toast is a control's way of saying it worked. */
function selectOne(el,selector){$$(selector).forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function notify(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>t.classList.remove('show'),2300)}/* An absent figure, rendered as absent. Used wherever SIRVIS reports a machine
   fact it cannot detect — the enclosure name, the at-rest memory baseline, and
   the model budget derived from that baseline. Printing `null` or defaulting to
   a number would both be worse: one looks broken, the other looks measured. */
function orUnknown(v,suffix){return v==null?'<span class="mono" style="opacity:.5">not detected</span>':v+(suffix||'')}
/* An absent value, said once.
 *
 * `dash(x)` appeared forty-one times across the view functions, and every one of
 * them counted as a branch — which is most of the reason a dozen render
 * functions sat between ten and fifteen on the complexity gate while containing
 * no decision a reader would recognise as one. The branch still exists; it
 * exists **here**, once, instead of at each of forty-one call sites.
 *
 * Falsy rather than nullish on purpose: it replaces `||`, and an empty string
 * rendered as an empty cell is the bug this dash was always there to prevent.
 */
function dash(value){return value||'—'}

/* A chip's warning modifier, said once.
 *
 * `${warnUnless(ok)}` and its inverse appeared thirty-seven times, each one a
 * branch on the complexity gate and none of them a decision — the class list
 * of a status chip is a *rendering* of a boolean, not a choice about one. The
 * two spellings exist because the sense of the boolean differs by call site:
 * `warnUnless(healthy)` and `warnIf(broken)` both read correctly, and one of
 * them read backwards at half the sites.
 */
function warnUnless(ok){return ok?'':' warn'}
function warnIf(bad){return bad?' warn':''}

function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
/* The Simulate dock is gone. It cycled `SERVICES[k].state` by hand so that a
   screen could be seen with a dependency missing, back when nothing was running
   and `SERVICES` was the only source of a state. Every screen that mattered now
   reads a live registry, and the honest way to see one without SIRVIS is to
   stop SIRVIS — which also exercises the timeouts, the fallbacks and the empty
   catalogue that a flipped enum never did.

   `SERVICES` survives as the from-disk fallback and nothing writes to it. */
/* Focus is template-side because it must be: the dashboard's own chrome is not
   reachable from inside the editor's document. The real build pairs this with
   workbench.action.toggleZenMode over the Bridge, using the same closed enum as
   the view commands — presentation only, no new authority. */
function paintZen(){const b=document.getElementById('zenToggle');
 if(b)b.textContent=document.body.classList.contains('zen')?'Exit focus':'Focus'}
function setZen(on){document.querySelector('.app').classList.toggle('zen',on);document.body.classList.toggle('zen',on);paintZen();syncPanelAvatar();
 /* focusClarvisCommand('workbench.action.toggleZenMode') once the Bridge exists */}
addEventListener('keydown',e=>{if(e.key==='Escape')setZen(false)});
/* The wordmark is a home link: back to the NERVIS overview from anywhere,
   including a Clarvis workspace in focus mode. Same state reset as a tab click. */
const goHome=()=>{setZen(false);state.app='nervis';state.view='Overview';render()};
$('#brandHome').onclick=goHome;
$('#brandHome').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goHome()}};
$$('.tab').forEach(t=>t.onclick=()=>{setZen(false);state.app=t.dataset.app;state.view=APP_CONFIG[state.app].nav[0];render()});
render();

/* Start polling the registry, and stop while the tab is hidden.

   A background tab polling a local service forever is the kind of thing that
   shows up as a laptop running warm with no visible cause, and this page is
   meant to be left open. `visibilitychange` also fires on the way back, which
   is when a reading is most likely to be wrong — so returning to the tab
   refreshes immediately rather than waiting out the interval. */
let POLL_TIMER=null;
function startPolling(){
 if(POLL_TIMER===null)POLL_TIMER=setInterval(pollRegistry,POLL_MS);
}
function stopPolling(){
 if(POLL_TIMER!==null){clearInterval(POLL_TIMER);POLL_TIMER=null}
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){stopPolling()}
 else{pollRegistry();startPolling()}
});
pollRegistry();
startPolling();
</script></body></html>
