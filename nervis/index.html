   <small class="mono dim">this chain is the key every benchmark result is filed under. Collapse any link of it and you get <b>model → score</b>, which is the one shape SIRVIS is not allowed to publish.</small>`,'sirvis')}</div>
  <div class="card narrow"><h3>Memory</h3>${cell(`
   <div class="trace-step"><b>resident</b><span>${resident.toFixed(1)} GB</span></div>
   <div class="bar"><i style="--w:${Math.round(resident/mc.memory_gb*100)}%"></i></div>
   <div class="trace-step"><b>available</b><span>${mc.available_gb} GB</span></div>
   <div class="trace-step"><b>swap</b><span>${mc.swap_gb} GB</span></div>
   <small class="mono dim">${mc.system_baseline_gb==null?'<b>the at-rest baseline is not detected.</b> It is this machine with an or':`the ${mc.system_baseline_gb} GB baseline is this machine with an or`}dinary working set open — editor, browser, LM Studio — before any model loaded, so the usable budget is ${mc.model_budget_gb==null?'<b>not detected</b> — the at-rest figure was measured by hand and nothing computes it, so this page will not guess at it':`about ${mc.model_budget_gb} GB rather than ${mc.memory_gb}`}. Whether two builds fit together is still a measurement and not this subtraction — see Runtime sets.</small>`,'sirvis')}</div>`}

/* Discover — the model browser. SIRVIS.md §8 splits Models into Installed /
   Discover / Downloads, and this is the middle one: search a remote catalog,
   filter it, and queue a download as a persistent job.

   The filter state is module-level and the results repaint on their own, because
   re-running render() on every keystroke would rebuild #content and take the
   caret out of the search box with it. In the real build these three values are
   query parameters on /api/v1/catalog — the catalog is remote and much larger
   than one page of it, so filtering client-side is a property of the mock and not
   of the design. */
const DISCOVER={q:'',runtime:'all',installed:'all'};
function discoverFilter(items){
 const q=DISCOVER.q.trim().toLowerCase();
 return items.filter(x=>
  (DISCOVER.runtime==='all'||x.runtime===DISCOVER.runtime)
  &&(DISCOVER.installed==='all'||(DISCOVER.installed==='yes')===x.installed)
  &&(!q||`${x.family} ${x.variant} ${x.architecture} ${x.quantization} ${x.source}`.toLowerCase().includes(q)));}
/* One row. The disk arithmetic is SIRVIS.md §8's rule rendered per candidate:
   size against free space, and what is left afterwards — checked before the job
   is queued rather than discovered when the last byte fails to land. */
function discoverRows(items,free){
 if(!items.length)return `<div class="table-row"><span style="grid-column:1/-1;opacity:.6">no catalog entry matches these filters</span></div>`;
 return items.map(x=>{const after=+(free-x.size_gb).toFixed(1),tight=after<0||after<free*0.1;
  return `<div class="table-row seven"><span>${x.family}</span><span class="mono">${x.variant}</span><span class="mono" style="opacity:.75">${x.runtime} · ${x.quantization}</span><span>${x.params_b?x.params_b+' B':'<small style="opacity:.45">unknown</small>'}${x.tools_measured?` <span class="chip${warnUnless(x.tools)}" title="measured">${x.tools_measured.join('/')}</span>`:x.tools?' <span class="chip" title="published claim, not measured" style="opacity:.6">claims</span>':''}</span><span>${x.size_gb} GB</span><span class="mono"${tight?' style="color:#ffb648"':''}>${after<0?'does not fit':after+' GB left'}</span><span>${x.installed
   ?'<span class="chip">installed</span>'
   :(after<0?`<button class="btn" disabled title="insufficient disk" style="opacity:.45;cursor:not-allowed">Download</button>`:control('Download','download'))}</span></div>`}).join('')}
async function sirvisDiscover(){
 heading('Discover','Search the catalog, check it against this machine, and queue the download as a job.');
 const [cat,mc]=await Promise.all([API.sirvis.catalog(),API.sirvis.machine()]);
 const free=mc.disk_free_gb;
 const installed=cat.items.filter(x=>x.installed).length;
 const runtimes=[...new Set(cat.items.map(x=>x.runtime))];
 /* Repaints the result rows only, so the search field keeps focus and caret. */
 window.paintDiscover=()=>{const box=$('#discoverRows');if(!box)return;
  const hits=discoverFilter(cat.items);box.innerHTML=discoverRows(hits,free);
  $('#discoverCount').textContent=`${hits.length} of ${cat.items.length}`};
 const chip=(group,val,label)=>`<button class="mode-chip${DISCOVER[group]===val?' on':''}" onclick="DISCOVER.${group}='${val}';selectOne(this,'[data-filter=${group}] .mode-chip');paintDiscover()">${label}</button>`;
 $('#content').innerHTML=kpis([
   ['Catalog',String(cat.items.length),'entries on this page','sirvis'],
   ['Installed',`${installed} / ${cat.items.length}`,'already on disk','sirvis'],
   ['Disk free',free+' GB',`${stamp(SERVICES.sirvis.age)}`,'sirvis'],
   ['Smallest',Math.min(...cat.items.filter(x=>!x.installed).map(x=>x.size_gb))+' GB',
    'of what is not installed','sirvis']])
 +`<div class="card full"><h3>Catalog <span class="chip" id="discoverCount">${cat.items.length} of ${cat.items.length}</span></h3>${cell(`
   <div class="profile-row"><input id="discoverQ" placeholder="Search family, architecture, quantization or source…" style="flex:1;min-width:220px" oninput="DISCOVER.q=this.value;paintDiscover()">
    <span data-filter="runtime">${chip('runtime','all','Any runtime')}${runtimes.map(r=>chip('runtime',r,r)).join('')}</span>
    <span data-filter="installed">${chip('installed','all','Any state')}${chip('installed','no','Not installed')}${chip('installed','yes','Installed')}</span></div>
   <div class="table-row head seven"><span>Family</span><span>Variant</span><span>Runtime · quant</span><span>Params · tools</span><span>Size</span><span>Disk after</span><span>Action</span></div>
   <div id="discoverRows">${discoverRows(cat.items,free)}</div>
   <small class="mono dim">the disk check runs before the job is queued: ${free} GB free, and each row says what would be left. A build that does not fit cannot be started — SIRVIS never auto-deletes a model to make room for another one.<br>the tools column reads two different ways on purpose: an installed build shows <b>calls made / attempted</b> from a real run, and a catalogue entry shows <b>claims</b>, which is the publisher's word and nothing more. On this machine those two disagree about four builds, so the distinction is not pedantry.</small>`,'sirvis')}</div>
  <div class="card wide"><h3>What the catalog does not tell you</h3>${cell(`
   <div class="table-row head"><span>Question</span><span style="grid-column:2/-1">Answered by</span></div>
   <div class="table-row"><span>Will it download?</span><span style="grid-column:2/-1;opacity:.75">this page — size against ${free} GB of free disk</span></div>
   <div class="table-row"><span>Will it load?</span><span style="grid-column:2/-1;opacity:.75">a load attempt against ${mc.memory_gb} GB of memory on ${mc.model||mc.chip||'this machine'}</span></div>
   <div class="table-row"><span>Will it be any good at your work?</span><span style="grid-column:2/-1;opacity:.75">a benchmark run, per role — nothing on this page predicts it</span></div>
   <div class="table-row"><span>Will it run alongside your other model?</span><span style="grid-column:2/-1;opacity:.75">a Runtime set measurement, which is a separate subject again</span></div>
   <small class="mono dim">file size is a fact about the disk, not about the machine. Parameter count and quantization are the two numbers most often used to guess the other three answers, and guessing them is exactly what SIRVIS exists to stop.</small>`,'sirvis')}</div>
  <div class="card narrow"><h3>Sources</h3>${cell([...new Set(cat.items.map(x=>x.source))].map(s=>`
   <div class="trace-step"><b>${s}</b><span>${cat.items.filter(x=>x.source===s).length} entries</span></div>`).join('')
   +`<small class="mono dim">the catalog provider is a field, not an assumption: LM Studio's index first, others later. A build's source travels with it into the evidence record, because the same family from two publishers is not guaranteed to be the same weights.</small>`,'sirvis')}</div>`;
 paintDiscover()}

/* Benchmarks — the job queue. `state` is the closed contract enum consumers switch
   on; `detail` carries the internal phase and is display-only. A partial result is
   kept and labelled, because three good runs are evidence of something and
   throwing them away to keep the table tidy loses real measurement. */
async function sirvisBenchmarks(){
 const j=await API.sirvis.jobs();
 /* The button is a demo everywhere, but only says so when the rest of the
    screen is real. A live screen with a dead primary control is the exact thing
    `AGENTS.md` forbids: it looks finished. */
 heading(j.source==='live'?'Benchmark runs':'Benchmark queue',
  j.source==='live'
   ?'Real runs on this machine and the contract state each ended in. There is no queue yet — §11.10\'s job machinery is unbuilt, so nothing is ever pending.'
   :'Jobs, their contract state, and the internal phase that rides alongside it.',
  j.source==='live'
   ?`<button class="btn" disabled title="no submit endpoint yet — §11.10's queue is unbuilt">New benchmark</button>`
   :control('New benchmark','runBenchmark',' primary'));
 const by=s=>j.items.filter(x=>x.state===s).length;
 const partial=j.items.find(x=>x.state==='partial');
 $('#content').innerHTML=kpis([
   ['Running',String(by('running')),'warmups are not scored','sirvis'],
   ['Succeeded',String(by('succeeded')),'complete run sets','sirvis'],
   ['Partial',String(by('partial')),'kept, never discarded','sirvis'],
   ['Failed',String(by('failed')),'no result written','sirvis']])
 +`<div class="card full${j.source==='live'?' live':''}"><h3>Queue</h3>${cell(`
   <div class="table-row head six"><span>Job</span><span>Suite</span><span>Target</span><span>Submitted</span><span>State</span><span>Progress</span></div>
   ${j.items.map(x=>`<div class="table-row six"><span class="mono">${x.job_id}</span><span class="mono">${x.suite}</span><span>${x.target}</span><span class="mono">${x.submitted}</span><span class="chip${warnUnless(x.state==='succeeded'||x.state==='running')}">${x.state}</span><span>${x.progress==null?'':`<div class="bar" style="margin:0"><i style="--w:${Math.round(x.progress*100)}%"></i></div>`}<small class="mono" style="opacity:.55">${x.detail||(x.progress==null?'ran to completion':'—')}</small></span></div>`).join('')}
   <small class="mono dim">a successful HTTP request is not a successful benchmark. Cancellation is idempotent, and a job that ends early ends in <b>partial</b> or <b>failed</b> — never silently in <b>succeeded</b>.</small>`,'sirvis')}</div>
  <div class="card wide${j.source==='live'?' live':''}"><h3>State versus detail</h3>${cell(`
   <div class="table-row head"><span>Contract state</span><span>Jobs</span><span style="grid-column:3/-1">What a consumer may rely on</span></div>
   <div class="table-row"><span class="mono">running</span><span>${by('running')}</span><span style="grid-column:3/-1;opacity:.75">work is in progress; no result exists yet</span></div>
   <div class="table-row"><span class="mono">succeeded</span><span>${by('succeeded')}</span><span style="grid-column:3/-1;opacity:.75">a complete result set was written and is scoreable</span></div>
   <div class="table-row"><span class="mono">partial</span><span>${by('partial')}</span><span style="grid-column:3/-1;opacity:.75">fewer runs than requested; the result exists and says so</span></div>
   <div class="table-row"><span class="mono">failed</span><span>${by('failed')}</span><span style="grid-column:3/-1;opacity:.75">no result — the reason is in detail, never inferred from silence</span></div>
   <small class="mono dim">the internal phase (<b>${(j.items.find(x=>x.detail)||{}).detail||'none carried by these runs'}</b>) rides in <b>detail</b> and may change without a contract change. Switching on it is how a consumer breaks on a SIRVIS release that promised nothing.</small>`,'sirvis')}</div>
  <div class="card narrow${j.source==='live'?' live':''}"><h3>Partial result</h3>${cell(partial?`
   <div class="trace-step"><b>job</b><span>${partial.job_id}</span></div>
   <div class="trace-step"><b>suite</b><span>${partial.suite}</span></div>
   <div class="trace-step"><b>reached</b><span>${partial.progress==null?'—':Math.round(partial.progress*100)+'%'}</span></div>
   <div class="trace-step"><b>why</b><span>${dash(partial.detail)}</span></div>
   <small class="mono dim">the runs it did complete are kept and the shortfall is stated. Thermal aborts are a property of this machine on this day — discarding them would hide exactly the condition a local benchmark exists to catch.</small>`:`
   <div class="trace-step"><b>none</b><span>no run here ended partial</span></div>
   <small class="mono dim">the card stays rather than disappearing. <b>partial</b> is a state §11.10 names and this engine can reach — fewer runs than requested, the ones that completed kept — and an empty card says the state exists and has not occurred. A card that vanished would say the opposite by saying nothing.</small>`,'sirvis')}</div>`}

/* Runtime sets — combination evidence. The entire reason this screen exists is
   that per-member numbers do not predict the pair, and this run is the cleanest
   possible demonstration: memory behaved exactly as arithmetic predicted, and
   behaviour did not. A build that recovers correctly from a failed tool call when
   it is alone stopped calling the tool at all with a second model resident, in
   two different ways, and nothing in its solo record hints at it. */
async function sirvisRuntimeSets(){
 heading('Runtime sets','Measured combinations. Memory held; behaviour did not — and only the pair measurement shows it.');
 const rs=await API.sirvis.runtimeSet();
 /* A follow-up outcome of null is *unmeasured*, not a failure. Counting nulls
    as degradation would report every pairing as broken the moment the column
    lost its source. */
 const known=p=>(p.follow_up||[]).filter(f=>f!=null);
 const degraded=rs.pairs.filter(p=>known(p).some(f=>f!=='used-result'&&f!=='never-reached'));
 const anyFollowUp=rs.pairs.some(p=>known(p).length);
 const withPeak=rs.pairs.filter(p=>p.peak_gb!=null);
 const heaviest=withPeak.length?withPeak.reduce((a,b)=>b.peak_gb>a.peak_gb?b:a):null;
 const gbOr=v=>v==null?'—':v+' GB';
 const short=n=>n.replace(/^(lmstudio-community|mlx-community)\//,'').replace('-instruct','');
 $('#content').innerHTML=kpis([
   ['Pairings',String(rs.pairs.length),'measured co-resident','sirvis'],
   ['Heaviest',heaviest?gbOr(heaviest.peak_gb):'—',heaviest?'resident, no swap':'peak memory not on this record','sirvis'],
   ['Degraded',anyFollowUp?String(degraded.length):'—',anyFollowUp?'on behaviour, not memory':'no tool-call trial yet (M13)','sirvis'],
   ['Evidence',rs.samples+' runs',prov(rs.evidence_type)+' per pairing','sirvis']])
 +`<div class="card full"><h3>Every measured pairing</h3>${cell(`
   <div class="table-row head six"><span>Build A</span><span>Build B</span><span>Peak</span><span>First token</span><span>Follow-up</span><span>Note</span></div>
   ${rs.pairs.map(p=>{const bad=known(p).some(f=>f!=='used-result'&&f!=='never-reached');
    return `<div class="table-row six"><span>${short(p.members[0])}</span><span>${short(p.members[1])}</span><span class="mono">${gbOr(p.peak_gb)}</span><span class="mono">${p.first_token_s.map(v=>v==null?'—':v).join(' · ')}s</span><span class="chip${warnIf(bad)}">${known(p).length?p.follow_up.join(' · '):'—'}</span><span style="opacity:.7">${p.note}</span></div>`}).join('')}
   <small class="mono dim">${SOURCE.sirvis==='live'
     ?`the follow-up column is the interesting half of this screen and it has no source yet: nothing has asked these builds to call a tool while a second model is resident. <b>TrialRate</b> exists on the evidence record and is constructed nowhere — that is <b>M13</b>. Peak memory is absent for a different reason: M10's matrix carries it, but the rows were added after the only run that exists, so this run's figures are in its telemetry rather than on this record.`
     :`holding two builds costs almost nothing up to ${heaviest?heaviest.peak_gb:'—'} GB resident, and every pairing still clears the deadlines — the first-token penalty is a few hundred milliseconds. That is the finding that makes a two-model setup worth having, and it is the boring half. The interesting half is the follow-up column.`}</small>`,'sirvis')}</div>
  <div class="card wide"><h3>${rs.name} <span class="chip">rev ${rs.revision}</span></h3>${cell(`
   <div class="table-row head six"><span>Role</span><span>Build</span><span>Alone</span><span>Co-resident</span><span>Concurrent</span><span>Follow-up</span></div>
   ${rs.members.map(m=>{const n=(v,u)=>v==null?'—':v+(u||'');
    return `<div class="table-row six"><span>${m.role}</span><span>${m.family}</span><span class="mono">${n(m.first_token_alone_s,'s')} · ${n(m.alone_tok_s,' tok/s')}</span><span class="mono">${n(m.sequential_tok_s,' tok/s')}</span><span class="mono">${n(m.first_token_concurrent_s,'s')} · ${n(m.concurrent_tok_s,' tok/s')}</span><span class="chip">${m.follow_up_concurrent==null?'—':m.follow_up_concurrent}</span></div>`}).join('')}
   <small class="mono dim">${rs.finding}. ${SOURCE.sirvis==='live'
     ?`Co-resident is both models loaded with one generating; concurrent is both generating at once. The gap between those two columns is the whole reason a pair is its own subject — co-residency is nearly free and concurrency is not, and no single-model run produces either number. Follow-up is absent because no tool-call trial exists yet (M13).`
     :`Sustained rate under contention was not measured for this pair, so <b>concurrent_tok_s</b> is null rather than carrying the solo figure — which would have read as "no degradation found" when nothing looked.`}</small>`,'sirvis')}</div>
  <div class="card narrow"><h3>Validity</h3>${cell(Object.entries(rs.validity).map(([k,v])=>`<div class="trace-step"><b>${k.replace(/_/g,' ')}</b><span>${v}</span></div>`).join('')
   +`<small class="mono dim">the measurement is valid and the combination is a bad idea. Those are different statements, kept in different fields — validity says the run can be trusted, and the finding above says what it found.</small>`,'sirvis')}</div>
  <div class="card wide"><h3>Why the pair is its own subject</h3>${cell(`
   <div class="trace-step"><b>predicted from members</b><span>fits · both clear every deadline</span></div>
   <div class="trace-step"><b>measured as a pair</b><span>fits · both clear every deadline</span></div>
   <div class="trace-step"><b>predicted from members</b><span>recovers from a failed tool call</span></div>
   <div class="trace-step"><b>measured as a pair</b><span>${SOURCE.sirvis==='live'?'not measured — no tool-call trial yet (M13)':'stops calling the tool'}</span></div>
   <small class="mono dim">${SOURCE.sirvis==='live'
     ?`measured on this machine: co-residency cost almost nothing and concurrency cost a third to a half of throughput, which no single-model run predicts. The behaviour half of that argument is still unmeasured here — it needs the tool-call trial M13 brings — so this card currently makes the memory case and only half the case it was built for.`
     :`the memory prediction was right and the behaviour prediction was wrong, which is the case against benchmarking members and inferring the set. The same build failed differently in each pairing — <b>no-call</b> at ${rs.pairs[1]?rs.pairs[1].peak_gb:'—'} GB and <b>gave-up</b> at ${rs.pairs[4]?rs.pairs[4].peak_gb:'—'} GB — so it is not one repeatable fault with a single cause either.`}</small>`,'sirvis')}</div>`}

/* Results — what the suite actually found, which includes what it failed to find.
   Two of the four accuracy measures did not discriminate at all, and saying so is
   the result: eight identical scores presented as a ranking would be a table that
   looks like evidence and contains none. */
async function sirvisResults(){
 const [ev,rn]=await Promise.all([API.sirvis.evidence(),API.sirvis.runs()]);
 /* Which SIRVIS answered is part of the result, not a footnote. A screen that
    looks identical whether it is showing this machine or a transcription of an
    older run is the one way this page could lie without a wrong number in it. */
 heading('Results',ev.source==='live'
   ?'Live from SIRVIS on this machine. Rate and first token are measured; the accuracy suites are not built yet.'
   :'Rate, first token and behaviour. Two of the four accuracy measures found no difference at all — that is a result.');
 const m=ev.items.filter(e=>e.evidence_type==='MEASURED');
 /* Sorted by rate, then the builds that have no rate — appended rather than
    filtered out. A build that produced no visible output is a result, and
    dropping it from the table because it has no bar to draw would turn the
    worst outcome in the run into a blank space nobody counts. */
 const withRate=m.filter(e=>e.metrics.generation_tok_s).sort((a,b)=>b.metrics.generation_tok_s-a.metrics.generation_tok_s);
 const noRate=m.filter(e=>!e.metrics.generation_tok_s);
 const rated=[...withRate,...noRate];
 const top=withRate[0],caveats=m.filter(e=>e.caveat);
 const warned=m.filter(e=>e.warnings&&e.warnings.length);
 const fastLine=e=>e.metrics.first_token_s!=null?e.metrics.first_token_s+'s':'—';
 /* A record either carries a capability measure or it does not, and the two
    live side by side once a live run sits next to a transcribed one. */
 const carrying=n=>m.filter(e=>e.metrics[n]);
 /* The context is printed only where one build appears at more than one of
    them. Two rows for a build are not a duplicate — the runtime loaded it
    differently, which §12.2 makes a different identity and a different result —
    but two rows that *look* identical and disagree read as a bug, and the field
    that explains them is the one nobody thought to print. */
 const contexts={};m.forEach(e=>{const k=e.target.family+e.target.variant;
   (contexts[k]=contexts[k]||new Set()).add((e.target.runtime_config||{}).context_length)});
 const ctx=e=>{const c=(e.target.runtime_config||{}).context_length;
   return c&&contexts[e.target.family+e.target.variant].size>1
     ? ' · '+Math.round(c/1024)+'K ctx' : ''};
 const consistent=(e,n)=>e.metrics[n]&&e.metrics[n][0]===e.metrics[n][1];
 $('#content').innerHTML=kpis([
   ['Measured',String(m.length),'builds through the suite','sirvis'],
   ['Rate spread',withRate.length?`${withRate[withRate.length-1].metrics.generation_tok_s}–${top.metrics.generation_tok_s}`:'—',`tok/s · ${noRate.length} produced none`,'sirvis'],
   /* Absent, not zero. `0 / 0` reads as "measured and found nothing"; the
      truth is that no suite here measures tool calls yet (M13) or code (M18),
      and a dash with a reason is the only honest cell. */
   ['Tool calls',carrying('tool_calls').length?`${carrying('tool_calls').filter(e=>consistent(e,'tool_calls')).length} / ${carrying('tool_calls').length}`:'—',
    carrying('tool_calls').length?'clean in every attempt':'no suite here measures tool calls yet','sirvis'],
   ['Code',carrying('code').length?`${carrying('code').filter(e=>consistent(e,'code')).length} / ${carrying('code').length}`:'—',
    carrying('code').length?'6 of 6 — no variance at all':'accuracy suites are M18','sirvis']])
 +`<div class="card full"><h3>Generation rate</h3>${cell(`
   <div class="benchmark-stage" style="height:170px;gap:7px">${withRate.map(e=>`<i style="--h:${Math.round(e.metrics.generation_tok_s/top.metrics.generation_tok_s*100)}%" title="${e.target.family} · ${e.metrics.generation_tok_s} tok/s"></i>`).join('')}${noRate.map(e=>`<i style="--h:2%;opacity:.35" title="${e.target.family} · no visible output"></i>`).join('')}</div>
   <div class="table-row head six"><span>Build</span><span>Generating</span><span>Effective</span><span>First token</span><span>Tools</span><span>Follow-up</span></div>
   ${rated.map(e=>`<div class="table-row six"><span>${e.target.family} <small class="mono" style="opacity:.5">${e.target.variant}${ctx(e)}</small></span><span class="mono">${e.metrics.generation_tok_s?e.metrics.generation_tok_s+' tok/s':'<span style="color:#ffb648">no output</span>'}</span><span class="mono">${dash(e.metrics.effective_tok_s)}</span><span class="mono">${fastLine(e)}</span><span class="mono"${e.metrics.tool_calls&&!consistent(e,'tool_calls')?' style="color:#ffb648"':''}>${e.metrics.tool_calls?e.metrics.tool_calls.join('/'):'<span class="dim">—</span>'}</span><span class="${e.metrics.follow_up?'chip'+(e.metrics.follow_up==='used-result'?'':' warn'):'dim'}">${dash(e.metrics.follow_up)}</span></div>`).join('')}
   <small class="mono dim"><b>Generating</b> is the sustained rate once the model is talking. <b>Effective</b> counts from the request being sent, so it carries prompt processing and any preamble before visible content. Here the two are within about 5% everywhere, which is itself the finding — none of these front-load. The distinction exists because a rejected build had a healthy generating rate and <b>27 seconds</b> of silence in front of it, and a table with only the first column would have recommended it.</small>`,'sirvis')}</div>

/* ── RAVIS SCREENS ─────────────────────────────────────────────────────────
   RAVIS owns every figure on these pages except the benchmark evidence, which is
   SIRVIS's and is labelled as such — that split is the point of the Evidence
   screen. The recurring discipline here is the difference between a constraint
   and a score: hard constraints eliminate candidates before ranking, so an
   excluded row never carries a number, and NO_ROUTE is a result rather than a
   failure. */

/* Routes — one decision, in full. The funnel is derived from the record itself
   (eligible + excluded → eligible) rather than captioned, so it cannot drift away
   from the data underneath it. */
/* The Recent-decisions caption, which used to assume a NO_ROUTE row was present.

   It always was in the mock — the fixture carries one deliberately — and it never
   is against a service that is working, so wiring the real endpoint made the
   Routes screen throw. Derived from the rows actually in hand rather than from
   one the fixture happened to include. */
function noRouteNote(req){
 const refused=req.items.find(r=>r.result==='NO_ROUTE');
 if(refused&&refused.reason)return refused.reason+'. ';
 const refusals=req.items.filter(r=>r.result==='NO_ROUTE').length;
 return refusals?`${refusals} of these were refused. `:'None of these were refused. ';
}
/* The Routes screen, from RAVIS's own decision records.
 *
 * What the live record carries and the mock invented are different sets, and
 * the difference is the point of wiring it: there is no per-candidate `score`,
 * no per-candidate `ttft_s` and no phase breakdown of the routing time. RAVIS
 * publishes none of those — ranking on quality is M13, and nothing instruments
 * the decision in phases — so a live screen shows the funnel and the reasons
 * instead of a bar chart of numbers nobody measured.
 *
 * What it gains is the half that matters during an incident: **why each
 * candidate was excluded**, in RAVIS's own words.
 */
function exclusionSummary(excluded){
 /* Grouped by reason, never listed. A pool with six hundred candidates excludes
    five hundred and eighty of them, and the card that used to render one row
    each was forty thousand characters nobody read. The reason is the finding;
    the model list behind it is a detail. */
 const byReason={};
 for(const e of excluded||[]){
  for(const reason of (e.reasons||['unstated'])){
   (byReason[reason]=byReason[reason]||[]).push(e.model);
  }
 }
 return Object.entries(byReason).sort((a,b)=>b[1].length-a[1].length);
}

function decisionCard(d){
 const reqs=(d.requirements||[]).filter(r=>r&&r!=='none');
 return `<div class="card wide live"><h3>${escapeHtml(d.pool||d.requested||'')} · decision ${escapeHtml((d.decision_id||'').slice(0,12))}</h3>${cell(`
   <div class="trace-step"><b>requested</b><span class="mono">${escapeHtml(dash(d.requested))}</span></div>
   <div class="trace-step"><b>selected</b><span class="mono">${escapeHtml(d.selected||'no route')}</span></div>
   <div class="trace-step"><b>path</b><span class="mono">${escapeHtml(dash(d.execution_path))}</span></div>
   ${reqs.length?`<div class="trace-step"><b>required</b><span class="mono">${reqs.map(escapeHtml).join(' · ')}</span></div>`
     :'<div class="trace-step"><b>required</b><span style="opacity:.7">nothing — the request carried no hard constraint</span></div>'}
   <small class="mono dim">${escapeHtml(d.reason||'')}</small>`,'ravis')}</div>`;
}

function funnelCard(d){
 const groups=exclusionSummary(d.excluded);
 const considered=(d.considered||[]).length;
 const eligible=considered-(d.excluded||[]).length;
 return `<div class="card wide live"><h3>Constraint funnel <span class="chip">${eligible} of ${considered} survived</span></h3>${cell(`
   ${groups.length?`<div class="table-row head"><span>Removed because</span><span>Count</span><span style="grid-column:3/-1">For example</span></div>
   ${groups.map(([reason,models])=>`<div class="table-row">
     <span style="opacity:.85">${escapeHtml(reason)}</span>
     <span class="mono">${models.length}</span>
     <span class="mono" style="grid-column:3/-1;opacity:.6">${escapeHtml(models.slice(0,3).join(', '))}${models.length>3?' …':''}</span></div>`).join('')}`
   :'<div class="trace-step"><b>excluded</b><span>none — every candidate satisfied this pool</span></div>'}
   <small class="mono dim">grouped by reason rather than listed per model: a pool with six hundred candidates excludes most of them, and the reason is the finding. These are <b>hard</b> constraints — a candidate removed here never reached ranking, so none of them has an ordering to show. <b>There is no per-candidate score.</b> RAVIS publishes none: ranking on quality is M13, and inventing one to fill this column is exactly what §9.4 rules out.</small>`,'ravis')}</div>`;
}

function attemptsCard(d){
 const attempts=(d.execution||{}).attempts||[];
 const stopped=(d.execution||{}).stopped_because;
 return `<div class="card narrow live"><h3>Fallback chain</h3>${cell(`
   <div class="trace-step"><b>primary</b><span class="mono">${escapeHtml(d.selected||'—')}</span></div>
   ${(d.fallbacks||[]).map((f,i)=>`<div class="trace-step"><b>fallback ${i+1}</b><span class="mono">${escapeHtml(f)}</span></div>`).join('')}
   ${attempts.length?`<div class="trace-step" style="margin-top:6px"><b>attempted</b><span></span></div>
   ${attempts.map((a,i)=>`<div class="trace-step"><b>${i+1}</b><span class="mono">${escapeHtml(a.model)} → <span class="chip${warnUnless(a.outcome==='succeeded')}">${escapeHtml(a.outcome)}</span>${a.detail?' · '+escapeHtml(a.detail):''}</span></div>`).join('')}`:''}
   ${stopped?`<div class="trace-step"><b>stopped</b><span style="opacity:.75">${escapeHtml(stopped)}</span></div>`:''}
   <small class="mono dim">every entry satisfies the same hard constraints and the same pool invariant — a fallback is a different candidate, never a relaxed one. The attempts below are what actually happened, which is not always the chain above.</small>`,'ravis')}</div>`;
}

function recentDecisionsCard(items){
 return `<div class="card full live"><h3>Recent decisions</h3>${cell(`
   <div class="table-row head five"><span>At</span><span>Requested</span><span>Selected</span><span>Path</span><span>Outcome</span></div>
   ${items.map(d=>`<div class="table-row five">
     <span class="mono">${escapeHtml(clockOf(d.decided_at))}</span>
     <span class="mono">${escapeHtml(dash(d.requested))}</span>
     <span class="mono">${escapeHtml(d.selected||'no route')}</span>
     <span class="mono" style="opacity:.75">${escapeHtml(dash(d.execution_path))}</span>
     <span class="chip${warnUnless(outcomeOf({selected:d.selected,execution:d.execution})==='succeeded'||Boolean(d.selected))}">${escapeHtml(outcomeOf({selected:d.selected,execution:d.execution}))}</span></div>`).join('')}
   <small class="mono dim">held in memory only — §17 does not list route decisions as stored state, so a restart loses them and that is the intended trade. <b>NO_ROUTE is a first-class result</b>: it means a hard constraint could not be satisfied and RAVIS refused rather than routing around it.</small>`,'ravis')}</div>`;
}

function liveRoutesScreen(decisions,prof){
 const newest=decisions[0];
 const active=prof.items.find(p=>p.profile_id===CHAT_SESSION.profile)||prof.items.find(p=>p.default)||prof.items[0];
 const considered=(newest.considered||[]).length;
 const eligible=considered-(newest.excluded||[]).length;
 $('#content').innerHTML=kpis([

   ['Path',dash(newest.execution_path),'transparent vs translated','ravis',true]])
 +decisionCard(newest)+funnelCard(newest)+attemptsCard(newest)+recentDecisionsCard(decisions);
}

async function ravisRoutes(){
 heading('Routes','One decision record: requirements, the constraint funnel, the ranking, and what it cost to decide.',

 const [live,prof]=await Promise.all([API.ravis.decisions(25),API.ravis.profiles()]);

 if(live.live)return liveRoutesScreen(live.items,prof);
 const [rd,req]=await Promise.all([API.ravis.routeDecision(),API.ravis.requests()]);
 const ekind={MEASURED_BY_SIRVIS:'MEASURED',OBSERVED_BY_RAVIS:'MEASURED',PROVIDER_METADATA:'ESTIMATED',ESTIMATED:'ESTIMATED',UNKNOWN:'UNKNOWN'};
 const considered=rd.eligible.length+rd.excluded.length;
 const phases=Object.entries(rd.timings_ms).filter(([k])=>k!=='total');
 const active=prof.items.find(p=>p.profile_id===CHAT_SESSION.profile)||prof.items.find(p=>p.default);
 $('#content').innerHTML=kpis([

 +`<div class="card wide"><h3>${rd.pool} · decision ${rd.decision_id}</h3>${cell(`
   <div class="table-row head"><span>Requirement</span><span>Value</span><span style="grid-column:3/-1">Effect</span></div>
   <div class="table-row"><span>tools</span><span class="mono">${rd.requirements.tools}</span><span style="grid-column:3/-1;opacity:.75">a candidate that failed the tool probe is removed, not down-ranked</span></div>
   <div class="table-row"><span>minimum_context</span><span class="mono">${rd.requirements.minimum_context.toLocaleString()}</span><span style="grid-column:3/-1;opacity:.75">a smaller context window is ineligible — the request is never truncated to fit one</span></div>
   <small class="mono dim">eligible after hard constraints, ranked by preference</small>

   <small class="mono dim">removed before scoring — a constraint, not a ranking</small>
   <div class="route-lanes">${rd.excluded.map(x=>`<div class="lane excluded"><b>${x.target}</b><span>—</span><small>${x.constraint}</small></div>`).join('')}</div>
   <small class="mono dim">${rd.excluded.length} of ${considered} candidates never reached the scoring phase, so none of them has a score to show. Selected: <b>${rd.eligible.find(c=>c.selected).target}</b> over ${rd.execution_path} — and note that it is not the top score. <b>${rd.eligible.reduce((a,b)=>(b.score||0)>(a.score||0)?b:a).target}</b> scores higher on provider metadata, costs €0.004 a call, crosses the network and is currently behind a half-open breaker. The Auto profile weighs those against a local build that is already resident; a different profile reaches a different answer from the same candidates.</small>`,'ravis')}</div>
  <div class="card narrow"><h3>Where the ${rd.timings_ms.total} ms went</h3>${cell(
   phases.map(([k,v])=>`<div class="wf"><span>${k}</span><div class="track"><i style="left:0;width:${Math.round(v/rd.timings_ms.total*100)}%"></i><b style="left:8px">${v} ms</b></div></div>`).join('')
   +`<small class="mono dim">routing is rules and cached evidence, not a model deciding about models. The whole decision costs ${rd.timings_ms.total} ms against a ${rd.eligible.find(c=>c.selected).ttft_s}s time to first token — three orders of magnitude below the thing it is choosing.</small>`,'ravis')}</div>
  <div class="card narrow"><h3>Fallback chain</h3>${cell(`
   <div class="trace-step"><b>primary</b><span>${rd.eligible.find(c=>c.selected).target.split(' · ')[0]}</span></div>
   ${rd.fallbacks.map((f,i)=>`<div class="trace-step"><b>fallback ${i+1}</b><span>${f.split(' · ')[0]}</span></div>`).join('')}
   <small class="mono dim">every entry satisfies the same hard constraints and the same pool invariant — a fallback is a different candidate, never a relaxed rule. A user cancelling is not a failure and never advances this chain.</small>`,'ravis')}</div>
  <div class="card wide"><h3>Recent decisions</h3>${cell(`
   <div class="table-row head five"><span>Pool</span><span>Model</span><span>Path</span><span>TTFT</span><span>Result</span></div>
   ${req.items.map(r=>`<div class="table-row five"><span class="mono">${r.pool}</span><span>${dash(r.model)}</span><span class="mono">${dash(r.execution_path)}</span><span>${r.ttft_s?r.ttft_s+'s':'—'}</span><span class="chip${warnUnless(['OK','CANCELLED'].includes(r.result))}">${r.result}</span></div>`).join('')}
   <small class="mono dim">${noRouteNote(req)}NO_ROUTE is a first-class result: it failed closed on a constraint rather than reaching for a provider that would have satisfied the request and broken the promise.</small>`,'ravis')}</div>`}

/* Pools — a pool is its invariants, and on this machine every one of them has a
   member, so the interesting question is not which pool is empty but who is in
   the strictest one and who is not. The membership card answers that per build,
   because a derived count nobody can audit is just a number with better manners. */
/* One pool, with its membership picker folded underneath.
   A pool is its invariants and picks from whatever satisfies them — the right
   default, and what keeps it working as a catalogue changes. With six hundred
   models across four providers that is a wider net than most people want
   `ravis/fast` casting, so the picker is an optional *narrowing*: tick fewer,
   and the pool chooses among those. Tick everything and it goes back to
   choosing for itself. */
/* Narrowing a pool to the models an operator wants it choosing among.
   The same shape as the provider picker, and deliberately so — one interaction
   learned once. What differs is what the list contains: a provider's picker
   offers its whole catalogue, and a pool's offers only what already satisfies
   that pool's invariants, because everything else is not a choice. */
const POOLEDIT={
 state:{},

 toggle(key){
  const panel=document.getElementById('pm-'+key);
  if(!panel)return;
  const opening=panel.style.display==='none';
  panel.style.display=opening?'block':'none';
  if(opening)this.load(key);
 },

 async load(key){
  const list=document.getElementById('pml-'+key);
  if(!list)return;
  list.innerHTML='<div class="picker-empty">reading candidates…</div>';
  try{
   const r=await fetch(BASE.ravis+'/api/v1/pools/'+encodeURIComponent(key)+'/members',
     {signal:AbortSignal.timeout(15000)});
   if(!r.ok){list.innerHTML=`<div class="picker-empty">RAVIS refused: HTTP ${r.status}</div>`;return}
   const d=await r.json();
   if(!(d.items||[]).length){
    list.innerHTML=`<div class="picker-empty">no model satisfies this pool’s invariants right now${d.locality==='local'?' — no local runtime is answering, and this pool never leaves this machine':''}.</div>`;
   }
   this.state[key]={all:(d.items||[]).map(i=>i.id),
     remote:new Set((d.items||[]).filter(i=>i.remote).map(i=>i.id)),
     tier:Object.fromEntries((d.items||[]).map(i=>[i.id,i.tier||''])),
     price:Object.fromEntries((d.items||[]).map(i=>[i.id,i.price_per_million])),
     on:new Set((d.items||[]).filter(i=>i.selected).map(i=>i.id)),
     narrowed:d.narrowed, defaultTier:d.default_tier||'', q:'', ceiling:null};
   this.explain(key,d);
   this.render(key);
  }catch(e){list.innerHTML='<div class="picker-empty">RAVIS is not reachable.</div>'}
 },

 /* The prices present in this pool's candidates, ascending, deduplicated.
    The slider steps through *these* rather than across a linear dollar range,
    because the distribution is nothing like linear: hundreds of models sit at
    exactly zero and a handful cost ninety dollars a million, so a linear slider
    spends nine tenths of its travel in empty space and cannot separate the
    cheap end at all. Stepping through the actual values gives every position
    something to select. */
 priceSteps(key){
  const st=this.state[key];
  if(!st)return[];
  const known=st.all.map(id=>st.price[id]).filter(p=>typeof p==='number');
  return [...new Set(known)].sort((a,b)=>a-b);
 },

 setCeiling(key,percent){
  const st=this.state[key];
  const steps=this.priceSteps(key);
  if(!st||!steps.length)return;
  const index=Math.round((Number(percent)/100)*(steps.length-1));
  /* The top of the slider means *no ceiling*, not "the most expensive model" —
     those differ the moment a pricier model appears, and only one of them is
     what someone dragging to the far right meant. */
  st.ceiling=Number(percent)>=100?null:steps[index];
  this.render(key);
 },

 /* Tick everything at or under the ceiling, and untick the rest.
    A separate button rather than something the slider does on its own: moving a
    slider is exploring, and a control that rewrote a selection on every pixel
    of travel would destroy a hand-made one before its owner let go. */
 tickWithinPrice(key){
  const st=this.state[key];
  if(!st)return;
  for(const id of st.all){
   const price=st.price[id];
   const within=typeof price==='number' && (st.ceiling===null || price<=st.ceiling);
   if(within)st.on.add(id); else st.on.delete(id);
  }
  this.render(key);
 },

 /* What this pool is currently choosing among, and where that came from.
    Three states, not two: an operator's selection, the pool's own default tier,
    or everything. "Narrowed or not" could not tell the middle case from the
    last, and the middle is the one that needs explaining. */
 explain(key,d){
  const note=document.getElementById('pmn-'+key);
  if(!note)return;
  if(d.narrowed){
   note.innerHTML=`using <b>your selection</b> of ${d.chosen_total} model(s). Tick everything to hand the choice back to the pool.`;
   return;
  }
  if(!d.default_tier){
   note.innerHTML='using <b>every eligible model</b>. This pool declares no default tier.';
   return;
  }
  note.innerHTML=`using this pool\u2019s default <b>${escapeHtml(d.default_tier)}</b> tier \u2014 ${d.chosen_total} of ${d.total} eligible. Size is read from the parameter count in a name, or from the vendor\u2019s own tier word where there is none: <b>haiku / sonnet / opus</b> is the clearest case. That is <b>product tiering, not a latency measurement</b> \u2014 no cloud provider publishes one. Tick differently and your selection replaces the default outright.`;
 },

 render(key){
  const st=this.state[key];
  if(!st)return;
  this.paintPrice(key);
  const list=document.getElementById('pml-'+key);
  const shown=this.matching(key);
  if(shown.length)list.innerHTML=shown.map(id=>`<label class="picker-item" title="${escapeHtml(id)}${st.tier[id]?' \u00b7 '+st.tier[id]:''}">
    <input type="checkbox"${st.on.has(id)?' checked':''}
      onchange="POOLEDIT.tick('${escapeHtml(key)}','${escapeHtml(id).replace(/'/g,'&#39;')}',this.checked)">
    <span>${escapeHtml(id)}</span>${typeof st.price[id]==='number'?`<em title="per million tokens, prompt plus completion">${st.price[id]===0?'free':'$'+st.price[id].toFixed(2)}</em>`:''}${st.tier[id]?`<em>${escapeHtml(st.tier[id])}</em>`:''}</label>`).join('');
  else if(st.all.length)list.innerHTML='<div class="picker-empty">nothing matches that.</div>';
  this.count(key);
 },

 /* What the search box selects.
    Matches the model id, and also the words describing *where and what* it is —
    `local`, `remote`, `cloud`, and the size tier. A model id says nothing about
    placement, so filtering six hundred of them for "the ones on my machine" was
    impossible until now: the facts existed on every row as a badge and could
    not be searched for. */
 matching(key){
  const st=this.state[key];
  if(!st)return[];
  if(!st.q)return st.all;
  return st.all.filter(id=>{
   if(id.toLowerCase().includes(st.q))return true;
   const placement=st.remote.has(id)?'remote cloud api':'local on-machine';
   return (placement+' '+(st.tier[id]||'')).includes(st.q);
  });
 },

 paintPrice(key){
  const st=this.state[key];
  const row=document.getElementById('pmp-'+key);
  if(!st||!row)return;
  const steps=this.priceSteps(key);
  /* Hidden where no candidate carries a price. OpenAI, Google and Anthropic
     publish none, so a pool of only those models would show a slider that
     could not move anything — a control that does nothing is worse than an
     absent one. */
  row.style.display=steps.length>1?'flex':'none';
  if(steps.length<2)return;
  const within=st.all.filter(id=>typeof st.price[id]==='number'
    &&(st.ceiling===null||st.price[id]<=st.ceiling)).length;
  const unpriced=st.all.filter(id=>typeof st.price[id]!=='number').length;
  document.getElementById('pmv-'+key).textContent=
    (st.ceiling===null?'any price':'≤ $'+st.ceiling.toFixed(2)+' / M tokens')
    +` · ${within} model(s)`+(unpriced?` · ${unpriced} unpriced`:'');
 },

 count(key){
  const st=this.state[key];
  const node=document.getElementById('pmc-'+key);
  if(!st||!node)return;
  const shown=this.matching(key);
  /* Says how many of the *eligible* models are chosen, never how many of the
     search results — the second number changes meaning with the search box. */
  node.textContent=`${st.on.size} of ${st.all.length} chosen`+(st.q?` · ${shown.length} shown`:'');
 },

 tick(key,id,on){
  const st=this.state[key];
  if(!st)return;
  if(on)st.on.add(id); else st.on.delete(id);
  this.count(key);
 },

 search(key,q){
  const st=this.state[key];
  if(!st)return;
  st.q=(q||'').trim().toLowerCase();
  this.render(key);
 },

 checkAll(key,on){
  const st=this.state[key];
  if(!st)return;
  const shown=this.matching(key);
  for(const id of shown){if(on)st.on.add(id); else st.on.delete(id)}
  this.render(key);
 },

 async apply(key){
  const st=this.state[key];
  if(!st)return;
  /* Everything ticked is sent as an empty list, which RAVIS stores as no
     narrowing at all — so a model added tomorrow still qualifies on its own
     rather than being excluded by yesterday's snapshot. */
  const models=st.on.size===st.all.length?[]:[...st.on];
  if(!models.length&&st.on.size!==st.all.length
     &&!confirm('Nothing is ticked, which leaves this pool with no members and every request to it refused. Continue?'))return;
  try{
   const r=await fetch(BASE.ravis+'/api/v1/pools/'+encodeURIComponent(key)+'/members',
     {method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({models})});
   if(!r.ok){alert('RAVIS refused: HTTP '+r.status);return}
   const d=await r.json();
   /* Named rather than swallowed. A picker that reported success on a selection
      it did not keep would teach an operator the invariants are advisory. */
   if((d.refused||[]).length)alert(`${d.refused.length} model(s) were not stored — they do not satisfy this pool's invariants:\n\n`+d.refused.slice(0,8).join('\n'));
  }catch(e){alert('RAVIS is not reachable.');return}
  delete this.state[key];
  ravisPools();
 },
};

function poolRow(x,inv){
 const key=x.pool_id.replace(/^ravis\//,'');
 return `<div class="table-row five"><span class="mono"><a href="#" onclick="POOLEDIT.toggle('${escapeHtml(key)}');return false" style="color:inherit" title="choose which models this pool may pick from">${x.pool_id}</a></span><span class="mono" style="opacity:.75">${inv(x.requires)}</span><span>${x.members}</span><span class="chip${warnUnless(x.available)}">${x.available?'yes':'no'}</span><span style="opacity:.7">${dash(x.reason)}</span></div>
  <div id="pm-${escapeHtml(key)}" class="model-picker" style="display:none">

      oninput="POOLEDIT.search('${escapeHtml(key)}',this.value)">

    <button class="btn" onclick="POOLEDIT.checkAll('${escapeHtml(key)}',true)">All</button>
    <button class="btn" onclick="POOLEDIT.checkAll('${escapeHtml(key)}',false)">None</button>
    <button class="btn primary" onclick="POOLEDIT.apply('${escapeHtml(key)}')">Apply</button>
   </div>
   <div class="price-row" id="pmp-${escapeHtml(key)}" style="display:none">
    <label>Max price
     <input type="range" id="pms-${escapeHtml(key)}" min="0" max="100" value="100"
       oninput="POOLEDIT.setCeiling('${escapeHtml(key)}',this.value)"></label>
    <span class="mono dim" id="pmv-${escapeHtml(key)}"></span>
    <button class="btn" onclick="POOLEDIT.tickWithinPrice('${escapeHtml(key)}')">Tick these</button>
   </div>
   <div class="picker-list" id="pml-${escapeHtml(key)}"></div>
   <small class="mono dim" id="pmn-${escapeHtml(key)}"></small>
   <small class="mono dim">only models that already satisfy this pool\u2019s invariants are listed, and only those can be ticked \u2014 a selection is a <b>narrowing</b>, never a widening. <b>ravis/local</b> promises the request never leaves this machine, and a promise somebody can tick away in a picker is not a promise. Tick everything and the narrowing is cleared rather than stored, so models added later still qualify on their own.</small>
  </div>`;
}

async function ravisPools(){
 heading('Pools','A pool is its invariants. Membership is counted from the builds that satisfy them, not written down.');
 const [p,mdl]=await Promise.all([API.ravis.pools(),API.ravis.models()]);
 const down=p.items.filter(x=>!x.available);
 /* By id, not by position. The mock listed clarvis-agent first; the API
    publishes §5's thirteen in their own order and items[0] is ravis/auto, so
    every figure keyed off `agent` would have described the wrong pool. */
 const agent=p.items.find(x=>x.pool_id==='ravis/clarvis-agent')||p.items[0];
 /* RAVIS's requirement shape is {required:[capability], minimum_context:int},
    and both halves have a meaningful empty: no required capability, and no
    minimum. "required · minimum_context 0" states two constraints where there
    are none, so each empty is dropped and a pool with neither says so. */
 const inv=r=>{const parts=[];

    were unconditional here and both throw on the live payload, where every

async function ravisProviders(){
 heading('Providers','Where each provider lives, how it is spoken to, and whether it is answering.');
 /* The live half. Everything below this card is still prototype content, and

 const liveCard=liveRows?`<div class="card full live"><h3>Configured now <span class="chip">live</span></h3>${cell(`

       value="${escapeHtml(((x.models||{}).filter||{}).exclude?.join(', ')||'')}"
       style="width:100%;background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:5px"></span>

    </div>`).join('')}
   <small class="mono dim">the <b>Models</b> count is a link — it opens the filter for that provider. OpenRouter publishes over 400 models, and without a filter every one of them lands in <b>/v1/models</b>, which a client renders as a picker, and becomes a routing candidate on every request. Patterns are globs; <b>exclude wins over include</b>, and an empty include means all rather than none. The filter applies identically to the catalogue a client reads and the candidates the router picks from, so the two can never disagree about whether a model exists.<br><br>turning a provider off is not the same as removing its key. Disabled means <b>not right now</b> and is one click back; deleting the credential on <b>RAVIS → Credentials</b> means this deployment no longer holds one. A disabled provider is not probed, not advertised in <b>/v1/models</b>, and not a routing candidate — and addressing it directly returns 503 rather than quietly going somewhere else.</small>`,'ravis')}</div>`
  :`<div class="card full live"><h3>Configured now</h3>${cell(`

 +`<div class="card full${p.live?' live':''}"><h3>Health</h3>${cell(`
   <div class="table-row head seven"><span>Provider</span><span>Kind</span><span>Protocol</span><span>Credential</span><span>Breaker</span><span>Errors</span><span>p50</span></div>

   <small class="mono dim">${p.items.map(x=>`<b>${x.label}</b> — ${x.note}`).join('<br>')}</small>`,'ravis')}</div>

   <div class="table-row head six"><span>Provider</span><span style="grid-column:2/4">Origin</span><span>Chat path</span><span>Auth</span><span>Secret</span></div>

/* Policies — conditions and actions in evaluation order. Hard policies eliminate,
   soft policies bias the ranking; showing them in one list without that column
   would make a preference look like a guarantee. */
/* What governs a route when no policy engine exists, which is today.
   Not a placeholder: these are enforced on every request, by the pool
   invariants and the routing engine rather than by a rule table. Somebody
   asking "what decides where my request goes" deserves this answer rather than
   an empty list. */
function noPoliciesScreen(){
 const HARD=[
  ['pool invariants','a capability, a minimum context or a locality the pool requires','core/pools.py'],
  ['locality','ravis/local and ravis/private never leave this machine','PoolRequirements.locality'],
  ['request requirements','tools or images in the request itself demand a model that handles them','routing/requirements.py'],
  ['open circuit','§10 routes away from a provider that is failing','reliability/health.py'],
  ['operator selection','the models ticked for this pool, which narrows and never widens','pool_membership.py'],
 ];
 const SOFT=[
  ['prefer already loaded','a resident model needs no load','residency'],
  ['prefer local','placement, where the pool asks for it','prefer_local'],
  ['prefer cheap','published price per million; unpriced sorts last','prefer_cheap'],
  ['prefer fast','measured time-to-first-token, above a sample floor','prefer_fast'],
  ['size tiebreak','among candidates a pool considers equal, the smaller','size_rank'],
 ];
 const rows=(list,kind)=>list.map(([name,effect,where])=>`<div class="table-row">
   <span class="mono">${escapeHtml(name)}</span>
   <span style="grid-column:2/4;opacity:.85">${escapeHtml(effect)}</span>
   <span class="mono" style="opacity:.55">${escapeHtml(where)}</span>
   <span class="chip${kind==='hard'?' warn':''}">${kind}</span></div>`).join('');
 $('#content').innerHTML=kpis([
   ['Policies','0','none are in force','ravis',true],
   ['Hard constraints',String(HARD.length),'eliminate a candidate','ravis',true],
   ['Soft preferences',String(SOFT.length),'reorder, never eliminate','ravis',true],
   ['Policy engine','M16','not built','ravis',true]])
 +`<div class="card full live"><h3>No policy is in force</h3>${cell(`
   <div class="trace-step"><b>endpoint</b><span class="mono">GET /api/v1/policies</span></div>
   <div class="trace-step"><b>returned</b><span>an empty list</span></div>
   <small class="mono dim">and that is the answer rather than a gap in this page. §9.6's <b>IF … THEN</b> rules arrive with the policy engine at <b>M16</b>. Until then RAVIS evaluates none, and a screen showing plausible-looking rules would tell a reader their traffic is governed by conditions that do not exist — which is worse than showing nothing. What <i>does</i> govern a route is below, and it is enforced on every request.</small>`,'ravis')}</div>
  <div class="card full live"><h3>What actually decides a route <span class="chip">§9.2</span></h3>${cell(`
   <div class="table-row head"><span>Rule</span><span style="grid-column:2/4">Effect</span><span>Where</span><span>Kind</span></div>
   ${rows(HARD,'hard')}${rows(SOFT,'soft')}

}

async function ravisPolicies(){
 heading('Policies','Conditions and actions, in evaluation order. Hard policies eliminate; soft policies only rank.');
 const p=await API.ravis.policies();
 /* RAVIS answering with nothing is a *fact*, not an empty screen to fill. The
    engine that would evaluate policies is M16 and is not built, so the honest
    render is a statement to that effect — and the constraint table below it,
    which is real: §9.2's hard/soft split is enforced today by pool invariants
    and the routing engine, and that is what actually governs a request. */
 if(p.live&&!p.items.length)return noPoliciesScreen();
 const hard=p.items.filter(x=>x.kind==='hard');
 $('#content').innerHTML=kpis([
   ['Policies',String(p.items.length),'evaluated in order','ravis'],
   ['Hard',String(hard.length),'eliminate candidates','ravis'],
   ['Soft',String(p.items.length-hard.length),'bias the ranking only','ravis'],
   ['Enabled',String(p.items.filter(x=>x.enabled).length),'a disabled rule is not evaluated','ravis']])
 +`<div class="card full${p.live?' live':''}"><h3>Evaluation order</h3>${cell(`
   <div class="table-row head six"><span>Id</span><span style="grid-column:2/4">When</span><span style="grid-column:4/6">Then</span><span>Kind</span></div>
   ${p.items.map(x=>`<div class="table-row six"><span class="mono">${x.policy_id}</span><span class="mono" style="grid-column:2/4;opacity:.8">${escapeHtml(x.when)}</span><span style="grid-column:4/6">${x.then}</span><span class="chip${warnUnless(x.kind==='hard')}">${x.kind}</span></div>`).join('')}
   <small class="mono dim">order matters: <b>${p.items[1].policy_id}</b> removes every cloud provider before anything is scored, so a cheaper or faster cloud model is not out-ranked — it is never a candidate. A soft policy such as <b>${p.items.find(x=>x.kind==='soft').policy_id}</b> can only move a candidate down the list.</small>`,'ravis')}</div>
  <div class="card wide"><h3>Hard versus soft</h3>${cell(`
   <div class="table-row head"><span>Kind</span><span>Count</span><span style="grid-column:3/-1">Guarantee to a caller</span></div>
   <div class="table-row"><span class="chip">hard</span><span>${hard.length}</span><span style="grid-column:3/-1;opacity:.75">will never be violated: if nothing satisfies them the result is NO_ROUTE</span></div>
   <div class="table-row"><span class="chip warn">soft</span><span>${p.items.length-hard.length}</span><span style="grid-column:3/-1;opacity:.75">changes the ordering; a strong preference is still not a promise</span></div>
   <small class="mono dim">this column is the difference between "prefer local" and "local only". Both are legitimate; presenting the first as the second is how a privacy setting becomes untrue without anyone editing it.</small>`,'ravis')}</div>
  <div class="card narrow"><h3>Context policy</h3>${cell(`
   <div class="trace-step"><b>when</b><span>request > model context</span></div>

   <small class="mono dim">truncation is the silent failure this rule exists to prevent. A shortened prompt still produces a fluent answer, which is exactly why nobody notices — so the request moves to a larger context or it does not run.</small>`,'ravis')}</div>`}

/* Evidence — what RAVIS is scoring on, and who owns it. The table is SIRVIS's

 +(verdicts?`<div class="card full live"><h3>What RAVIS concluded <span class="chip">${verdicts.source.state}</span></h3>${cell(`

 $('#content').innerHTML=kpis([

   ['No-route',String(req.items.filter(r=>r.result!=='OK').length),'failed closed, recorded','ravis'],

   <small class="mono dim">these are the frames RAVIS handed the hub, carrying identifiers and result classes only. Export failing never blocks a route: telemetry is downstream of serving the request, and a collector outage must not become a routing outage.</small>`,'ravis')}</div>

/* Settings — how the router serves its clients, and the short list of things a

   mutations, and everything else on the screen is configuration with no agreed
   endpoint behind it. Those get rendered as state with the reason stated, not as
   toggles wired to a notify(). "A UI need does not create a RAVIS API" is the
   spec's own sentence, and a settings page is where that rule is most tempting
   to break — every row here looks like it wants to be editable. */
async function ravisSettings(){
 heading('Settings','How the router serves its clients — and the five things that have an endpoint to change them.',
  control('Refresh evidence','refreshEvidence'));
 const [s,prof,pr]=await Promise.all([API.ravis.settings(),API.ravis.profiles(),API.ravis.providers()]);
 const active=prof.items.find(x=>x.default);

 /* What can be observed about how RAVIS is actually running, as opposed to what

    read-only surface entirely, so this reports the configuration's *effects*
    rather than its values.

    The address is the one thing this dashboard knows for certain: it is talking

    listen address, which would be a guess about a setting nobody published. */
 const [sHealth,sProv,sDiag]=await Promise.all([
   (async()=>{try{const r=await fetch(BASE.ravis+'/api/v1/health',

    catch(e){return null}})(),

   <div class="trace-step"><b>upstream</b><span>${sHealth?(sHealth.upstream_reachable?'<span class="chip">answering</span>':'<span class="chip warn">not answering</span>'):'—'}${sHealth?` <span class="mono dim">${sHealth.models_known} model(s) visible</span>`:''}</span></div>
   ${(sProv||[]).map(p=>`<div class="trace-step"><b>${escapeHtml(p.name)}</b><span class="mono" style="opacity:.8">${p.enabled?'enabled':'disabled'} · ${p.credential_configured?escapeHtml(p.credential_source):'no credential'} · ${p.reachable===null?'not probed':(p.reachable?'answering':'not answering')}</span></div>`).join('')}
   <div class="trace-step"><b>credentials</b><span><a href="#" onclick="state.view='Credentials';render();return false" style="color:inherit">RAVIS → Credentials</a></span></div>
   <small class="mono dim">RAVIS publishes <b>no settings endpoint</b> — <span class="mono">/api/v1/settings</span> and <span class="mono">/api/v1/config</span> are both 404, and §15.1 keeps mutation off the read-only surface. So this reports what the configuration <i>does</i> rather than what it says: the address this dashboard actually reached, the upstream's answer, and each provider's real state. The cards below describe settings nobody publishes and are prototype content.</small>`,'ravis')}</div>`;
 $('#content').innerHTML=liveCard+kpis([
   ['Active profile',active.label,`${active.profile_id} · rev ${active.revision}`,'ravis'],
   ['Serving',`${served} / ${s.serving.endpoints.length}`,'endpoints live','ravis'],
   ['Mutations','0','this API is read-only','ravis'],
   ['Listen',`${s.listen.host}:${s.listen.port}`,s.listen.tls?'tls':'loopback, no tls','ravis']])
 +`<div class="card full"><h3>What a client can change <span class="chip warn">nothing, yet</span></h3>${cell(`
   <div class="trace-step"><b>mutating endpoints</b><span>none — RAVIS's management API is read-only at M18a</span></div>
   <div class="trace-step"><b>active profile</b><span>configuration · no endpoint</span></div>
   <div class="trace-step"><b>provider enable/disable</b><span>configuration · no endpoint</span></div>
   <div class="trace-step"><b>evidence refresh</b><span>arrives with RAVIS M13</span></div>
   <div class="trace-step"><b>conformance suite</b><span class="mono">ravis conformance clarvis</span></div>
   <small class="mono dim">this card used to list five actions under a chip reading <b>has an endpoint</b>, with a working-looking button beside each. Not one of them existed: RAVIS publishes nine reads and no writes. The buttons raised a toast and changed nothing, which is worse than an absent control — an operator learns the system does something it does not, and only finds out when it matters. The suite is a real operation and runs on the CLI, which is where it is named.</small>`,'ravis')}</div>

   <div class="table-row head"><span>Endpoint</span><span>Status</span><span style="grid-column:3/-1">Constraint</span></div>
   ${s.serving.endpoints.map(([ep,st,note])=>`<div class="table-row"><span class="mono">${escapeHtml(ep)}</span><span class="chip${warnUnless(st==='required')}">${st}</span><span style="grid-column:3/-1;opacity:.75">${note}</span></div>`).join('')}
   <div class="trace-step" style="margin-top:10px"><b>request features</b><span>${s.serving.supported.length} supported</span></div>
   <small class="mono dim" style="opacity:.8">${s.serving.supported.join(' · ')}</small>
   <small class="mono dim">${s.serving.note}. Errors are <b>${s.serving.error_shape}</b> — a client parses the OpenAI shape, so the management envelope must not leak onto <b>/v1</b>.</small>`,'ravis')}</div>
  <div class="card full"><h3>Listen address <span class="chip${warnUnless(s.listen.tls)}">${s.listen.tls?'tls':'loopback, no tls'}</span></h3>${cell(`
   <div class="table-row head six"><span>Surface</span><span style="grid-column:2/4">Address</span><span style="grid-column:4/-1">Who talks to it</span></div>
   ${s.listen.surfaces.map(([path,what,who])=>`<div class="table-row six"><span>${what}</span><span class="mono" style="grid-column:2/4">http://${s.listen.host}:${s.listen.port}${path}</span><span style="grid-column:4/-1;opacity:.75">${who}</span></div>`).join('')}
   <div class="trace-step" style="margin-top:11px"><b>set by</b><span class="mono">${escapeHtml(s.listen.set_by)}</span></div>

   <small class="mono dim">all three surfaces share one port, so they move together. There is no endpoint to change this and that is structural rather than an omission: rebinding the socket a request arrived on would drop that request. It is set at start and changed by restarting.<br>${s.listen.note}.<br>a runtime version of this is written up as <b>PROPOSED</b> in RAVIS.md §15.1.1, with the six questions that block it — response ordering, in-flight streams, rollback when the new bind fails, propagation to the clients holding the old address, ownership, and its own permission. It is not in the agreed mutation list, so nothing here writes it.</small>`,'ravis')}</div>
  <div class="card wide"><h3>What breaks if the port changes</h3>${cell(`
   <div class="table-row head"><span>Service</span><span>Holds</span><span style="grid-column:3/-1">If it is not updated</span></div>

   <small class="mono dim">this is why the address is not a field you edit in one place and forget. Clarvis probes <b>/v1/models</b> unauthenticated with a 2 s timeout and reads any failure as <b>provider offline</b>, so a moved port looks to a user like RAVIS is down rather than like RAVIS moved. NERVIS's copy lives in its own registry, on <b>NERVIS → Settings</b>, and is edited there because it is NERVIS's configuration rather than RAVIS's.</small>`,'ravis')}</div>
