[project]
name = "nervis"
version = "0.34.67"
description = "Ecosystem control plane — dashboard, event hub, diagnostics"
requires-python = ">=3.11"
dependencies = [
  # One protocol, one implementation. The MEP surface is not reimplemented here
  # for the same reason SIRVIS and RAVIS do not reimplement it: a health
  # endpoint that means something slightly different per service is worse than
  # none, because the whole value is asking all three the same thing.
  "ecosystem-protocol",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # NERVIS is a client of every other service (§5). Present from M0 because
  # `doctor` needs to say whether a peer is reachable, not because M0 probes.
  "httpx>=0.27",
  # §3 names it, and M1 is where it earns its place. The alternative is hand
  # parsing `vm_stat`, `sysctl`, `/proc/meminfo` and Windows' WMI: SIRVIS took
  # that route for *static* machine detection and it is 398 lines that still
  # needed a portable fallback, with no CPU utilisation and no process list.
  # NERVIS has to run on macOS, Linux and Windows, so three more copies of that
  # parsing is exactly the trade a dependency exists to avoid.
  "psutil>=6.0",
  # Reading a PDF somebody attached. This is the one place in the repository
  # where "a few lines could do it" is false: pulling `Tj` strings out of a
  # decompressed content stream is short and *works on simple files*, then
  # returns confident nonsense for any PDF whose fonts are subset-encoded —
  # every glyph mapped through a `/Differences` array or a `ToUnicode` CMap that
  # a naive reader ignores. Garbled text nobody can tell from real text is the
  # exact failure this module is built to avoid, so the parsing is somebody
  # else's. Pure Python, no C extension, and no transitive dependencies.
  "pypdf>=5.1",
  # Generating a genuinely styled PDF from scratch — real typography, colour
  # and page layout rather than hand-placed Helvetica runs. `pdf.py`'s own
  # module docstring names what the hand-rolled writer could not do: "no
  # tables, no images... embedded fonts, transparency." Platypus's flowable
  # layout is the few-lines-can't-do-it rung above that, the same reasoning
  # that already justified `pypdf` two lines up.
  "reportlab>=4.2",
  # Reading a template PDF's *appearance* rather than its words: the font,
  # size and colour behind each character, addressed through the same
  # subset-encoded-font indirection `pypdf` exists to read text through.
  # `pypdf` answers "what does it say"; nothing already here answers "what
  # does it look like," and getting that wrong silently is a style nobody
  # asked for.
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
# `types-psutil`/`types-reportlab` rather than a mypy override. SIRVIS waives
# the check for PyYAML because its stubs return `Any` for the one call in
# use, so nothing is lost; both of these are genuinely typed, and the fields
# they cover are exactly the kind that get renamed between major versions.
dev = [
  "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13",
  "types-psutil>=6.0", "types-reportlab>=4.2",
]

[project.scripts]
nervis = "nervis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ── Engineering standards, ECOSYSTEM_RUNBOOK.md §14.1 ─────────────────────────
# Identical to the two sibling packages, deliberately. These are gates rather
# than preferences, and a monorepo where one service lints looser than another
# is a monorepo where work migrates to the looser one.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle: whitespace and line length
  "F",        # pyflakes: unused imports, undefined names
  "I",        # isort: deterministic import order
  "C90",      # mccabe: cyclomatic complexity, capped below
  "N",        # pep8-naming: classes are nouns in CapWords, functions lower_snake
  "ARG",      # unused arguments — dead parameters are dead code (§14 code smells)
  "SIM",      # flake8-simplify: the obvious simplifications
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/nervis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
# Same reason as the sibling packages: without this the suite only passes when
# invoked as `python -m pytest`, which injects the working directory as a side
# effect. CI runs it bare.
pythonpath = ["."]
