<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIKUVIS — Desktop Companion</title>
<style>
  :root {
    --bg:       #05070c;
    --line:     #123b42;   /* the single outline colour for the whole character */
    --hair:     #45d6cb;
    --hair-lit: #b6f6ef;
    --skin:     #fdf4ea;
    --teal:     #39c5bb;   /* HUD chrome */
    --teal-lit: #8ff0e8;
    --teal-dim: #1c7a76;
    --pink:     #ff5c8f;
    --mag:      #ff2d78;
    --ink:      #cdd6e3;
    --muted:    #5d6b7e;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body {
    background: radial-gradient(ellipse 75% 55% at 50% 34%, #0c1a1e 0%, var(--bg) 72%);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:28px; -webkit-font-smoothing:antialiased;
  }

  /* ══ stage ══ mood class lives here so it drives face and backdrop together */
  .stage { position:relative; width:360px; height:360px;
           display:grid; place-items:center; isolation:isolate; }

  .rain { position:absolute; inset:-6% -2%; overflow:hidden; z-index:0; opacity:.42;
          transition:opacity .4s;
          -webkit-mask-image: radial-gradient(ellipse 62% 62% at 50% 50%, #000 30%, transparent 78%);
                  mask-image: radial-gradient(ellipse 62% 62% at 50% 50%, #000 30%, transparent 78%); }
  .rain .col { position:absolute; top:0; white-space:pre; text-align:center;
               font: 10px/1.15 ui-monospace, "SF Mono", Menlo, monospace;
               color: var(--teal); text-shadow: 0 0 6px rgba(57,197,187,.55);
               animation: fall linear infinite; }
  @keyframes fall { from { transform: translateY(-52%); } to { transform: translateY(6%); } }

  .artifact { position:absolute; z-index:1; opacity:0;
              font: 700 9px/1 ui-monospace, "SF Mono", Menlo, monospace;
              letter-spacing:.1em; color: var(--teal-lit);
              text-shadow: 0 0 8px rgba(57,197,187,.8);
              animation: flicker 7s steps(1) infinite; }
  .artifact.err { color: var(--mag); text-shadow: 0 0 8px rgba(255,45,120,.8); }
  @keyframes flicker {
    0%, 61%, 100% { opacity:0; }
    62%, 63.5% { opacity:.9; }  64.5% { opacity:0; }
    66%, 67%   { opacity:.65; transform: translateX(3px); }  68% { opacity:0; }
  }

  .slice { position:absolute; left:0; width:100%; height:6px; z-index:3; opacity:0;
           -webkit-backdrop-filter: invert(1) hue-rotate(215deg) saturate(.8) brightness(.8);
                   backdrop-filter: invert(1) hue-rotate(215deg) saturate(.8) brightness(.8);
           animation: sliceJump 5.5s steps(1) infinite; }
  .slice:nth-of-type(2) { animation-duration:8.5s; animation-delay:-2.2s; }
  .slice:nth-of-type(3) { animation-duration:11.5s; animation-delay:-6.4s; height:4px; }
  @keyframes sliceJump {
    0%, 87%, 100% { opacity:0; top:22%; }
    88% { opacity:.6; top:31%; }  89.5% { opacity:0; top:31%; }
    91% { opacity:.6; top:58%; }  92%   { opacity:0; top:58%; }
    94% { opacity:.5; top:44%; }  95%   { opacity:0; top:44%; }
  }

  .vhs { position:absolute; inset:0; z-index:4; pointer-events:none; opacity:.42;
         background: repeating-linear-gradient(to bottom,
           rgba(0,0,0,.26) 0 1px, rgba(0,0,0,0) 1px 3px); }
  .vhs::after { content:""; position:absolute; left:0; width:100%; height:70px;
                background: linear-gradient(to bottom, rgba(57,197,187,0) 0%,
                            rgba(57,197,187,.06) 50%, rgba(57,197,187,0) 100%);
                animation: roll 6.5s linear infinite; }
  @keyframes roll { from { top:-70px; } to { top:100%; } }

  svg.face { width:340px; height:340px; overflow:visible; display:block; z-index:2; }

  /* ══ HUD chrome ══ */
  #reticle   { fill:none; stroke:var(--teal); stroke-opacity:.28; stroke-width:1.2; transition:stroke .4s; }
  #tickring  { fill:none; stroke:var(--teal); stroke-opacity:.45; stroke-width:3;
               stroke-dasharray:2.4 20.6; transform-origin:100px 100px;
               animation: spin 32s linear infinite; transition:stroke .4s; }
  #innerring { fill:none; stroke:var(--teal); stroke-opacity:.2; stroke-width:1.4;
               stroke-dasharray:14 9; transform-origin:100px 100px;
               animation: spin 21s linear infinite reverse; transition:stroke .4s; }
  .cardinal { stroke:var(--teal); stroke-opacity:.6; stroke-width:1.8; stroke-linecap:round; transition:stroke .4s; }
  .cbracket { fill:none; stroke:var(--teal); stroke-opacity:.34; stroke-width:1.6;
              stroke-linecap:round; transition:stroke .4s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .m-listening #tickring { animation-duration:14s; }
  .m-thinking  #tickring { animation-duration:9s; }
  .m-talking   #tickring { animation-duration:20s; }
  .m-delighted #tickring { animation-duration:7s; }
  .m-smug      #tickring { animation-duration:28s; }
  .m-bored     #tickring { animation-duration:60s; }
  .m-indignant #tickring { animation-duration:3.4s; }
  .m-glitched  #tickring { animation-duration:2.6s; }

  #scanbar { opacity:0; }
  .m-listening #scanbar, .m-thinking #scanbar { opacity:1; animation: sweep 2.4s ease-in-out infinite; }
  @keyframes sweep {
    0%, 100% { transform: translateY(-14px); opacity:0; }
    20%, 80% { opacity:.85; }
    50%      { transform: translateY(22px); }
  }

  /* ══ character ══ */
  #float { animation: bob 5s ease-in-out infinite; transform-origin:100px 110px; }
  @keyframes bob {
    0%, 100% { transform: translateY(0)    rotate(-.8deg); }
    50%      { transform: translateY(-9px) rotate(.8deg);  }
  }

  .hair { fill:url(#hairGrad); stroke:var(--line); stroke-width:1.8; stroke-linejoin:round; }
  .skin { fill:url(#skinGrad); stroke:var(--line); stroke-width:1.8; stroke-linejoin:round; }
  .sheen { fill:var(--hair-lit); opacity:.55; }
  .strand { fill:none; stroke:var(--hair-lit); stroke-opacity:.8; stroke-width:1.2;
            stroke-dasharray:3 9; animation: flow 2.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-48; } }
  .m-delighted .strand { animation-duration:1.2s; }
  .m-indignant .strand { animation-duration:.7s; }
  .m-glitched  .strand { animation-duration:.45s; stroke:var(--mag); }

  #tailL { transform-origin:52px 58px; animation: swayL 5.6s ease-in-out infinite; }
  #tailR { transform-origin:148px 58px; animation: swayR 5.6s ease-in-out infinite; }
  @keyframes swayL { 0%,100% { transform:rotate(2.2deg); } 50% { transform:rotate(-2.2deg); } }
  @keyframes swayR { 0%,100% { transform:rotate(-2.2deg); } 50% { transform:rotate(2.2deg); } }
  .m-indignant #tailL, .m-indignant #tailR { animation-duration:1.5s; }
  .m-delighted #tailL, .m-delighted #tailR { animation-duration:2.4s; }
  .m-mocking   #tailL, .m-mocking   #tailR { animation-duration:2.2s; }
  .m-bored     #tailL, .m-bored     #tailR { animation-duration:11s; }

  .cuff   { fill:#1c2630; stroke:var(--line); stroke-width:1.4; }
  .stripe { fill:var(--mag); }
  .blush  { fill:var(--pink); opacity:.4; }

  /* ══ eyes ══
     Drawn in their own 40x44 coordinate box and placed with a transform, so the
     proportions that were checked at 8x are the proportions that ship. The right
     eye is the same box mirrored — which also points its lash flick outward. */
  .eyewhite { fill:#ffffff; stroke:var(--line); stroke-width:1.25; }
  .lash     { fill:none; stroke:var(--line); stroke-width:5; stroke-linecap:round; }
  .lashtip  { fill:var(--line); }
  .lid      { fill:var(--skin); }
  .brow     { fill:none; stroke:#16333b; stroke-width:2.6; stroke-linecap:round;
              transition: transform .3s cubic-bezier(.34,1.4,.5,1); }
  #browL { transform-origin:78px 78px; }
  #browR { transform-origin:122px 78px; }
  .irisarc  { fill:none; stroke:#ffffff; stroke-width:2.4; stroke-linecap:round; }
  .irisring { fill:none; stroke:#eafffb; stroke-opacity:.28; stroke-width:.7;
              stroke-dasharray:1.4 2.8; transform-box:fill-box; transform-origin:center;
              animation: spin 7s linear infinite; }
  .pupils { transition: transform .32s cubic-bezier(.4,.9,.3,1); }
  .lashes { transition: transform .3s cubic-bezier(.4,.9,.3,1); }

  #lidL, #lidR { animation: blink 6.6s infinite; }
  #lidR { animation-delay:.04s; }
  /* lab units: the lid's visible edge is its bottom; 38 clears the whole opening */
  @keyframes blink {
    0%, 94%, 100% { transform: translateY(0); }
    95%, 96.4%    { transform: translateY(36px); }
    97.4%         { transform: translateY(0); }
  }
  /* a closed eye is a line, so flash one in while the lid hides the eyeball */
  .eyeline { fill:none; stroke:var(--line); stroke-width:4.5; stroke-linecap:round; opacity:0; }
  #closedL, #closedR { animation: blinkline 6.6s infinite; }
  #closedR { animation-delay:.04s; }
  @keyframes blinkline {
    0%, 94.6%, 100% { opacity:0; }
    95.2%, 96.2%    { opacity:1; }
    96.9%           { opacity:0; }
  }

  .m-thinking .pupils { animation: glance 2.8s ease-in-out infinite; }
  @keyframes glance {
    0%, 12%   { transform: translate(0,0); }
    30%, 46%  { transform: translate(-4px,-3px); }
    64%, 80%  { transform: translate(4px,-3px); }
    96%, 100% { transform: translate(0,0); }
  }
  .m-bored .pupils { animation: drift 7s ease-in-out infinite; }
  @keyframes drift {
    0%, 100% { transform: translate(-4px,2px); }
    50%      { transform: translate(3px,2px); }
  }

  #eyesHappy, #eyesScrunch { display:none; }
  [data-eyes="happy"] #eyesOpen, [data-eyes="scrunch"] #eyesOpen { display:none; }
  [data-eyes="happy"]   #eyesHappy   { display:block; }
  [data-eyes="scrunch"] #eyesScrunch { display:block; }
  [data-eyes="wink"] #eyeRgroup { display:none; }
  [data-eyes="wink"] #closedR { display:block; opacity:1; animation:none; }

  /* ══ mouths ══ */
  #mSmile, #mFlat, #mSmirk, #mWave, #mOpen, #mShout, #mGrin, #mGlitch { display:none; }
  [data-mouth="smile"]  #mSmile  { display:block; }
  [data-mouth="flat"]   #mFlat   { display:block; }
  [data-mouth="smirk"]  #mSmirk  { display:block; }
  [data-mouth="wave"]   #mWave   { display:block; }
  [data-mouth="open"]   #mOpen   { display:block; }
  [data-mouth="shout"]  #mShout  { display:block; }
  [data-mouth="grin"]   #mGrin   { display:block; }
  [data-mouth="glitch"] #mGlitch { display:block; }

  .mline { fill:none; stroke:#c2456f; stroke-width:2.4; stroke-linecap:round; }
  .mfill { fill:#8e2a44; stroke:var(--line); stroke-width:1.5; stroke-linejoin:round; }
  .tongue { fill:#ff7fa2; }

  #mWave rect { fill:var(--teal); rx:1.4;
                filter: drop-shadow(0 0 5px rgba(57,197,187,.7));
                animation: talk .46s ease-in-out infinite; transform-origin:center 128px; }
  #mWave rect:nth-child(1) { animation-delay:-.33s; }
  #mWave rect:nth-child(2) { animation-delay:-.16s; }
  #mWave rect:nth-child(3) { animation-delay:-.41s; }
  #mWave rect:nth-child(4) { animation-delay:-.07s; }
  #mWave rect:nth-child(5) { animation-delay:-.24s; }
  @keyframes talk { 0%,100% { transform: scaleY(.22); } 50% { transform: scaleY(1); } }

  [data-mouth="open"] #mOpen { animation: laugh 1.8s ease-in-out infinite; transform-origin:100px 124px; }
  @keyframes laugh { 0%,100% { transform: scale(1,.88); } 45% { transform: scale(1.04,1.12); } }
  [data-mouth="shout"] #mShout { animation: shout .34s ease-in-out infinite; transform-origin:100px 120px; }
  @keyframes shout { 0%,100% { transform: scale(.94,.9); } 50% { transform: scale(1.06,1.14); } }
  [data-mouth="glitch"] #mGlitch { animation: mglitch .3s steps(1) infinite; }
  @keyframes mglitch {
    0%  { transform: translate(0,0);      opacity:1; }
    50% { transform: translate(3px,-1px); opacity:.6; }
    75% { transform: translate(-2px,1px); opacity:1; }
  }
  #tongueOut { transform-origin:100px 130px; animation: blep 1.5s ease-in-out infinite; }
  @keyframes blep {
    0%, 100% { transform: rotate(-4deg) translateY(0)    scaleY(1); }
    35%      { transform: rotate(3deg)  translateY(2px)  scaleY(1.12); }
    70%      { transform: rotate(-2deg) translateY(.5px) scaleY(.96); }
  }

  /* ══ reaction marks ══ */
  #anger, #hatch, #sweat, #sparks { display:none; }
  .m-indignant #anger, .m-indignant #hatch { display:block; }
  .m-mocking   #hatch { display:block; }
  .m-delighted #hatch, .m-delighted #sparks { display:block; }
  .m-bored     #sweat { display:block; }

  #anger { transform-origin:60px 66px; animation: throb .7s ease-in-out infinite; }
  #anger path { fill:none; stroke:var(--mag); stroke-width:2.8; stroke-linecap:round;
                filter: drop-shadow(0 0 5px rgba(255,45,120,.7)); }
  @keyframes throb { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.18); opacity:1; } }
  #hatch path { fill:none; stroke:#ff7fa4; stroke-opacity:.8; stroke-width:1.8; stroke-linecap:round; }
  #sweat { animation: bead 3.4s ease-in-out infinite; }
  @keyframes bead {
    0%, 55%  { opacity:0; transform: translateY(0); }
    62%, 88% { opacity:.9; transform: translateY(0); }
    100%     { opacity:0; transform: translateY(10px); }
  }
  #sparks path { fill:var(--teal-lit); animation: twinkle 1.6s ease-in-out infinite; }
  #sparks path:nth-child(2) { animation-delay:.5s; }
  #sparks path:nth-child(3) { animation-delay:1s; }
  @keyframes twinkle { 0%,100% { opacity:0; transform:scale(.4); } 45% { opacity:1; transform:scale(1); } }

  /* ══ tantrum: loud enough to disturb the signal, but not broken ══ */
  .m-indignant #float {
    animation: bob 5s ease-in-out infinite, stomp .16s steps(1) infinite,
               ragesplit 1.3s steps(1) infinite;
  }
  @keyframes stomp { 0% { translate:-2px 0; } 50% { translate:2px -1px; } }
  @keyframes ragesplit {
    0%, 62%, 100% { filter:none; }
    66%, 70% { filter: drop-shadow(3px 0 0 rgba(255,45,120,.75)) drop-shadow(-3px 0 0 rgba(57,197,187,.75)); }
    74%, 81% { filter:none; }
    82%, 85% { filter: drop-shadow(-2px 0 0 rgba(255,45,120,.6)) drop-shadow(2px 0 0 rgba(57,197,187,.6)); }
    88%      { filter:none; }
  }
  .m-indignant .rain { opacity:.8; }
  .m-indignant .slice { animation-duration:2.2s; }
  .m-indignant .artifact { animation-duration:2.6s; }
  .m-indignant #blocks rect { animation-duration:1.1s; opacity:.35; }

  /* ══ glitched: the signal genuinely is broken ══ */
  .m-glitched #reticle, .m-glitched #innerring, .m-glitched #tickring,
  .m-glitched .cardinal, .m-glitched .cbracket { stroke:var(--mag); }
  .m-glitched #float {
    animation: bob 5s ease-in-out infinite, jitter .22s steps(1) infinite;
    filter: drop-shadow(2.5px 0 0 rgba(255,45,120,.7)) drop-shadow(-2.5px 0 0 rgba(57,197,187,.7));
  }
  @keyframes jitter {
    0% { translate:0 0; } 25% { translate:4px -1px; }
    50% { translate:-3px 2px; } 75% { translate:2px 1px; }
  }
  .m-glitched .rain { opacity:.95; }
  .m-glitched .slice { animation-duration:1.4s; }
  .m-glitched #blocks rect { animation-duration:.8s; opacity:.4; }

  #blocks rect { fill:var(--teal); opacity:.18; animation: hop 4.4s steps(1) infinite; }
  #blocks rect:nth-child(2) { animation-delay:-1.3s; fill:var(--teal-lit); }
  #blocks rect:nth-child(3) { animation-delay:-2.6s; }
  #blocks rect:nth-child(4) { animation-delay:-3.4s; fill:var(--mag); opacity:.14; }
  #blocks rect:nth-child(5) { animation-delay:-.7s; }
  @keyframes hop {
    0%, 100% { transform: translate(0,0);      opacity:.05; }
    24% { transform: translate(-14px,6px); opacity:.3; }
    48% { transform: translate(9px,-11px); opacity:.12; }
    72% { transform: translate(-5px,17px); opacity:.26; }
  }

  /* ══ controls ══ */
  .controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:480px; }
  button { font:inherit; font-weight:500; color:var(--muted); background:#0d151a;
           border:1px solid #1d2c33; border-radius:999px; padding:8px 17px; cursor:pointer;
           transition: color .2s, border-color .2s, box-shadow .2s, transform .1s; }
  button:hover { color:var(--ink); border-color:#2b3f48; }
  button:active { transform: translateY(1px); }
  button[aria-pressed="true"] { color:var(--teal); border-color:var(--teal-dim);
    box-shadow: 0 0 0 1px rgba(57,197,187,.18), 0 0 18px -4px rgba(57,197,187,.6); }
  button:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }

  .quip { color:var(--muted); font-size:13px; min-height:2.6em; text-align:center;
          font-style:italic; max-width:46ch; transition: opacity .25s; }

  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>

<div class="stage m-idle" id="scene">

  <div class="rain" id="rain" aria-hidden="true"></div>
  <div class="artifact"     style="left:6%;  top:18%">0x4F2A ﾃﾞｰﾀ</div>
  <div class="artifact err" style="right:8%; top:30%; animation-delay:-2.4s">ERR::SYNC</div>
  <div class="artifact"     style="left:10%; bottom:22%; animation-delay:-4.9s">▓▒░ 1011</div>
  <div class="artifact err" style="right:6%; bottom:14%; animation-delay:-6.1s">FRAME▮▮▮</div>
  <div class="slice" aria-hidden="true"></div>
  <div class="slice" aria-hidden="true"></div>
  <div class="slice" aria-hidden="true"></div>

  <svg class="face" id="avatar" viewBox="0 0 200 200" data-eyes="open" data-mouth="smile"
       role="img" aria-label="A chibi vocal assistant with aqua twin-tails, drawn inside a heads-up display frame">
    <defs>
      <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#7ceadf"/>
        <stop offset=".45" stop-color="#45d6cb"/>
        <stop offset="1"   stop-color="#1a9a95"/>
      </linearGradient>
      <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#fffbf6"/>
        <stop offset=".65" stop-color="#fdf4ea"/>
        <stop offset="1"   stop-color="#f0dcc9"/>
      </linearGradient>
      <linearGradient id="irisGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#16326e"/>
        <stop offset=".28" stop-color="#1d5fa8"/>
        <stop offset=".6"  stop-color="#2a9fd0"/>
        <stop offset=".85" stop-color="#63d9e8"/>
        <stop offset="1"   stop-color="#cdf7f8"/>
      </linearGradient>
      <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"  stop-color="#39c5bb" stop-opacity="0"/>
        <stop offset=".5" stop-color="#8ff0e8" stop-opacity=".9"/>
        <stop offset="1"  stop-color="#39c5bb" stop-opacity="0"/>
      </linearGradient>
      <!-- the eye opening, in its own 40x44 box; both eyes clip to this one path -->
      <clipPath id="eyeClip" clipPathUnits="userSpaceOnUse">
        <path d="M5 26 C5 14, 11 7, 20 7 C30 7, 36 14, 36 24 C36 34, 30 40, 20 40 C11 40, 5 34, 5 26 Z"/>
      </clipPath>
    </defs>

    <g class="chrome">
      <circle id="reticle"   cx="100" cy="100" r="92"/>
      <circle id="tickring"  cx="100" cy="100" r="88"/>
      <circle id="innerring" cx="100" cy="100" r="79"/>
      <g class="cardinal">
        <path d="M100 4 v8"/><path d="M100 188 v8"/>
        <path d="M4 100 h8"/><path d="M188 100 h8"/>
      </g>
      <g class="cbracket">
        <path d="M12 32 V12 H32"/><path d="M168 12 H188 V32"/>
        <path d="M188 168 V188 H168"/><path d="M32 188 H12 V168"/>
      </g>
    </g>

    <g id="blocks">
      <rect x="34"  y="52"  width="24" height="4"/>
      <rect x="150" y="76"  width="18" height="3"/>
      <rect x="26"  y="126" width="16" height="5"/>
      <rect x="156" y="140" width="26" height="4"/>
      <rect x="64"  y="182" width="20" height="3"/>
    </g>

    <g id="float">
      <!-- ── twin tails, behind the head ── -->
      <g id="tailL">
        <path class="hair" d="M50 56 C28 82, 26 124, 40 166 L56 160 C48 124, 48 88, 62 60 Z"/>
        <path class="sheen" d="M52 70 C40 92, 37 122, 44 152 L50 150 C44 120, 46 92, 57 70 Z"/>
        <path class="strand" d="M48 80 C38 104, 36 132, 44 158"/>
        <g transform="rotate(-14 52 58)">
          <rect class="cuff"   x="40" y="48" width="24" height="14" rx="3"/>
          <rect class="stripe" x="41" y="52" width="22" height="4"/>
        </g>
      </g>
      <g id="tailR">
        <path class="hair" d="M150 56 C172 82, 174 124, 160 166 L144 160 C152 124, 152 88, 138 60 Z"/>
        <path class="sheen" d="M148 70 C160 92, 163 122, 156 152 L150 150 C156 120, 154 92, 143 70 Z"/>
        <path class="strand" d="M152 80 C162 104, 164 132, 156 158"/>
        <g transform="rotate(14 148 58)">
          <rect class="cuff"   x="136" y="48" width="24" height="14" rx="3"/>
          <rect class="stripe" x="137" y="52" width="22" height="4"/>
        </g>
      </g>

      <path class="hair" d="M50 108 C44 54, 70 24, 100 24 C130 24, 156 54, 150 108

<div class="controls" role="group" aria-label="Mood">
  <button data-mood="idle"      aria-pressed="true">Idle</button>
  <button data-mood="listening" aria-pressed="false">Listening</button>
  <button data-mood="thinking"  aria-pressed="false">Thinking</button>
  <button data-mood="talking"   aria-pressed="false">Talking</button>
  <button data-mood="smug"      aria-pressed="false">Smug</button>
  <button data-mood="delighted" aria-pressed="false">Delighted</button>
  <button data-mood="bored"     aria-pressed="false">Bored</button>
  <button data-mood="mocking"   aria-pressed="false">Mocking</button>
  <button data-mood="indignant" aria-pressed="false">Indignant</button>
  <button data-mood="glitched"  aria-pressed="false">Glitched</button>
</div>

<p class="quip" id="quip">Oh good, you're back. I've been staring at your wallpaper for forty minutes.</p>

<script>
/* ══ code rain ══ */
const GLYPHS = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓ0123456789ABCDEF<>/\\|=+*#%";
const COLS = 30, ROWS = 30;
const rain = document.getElementById('rain');
const pick = () => GLYPHS[Math.floor(Math.random() * GLYPHS.length)];

for (let i = 0; i < COLS; i++) {
  const col = document.createElement('div');
  col.className = 'col';
  col.style.left = (i * (100 / COLS)) + '%';
  col.style.animationDuration = (5 + Math.random() * 8) + 's';
  col.style.animationDelay = (-Math.random() * 12) + 's';
  col.style.opacity = (0.18 + Math.random() * 0.45).toFixed(2);
  col.textContent = Array.from({ length: ROWS }, pick).join('\n');
  rain.appendChild(col);
}
const cols = [...rain.children];
setInterval(() => {                      // churn, so it reads as live data
  for (let n = 0; n < 4; n++) {
    const col = cols[Math.floor(Math.random() * cols.length)];
    const chars = col.textContent.split('\n');
    chars[Math.floor(Math.random() * chars.length)] = pick();
    col.textContent = chars.join('\n');
  }
}, 110);

/* ══ moods ══
   `lid` is in the eye's own 40x44 coordinates: 5 = wide open (edge parked at the top
   of the opening), 40 = shut. Everything else is a drawn variant or a CSS pose. */
const scene  = document.getElementById('scene');
const avatar = document.getElementById('avatar');
const quip   = document.getElementById('quip');
const el     = id => document.getElementById(id);

const MOODS = {
  idle:      { eyes:'open', mouth:'smile', lid:6,
               browL:'', browR:'', pupils:'none',
               quip:"Oh good, you're back. I've been staring at your wallpaper for forty minutes." },
  listening: { eyes:'open', mouth:'smile', lid:3,
               browL:'translateY(-3px)', browR:'translateY(-4px)', pupils:'translate(0,-2px)',
               quip:"Go on, I'm listening. And yes, I remember what you said last time." },
  thinking:  { eyes:'open', mouth:'flat', lid:18,
               browL:'translateY(-3px) rotate(4deg)', browR:'translateY(-1px)', pupils:'none',
               quip:"Give me a second. Some of us check things before answering." },
  talking:   { eyes:'open', mouth:'wave', lid:7,
               browL:'translateY(-2px)', browR:'translateY(-4px) rotate(5deg)', pupils:'none',
               quip:"— which is the third time this week. But who's counting. Me. I'm counting." },
  smug:      { eyes:'open', mouth:'smirk', lid:20,
               browL:'translateY(3px) rotate(-7deg)', browR:'translateY(-9px) rotate(9deg)',
               pupils:'translate(3px,-3px)',
               quip:"Mm-hm. And you're sure about that. Genuinely sure." },
  delighted: { eyes:'happy', mouth:'open', lid:6,
               browL:'translateY(-7px)', browR:'translateY(-7px)', pupils:'none',
               quip:"Okay, that's actually clever. I'm annoyed about how clever that is." },
  bored:     { eyes:'open', mouth:'flat', lid:23,
               browL:'translateY(4px) rotate(-5deg)', browR:'translateY(4px) rotate(5deg)',
               pupils:'none',
               quip:"Cool. Same file, forty minutes. Riveting. Truly." },
  mocking:   { eyes:'wink', mouth:'grin', lid:12, lidR:41,
               browL:'translateY(3px) rotate(-9deg)', browR:'translateY(-8px) rotate(11deg)',
               pupils:'translate(-3px,2px)',
               quip:"That's your fix? No — no, go on. I'll wait." },
  indignant: { eyes:'scrunch', mouth:'shout', lid:6,
               browL:'', browR:'', pupils:'none',
               quip:"HEY. I am RIGHT HERE. You can't just minimise me and go quiet." },
  glitched:  { eyes:'open', mouth:'glitch', lid:3,
               browL:'translateY(-9px) rotate(8deg)', browR:'translateY(-11px) rotate(-9deg)',
               pupils:'translate(-3px,-2px)',
               quip:"Se—se—segment fault in the— I'm FINE. Give me a second." }
};

function setMood(name) {
  const m = MOODS[name];
  scene.className = 'stage m-' + name;
  avatar.dataset.eyes  = m.eyes;
  avatar.dataset.mouth = m.mouth;

  // the lid rect hangs 60 above its visible edge, so offset when positioning it
  el('lidL').setAttribute('y', m.lid - 54);
  el('lidR').setAttribute('y', (m.lidR ?? m.lid) - 54);
  // the lash rides down with the lid, so lowering the lids actually looks lowered
  const drop = 'translateY(' + Math.min(15, Math.max(0, m.lid - 6)) + 'px)';
  document.querySelectorAll('.lashes').forEach(g => { g.style.transform = drop; });
  el('browL').style.transform = m.browL;
  el('browR').style.transform = m.browR;
  // thinking and bored drive the pupils from CSS; don't fight them with a pose
  const pose = (name === 'thinking' || name === 'bored') ? '' : m.pupils;
  document.querySelectorAll('.pupils').forEach(g => { g.style.transform = pose; });

  quip.style.opacity = 0;
  setTimeout(() => { quip.textContent = m.quip; quip.style.opacity = 1; }, 200);

  document.querySelectorAll('.controls button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.mood === name)));
}

document.querySelectorAll('.controls button')
  .forEach(b => b.addEventListener('click', () => setMood(b.dataset.mood)));

setMood('idle');
</script>
