body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:0}.page-head h1{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:650;letter-spacing:.045em}.tab,.app-name b{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.07em}.side-nav button{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;letter-spacing:.01em}.card h3{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:650;letter-spacing:.09em}.table-row,.model,.lane,.bubble,.clarvis-panel{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.kpi strong{font-family:"SFMono-Regular",Consolas,monospace}.page-head p{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11px;letter-spacing:.01em}.backronym{margin:3px 0 4px;color:var(--accent);font:600 9px/1.3 "SFMono-Regular",Consolas,monospace;letter-spacing:.075em;text-transform:uppercase;text-shadow:0 0 10px rgba(var(--rgb),.4)}
/* Animated ecosystem field. Canvas is behind every panel and never captures input. */
#network-bg{position:fixed;inset:62px 0 0 220px;width:calc(100% - 220px);height:calc(100% - 62px);pointer-events:none;z-index:0;opacity:1}.body,.top{position:relative;z-index:1}.side,.main{position:relative}.main{background:radial-gradient(ellipse at 58% 44%,rgba(6,28,40,.035),transparent 65%)}
/* Character scale: avatars are a deliberate product-presence, not status icons. */
.page-head{height:150px;padding-right:205px}.page-head.no-avatar{padding-right:22px}.page-head.no-avatar .avatar-slot:after{display:none}.avatar-slot{width:190px;height:146px;right:8px;top:1px}.avatar-frame{transform:scale(.43)}.avatar-slot .top-avatar{margin:-170px}.avatar-slot:after{right:22px;bottom:8px;font-size:7px}.clarvis-panel .avatar-frame{transform:scale(.39);margin:-101px auto -88px}.clarvis-panel{padding-top:8px}
/* Explicit-color Firefox fallback: do not rely on backdrop-filter or blend modes

.card{background:linear-gradient(145deg,rgba(8,26,37,.72),rgba(4,14,21,.76))}.page-head{background:linear-gradient(115deg,rgba(8,28,40,.78),rgba(5,16,24,.72))}@supports not (backdrop-filter:blur(2px)){.card{background:linear-gradient(145deg,rgba(8,26,37,.82),rgba(4,14,21,.86))}}

/* ── ABSENCE ──────────────────────────────────────────────────────────────
   A missing service must look missing. Never a zero, never an em-dash that
   reads like a measurement, never a stale figure presented as current. */
.absent{display:flex;flex-direction:column;gap:3px;padding:2px 0}
.absent b{font:600 12px/1.3 var(--mono,ui-monospace,monospace);letter-spacing:.04em;text-transform:uppercase}
.absent span{font-size:11px;color:#6c7b8c;line-height:1.35}
.absent[data-state="unreachable"] b,.absent[data-state="stopped"] b{color:#ff5c6a}
.absent[data-state="degraded"] b{color:#ffb648}
.absent[data-state="stale"] b,.absent[data-state="discovering"] b{color:#8b9bb0}
.absent[data-state="incompatible"] b,.absent[data-state="unauthorized"] b{color:#ff9d3d}
.card.is-absent{opacity:.82;border-style:dashed}
.banner{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:9px;
        border:1px solid rgba(255,92,106,.32);background:rgba(255,92,106,.07);margin-bottom:12px}
.banner[data-tone="info"]{border-color:rgba(125,108,255,.3);background:rgba(125,108,255,.07)}

.banner p{margin:2px 0 0;font-size:11.5px;color:#8b9bb0;line-height:1.45}
/* provenance and staleness travel with the number, not in a footnote */
.prov{display:inline-block;font:600 9.5px/1 ui-monospace,monospace;letter-spacing:.08em;
      padding:3px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.prov[data-kind="MEASURED"]{color:#3ddc97;background:rgba(61,220,151,.13)}
.prov[data-kind="ESTIMATED"]{color:#ffb648;background:rgba(255,182,72,.13)}
.prov[data-kind="UNKNOWN"]{color:#8b9bb0;background:rgba(139,155,176,.13)}
.stamp{font:400 10px/1 ui-monospace,monospace;color:#5d6b7e;margin-left:6px}
.stamp.stale{color:#ffb648}
.top-status .dot[data-state="warn"]{background:#ffb648;box-shadow:0 0 8px #ffb648}
.top-status .dot[data-state="bad"]{background:#ff5c6a;box-shadow:0 0 8px #ff5c6a}
/* fault injection: the degradation gate should be walkable by clicking */
.fault-controls{position:fixed;right:14px;bottom:12px;z-index:60;display:flex;gap:6px;align-items:center}
.fault-controls b{font:9px/1 monospace;text-transform:uppercase;letter-spacing:.09em;color:#5d6b7e;margin-right:2px}

.fault-controls button[data-state="unreachable"]{color:#ff5c6a;border-color:rgba(255,92,106,.4)}
@media(max-width:620px){.fault-controls{display:none}}

/* ── EMBEDDED EDITOR SEAM ────────────────────────────────────────────────
   code-server is a separate document in its own frame — that boundary is a
   security requirement, not a limitation. What can go is the *visible* seam:
   the template's rail steps aside so the editor's own activity bar and
   explorer occupy that column, and the editor bleeds to the chrome edges.
   The page head stays, so Clarvis carries the same title and avatar slot as
   every other app. */



.app[data-app="clarvis"] .page-head{margin:0;border-radius:0;border-left:0;border-right:0;border-top:0;
  padding:14px 20px;flex:0 0 auto}




/* ── CLARVIS PANEL ──────────────────────────────────────────────────────────

.clarvis-chat{display:flex;flex-direction:column;gap:6px;padding:4px 2px;height:100%;min-height:0;

.clarvis-turn.user{color:#7f8fa1;border-left-color:#33445a}
.clarvis-turn.user .who{color:#7f8fa1}

/* Each option carries its own explanation, rather than a list above a row of bare
   labels repeating it. Stacked when explained; binary answers get pushed apart,

.clarvis-choices{display:flex;flex-wrap:wrap;gap:6px;padding-left:8px;margin-top:-2px}
.clarvis-choices.stacked{flex-direction:column;align-items:stretch}
.clarvis-choices.binary{justify-content:space-between;gap:16px;padding:2px 8px 0}
.clarvis-choice{font:inherit;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;

.clarvis-choice:hover{background:rgba(52,230,242,.08)}
.clarvis-choice .label{font-weight:600;white-space:normal}
.clarvis-choice .detail{font-size:11px;line-height:1.35;opacity:.75;white-space:normal}
.clarvis-progress{flex:0 0 auto;padding:4px 8px;border-radius:4px;background:rgba(52,230,242,.06);font-size:11px}
.clarvis-progress[data-active="false"]{display:none}

.clarvis-chat-head{display:flex;align-items:center;justify-content:flex-end;flex:0 0 auto;gap:6px}

  padding:2px 8px;font-size:11px;opacity:.75}
.clarvis-mute:hover{opacity:1;background:rgba(255,255,255,.06)}
.clarvis-mode{opacity:1;font-weight:600}
.clarvis-mode[data-safe="true"]{color:#3ddc97}
.clarvis-prompt{display:flex;align-items:flex-end;gap:6px;flex:0 0 auto}
.clarvis-bowtie{display:flex;align-items:center;justify-content:center;flex:0 0 auto;height:32px;width:28px;
  padding:0;cursor:pointer;background:none;border:1px solid #223041;border-radius:4px;color:#c6d2de;opacity:.7}
.clarvis-bowtie:hover{opacity:1;background:rgba(255,255,255,.06)}
.clarvis-stop[data-busy="false"]{opacity:.4;cursor:default}

#clarvis-input{flex:1 1 auto;box-sizing:border-box;resize:none;padding:6px 8px;border-radius:4px;
  border:1px solid #223041;background:#0a0f16;color:#c6d2de;font:inherit}
#clarvis-input:focus{outline:1px solid var(--cyan)}
/* code-server keeps its side *panel* — explorer, search, source control — but not
   its activity bar: the template's rail selects the view instead, so an embedded
   editor shows one navigation column rather than two stacked side by side. */
/* visibility, not display: the explorer, editor and terminal are auto-placed, so
   removing the activity bar from the grid would shift every one of them a column
   left. It keeps its cell and simply occupies no width. */
.app[data-app="clarvis"] .activity{visibility:hidden;width:0;padding:0;border:0;overflow:hidden}
/* collapse the activity track rather than removing it: the editor, terminal and
   Clarvis panel all place themselves by explicit column number. */
.app[data-app="clarvis"] .code-server{grid-template-columns:0 200px 1fr 285px}
/* Fallback with teeth: no Bridge, no remote control — the editor's own activity bar
   comes back and the workspace stays navigable without NERVIS. */
.app[data-app="clarvis"].bridge-down .activity{visibility:visible;width:auto;padding:13px;border-right:1px solid #202832}
.app[data-app="clarvis"].bridge-down .code-server{grid-template-columns:42px 200px 1fr 285px}
.app[data-app="clarvis"].bridge-down .side-nav button{opacity:.45;pointer-events:none}
.app[data-app="clarvis"] .clarvis-panel{display:flex;padding:10px 12px;min-height:0}
/* Grid items default to min-width:auto, so one long line of code refuses to shrink
   and widens the 1fr track past its share — which pushed the Clarvis panel clean
   outside the frame. Let the editor scroll instead of shoving its siblings. */
.app[data-app="clarvis"] .editor{min-width:0;overflow:auto}
.app[data-app="clarvis"] .code-server{max-width:100%;overflow:hidden}
.app[data-app="clarvis"] .terminal{white-space:pre-line;min-width:0;overflow:auto}
/* The editor fills whatever height is left rather than a fixed 580px, stopping
   clear of the demo and fault strips pinned to the bottom of the viewport. Flex
   column, so the Bridge banner keeps its natural height above it. */
.app[data-app="clarvis"] .main{display:flex;flex-direction:column;overflow:hidden;padding-bottom:80px}
.app[data-app="clarvis"] .page-head{flex:0 0 auto;margin-bottom:13px}
.app[data-app="clarvis"] .grid{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.app[data-app="clarvis"] .banner{flex:0 0 auto}
.app[data-app="clarvis"] .code-server{height:auto;flex:1 1 auto;min-height:320px}

/* ── FOCUS MODE ─────────────────────────────────────────────────────────────
   code-server does have a Zen Mode (workbench.action.toggleZenMode) and it works
   in the browser — but it only reaches inside its own document. It cannot hide
   this dashboard's rail or page head, because those belong to a different page.
   So focus is two coordinated halves: the template hides its own chrome, and the
   editor is asked to go Zen through the same closed command enum. The top bar
   stays, so there is always a way back. */
.zen-toggle{margin-left:auto;background:rgba(6,20,29,.9);border:1px solid #1b4050;border-radius:2px;
  color:#8494a5;padding:5px 9px;cursor:pointer;font:9px/1 monospace;text-transform:uppercase;
  letter-spacing:.06em}
.zen-toggle:hover{color:var(--hud,var(--accent));border-color:var(--hud,var(--accent))}
.app.zen .zen-toggle{color:var(--accent);border-color:var(--accent)}
.app.zen .side{display:none}
.app.zen .body{grid-template-columns:minmax(0,1fr)}
.app.zen .page-head{display:none}
.app.zen .main{padding:10px}
body.zen .demo-controls,body.zen .fault-controls{display:none}

/* Focus mode hides the dashboard header, and with it the shared avatar slot — so
   the chat panel takes him back, exactly as standalone VS Code renders him. One
   butler on screen at a time, wherever there is room for him. Same 340px frame as
   the header, scaled down with negative margins collapsing the layout box, since
   transform does not affect layout. */


/* ── BRAND SCAN ─────────────────────────────────────────────────────────────
   A camera lens, not an eye: it slews to a bearing, stops the aperture down while
   it moves, then opens and settles as focus locks. It never blinks and never
   follows the cursor — that is what keeps it an instrument rather than a creature.
   Clarvis is the only thing in this ecosystem with eyes.

   The mark is rotated 45°, so the dot counter-rotates first: transforms compose
   right-to-left, and rotate(-45) cancels the parent's rotate(45), leaving the
   travel in screen space instead of along the diamond's diagonals. */
.brand i:after{transform-origin:center;animation:brandScan 7s ease-in-out infinite}
@keyframes brandScan{
  0%,15%  {transform:rotate(-45deg) translate(0,0) scale(1)}
  18%     {transform:rotate(-45deg) translate(1.8px,-.5px) scale(.55)}   /* stopped down, slewing */
  21%,36% {transform:rotate(-45deg) translate(3.5px,-1px) scale(1)}      /* focus locked */
  39%     {transform:rotate(-45deg) translate(.7px,.8px) scale(.55)}
  42%,56% {transform:rotate(-45deg) translate(-2px,2.5px) scale(1)}
  59%     {transform:rotate(-45deg) translate(-.8px,2.9px) scale(.55)}
  62%,75% {transform:rotate(-45deg) translate(.5px,3.2px) scale(1)}
  78%     {transform:rotate(-45deg) translate(-1.2px,.6px) scale(.55)}
  81%,94% {transform:rotate(-45deg) translate(-3px,-2px) scale(1)}
  97%     {transform:rotate(-45deg) translate(-1.5px,-1px) scale(.55)}
  100%    {transform:rotate(-45deg) translate(0,0) scale(1)}
}
/* The barrel ring catches a highlight the instant focus lands. */
.brand i:before{animation:brandLock 7s ease-in-out infinite}
@keyframes brandLock{
  0%,19%,38%,40%,58%,60%,77%,79%,96%,100%{border-color:rgba(85,220,255,.2)}
  22%,43%,63%,82%{border-color:rgba(85,220,255,.6)}
}
/* Centred properly: the frame is 340px and only *drawn* at 116px, so it is
   absolutely positioned inside a box the size of what you actually see —
   the same trick .top-avatar uses. Negative margins alone left it off-centre. */
.panel-avatar-wrap{width:116px;height:116px;margin:2px 0 8px;flex:0 0 auto;align-self:center;
  position:relative;overflow:hidden}
/* a later theme layer restyles .avatar-frame, so this has to outrank it on
   specificity rather than order — margin centres the 340px canvas in the
   116px window, and the scale is what makes it 116px of drawn avatar. */
.clarvis-chat .panel-avatar-wrap iframe.avatar-frame{position:absolute;left:50%;top:50%;
  margin:-170px;width:340px;height:340px;border:0;background:transparent;
  transform:scale(.34);transform-origin:center;pointer-events:none}
@media(prefers-reduced-motion:reduce){.brand i:after,.brand i:before{animation:none}}

/* A candidate removed by a hard constraint is a different object from one that
   merely scored lower — it never reached the ranking phase, and the UI says so. */
.lane.excluded{opacity:.55;border-style:dashed}
.lane.excluded b{text-decoration:line-through;text-decoration-color:rgba(255,92,106,.5)}
.lane.excluded small{color:#ff8f99}
.chip.warn{color:#ffb648;border-color:rgba(255,182,72,.4)}
/* the default row is four columns; the request log carries an execution path too */
.table-row.five{grid-template-columns:1.1fr .8fr 1.1fr .45fr .45fr}
small.dim{display:block;opacity:.55;margin:6px 0 4px;line-height:1.45}

/* Waterfall. Fast steps really are hairlines next to inference — that contrast is
   the finding, so the bars stay to scale and get a minimum width instead. */
.wf{display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:center;margin-bottom:5px;
  font:9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8b9bb0}
.wf .track{position:relative;height:15px;background:rgba(255,255,255,.03);border-radius:3px}
.wf .track i{position:absolute;top:3px;height:9px;min-width:3px;border-radius:2px;
  background:var(--accent);box-shadow:0 0 7px rgba(var(--rgb),.55)}
.wf .track .gap{position:absolute;top:3px;height:9px;border:1px dashed rgba(255,182,72,.55);border-radius:2px}
.wf .track b{position:absolute;top:4px;font-weight:400;white-space:nowrap;opacity:.75}
.wf .track b.miss{color:#ffb648}

/* Chat carries its own route explanation, because a router that cannot say why is
   just a proxy. Neutral throughout: NERVIS has no personality — that is Clarvis's job. */
.profile-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mode-chip{font:9px/1 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;
  padding:6px 9px;border-radius:2px;border:1px solid #1b4050;background:rgba(6,20,29,.9);
  color:#8494a5;cursor:pointer}
.mode-chip.on{color:var(--accent);border-color:var(--accent)}
.route-card{border:1px solid rgba(var(--rgb),.22);border-radius:7px;padding:8px 10px;margin:2px 0 12px;
  background:rgba(var(--rgb),.04)}
.route-card .table-row{padding:5px 2px}

/* Hover label for the rail. Uses ::before because ::after is already the active-item
   dot, and reads data-label rather than title so the native tooltip does not appear
   on top of it. Matters most below 900px, where the written labels are hidden. */
.side-nav button:before{content:attr(data-label);position:absolute;left:calc(100% + 9px);
  top:50%;transform:translateY(-50%) translateX(-4px);padding:5px 9px;border-radius:5px;
  background:#0b131c;border:1px solid rgba(var(--rgb),.4);color:#dbe6f2;
  font:11px/1 Inter,-apple-system,system-ui,sans-serif;letter-spacing:.02em;white-space:nowrap;
  opacity:0;pointer-events:none;z-index:70;box-shadow:0 8px 22px #000a;
  transition:opacity .12s ease,transform .12s ease}
.side-nav button:hover:before,.side-nav button:focus-visible:before{opacity:1;transform:translateY(-50%) translateX(0)}
@media(prefers-reduced-motion:reduce){.side-nav button:before{transition:none}}

<body><div class="app"><header class="top"><div class="brand"><i></i><span>NERVIS</span></div><nav class="tabs" aria-label="Applications"><button class="tab active" data-app="nervis">NERVIS</button><button class="tab" data-app="sirvis">SIRVIS</button><button class="tab" data-app="ravis">RAVIS</button><button class="tab" data-app="clarvis">CLARVIS</button></nav><div class="top-status"><i class="dot"></i><span id="globalStatus">All systems operational</span></div></header><div class="body"><aside class="side"><div class="app-name"><b id="sideName">NERVIS</b><small id="sideTag">Control plane</small></div><nav class="side-nav" id="sideNav"></nav><div class="connection"><b>Local ecosystem</b><span>● Connected</span></div></aside><main class="main"><section class="page-head"><div><h1 id="pageTitle">Ecosystem overview</h1><p id="pageSubtitle">Unified health, activity and intelligence across every service.</p><div class="actions" id="pageActions"></div></div><div class="avatar-slot" id="avatarSlot"></div></section><section class="grid" id="content"></section></main></div></div><div class="fault-controls" aria-label="Simulate service absence">

<script>
/* APP_CONFIG is the first place to edit when adding a real project or route. */
const APP_CONFIG={
 nervis:{name:'NERVIS',tag:'Networked Ecosystem Runtime Visualization & Intelligence System',accent:'#7d6cff',rgb:'125,108,255',nav:['Overview','Chat','Ecosystem map','Events','Traces','Diagnostics','Settings']},
 sirvis:{name:'SIRVIS',tag:'Silicon Inference Runtime Validation & Intelligence System',accent:'#3ddc97',rgb:'61,220,151',nav:['Dashboard','Models','Benchmarks','Runtime sets','Results','Recommendations','Downloads','System']},
 ravis:{name:'RAVIS',tag:'Runtime-Adaptive Vendor Intelligence System',accent:'#ff6ec7',rgb:'255,110,199',nav:['Dashboard','Routes','Pools','Providers','Policies','Evidence','Logs','Diagnostics']},
 clarvis:{name:'CLARVIS',tag:'Clippy-Like, A Rather Very Intelligent System',accent:'#34e6f2',rgb:'52,230,242',nav:['Workspace','Explorer','Search','Source control','Run & debug','Extensions','Terminal']}
};
const state={app:'nervis',view:'Overview',manual:false,demo:true,scene:0};
/* ── ABSENCE VOCABULARY ───────────────────────────────────────────────────
   Every figure on screen belongs to a service, and no service is assumed
   present. These are NERVIS's *observer-side* registry states, deliberately
   distinct from the healthy|degraded|unhealthy a peer reports about itself:
   reachability is never promoted to readiness. Replace the literal `state`
   values with the registry's real ones at the DEMO_API seam. */
const SERVICES={
 nervis :{label:'NERVIS',         state:'healthy', age:2},
 ravis  :{label:'RAVIS',          state:'healthy', age:3},
 sirvis :{label:'SIRVIS',         state:'healthy', age:9},
 clarvis:{label:'Clarvis Bridge', state:'healthy', age:5}
};
const REASON={
 healthy:'', degraded:'responding; some capabilities unavailable',
 unreachable:'no response on the configured endpoint',
 stale:'last response older than the detection interval',
 incompatible:'unsupported protocol major', unauthorized:'authentication rejected',
 stopped:'not running', discovering:'negotiating capabilities'};

function avatarFrame(app,extra=''){return `<iframe class="avatar-frame ${extra}" data-avatar="${app}" title="${app.toUpperCase()} animated avatar"></iframe>`}
/* Map each visible screen to the avatar vocabulary defined by its own source.
   Add future routes here instead of scattering avatar decisions through views. */
function desiredAvatarState(app=state.app,view=state.view){const maps={
 nervis:{Overview:'nominal',Chat:'routing','Ecosystem map':'scanning',Events:'scanning',Traces:'analyzing',Diagnostics:'analyzing',Settings:'nominal'},
 sirvis:{Dashboard:'loading',Models:'loading',Benchmarks:'measuring','Runtime sets':'warmup',Results:'verdict',Recommendations:'verdict',Downloads:'loading',System:'thermal'},
 ravis:{Dashboard:'ranking',Routes:'ranking',Pools:'selected',Providers:'eligibility',Policies:'eligibility',Evidence:'ranking',Logs:'selected',Diagnostics:'fallback'},
 clarvis:{Workspace:'thinking',Explorer:'neutral',Search:'thinking','Source control':'judging','Run & debug':'talking',Extensions:'neutral',Terminal:'talking'}
 };return maps[app]?.[view]||({nervis:'nominal',sirvis:'loading',ravis:'ranking',clarvis:'thinking'})[app]}
function syncFrameState(frame){const app=frame.dataset.avatar;const wanted=desiredAvatarState(app,app==='clarvis'?state.view:state.view);try{frame.contentWindow.setState(wanted)}catch(e){/* canonical initial state remains until the frame is ready */}}
function hydrateAvatarFrames(){document.querySelectorAll('iframe[data-avatar]:not([data-ready])').forEach(frame=>{const app=frame.dataset.avatar;const presentation='<style>html,body{width:340px!important;height:340px!important;min-height:0!important;margin:0!important;padding:0!important;display:block!important;overflow:hidden!important;background:transparent!important}.stage{width:340px!important;height:340px!important;margin:0!important}.controls,.status,.quip{display:none!important}</style>';frame.onload=()=>syncFrameState(frame);frame.srcdoc=atob(AVATAR_SOURCE_B64[app]).replace('</head>',presentation+'</head>');frame.dataset.ready='true'})}
/* The Clarvis extension panel uses the same canonical avatar as the header. */
/* Embedded, the extension renders its chat panel WITHOUT an avatar: one butler
   per screen, and he lives in the header with the other three. Standalone VS Code
   is unaffected and keeps the panel avatar — the extension decides which, from
   the host signal described at CLARVIS_BRIDGE. */
function replaceClarvisPanelAvatar(){const old=document.querySelector('.mini-butler');if(old)old.remove()}
/* Embedded, the header carries him. In focus mode there is no header, so the panel
   does — which is also what the extension does when it runs in a plain editor. */
function syncPanelAvatar(){
 const chat=document.querySelector('.clarvis-chat');if(!chat)return;
 const has=chat.querySelector('iframe[data-avatar="clarvis"]');
 const want=document.body.classList.contains('zen');
 if(want&&!has){chat.insertAdjacentHTML('afterbegin',
   '<div class="panel-avatar-wrap">'+avatarFrame('clarvis','panel-avatar')+'</div>');hydrateAvatarFrames()}
 else if(!want&&has)has.closest('.panel-avatar-wrap')?.remove()}

   spec defines. Wiring this to live services is mechanical:

     1. delete the `return` body
     2. `return (await fetch(BASE.sirvis + '/api/v1/models')).json()`
     3. keep the shape

   Methods are already async and the views already `await` them, so nothing
   about the render path changes when the body starts doing real I/O. Field
   names are the contract ones, not display ones — rename at the view, never
   here, or the swap stops being mechanical.

   a STOP item, not an invitation to invent one. */

   ['Memory',rs.combined_peak_gb+' GB',`peak · ${rs.swap_gb} swap ${stamp(SERVICES.sirvis.age)}`],
   ['Median speed',String(rn.generation_tok_s.median),`tok/s · ${rn.generation_tok_s.min}–${rn.generation_tok_s.max}`],
   ['Evidence',rs.samples+' runs',`${prov(rs.evidence_type)} combination measured`]],'sirvis')
 +`<div class="card wide"><h3>Installed builds</h3>${mdl.items.map((m,i)=>`<div class="model ${i?'':'selected'}" onclick="selectOne(this,'.model')"><b>${m.family}</b> · ${m.variant} · ${m.source} <span class="chip">${m.state}</span><small class="mono"> ${ctx(m.runtime_config)}${m.runtime_config.flash_attention?' · flash-attn':''} · ${m.resident_gb?m.resident_gb+' GB':'—'}</small><div class="bar"><i style="--w:${m.state==='busy'?100:0}%"></i></div></div>`).join('')}</div>
 <div class="card narrow"><h3>${rn.suite}@${rn.version} · ${rn.runs.length} runs</h3><div class="benchmark-stage">${rn.runs.map(v=>`<i style="--h:${Math.round(v*100)}%"></i>`).join('')}</div><b class="mono">median ${rn.median} · spread ${rn.spread}</b><small class="mono dim">${rn.warmups.length} warmups discarded, not scored · ${rn.validity}</small></div>
 <div class="card wide"><h3>Runtime set · ${rs.name} <span class="chip">rev ${rs.revision}</span></h3>
  <div class="table-row head"><span>Role</span><span>Build</span><span>Alone</span><span>Concurrent</span></div>
  ${rs.members.map(m=>`<div class="table-row"><span>${m.role}</span><span>${m.family} · ${m.variant}</span><span>${m.alone_tok_s} tok/s</span><span>${m.concurrent_tok_s} <small>−${Math.round((1-m.concurrent_tok_s/m.alone_tok_s)*100)}%</small></span></div>`).join('')}
  <small class="mono dim">combined ${rs.combined_peak_gb} GB peak · ${rs.swap_gb} swap · ${prov(rs.evidence_type,'n='+rs.samples)} — two builds that fit alone are not evidence that they fit together</small></div>
 <div class="card narrow"><h3>Validity</h3>${Object.entries(rs.validity).map(([k,v])=>`<div class="trace-step"><b>${k.replace('_',' ')}</b><span>${v}</span></div>`).join('')}</div>
 <div class="card full"><h3>Recent benchmark evidence</h3><div class="table-row head"><span>Target · runtime config</span><span>Role</span><span>Score</span><span>Provenance</span></div>
  ${ev.items.map(e=>`<div class="table-row"><span>${e.target.family} · ${e.target.variant}${e.target.runtime_config.context_length?' · '+e.target.runtime_config.context_length/1024+'K':''}</span><span>${e.role}</span><span>${score(e)}</span><span>${prov(e.evidence_type,e.validity||(e.estimation?'from '+e.estimation.source:''))}</span></div>`).join('')}</div>`}

async function ravis(){const v=RAVIS_VIEWS[state.view];if(v)return v();
 heading('Route intelligence','Hard constraints eliminate, then preferences rank. Every route explains itself.',`<button class="btn primary" onclick="DEMO_API.reroute()">Simulate request</button>`);
 const [rd,req,usage]=await Promise.all([API.ravis.routeDecision(),API.ravis.requests(),API.ravis.usage()]);
 const ekind={MEASURED_BY_SIRVIS:'MEASURED',OBSERVED_BY_RAVIS:'MEASURED',PROVIDER_METADATA:'ESTIMATED',ESTIMATED:'ESTIMATED',UNKNOWN:'UNKNOWN'};
 $('#content').innerHTML=kpis([['Routing P50',usage.routing_p50_ms+' ms','cached · rule-based'],['Local',usage.local_pct+'%','of today'],
   ['Spend','€'+usage.spend_today_eur.toFixed(2),`today · budget ${usage.budget_used_pct}% ${stamp(SERVICES.ravis.age)}`],['Pools',String(usage.pools.total),usage.pools.clarvis+' clarvis']],'ravis')
 +`<div class="card wide"><h3>${rd.pool} · candidates</h3>
  <small class="mono dim">eligible after hard constraints — ranked by preference</small>
  <div class="route-lanes">${rd.eligible.map(c=>`<div class="lane${c.selected?' selected':''}" onclick="selectOne(this,'.lane')"><b>${c.location} / ${c.target}</b><span>${c.score.toFixed(2)}</span><small>${c.notes.join(' · ')} · TTFT ${c.ttft_s}s${c.cost_eur?' · €'+c.cost_eur+' est':''} ${prov(ekind[c.evidence.kind],c.evidence.samples?'SIRVIS n='+c.evidence.samples:c.evidence.kind==='PROVIDER_METADATA'?'provider metadata':'')}</small></div>`).join('')}</div>
  <small class="mono dim">removed before scoring — a constraint, not a ranking</small>
  <div class="route-lanes">${rd.excluded.map(x=>`<div class="lane excluded"><b>${x.target}</b><span>—</span><small>${x.constraint}</small></div>`).join('')}</div></div>
 <div class="card narrow"><h3>Decision trace</h3>
  <div class="trace-step"><b>requirements</b><span>tools · ${rd.requirements.minimum_context/1024}K</span></div>
  <div class="trace-step"><b>hard constraints</b><span>${rd.eligible.length+rd.excluded.length} → ${rd.eligible.length}</span></div>
  <div class="trace-step"><b>pool invariant</b><span>tools ${rd.requirements.tools}</span></div>
  <div class="trace-step"><b>scoring</b><span>${rd.eligible.length} ranked</span></div>
  <div class="trace-step"><b>session affinity</b><span>${rd.affinity}</span></div>
  <div class="trace-step"><b>execute</b><span>${rd.execution_path}</span></div>
  <small class="mono dim">total ${rd.timings_ms.total} ms</small></div>
 <div class="card narrow"><h3>Fallback chain</h3>
  <div class="trace-step"><b>primary</b><span>${rd.eligible.find(c=>c.selected).target.split(' · ')[0]}</span></div>
  ${rd.fallback.map((f,i)=>`<div class="trace-step"><b>fallback ${i+1}</b><span>${f.split(' · ')[0]}</span></div>`).join('')}
  <small class="mono dim">every fallback satisfies the same hard constraints and pool invariant. Cancellation is not a failure and never triggers one.</small></div>
 <div class="card wide"><h3>Recent requests</h3><div class="table-row head five"><span>Pool</span><span>Model</span><span>Path</span><span>TTFT</span><span>Result</span></div>
  ${req.items.map(r=>`<div class="table-row five"><span>${r.pool}</span><span>${r.model||'—'}</span><span class="mono">${r.execution_path||'—'}</span><span>${r.ttft_s?r.ttft_s+'s':'—'}</span><span class="chip${r.result==='OK'?'':' warn'}">${r.result}</span></div>`).join('')}
  <small class="mono dim">${req.items.find(r=>r.result==='NO_ROUTE').reason} — a no-route is a first-class outcome, not an error: it failed closed rather than reaching for a provider.</small></div>`}

/* ── EDITOR_PREVIEW ────────────────────────────────────────────────────────
   Everything in here is rendered by code-server and the Clarvis extension inside
   the frame — NOT by NERVIS, and NOT fetched from any endpoint. The Bridge is
   read-only status; it never carries a prompt, a model reply or file contents.
   When the Code tab becomes a real iframe this constant is deleted outright,
   not ported: the frame will render its own. */
const EDITOR_PREVIEW={
 code:`<span class="kw">def</span> <span class="fn">add_tag</span>(tag: str, tags: list[str] = []) -&gt; list[str]:
    <span class="str">"""Attach a tag to a post and return the full list."""</span>
    tags.append(tag)
    <span class="kw">return</span> tags


<span class="kw">def</span> <span class="fn">tags_for</span>(post: dict) -&gt; list[str]:
    <span class="kw">return</span> add_tag(post[<span class="str">"tag"</span>]) <span class="cursor"></span>`,
 turns:[
  ['clarvis','Welcome back. Four commits since you left, and <code>test_tags</code> has been failing since the second one.'],
  ['user','why is add_tag returning tags from other posts'],
  ['clarvis','Because <code>tags=[]</code> is evaluated once, when the function is defined — not on each call. Every caller that omits it shares the same list, and that list has been collecting since import. Python\'s oldest trap, and it still gets invited to things.']],
 choices:[
  ['Default to None and build inside','tags=None, then tags=[] on entry. Signature unchanged.'],
  ['Require the argument','Drops the default. Both call sites must pass a list.'],
  ['Leave it','No change. It keeps sharing.']]
};

async function clarvis(){heading('Clarvis workspace','Reverse-proxied code-server. The frame renders itself; NERVIS reads status only.','<button class="btn" onclick="notify(\'Workspace state saved\')">Save session</button>');
 const [st,se]=await Promise.all([API.clarvis.status(),API.clarvis.session()]);
 /* The Bridge is optional by design: Clarvis activates and dies with its editor
    window and never depends on NERVIS. Its absence is a disconnected state, not
    an error — and it costs NERVIS visibility, not Clarvis function. */
 const bridge=usable('clarvis')?'':banner('Clarvis Bridge '+SERVICES.clarvis.state,
  `${REASON[SERVICES.clarvis.state]}. NERVIS cannot read this workspace's status, agent runs or gate state. Clarvis itself is unaffected — it runs from its own extension host and does not require NERVIS.`,'info');
 const pct=Math.round(st.run.step/st.run.total_steps*100);
 $('#content').innerHTML=bridge+`<div class="full code-server" id="clarvis-frame">
  <div class="vtitle">● ● ●　 ${se.file} — ${se.workspace}　　　　　　　　　　　　　　　code-server<button id="zenToggle" class="zen-toggle" onclick="setZen(!document.body.classList.contains('zen'))" title="Hide the dashboard chrome and give the editor the window">Focus</button></div>
  <div class="activity">▱<br>⌕<br>⑂<br>▷<br>▦<br>◉</div>
  <div class="explorer"><b>${(CLARVIS_VIEW[state.view]||CLARVIS_VIEW.Explorer).panel}</b><div class="file">▾ ${se.workspace}</div>${se.files.map(f=>`<div class="file${f===se.file?' active':''}">　${f}</div>`).join('')}</div>
  <div class="editor">${EDITOR_PREVIEW.code}</div>
  <aside class="clarvis-panel"><div class="clarvis-chat">
   <div id="clarvis-transcript">
    ${EDITOR_PREVIEW.turns.map(t=>`<div class="clarvis-turn ${t[0]}"><span class="who">${t[0]==='user'?'You':'Clarvis'}</span>${t[1]}</div>`).join('')}
    <div class="clarvis-choices stacked">${EDITOR_PREVIEW.choices.map(c=>`<button class="clarvis-choice"><span class="label">${c[0]}</span><span class="detail">${c[1]}</span></button>`).join('')}</div>
   </div>
   <div id="clarvis-progress" class="clarvis-progress" data-active="${st.state==='agent_running'}">
    <span class="count">step ${st.run.step} of ${st.run.total_steps}</span><span class="step">${st.run.label}</span>
    <span class="bar"><i style="width:${pct}%"></i></span>
   </div>
   <div class="clarvis-chat-head">
    <button id="clarvis-mode" class="clarvis-mute clarvis-mode" data-safe="${st.safe_mode}" title="What Clarvis is allowed to do">${st.mode==='agent'?'Auto':'Chat'}</button>
    <button id="clarvis-output" class="clarvis-mute" title="Every command and tool call, as it runs.">Output</button>
    <button id="clarvis-history" class="clarvis-mute" title="Earlier conversations from this workspace.">History</button>
    <button id="clarvis-clear" class="clarvis-mute" title="Delete the conversation. There is no undo.">Clear</button>
    <button id="clarvis-mute" class="clarvis-mute" data-muted="false" title="Silence him. Resets when the window reloads.">Mute</button>
   </div>
   <div class="clarvis-prompt">
    <button id="clarvis-models" class="clarvis-bowtie" title="Models"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M2 6l8 4.2v3.6L2 18V6zm20 0v12l-8-4.2v-3.6L22 6zM12 10.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg></button>
    <textarea id="clarvis-input" rows="2" placeholder="Ask. Enter sends."></textarea>
    <button id="clarvis-stop" class="clarvis-bowtie clarvis-stop" data-busy="${st.state==='agent_running'}" title="Stop what Clarvis is doing"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
   </div>
  </div></aside>
  <div class="terminal">TERMINAL　OUTPUT　DEBUG CONSOLE
$ ${se.terminal.cmd}
${se.terminal.output}</div>
  <div class="statusbar">${se.branch}　✓　Ln ${se.cursor.line}, Col ${se.cursor.col}　Spaces: ${se.indent}　${se.encoding}　${se.language}</div>
 </div>`}

/* async because the views await real endpoints. With mocks these resolve on the
   same tick, so nothing changes today — and nothing changes when they stop being
   mocks either, which is the point. */
async function render(){applyTheme();globalStatus();nav();$('#avatarSlot').innerHTML=avatar();
 if(state.app==='nervis')await nervis();if(state.app==='sirvis')await sirvis();
 if(state.app==='ravis')await ravis();if(state.app==='clarvis')await clarvis();replaceClarvisPanelAvatar();hydrateAvatarFrames();paintZen();syncPanelAvatar()}
function selectOne(el,selector){$$(selector).forEach(x=>x.classList.remove('selected'));el.classList.add('selected');notify('Selection updated');state.manual=true}
function seedEvents(){const box=$('#events');if(!box)return;['RAVIS routed clarvis/agent','Clarvis connected to workspace','SIRVIS benchmark completed','LM Studio model loaded'].forEach((x,i)=>box.insertAdjacentHTML('beforeend',`<div class="event"><time>10:26:0${8-i}</time><span>${x}</span></div>`))}
function notify(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>t.classList.remove('show'),2300)}function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
/* Cycling a service through healthy → degraded → unreachable is the whole point:
   the rule is that removing a dependency changes only the UI that depends on it,
   and that is only checkable if it can be removed. */
$$('.fault-controls button').forEach(b=>{const k=b.dataset.svc;
 const paint=()=>{const st=SERVICES[k].state;b.dataset.state=st==='healthy'?'':st;
  b.title=`${SERVICES[k].label}: ${st}${REASON[st]?' — '+REASON[st]:''}`};
 b.onclick=()=>{const i=CYCLE.indexOf(SERVICES[k].state);SERVICES[k].state=CYCLE[(i+1)%CYCLE.length];
  paint();state.manual=true;render();notify(`${SERVICES[k].label} → ${SERVICES[k].state}`)};paint()});
/* Focus is template-side because it must be: the dashboard's own chrome is not
   reachable from inside the editor's document. The real build pairs this with
   workbench.action.toggleZenMode over the Bridge, using the same closed enum as
   the view commands — presentation only, no new authority. */
function paintZen(){const b=document.getElementById('zenToggle');
 if(b)b.textContent=document.body.classList.contains('zen')?'Exit focus':'Focus'}
function setZen(on){document.querySelector('.app').classList.toggle('zen',on);document.body.classList.toggle('zen',on);paintZen();syncPanelAvatar();
 /* focusClarvisCommand('workbench.action.toggleZenMode') once the Bridge exists */}
addEventListener('keydown',e=>{if(e.key==='Escape')setZen(false)});
$$('.tab').forEach(t=>t.onclick=()=>{setZen(false);state.app=t.dataset.app;state.view=APP_CONFIG[state.app].nav[0];state.manual=true;render()});
/* Automatic product-tour scenes. Any direct click gives control to the viewer. */
const scenes=[['nervis','Overview'],['sirvis','Dashboard'],['sirvis','Benchmarks'],['ravis','Dashboard'],['ravis','Routes'],['clarvis','Workspace'],['nervis','Chat'],['nervis','Diagnostics']];let tourTimer;
function nextScene(){const s=scenes[state.scene++%scenes.length];state.app=s[0];state.view=s[1];render();setAvatarState('active')}
function runTour(){clearInterval(tourTimer);if(state.demo)tourTimer=setInterval(()=>{if(!state.manual)nextScene()},6500)}
$('#demoToggle').onclick=()=>{state.demo=!state.demo;state.manual=false;$('#demoToggle').textContent=state.demo?'Pause demo':'Resume demo';runTour()};$('#demoNext').onclick=()=>{state.manual=false;nextScene()};$('#demoReset').onclick=()=>{state.scene=0;state.manual=false;state.app='nervis';state.view='Overview';render()};render();runTour();
</script></body></html>
